name: 'Lean proof-integrity (axiom check)'
description: >
  Composite-action twin of .github/workflows/lean-axiom.yml's axiom job, for
  the matrix path (#17336): lean-build.yml's ci-matrix job calls this AFTER
  ./.github/actions/lean-build has built the lake in the same workspace, so
  the axiom pass rides the build's cache instead of rebuilding under a
  second cache key (the standalone workflow's cost). The check itself is the
  shared scripts/lean/axiom_check_step.py -- one copy of the rule for both
  callers, extracted verbatim from the workflow's heredoc.

  Opt-in: the matrix entry carries the key `axiom-target-modules` (absent =
  the caller passes '' = this action is never reached). '*' derives the
  module list at runtime (#10889) -- exactly what `lake build` compiles,
  FR-only by default (`_en` siblings excluded unless opted in).

inputs:
  project-path:
    description: 'Repo-relative path to the lake project root'
    required: true
  display-name:
    description: 'Human-readable project name (for job labels)'
    required: true
  target-modules:
    description: 'Comma-separated dotted module names, or "*" for runtime derivation (#10889)'
    required: true
  allow-axioms:
    description: 'Comma-separated axioms whitelisted beyond the standard set (propext, funext, Classical.choice, Quot.*)'
    required: false
    default: ''
  fail-on-sorry:
    description: 'true = transitive sorryAx fails the run; false = reported only'
    required: false
    default: 'true'
  include-i18n-siblings:
    description: 'When target-modules is "*", keep `_en` i18n siblings in the derivation'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # NOTE: no `working-directory:` and no `cd`, on purpose -- both roots are
    # derived from the environment inside the script (the #8712 defect: a
    # working-directory silently cancelled by a cd made the check run where no
    # lake exists). elan stays on PATH from the lean-build composite's
    # GITHUB_PATH export, and the lake is already built in this workspace.
    - name: Run axiom check (${{ inputs.display-name }})
      shell: bash
      env:
        MODULES: ${{ inputs.target-modules }}
        ALLOW: ${{ inputs.allow-axioms }}
        DISPLAY_NAME: ${{ inputs.display-name }}
        PROJECT_PATH: ${{ inputs.project-path }}
        FAIL_ON_SORRY: ${{ inputs.fail-on-sorry }}
        INCLUDE_I18N_SIBLINGS: ${{ inputs.include-i18n-siblings }}
      run: |
        set -eu
        python3 scripts/lean/axiom_check_step.py
