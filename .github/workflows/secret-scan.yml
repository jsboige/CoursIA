name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

# Pin the gitleaks BINARY version, and pin it ON OUR SIDE — not on a third party's.
# Two surfaces must agree:
#   1. pre-commit hook     -> .pre-commit-config.yaml `rev: vX.Y.Z`
#   2. CI workflow (this)  -> `$GITLEAKS_VERSION` env + explicit `docker pull`/`docker run`
# A version drift between the two surfaces is exactly the defect that #10139
# surfaced: hook (8.21.2) and CI (8.24.3) yielded different verdicts on the same
# tree. Measured on this repo, same files and same config, three binaries:
#     8.21.2 -> 0 findings   |   8.24.3 -> 2   |   8.30.1 -> 2
# See #10139.
#
# IMPORTANT: GitHub Actions does NOT expand env vars in `uses: docker://...:${X}`
# lines at any scope (not workflow-level, not job-level). The docker image MUST
# be pulled via a `run:` step where shell interpolation DOES expand env vars.
# That is why this workflow uses an explicit `docker pull` script and not a
# `uses: docker://...:${X}` line — verified: 2 CI cycles failed with
# `invalid reference format` before the swap to `run:`. See c.10139-L1.
#
# Why not the `gitleaks/gitleaks-action@v2` wrapper: the wrapper tag `@v2` is
# the GitHub Action version, not the underlying gitleaks binary version. The
# binary is selected by `GITLEAKS_VERSION` from the action's environment, with
# a hard-coded fallback (`"8.24.3"`, src/index.js) — an implicit pin owned by a
# third party and revisable by any `@v2` release without a commit here. This
# workflow removes the third-party pin entirely by invoking the docker image
# directly. Drift detector below asserts parity between hook and CI at runtime.

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Jambe auto-hebergee (#14283) : le trafic same-repo -- 32 runs le
  # 2026-09-02, premier consommateur GitHub-hosted du depot -- bascule sur le
  # pool Linux. Le pool n'a PAS de docker (ni binaire dans l'image, ni socket
  # montee : scripts/ci/docker/linux-runner/Dockerfile), donc le `docker run`
  # de l'ancienne forme y echouerait. La forme retenue est celle que le job
  # positive-controls (secret-scan-controls.yml depuis #25510) fait deja
  # tourner sur CE MEME pool depuis la
  # tranche 3c : binaire recupere depuis la release GitHub, epingle par
  # ${GITLEAKS_VERSION}. Le pin ne change pas de proprietaire -- meme version,
  # meme release, meme assertion de parite avec .pre-commit-config.yaml.
  # Garde anti-fork au niveau job + runs-on STATIQUE jusqu'au 2026-10-27 : une
  # expression levait DYNAMIC_RUNS_ON dans check_self_hosted_runner_policy.py.
  # Ce n'est plus vrai depuis #22461 : l'instrument enumere desormais une SECONDE
  # garde, la garde de debordement (meme-depot && vars.CI_OVERFLOW_LOCAL ==
  # 'true'), admise uniquement avec LINUX_RUNNER_LABELS. La forme posee ci-dessous
  # est exactement cette forme auditee ; toute autre expression reste refusee.
  gitleaks:
    name: Gitleaks secret scanner
    # Rapatrie sur l'offre GitHub le 2026-10-25 (#17397, consigne user : le CI local pallie
    # les limites de l'offre hebergee, il ne la remplace pas). Mesure : 3 jobs heberges en
    # cours pour un plafond d'environ 20, 42 jobs sur 42 en file sur coursia-linux.
    # 2026-10-27 (#22461, phase A du debordement ; tranche A2 de #22937, arbitrage
    # ai-01 c.6441695482) : forme hybride -- PR meme-depot ET
    # vars.CI_OVERFLOW_LOCAL == 'true' -> jambe Linux locale, sinon ubuntu-latest
    # (l'etat du 27/10). Le retour du 25/10 sur l'heberge suivait la consigne
    # « l'heberge d'abord » : la variable la respecte, on ne deborde que quand
    # l'heberge sature. A la mesure de 12:20Z ce workflow portait 26 runs en file
    # dans l'offre hebergee (donnee du mandat). Sur `push`, github.event.
    # pull_request est nul -> retombee hebergee, ce qui est l'etat voulu (un run
    # de push n'attend pas dans la file d'une PR). Bascule : `gh variable set
    # CI_OVERFLOW_LOCAL --body true|false --repo jsboige/CoursIA`.
    # La garde anti-fork ci-dessous est CONSERVEE : aucun code de fork ne change
    # de surface. Limite : runs-on se resout a la creation du job, les runs deja
    # en file ne bougent pas.
    # Retour arriere = variable a `false` ou supprimee : routage 100 % heberge,
    # sans toucher ce fichier ; la forme docker d'origine reste decrite ci-dessus
    # pour la jambe fork.
    # L'entree reste dans SELF_HOSTED_WORKFLOW_ALLOWLIST (elle y etait deja).
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository && vars.CI_OVERFLOW_LOCAL == 'true') && fromJSON('["self-hosted","coursia-ephemeral","coursia-linux"]') || 'ubuntu-latest' }}
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    # Borne de securite (incident du 15/10) : sur nos slots ephemeres, un run
    # fige sans borne tient un slot 6 h (defaut d'Actions) et le retire aux PR
    # gates ; 16 des 18 slots etaient occupes de cette facon le 15/10.
    # Mesure du 2026-10-27 (commit eae2eb24d1, #22953), faite sur la forme a
    # `fetch-depth: 0` : 20 runs verts heberges, mediane 1,8 min, max 16,4 min
    # -> borne a 30 min, la plus large des quatre jobs hybrides de cette PR.
    # Depuis #22799 le checkout de ce job est en `fetch-depth: 1` (gitleaks
    # detect --no-git ne lit que l'arbre de travail) : la duree sur cette
    # nouvelle forme n'a PAS ete re-mesuree. Cette borne reste ce qu'elle a
    # toujours ete -- une borne de securite contre le run fige qui tient un
    # slot 6 h, pas une prevision de duree.
    timeout-minutes: 30
    env:
      GITLEAKS_VERSION: 8.24.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1  # gitleaks detect --no-git : arbre de travail seul, l'historique n'est pas scanne

      - name: Fetch gitleaks binary (pinned)
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          if ! curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 "$url" -o /tmp/gitleaks.tgz; then
            echo "::error title=Gitleaks binary fetch failed::telechargement du binaire en echec (reseau/Releases) -- pas un finding de scan"
            exit 1
          fi
          mkdir -p /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tgz -C /tmp/gitleaks-bin
          echo "GITLEAKS_BIN=/tmp/gitleaks-bin/gitleaks" >> "$GITHUB_ENV"

      - name: Log gitleaks binary version (CI must equal pre-commit rev)
        # Ce pas est AUSSI le controle positif de la jambe auto-hebergee : un
        # binaire absent ou non executable fait echouer `$GITLEAKS_BIN version`
        # ICI, avant le scan. Sans lui, un outil manquant rendrait `0 finding`
        # -- indiscernable d'un corpus propre (cf #14294).
        run: |
          actual="$("$GITLEAKS_BIN" version)"
          echo "::notice title=Gitleaks binary version::$actual"
          case "$actual" in *"$GITLEAKS_VERSION"*) ;; *) echo "::error title=Gitleaks version drift::binaire '$actual' != pin ${GITLEAKS_VERSION}"; exit 1;; esac
          expected="$(grep -oE 'rev: v[0-9]+\.[0-9]+\.[0-9]+' .pre-commit-config.yaml | head -n1 | cut -d' ' -f2 | tr -d 'v')"
          # Un `expected` vide ne dit PAS que les pins divergent : il dit que
          # `.pre-commit-config.yaml` n'est pas dans l'arbre. Sur un slot
          # persistant, l'arbre de travail peut etre ampute -- des fichiers
          # committes absents du disque (volume `_work` epingle, #20174 /
          # #18312). Le message publie doit nommer cette cause-la : accuser une
          # derive de version envoie la lane modifier deux fichiers sains.
          if [ -z "${expected}" ]; then
            echo "::error title=Arbre de checkout incomplet::'.pre-commit-config.yaml' absent de l'arbre (pin non extrait) -- ce n'est PAS une derive de version. Voir #20174 / #18312."
            exit 1
          fi
          if [ "${GITLEAKS_VERSION}" != "${expected}" ]; then
            echo "::error title=Gitleaks version drift::CI pins ${GITLEAKS_VERSION} but .pre-commit-config.yaml pins v${expected}. Update both to the same value."
            exit 1
          fi

      - name: Gitleaks detect
        run: |
          "$GITLEAKS_BIN" detect \
            --source . \
            --config .gitleaks.toml \
            --verbose \
            --no-git \
            --redact \
            --exit-code 1

  # Jambe fork : les PRs des ~95 forks etudiants ne touchent JAMAIS un runner
  # auto-heberge. Elles gardent donc leur scan sur GitHub-hosted, sous la forme
  # docker d'origine (l'image y est disponible). Sans cette jambe, la garde
  # anti-fork ci-dessus ferait simplement DISPARAITRE le scan de secrets la ou
  # il sert le plus. Nom de check distinct : `Secret Scan` n'est pas un check
  # requis -- seul `PR gate` l'est, mesure le 2026-09-02 par
  # `gh pr checks <N> --required` -- donc ce dedoublement ne deverrouille ni ne
  # bloque rien.
  gitleaks-fork:
    name: Gitleaks secret scanner (fork)
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name != null && github.event.pull_request.head.repo.full_name != github.repository
    env:
      GITLEAKS_VERSION: 8.24.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1  # gitleaks detect --no-git : arbre de travail seul, l'historique n'est pas scanne

      - name: Log gitleaks binary version (CI must equal pre-commit rev)
        run: |
          echo "::notice title=Gitleaks binary version::$(docker run --rm zricethezav/gitleaks:v${GITLEAKS_VERSION} version)"
          expected="$(grep -oE 'rev: v[0-9]+\.[0-9]+\.[0-9]+' .pre-commit-config.yaml | head -n1 | cut -d' ' -f2 | tr -d 'v')"
          # Meme garde que la jambe auto-hebergee : un pin illisible est un arbre
          # incomplet, pas une derive (cf #20200).
          if [ -z "${expected}" ]; then
            echo "::error title=Arbre de checkout incomplet::'.pre-commit-config.yaml' absent de l'arbre (pin non extrait) -- ce n'est PAS une derive de version. Voir #20174 / #18312."
            exit 1
          fi
          if [ "${GITLEAKS_VERSION}" != "${expected}" ]; then
            echo "::error title=Gitleaks version drift::CI pins ${GITLEAKS_VERSION} but .pre-commit-config.yaml pins v${expected}. Update both to the same value."
            exit 1
          fi

      - name: Gitleaks (pinned docker image, pulled via script)
        run: |
          docker pull "zricethezav/gitleaks:v${GITLEAKS_VERSION}"
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            "zricethezav/gitleaks:v${GITLEAKS_VERSION}" \
            detect \
              --source . \
              --config .gitleaks.toml \
              --verbose \
              --no-git \
              --redact \
              --exit-code 1

  # Les deux controles de ce scanner -- `positive-controls` (#10143) et
  # `assert-egress` (#17276) -- vivent dans secret-scan-controls.yml depuis
  # #25510 (tranche T-B, 2026-11-12). Ils ne lisent que `.gitleaks.toml`, le pin
  # de `.pre-commit-config.yaml`, des `*.py` et une baseline : un filtre `paths:`
  # les y retire des PRs qui ne touchent aucune de ces entrees, alors que les
  # deux jobs ci-dessus doivent voir chaque PR. Chaque push sur `main` rejoue
  # les deux controles sans filtre.
