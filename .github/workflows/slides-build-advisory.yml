name: Slides Build Advisory

# The missing ORGAN that let 5 of 16 Slidev decks stay broken for months (#8807).
# Nothing in CI built the slides -- verified firsthand: `grep -rliE "slidev|slides/"
# .github/workflows/` returned 0 hits across 57 workflows. Each broken deck was
# caught only by a human running the build locally, which nobody did. This workflow
# makes a deck that does not construct VISIBLE on the PR that touches it.
#
# ADVISORY, never blocking (issue #8817 acceptance 5): the job ALWAYS exits 0 on a
# build failure. The actionable payload is the `slides-build-failed` LABEL, NEVER
# the green conclusion of the job (which is green by construction). A reviewer who
# reads only "exit 0" as "the slides build" has read the wrong signal -- the same
# trap that let a non-conforming PR through in #8797, and that #8816 codified for
# the exercises convention. The job prints its denominator precisely so this
# confusion is impossible.
#
# Per-PR scope (acceptance 1): builds ONLY the decks impacted by the PR -- either
# the deck whose directory changed, or ALL decks when shared slides infra changed
# (theme-ia101, package.json, package-lock -- a theme edit can break every deck).
#
# The three traps from #8807, named and guarded here:
#
#   1. SILENT-SKIP DENOMINATOR (#8807 trap 1). `slides/` has 16 deck dirs but
#      S4-trading-algorithmique carries THREE decks (deck-1/2/3.md) and NO
#      slides.md -- a `[ -f slides.md ]` filter skips it silently (15 OK lines
#      for 16 dirs, exactly what happened in #8807). The discovery here finds
#      `deck-*.md` as a fallback AND FAILS LOUDLY (exit 1, a META-FAILURE of the
#      gate itself, NOT advisory) if any tracked deck dir yields zero targets.
#      A gate that enumerates zero targets is green and mute (#8680, #8782, #8678).
#      The denominator is falsifiable in BOTH directions: a dir that does NOT
#      match the NN/SN convention but DOES carry a deck file is caught too
#      (renaming 01-introduction to intro-01 would otherwise shrink M silently),
#      and an EMPTY discovery (M=0, e.g. a mass rename) refuses to assert.
#
#   2. FAIL-FAST IS A SAMPLE, NOT AN INVENTORY (#8807 trap 2). On S3 and 06,
#      Rollup stopped at the markup crash BEFORE reaching asset resolution, so
#      the 147 broken image refs surfaced only once the markup was lifted. The
#      gate therefore builds EVERY impacted deck to completion -- the first error
#      raised does not certify it was the only one.
#
#   3. POSITIVE CONTROL AT CABLING (#8807 trap 3). A defect of one of the three
#      classes closed by #8807 (bare `images/` specifier, missing asset, `<div>`
#      crossing `::right::`), reintroduced in the fix PR, MUST lift the label.
#      That control is captured in the PR body, not asserted by the workflow.
#
# Tranche 2 #12817: the per-PR fork guard died with the pull_request trigger
# (false under schedule -> job SKIPPED, organ extinguished). The nocturne
# builds the decks impacted by the last-24h window of main; the label side is
# PR-only and skipped at night -- the nocturne payload is the build output.
#
# Promoting to a blocking gate is a separate decision, to revisit only once the
# advisory has run green-and-stable across enough slide PRs to trust it.

on:
  schedule:
    # Nocturnal sweep -- post-merge main verification.
    # Tranche 1 #12817 : sortir les advisory lourds de pull_request
    # (clone 2.22 Go par run). Stratification user 2026-08-23 :
    # "les jobs lourds devraient être payés une fois par fournée".
    - cron: '20 03 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: slides-build-advisory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slides-build-advisory:
    name: "Slidev build advisory (label, non-blocking)"
    # Routage #14283 tranche 4 (ai-01 2026-09-02) : balayage cron pur-Python.
    # Declencheur `schedule` uniquement -- il ne tourne que sur la branche par
    # defaut, donc aucun code de fork ne peut l'atteindre et aucune garde
    # same-repo n'est requise (cf en-tete de check_self_hosted_runner_policy.py).
    # Retour arriere = remettre `runs-on: ubuntu-latest` + retrait de l'allowlist.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          # Need base..head history for `git diff` of changed slides.
          fetch-depth: 0
          filter: blob:none

      # Runs BEFORE the Node setup, deliberately: the two defects it catches are
      # invisible to `slidev build`, so this step must survive an install failure.
      #
      # The orphan `::right::` is the reason this exists. Removing `layout:
      # two-cols` without removing the paired marker leaves it with no slot;
      # Slidev BUILDS GREEN and silently drops everything after it. A source grep
      # cannot see it either -- the text is still in the markdown. Measured on
      # #11912: `grep -c 'Jeu de dames'` returned 1 on the broken head exactly as
      # on the sound one. Only a render or a structural parser sees the loss.
      #
      # Advisory like the rest of this workflow: `|| true` keeps the step green,
      # the payload is the inline annotation on the PR diff. The denominator is
      # printed so a zero can never be read as "nothing to look at" -- the same
      # silent-skip trap named in this file's header.
      - name: Slidev structural defects (advisory annotations)
        run: |
          set -uo pipefail
          # Positive control first: a detector whose pattern broke reports
          # "nothing found", which is indistinguishable from a sound repo --
          # smaller and cleaner than the truth. Refuse to trust a zero we have
          # not earned.
          if ! python scripts/check_slidev_structure.py --selftest; then
            echo "::error::positive control FAILED -- the detector is not measuring anything"
            exit 1
          fi
          # `--github` makes the SCRIPT emit the annotations: it holds path and
          # line as separate values, so nothing downstream re-splits a formatted
          # string. A shell loop doing `${line%%:*}` looked correct and was not --
          # it truncates any path containing a colon (measured: `C:/Users/...`
          # became file `C`). The producer has the structured data; it renders it.
          python scripts/check_slidev_structure.py --all --github || true
          echo "structural scan done -- the count line above is the denominator"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache slides node_modules
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: slides/node_modules
          # Slidev install (~676 pkgs) dominates build time; cache it by lockfile
          # so a cache hit skips the multi-minute `npm ci` (issue #8817 grain note).
          key: slides-node_modules-${{ runner.os }}-${{ hashFiles('slides/package-lock.json') }}

      - name: Install Slidev deps
        working-directory: slides
        run: |
          if [ "${{ steps.cache-nm.outputs.cache-hit }}" = "true" ] && [ -d node_modules/@slidev ]; then
            echo "node_modules cache hit -- skipping install"
          else
            npm ci --no-audit --no-fund
          fi

      - name: Discover decks, build impacted, signal via label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without GH_REPO, `gh pr edit` / `gh label create` cannot infer the
          # target repo and fail silently (variation-tag-guard, post-#8765).
          GH_REPO: ${{ github.repository }}
          # '' under schedule/dispatch (no PR context) -> nocturne window below.
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          BASE: ${{ github.event.pull_request.base.sha || '' }}
          HEAD: ${{ github.event.pull_request.head.sha || '' }}
          LABEL: slides-build-failed
        run: |
          set -uo pipefail

          # ---- Nocturne window (#12817 tranche 2) ----
          # Under schedule/dispatch there is no PR: BASE is empty. Resolve the
          # last 24 h of main so the sweep builds the decks impacted by the
          # day's merged apport. Labels are PR-only and skipped at night.
          NOCTURNE=0
          if [ -z "${BASE:-}" ]; then
            NOCTURNE=1
            BASE=$(git rev-list -1 --before="24 hours ago" HEAD)
            [ -n "$BASE" ] || BASE=$(git rev-list --max-parents=0 HEAD | tail -1)
            HEAD=$(git rev-parse HEAD)
            PR_NUMBER=""
            echo "Nocturne window: $(git rev-parse --short "$BASE")..$(git rev-parse --short "$HEAD") (24 h of main)"
          fi

          # ---- Trap 1: discover ALL deck targets, fail loudly on silent skip. ----
          # Deck dirs follow the NN-name / SN-name convention (01-introduction,
          # S4-trading-algorithmique, ...). Infra dirs (_assets, _tools, analysis,
          # theme-ia101, themes, node_modules) do NOT match the pattern and are
          # skipped -- they are not decks and must not pollute the denominator.
          # Pattern (not an exclude list): a NEW infra dir does not trip a false
          # failure, but a conventionally-named deck dir that lost its slides.md
          # IS caught (zero target -> fail loudly). This is what makes the
          # denominator check non-tautological.
          TARGETS=()        # repo-relative deck files (slides/NN/.../*.md)
          N_DECK_DIRS=0
          ZERO_TARGET_DIRS=0

          for d in slides/*/; do
            [ -d "$d" ] || continue
            base="$(basename "$d")"
            if ! printf '%s' "$base" | grep -qE '^(S)?[0-9]'; then
              # SYMMETRIC of trap 1 (ai-01 #8821 review blocage 2): a dir that
              # does NOT match the convention but DOES carry a deck file is
              # invisible to discovery. Renaming 01-introduction to intro-01
              # would silently drop it from M -- 15 OK lines for 16 dirs, the
              # literal shape of the #8807 incident moved from file-test to
              # name-test. The denominator must be falsifiable in BOTH
              # directions, not just the "convention dir with no target" one.
              # Check existence per-pattern (ls over a non-matching glob passes
              # the literal and errors on it, masking a real slides.md).
              has_deck=0
              [ -f "${d}slides.md" ] && has_deck=1
              for deck in "${d}"deck-*.md; do [ -f "$deck" ] && has_deck=1; done
              if [ "$has_deck" -eq 1 ]; then
                echo "::error::'$d' carries a deck file (slides.md or deck-*.md) but does NOT match the NN/SN convention -- invisible to discovery (#8807 trap 1, symmetrized). Rename the directory to match the convention or move the deck into a convention dir."
                ZERO_TARGET_DIRS=$((ZERO_TARGET_DIRS + 1))
              fi
              continue   # infra dir -- not a deck
            fi
            N_DECK_DIRS=$((N_DECK_DIRS + 1))
            if [ -f "${d}slides.md" ]; then
              TARGETS+=("${d}slides.md")
            else
              # S4-trading-algorithmique pattern: 3 deck-*.md, no slides.md.
              found=0
              for deck in "${d}"deck-*.md; do
                [ -f "$deck" ] || continue
                TARGETS+=("$deck")
                found=1
              done
              if [ "$found" -eq 0 ]; then
                echo "::error::Deck dir '$d' matches the naming convention but has no slides.md and no deck-*.md -- silent-skip risk (#8807 trap 1). The gate refuses to assert what it cannot discover."
                ZERO_TARGET_DIRS=$((ZERO_TARGET_DIRS + 1))
              fi
            fi
          done

          echo "===== DENOMINATOR (discovery sanity) ====="
          echo "Deck dirs tracked (M): $N_DECK_DIRS"
          echo "Build targets discovered (N): ${#TARGETS[@]}"
          printf '  target: %s\n' "${TARGETS[@]}"

          # META-FAILURE (empty discovery, ai-01 #8821 review blocage 2): if
          # NOTHING matched the convention, the gate measures nothing and must
          # NOT print "valid" from an empty measure. A mass rename or a
          # convention change would empty N_DECK_DIRS silently -- the job would
          # otherwise emit "Discovery sanity above still validates the gate" from
          # a vacuous inventory (the #8807 defect one notch higher: there the
          # unmeasured item was one notebook, here it is the whole inventory).
          if [ "$N_DECK_DIRS" -eq 0 ] || [ "${#TARGETS[@]}" -eq 0 ]; then
            echo "::error::Discovery empty (M=$N_DECK_DIRS decks, N=${#TARGETS[@]} targets) -- the gate measures nothing. Refusing to assert validity from an empty measure (#8807, #8680)."
            exit 1
          fi

          # META-FAILURE: the gate itself is broken (incomplete discovery), NOT a
          # build failure. This is the one non-advisory exit -- a gate that
          # enumerates n-1 targets is green for the wrong reason (#8807 trap 1).
          if [ "$ZERO_TARGET_DIRS" -gt 0 ]; then
            echo "::error::$ZERO_TARGET_DIRS deck dir(s) yielded zero build targets -- discovery incomplete. Failing loudly rather than asserting a partial build."
            exit 1
          fi

          # ---- Filter to decks impacted by THIS PR (acceptance 1). ----
          # A deck is impacted if any file in its directory changed. PLUS: a change
          # to shared slides infra (theme / package manifests) impacts ALL decks.
          TOUCHED=()
          for t in "${TARGETS[@]}"; do
            dir="$(dirname "$t")"
            if git diff --name-only --diff-filter=d "$BASE...$HEAD" -- "$dir/" | grep -q .; then
              TOUCHED+=("$t")
            fi
          done
          # 3-point diff (#10403): merge-base...HEAD -- strictly this PR's apport.
          SHARED=$(git diff --name-only --diff-filter=d "$BASE...$HEAD" \
            -- 'slides/theme-ia101/' 'slides/package.json' 'slides/package-lock.json' \
            | head -1)
          if [ -n "$SHARED" ]; then
            echo "Shared slides infra changed ($SHARED) -- building ALL ${#TARGETS[@]} decks."
            TOUCHED=("${TARGETS[@]}")
          fi

          if [ "${#TOUCHED[@]}" -eq 0 ]; then
            if [ "$NOCTURNE" -eq 1 ]; then
              echo "No deck impacted by the last-24h window (slides/ changes were in _tools/analysis/etc.). Discovery sanity above still validates the gate."
            else
              echo "No deck impacted by this PR (slides/ changes were in _tools/analysis/etc.). Discovery sanity above still validates the gate."
            fi
            [ "$NOCTURNE" -eq 0 ] && gh pr edit "$PR_NUMBER" --remove-label "$LABEL" 2>/dev/null || true
            exit 0
          fi

          echo "===== BUILDING ${#TOUCHED[@]} impacted deck(s) ====="
          # Trap 2: build EACH impacted deck to completion; capture failures rather
          # than aborting at the first (a fail-fast error is a sample, not an
          # inventory -- #8807 trap 2). The job stays advisory (exit 0 on failure).
          FAILURES=0
          FAILED_LIST=""
          for t in "${TOUCHED[@]}"; do
            rel="${t#slides/}"
            echo "----- slidev build: $rel -----"
            if ( cd slides && npx slidev build "$rel" --out "dist-$(echo "$rel" | tr '/' '_')" ); then
              echo "OK: $rel"
            else
              echo "::warning::BUILD FAILED: $rel"
              FAILURES=$((FAILURES + 1))
              FAILED_LIST="${FAILED_LIST}\n  - $rel"
            fi
          done

          # ---- Label signaling (advisory: exit 0 regardless). ----
          if [ "$FAILURES" -gt 0 ]; then
            if [ "$NOCTURNE" -eq 1 ]; then
              echo "::warning::$FAILURES deck(s) impacted by the last-24h window failed to build. Failed:$FAILED_LIST"
            else
              echo "::notice::$FAILURES impacted deck(s) failed to build. See the '$LABEL' label. Failed:$FAILED_LIST"
            fi
            gh label create "$LABEL" \
              --description "A Slidev deck impacted by this PR does not construct (#8807)" \
              --color "D93F0B" --force 2>/dev/null || true
            [ "$NOCTURNE" -eq 0 ] && gh pr edit "$PR_NUMBER" --add-label "$LABEL" || true
          else
            echo "All ${#TOUCHED[@]} impacted deck(s) build cleanly."
            [ "$NOCTURNE" -eq 0 ] && gh pr edit "$PR_NUMBER" --remove-label "$LABEL" 2>/dev/null || true
          fi
          exit 0
