name: PR path-collision advisory

# Issues #13359 + #13615. An ADVISORY organ that renders visibility into OPEN
# pull requests sharing an identical file path -- the expensive
# double-delivery case (same notebook delivered twice) that
# check_lane_claim.py cannot see by construction (a lane never blocks itself;
# the claim lock only arbitrates across lanes), and that prose rule L898 asks
# every agent to guard from memory. Measured firsthand 2026-08-28 on
# #13296/#13339: the same notebook delivered twice, the worse one merged.
# #13615 measured three more pairs in one night (2026-08-30), one of them a
# same-lane ordering conflict no claim protocol could ever see.
#
# Trigger: pull_request opened/synchronize (#13615's delivery vehicle) +
# manual workflow_dispatch. The raw shared-path signal over-fired (137
# collisions on 133 open PRs, 2026-08-28) -- which is why the organ started
# MANUAL-ONLY. #13615 makes the hot trigger honest instead: stacked PR pairs
# (base = other's head) and generated artifacts (catalogue, twin_pairs.d/)
# are excluded outright, and every posted pair carries a tier (strong = also
# a common cited issue, weak = file only) plus the overlapping paths. Strong
# pairs additionally get the `pr-overlap` label.
#
# Trigger changed to `schedule` (#13097 remedy A, measured 2026-08-31). The
# pull_request trigger + a FIXED concurrency group + cancel-in-progress
# extinguished the organ exactly when it was most needed: over 228 runs
# (08-30 12:09Z -> 08-31 19:21Z) it produced 176 `cancelled` for 50 `success`,
# and during the fleet peak (09Z-16Z on 08-31) 102 runs yielded 2 verdicts --
# 83 consecutive runs across six hours yielded ZERO. Largest gap between two
# verdicts: 428 min. A completed scan takes ~2.9 min median while the 10Z hour
# fired one run every ~2 min: arrivals outran service, so every run died before
# finishing, and a cancelled run posts no check-run (#13097's own mechanism).
#
# The detector needs NO PR context -- it reads open PRs through `gh pr list`
# (whole-pool, idempotent; its only env dependency is GITHUB_REPOSITORY). So a
# schedule serves it fully, removes ~228 runs/31h of PR fan-out from the
# famished hosted pool, and lets each scan run to completion. The concurrency
# group stays FIXED (one scan at a time is the intent) but no longer cancels
# what is in flight: with cancel-in-progress false, the running scan finishes
# and a burst collapses into at most one pending run, which is the behaviour
# the group was always meant to provide.
#
# The organ NEVER blocks: the script always exits 0 and this job has no
# merge/status gate.

on:
  # Off-round minutes: the top of the hour is when every cron in the account
  # fires at once, which is the queue this organ must stop competing with.
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List collisions on stdout, post nothing'
        required: false
        type: boolean
        default: true
      same_issue_only:
        description: 'Post only strong-tier collisions (common cited issue)'
        required: false
        type: boolean
        default: false

concurrency:
  group: pr-path-collision-advisory
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write  # gh label create (pr-overlap), #13615

jobs:
  advisory:
    name: List open-PR path collisions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Detect collisions and (optionally) post advisory comments
        env:
          GH_TOKEN: ${{ github.token }}
          # pull_request events carry no dispatch inputs: post (the tiering +
          # exclusions of #13615 are what make hot posting honest). Manual
          # dispatch keeps its explicit inputs, dry-run by default.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
          SAME_ISSUE_ONLY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.same_issue_only || 'false' }}
        run: |
          set -uo pipefail
          ARGS=""
          [ "$DRY_RUN" = "true" ] && ARGS="$ARGS --dry-run"
          [ "$SAME_ISSUE_ONLY" = "true" ] && ARGS="$ARGS --same-issue-only"
          python scripts/check_pr_path_collisions.py --self-test
          python scripts/check_pr_path_collisions.py $ARGS
