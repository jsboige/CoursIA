name: Runner co-residence advisory

# Organe de MESURE de la co-residence du pool self-hosted (#15574).
#
# POURQUOI CE WORKFLOW EXISTE
# ---------------------------
# Un test CPU dont le temps varie d'un facteur 3-4 selon le runner qui le
# prend, a code constant, ne mesure plus le code (#15574). Les distributions
# par label et par runner localisent une saturation ; elles ne revelent pas
# « combien de runners partagent un hote physique, ni son plafond de
# concurrence » (docs/ci/self-hosted-runners.md). Ce sont les deux nombres qui
# manquent pour trancher une sur-souscription, et ils sont mesurables --
# `scripts/ci/measure_runner_demand.py` les rend par deux blocs :
#
#   - `co_residence` (DYNAMIQUE) : par job, le pic et la moyenne du nombre de
#     jobs qui tournaient sur le meme hote, croises avec sa duree.
#   - `runners_inventory` (STATIQUE) : les slots enregistres par hote.
#
# POURQUOI UN RUNNER DEDIE ET PAS UNE COMMANDE LOCALE
# ---------------------------------------------------
# La collecte coute ~1 appel API par run (les jobs) plus la pagination. Un
# poste de travail epuise son quota REST bien avant de couvrir une fenetre
# utile -- mesure du 2026-09-21 : quota epuise avant la fin d'une fenetre d'une
# heure, l'instrument rendant alors `BROKEN INSTRUMENT` (exit 2) plutot qu'un
# zero propre. Le jeton du workflow a son propre quota, et l'organe devient
# reproductible par quiconque, sans dependre du poste d'un agent.
#
# Advisory PAR CONSTRUCTION : schedule + workflow_dispatch seulement, jamais
# pull_request ni push -- un run rouge ne peut donc jamais bloquer une PR, et
# le nom porte « advisory ». Le job tourne sur `ubuntu-latest` (jamais
# self-hosted : l'observateur ne doit pas consommer ce qu'il observe).
#
# `--runners` exige `administration: read`. Sans le secret RUNNERS_READ_PAT,
# l'inventaire sort `unavailable` AVEC sa raison -- jamais un parc vide, qui
# serait indiscernable d'un refus de lecture (meme discipline que
# check_runner_starvation.py, #13378).
#
# FENETRE : 1 h par defaut. Le jeton de workflow plafonne a 1000 requetes par
# heure et par depot ; la constante de conception etait « ~60-80 runs par
# heure, soit ~500 appels pour 6 h ». Ce rythme a ete remesure depuis :
# 1 433 runs sur 6 h le 2026-09-11 (~240/h), puis 781 runs sur une heure le
# 2026-09-23 (~780/h). A ce rythme une fenetre de 6 h exige ~4 700 appels,
# au-dela du plafond : elle rend `BROKEN INSTRUMENT` (exit 2), pas une mesure.
# 1 h est le maximum qui tient sous le plafond ; elargir demande de remesurer
# le rythme du depot d'abord (docs/ci/self-hosted-runners.md).

on:
  # Mardi 04:20 UTC : apres le slow-lane (02:30) et hors du pic de push
  # europeen. Minute off-:00 et hors des offsets de sweep (13, 43).
  schedule:
    - cron: '20 4 * * 2'
  workflow_dispatch:
    inputs:
      hours:
        description: "Taille de la fenetre mesuree, en heures (1 = maximum qui tient sous le plafond de 1000 requetes/h au rythme mesure)"
        required: false
        default: "1"
      runner_inventory:
        description: "Collecter aussi l'inventaire des runners (exige le PAT)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: runner-coresidence-advisory
  cancel-in-progress: false

jobs:
  coresidence:
    name: Runner co-residence measurement
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Measure co-residence
        id: measure
        env:
          # Le PAT read-only (Administration:read) quand il existe ; sinon le
          # jeton du workflow, qui fera rendre `unavailable` a l'inventaire au
          # lieu de le fabriquer.
          GH_TOKEN: ${{ secrets.RUNNERS_READ_PAT || github.token }}
          HOURS: ${{ inputs.hours || '1' }}
          WANT_INVENTORY: ${{ inputs.runner_inventory || 'true' }}
        run: |
          set -uo pipefail
          python - > /tmp/window.env <<'PY'
          import datetime as d
          import os
          now = d.datetime.now(d.timezone.utc)
          hours = int(os.environ.get("HOURS", "1"))
          print("SINCE=" + (now - d.timedelta(hours=hours)).strftime("%Y-%m-%dT%H:%M:%SZ"))
          print("UNTIL=" + now.strftime("%Y-%m-%dT%H:%M:%SZ"))
          PY
          . /tmp/window.env
          echo "fenetre : ${SINCE} -> ${UNTIL}"
          ARGS=(--repo "$GITHUB_REPOSITORY" --since "$SINCE" --until "$UNTIL" --output /tmp/coresidence.json)
          if [ "${WANT_INVENTORY}" = "true" ]; then
            ARGS+=(--runners)
          fi
          set +e
          python scripts/ci/measure_runner_demand.py "${ARGS[@]}"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Publish verdict
        if: always()
        env:
          EXIT_CODE: "${{ steps.measure.outputs.exit_code }}"
        run: |
          if [ ! -s /tmp/coresidence.json ]; then
            echo "::warning title=Runner co-residence (instrument casse)::La mesure n'a pas abouti (exit=${EXIT_CODE}). C'est un verdict sur l'instrument ou le quota, jamais un parc sans concurrence -- ne pas lire l'absence de sortie comme un zero."
            exit 0
          fi
          python - <<'PY'
          import json, pathlib
          raw = json.loads(pathlib.Path("/tmp/coresidence.json").read_text(encoding="utf-8"))
          a = raw.get("analysis", {})
          summary = a.get("co_residence", {}).get("summary", {})
          solo = summary.get("solo_runtime_minutes", {})
          shared = summary.get("shared_runtime_minutes", {})
          ratio = summary.get("shared_over_solo_runtime_ratio", {})
          inv = a.get("runners_inventory", {})
          window = a.get("window", {})
          lines = [
              f"fenetre : {window.get('since')} -> {window.get('until')} ({window.get('hours')} h)",
              f"jobs places : {summary.get('jobs_placed')} | non attribues : {summary.get('jobs_unplaced')}",
              f"jobs seuls : {summary.get('solo_jobs')} | en concurrence : {summary.get('shared_jobs')}",
              f"p50 seul : {solo.get('p50')} min | p50 partage : {shared.get('p50')} min",
              f"queue (p90 / max) -- seul : {solo.get('p90')} / {solo.get('max')} min"
              f" | partage : {shared.get('p90')} / {shared.get('max')} min",
              f"rapport partage/seul -- p50 : {ratio.get('p50')} | p90 : {ratio.get('p90')} | max : {ratio.get('max')}"
              " (lire les effectifs ci-dessus : un quantile de queue sur une population mince n'est pas une mesure)",
              f"hotes observes : {summary.get('hosts')}",
              f"inventaire runners : {inv.get('availability')}"
              + (f" ({inv.get('total_runners')} runners)" if inv.get("availability") == "measured" else f" -- {inv.get('detail')}"),
          ]
          for host in a.get("co_residence", {}).get("hosts", [])[:12]:
              lines.append(
                  f"  {host['host']}: {host['slots_observed']} slot(s), {host['jobs']} jobs,"
                  f" pic {host['max_concurrency_observed']}, moyenne {host['mean_concurrency_overall']}"
              )
          body = "\n".join(lines)
          print(body)
          print("::notice title=Runner co-residence (%s -> %s)::%s" % (
              window.get("since"), window.get("until"), body.replace("\n", " | ")))
          PY
