name: Site links post-deploy (advisory)

# Garde post-deploiement des liens du site publie (#21628, fille de l'EPIC
# #10921). Les gardes de liens du depot (HTML_404, ipynb_links, #18970)
# verifient le contenu SOURCE -- ils ne testent pas le site DEPLOYE. Le
# rendu Quarto transforme les chemins (.md -> .html, globs, freeze) : une
# regression de navigation n'est visible qu'apres publication.
#
# Baseline mesuree le 2026-10-20 (lane myia-po-2028:CoursIA, #10921
# c.6296125400) : 17/17 liens critiques en HTTP 200 sur les 3 pages
# critiques ; l'extraction dynamique en couvre 36.
#
# Advisory PAR CONSTRUCTION : workflow_run + workflow_dispatch seulement --
# un run rouge ne cree aucun check-run sur une PR et ne peut jamais la
# bloquer. Il ne teste QUE la resolution des liens : le rendu lui-meme
# reste l'affaire de l'audit visuel Playwright de #10921 (lanes CoursIA-2).
#
# Pourquoi ubuntu-latest : cet observateur surveille le site PUBLIC heberge
# par GitHub -- il doit survivre a une panne du parc self-hosted (lecon
# linux-runner-starvation-advisory : un observateur qui tourne sur ce qu'il
# observe meurt avec lui).

on:
  workflow_run:
    workflows: ["Quarto Pages Deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read   # checkout du script

concurrency:
  group: site-links-post-deploy
  cancel-in-progress: true   # un nouveau deploy remplace le check precedent

jobs:
  check:
    name: "Check published site links"
    # Deploy reussi seulement : tester un ancien site apres un deploy
    # echoue produirait un verdict qui ne parle pas de la sortie reelle.
    # Et DEPLOIEMENT seulement (P4 #25510, fournee 1) : le declencheur
    # `workflow_run` tire sur CHAQUE completion de « Quarto Pages Deploy »,
    # jambes PR comprises -- qui ne deploient RIEN (le job `deploy` est
    # push-only). Mesure du 2026-11-14 sur 24 h : 300 runs, dont 105 echecs,
    # tous tires par des completions qui n'avaient pas publie ; le site sonde
    # etait celui du dernier deploy, pas celui de la sortie. Un vrai
    # deploiement = jambe push (le `workflow_dispatch` manuel reste admis :
    # re-mesure volontaire du site publie).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: scripts/ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check published site links
        run: |
          python scripts/ci/check_site_links.py --json

      - name: Check the published JupyterLite lot
        # Pli 2.2 de l'Epic #27543 : le lot de carnets Python publie sous
        # /jupyterlite/ doit repondre -- chaque carnet du manifeste, dans
        # ses deux formes (fichier brut et page JupyterLite).
        # Un manifeste absent = lot non deploye : ce n'est pas un lien
        # casse, le garde le dit et sort en vert (le job de construction du
        # site, lui, a echoue -- c'est la qu'il faut regarder).
        run: |
          python scripts/ci/check_jupyterlite_lot.py --json

      - name: Summary on failure
        if: failure()
        run: |
          echo "::error::Garde des liens du site publie en echec. Deux causes possibles (voir la sortie de l'etape precedente) : un lien interne ne resout pas (rc 1, lignes BROKEN), ou l'instrument n'a pas pu sonder (rc 2, lignes INSTRUMENT — timeout/DNS/reseau en cours de sonde, ou troncature max_links : verdict incomplet). Une erreur reseau n'est pas un lien casse. Ce garde est advisory : il ne bloque aucune PR."