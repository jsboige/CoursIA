name: Review coverage advisory

# The missing ORGAN for issue #11232: a PR >threshold with no review (bot or
# human) reads green on every visible signal -- gh pr checks 0 failures,
# 0 pending, mergeable: MERGEABLE, reviews[] empty -- yet the coverage hole
# is the largest defect (measured on the Lean track: #11132 1041 LOC and
# #11210 883 LOC had NO review at all). The signal is the absence, not the
# content.
#
# This scheduled sweep labels OPEN non-draft PRs (base=main) whose
# additions exceed the threshold and whose reviews[] is empty, and removes
# the label when a review arrives (or the diff shrinks below the threshold).
# The label is a current-state flag, not a sticky one.
#
# ADVISORY, never blocking (#11232 "il ne peut pas bloquer, c'est
# précisément l'absence qui est le défaut"):
#   - The job ALWAYS exits 0. The actionable payload is the LABEL, NEVER
#     the green conclusion.
#   - Draft PRs and PRs targeting a non-main base are excluded by design.
#   - Threshold is a CLI arg (default 300); tuned in the cron without a
#     code change. Rationale + history: docs/reference/review-coverage-threshold.md.

on:
  schedule:
    # Daily, off-:00 minute (anti-stampede). 06:13 UTC.
    - cron: '13 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log only, apply no labels/comments'
        required: false
        type: boolean
        default: true
      threshold:
        description: 'Additions threshold (default 300)'
        required: false
        type: number
        default: 300

permissions:
  # Labels sur PR (gh pr edit) = pull-requests: write ; commentaires et creation
  # de labels (gh pr comment / gh label create) = issues: write. Meme set que
  # pr-gate-missing-advisory.yml / lane-claim-guard.yml / variation-tag-guard.yml.
  pull-requests: write
  issues: write

concurrency:
  group: review-coverage-advisory
  cancel-in-progress: false

jobs:
  sweep:
    name: "Flag large PRs with no review (advisory)"
    # Routage #14283 tranche 4 (ai-01 2026-09-02) : balayage cron pur-Python.
    # Declencheur `schedule` uniquement -- il ne tourne que sur la branche par
    # defaut, donc aucun code de fork ne peut l'atteindre et aucune garde
    # same-repo n'est requise (cf en-tete de check_self_hosted_runner_policy.py).
    # Retour arriere = remettre `runs-on: ubuntu-latest` + retrait de l'allowlist.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install gh (system)
        run: |
          if ! command -v gh >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq gh
          fi
          gh --version

      - name: Run sweep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `inputs.*` n'existe que sur la jambe workflow_dispatch. Sur la jambe
          # `schedule:` il s'expanse en CHAINE VIDE, et `--threshold ""` fait
          # sortir argparse en erreur (`invalid int value: ''`, exit 2) AVANT
          # tout balayage. Mesure du 2026-08-28 : 0 succes sur les 60 derniers
          # runs -- l'organe livre pour #11232 n'a jamais balaye une seule PR,
          # et #11232 a ete fermee dessus le 2026-08-18.
          #
          # On lit les inputs par env et on OMET le drapeau quand il est vide,
          # pour retomber sur le defaut du script (THRESHOLD_DEFAULT=300).
          IN_THRESHOLD: ${{ inputs.threshold }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eo pipefail
          ARGS=()
          if [ "${IN_DRY_RUN:-}" = "true" ]; then ARGS+=(--dry-run); fi
          if [ -n "${IN_THRESHOLD:-}" ]; then ARGS+=(--threshold "$IN_THRESHOLD"); fi
          echo "args: ${ARGS[*]:-(aucun, defauts du script)}"
          python scripts/review_coverage.py "${ARGS[@]}" --label "large-pr-no-review"             | tee "$RUNNER_TEMP/sweep.json"
          # Controle positif porte sur le BALAYAGE, jamais sur le parsing.
          # Reserve Hermes sur #13370 : un `--help >/dev/null` sort 0 meme si le
          # script est casse en aval -- il ne couvre que argparse, or c'est
          # exactement un organe vert-sans-balayage qui a coute #11232. Le script
          # sort TOUJOURS 0 (advisory) et n'imprime son payload qu'APRES un
          # balayage effectif : l'assertion porte donc sur le payload. Cette
          # etape a le droit de rougir -- c'est ainsi que la panne de l'organe
          # devient visible au lieu de se lire verte.
          python scripts/ci/assert_sweep_payload.py "$RUNNER_TEMP/sweep.json"
