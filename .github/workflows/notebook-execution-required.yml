name: Notebook Execution Required

# H.7 P3 — Block merge if notebooks lack execution evidence.
# Validates that every modified .ipynb in a PR has:
#   1. execution_count != null on all code cells (H.3)
#   2. Zero cells with output_type: error (H.1)
#   3. No banned patterns: raise NotImplementedError, assert False, 1/0 (C.1)
#
# Non-Python kernels (.NET, Lean, WSL) are checked for C.1 and error outputs
# but execution_count is advisory only (cannot Papermill-execute in CI yet).
# Full Papermill execution for the SOBER golden-set subset is the
# golden-set-execute job below (H.7 P3, axe A #4208 / #4209). A full
# Docker runner covering every notebook kernel remains future work (H.7 P4).

on:
  pull_request:
    types: [opened, synchronize, edited, reopened]
    paths:
      - '**.ipynb'
      # Golden-set certifie sa propre reproductibilite quand le manifeste /
      # le lockfile / le workflow changent (axe A #4208, #4209).
      - 'scripts/notebook_tools/golden_set.yml'
      - 'scripts/notebook_tools/golden_set.lock.txt'
      - 'scripts/notebook_tools/notebook_tools.py'
      # La cle de verdict (#22468) couvre l'executeur et le manifeste : un
      # changement de l'un ou de l'autre doit re-etablir le verdict.
      - 'scripts/ci/golden_set_verdict_key.py'
      - '.github/workflows/notebook-execution-required.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/notebook_tools/golden_set.yml'
      - 'scripts/notebook_tools/golden_set.lock.txt'
      # `main` est le producteur du cache de verdict : c'est depuis lui que
      # les PRs restaurent. Ses entrees doivent donc suivre les memes entrees
      # que la cle, sinon un changement d'executeur sur `main` laisserait un
      # verdict perime disponible pour toutes les PRs.
      - 'scripts/notebook_tools/notebook_tools.py'
      - 'scripts/ci/golden_set_verdict_key.py'
      - '.github/workflows/notebook-execution-required.yml'
  workflow_dispatch:
    inputs:
      notebook_paths:
        description: 'Space-separated notebook paths to validate'
        required: false
        default: ''

permissions:
  contents: read
  # PR comments are posted via the *issues* API (github.rest.issues.*),
  # so the summary steps need issues:write, not just pull-requests:write.
  # Without it, createComment/updateComment 403 "Resource not accessible
  # by integration" — which silently killed the golden-set gate (see below).
  issues: write
  pull-requests: write

concurrency:
  group: notebook-execution-required-${{ github.ref }}-${{ github.event.action == 'edited' && github.event.changes.base == null && 'meta-edit' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    name: Detect notebook changes
    # Routage #14283 tranche 3c (ai-01 2026-09-02) : jambe Linux auto-hebergee.
    # Garde anti-fork au niveau job + runs-on sous la FORME HYBRIDE AUDITEE
    # (une expression non auditee leverait DYNAMIC_RUNS_ON dans
    # check_self_hosted_runner_policy.py).
    # Offre GitHub d'abord (#17397, consigne user du 2026-10-25) : le CI local pallie ses limites. Retour = remettre le label.
    # 2026-10-27 (#22937 vague 2, phase A) : forme hybride de debordement --
    # PR meme-depot ET vars.CI_OVERFLOW_LOCAL == 'true' -> jambe Linux locale ;
    # tout le reste (variable absente ou fausse, forks, push/schedule/
    # dispatch) retombe sur ubuntu-latest (l'etat du 27/10). Bascule :
    # `gh variable set CI_OVERFLOW_LOCAL --body true|false --repo jsboige/CoursIA`.
    # Retour arriere = variable a `false` ou supprimee : routage 100 %
    # heberge, sans toucher ce fichier. Limite : runs-on se resout a la
    # creation du job, les runs deja en file ne bougent pas.
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository && vars.CI_OVERFLOW_LOCAL == 'true') && fromJSON('["self-hosted","coursia-ephemeral","coursia-linux"]') || 'ubuntu-latest' }}
    if: (github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository) && (github.event.action != 'edited' || github.event.changes.base != null)
    # Borne de duree (#23016, review 5677732011) : sans `timeout-minutes`, un
    # job herite de 360 min et peut figer un slot ephemere du parc local --
    # 16 slots sur 18 ont ete tenus pendant des heures le 15/10. La borne vaut
    # ~3x la duree mesuree (0-1 min sur les 8 derniers succes), plus la marge
    # d'un clone froid.
    # 2026-11-02 (#22937) : cette marge « clone froid » etait sous-estimee.
    # La duree de 0-1 min etait mesuree sur le parc local (clone chaud) ; sur
    # le repli ubuntu-latest, le checkout fetch-depth: 0 du depot de 14 911
    # fichiers coute ~5 min a lui seul (mesure voisine : 286 s sur 300 dans
    # notebook-kernel-drift-guard, run 41378044015) : 6 cancellations / 30
    # derniers runs de ce workflow. 15 min couvre le clone froid heberge.
    timeout-minutes: 15
    outputs:
      notebooks: ${{ steps.detect.outputs.notebooks }}
      has_notebooks: ${{ steps.detect.outputs.has_notebooks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Detect changed notebooks
        id: detect
        run: |
          if [ -n "${{ github.event.inputs.notebook_paths }}" ]; then
            # Manual dispatch with specific paths
            NOTEBOOKS="${{ github.event.inputs.notebook_paths }}"
          else
            # PR: diff against base
            NOTEBOOKS=$(git diff --name-only --diff-filter=ACM \
              origin/${{ github.base_ref }} HEAD -- '*.ipynb' || true)
          fi

          # Filter out checkpoints, archives, _output
          NOTEBOOKS=$(echo "$NOTEBOOKS" | grep -v '/.ipynb_checkpoints/' \
            | grep -v '/archive/' | grep -v '/_output/' | grep -v '/research/' \
            || true)

          # grep -c prints "0" AND exits 1 on no-match; "|| echo 0" would
          # then append a second "0", producing an invalid $GITHUB_OUTPUT
          # line. "|| true" keeps grep's own "0" and just swallows the exit.
          COUNT=$(echo "$NOTEBOOKS" | grep -c '\.ipynb$' || true)
          echo "notebooks<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTEBOOKS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "has_notebooks=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Detected $COUNT notebook(s) changed"

  validate-static:
    name: Static validation (H.1/H.3/C.1)
    # Routage #14283 tranche 3c (ai-01 2026-09-02) : jambe Linux auto-hebergee.
    # Garde anti-fork au niveau job + runs-on sous la FORME HYBRIDE AUDITEE
    # (une expression non auditee leverait DYNAMIC_RUNS_ON dans
    # check_self_hosted_runner_policy.py).
    # Offre GitHub d'abord (#17397, consigne user du 2026-10-25) : le CI local pallie ses limites. Retour = remettre le label.
    # 2026-10-27 (#22937 vague 2, phase A) : forme hybride de debordement --
    # PR meme-depot ET vars.CI_OVERFLOW_LOCAL == 'true' -> jambe Linux locale ;
    # tout le reste (variable absente ou fausse, forks, push/schedule/
    # dispatch) retombe sur ubuntu-latest (l'etat du 27/10). Bascule :
    # `gh variable set CI_OVERFLOW_LOCAL --body true|false --repo jsboige/CoursIA`.
    # Retour arriere = variable a `false` ou supprimee : routage 100 %
    # heberge, sans toucher ce fichier. Limite : runs-on se resout a la
    # creation du job, les runs deja en file ne bougent pas.
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository && vars.CI_OVERFLOW_LOCAL == 'true') && fromJSON('["self-hosted","coursia-ephemeral","coursia-linux"]') || 'ubuntu-latest' }}
    needs: detect-changes
    if: ((github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository) && needs.detect-changes.outputs.has_notebooks > 0) && (github.event.action != 'edited' || github.event.changes.base != null)
    # Borne de duree (#23016, review 5677732011) : sans `timeout-minutes`, un
    # job herite de 360 min et peut figer un slot ephemere du parc local --
    # 16 slots sur 18 ont ete tenus pendant des heures le 15/10. La borne vaut
    # ~3x la duree mesuree (1 min sur les 8 derniers succes), plus la marge
    # d'un clone froid.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install nbformat

      - name: Validate notebooks
        # #11822 second-defaut: `> /tmp/...` + `cat` swallows the failure
        # detail (the validator's own `::error::` lines + per-notebook
        # reasons). The CI reader sees a generic "KeyError: 'passed'"
        # from the JSON-load step when the validator exits 1, with no
        # indication of *which* notebook failed or *why*. `tee` keeps
        # stdout visible while persisting the JSON, and `set +e` +
        # explicit exit-code capture ensures the validator's own exit
        # code drives the gate.
        run: |
          set +e
          python scripts/notebook_tools/validate_pr_notebooks.py \
            origin/${{ github.base_ref }} --json 2>&1 | tee /tmp/validation_results.json
          VALIDATOR_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$VALIDATOR_EXIT" -ne 0 ]; then
            echo ""
            echo "::error::Notebook validation failed (exit $VALIDATOR_EXIT). See output above."
            echo "Fix: re-execute notebooks locally and commit with outputs."
            echo "  python scripts/notebook_tools/notebook_tools.py execute <path>"
            echo ""
            echo "Validator JSON output (last 60 lines):"
            tail -60 /tmp/validation_results.json || true
            exit 1
          fi

          PASSED=$(python -c "import json; print(json.load(open('/tmp/validation_results.json'))['passed'])")
          if [ "$PASSED" != "True" ]; then
            echo ""
            echo "::error::Notebook validation reported passed=False despite exit 0. See output above."
            exit 1
          fi
          echo "All notebooks passed static validation."

      - name: Post validation summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const results = JSON.parse(fs.readFileSync('/tmp/validation_results.json', 'utf8'));
              const total = results.total_notebooks;
              const cells = results.total_code_cells;
              const failed = results.failed_count;
              const status = results.passed ? 'PASS' : 'FAIL';

              let body = `## Notebook PR Validation: ${status}\n\n`;
              body += `- **Notebooks checked**: ${total}\n`;
              body += `- **Code cells validated**: ${cells}\n`;
              body += `- **Result**: ${failed > 0 ? failed + ' notebook(s) with violations' : 'All passed'}\n\n`;
              body += `Checks: H.1 (no errors), H.3 (execution_count), C.1 (no banned patterns)\n`;
              body += `Non-Python kernels (.NET/Lean): C.1 + errors only (execution_count advisory)\n`;
              body += `QuantConnect notebooks: C.1 + errors only (require QC Cloud for execution)\n\n`;

              if (!results.passed) {
                body += `### Violations\n\n`;
                for (const nb of results.notebooks) {
                  if (!nb.passed) {
                    body += `**${nb.path}** (${nb.total_code} cells, ${nb.kernel})\n`;
                    for (const err of nb.errors) {
                      body += `- ${err}\n`;
                    }
                    body += `\n`;
                  }
                }
                body += `\n### How to fix\n\n`;
                body += `\`\`\`bash\n`;
                body += `# Re-execute the notebook\n`;
                body += `python scripts/notebook_tools/notebook_tools.py execute <path>\n`;
                body += `\`\`\`\n`;
              }

              // Find existing comment or create new
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const botComment = comments.find(c =>
                c.user.type === 'Bot' && c.body.includes('Notebook PR Validation:')
              );

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body,
                });
              }
            } catch (e) {
              console.log('Could not post validation summary:', e.message);
            }

  # Golden-set execution (H.7 P3, axe A #4208 / #4209 PR 2/2).
  # Executes the pinned, sober golden-set end-to-end via Papermill on a plain
  # Ubuntu runner (no Docker / no GPU / no cloud). This is the highest-trust
  # CI lever: it proves the golden-set notebooks actually produce their stated
  # outputs, not just that they are structurally valid (validate-static).
  # A broken notebook makes this job RED, then GREEN once repaired.
  golden-set-execute:
    name: Golden-set execution (H.7 P3)
    # Routage #14283 fin de chantier (ai-01 dispatch 2026-09-02, item 1) :
    # dernier job trivialement migrable — setup-python (toolcache monte) et
    # github-script (node embarque du runner) sont servis par l'image.
    # Garde anti-fork au niveau job + runs-on STATIQUE (une expression leverait
    # DYNAMIC_RUNS_ON dans check_self_hosted_runner_policy.py).
    # Retour arriere = remettre `runs-on: ubuntu-latest` + retrait de l'allowlist.
    # Offre GitHub d'abord (#17397, consigne user du 2026-10-25) : le CI local pallie ses limites. Retour = remettre le label.
    runs-on: ubuntu-latest
    if: (github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository) && (github.event.action != 'edited' || github.event.changes.base != null)
    # Independent of notebook-change detection: the golden-set is a FIXED
    # certified core, re-executed whenever the manifest/lockfile/workflow
    # change (PR + main push) or on manual dispatch. The trigger paths above
    # already gate this job's execution; the if: only carries the fork guard.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        # Pas de `cache: pip` ici (#19658, piste 2 "bourrer moins le cache").
        # Mesure du 2026-10-26 sur les runs golden-set : le toolcache du runner
        # porte deja toutes les dependances epinglees du lockfile
        # (`Requirement already satisfied` pour chacune des lignes du
        # lockfile), donc `pip` ne telecharge rien et son cache reste vide
        # (40 Ko). Le cache n'a donc rien a cacher -- mais il ecrit quand meme
        # une copie par PR dans le store Actions (101 copies en 24 h, dont 58
        # de 66 Mo pour une version de python perimee), sur un store deja a
        # 9,9 Go sur 10 Go. Le store ne sert que ce qu'il a : pendant ce
        # temps, les caches `lake-*` se font evicter.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Reutilisation du verdict (#22468, tranche 1 ; levier 6 de #22461).
      # Mesure de #22468 : 19 runs sur 21 rejouaient la suite alors qu'aucune
      # entree du verdict n'avait bouge. La cle couvre le manifeste, le
      # lockfile, l'executeur, le workflow appelant, la version de Python et le
      # contenu octet pour octet de chaque carnet. Un changement du contrat
      # du job invalide donc le verdict reutilisable.
      # Script stdlib-only : il tourne AVANT l'installation du lockfile, ce qui
      # est tout l'interet -- un verdict reutilise ne paie pas l'installation.
      - name: Compute golden-set verdict key
        id: verdict
        run: |
          python scripts/ci/golden_set_verdict_key.py \
            --workflow .github/workflows/notebook-execution-required.yml \
            --out "${RUNNER_TEMP}/golden_verdict_key.json"
          # Heredoc plutot que `python -c` multi-ligne : un `-c` indente par le
          # YAML meurt en IndentationError (mesure en local avant commit).
          python - <<'PY'
          import json
          import os

          path = os.path.join(os.environ["RUNNER_TEMP"], "golden_verdict_key.json")
          with open(path, encoding="utf-8") as fh:
              data = json.load(fh)
          comp = data["components"]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("key=%s\n" % data["key"])
              out.write("notebooks=%d\n" % comp["notebook_count"])

          lines = [
              "### Golden-set verdict key",
              "",
              "| Entree | Empreinte |",
              "|---|---|",
              "| cle de verdict | `%s` |" % data["key"],
              "| manifeste | `%s` |" % comp["manifest_sha256"][:16],
              "| lockfile | `%s` |" % comp["lockfile_sha256"][:16],
              "| executeur | `%s` |" % comp["implementation_sha256"][:16],
              "| workflow | `%s` |" % comp["workflow_sha256"][:16],
              "| carnets | %d |" % comp["notebook_count"],
              "| python | %s |" % comp["python_version"],
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY

      # RESTORE SEUL, sans `restore-keys` : un prefixe ramenerait le verdict
      # d'une AUTRE cle, c'est-a-dire exactement ce que cette tranche refuse.
      # Cloisonnement par branche (propriete d'actions/cache) : `main` et la
      # branche de la PR lisent le cache de `main` ; deux PR tierces ne
      # partagent rien. L'issue esperait un partage entre PRs -- c'est la
      # limite a ecrire, pas un contournement a bricoler.
      - name: Restore reused golden-set verdict
        id: reuse
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/golden_verdict
          key: golden-set-verdict-v1-${{ steps.verdict.outputs.key }}

      - name: Install pinned golden-set lockfile
        if: steps.reuse.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/notebook_tools/golden_set.lock.txt

      - name: Execute golden-set (Papermill)
        if: steps.reuse.outputs.cache-hit != 'true'
        run: |
          python scripts/notebook_tools/notebook_tools.py golden-set --json > /tmp/golden_set_result.json
          cat /tmp/golden_set_result.json
          # The subcommand exits non-zero if any notebook fails (red CI).
          python -c "import json,sys; r=json.load(open('/tmp/golden_set_result.json')); sys.exit(0 if r['passed'] else 1)"
          mkdir -p "${RUNNER_TEMP}/golden_verdict"
          cp /tmp/golden_set_result.json "${RUNNER_TEMP}/golden_verdict/golden_set_result.json"

      # Un verdict restaure est une PREUVE qu'on reutilise, pas une permission
      # qu'on suppose : on le relit et on refuse s'il n'est pas vert. Seul un
      # run vert a pu ecrire ce cache (garde du step de sauvegarde), mais la
      # verification est ici aussi -- une entree abimee doit rougir, jamais
      # passer pour une suite reussie.
      - name: Reuse cached golden-set verdict
        if: steps.reuse.outputs.cache-hit == 'true'
        run: |
          cp "${RUNNER_TEMP}/golden_verdict/golden_set_result.json" /tmp/golden_set_result.json
          cat /tmp/golden_set_result.json
          python - <<'PY'
          import json
          import sys

          with open("/tmp/golden_set_result.json", encoding="utf-8") as fh:
              result = json.load(fh)
          print(
              "verdict reutilise : passed=%r, %s/%s carnets"
              % (result.get("passed"), result.get("success_count"), result.get("total"))
          )
          sys.exit(0 if result.get("passed") is True else 1)
          PY

      - name: Record golden-set verdict provenance
        if: success() && steps.reuse.outputs.cache-hit != 'true'
        env:
          VERDICT_KEY: ${{ steps.verdict.outputs.key }}
        run: |
          python - <<'PY'
          import json
          import os

          # Ecrit A COTE du verdict : c'est ce fichier que le prochain run
          # restaurera pour citer l'execution d'origine dans son resume.
          path = os.path.join(os.environ["RUNNER_TEMP"], "golden_verdict", "provenance.json")
          payload = {
              "key": os.environ["VERDICT_KEY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
          }
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2)
          with open(path, encoding="utf-8") as fh:
              print(fh.read())
          PY

      # SAVE conditionne au succes : un verdict ROUGE mis en cache empoisonnerait
      # sa cle, et toute execution ulterieure rejouerait un echec deja repare.
      # Le cache est ecrit par `main` ET par les branches de PR, contrairement a
      # `lake-*` (#19658) : la retenue de #19658 porte sur des archives de
      # ~650 Mo et des caches pip de ~66 Mo ; ici l'artefact est un JSON de
      # quelques kilo-octets, sans effet mesurable sur le quota du store.
      - name: Save golden-set verdict (green only)
        if: success() && steps.reuse.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/golden_verdict
          key: golden-set-verdict-v1-${{ steps.verdict.outputs.key }}

      - name: Post golden-set summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reused = '${{ steps.reuse.outputs.cache-hit }}' === 'true';
            const key = '${{ steps.verdict.outputs.key }}';
            let body = '## Golden-Set Execution (H.7 P3)\n\n';
            try {
              const r = JSON.parse(fs.readFileSync('/tmp/golden_set_result.json', 'utf8'));
              const icon = r.passed ? '✅' : '❌';
              body += `${icon} **${r.success_count}/${r.total}** notebooks passed (certified reproducible)\n\n`;
              // Provenance : un verdict reutilise doit dire DE QUEL run il vient,
              // sinon le vert affiche ici serait indiscernable d'une execution.
              if (reused) {
                let prov = null;
                try {
                  prov = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/golden_verdict/provenance.json`, 'utf8'));
                } catch (e) { prov = null; }
                const origin = prov
                  ? `run [\`${prov.run_id}\`](../actions/runs/${prov.run_id}) sur \`${prov.ref}\` (\`${String(prov.sha).slice(0, 12)}\`)`
                  : 'run d\'origine non consigne';
                body += `Verdict **reutilise** pour la cle \`${key}\` — ${origin} ; aucune execution ce tour.\n\n`;
              } else {
                body += `Verdict **calcule** ce tour (cle \`${key}\`) — aucune entree de cache ne correspondait.\n\n`;
              }
              body += `| Notebook | Status | Time |\n|-----------|--------|------|\n`;
              for (const n of r.notebooks) {
                const s = n.success ? '✅' : '❌';
                body += `| ${n.path.split('/').pop()} | ${s} ${n.message} | ${n.execution_time.toFixed(1)}s |\n`;
              }
              body += `\nPinned lockfile: \`scripts/notebook_tools/golden_set.lock.txt\` (H.7 P3, axe A \`#4208\`)\n`;
            } catch (e) {
              body += `⚠️ Could not read result: ${e.message}\n`;
            }
            core.info(body);
            // Post as PR comment when on a PR; otherwise just log.
            // A comment-post failure must NEVER red the execution gate: the
            // H.7 P3 verdict reflects notebook execution (step above), not the
            // health of this cosmetic summary step. validate-static already
            // wraps its poster the same way; the golden-set poster did not,
            // so a 403 on createComment silently failed the whole gate.
            try {
              if (context.eventName === 'pull_request') {
                const { data: comments } = await github.rest.issues.listComments({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: context.issue.number,
                });
                const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes('Golden-Set Execution'));
                if (existing) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner, repo: context.repo.repo,
                    comment_id: existing.id, body,
                  });
                } else {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number: context.issue.number, body,
                  });
                }
              }
            } catch (e) {
              core.warning('Could not post golden-set summary comment: ' + e.message);
            }
