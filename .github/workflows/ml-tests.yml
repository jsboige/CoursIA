name: ML & Prover Tests

on:
  push:
    branches: [main]
    paths:
      - 'MyIA.AI.Notebooks/QuantConnect/ML-Training-Pipeline/scripts/**'
      - 'tests/**'
      - 'pytest.ini'
      - '.github/workflows/ml-tests.yml'
  pull_request:
    types: [opened, synchronize, edited, reopened]
    paths:
      - 'MyIA.AI.Notebooks/QuantConnect/ML-Training-Pipeline/scripts/**'
      - 'tests/**'
      - 'pytest.ini'
      - '.github/workflows/ml-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ml-tests:
    name: ML Pipeline Tests (CPU)
    # Route vers la jambe Linux auto-hebergee (#13378 tranche 5, decision ai-01
    # 2026-09-02) : garde Python pur, sans secret. La garde same-repo ci-dessous
    # saute les PRs de fork (pr_gate.py compte `skipped` comme OK) : aucun code de
    # fork n'atteint le runner. Retour arriere = revert de la PR.
    # Offre GitHub d'abord (#17397, consigne user du 2026-10-25) : le CI local pallie ses limites. Retour = remettre le label.
    # 2026-10-28 (#23053 b, lane myia-ai-01:CoursIA-2) : forme hybride de
    # debordement (#22461 phase A) -- PR meme-depot ET vars.CI_OVERFLOW_LOCAL
    # == 'true' -> jambe Linux locale ; sinon `ubuntu-latest` (etat du 27/10).
    # Retour arriere = variable `false` ou supprimee, sans toucher ce fichier.
    # Le job voisin `prover-tests` reste sur `ubuntu-latest` : il est desactive
    # (`if: ... && false`) et n'a donc aucune duree mesurable a borner.
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository && vars.CI_OVERFLOW_LOCAL == 'true') && fromJSON('["self-hosted","coursia-ephemeral","coursia-linux"]') || 'ubuntu-latest' }}
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    # Budget de 45 min, pas 30 (#16139, mesure 2026-09-14). Le 30 pose par
    # #15531 sur une extrapolation (~21 min) a ete ATTEINT quatre fois : la
    # premiere sur la branche de #15531 elle-meme (elle declarait deja 30), les
    # trois autres apres son merge. Ce n'est pas un cas isole, et deux des
    # quatre sont des `push` sur `main`, ou `cancel-in-progress` est FAUX --
    # ni supplantation, ni annulation de file, donc un vrai mur. Le temps se
    # consomme DANS l'etape `Run tests`, jamais
    # dans l'acquisition du runner : job 103470257369, `Run tests` 01:00:53Z ->
    # 01:30:38Z soit 29m45s puis tue (Set up job : 2 s) ; meme profil sur
    # 103620315252 et 103219647242. Ce n'est pas une attente de slot deguisee :
    # c'est la suite qui tourne encore a 30 min.
    #
    # Mesure — fenetre nommee et reproductible : workflow `ml-tests.yml`, 100
    # derniers runs, 2026-09-01T16:18Z -> 2026-09-14T05:30Z, duree au niveau
    # JOB (`started_at` -> `completed_at`, jamais `createdAt` -> `updatedAt`).
    # 73 succes, mediane 5,6 min, **max(success) 13,9 min** (837 s, run
    # 33885862193) ; 24 annulations, dont 4 collees a 1822-1827 s (le mur a 30)
    # et 14 collees a 918-938 s (le mur a 15 d'avant #15531).
    #
    # Le chiffre est borne par le HAUT, et c'est ce qui choisit 45 plutot que
    # 60. L'agregateur qui attend ce job est le job `gate` de `pr-gate.yml`,
    # dont le mur est 52 min — ecrit pour ca (#14412 : « the gate that waits for
    # Quarto carried the same stale ceiling as the job it waits on »). Un job a
    # 60 min ferait self-canceller l'agregateur avant que la preuve n'arrive,
    # soit exactement le defaut que ce commentaire documente. 45 est le plus
    # grand multiple de 15 qui laisse 7 min de marge a l'agregateur ; le
    # `--timeout-min` de `pr_gate.py` (defaut 90) n'est pas le mur contraignant.
    #
    # Ce que cette mesure ne dit PAS : un job tue n'a pas de duree d'achevement.
    # 30,4 min est un PLANCHER de ce qu'il fallait, pas un optimum calibre ; 45
    # couvre cette observation avec 1,5x et ne revendique rien de plus. La cure
    # reste la gouvernance du pool (#15574) ; ce budget est la mitigation.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # hmmlearn: required by scripts/hmm_regime_vol.py (M5). CPU-only,
          # depends on numpy/scipy/scikit-learn which are already installed --
          # it is listed so the M5 suite actually RUNS here rather than being
          # skipped, which would make its assertions a control never shown firing.
          # pyarrow >= 26 (#21764) : sous 26, le noyau ipykernel meurt
          # (Unhandled SIGSEGV) au chargement de pyarrow (chaine torch ->
          # dask -> xarray -> pandas -> pyarrow). Mesure : 24.0.0 crash,
          # 26.0.0 OK ; l'image portait 25.0.1, non mesure.
          pip install numpy pandas scipy scikit-learn arch pytest "pyarrow>=26" xgboost joblib hmmlearn
          # Version RESOLUE affichee : un plancher non affiche n'est pas prouve.
          python -c "import pyarrow; print('pyarrow resolu:', pyarrow.__version__)"
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Borner les threads au quota CPU du conteneur
        # Le conteneur runner porte un quota CFS (`docker run --cpus`), mais
        # `nproc` et `os.cpu_count()` y voient tous les coeurs de l'hote :
        # mesure du 2026-10-20 sur myia-ai-01-wsl-6, `cpu.max` = 200000 100000
        # (2 CPU) pour nproc = 32. torch, OpenMP et BLAS dimensionnent leurs
        # pools sur 32 threads, que le noyau etrangle sous un quota de 2 :
        # c'est la traine lente mesuree sur la famille ai-01-wsl (succes
        # jusqu'a 42 min et murs a 45 min, main compris), absente des slots
        # po-2024-docker (3,9-13,6 min) dont la tranche n'a pas de CPUQuota.
        # Sans quota lisible (`max` ou fichier absent), on laisse nproc.
        run: |
          q=$(awk '$1 != "max" && $2 > 0 { n = int(($1 + $2 - 1) / $2); print (n < 1 ? 1 : n) }' /sys/fs/cgroup/cpu.max 2>/dev/null || true)
          [ -n "$q" ] || q=$(nproc)
          for v in OMP_NUM_THREADS MKL_NUM_THREADS OPENBLAS_NUM_THREADS NUMEXPR_NUM_THREADS; do
            echo "$v=$q" >> "$GITHUB_ENV"
          done
          echo "threads bornes a $q (cpu.max: $(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo absent), nproc: $(nproc))"

      - name: Run tests
        # Scope to the ML pipeline suite this job is named for. The repo-wide
        # pytest.ini testpaths pull in scripts/ suites (genai, wsl, catalog)
        # whose deps (requests, bcrypt, jupyter_client) are not installed here
        # and which have been failing on main since 2026-06-03 — tracked
        # separately; they need their own properly-provisioned workflow.
        run: pytest MyIA.AI.Notebooks/QuantConnect/ML-Training-Pipeline/scripts/tests --tb=short -v

  prover-tests:
    name: Prover Tests (placeholder)
    # Route vers la jambe Linux auto-hebergee (#13378 tranche 5, decision ai-01
    # 2026-09-02) : garde Python pur, sans secret. La garde same-repo ci-dessous
    # saute les PRs de fork (pr_gate.py compte `skipped` comme OK) : aucun code de
    # fork n'atteint le runner. Retour arriere = revert de la PR.
    # Offre GitHub d'abord (#17397, consigne user du 2026-10-25) : le CI local pallie ses limites. Retour = remettre le label.
    runs-on: ubuntu-latest
    if: (github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository) && false  # Enable when tests/prover/ has tests
    steps:
      - run: echo "Prover tests not yet available"
