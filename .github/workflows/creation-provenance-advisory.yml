name: Creation provenance advisory

# La moitie « provenance » du mandat de ralentissement de la creation
# (#23174). Un carnet NEUF doit avoir attendu son tour : l'issue servie
# doit avoir ete servie par un tirage du tapis (journal de tirage,
# `draw_id`), ou avoir ete creee au moins 48 h avant l'ouverture de la PR.
#
# Le job est **ADVISORY** : il sort TOUJOURS en 0 et porte son verdict par
# des annotations `::warning::` et par le resume de job. Un garde qui rouge
# sur une PR ne doit jamais bloquer une livraison — et l'issue demande
# explicitement « Advisory d'abord ».
#
# Ce que la garde mesure :
#   - la PR ajoute-t-elle un carnet NEUF (statut `added`, hors deménagement) ?
#   - un `.ipynb` AJOUTE porte-t-il un suffixe de langue (`_en`, `_es`,
#     `_de`, `_it`, `_pt`, `_zh`, `_ja`, `_ar`) ? Constat LANG_SIBLING :
#     #1650 §1 — la version localisée se produit dans le dépôt de langue
#     (#23174 : l'exemption `_en` est retiree, elle laissait passer les
#     jumeaux sans un mot) ;
#   - le veto de creation est-il actif ? Variable Actions
#     NOTEBOOK_CREATION_VETO_MIN_OPEN_ISSUES posee et atteinte par le
#     compte d'issues ouvertes = constat VETO_ACTIVE sur tout carnet neuf.
#     Le seuil vit dans la variable, JAMAIS dans le code : le coordinateur
#     le pose (`gh variable set NOTEBOOK_CREATION_VETO_MIN_OPEN_ISSUES
#     --body 400 --repo jsboige/CoursIA`) et le retire sans toucher ce
#     fichier. Absente ou vide = pas de veto ;
#   - l'issue servie existe-t-elle, et depuis combien de temps ?
#   - a-t-elle ete servie par un tirage nomme ?
#
# Le journal de tirage est un fichier LOCAL a la machine : en CI il est
# generalement absent, et le critere du tirage est alors NON EVALUABLE. Le
# script le dit ; il ne pretend jamais avoir mesure ce qu'il n'a pas mesure.
#
# Exemptions (posees par l'issue) : PRs étudiantes et externes,
# demenagements.
#
# Declencheur : `pull_request` sur les PRs qui touchent un `.ipynb`. Le job
# porte la garde same-repo universelle (forme acceptee par
# `scripts/ci/check_self_hosted_runner_policy.py`) : il ne s'execute pas sur
# le code d'un fork.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.ipynb'
  workflow_dispatch:
    inputs:
      pr:
        description: 'Numero de PR a controler'
        required: true

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: creation-provenance-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  provenance:
    name: "Provenance des carnets neufs (advisory)"
    # Runner GitHub-hosted : la garde est du Python pur, elle n'a besoin
    # d'aucun ressources local du parc (les jobs sans besoin local ont ete
    # migres vers ubuntu-latest par Q35 etape 2 -- voir le journal de
    # l'allowlist dans scripts/ci/check_self_hosted_runner_policy.py).
    # 2026-10-29 (#23053, cliquet de politique) : forme hybride de debordement
    # -- PR meme-depot ET vars.CI_OVERFLOW_LOCAL == 'true' -> jambe Linux
    # locale ; tout le reste (variable absente ou fausse, forks, dispatch)
    # retombe sur ubuntu-latest. **La variable vaut `false` au 29/10** : le
    # routage est donc identique a celui d'aujourd'hui (100 % heberge), et la
    # conversion retire la violation du cliquet sans changer ou le job
    # s'execute. Bascule : `gh variable set CI_OVERFLOW_LOCAL --body
    # true|false --repo jsboige/CoursIA`. Retour arriere = variable a
    # `false` ou supprimee, sans toucher ce fichier.
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository && vars.CI_OVERFLOW_LOCAL == 'true') && fromJSON('["self-hosted","coursia-ephemeral","coursia-linux"]') || 'ubuntu-latest' }}
    # Garde same-repo universelle : un fork n'atteint pas ce job.
    if: >-
      github.event.pull_request.head.repo.full_name == null
      || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      - name: Checkout (sparse, scripts only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: "Controles positifs de l'organe (avant de croire sa sortie)"
        run: |
          python -m pip install --quiet pytest
          python -m pytest scripts/tests/test_creation_provenance.py -q

      - name: "Provenance des carnets neufs"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Le seuil du veto vit dans une variable Actions du depot : le
          # workflow ne fait que la DECLARER a l'organe. Absente ou vide =
          # pas de veto -- aucune valeur par defaut ici, le seuil n'est
          # jamais dans le code (#23174).
          NOTEBOOK_CREATION_VETO_MIN_OPEN_ISSUES: ${{ vars.NOTEBOOK_CREATION_VETO_MIN_OPEN_ISSUES }}
        run: |
          # `pipefail` + `exit 0` se contredisaient : sous `bash -e`, un
          # non-zero de l'organe tuait l'etape AVANT le `exit 0`, et le job
          # rendait un rouge la ou sa doctrine dit « le verdict n'est jamais
          # porte par la conclusion du check ». Mesure du 2026-10-30 : quota
          # d'installation GitHub epuise -> `gh` non-zero -> rouge forge sur
          # #22977 et #22576. Le code de retour est desormais LU et annote,
          # jamais laisse gouverner.
          set -o pipefail
          PR="${{ github.event.pull_request.number || inputs.pr }}"
          {
            echo '## Provenance des carnets neufs'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rc=0
          python scripts/ci/check_creation_provenance.py --pr "$PR" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY" || rc="${PIPESTATUS[0]}"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::creation-provenance: l'organe s'est interrompu avant de conclure (rc=$rc) -- mesure NON CONCLUANTE, jamais un constat sur la PR"
          fi
          exit 0
