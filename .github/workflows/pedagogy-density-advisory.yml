name: Pedagogy Density Advisory

# The missing ORGAN for the pedagogy-density convention (#10479 Grain 2).
# The user's observation (2026-08-11) -- introductive series notebooks can lack
# pedagogical prose -- was measured (the markdown-share metric cannot
# discriminate) and the discriminating metric (chars of prose per code cell,
# floor 1200) was calibrated exactly against the issue table. This workflow
# wires that measure to a PR, exactly as exercises-advisory.yml did for the
# ">= 3 exercises" convention (#8814): a below-threshold notebook becomes
# VISIBLE on the PR that touches it.
#
# ADVISORY, never blocking (issue #10479 acceptance): the job ALWAYS exits 0.
# The actionable payload is the `pedagogy-density-below-threshold` LABEL, NEVER
# the green conclusion of the job (green by construction -- the same trap that
# let a non-conforming PR through in #8797).
#
# Per-PR scope (acceptance): runs pedagogy_density.py ONLY on the *.ipynb
# modified by the PR, not a repo-wide scan on every push. The corpus/kind
# classification (out-of-corpus artifacts, setup) is CONSUMED from
# count_exercises.py THROUGH pedagogy_density.py -- never re-implemented here,
# so the label and the canonical tool cannot diverge.
#
# Tranche 2 #12817: the per-PR fork guard died with the pull_request trigger
# (false under schedule -> job SKIPPED, organ extinguished). The nocturne
# scans the last-24h window of main; labels are PR-only and noop'd at night.
#
# Promoting to a blocking gate is a separate decision, to revisit only once the
# residual is at 0 and stable (issue #10479 "Hors scope").

on:
  schedule:
    # Nocturnal sweep -- post-merge main verification.
    # Tranche 1 #12817 : sortir les advisory lourds de pull_request
    # (clone 2.22 Go par run). Stratification user 2026-08-23 :
    # "les jobs lourds devraient être payés une fois par fournée".
    - cron: '17 03 * * *'
  push:
    branches: [main]
    # Block if the baseline drift re-introduces orphans (#13815 acceptance #2).
    # Path-scoped so unrelated pushes do not retrigger.
    paths:
      - 'scripts/notebook_tools/pedagogy_density_baseline.json'
      - 'MyIA.AI.Notebooks/**'
  pull_request:
    # Same rationale as push: a PR that touches either the baseline or the
    # corpus must be checked at PR time -- otherwise the next push to main
    # reintroduces an orphan (#13815 acceptance #2).
    paths:
      - 'scripts/notebook_tools/pedagogy_density_baseline.json'
      - 'MyIA.AI.Notebooks/**'
  workflow_dispatch: {}
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pedagogy-density-advisory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pedagogy-density-advisory:
    name: "Pedagogy density >= 1200 c/cell advisory (label, non-blocking)"
    # Routage #14283 tranche 4 (ai-01 2026-09-02) : balayage cron pur-Python.
    # Declencheur `schedule` uniquement -- il ne tourne que sur la branche par
    # defaut, donc aucun code de fork ne peut l'atteindre et aucune garde
    # same-repo n'est requise (cf en-tete de check_self_hosted_runner_policy.py).
    # Retour arriere = remettre `runs-on: ubuntu-latest` + retrait de l'allowlist.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          # Need base..head history for `git diff` of changed notebooks.
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Advisory check on modified notebooks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without a git context GH_REPO, `gh pr edit` / `gh label create`
          # cannot infer the target repo and fail silently (variation-tag-guard
          # documented this trap firsthand after #8765).
          GH_REPO: ${{ github.repository }}
          # '' under schedule/dispatch (no PR context) -> nocturne window below.
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          BASE: ${{ github.event.pull_request.base.sha || '' }}
          HEAD: ${{ github.event.pull_request.head.sha || '' }}
          LABEL_BELOW: pedagogy-density-below-threshold
          LABEL_UNMEASURED: pedagogy-density-unmeasured
        run: |
          set -uo pipefail

          # ---- Nocturne window (#12817 tranche 2) ----
          # Under schedule/dispatch there is no PR: BASE is empty. Resolve the
          # last 24 h of main so the sweep measures the day's merged apport.
          # Labels are PR-only -- noop'd when there is no PR to label; the
          # nocturne payload is the annotations + RESULT line below.
          NOCTURNE=0
          if [ -z "${BASE:-}" ]; then
            NOCTURNE=1
            BASE=$(git rev-list -1 --before="24 hours ago" HEAD)
            [ -n "$BASE" ] || BASE=$(git rev-list --max-parents=0 HEAD | tail -1)
            HEAD=$(git rev-parse HEAD)
            PR_NUMBER=""
            echo "Nocturne window: $(git rev-parse --short "$BASE")..$(git rev-parse --short "$HEAD") (24 h of main)"
          fi

          # Added/modified *.ipynb in the PR (deletions excluded -- a deleted
          # notebook has nothing to measure).
          # 3-point diff (#10403): merge-base...HEAD -- strictly this PR's apport.
          git diff --name-only --diff-filter=d "$BASE...$HEAD" -- '*.ipynb' \
            | grep -v $'\r$' > changed_ipynb.txt || true
          COUNT=$(wc -l < changed_ipynb.txt | tr -d ' ')
          echo "Modified *.ipynb in this PR: $COUNT"

          # Helper: ensure a label exists (idempotent), then add/remove it.
          ensure_label() {
            gh label create "$1" --description "$2" --color "$3" --force 2>/dev/null || true
          }
          set_label() { gh pr edit "$PR_NUMBER" --add-label "$1" || true; }
          unset_label() { gh pr edit "$PR_NUMBER" --remove-label "$1" 2>/dev/null || true; }
          if [ "$NOCTURNE" -eq 1 ]; then
            # No PR to label at night: the signal stays in the run output.
            ensure_label() { true; }
            set_label()   { true; }
            unset_label() { true; }
          fi

          if [ "$COUNT" -eq 0 ]; then
            echo "No modified notebooks to check."
            unset_label "$LABEL_BELOW"; unset_label "$LABEL_UNMEASURED"
            exit 0
          fi

          # Advisory: ALWAYS exit 0. The job never fails; the actionable signal
          # is the pair of LABELS decided from the JSON payload below.
          python scripts/notebook_tools/pedagogy_density.py --json --stdin \
            < changed_ipynb.txt > payload.json
          cat payload.json

          SUB=$(python -c "import json; print(json.load(open('payload.json'))['summary']['below_threshold'])")
          UNM=$(python -c "import json; print(json.load(open('payload.json'))['summary']['unmeasured'])")
          echo "Below-threshold notebooks: $SUB"
          echo "Unmeasured (parse errors / no code cell): $UNM"

          # Issue #8819 applied to density: TWO distinct labels. "Could not
          # measure" and "measured, below threshold" call for different
          # reactions, so they never collapse into one. Each label is raised
          # when its count > 0 and cleared otherwise (a stale label from an
          # earlier push must not stick).
          ensure_label "$LABEL_BELOW" \
            "A modified notebook measures below the 1200 chars-of-prose-per-code-cell floor (#10479)" "D93F0B"
          ensure_label "$LABEL_UNMEASURED" \
            "A modified notebook could not be measured -- NOT verified (#8819)" "BFD4F2"

          # The #8819 guard: if pedagogy_density.py died (truncated JSON,
          # ImportError, OOM), payload.json is unreadable, the two python -c
          # above fail, and SUB/UNM are not integers. With only
          # `set -uo pipefail` (no -e), each `[ "" -gt 0 ]` below exits rc=2 --
          # which falls into the else branch, UNSETS both labels, and asserts
          # verified conformity on a measurement that never happened. NOT
          # measured => NOT verified: pose the unmeasured label and a loud
          # ::error::, never a green claim.
          if ! [ "${SUB:-}" -eq "${SUB:-}" ] 2>/dev/null \
             || ! [ "${UNM:-}" -eq "${UNM:-}" ] 2>/dev/null; then
            echo "::error::pedagogy-density payload illisible (pedagogy_density.py produced no usable JSON) -- the gate measured NOTHING; conformity neither claimed nor denied."
            set_label "$LABEL_UNMEASURED"
            exit 0
          fi

          if [ "$SUB" -gt 0 ]; then
            if [ "$NOCTURNE" -eq 1 ]; then
              echo "::notice::$SUB notebook(s) below the 1200 chars-of-prose-per-code-cell floor merged in the last 24 h (#10479)."
            else
              echo "::notice::$SUB modified notebook(s) below the 1200 chars-of-prose-per-code-cell floor (#10479). See the '$LABEL_BELOW' label."
            fi
            set_label "$LABEL_BELOW"
          else
            unset_label "$LABEL_BELOW"
          fi

          if [ "$UNM" -gt 0 ]; then
            if [ "$NOCTURNE" -eq 1 ]; then
              echo "::warning::$UNM notebook(s) in the last-24h window could not be measured -- NOT verified by the density advisory (#8819)."
            else
              echo "::warning::$UNM modified notebook(s) could not be measured -- NOT verified by the density advisory (#8819). See the '$LABEL_UNMEASURED' label."
            fi
            set_label "$LABEL_UNMEASURED"
          else
            unset_label "$LABEL_UNMEASURED"
          fi

          # The closing line asserts ONLY what was measured (issue #8819). The
          # job never claims "all conform" while unmeasured > 0.
          if [ "$UNM" -gt 0 ]; then
            echo "RESULT: $UNM notebook(s) NOT measured -- conformity neither claimed nor denied."
          elif [ "$SUB" -gt 0 ]; then
            echo "RESULT: $SUB notebook(s) below threshold -- labelled."
          else
            echo "RESULT: all in-corpus modified notebooks meet the density floor (verified)."
          fi
          exit 0

  baseline-orphans-guard:
    # #13815 acceptance #2 -- prevent re-introduction of orphan keys.
    # The baseline must NEVER carry a path that is no longer tracked
    # (renamed or deleted); otherwise the Phase-2 regression ratchet reads
    # a stale float as if the notebook still existed there.
    #
    # Blocking by design (different from the advisory above): --check-orphans
    # exits non-zero when orphans exist, and a non-zero exit in this job is a
    # PR-gate failure -- exactly the behavior the issue acceptance asks for.
    # Cheap to run (git ls-files + JSON diff, no notebook execution), so it
    # stays in the per-PR scope at full fidelity rather than being
    # pushed to a nocturnal window only.
    name: "Pedagogy density baseline orphan guard (#13815)"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check baseline against tracked notebooks
        run: |
          set -uo pipefail
          # --check-orphans exits 1 on orphans, 0 on clean.
          # We propagate the exit code verbatim so a baseline drift blocks the
          # PR gate (acceptance #2 of #13815: a stale baseline key is a
          # correctness defect, not a soft pedagogical threshold).
          python scripts/notebook_tools/pedagogy_density.py --check-orphans
