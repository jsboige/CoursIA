name: Runner starvation advisory (waiter+lean)

# Sonde d'extinction multi-labels (issue #14846, grain c.1063 myia-po-2027).
# Le 2026-09-05 entre 20:26Z et 00:52Z, le pool `coursia-waiter` est tombe
# sans rougir nulle part : 28 runners enregistres, 0 en ligne, 4h20 de gel
# de tous les merges (le `PR gate` est le seul check requis par la protection
# de `main`, sa jambe same-repo tourne sur ce label -- `pr-gate.yml:107`).
# L'organe `scripts/ci/check_runner_starvation.py` mesurait deja le predicat
# EXTINCTION (zero runner online sur le label), mais le seul workflow qui
# l'appelait (`linux-runner-starvation-advisory.yml`) ne couvrait que
# `coursia-linux`. Cette sonde etend la couverture a deux des trois labels
# requis par `pr-gate.yml` (waiter) + workflows bloquants (lean) ;
# `coursia-linux` reste couvert par son workflow dedie
# (`linux-runner-starvation-advisory.yml`, cron 19,49).
#
# Pourquoi une matrice et pas 2 workflows dedies : un seul cron centralise
# l'observabilite, les 2 sondes partagent la fenetre STARVATION et le secret
# RUNNERS_READ_PAT, et la matrice GitHub Actions parallellise les 2 mesures
# sans collision de rate-limit. Schedule dediee (cron offset 19,49 pour
# coursia-linux + 23,53 pour les 2 autres -- l'offset disjoint evite de
# charger le meme runner sur 2 vagues consecutives).
#
# Acceptance #14846 A1 verifiee par construction :
#   - predicat EXTINCTION : si 0 runner online sur un label -> ::error::
#   - predicat STARVATION : si jobs queued > seuil SANS aucun in_progress ->
#     ::error:: (symptome distinct de l'extinction -- file profonde qui ne
#     draine pas)
#   - WARN floor configurable par label (waiter = 1, lean = 1)
#
# Acceptance A2 (persistance systemd) deja livree par PR #14981 (waiter) +
# PR #15401 (lean). Acceptance A3 (verification systemctl is-enabled po-2024)
# -> DM coord, hors scope worker.
#
# ADVISORY PAR CONSTRUCTION : schedule + workflow_dispatch uniquement, jamais
# pull_request/push -- un run rouge ne peut jamais bloquer une PR. Le nom
# porte "advisory" (ADVISORY_MARKER, cf pr-gate-sweep-health-advisory.yml).

on:
  schedule:
    - cron: '23,53 * * * *'  # waiter + lean (offset distinct du cron linux 19,49)
  workflow_dispatch:

permissions:
  contents: read   # checkout du script
  actions: read    # lecture des runs/jobs (predicat STARVATION)

concurrency:
  group: runner-starvation-advisory
  cancel-in-progress: false

jobs:
  starve:
    name: Runner starvation advisory (${{ matrix.label }})
    # ubuntu-latest (#16134, 2026-09-14).
    #
    # Ce job portait ce commentaire : « un observateur qui tourne sur le label
    # qu'il observe mourrait avec lui ». Le raisonnement est juste, la
    # conclusion ne l'etait pas -- `coursia-linux` n'est pas un abri, c'est une
    # troisieme jambe du MEME parc que `coursia-waiter` et `coursia-lean`.
    # Changer de label ne change pas de risque : une reconstruction d'image
    # invalide les trois ensembles (le garde de fraicheur de #14801 est
    # fail-closed et compare le checkout vivant a l'image), et plus aucune des
    # trois ne peut alors heberger l'observateur.
    #
    # Mesure du 2026-09-14 : 01:44Z -> 07:11Z sans un seul run pour un cron
    # declare `23,53 * * * *`. Le run de 07:12Z n'a tourne que parce qu'une
    # jambe etait deja revenue -- et c'est lui, et lui seul, qui a rougi. Sur
    # tout le creneau ou le parc etait mort, la sonde n'a rien pu dire.
    #
    # L'organe n'a aucune dependance a l'hote (auth par API uniquement) : le
    # routage auto-heberge ne lui apportait rien. Depot public => minutes
    # GitHub-hosted gratuites.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: coursia-waiter
            warn_floor: 1
            starve_minutes: "15"
          - label: coursia-lean
            warn_floor: 1
            starve_minutes: "15"
    steps:
      - uses: actions/checkout@v4
      - name: Measure starvation on ${{ matrix.label }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNERS_READ_PAT: ${{ secrets.RUNNERS_READ_PAT }}
          LABEL: ${{ matrix.label }}
          STARVE_MINUTES: ${{ matrix.starve_minutes }}
          WARN_FLOOR: ${{ matrix.warn_floor }}
          WINDOW_MAX_MINUTES: "360"
        run: python scripts/ci/check_runner_starvation.py --label "$LABEL" --warn-floor "$WARN_FLOOR" --starve-minutes "$STARVE_MINUTES" --window-max-minutes "$WINDOW_MAX_MINUTES"
