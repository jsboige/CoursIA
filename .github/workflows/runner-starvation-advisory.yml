name: Runner starvation advisory (lean)

# Sonde d'extinction du label `coursia-lean` (issue #14846, grain c.1063 myia-po-2027).
# Le label `coursia-waiter` n'est plus couvert depuis #20835 / #17436 :
# depuis 46df1d691f (PR #17436, 2026-09-23), la jambe `pull_request` du
# `pr-gate.yml` tourne sur `ubuntu-latest` (ligne 163) et n'a plus aucun
# consommateur du label. Le pool est vide par construction ; le signaler
# comme famine fabriquerait un bruit regulier sans cause. Le retrait systeme
# du pool (service systemd, desinscription des 16 runners sur ai-01) est
# porte par le point 1 de #20835 et reste a po-2024 (jambe A) -- voir le
# commentaire de la matrice ci-dessous pour la liste des labels encore
# surveilles.
#
# L'organe `scripts/ci/check_runner_starvation.py` mesurait deja le predicat
# EXTINCTION (zero runner online sur le label). `coursia-linux` reste
# couvert par son workflow dedie
# (`linux-runner-starvation-advisory.yml`, cron 19,49). `coursia-lean` est
# le seul label encore sous surveillance ici -- les builds Lean restent un
# goulet serieux, le retrait du waiter n'ouvre pas la couverture de cette
# sonde.
#
# Pourquoi une sonde et pas un check bloquant : un seul cron centralise
# l'observabilite, la sonde partage la fenetre STARVATION et le secret
# RUNNERS_READ_PAT, et la matrice GitHub Actions parallellise les mesures
# sans collision de rate-limit. Schedule dediee (cron offset 19,49 pour
# coursia-linux + 23,53 pour lean -- l'offset disjoint evite de charger le
# meme runner sur 2 vagues consecutives).
#
# Acceptance #14846 A1 verifiee par construction :
#   - predicat EXTINCTION : si 0 runner online sur un label -> ::error::
#   - predicat STARVATION : si jobs queued > seuil SANS aucun in_progress ->
#     ::error:: (symptome distinct de l'extinction -- file profonde qui ne
#     draine pas)
#   - WARN floor configurable par label (lean = 1)
#
# Acceptance A2 (persistance systemd) deja livree par PR #15401 (lean).
# Acceptance A3 (verification systemctl is-enabled po-2024) -> DM coord,
# hors scope worker.
#
# ADVISORY PAR CONSTRUCTION : schedule + workflow_dispatch uniquement, jamais
# pull_request/push -- un run rouge ne peut jamais bloquer une PR. Le nom
# porte "advisory" (ADVISORY_MARKER, cf pr-gate-sweep-health-advisory.yml).

on:
  schedule:
    - cron: '23,53 * * * *'  # lean (offset distinct du cron linux 19,49)
  workflow_dispatch:

permissions:
  contents: read   # checkout du script
  actions: read    # lecture des runs/jobs (predicat STARVATION)

concurrency:
  group: runner-starvation-advisory
  cancel-in-progress: false

jobs:
  starve:
    name: Runner starvation advisory (${{ matrix.label }})
    # ubuntu-latest (#16134, 2026-09-14).
    #
    # Ce job portait ce commentaire : « un observateur qui tourne sur le label
    # qu'il observe mourrait avec lui ». Le raisonnement est juste, la
    # conclusion ne l'etait pas -- `coursia-linux` n'est pas un abri, c'est une
    # deuxieme jambe du MEME parc que `coursia-lean`.
    # Changer de label ne change pas de risque : une reconstruction d'image
    # invalide les deux ensembles (le garde de fraicheur de #14801 est
    # fail-closed et compare le checkout vivant a l'image), et plus aucune des
    # deux ne peut alors heberger l'observateur.
    #
    # Mesure du 2026-09-14 : 01:44Z -> 07:11Z sans un seul run pour un cron
    # declare `23,53 * * * *`. Le run de 07:12Z n'a tourne que parce qu'une
    # jambe etait deja revenue -- et c'est lui, et lui seul, qui a rougi. Sur
    # tout le creneau ou le parc etait mort, la sonde n'a rien pu dire.
    #
    # L'organe n'a aucune dependance a l'hote (auth par API uniquement) : le
    # routage auto-heberge ne lui apportait rien. Depot public => minutes
    # GitHub-hosted gratuites.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: coursia-lean
            warn_floor: 1
            starve_minutes: "15"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/runner-starvation-advisory.yml
            scripts/ci/check_runner_starvation.py
      - name: Measure starvation on ${{ matrix.label }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNERS_READ_PAT: ${{ secrets.RUNNERS_READ_PAT }}
          LABEL: ${{ matrix.label }}
          STARVE_MINUTES: ${{ matrix.starve_minutes }}
          WARN_FLOOR: ${{ matrix.warn_floor }}
          WINDOW_MAX_MINUTES: "360"
        run: python scripts/ci/check_runner_starvation.py --label "$LABEL" --warn-floor "$WARN_FLOOR" --starve-minutes "$STARVE_MINUTES" --window-max-minutes "$WINDOW_MAX_MINUTES"
