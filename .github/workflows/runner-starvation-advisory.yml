name: Runner starvation advisory (lean)

# Sonde d'extinction d'un pool de runners self-hosted (issue #14846, grain c.1063
# myia-po-2027) -- vise `coursia-ephemeral` depuis le 2026-10-23 (le label
# `coursia-lean` qu'elle mesurait n'existe plus, cf plus bas).
#
# Correction #22183 (2026-10-23) : le paragraphe qui etait ici affirmait que
# le label `coursia-waiter` n'etait « plus couvert depuis #20835 / #17436,
# le pool etant vide par construction ». Cette premisse etait vraie jusqu'a
# #21063 et FAUSSE depuis : la jambe `pull_request` du `pr-gate.yml` est
# re-routee sur `coursia-waiter` (pr-gate.yml ligne 172) et le pool de
# 16 slots est consomme a pleine charge. L'extinction du 2026-10-23
# (0 runner online au label, 126 runs `PR gate` en file, ~10 h sans signal)
# n'a ete mesuree par aucun organe, justement parce que ce header le
# declarait sans consommateur. Le label est a nouveau couvert par son
# workflow dedie `coursia-waiter-starvation-advisory.yml` (livre par la
# meme PR).
#
# L'organe `scripts/ci/check_runner_starvation.py` mesure le predicat
# EXTINCTION (zero runner online sur le label) et la STARVATION (file qui ne
# draine pas), parametre par `--label`. `coursia-linux` est couvert par son
# workflow dedie (`linux-runner-starvation-advisory.yml`, cron 19,49) et
# `coursia-waiter` par le sien (`coursia-waiter-starvation-advisory.yml`,
# cron 11,41, livre par #22183).
#
# LE LABEL `coursia-lean` N'EXISTE PLUS (mesure 2026-10-23T18:45Z) :
# `gh api .../actions/runners` rend 40 runners tous online, repartis en
# `coursia-ephemeral` (24), `coursia-linux` (23), `coursia-waiter` (16),
# `coursia-persistent` (7), `coursia-fast-guards` (1) -- et ZERO porteur de
# `coursia-lean`. Aucun `runs-on` de main ne route plus vers lui : les jambes
# Lean sont passees a `[self-hosted, coursia-ephemeral, coursia-linux]`.
# Cette sonde le mesurait encore et rougissait donc a chaque passage depuis
# le 2026-10-22 (succes 17:20Z, echec 20:37Z) avec
# `EXTINCTION ... (offline: aucun)` -- le rouge permanent que la garde anti-FP
# du predicat STARVATION interdit ailleurs. Elle vise desormais
# `coursia-ephemeral`, le pool qui sert effectivement les jobs Lean ; son
# seul membre hors `coursia-linux` est `myia-po-2024-fast-guards`, qu'aucune
# autre sonde ne surveille.
#
# Pourquoi une sonde et pas un check bloquant : un seul cron centralise
# l'observabilite, la sonde partage la fenetre STARVATION et le secret
# RUNNERS_READ_PAT, et la matrice GitHub Actions parallellise les mesures
# sans collision de rate-limit. Schedule dediee (cron offset 11,41 pour
# coursia-waiter, 19,49 pour coursia-linux + 23,53 pour lean -- l'offset
# disjoint evite de charger le meme runner sur 2 vagues consecutives).
#
# Acceptance #14846 A1 verifiee par construction :
#   - predicat EXTINCTION : si 0 runner online sur un label -> ::error::
#   - predicat STARVATION : si jobs queued > seuil SANS aucun in_progress ->
#     ::error:: (symptome distinct de l'extinction -- file profonde qui ne
#     draine pas)
#   - WARN floor configurable par label (ephemeral = 2)
#
# Acceptance A2 (persistance systemd) deja livree par PR #15401 (lean).
# Acceptance A3 (verification systemctl is-enabled po-2024) -> DM coord,
# hors scope worker.
#
# ADVISORY PAR CONSTRUCTION : schedule + workflow_dispatch uniquement, jamais
# pull_request/push -- un run rouge ne peut jamais bloquer une PR. Le nom
# porte "advisory" (ADVISORY_MARKER, cf pr-gate-sweep-health-advisory.yml).

on:
  schedule:
    - cron: '23,53 * * * *'  # lean (offset distinct du cron linux 19,49)
  workflow_dispatch:

permissions:
  contents: read   # checkout du script
  actions: read    # lecture des runs/jobs (predicat STARVATION)

concurrency:
  group: runner-starvation-advisory
  cancel-in-progress: false

jobs:
  starve:
    name: Runner starvation advisory (${{ matrix.label }})
    # ubuntu-latest (#16134, 2026-09-14).
    #
    # Ce job portait ce commentaire : « un observateur qui tourne sur le label
    # qu'il observe mourrait avec lui ». Le raisonnement est juste, la
    # conclusion ne l'etait pas -- `coursia-linux` n'est pas un abri, c'est une
    # deuxieme jambe du MEME parc que l'ancien `coursia-lean`.
    # Changer de label ne change pas de risque : une reconstruction d'image
    # invalide les deux ensembles (le garde de fraicheur de #14801 est
    # fail-closed et compare le checkout vivant a l'image), et plus aucune des
    # deux ne peut alors heberger l'observateur.
    #
    # Mesure du 2026-09-14 : 01:44Z -> 07:11Z sans un seul run pour un cron
    # declare `23,53 * * * *`. Le run de 07:12Z n'a tourne que parce qu'une
    # jambe etait deja revenue -- et c'est lui, et lui seul, qui a rougi. Sur
    # tout le creneau ou le parc etait mort, la sonde n'a rien pu dire.
    #
    # L'organe n'a aucune dependance a l'hote (auth par API uniquement) : le
    # routage auto-heberge ne lui apportait rien. Depot public => minutes
    # GitHub-hosted gratuites.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: coursia-ephemeral
            warn_floor: 2
            starve_minutes: "15"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/runner-starvation-advisory.yml
            scripts/ci/check_runner_starvation.py
      - name: Measure starvation on ${{ matrix.label }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNERS_READ_PAT: ${{ secrets.RUNNERS_READ_PAT }}
          LABEL: ${{ matrix.label }}
          STARVE_MINUTES: ${{ matrix.starve_minutes }}
          WARN_FLOOR: ${{ matrix.warn_floor }}
          WINDOW_MAX_MINUTES: "360"
        run: python scripts/ci/check_runner_starvation.py --label "$LABEL" --warn-floor "$WARN_FLOOR" --starve-minutes "$STARVE_MINUTES" --window-max-minutes "$WINDOW_MAX_MINUTES"
