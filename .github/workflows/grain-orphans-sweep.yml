name: Grain orphans sweep

# The ROUTING half of issue #13086. The blocking guard
# (`variation-tag-guard.yml`, job `check-variation-tag-required`) already
# posts an instructional comment at the moment of the omission (piste (a),
# live since 2026-08-24, marker `vtr-required-block`) -- yet the residue
# persisted (16 untagged open PRs measured 2026-08-27). A signal without a
# recipient is not a routing: an untagged PR belongs to NO lane, so no
# "repair your own red first" guard will ever surface it, and the picker's
# `unattributed_blocked` output is only seen by whichever lane happens to
# draw a grain -- never by the coordinator.
#
# This sweep recomputes that list daily and upserts ONE marker-guarded
# comment (`GRAIN-ORPHANS-SWEEP`) on #13086, naming each orphan with author
# and branch for named dispatch. ADVISORY, never blocking: the job always
# exits 0, it does not tag PRs, does not close anything -- it routes, the
# coordinator decides (skill coordinate, point 5).

on:
  schedule:
    # Daily, off-:00 minute (anti-stampede), staggered vs the 06:17
    # orphaned-delivery scan. 07:23 UTC.
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Upsert the marker-guarded comment on #13086 (default: dry-run)'
        required: false
        type: boolean
        default: false

permissions:
  issues: write
  contents: read

concurrency:
  group: grain-orphans-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: "Route untagged blocked PRs to the coordinator (advisory)"
    # Routage #14283 tranche 4 (ai-01 2026-09-02) : balayage cron pur-Python.
    # Declencheur `schedule` uniquement -- il ne tourne que sur la branche par
    # defaut, donc aucun code de fork ne peut l'atteindre et aucune garde
    # same-repo n'est requise (cf en-tete de check_self_hosted_runner_policy.py).
    # Retour arriere = remettre `runs-on: ubuntu-latest` + retrait de l'allowlist.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    # #23349 : borne explicite. Mesure du 2026-11-09 sur les 4 derniers
    # runs mesurables (dont 3 verts) : max 15.1 min (run 42489432803).
    # Le defaut d'Actions est 6 h, et un job fige tient son slot tout ce
    # temps.
    timeout-minutes: 35
    steps:
      # 2026-10-27 (#22722) : la commande qui echoue est le `git checkout --force -B`
      # final d'actions/checkout, pas son clean/reset interne (run 40476005592 :
      # clean et reset passent, "HEAD is now at eb8ab03489", puis le checkout
      # refuse le carnet JEPA "not uptodate; will not remove from working tree").
      # Ce refus est la verification de retrait du retrecissement sparse
      # (apply_sparse_checkout, WARNING_SPARSE_NOT_UPTODATE_FILE, git 2.43.0) :
      # a blob inchange, elle compare le fichier au blob de l'index ; ni --force
      # ni le reset interne ne la contournent. Mitigation EMPIRIQUE, mecanisme
      # NON TRANCHE : sur git 2.43.0 tout etat residuel reproduit localement est
      # deja nettoye par le clean+reset du built-in (ce step rejoue la meme
      # commande, sans effet ajoute), et l'etat qui a survecu a son reset n'est
      # pas reproduit (mutation entre reset et checkout ? checkout interrompu ?).
      - name: Restore the warm work tree before the sparse checkout
        run: |
          set -u
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            if ! dirty=$(git -C "$GITHUB_WORKSPACE" -c safe.directory="$GITHUB_WORKSPACE" status --porcelain 2>/dev/null); then
              echo "::warning::[heal-worktree] probe git status muet -- etat de l'arbre inconnu, reset applique quand meme (#22722)"
              dirty=""
            fi
            untracked=$(printf '%s\n' "$dirty" | grep -c '^??' || true)
            first_dirty=$(printf '%s\n' "$dirty" | head -n 1)
            if ! git -C "$GITHUB_WORKSPACE" -c safe.directory="$GITHUB_WORKSPACE" reset --hard --quiet; then
              echo "::warning::[heal-worktree] reset --hard a echoue -- le retrecissement sparse peut refuser (#22722)"
            elif [ -n "$dirty" ]; then
              echo "::notice::[heal-worktree] reset --hard effectue -- le job precedent avait laisse un etat sale (${first_dirty}) -- ${untracked} entree(s) non suivie(s) laissee(s) en place -- le retrecissement sparse passe (#22722)"
            fi
          fi
      - name: Checkout (sparse, scripts only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Sweep and route
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS="--orphans-report"
          # Apply only on the scheduled sweep (or a dispatch that explicitly
          # opts in). The default dispatch is a dry run: the report prints,
          # nothing is posted.
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            ARGS="$ARGS --apply-comment 13086"
          fi
          python scripts/pick_idle_grain.py $ARGS
