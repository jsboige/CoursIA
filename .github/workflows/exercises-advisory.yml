name: Exercises Convention Advisory

# The missing ORGAN for the ">= 3 exercises per pedagogical notebook" rule
# (#2161, #8814). The convention (.claude/rules/three-exercises-per-notebook.md)
# and its canonical tool (count_exercises.py) existed, but nothing wired the
# tool to a PR -- the rule relied entirely on reviewer vigilance, which drifts
# silently. This workflow makes a below-threshold notebook VISIBLE on the PR.
#
# ADVISORY, never blocking (issue #8814 acceptance 5): the job ALWAYS exits 0.
# The actionable payload is the `exercises-below-threshold` LABEL, NEVER the
# green conclusion of the job (which is green by construction). A reviewer who
# reads only "exit 0" as "conforming" has read the wrong signal -- the same trap
# that let a non-conforming PR through in #8797.
#
# Per-PR scope (acceptance 1): runs count_exercises.py ONLY on the *.ipynb
# modified by the PR, not a repo-wide scan on every push. The corpus/kind
# classification (setup/Lean exempt, out-of-corpus artifacts) is CONSUMED from
# count_exercises.py, never re-implemented here (acceptance 4) -- the label and
# the canonical tool must not diverge.
#
# Tranche 2 #12817: the per-PR fork guard died with the pull_request trigger
# (false under schedule -> job SKIPPED, organ extinguished). The nocturne
# scans the last-24h window of main; labels are PR-only and noop'd at night.
#
# Promoting to a blocking gate is a separate decision (issue #8814 "Hors
# scope"), to revisit only once the residual is at 0 and stable.

on:
  schedule:
    # Nocturnal sweep -- post-merge main verification.
    # Tranche 1 #12817 : sortir les advisory lourds de pull_request
    # (clone 2.22 Go par run). Stratification user 2026-08-23 :
    # "les jobs lourds devraient être payés une fois par fournée".
    - cron: '12 03 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: exercises-advisory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exercises-advisory:
    name: "Exercises >= 3 advisory (label, non-blocking)"
    # Routage #14283 tranche 4 (ai-01 2026-09-02) : balayage cron pur-Python.
    # Declencheur `schedule` uniquement -- il ne tourne que sur la branche par
    # defaut, donc aucun code de fork ne peut l'atteindre et aucune garde
    # same-repo n'est requise (cf en-tete de check_self_hosted_runner_policy.py).
    # Retour arriere = remettre `runs-on: ubuntu-latest` + retrait de l'allowlist.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          # Need base..head history for `git diff` of changed notebooks.
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Advisory check on modified notebooks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without a git context GH_REPO, `gh pr edit` / `gh label create`
          # cannot infer the target repo and fail silently (variation-tag-guard
          # documented this trap firsthand after #8765).
          GH_REPO: ${{ github.repository }}
          # '' under schedule/dispatch (no PR context) -> nocturne window below.
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          BASE: ${{ github.event.pull_request.base.sha || '' }}
          HEAD: ${{ github.event.pull_request.head.sha || '' }}
          LABEL_BELOW: exercises-below-threshold
          LABEL_UNPARSEABLE: exercises-unparseable
          LABEL_CREDITED_LOST: credited-examples-lost
        run: |
          set -uo pipefail

          # ---- Nocturne window (#12817 tranche 2) ----
          # Under schedule/dispatch there is no PR: BASE is empty. Resolve the
          # last 24 h of main so the sweep measures the day's merged apport.
          # Labels are PR-only -- noop'd when there is no PR to label; the
          # nocturne payload is the annotations + RESULT line below.
          NOCTURNE=0
          if [ -z "${BASE:-}" ]; then
            NOCTURNE=1
            BASE=$(git rev-list -1 --before="24 hours ago" HEAD)
            [ -n "$BASE" ] || BASE=$(git rev-list --max-parents=0 HEAD | tail -1)
            HEAD=$(git rev-parse HEAD)
            PR_NUMBER=""
            echo "Nocturne window: $(git rev-parse --short "$BASE")..$(git rev-parse --short "$HEAD") (24 h of main)"
          fi

          # Added/modified *.ipynb in the PR (deletions excluded -- a deleted
          # notebook has nothing to count).
          # 3-point diff (#10403): merge-base...HEAD -- strictly this PR's apport.
          git diff --name-only --diff-filter=d "$BASE...$HEAD" -- '*.ipynb' \
            | grep -v $'\r$' > changed_ipynb.txt || true
          COUNT=$(wc -l < changed_ipynb.txt | tr -d ' ')
          echo "Modified *.ipynb in this PR: $COUNT"

          # Helper: ensure a label exists (idempotent), then add/remove it.
          ensure_label() {
            gh label create "$1" --description "$2" --color "$3" --force || true
          }
          set_label() { gh pr edit "$PR_NUMBER" --add-label "$1" || true; }
          unset_label() { gh pr edit "$PR_NUMBER" --remove-label "$1" 2>/dev/null || true; }
          if [ "$NOCTURNE" -eq 1 ]; then
            # No PR to label at night: the signal stays in the run output.
            ensure_label() { true; }
            set_label()   { true; }
            unset_label() { true; }
          fi

          if [ "$COUNT" -eq 0 ]; then
            echo "No modified notebooks to check."
            unset_label "$LABEL_BELOW"; unset_label "$LABEL_UNPARSEABLE"
            exit 0
          fi

          # Advisory: ALWAYS exit 0. The job never fails; the actionable signal
          # is the pair of LABELS decided from the JSON payload below.
          # #18761 -- credited examples diff needs --base + --pr-body-file so
          # the diff is measured against THIS PR (not skipped). The default
          # (no --base) skips the diff (preserves backward compat).
          PR_BODY_FILE=""
          if [ -n "${PR_NUMBER:-}" ]; then
            PR_BODY_FILE=$(mktemp)
            gh pr view "$PR_NUMBER" --json body -q .body > "$PR_BODY_FILE" 2>/dev/null || echo "" > "$PR_BODY_FILE"
          fi
          if [ -n "${BASE:-}" ] && [ -n "${PR_BODY_FILE:-}" ] && [ -s "$PR_BODY_FILE" ]; then
            python scripts/notebook_tools/check_pr_exercises.py --json --stdin \
              --base "$BASE" --pr-body-file "$PR_BODY_FILE" \
              < changed_ipynb.txt > payload.json
          else
            python scripts/notebook_tools/check_pr_exercises.py --json --stdin \
              < changed_ipynb.txt > payload.json
          fi
          cat payload.json

          SUB=$(python -c "import json; print(json.load(open('payload.json'))['summary']['below_threshold'])")
          PARSE=$(python -c "import json; print(json.load(open('payload.json'))['summary']['unverified'])")
          CREDITED_LOST=$(python -c "import json; print(json.load(open('payload.json'))['summary'].get('credited_lost_unexempted', 0))")
          CREDITED_DIFF_ERRORS=$(python -c "import json; print(json.load(open('payload.json'))['summary'].get('credited_diff_errors', 0))")
          echo "Below-threshold notebooks: $SUB"
          echo "Unverified (parse errors): $PARSE"
          echo "Credited examples lost (unexempted): $CREDITED_LOST"
          echo "Credited-diff errors: $CREDITED_DIFF_ERRORS"

          # Issue #8819: TWO distinct labels. "Could not measure" (unparseable)
          # and "measured, below threshold" call for different reactions, so they
          # never collapse into one. Each label is raised when its count > 0 and
          # cleared otherwise (a stale label from an earlier push must not stick).
          ensure_label "$LABEL_BELOW" \
            "A modified notebook is below the >=3 exercises convention (#2161)" "D93F0B"
          ensure_label "$LABEL_UNPARSEABLE" \
            "A modified notebook could not be parsed -- NOT verified (#8819)" "BFD4F2"
          # #18761 — credited-examples-lost: pose UNIQUEMENT si tous les
          # credited-diff ont reussi (CREDITED_DIFF_ERRORS == 0). Une erreur
          # de diff ne fait PAS poser le label (c'est l'advisory
          # diff-error-not-blocked qui porte le signal a la place).
          ensure_label "$LABEL_CREDITED_LOST" \
            "A credited example was lost in this PR without a 'exemples-loss:' declaration (#18740, #18761)" "FBCA04"

          # Review #8820 (Blocage 3): if check_pr_exercises.py died (truncated
          # JSON, ImportError, OOM), payload.json is unreadable, the two
          # python -c above fail, and SUB/PARSE are not integers. With only
          # `set -uo pipefail` (no -e), each `[ "" -gt 0 ]` below exits rc=2 --
          # which falls into the else branch, UNSETS both labels, and asserts
          # verified conformity on a measurement that never happened. That is
          # this PR's own defect (#8819) one layer down: #8816 said "all meet
          # threshold" when ONE notebook was unreadable; this branch would say
          # "all meet threshold (verified)" when NOTHING was read. `[ "$x" -eq
          # "$x" ]` succeeds only for an integer, so its negation is true when
          # the payload is illisible. NOT measured => NOT verified: pose the
          # unparseable label and a loud ::error::, never a green claim.
          if ! [ "${SUB:-}" -eq "${SUB:-}" ] 2>/dev/null \
             || ! [ "${PARSE:-}" -eq "${PARSE:-}" ] 2>/dev/null; then
            echo "::error::exercises payload illisible (check_pr_exercises.py produced no usable JSON) -- the gate measured NOTHING; conformity neither claimed nor denied."
            set_label "$LABEL_UNPARSEABLE"
            exit 0
          fi
          # #18761 -- meme garde pour CREDITED_LOST et CREDITED_DIFF_ERRORS :
          # un payload illisible ne pose AUCUN label credited-examples-lost.
          if ! [ "${CREDITED_LOST:-}" -eq "${CREDITED_LOST:-}" ] 2>/dev/null \
             || ! [ "${CREDITED_DIFF_ERRORS:-}" -eq "${CREDITED_DIFF_ERRORS:-}" ] 2>/dev/null; then
            echo "::warning::credited-diff payload illisible -- label $LABEL_CREDITED_LOST NOT raised (diff measurement never happened)."
            unset_label "$LABEL_CREDITED_LOST"
            CREDITED_LOST=0
            CREDITED_DIFF_ERRORS=0
          fi

          if [ "$SUB" -gt 0 ]; then
            if [ "$NOCTURNE" -eq 1 ]; then
              echo "::notice::$SUB notebook(s) below the >=3 exercises convention merged in the last 24 h (#2161)."
            else
              echo "::notice::$SUB modified notebook(s) below the >=3 exercises convention (#2161). See the '$LABEL_BELOW' label."
            fi
            set_label "$LABEL_BELOW"
          else
            unset_label "$LABEL_BELOW"
          fi

          if [ "$PARSE" -gt 0 ]; then
            if [ "$NOCTURNE" -eq 1 ]; then
              echo "::warning::$PARSE notebook(s) in the last-24h window could not be parsed -- NOT verified by the exercises gate (#8819)."
            else
              echo "::warning::$PARSE modified notebook(s) could not be parsed -- NOT verified by the exercises gate (#8819). See the '$LABEL_UNPARSEABLE' label."
            fi
            set_label "$LABEL_UNPARSEABLE"
          else
            unset_label "$LABEL_UNPARSEABLE"
          fi

          # #18761 -- credited-examples-lost label. On le pose UNIQUEMENT
          # si TOUS les credited-diff ont reussi (CREDITED_DIFF_ERRORS == 0)
          # ET qu'au moins un exemple credit-e a ete perdu sans exemption.
          # Si le diff a echoue, on log un warning sans poser le label --
          # le silence a ce niveau serait la repetition du piege fondateur
          # (perte silencieuse de 3 exemples credites a #18553).
          if [ "$CREDITED_DIFF_ERRORS" -gt 0 ]; then
            echo "::warning::$CREDITED_DIFF_ERRORS notebook(s) had a credited-diff error -- label $LABEL_CREDITED_LOST NOT raised (false-zero trap avoided, #18761)."
            unset_label "$LABEL_CREDITED_LOST"
          elif [ "$CREDITED_LOST" -gt 0 ]; then
            if [ "$NOCTURNE" -eq 1 ]; then
              echo "::warning::$CREDITED_LOST credited example(s) lost in the last-24h window without 'exemples-loss:' declaration (#18740)."
            else
              echo "::warning::$CREDITED_LOST credited example(s) lost without 'exemples-loss:' declaration (#18740, #18761). See the '$LABEL_CREDITED_LOST' label."
            fi
            set_label "$LABEL_CREDITED_LOST"
          else
            unset_label "$LABEL_CREDITED_LOST"
          fi

          # The closing line asserts ONLY what was measured (issue #8819). The
          # job never claims "all conform" while unverified > 0 -- that was the
          # original defect (a gate that reassures while the true state sleeps).
          if [ "$PARSE" -gt 0 ]; then
            echo "RESULT: $PARSE notebook(s) NOT verified (parse error) -- conformity neither claimed nor denied."
          elif [ "$SUB" -gt 0 ]; then
            echo "RESULT: $SUB notebook(s) below threshold -- labelled."
          elif [ "$CREDITED_DIFF_ERRORS" -gt 0 ]; then
            echo "RESULT: $CREDITED_DIFF_ERRORS notebook(s) had credited-diff error -- label NOT raised (false-zero avoided, #18761)."
          elif [ "$CREDITED_LOST" -gt 0 ]; then
            echo "RESULT: $CREDITED_LOST credited example(s) lost without exemption -- labelled."
          else
            echo "RESULT: all in-corpus modified notebooks meet their threshold (verified)."
          fi
          exit 0

      - name: Credited-examples sweep over the day's merged PRs (nocturne)
        # #19101 -- l'etape precedente porte la branche « exemples credites »
        # de #18761, mais elle est DORMANTE sous `schedule` : le diff exige
        # `--base` ET `--pr-body-file`, et le mode nocturne n'a pas de contexte
        # PR, donc pas de body. Le test de l'etape (l.136) echouait, la branche
        # `else` sans `--base` etait prise, et le diff n'etait **jamais**
        # mesure : le label `credited-examples-lost` ne pouvait pas etre pose.
        #
        # Ce balayage le reveille SANS reintroduire `pull_request` sur ce
        # workflow (interdit : le clone par PR est la motivation de #12817
        # tranche 1). Il rejoue le diff apres coup, PR par PR, avec SA base et
        # SON body -- option 1 de #19101, assumee post-mortem.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Le masque `|| echo "::warning::..."` est RETIRE (review #19215,
          # point 3) : un plantage permanent laissait le run vert chaque nuit
          # -- exactement la classe de defaut de #19214 (35 jours verts sans
          # rapport). Le contrat de l'organe reste : ses pannes ATTENDUES
          # (refs absentes, body illisible, plafond atteint) sont nommees en
          # [WARN] et le script sort 0 ; ce qui ROUGIT ici est l'imprevu
          # (traceback, crash) -- jamais masque. Sans effet merge : la mesure
          # du body de #19214 vaut aussi pour ce workflow (schedule/dispatch
          # seulement, hors du perimetre `merge_dwell`).
          python scripts/notebook_tools/credited_examples_sweep.py \
            --hours 24 --apply
