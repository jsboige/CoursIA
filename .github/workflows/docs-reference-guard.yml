name: docs-reference-guard

# Lane perenne docs/ (sens reference vivante) + plancher de couverture (#14623,
# sens perenne -- miroir de docs-transients-guard pour la direction perenne).
#
# Doctrine : un document de reference vivante porte l'en-tete
# "> REFERENCE - vivante - derniere revision <date>", et cette date est lue
# dans l'historique git (git log -1), jamais recopiee. L'organe
# scripts/check_docs_reference_lane.py verifie deux sens : l'integrite (la date
# de l'en-tete concorde avec la derniere revision du fichier) et un plancher de
# couverture monotone (le nombre de docs balises ne descend pas sous la vague
# initiale). Meme modele que docs-transients-guard et prose-counts-guard :
# l'echec du check-run EST le signalement, visible sans ouvrir les logs.
#
# Convention complete : docs/transients/README.md (section "Sens perenne").

on:
  pull_request:
    paths:
      - 'docs/**/*.md'
      - 'scripts/check_docs_reference_lane.py'

permissions:
  contents: read

concurrency:
  group: docs-reference-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    # GitHub-hosted : la politique d'isolation des runners
    # (scripts/ci/check_self_hosted_runner_policy.py) n'admet un job
    # self-hosted que si son workflow figure dans
    # SELF_HOSTED_WORKFLOW_ALLOWLIST, chaque entree citant la lane
    # proprietaire du deploiement. Ce workflow n'y figure pas, et l'y ajouter
    # est une decision coordinateur -- pas un effet de bord d'une PR de garde.
    # Defaut mesure : en [self-hosted, coursia-ephemeral, coursia-linux], ce
    # job rougissait `Always-on guards` (VIOLATION WORKFLOW_NOT_ALLOWED) sur
    # chaque PR touchant `docs/**/*.md`.
    # La garde same-repo ci-dessous reste : elle preserve le contrat si le job
    # est route un jour vers la jambe Linux (#13378), et ne coute rien ici.
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 -- convention des gardes git-aware du depot
          # (scripts-tests.yml : catalog-cron / catalog-drift / cell-order-gate /
          # exercise-leak-ci). Un shallow (2) fait apparaitre le commit de
          # boundary comme touchant TOUS les fichiers (diff contre le parent
          # greffe) : `git log -1` rend alors une date fabriquee pour les docs
          # que la PR ne touche pas, et la garde rougit x9 hors perimetre.
          # Mesure et repro : review structurelle de #22527.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lane perenne et plancher de couverture
        run: python scripts/check_docs_reference_lane.py
