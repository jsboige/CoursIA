name: Slides Composition Advisory

# Garde-fou CI de composition des slides (#11923) — MESURE RENDUE, ADVISORY.
# Mesure géométrique (HORS_CANVAS / CHEVAUCHEMENT / OCCUPATION) sur le deck
# servi headless : ce que le markdown REND à 980×552, pas ce qu'il dit.
# Complète slides-build-advisory.yml (qui prouve que le deck CONSTRUIT) :
# ici on prouve ce que la construction produit.
#
# La spec est explicite (directive user 2026-08-20) : le bon positionnement
# des images est une composition esthétique — les garde-fous CI bornent le
# mécanisable (débordement, chevauchement, occupation), le JUGEMENT de
# composition reste à une lane qui voit (ai-01 / MiniMax). Une PR verte à ce
# gate reste soumise au QA visuel humain : le tool imprime cette borne dans
# chaque rapport. `APPROVED` malgré une slide signalée par ce gate sans
# verdict visuel = revoir pr-review-discipline §H.
#
# ADVISORY, jamais bloquant sur les constats : les findings sortent en
# ::warning file=,line= (annotations de PR), exit 0. Exit 1 uniquement sur
# META-défaillance du gate lui-même — quatre causes, même classe (#8807 trap 1,
# « un gate qui énumère zéro cible est vert et muet ») :
#   (a) zéro deck découvert alors que slides/ a changé ;
#   (b) binaire slidev introuvable — aucun deck n'est mesurable ;
#   (c) deck découvert mais serveur jamais prêt — ce deck n'est PAS mesuré ;
#   (d) contrôle positif NON signalé — la fixture dédiée doit rougir, sinon
#       l'instrument est mort et « 0 constat » sur les decks ne prouve rien
#       (#15545 : un scanner mort rendait le même vert, ex glyphBBox v1
#       sur #15381 — branche image jamais atteinte, signal à 0 à vie).
# (b) et (c) sont ajoutées après coup (#12147) : le gate a rendu trois verts
# les 20-21/08 sans mesurer une seule slide — chemin node_modules faux d'un
# niveau, puis warning + continue + exit 0. Un vert qui n'a rien mesuré est
# indiscernable d'un vert qui n'a rien trouvé : c'est ce que ces causes
# séparent.
#
# Le contrôle positif CI s'appuie sur la fixture committée
# slides/_composition-control (défaut HORS_CANVAS déterministe slide 2,
# indépendant des fontes) — aucun objet git requis. Le contrôle local
# historique (slide 5 S3-acculturation @ 6cabc826b via
# run_composition_control.py) reste valable : il vérifie en plus le rendu
# du thème réel sur un deck de production au commit fondateur.

on:
  schedule:
    # Nocturnal sweep -- post-merge main verification.
    # Tranche 1 #12817 : sortir les advisory lourds de pull_request
    # (clone 2.22 Go par run). Stratification user 2026-08-23 :
    # "les jobs lourds devraient être payés une fois par fournée".
    - cron: '21 03 * * *'
  workflow_dispatch: {}
permissions:
  contents: read

concurrency:
  group: slides-composition-advisory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slides-composition-advisory:
    name: "Slidev composition advisory (#11923, non-blocking)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (blobless, sparse slides)
        uses: actions/checkout@v4
        with:
          # base..head pour le diff des decks touchés + contenu slides/ seul —
          # clone partiel (série #11843) : blob:none suffit, pas d'historique
          # de contenu hors slides/.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            slides
            scripts/notebook_tools

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache slides node_modules
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: slides/node_modules
          key: slides-node_modules-${{ runner.os }}-${{ hashFiles('slides/package-lock.json') }}

      - name: Install Slidev deps
        working-directory: slides
        run: |
          if [ "${{ steps.cache-nm.outputs.cache-hit }}" = "true" ] && [ -d node_modules/@slidev ]; then
            echo "node_modules cache hit -- skipping install"
          else
            npm ci --no-audit --no-fund
          fi

      - name: Install Playwright (chromium)
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Measure composition of impacted decks (advisory)
        env:
          # '' under schedule/dispatch (no PR context) -> nocturne window below.
          BASE: ${{ github.event.pull_request.base.sha || '' }}
          HEAD: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -uo pipefail
          # #12173 — neutralize errexit ajoutée par le shell wrapper GitHub
          # (`bash --noprofile --norc -eo pipefail {0}`). Sans ce « set +e »,
          # les commandes légitimement non-zéro (kill $PID 2>/dev/null,
          # tail d'un log en cours d'écriture) ferment le script AVANT
          # qu'on ait pu écrire l'annotation ::error qui le justifie. Le gate
          # est alors rouge ET muet -- exactement le défaut que les trois
          # annotations de #12151 viennent documenter. L'erreur n'est pas
          # supprimée : on l'annote explicitement, on en fait META_FAIL.
          set +e

          # ---- Nocturne window (#12817 tranche 2) ----
          # Under schedule/dispatch there is no PR: BASE is empty. Resolve the
          # last 24 h of main so the sweep measures the decks impacted by the
          # day's merged apport. Sans ce bloc, le diff ""..."" rendait CHANGED
          # vide -> "Aucun deck impacté" vert chaque nuit (organe éteint).
          if [ -z "${BASE:-}" ]; then
            BASE=$(git rev-list -1 --before="24 hours ago" HEAD)
            [ -n "$BASE" ] || BASE=$(git rev-list --max-parents=0 HEAD | tail -1)
            HEAD=$(git rev-parse HEAD)
            echo "Nocturne window: $(git rev-parse --short "$BASE")..$(git rev-parse --short "$HEAD") (24 h of main)"
          fi

          echo "## Slides composition (advisory #11923)" >> "$GITHUB_STEP_SUMMARY"
          echo "Plancher mécanique — ne remplace pas le QA visuel humain." >> "$GITHUB_STEP_SUMMARY"

          # ---- decks touchés : le deck dont le dir a changé, ou TOUS si infra partagée ----
          CHANGED=$(git diff --name-only "$BASE...$HEAD" -- slides/ || true)
          if grep -qE 'slides/(theme-ia101|package(-lock)?\.json)' <<< "$CHANGED"; then
            # _composition-control est la fixture du contrôle positif (#15545) :
            # son défaut est DÉLIBÉRÉ — la scanner comme un deck réel ne produirait
            # que du bruit.
            MAPS=$(find slides -name slides.md -not -path '*/node_modules/*' -not -path '*/archive/*' -not -path '*/_composition-control/*')
          else
            # Découverte par DIR (intention du commentaire ci-dessus) : un diff qui
            # touche slides/<dir>/ via son jumeau Marp (slides.marp.md), analysis/
            # ou images/ impacte le deck Slidev du dir même si slides.md lui-même
            # n'est pas dans le diff. L'ancien grep fichier-exact faisait sortir
            # trap 1 (meta-failure) sur ces diffs dir-seulement.
            DIRS=$(grep -oE '^slides/[^/]+/' <<< "$CHANGED" | grep -v '^slides/_composition-control/' | sort -u || true)
            MAPS=$(for d in $DIRS; do [ -f "${d}slides.md" ] && printf '%s\n' "${d}slides.md"; done)
          fi

          # Le binaire vit dans slides/node_modules : npm ci tourne avec
          # working-directory: slides, et le cache porte sur slides/node_modules.
          # Chemin ABSOLU -- un relatif depuis $DIR suppose une profondeur de deck
          # que la branche `find` ci-dessus ne garantit pas.
          SLIDEV_BIN="$PWD/slides/node_modules/.bin/slidev"
          if [ ! -x "$SLIDEV_BIN" ]; then
            echo "::error title=Composition gate meta-failure::binaire slidev introuvable a $SLIDEV_BIN -- aucun deck ne peut etre mesure"
            exit 1
          fi

          META_FAIL=0
          PORT=8890
          # #14226 — manifeste deck→report : pour que le PR-relay léger puisse
          # relier un deck path (diff Git) à son verdict persisté sans connaître
          # le port éphémère. On écrit ce manifeste sous _comp_reports/_manifest.tsv
          # (deck_path<TAB>report_path_relatif) au fil de la boucle.
          COMP_OUT_DIR="$(pwd)/_comp_reports"
          mkdir -p "$COMP_OUT_DIR"
          MANIFEST="$COMP_OUT_DIR/_manifest.tsv"
          : > "$MANIFEST"
          # #12173 — budget d'attente JUSTIFIÉ par une mesure, pas doublé au jugé.
          # 30 itérations × 3s = 90s mesuré sur runner froid ubuntu-24.04 2026-08-21
          # (run 32529093236 : premier 200 sur `slidev dev` à ~70-90s ; 30 laisse
          # une marge honnête, ne confond pas un bundling lent avec un serveur mort).
          WAIT_MAX_ITER=30
          WAIT_PERIOD=3
          TOTAL_WAIT_BUDGET_S=$((WAIT_MAX_ITER * WAIT_PERIOD))
          echo "Budget d'attente par deck : ${TOTAL_WAIT_BUDGET_S}s (mesuré ~70-90s sur runner ubuntu-24.04)." >> "$GITHUB_STEP_SUMMARY"

          # ---- Contrôle positif : la fixture DOIT rougir (#15545) ----
          # Avant de mesurer les vrais decks, on prouve que l'instrument
          # mesure : la slide 2 de slides/_composition-control porte un
          # défaut HORS_CANVAS déterministe (p en absolu top:600px sur
          # canvas 552px — indépendant des fontes et du thème). Un scanner
          # mort (chemin de flagging cassé, ex glyphBBox v1 sur #15381)
          # rendrait « 0 constat » partout : indistinguable d'un vert honnête.
          # C'est la seule condition où un advisory a le droit d'être
          # bruyant : elle ne dit rien des decks, tout de l'instrument.
          CTRL_DIR=slides/_composition-control
          CTRL_PORT=8899
          cp "$CTRL_DIR/slides.md" "$CTRL_DIR/dev.md"
          (cd "$CTRL_DIR" && "$SLIDEV_BIN" dev.md --port "$CTRL_PORT" --open false \
             > /tmp/slidev_$CTRL_PORT.log 2>&1) &
          CTRL_PID=$!
          CTRL_READY=0
          for i in $(seq 1 "$WAIT_MAX_ITER"); do
            curl -sf "http://localhost:$CTRL_PORT/" > /dev/null && CTRL_READY=1 && break
            sleep "$WAIT_PERIOD"
          done
          CTRL_SCAN_EXIT=99
          if [ "$CTRL_READY" -ne 1 ]; then
            echo "::error title=Composition gate meta-failure::contrôle positif : serveur slidev de la fixture jamais prêt en ${TOTAL_WAIT_BUDGET_S}s -- instrument NON VALIDÉ, mesure des decks éventuels SANS GARANTIE"
            echo "Contrôle positif : fixture jamais servie -- instrument non validé." >> "$GITHUB_STEP_SUMMARY"
            tail -40 "/tmp/slidev_$CTRL_PORT.log" 2>/dev/null || true
            META_FAIL=1
          else
            python scripts/notebook_tools/scan_slidev_composition.py \
              --url "http://localhost:$CTRL_PORT/" \
              --slides-md "$CTRL_DIR/slides.md" \
              --baseline-slide 2 --baseline-commit fixture \
              --out "$COMP_OUT_DIR/_positive_control.json" > /tmp/scan_$CTRL_PORT.log 2>&1
            CTRL_SCAN_EXIT=$?
            # PASS attendu : exit 1 (constats présents) ET controle_positif=true.
            # exit 2 = baseline NON signalée (scanner mort) ; exit 0 = rien
            # mesuré du tout ; autre = crash.
            CTRL_OK=$(python - "$COMP_OUT_DIR/_positive_control.json" <<'PYEOF'
          import json, sys
          try:
              d = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("unreadable"); sys.exit(0)
          print("ok" if d.get("controle_positif_ok") is True else "ko")
          PYEOF
          )
            if [ "$CTRL_SCAN_EXIT" -eq 1 ] && [ "$CTRL_OK" = "ok" ]; then
              echo "Contrôle positif PASS : la slide baseline de la fixture est signalée (HORS_CANVAS déterministe)." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error title=Composition gate meta-failure::contrôle positif NON signalé (scanner exit $CTRL_SCAN_EXIT, controle_positif=$CTRL_OK) -- instrument suspect, la mesure des decks qui suit est SANS GARANTIE (#8807 trap 1)"
              echo "Contrôle positif FAIL : instrument suspect (exit $CTRL_SCAN_EXIT, controle_positif=$CTRL_OK)." >> "$GITHUB_STEP_SUMMARY"
              tail -40 "/tmp/scan_$CTRL_PORT.log" 2>/dev/null || true
              META_FAIL=1
            fi
          fi
          rm -f "$CTRL_DIR/dev.md"
          kill "$CTRL_PID" 2>/dev/null || true

          if [ -z "$MAPS" ]; then
            if [ -n "$CHANGED" ]; then
              echo "::error title=Composition gate meta-failure::slides/ a changé mais aucun deck slides.md découvert dans le diff — gate muet, à investiguer (#8807 trap 1)"
              exit 1
            fi
            echo "Aucun deck impacté." >> "$GITHUB_STEP_SUMMARY"
            # #15545 — même sans deck à mesurer, un instrument mort doit se
            # voir : le contrôle positif a tourné ci-dessus ; s'il a failé on
            # rougit malgré l'absence de decks.
            if [ "$META_FAIL" -ne 0 ]; then
              exit 1
            fi
            exit 0
          fi

          for MD in $MAPS; do
            DIR=$(dirname "$MD")
            PORT=$((PORT+1))
            echo "### $MD" >> "$GITHUB_STEP_SUMMARY"
            cp "$MD" "$DIR/dev.md"
            (cd "$DIR" && "$SLIDEV_BIN" dev.md --port "$PORT" --open false \
               > /tmp/slidev_$PORT.log 2>&1) &
            SLIDEV_PID=$!
            DECK_START_S=$(date +%s)
            for i in $(seq 1 "$WAIT_MAX_ITER"); do
              curl -sf "http://localhost:$PORT/" > /dev/null && break
              sleep "$WAIT_PERIOD"
            done
            DECK_WAIT_S=$(($(date +%s) - DECK_START_S))
            if ! curl -sf "http://localhost:$PORT/" > /dev/null; then
              # Un deck DECOUVERT mais NON MESURE est une meta-defaillance au meme
              # titre que « zero deck decouvert » (#8807 trap 1) : dans les deux cas
              # le gate est vert et muet, indiscernable d'un deck sain. Il rougit
              # donc, et imprime sa cause au lieu de la laisser dans /tmp.
              echo "::error title=Composition gate meta-failure::$MD decouvert mais serveur slidev jamais pret en ${DECK_WAIT_S}s / budget ${TOTAL_WAIT_BUDGET_S}s -- deck NON MESURE"
              echo "Serveur jamais pret en ${DECK_WAIT_S}s / budget ${TOTAL_WAIT_BUDGET_S}s -- deck NON MESURE (meta-defaillance)." >> "$GITHUB_STEP_SUMMARY"
              echo "--- tail /tmp/slidev_$PORT.log ---"
              tail -40 "/tmp/slidev_$PORT.log" 2>/dev/null || echo "(aucun log serveur)"
              META_FAIL=1
              rm -f "$DIR/dev.md"; kill "$SLIDEV_PID" 2>/dev/null || true; continue
            fi
            # #14226 — nom de fichier déterministe par deck (pas par port
            # éphémère). `slides/S3-acculturation/slides.md` →
            # `_comp_reports/slides_S3-acculturation_slides.md.json`.
            SAFE_STEM=$(echo "$MD" | tr '/' '_')
            DECK_REPORT="$COMP_OUT_DIR/${SAFE_STEM}.json"
            python scripts/notebook_tools/scan_slidev_composition.py \
              --url "http://localhost:$PORT/" \
              --slides-md "$MD" \
              --github-annotations \
              --out "$DECK_REPORT" > /tmp/scan_$PORT.log 2>&1
            SCAN_EXIT=$?
            # --github-annotations ecrit sur STDOUT ; la redirection ci-dessus les
            # enterre dans /tmp, ou GitHub ne les lit jamais -- le gate mesurait
            # sans jamais annoter. On les rejoue ici, ce que l'acceptance de #11923
            # demande explicitement (« file=,line= exploitable en annotation CI »).
            # grep APRES l'affectation de SCAN_EXIT : un pipe rendrait le statut du
            # dernier maillon, pas celui du scanner.
            grep -E '^::(warning|error) ' "/tmp/scan_$PORT.log" || true
            # Manifeste deck→report : le PR-relay peut ainsi résoudre un deck
            # touché par le diff vers son verdict persisté sans connaître le port.
            printf '%s\t%s\n' "$MD" "${SAFE_STEM}.json" >> "$MANIFEST"
            python - "$MD" "$DECK_REPORT" "$SCAN_EXIT" >> "$GITHUB_STEP_SUMMARY" <<'PYEOF'
          import json, sys
          md, rp, exit_code = sys.argv[1], sys.argv[2], int(sys.argv[3])
          try:
              d = json.load(open(rp, encoding="utf-8"))
          except Exception as e:
              print(f"- instrument: report illisible ({e}) — meta-failure")
              sys.exit(0)
          print(f"- {d.get('n_slides')} slides mesurées : {d.get('n_hors_canvas')} hors-canvas, "
                f"{d.get('n_chevauchements')} chevauchements, {d.get('n_occupation_flagged')} occupation "
                f"(scanner exit {exit_code}, advisory)")
          if d.get("stale_warnings"):
              print(f"- stale: {len(d['stale_warnings'])} avertissement(s) de mesure")
          PYEOF
            rm -f "$DIR/dev.md"
            kill "$SLIDEV_PID" 2>/dev/null || true
          done
          # Les CONSTATS restent advisory (exit 0) : c'est la doctrine de ce gate.
          # Seule la META-defaillance rougit -- un gate qui n'a PAS mesure doit se
          # distinguer d'un gate qui a mesure et n'a rien trouve.
          if [ "$META_FAIL" -ne 0 ]; then
            # #14226 — on rougit (exit 1), mais le verdict partiel déjà écrit
            # (deck(s) mesuré(s) avant la meta-fail) est conservé sur disque :
            # il sera pickup par l'artefact s'il existe, sinon le prochain
            # run nocturne le régénère. Pas de upload ci-dessous : exit 1.
            exit 1
          fi

          # #14226 — option 1 : persister le verdict. Les reports par-deck
          # ont déjà été écrits sous _comp_reports/<sanitized_deck>.json
          # au fil de la boucle, ainsi que le manifeste _manifest.tsv. On
          # les uploade comme artefact unique `slides-composition-nocturne`
          # (consommé par slides-composition-pr-relay.yml via REST API).
          KEPT=$(find "$COMP_OUT_DIR" -maxdepth 1 -name '*.json' | wc -l)
          echo "Verdict persisté : $KEPT report(s) sous _comp_reports/ (artefact slides-composition-nocturne)." >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload verdict artifact (#14226)
        if: always() && hashFiles('_comp_reports/_manifest.tsv') != ''
        uses: actions/upload-artifact@v4
        with:
          name: slides-composition-nocturne
          path: |
            _comp_reports/_manifest.tsv
            _comp_reports/*.json
          retention-days: 30
          if-no-files-found: ignore

