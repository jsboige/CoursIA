name: Search-MGS-TSP-Tests

# Cablage CI du test du coeur/service TSP (pli 0 v2, #27218, point 4 de
# l'acceptance) : test_mgs_tsp_core.py doit etre reference par un workflow.
# Meme pattern famille que search-automata-tests.yml (#26511 / #26518) -- trigger
# path-reactif propre a la serie, floor de collecte, une famille par PR. Le
# precedent de la serie Search est un workflow dedie, pas scripts-tests.yml
# (monolithe des outils de scripts) : on suit ce precedent.
#
# Bornes mesurees firsthand (worktree CoursIA-mgs-tsp, 2026-11-18) :
#   - `pytest --collect-only -q MyIA.AI.Notebooks/Search/Part4-Metaheuristics` =
#     **22 tests collected** (test_mgs_tsp_core.py seul fichier de test du
#     repertoire).
#   - Deps reelles du test : le coeur est pur Python (stdlib math/random) ; la
#     pile transport ajoute fastapi, httpx, uvicorn (loopback), pytest, pydantic
#     (via fastapi). Aucun appel reseau externe -- le loopback couvre tout.

on:
  push:
    branches: [main]
    paths:
      - 'MyIA.AI.Notebooks/Search/Part4-Metaheuristics/**'
      - '.github/workflows/search-mgs-tsp-tests.yml'
  pull_request:
    types: [opened, synchronize, edited, reopened]
    paths:
      - 'MyIA.AI.Notebooks/Search/Part4-Metaheuristics/**'
      - '.github/workflows/search-mgs-tsp-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: search-mgs-tsp-tests-${{ github.ref }}-${{ github.event.action == 'edited' && github.event.changes.base == null && 'meta-edit' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  search-mgs-tsp-tests:
    name: Search MGS TSP pytest (22 collected)
    if: (github.event.action != 'edited' || github.event.changes.base != null)
    # Forme hybride de debordement (#22461 phase A) -- PR meme-depot ET
    # vars.CI_OVERFLOW_LOCAL == 'true' -> jambe Linux locale ; sinon ubuntu-latest.
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository && vars.CI_OVERFLOW_LOCAL == 'true') && fromJSON('["self-hosted","coursia-ephemeral","coursia-linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      # Floor mesure firsthand -- worktree CoursIA-mgs-tsp, 2026-11-18.
      # Quand des tests sont retires INTENTIONNELLEMENT, ajuster cette valeur
      # dans la meme PR (le message d'erreur du guard la nomme).
      SEARCH_MGS_TSP_TEST_FLOOR: 22

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
          cache: pip

      - name: Install deps (requirements-mgs-tsp.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -r MyIA.AI.Notebooks/Search/Part4-Metaheuristics/requirements-mgs-tsp.txt

      - name: Run Search MGS TSP tests
        run: |
          pytest MyIA.AI.Notebooks/Search/Part4-Metaheuristics --tb=short -v

      # Collection floor-guard (meme semantique que search-automata-tests.yml :
      # detecter pytest vert avec N tests silencieusement disparus du chemin
      # de collecte). Pas de `|| true` : le grep doit pouvoir echouer.
      - name: Collection floor-guard (22)
        if: always()
        run: |
          COLLECTED=$(pytest MyIA.AI.Notebooks/Search/Part4-Metaheuristics --collect-only -q 2>&1 | grep -oE '[0-9]+ tests? collected' | grep -oE '[0-9]+' | head -1)
          if [ -z "$COLLECTED" ]; then
            echo "::error::Le collect-only n'a renvoye aucune ligne 'N tests collected' -- la collecte a plante, c'est probablement une panne d'infra (cf #9387)."
            exit 1
          fi
          if [ "$COLLECTED" -lt "$SEARCH_MGS_TSP_TEST_FLOOR" ]; then
            echo "::error::Collecte en recul : $COLLECTED < floor $SEARCH_MGS_TSP_TEST_FLOOR -- des tests ont disparu du chemin de collecte."
            exit 1
          fi
          echo "Collecte OK : $COLLECTED >= floor $SEARCH_MGS_TSP_TEST_FLOOR"
