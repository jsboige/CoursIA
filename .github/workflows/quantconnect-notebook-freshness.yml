name: QuantConnect notebook freshness

# Durable anti-regression guard for the "ML-Training-Pipeline notebook raises
# FileNotFoundError on a fresh clone" vector (c.290 / issue #11417 / guard
# #11433). A notebook MUST either:
#   (a) reference a path tracked on origin/main (git ls-tree), OR
#   (b) gracefully handle absence (try/except or guard), which we approximate
#       by tolerating GITIGNORED paths.
# Anything else is a MISSING = EXIT 1.
#
# The script (`scripts/check_quantconnect_notebook_freshness.py`) classifies
# each `scripts/results/<X>/...` and `results/<X>/...` reference into:
#   OK         tracked (the SC-validation 12-combos artifacts via `git add -f`)
#   GITIGNORED caught by the catch-all `results/` line in
#              `MyIA.AI.Notebooks/QuantConnect/.gitignore:51`
#   MISSING    neither tracked nor gitignored (the c.290 hazard)
#
# Scope mirror to the precedent exercised by exercise-leak-ci.yml : PR-aware
# paths-trigger (only fires when the guard script, the gate workflow, or a
# ML-Training-Pipeline notebook changes), tracked-only scan.

on:
  pull_request:
    paths:
      - 'MyIA.AI.Notebooks/QuantConnect/ML-Training-Pipeline/**/*.ipynb'
      - 'scripts/check_quantconnect_notebook_freshness.py'
      - 'scripts/tests/test_check_quantconnect_notebook_freshness.py'
      - '.github/workflows/quantconnect-notebook-freshness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantconnect-notebook-freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness-guard:
    name: "QuantConnect ML notebook freshness guard (#11433)"
    # Routage #14283 tranche 3 (decision ai-01 2026-09-02) : jambe Linux
    # auto-hebergee. Le `if:` ci-dessous est la garde anti-fork exigee par
    # scripts/ci/check_self_hosted_runner_policy.py ; un `runs-on` STATIQUE la
    # rend auditable (une expression dynamique leve DYNAMIC_RUNS_ON).
    # Les PRs de fork sautent le job -- pr_gate.py compte `skipped` comme OK.
    # 2026-10-27 (mesure ai-01) : migration vers `ubuntu-latest` par Q35 etape 2
    # (#17397) -- `scripts/ci/audit_self_hosted_needs.py` certifie ce workflow
    # comme n'ayant besoin de RIEN qui n'existe que sur le parc local, et le parc
    # local etait sature PAR SES CHECKOUTS (mesure 00:45Z : 11 des 12 slots
    # occupes dans `actions/checkout`, 614 runs en file). La garde anti-fork
    # ci-dessous est CONSERVEE : aucun code de fork ne change de surface.
    # 2026-10-27 (#22461, phase A) : forme hybride de debordement -- PR
    # meme-depot ET vars.CI_OVERFLOW_LOCAL == 'true' -> jambe Linux locale ;
    # tout le reste (variable absente ou fausse, forks, push/schedule/
    # dispatch) retombe sur ubuntu-latest (l'etat du 27/10). Bascule :
    # `gh variable set CI_OVERFLOW_LOCAL --body true|false --repo jsboige/CoursIA`.
    # Retour arriere = variable a `false` ou supprimee : routage 100 %
    # heberge, sans toucher ce fichier. Limite : runs-on se resout a la
    # creation du job, les runs deja en file ne bougent pas.
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository && vars.CI_OVERFLOW_LOCAL == 'true') && fromJSON('["self-hosted","coursia-ephemeral","coursia-linux"]') || 'ubuntu-latest' }}
    # #22954 : borne explicite. Mesure du 2026-10-29 sur les 4 derniers
    # runs verts de ce job : max 1.1 min. Marge large (le defaut
    # d'Actions est 6 h, et un job fige tient son slot tout ce temps).
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run freshness guard
        run: |
          python scripts/check_quantconnect_notebook_freshness.py
        continue-on-error: false

      - name: Run guard unit tests
        run: |
          python -m pip install --quiet pytest pytest-cov
          python -m pytest scripts/tests/test_check_quantconnect_notebook_freshness.py -v
        continue-on-error: false