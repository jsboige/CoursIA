name: EPIC neglect sweep

# Issue #13653. Mandate (user, 2026-08-30): no EPIC left behind. Measured
# firsthand the same morning: the picker's draw IS varied, but 13/28 open
# EPICs had no merged PR citing them over the 48 h window -- and nothing
# renders that neglect visible between two draws. A lane that does not draw
# this EPIC this cycle has no way to see it falling behind.
#
# Same mold as GRAIN-ORPHANS-SWEEP (#13086): a daily workflow recomputes a
# list that is invisible between two manual looks, and upserts ONE
# marker-guarded comment on the rendez-vous issue (#13653). ADVISORY, never
# blocking: the job always exits 0, closes nothing, assigns nothing -- it
# NAMES, the coordinator slices (G.9: read the EPIC body before concluding).
#
# "Never blocking" porte sur le VERDICT, pas sur la capacite de l'organe a
# publier (#19211). Un echec d'ECRITURE qui persiste (>= 2 jours sans
# publication alors que le balayage est quotidien) sort en 2 et rougit le
# run : sans ca, cet organe est reste vert 35 jours d'affilee sans jamais
# publier son rapport, et rien nulle part ne le disait. Rougir ici ne bloque
# aucun merge : merge_dwell ne surveille que scripts-tests.yml en
# `event=push`, et ce workflow ne tourne qu'en `schedule`/`dispatch`.
#
# Standalone organ by design: the picker selects a grain FOR a lane; this
# sweep measures EPIC neglect FLEET-wide -- different cadence, different
# consumer, no picker state.

on:
  schedule:
    # Daily, off-:00 minute (anti-stampede), staggered vs the 07:23
    # grain-orphans sweep. 08:37 UTC.
    - cron: '37 8 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Upsert the marker-guarded comment on #13653 (default: dry-run)'
        required: false
        type: boolean
        default: false

permissions:
  issues: write
  contents: read

concurrency:
  group: epic-neglect-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: "Name EPICs no merged PR cites lately (advisory)"
    # Routage #14283 tranche 4 (ai-01 2026-09-02) : balayage cron pur-Python.
    # Declencheur `schedule` uniquement -- il ne tourne que sur la branche par
    # defaut, donc aucun code de fork ne peut l'atteindre et aucune garde
    # same-repo n'est requise (cf en-tete de check_self_hosted_runner_policy.py).
    # Retour arriere = remettre `runs-on: ubuntu-latest` + retrait de l'allowlist.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    # #23349 : borne explicite. Mesure du 2026-11-09 sur les 3 derniers runs
    # verts de ce job : max 15.58 min. Marge x2 -- le defaut d'Actions est
    # 6 h, et un job fige tient son slot tout ce temps.
    timeout-minutes: 35
    steps:
      # 2026-10-27 (#22722) : la commande qui echoue est le `git checkout --force -B`
      # final d'actions/checkout, pas son clean/reset interne (run 40476005592 :
      # clean et reset passent, "HEAD is now at eb8ab03489", puis le checkout
      # refuse le carnet JEPA "not uptodate; will not remove from working tree").
      # Ce refus est la verification de retrait du retrecissement sparse
      # (apply_sparse_checkout, WARNING_SPARSE_NOT_UPTODATE_FILE, git 2.43.0) :
      # a blob inchange, elle compare le fichier au blob de l'index ; ni --force
      # ni le reset interne ne la contournent. Mitigation EMPIRIQUE, mecanisme
      # NON TRANCHE : sur git 2.43.0 tout etat residuel reproduit localement est
      # deja nettoye par le clean+reset du built-in (ce step rejoue la meme
      # commande, sans effet ajoute), et l'etat qui a survecu a son reset n'est
      # pas reproduit (mutation entre reset et checkout ? checkout interrompu ?).
      - name: Restore the warm work tree before the sparse checkout
        run: |
          set -u
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            if ! dirty=$(git -C "$GITHUB_WORKSPACE" -c safe.directory="$GITHUB_WORKSPACE" status --porcelain 2>/dev/null); then
              echo "::warning::[heal-worktree] probe git status muet -- etat de l'arbre inconnu, reset applique quand meme (#22722)"
              dirty=""
            fi
            untracked=$(printf '%s\n' "$dirty" | grep -c '^??' || true)
            first_dirty=$(printf '%s\n' "$dirty" | head -n 1)
            if ! git -C "$GITHUB_WORKSPACE" -c safe.directory="$GITHUB_WORKSPACE" reset --hard --quiet; then
              echo "::warning::[heal-worktree] reset --hard a echoue -- le retrecissement sparse peut refuser (#22722)"
            elif [ -n "$dirty" ]; then
              echo "::notice::[heal-worktree] reset --hard effectue -- le job precedent avait laisse un etat sale (${first_dirty}) -- ${untracked} entree(s) non suivie(s) laissee(s) en place -- le retrecissement sparse passe (#22722)"
            fi
          fi
      - name: Checkout (sparse, scripts only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Sweep and upsert the neglect report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # exit 2 by design on a failed control: the sweep must not run
          # (nor post) on logic whose positive control just failed (#13653, review NanoClaw obs.1)
          python scripts/epic_neglect_sweep.py --self-test || exit 2
          ARGS=""
          # Apply only on the scheduled sweep (or a dispatch that explicitly
          # opts in). The default dispatch is a dry run: the report prints,
          # nothing is posted.
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            ARGS="$ARGS --apply-comment 13653"
          fi
          python scripts/epic_neglect_sweep.py $ARGS

      - name: Detect stale EPIC bodies (advisory)
        # #18203 geste 4: the analyzer exists but nothing scheduled it -- a
        # stale body stayed invisible between two manual looks. Wired here so
        # the daily sweep surfaces it. ADVISORY by the same contract as the
        # neglect report: findings (and a failed fetch) never red the job;
        # the payload goes to the run summary, the slicing stays human (G.9).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if ! python scripts/epic_body_staleness.py --pretty > "${RUNNER_TEMP}/stale_epic_bodies.json"; then
            echo "WARN: epic_body_staleness fetch failed; summary section omitted"
          fi
          {
            echo "## Corps d'EPIC perimes (advisory)"
            echo '```json'
            cat "${RUNNER_TEMP}/stale_epic_bodies.json" || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
