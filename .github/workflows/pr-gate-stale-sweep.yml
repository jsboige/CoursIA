name: PR gate stale-verdict sweep

# The gap left open by pr-gate-rerun.yml, measured 2026-08-17 on #11532.
#
# pr-gate.yml aggregates once on `pull_request` and polls 12 min. Under runner
# starvation the slowest checks are still queued when that budget runs out, so
# the gate posts FAIL -- "timed out waiting for: Analyze (actions), Analyze
# (csharp)". Since #13510 a starved gate cancels its own run instead (leg
# CANCELLED, exit still 1), so those legs now arrive here through the
# `cancelled` half of the RED set below -- the founding FAILURE case below is
# history, kept for the record. pr-gate-rerun.yml exists to re-aggregate
# afterwards, but it is
# driven by `workflow_run` and therefore can only listen to workflows that are
# ADDRESSABLE BY NAME in this repository:
#
#   workflows: ["Variation Tag Guard", "Lane Claim Guard",
#               "Notebook Execution Required", "Translation Drift Check",
#               "machine-dep-timing-advisory"]
#
# CodeQL is not one of them. It runs under GitHub's *default setup*, which is
# dynamic: `GET /repos/:owner/:repo/actions/workflows?per_page=100` returns 103
# workflows on this repository and NOT ONE of them is CodeQL (measured
# 2026-08-17T22:0xZ). Adding "CodeQL" to the list above would be a silent
# no-op -- a trigger name that matches nothing never fires and never errors.
#
# Consequence when CodeQL is the last check to settle -- the common case under
# saturation, since it is also the slowest: the gate's stale FAIL is never
# superseded, `gh pr checks` shows zero red besides `PR gate` itself, and the
# PR reports BLOCKED forever. On #11532 every one of the four CodeQL analyses
# went green at 21:5xZ; the 21:38Z gate verdict stayed FAILURE.
#
# This sweep closes the loop from the outside, independent of trigger
# semantics: it finds open PRs carrying a red `PR gate` leg while every other
# check has COMPLETED green, and RE-RUNS the original gate run for each. It
# never merges, never edits, never blocks, and always exits 0.
#
# Why it re-runs instead of POSTing a fresh verdict -- the correction that
# rewrote this file. POSTing was the first design here, and it is INERT.
# Two check-runs bearing a required name can coexist on one SHA in DIFFERENT
# check suites, and GitHub requires EVERY one of them to be green: it is an
# AND, not latest-wins. A posted SUCCESS therefore lands BESIDE the stale
# FAILURE instead of replacing it, and the PR stays BLOCKED.
#
# Measured on #11532 (2026-08-17): `21:38 failure` (suite ...36591) and
# `22:46 success` (suite ...31015) coexisted on the same head; the PR was
# still BLOCKED. `gh run rerun 32070293726` then replaced the failure IN
# PLACE in its own suite, and the block lifted. Re-running is the only
# mechanism that clears the leg.
#
# The same correction applies to the candidate filter: folding same-named
# check-runs by name (latest-wins) HID this exact case -- it kept the 22:46
# success and called the PR healthy. Across the 116 open PRs that day the
# fold concealed 52 of them, the majority of the blocked pool. The filter now
# treats ANY red `PR gate` leg as a candidate.
#
# Why this sweep exists at all, given pr-gate-rerun.yml (#11546) now re-runs
# on `workflow_run`: CodeQL runs in `default setup`, which is dynamic and does
# not appear in the workflow list --
#   GET /repos/jsboige/CoursIA/actions/workflows?per_page=100
#     -> total_count: 103, of which CodeQL: 0
# -- so it cannot be named as a `workflow_run` trigger, and the event-driven
# path never fires when CodeQL is the last check to settle. Under saturation
# that is the common case, since CodeQL is also the slowest. A schedule is
# the only observer that does not depend on being triggerable.
#
# pr-gate.yml's own `workflow_dispatch` leg cannot serve either: it runs on
# the default branch, so `github.event.pull_request.head.sha || github.sha`
# resolves to the default-branch commit, and its check-run lands there --
# invisible to the PR's mergeState. (Its unused `sha` input is removed in the
# same change that adds this file, for the same reason: a documented remedy
# wired to nothing is worse than an absent one, because it is tried and
# believed. It was tried, on #11532, before the real path was found.)

on:
  schedule:
    # Hourly on an off-:00 minute (anti-stampede convention, as in
    # pr-gate-missing-advisory.yml).
    #
    # #12728: this was every 20 minutes, and the cadence was destroying its own
    # organ. The premise of the old comment -- "cheap enough (one short job) not
    # to add meaningful load" -- is true of the WORK and false of the WAIT. On 30
    # runs the job executed in 110-122 s but waited 1.6-2.2 h for a runner (98-99 %
    # queue). Service ~2 h against a 20 min cadence means 5-6 sweeps are created
    # behind the one that finally gets a slot; a concurrency group holds exactly
    # ONE pending, so GitHub drops the rest. Measured outcome: 19 of 30 runs
    # cancelled, median lifetime 1228 s -- which is 20.5 min, i.e. exactly one
    # cron interval. That number excludes every cause except the next sweep.
    #
    # The loop closed on itself: the busier the queue, the longer the sweep waits,
    # the more certainly it is cancelled -- so the organ that repairs stale
    # PR gate verdicts went quiet precisely under the congestion that produces
    # them. Matching the cadence to the observed service time is what stops the
    # sweeps killing each other.
    #
    # This does NOT fix the queue wait BY ITSELF. The cadence change stopped the
    # sweeps killing each other; the wait itself is addressed by routing this
    # job to the dedicated coursia-linux pool (see runs-on). The final timing
    # step below keeps measuring the run-created -> job-started queue separately
    # from observed execution time: #12728's acceptance is read on THAT step,
    # post-routing (expected: queue collapses from ~6000-8000 s to near zero;
    # cancellations from 19/30 to ~0).
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List candidates, post nothing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write       # re-run the ORIGINAL `PR gate` run (see the note below)
  pull-requests: read

concurrency:
  # One sweep at a time, and never cancel a running one: a sweep that is killed
  # mid-loop leaves the PRs it had not reached still blocked, which is the
  # exact failure mode this file exists to remove.
  group: pr-gate-stale-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Re-aggregate stale PR gate verdicts
    # Routed to the self-hosted Linux pool (#14201 PART 2, #12728 acceptance) :
    # this sweep is a 2-minute job that waited 1.6-2.2 h for a GitHub-hosted
    # slot (98-99 % queue, measured on 30 runs, see #12728) and was cancelled
    # 19/30 by its own successor -- the organ went quiet precisely under the
    # congestion it exists to absorb. The coursia-linux pool is dedicated
    # capacity (mandat user : consommer les runs conteneurises, ce sont les
    # GitHub-hosted qui coutent), so the queue wait collapses at the source.
    # Coupling assumed: a dead supervisor now starves this sweep too -- covered
    # by TWO independent observers, linux-runner-starvation-advisory.yml
    # (#14263, extinction/starvation) and pr-gate-sweep-health-advisory.yml
    # (last successful sweep > 1 h, runs on ubuntu-latest so it survives what
    # it watches).
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    timeout-minutes: 15
    steps:
      - name: Bootstrap gh into the persistent toolcache
        # The coursia-linux image (#14171: ubuntu:24.04 + python3/jq/curl/git)
        # deliberately does not ship gh, and this sweep is gh-driven. The
        # binary is installed ONCE into the toolcache volume: the volume
        # persists across ephemeral containers -- that is its purpose -- so
        # every sweep after the first reuses it. No setup-python / pip here on
        # purpose either: the image's python3 suffices, which keeps this sweep
        # immune to the RUNNER_TOOL_CACHE bug class that broke Python tooling
        # on mangled generations (2026-09-02) -- the bootstrap hardcodes the
        # mount point and its worst case is a re-download, never a break.
        env:
          GH_BOOTSTRAP_VERSION: "2.80.0"
        run: |
          set -uo pipefail
          if command -v gh >/dev/null 2>&1; then
            echo "[gh] preinstalled on this runner"
            gh --version
            exit 0
          fi
          GH_BIN="/opt/hostedtoolcache/bin/gh"
          if [ ! -x "$GH_BIN" ]; then
            VER="${GH_BOOTSTRAP_VERSION}"
            echo "[gh] bootstrapping v${VER} into toolcache (one-time, cached for every later sweep)"
            curl -fsSL "https://github.com/cli/cli/releases/download/v${VER}/gh_${VER}_linux_amd64.tar.gz" -o /tmp/gh.tgz
            tar -xzf /tmp/gh.tgz -C /tmp
            mkdir -p /opt/hostedtoolcache/bin
            mv "/tmp/gh_${VER}_linux_amd64/bin/gh" "$GH_BIN"
          fi
          echo "/opt/hostedtoolcache/bin" >> "$GITHUB_PATH"
          "$GH_BIN" --version

      # No checkout / setup-python / pip here on purpose. This sweep no longer
      # runs `pr_gate.py`: it re-runs the original workflow run (see the note in
      # the re-aggregation step). That removes ~40 s of runner time per sweep,
      # every 20 min, on a repository whose measured problem IS runner scarcity.
      - name: Find stale verdicts and re-run their gate
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          # Cap the number of re-aggregations per sweep. A wide outage can
          # leave dozens of PRs in this state at once; doing all of them in one
          # job would run past the timeout. The next sweep (20 min later) takes
          # the next batch.
          MAX_POSTS=8

          # Collected over REST, one small call per PR, NOT one bulk GraphQL
          # query. `gh pr list --limit 60 --json statusCheckRollup` returns
          # HTTP 504 on this repository (measured 2026-08-17; --limit 40 was
          # 530 KB and already near the edge). A sweep that 504s is a sweep
          # that silently does nothing, and REST also lets us see the WHOLE
          # open pool instead of the 40 most recent.
          #
          # Known limit, stated rather than hidden: /check-runs returns check
          # runs only, not legacy commit statuses. Every check involved here
          # (`PR gate`, CodeQL, the guards) is a check run, so the selection is
          # exact for this repository's setup.
          gh api "repos/$REPO/pulls?state=open&base=main&per_page=100" --paginate \
            --jq '.[] | select(.draft | not) | "\(.number) \(.head.sha) \(.head.repo.fork)"' > /tmp/openprs.txt \
            || { echo "[stale-sweep] PR listing failed (upstream) -- skip this sweep"; exit 0; }

          : > /tmp/runs.jsonl
          while read -r NUM SHA FORK; do
            [ -z "${NUM:-}" ] && continue
            # details_url (.../actions/runs/{run_id}/job/{job_id}) is collected
            # on purpose: it is the only field carrying the run id, which the
            # selector resolves through the map below to fold check-runs per
            # (workflow_id, name) instead of per name -- three workflows emit a
            # job named "Ratchet (base vs PR)" and a name-only fold merges their
            # verdicts (#11808).
            BODY=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
                     --jq '[.check_runs[] | {name, status, conclusion, started_at, details_url}]' 2>/dev/null) || continue
            # Carte run_id -> workflow_id. UN seul appel de plus par PR (pas par
            # run) : la liste des runs du SHA porte deja `workflow_id`. C'est ce
            # qui permet de replier les runs JUMEAUX d'un MEME workflow sans
            # jamais fusionner deux workflows homonymes (#11808). Si l'appel
            # echoue, la carte est vide et la cle retombe sur run_id : le
            # comportement anterieur, jamais plus permissif.
            WFMAP=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" --jq '[.workflow_runs[] | {key:(.id|tostring), value:.workflow_id}] | from_entries' 2>/dev/null)
            if [ -z "${WFMAP:-}" ]; then WFMAP='{}'; fi
            printf '{"number":%s,"sha":"%s","fork":%s,"checks":%s,"workflows":%s}\n' "$NUM" "$SHA" "${FORK:-false}" "$BODY" "$WFMAP" >> /tmp/runs.jsonl
          done < /tmp/openprs.txt
          echo "[stale-sweep] open PRs inspected: $(wc -l < /tmp/runs.jsonl | tr -d ' ')"

          python - <<'PY' > /tmp/candidates.txt
          import json, os, re, sys

          # REST /check-runs is lowercase where GraphQL's rollup is uppercase.
          # A check counts as settled-green when it has completed with a
          # conclusion that does not redden a rollup. neutral / skipped are
          # green for this purpose: GitHub treats them as non-blocking, and a
          # path-filtered guard that skipped must not keep a PR in the pool.
          GREEN = {"success", "neutral", "skipped"}
          # `cancelled` is a gate-leg terminal state that means "verdict never
          # rendered, render it again" (pr-gate.yml cancels in-flight gates on
          # every supersession: push, synchronize, re-dispatch), NOT an outcome
          # GitHub counts as success -- so a cancelled required gate leaves the
          # PR BLOCKED with nothing red. It belongs here, on the GATE side only:
          # for other checks a cancelled run is either superseded (the fold
          # below keeps the later verdict) or a real interruption that must not
          # be greenwashed. Asymmetric on purpose (#11862).
          RED = {"failure", "timed_out", "action_required", "cancelled"}

          # Test seam: the shipped selector is exec'd verbatim by
          # scripts/tests/test_pr_gate_sweep_select.py, which points this at a
          # fixture. Default is the sweep's own collection file.
          #
          # Fold key is (workflow_id, name) -- NEVER the name alone (#11808), and
          # no longer (run_id, name) either (defect measured 2026-09-01).
          #
          # Not the name alone: three distinct workflows emit a job displaying
          # the same name "Ratchet (base vs PR)". Folding by name lets the most
          # recent of the three erase the verdicts of the other two -- measured
          # 2026-08-19 on #11804, where an Output-Failure SUCCESS at 16:21
          # covered a live Papermill FAILURE from 16:19 and this sweep re-ran a
          # gate on a PR that was NOT healthy.
          #
          # Not the run id either: that key assumed the only way ONE workflow
          # yields two check-runs on one SHA is a rerun -- which rewrites its
          # check-run IN PLACE and so keeps the same run id. That is false for a
          # workflow triggered by SEVERAL events. `Always-on guards` carries no
          # `paths:` filter and fires on both `pull_request` and
          # `pull_request_review`: two runs, two run ids, one workflow, one SHA.
          # Keying on the run id kept the SUPERSEDED failure alive, so this
          # sweep excluded the PR at every pass ("red gate, kept out") while
          # `pr_gate.py` -- which folds by NAME, latest-wins -- saw green.
          # Measured on #13869 (SHA d207b5e15): run 33432764140 (`pull_request`)
          # failure 20:05:20Z, run 33435266510 (`pull_request_review`) success
          # 20:20:51Z. 23 of the 77 open PRs (30 %) were frozen this way, three
          # of them the coordinator's own -- which is itself the evidence that
          # this was a mechanism, not lane indiscipline.
          #
          # (workflow_id, name) answers both at once: twin runs of ONE workflow
          # fold under latest-wins (the fold's original purpose), and two
          # DIFFERENT workflows never merge. The governing principle is that a
          # REPAIR selector must never be STRICTER than the gate it repairs.
          #
          # The map is collected above at one extra API call per PR. When it is
          # absent -- collection failure, or a fixture predating this change --
          # the key falls back to the run id: the previous behaviour, never
          # anything more permissive.
          def _fold_key(c, wfmap):
              m = re.search(r"/runs/(\d+)/", c.get("details_url") or "")
              if not m:
                  return ("unattributed", c.get("name") or "?")
              run_id = m.group(1)
              return (str(wfmap.get(run_id, run_id)), c.get("name") or "?")

          def _diag(p, why, blockers):
              print(f'[stale-sweep] #{p["number"]}: red gate, kept out -- {why}: '
                    + ", ".join(blockers), file=sys.stderr)

          for line in open(os.environ.get("SWEEP_RUNS_FILE", "/tmp/runs.jsonl"),
                           encoding="utf-8"):
              line = line.strip()
              if not line:
                  continue
              p = json.loads(line)
              latest = {}
              wfmap = {str(k): v for k, v in (p.get("workflows") or {}).items()}
              for c in (p.get("checks") or []):
                  key = _fold_key(c, wfmap)
                  started = c.get("started_at") or ""
                  if key not in latest or started >= latest[key][0]:
                      latest[key] = (started, c)

              # `PR gate` is the REQUIRED check, and there latest-wins is FALSE.
              # Two check-runs bearing a required name can coexist on one SHA in
              # DIFFERENT check suites, and GitHub requires EVERY one of them to
              # be green -- an AND, not latest-wins. A newer posted SUCCESS does
              # NOT clear an older FAILURE.
              #
              # Measured 2026-08-17 on #11532: `21:38 failure` (suite ...36591)
              # and `22:46 success` (suite ...31015) coexisted, and the PR stayed
              # BLOCKED. Folding by name kept only the 22:46 success, so this
              # filter called the PR healthy and skipped it. Over the 116 open
              # PRs that day, that fold hid 52 of them -- the majority of the
              # blocked pool, and precisely the ones this sweep exists for.
              gate_legs = [c for c in (p.get("checks") or []) if (c.get("name") or "") == "PR gate"]
              if not gate_legs:
                  continue  # absent gate is pr-gate-missing-advisory.yml's case
              if not any((c.get("conclusion") or "") in RED for c in gate_legs):
                  continue

              others = [(k, c) for k, (t, c) in latest.items() if k[1] != "PR gate"]
              # Every other check must be finished AND green. An unfinished one
              # means the gate may still be legitimately waiting: re-aggregating
              # then would just burn another verdict on the same incomplete set.
              # Exclusions are NAMED on stderr (#11808): "1 candidate, N
              # excluded" is indistinguishable from a disconnected filter, and
              # the #11804 incident was read off exactly such a count.
              unfinished = [k for k, c in others
                            if (c.get("status") or "") != "completed"]
              if unfinished:
                  _diag(p, "unfinished", [
                      f"{k[1]}[run {k[0]}]" for k in unfinished])
                  continue
              # #13978 -- `cancelled` rentrait ici par le COMPLEMENT de GREEN,
              # c'est-a-dire du cote meme que le commentaire de RED exempte
              # explicitement ("It belongs here, on the GATE side only").
              # L'asymetrie etait declaree, testee, et non implementee de ce
              # cote. Sous `cancel-in-progress: true` sur les advisory, un
              # `cancelled` frais n'est plus la "vraie interruption" rare que
              # supposait l'acceptance 5 : c'est l'etat STATIONNAIRE de toute
              # PR ayant recu deux pushes.
              #
              # Mesure du sweep 33459621864 (2026-09-01T01:40, 71 PRs
              # inspectees) : sur 42 exclusions nommees, 26 tenaient a un
              # `failure` reel et 16 -- 38 % -- a des `cancelled` SEULS, dont
              # 13 au seul advisory `List open-PR path collisions`. Or ce meme
              # advisory annule coexiste avec un `PR gate: SUCCESS` sur des PRs
              # MERGEES (#13916, #13860) : le filtre etait strictement plus
              # strict que le gate dont il existe pour re-rendre le verdict.
              #
              # L'intention d'acceptance 5 -- ne pas blanchir une vraie
              # interruption -- tient toujours, parce que le sweep ne merge
              # rien : il RELANCE le gate, qui re-lit l'etat live et conclura
              # FAIL si un constituant est reellement rouge. Le verdict reste
              # rendu par le gate, jamais par le sweep. Cout d'un faux positif
              # d'eligibilite : une minute de runner. Cout du faux negatif
              # actuel : une PR BLOCKED pour toujours, puisque le gate
              # `cancelled` ne peut pas devenir SUCCESS tout seul.
              #
              # Exemption d'une SEULE conclusion, jamais une liste blanche de
              # bloquants : `startup_failure`, `stale` et toute conclusion
              # future inconnue continuent d'exclure.
              OTHERS_NOT_BLOCKING = GREEN | {"cancelled"}
              red_others = [(k, c) for k, c in others
                            if (c.get("conclusion") or "")
                            not in OTHERS_NOT_BLOCKING]
              if red_others:
                  _diag(p, "red", [
                      f"{k[1]}[run {k[0]}]={c.get('conclusion')}"
                      for k, c in red_others])
                  continue

              print(f'{p["number"]} {p["sha"]} {str(p.get("fork", False)).lower()}')
          PY

          # OLDEST FIRST, and the cap is the whole reason it matters.
          #
          # `GET /pulls` defaults to `sort=created&direction=desc`, and nothing
          # downstream re-orders, so `candidates.txt` arrived NEWEST-first and
          # MAX_POSTS took the newest 8. That is backwards for a capped queue:
          # a young PR still receives `synchronize` / `reopened` events, and
          # pr-gate.yml re-runs on each of them, so it has a second repair
          # path. A quiet old PR emits no more events -- this sweep is its
          # ONLY one. Newest-first therefore spends the cap on the population
          # that needs it least and starves the one that has nothing else.
          #
          # Measured 2026-08-28T12:33Z (run 33169455408): 16 candidates, cap 8,
          # served 13355 13347 13343 13332 13320 13286 13195 13191 -- eight
          # consecutive descending numbers, i.e. exactly the newest eight. At
          # 14:24Z the five left behind (12390 12534 12791 12995 13091) were
          # still BLOCKED on stale gates dating from 07:42Z-10:35Z: 4 to 7
          # hours, on PRs carrying no red constituent at all. The queue makes
          # the effective cadence ~3 h (sweeps at 01:47, 04:53, 07:44, 12:02),
          # so "the next sweep takes the next batch" holds only while arrivals
          # stay under the cap; above it the tail is never reached.
          #
          # PR numbers are monotonic in creation time, so a numeric sort IS
          # the age order -- no extra API call.
          sort -n -o /tmp/candidates.txt /tmp/candidates.txt

          COUNT=$(wc -l < /tmp/candidates.txt | tr -d ' ')
          echo "[stale-sweep] PRs whose only red is a stale \`PR gate\`: $COUNT (oldest first)"
          if [ "$COUNT" = "0" ]; then
            echo "[stale-sweep] nothing to do"
            exit 0
          fi

          n=0
          while read -r NUM SHA FORK; do
            [ -z "${NUM:-}" ] && continue
            if [ "$n" -ge "$MAX_POSTS" ]; then
              echo "[stale-sweep] cap $MAX_POSTS reached -- $((COUNT - n)) newer candidate(s) wait for the next sweep"
              break
            fi
            # Re-run the ORIGINAL run rather than POSTing a fresh verdict.
            #
            # POSTing was this file's first design, and it is INERT: a posted
            # check-run lands in its own check suite, so the stale FAILURE stays
            # on the SHA alongside it, and GitHub's AND over same-named required
            # check-runs keeps the PR BLOCKED. Verified on #11532 (see the note
            # in the candidate filter above).
            #
            # `gh run rerun` overwrites the run's check-run IN PLACE, in the same
            # suite -- the only mechanism that actually clears the red leg. Same
            # remedy as pr-gate-rerun.yml (#11546); this sweep is its complement,
            # because CodeQL runs in `default setup` and is NOT addressable as a
            # `workflow_run` trigger, so the event-driven path cannot fire when
            # CodeQL is the last check to settle -- the common case under
            # saturation, since it is also the slowest.
            #
            # No loop risk: "PR gate" is not among pr-gate-rerun.yml's trigger
            # workflows, so a re-run cannot re-trigger the rescuer.
            RUN=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&event=pull_request&per_page=100" \
                    --jq '[.workflow_runs[] | select(.name == "PR gate")] | sort_by(.created_at) | last' 2>/dev/null)
            RUN_ID=$(printf '%s' "${RUN:-}" | jq -r '.id // empty' 2>/dev/null)

            if [ -z "${RUN_ID:-}" ]; then
              # The verdict on this SHA was POSTed by something else and has no
              # workflow run behind it, so there is nothing to re-run. Say so
              # rather than fail silently: this class needs its own handling.
              echo "[stale-sweep] #$NUM ($SHA): red \`PR gate\` with NO workflow run -- cannot re-run, skipping"
              n=$((n + 1))
              continue
            fi

            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "[stale-sweep] (dry-run) would re-run #$NUM ($SHA) via run $RUN_ID"
            else
              echo "[stale-sweep] re-running gate for #$NUM ($SHA) -- run $RUN_ID"
              # `|| echo`: one PR whose re-run is refused must not abort the loop
              # nor redden a sweep whose other re-runs landed.
              gh run rerun "$RUN_ID" --repo "$REPO" \
                || echo "[stale-sweep] re-run refused for #$NUM (non-fatal)"
            fi
            n=$((n + 1))
          done < /tmp/candidates.txt

          # Advisory organ: it acts, it never blocks.
          exit 0

      - name: Measure queue and observed execution separately
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          JOB_NAME: Re-aggregate stale PR gate verdicts
        run: |
          set -uo pipefail

          RUN=$(gh api "repos/$REPO/actions/runs/$RUN_ID" 2>/dev/null) || {
            echo "::warning::stale-sweep timing unavailable: run API failed"
            exit 0
          }
          # The endpoint defaults to filter=latest. Keep it that way: filter=all
          # includes prior attempts after a re-run and makes the current job name
          # ambiguous, exactly when this workflow is measuring repeated service.
          JOBS=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" 2>/dev/null) || {
            echo "::warning::stale-sweep timing unavailable: jobs API failed"
            exit 0
          }

          RUN_JSON="$RUN" JOBS_JSON="$JOBS" python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          def parse_timestamp(value, label):
              if not value:
                  raise ValueError(f"missing {label}")
              text = value[:-1] + "+00:00" if value.endswith("Z") else value
              parsed = datetime.fromisoformat(text)
              if parsed.tzinfo is None:
                  raise ValueError(f"timezone missing from {label}")
              return parsed.astimezone(timezone.utc)

          try:
              run = json.loads(os.environ["RUN_JSON"])
              jobs_payload = json.loads(os.environ["JOBS_JSON"])
              jobs = [
                  job for job in jobs_payload.get("jobs", [])
                  if job.get("name") == os.environ["JOB_NAME"]
              ]
              if len(jobs) != 1:
                  raise ValueError(
                      f"expected one current job named {os.environ['JOB_NAME']!r}, "
                      f"found {len(jobs)}"
                  )

              job = jobs[0]
              created = parse_timestamp(run.get("created_at"), "run.created_at")
              started = parse_timestamp(job.get("started_at"), "job.started_at")
              measured = datetime.now(timezone.utc)
              queue_seconds = (started - created).total_seconds()
              execution_seconds = (measured - started).total_seconds()
              if queue_seconds < 0 or execution_seconds < 0:
                  raise ValueError(
                      "negative duration: "
                      f"queue={queue_seconds}, execution={execution_seconds}"
                  )

              lines = [
                  "## Stale-sweep timing (#12728)",
                  "",
                  "Measured from job-level timestamps; `run_started_at` is not used.",
                  "",
                  f"- Run created: `{run['created_at']}`",
                  f"- Job started: `{job['started_at']}`",
                  f"- Measured at: `{measured.isoformat().replace('+00:00', 'Z')}`",
                  f"- Queue: **{queue_seconds:.0f} s**",
                  f"- Observed execution: **{execution_seconds:.0f} s**",
              ]
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("\n".join(lines) + "\n")
              print(
                  "[stale-sweep] timing: "
                  f"queue_seconds={queue_seconds:.0f} "
                  f"observed_execution_seconds={execution_seconds:.0f}"
              )
          except (KeyError, TypeError, ValueError, json.JSONDecodeError) as exc:
              print(f"::warning::stale-sweep timing unavailable: {exc}")
          PY
