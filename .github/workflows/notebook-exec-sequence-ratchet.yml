name: Notebook Exec Sequence Ratchet

# #11112 tier 2 — ratchet gate: a PR must not soil the execution_count
# sequence of a notebook that was CLEAN on its base. Legacy dirty notebooks
# (tier-3 family rollout in progress) are NOT required to improve here:
# no retroactive catch-up, the gate is green on main from day one.
# The verdict organ is scripts/notebook_tools/check_exec_sequence.py
# (tier 1, #11150); this workflow drives check_exec_ratchet.py, which
# compares each changed notebook base-vs-head and fails only on
# CLEAN -> non-CLEAN.
#
# Fail-by-design acknowledgment (#11577, precedent #11574 freshness):
# a PR that legitimately re-executes a SINGLE cell (RECOVERABLE-MACHINE
# loader fix) while the downstream artifact is gitignored (scripts/results
# /**, GPU 10h+) inevitably soils the sequence -> DUPLICATE/NOT_FROM_1.
# The guard is CORRECT: it detects exactly what it must. Never hand-edit
# execution_count to silence it. Instead: document the degraded sequence
# (base vs head) in the PR body using the template in
# docs/reference/regles-validation-detail.md ("Ratchet exec-sequence
# fail-by-design") and get an explicit reviewer ack before merge.
on:
  pull_request:
    branches: [main]
    # `labeled` (#21332) : l'ack de l'echec fail-by-design se pose par le
    # LABEL `exec-sequence-ack` (double cle : label + marker
    # `[EXEC-SEQ-ACK] head=<sha40>`, cf scripts/ci/exec_sequence_ack_required.py).
    # Sans `labeled`, poser le label ne relanceait rien : la garde attendait
    # l'evenement suivant et le gate restait rouge malgre l'ack. Le
    # COMMENTAIRE doit preceder le LABEL : au moment ou `labeled` declenche,
    # l'organe lit les deux surfaces en direct.
    types: [opened, synchronize, edited, reopened, labeled]
    paths:
      - '**.ipynb'
      - 'scripts/notebook_tools/check_exec_sequence.py'
      - 'scripts/notebook_tools/check_exec_ratchet.py'
      - 'scripts/notebook_tools/tests/**'
      - 'scripts/ci/exec_sequence_ack_required.py'
      - 'scripts/tests/test_exec_sequence_ack_required.py'
      - '.github/workflows/notebook-exec-sequence-ratchet.yml'
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Base ref to ratchet against (default origin/main)'
        required: false
        default: 'origin/main'

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: notebook-exec-sequence-ratchet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ratchet:
    name: Exec-sequence ratchet (base vs PR)
    # Route vers la jambe Linux auto-hebergee (#13378 tranche 1, decision ai-01
    # 2026-09-01) : garde Python pur, sans secret ni usage du GITHUB_TOKEN. La garde
    # same-repo ci-dessous saute les PRs de fork (pr_gate.py compte `skipped` comme
    # OK) : aucun code de fork n'atteint le runner. Retour arriere = revert de la PR.
    # 2026-10-27 (mesure ai-01) : migration vers `ubuntu-latest` par Q35 etape 2
    # (#17397) -- `scripts/ci/audit_self_hosted_needs.py` certifie ce workflow
    # comme n'ayant besoin de RIEN qui n'existe que sur le parc local, et le parc
    # local etait sature PAR SES CHECKOUTS (mesure 00:45Z : 11 des 12 slots
    # occupes dans `actions/checkout`, 614 runs en file). La garde anti-fork
    # ci-dessous est CONSERVEE : aucun code de fork ne change de surface.
    # Retour arriere = revert du commit (et remise de l'entree d'allowlist).
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The self-test runs FIRST and gates the gate: it asserts a clean
      # sequence stays CLEAN (negative control), every dirty class fires
      # (positive control), and the #14676 option-(c) outcome (a markdown
      # cell drops out of the sequence, leaving 1..N CLEAN). This makes the
      # gate's blocking nature machine-provable: without it, the check was
      # misread as advisory and its CLEAN -> non-CLEAN regressions passed for
      # several cycles (#14676 saga). A detector that cannot be shown to fire
      # is indistinguishable from one that is unplugged.
      - name: Detector self-test (positive + negative control)
        run: python scripts/notebook_tools/check_exec_sequence.py --self-test

      # `python -m pytest` needs pytest, and `setup-python` does not provide it:
      # the documented tool-cache seeding (docs/ci/self-hosted-runners.md,
      # option a2) copies a bare python.org interpreter whose acceptance witness
      # is `python --version` + `pip --version`, never pytest. Without this step
      # the guard is green or red according to WHICH runner slot picks the job
      # up, not according to the PR.
      - name: Install test dependency
        run: python -m pip install --quiet pytest

      - name: Organ unit tests
        run: python -m pytest scripts/notebook_tools/tests/test_check_exec_sequence.py scripts/notebook_tools/tests/test_check_exec_ratchet.py -q

      # Refs reach the script via env, never inline in the run script
      # (script-injection guard). The ratchet delegates to the ack organ
      # (#11577, #21273) when --pr-number + --head-sha are passed; the ack
      # organ calls `gh` for labels + comments + reviews, hence GH_TOKEN +
      # GH_REPO. Fail-by-design ack requires a coordinator-level decision;
      # GITHUB_TOKEN (the Actions ephemeral) is enough to fetch the data, and
      # the marker carries the explicit authorship check (`myia-ai-01`).
      - name: Ratchet check
        env:
          BASE_REF: ${{ github.event.inputs.base_ref }}
          PR_BASE: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE="${BASE_REF:-origin/${PR_BASE:-main}}"
          python scripts/notebook_tools/check_exec_ratchet.py "$BASE" \
            --pr-number "${PR_NUMBER}" \
            --head-sha "${HEAD_SHA}"
