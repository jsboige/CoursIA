name: Assert memory budget (composition vs RAM VM, #19805)

# Issue #19805 : `fix(runners): budget memoire po-2024 incoherent avec la VM --
# 42 Go declares pour 24 032 Mo disponibles`. La composition cumulee des
# conteneurs runners (effectifs x caps) etait superieure a la RAM de la VM
# WSL, et l'instrumentation existante ne le detectait pas. `measure_po2024_topology`
# mesure la topologie mais ne confronte pas la composition au budget declare,
# et le garde precedent ne connaissait que le budget (pas la RAM VM).
#
# Cet organe `scripts/ci/assert_memory_budget.py` comble le trou. Il derive la
# composition des unites DEPLOYEES (`scripts/ci/docker/linux-runner/persist/` :
# `ExecStart` de chaque jambe, le drop-in de la machine-cible en surcharge),
# prend la RAM VM de la machine-cible comme constante DECLAREE -- jamais mesuree
# sur l'hote qui execute l'organe -- et compare a la borne la plus contraignante
# entre MemoryMax de la slice et la RAM VM (hote reserve). Rouge si la
# composition depasse.
#
# Le verdict sert deux causes :
# 1. Detecter la derive de la composition quand un dimensionnement change sans
#    que le reste suive (mesure fondateur de l'issue #19805 : l'agrandissement
#    VM du 2026-09-21 a ete revertu sans que les declarations suivent).
# 2. Empecher l'extension silencieuse des caps par conteneur (chaque
#    modification de supervise.sh qui touche --memory doit etre accompagnee
#    d'un dimensionnement coherent, et celui-ci vit dans les unites).
#
# Workflow bloquant sur pull_request et push (les PRs touchant une unite, un
# drop-in de machine, la slice ou supervise.sh concernes reapparaissent dans le
# diff et le guard rougit). Schedule quotidien en arriere-plan pour detecter les
# derives qui n'ont pas ete portees par une PR.

on:
  pull_request:
    paths:
      - "docker-configurations/runners/**"
      - "scripts/ci/assert_memory_budget.py"
      - "scripts/ci/measure_po2024_topology.py"
      # Les unites et drop-ins dont la composition est DERIVEE : le guard doit
      # se relancer quand l'un d'eux change, sinon il rend un verdict sur un
      # dimensionnement qui n'est plus celui du depot.
      - "scripts/ci/docker/linux-runner/persist/**"
      - "scripts/ci/docker/linux-runner/supervise.sh"
  push:
    branches: [main]
    paths:
      - "docker-configurations/runners/**"
      - "scripts/ci/assert_memory_budget.py"
      - "scripts/ci/measure_po2024_topology.py"
      - "scripts/ci/docker/linux-runner/persist/**"
      - "scripts/ci/docker/linux-runner/supervise.sh"
  schedule:
    # Verifie la derive de l'instrument meme quand aucune PR ne touche
    # le snapshot (un revert de .wslconfig sur po-2024 lui-meme est
    # invisible depuis le repo : la CI sert de rappel hebdomadaire).
    - cron: "37 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assert:
    name: Composition vs RAM VM
    # 2026-10-28 (#23053 vague 3, famille (a) gardes/advisories) : forme
    # hybride de debordement -- PR meme-depot ET vars.CI_OVERFLOW_LOCAL ==
    # 'true' -> jambe Linux locale ; tout le reste (variable absente ou fausse,
    # forks, push/schedule/dispatch) retombe sur ubuntu-latest. Bascule :
    # `gh variable set CI_OVERFLOW_LOCAL --body true|false --repo jsboige/CoursIA`.
    # Retour arriere = variable a `false` ou supprimee : routage 100 % heberge,
    # sans toucher ce fichier. Limite : runs-on se resout a la creation du job,
    # les runs deja en file ne bougent pas.
    # La garde anti-fork vit DANS l'expression : aucune ligne `if:` ajoutee ni
    # retiree.
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository && vars.CI_OVERFLOW_LOCAL == 'true') && fromJSON('["self-hosted","coursia-ephemeral","coursia-linux"]') || 'ubuntu-latest' }}
    # Borne de duree (#23053) : 70 s mesures sur le dernier succes (run
    # 40630215290, job `assert`), soit ~4x la duree observee avec la marge d'un
    # clone froid. Sans borne, un job herite de 360 min et fige un slot
    # ephemerel (16 slots sur 18 tenus le 15/10).
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run assert_memory_budget
        id: assert
        run: |
          set -uo pipefail
          python scripts/ci/assert_memory_budget.py --json > /tmp/assert.json
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          cat /tmp/assert.json
          if [ $rc -ne 0 ]; then
            echo "::error title=Incoherence budget memoire (issue #19805)::La composition cumulee des conteneurs runners depasse la borne la plus contraignante (MemoryMax slice ou RAM VM - hote reserve). Voir /tmp/assert.json et l'issue #19805."
            exit 1
          fi
        env:
          PYTHONIOENCODING: utf-8

      # Le runner ubuntu-latest n'expose pas pytest dans le Python 3.13 de
      # setup-python : sans cette etape le smoke test echoue sur
      # `No module named pytest` (rouge fondeur du 2026-10-09), pas sur le code.
      - name: Install pytest
        run: python -m pip install --quiet --disable-pip-version-check pytest

      - name: Run pytest (smoke)
        run: |
          python -m pytest scripts/tests/test_assert_memory_budget.py -v
        env:
          PYTHONIOENCODING: utf-8

      # Harnais de la purge de sentinelle (#15163, #21527). Il etait HORS CI :
      # ses cas ne tournaient qu'a la main, donc la regression du predicat
      # (per-machine au lieu de per-checkout) n'aurait rougi nulle part. Le
      # harnais est purement bash, lit un /proc FAKE (aucun etat reel touche)
      # et rend en quelques secondes.
      - name: Sentinel purge harness (per-checkout predicate)
        run: |
          set -uo pipefail
          bash scripts/ci/docker/linux-runner/persist/test_sentinel_purge.sh
