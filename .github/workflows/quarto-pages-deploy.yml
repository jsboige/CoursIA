name: Quarto Pages Deploy

# Quarto site build + GitHub Pages deployment
# Tranche 4 #4211 — cf. https://github.com/jsboige/CoursIA/issues/4211
# Owner: po-2023:CoursIA (scaffolding) / ai-01 (steering)
#
# Pattern : actions/deploy-pages + upload-pages-artifact (recommandé par GitHub)
# vs branche `gh-pages` (legacy) — évite la pollution git du repo principal.
#
# Spécificités CoursIA :
# - `freeze: auto` dans `_quarto.yml` : Quarto re-render seulement sur changement source
# - Les .ipynb des familles de NOTEBOOK_SUBTREES (scripts/regen_quarto_render.py)
#   sont RENDUS en HTML statique (EPIC #10921, #10923) : echo:true au niveau
#   racine (_quarto.yml), sans exécution de kernel (execute.enabled: false).
# - Pas de kernel exec sur CI : les notebooks .NET C# / Lean 4 / Python sont déjà
#   commités avec outputs (règle C.2).

on:
  push:
    branches: [main]
    paths:
      - "_quarto.yml"
      - "**.qmd"
      - "MyIA.AI.Notebooks/**/index.qmd"
      - "MyIA.AI.Notebooks/**/*.ipynb"
      - "MyIA.AI.Notebooks/**/_output.ipynb"
      - "MyIA.AI.Notebooks/**/README.md"
      - "docs/**"
      - "favicon.ico"
      - "styles.css"
      - ".github/workflows/quarto-pages-deploy.yml"
  workflow_dispatch:

# Annule les runs obsolètes pour économiser des minutes CI (mêmes pushes en rafale)
concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Quarto site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Version alignée sur local (cf. po-2023-c160/c161 Quarto tranches).
          # Bump 1.7.32 -> 1.10.18 (issue #10968) : le filtre lua 1.7.32 pend sur
          # les cellules echo:true dont une ligne de source se termine par \n et
          # suivies d'un output display_data (mini-repro #10968) — corrigé en
          # 1.10.18 (App-9b rend en 6 s). Les 7 notebooks exclus du pilote par
          # #10979 redeviennent rendables (NOTEBOOK_EXCLUDE_FILES vidé, #10968).
          version: 1.10.18

      - name: Regenerate render list
        # _quarto.yml porte une liste render: EXPLICITE des READMEs + notebooks
        # (Quarto 1.7 n'étend pas les globs **/README.md / **/*.ipynb sur les
        # sous-répertoires). On régénère cette liste avant le render pour que les
        # nouveaux fichiers apparaissent sur le site sans commit manuel de
        # _quarto.yml (Axe C #4211). Idempotent ; archives et libs vendored
        # exclues (cf. scripts/regen_quarto_render.py).
        run: python scripts/regen_quarto_render.py

      - name: Normalize .NET kernel language for Quarto (C# -> csharp)
        # Quarto derive la classe pandoc du code-block depuis kernelspec.language.
        # Le kernel .NET Interactive ecrit "C#", que Quarto emet comme classe
        # d'attribut invalide {.c# .cell-code} (le # est le marqueur d'ID pandoc) :
        # quand la cellule est en colonne 0, la premiere ligne source est fusionnee
        # dans la ligne de fence et pandoc re-parse le corps comme markdown
        # (strings C# $"..." mangees par MathJax, code rendu en <p>, issue #11335).
        # Le patch byte-level ("C#" -> "csharp") normalise le language AVANT le
        # render et le restore APRES. kernelspec.language est informationnel :
        # l'execution Jupyter/papermill utilise kernelspec.name ".net-csharp"
        # (inchange) -> le patch n'affecte jamais l'execution.
        run: python scripts/quarto_csharp_kernel_fix.py apply

      - name: Render Quarto site
        # `freeze: auto` (dans _quarto.yml) => Quarto n'exécute PAS les notebooks
        # .ipynb (execute.enabled: false) : ils sont RENDUS en HTML statique avec
        # echo:true (EPIC #10921, #10923) — code affiché + outputs déjà validés et
        # commités par les workers (règle C.2), sans kernel.
        run: quarto render --to html
        # Pas de --execute : sinon ça tente de ré-exécuter les notebooks = impossible
        # sans kernels .NET Interactive / Lean 4 / conda Python spécialisés.

      - name: Restore kernel language (hygiene)
        # Le checkout CI est ephemere : le restore n'est pas indispensable, mais il
        # garde le worktree coherent si un step futur relit les notebooks sources.
        run: python scripts/quarto_csharp_kernel_fix.py restore

      - name: Check output
        # Sécurité : vérifie que _site/ existe (sinon le deploy échouera avec une
        # erreur cryptique). Fail fast = message d'erreur clair.
        run: |
          test -d _site || (echo "::error::_site/ absent après quarto render" && exit 1)
          test -f _site/index.html || (echo "::error::_site/index.html absent" && exit 1)
          echo "_site/ présent avec $(find _site -type f | wc -l) fichiers"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          # name: pas nécessaire, l'action lit le path

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        # Pas de branche gh-pages : utilise l'environment GitHub Pages natif
        # via OIDC token (page-deploy doit être activé dans Settings → Pages).
