name: Quarto Pages Deploy

# Quarto site build + GitHub Pages deployment
# Tranche 4 #4211 — cf. https://github.com/jsboige/CoursIA/issues/4211
# Owner: po-2023:CoursIA (scaffolding) / ai-01 (steering)
#
# Pattern : actions/deploy-pages + upload-pages-artifact (recommandé par GitHub)
# vs branche `gh-pages` (legacy) — évite la pollution git du repo principal.
#
# Spécificités CoursIA :
# - `freeze: auto` dans `_quarto.yml` : Quarto re-render seulement sur changement source
# - Les .ipynb des familles de NOTEBOOK_SUBTREES (scripts/regen_quarto_render.py)
#   sont RENDUS en HTML statique (EPIC #10921, #10923) : echo:true au niveau
#   racine (_quarto.yml), sans exécution de kernel (execute.enabled: false).
# - Pas de kernel exec sur CI : les notebooks .NET C# / Lean 4 / Python sont déjà
#   commités avec outputs (règle C.2).

on:
  push:
    branches: [main]
    paths:
      - "_quarto.yml"
      - "**.qmd"
      - "MyIA.AI.Notebooks/**/index.qmd"
      - "MyIA.AI.Notebooks/**/*.ipynb"
      - "MyIA.AI.Notebooks/**/_output.ipynb"
      - "MyIA.AI.Notebooks/**/README.md"
      - "docs/**"
      - "favicon.ico"
      - "styles.css"
      - ".github/workflows/quarto-pages-deploy.yml"
      - "scripts/quarto_yaml_safe.py"
  pull_request:
    paths:
      - "_quarto.yml"
      - "**.qmd"
      - "MyIA.AI.Notebooks/**/index.qmd"
      - "MyIA.AI.Notebooks/**/*.ipynb"
      - "MyIA.AI.Notebooks/**/_output.ipynb"
      - "MyIA.AI.Notebooks/**/README.md"
      - "docs/**"
      # Auto-couverture : une PR qui ne touche QUE ce workflow doit quand meme
      # emettre l'evenement pull_request (asymetrie push/pull_request, #14391).
      - ".github/workflows/quarto-pages-deploy.yml"
      - "scripts/quarto_yaml_safe.py"
  workflow_dispatch:

# Annule les runs obsolètes pour économiser des minutes CI (mêmes pushes en rafale)
concurrency:
  # Cle portee par github.ref pour eviter qu'un push sur main n'annule un run
  # PR en cours (hazard de production : sans la reference, les runs push et PR
  # partagent la meme cle et s'annulent entre eux). #11616 rouge 2.
  group: pages-deploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Garde : ne tourne que sur push main (le job `validate-pr` porte la voie PR).
    # Sans cette garde, build + validate-PR tournent en double sur PR, et deploy
    # cascadant sur build se fait rejeter par la protection env (refs/pull/.../merge
    # non autorise). #11616 rouge 1.
    # La garde same-repo MENE (forme universelle #13874, exigee par
    # check_self_hosted_runner_policy) ; la selection push-only suit en &&.
    if: (github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository) && github.event_name == 'push'
    name: Build Quarto site
    # Routage #14283 fin de chantier (feu vert ai-01 2026-09-02) : setup
    # Quarto par tarball auto-contenu (voir le step Set up Quarto). Garde
    # push-only = jamais de contexte fork ici. runs-on STATIQUE.
    # Retour arriere = remettre `runs-on: ubuntu-latest` + retrait de
    # l'allowlist.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    # 60 et non 30 depuis #14283 : le meme rendu prend 19-24 min sur
    # `ubuntu-latest` et 25-31 min sur le pool auto-heberge. Le plafond de 30
    # etait calibre sur la machine d'avant la bascule ; apres elle, il tombe
    # AU MILIEU de la distribution et coupe le job a 30 min 19 s.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        # Routage #14283 (feu vert ai-01 2026-09-02) : PAS quarto-dev/quarto-actions/setup@v2 —
        # elle installe un .deb via `sudo apt -y install`, et l'image du pool self-hosted est
        # no-new-privileges sans sudo ni dpkg (mesure : issuecomment-5516335275). Le tarball
        # officiel embarque le MEME binaire sans privilege — ne pas « corriger » vers l'action.
        # Version epinglee en clair (meme discipline que les pins gitleaks) : un tiers ne doit
        # pas pouvoir changer notre binaire sans commit chez nous.
        # 1.10.18 = aligne local (cf. po-2023-c160/c161) ; le filtre lua 1.7.32 pendait sur les
        # cellules echo:true a source finissant par \n suivies d'un display_data (#10968),
        # corrige en 1.10.18 (App-9b rend en 6 s ; NOTEBOOK_EXCLUDE_FILES vide, #10979).
        run: |
          QUARTO_VERSION=1.10.18
          curl -fsSL "https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-amd64.tar.gz" -o /tmp/quarto.tar.gz
          tar -xzf /tmp/quarto.tar.gz -C /tmp
          echo "/tmp/quarto-${QUARTO_VERSION}/bin" >> "$GITHUB_PATH"
          "/tmp/quarto-${QUARTO_VERSION}/bin/quarto" --version

      - name: Regenerate render list
        # _quarto.yml porte une liste render: EXPLICITE des READMEs + notebooks
        # (Quarto 1.7 n'étend pas les globs **/README.md / **/*.ipynb sur les
        # sous-répertoires). On régénère cette liste avant le render pour que les
        # nouveaux fichiers apparaissent sur le site sans commit manuel de
        # _quarto.yml (Axe C #4211). Idempotent ; archives et libs vendored
        # exclues (cf. scripts/regen_quarto_render.py).
        run: python scripts/regen_quarto_render.py

      - name: Normalize .NET kernel language for Quarto (C# -> csharp)
        # Quarto derive la classe pandoc du code-block depuis kernelspec.language.
        # Le kernel .NET Interactive ecrit "C#", que Quarto emet comme classe
        # d'attribut invalide {.c# .cell-code} (le # est le marqueur d'ID pandoc) :
        # quand la cellule est en colonne 0, la premiere ligne source est fusionnee
        # dans la ligne de fence et pandoc re-parse le corps comme markdown
        # (strings C# $"..." mangees par MathJax, code rendu en <p>, issue #11335).
        # Le patch byte-level ("C#" -> "csharp") normalise le language AVANT le
        # render et le restore APRES. kernelspec.language est informationnel :
        # l'execution Jupyter/papermill utilise kernelspec.name ".net-csharp"
        # (inchange) -> le patch n'affecte jamais l'execution.
        run: python scripts/quarto_csharp_kernel_fix.py apply

      - name: Escape YAML-ambiguous `---` separators (issue #11611)
        # Les cellules markdown commencant par `---` (separateur visuel avant
        # `## Heading`) sont concatenees par le pipeline nbconvert de Quarto en
        # un flux markdown unique. Pandoc tente alors de parser le resultat
        # comme front-matter YAML, et un `---` suivi d'un autre `---` (ou d'une
        # table `|`) declenche `YAMLException: end of the stream or a document
        # separator is expected (8:1)`. Le pre-processeur convertit les `---`
        # standalone en `***` (autre syntaxe de regle horizontale markdown, NON
        # reconnue comme separateur YAML). Round-trip byte-level propre, restore
        # via le meme script en fin de job.
        run: python scripts/quarto_yaml_safe.py apply

      - name: Render Quarto site
        # `freeze: auto` (dans _quarto.yml) => Quarto n'exécute PAS les notebooks
        # .ipynb (execute.enabled: false) : ils sont RENDUS en HTML statique avec
        # echo:true (EPIC #10921, #10923) — code affiché + outputs déjà validés et
        # commités par les workers (règle C.2), sans kernel.
        run: quarto render --to html
        # Pas de --execute : sinon ça tente de ré-exécuter les notebooks = impossible
        # sans kernels .NET Interactive / Lean 4 / conda Python spécialisés.

      - name: Restore kernel language (hygiene)
        # Le checkout CI est ephemere : le restore n'est pas indispensable, mais il
        # garde le worktree coherent si un step futur relit les notebooks sources.
        run: python scripts/quarto_csharp_kernel_fix.py restore

      - name: Restore YAML-safe separators
        # Restore les `***` en `---` dans les notebooks sources pour ne pas laisser
        # le worktree dans un etat different de la branche. Le checkout CI est
        # ephemere (meme remarque que ci-dessus), mais le restore garde les
        # outputs `git diff` propres pour les etapes suivantes.
        run: python scripts/quarto_yaml_safe.py restore

      - name: Check output
        # Sécurité : vérifie que _site/ existe (sinon le deploy échouera avec une
        # erreur cryptique). Fail fast = message d'erreur clair.
        run: |
          test -d _site || (echo "::error::_site/ absent après quarto render" && exit 1)
          test -f _site/index.html || (echo "::error::_site/index.html absent" && exit 1)
          echo "_site/ présent avec $(find _site -type f | wc -l) fichiers"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          # name: pas nécessaire, l'action lit le path

  deploy:
    # Garde explicite : actions/deploy-pages ne doit PAS tourner sur PR
    # (refs/pull/.../merge rejete par la protection env github-pages).
    # Boucle avec `if: github.event_name == 'push'` sur `build` : deploy
    # herite par needs, mais la garde ici est defensive. #11616 rouge 1.
    if: github.event_name == 'push'
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        # Pas de branche gh-pages : utilise l'environment GitHub Pages natif
        # via OIDC token (page-deploy doit être activé dans Settings → Pages).

  validate-pr:
    # PR-gate Quarto (issue #11611) : un build site sur PR qui touche la liste
    # de rendu. Bloque les PR qui etendent `_quarto.yml` / ajoutent un notebook /
    # modifient une cellule markdown d'un notebook rendu. Meme job `build` que
    # le push, mais sans deploy : juste le rendu + check output. Si le rendu
    # passe en PR, le push sur main passera aussi.
    name: Validate Quarto build (PR)
    # Routage #14283 fin de chantier (feu vert ai-01 2026-09-02) : setup par
    # tarball (voir le job `build`). Garde anti-fork au niveau job + runs-on
    # STATIQUE — une expression leverait DYNAMIC_RUNS_ON dans
    # check_self_hosted_runner_policy.py.
    if: (github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository) && github.event_name == 'pull_request'
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    # 60 et non 30 depuis #14283 : le meme rendu prend 19-24 min sur
    # `ubuntu-latest` et 25-31 min sur le pool auto-heberge. Le plafond de 30
    # etait calibre sur la machine d'avant la bascule ; apres elle, il tombe
    # AU MILIEU de la distribution et coupe le job a 30 min 19 s.
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write  # pour poster le commentaire de gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Quarto
        # Tarball auto-contenu, pas quarto-actions/setup@v2 (.deb + sudo apt,
        # inapplicable sur l'image no-new-privileges du pool) — voir le job
        # `build` ci-dessus pour la rationale complete et le pin.
        run: |
          QUARTO_VERSION=1.10.18
          curl -fsSL "https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-amd64.tar.gz" -o /tmp/quarto.tar.gz
          tar -xzf /tmp/quarto.tar.gz -C /tmp
          echo "/tmp/quarto-${QUARTO_VERSION}/bin" >> "$GITHUB_PATH"
          "/tmp/quarto-${QUARTO_VERSION}/bin/quarto" --version

      - name: Regenerate render list
        run: python scripts/regen_quarto_render.py

      - name: Normalize .NET kernel language for Quarto (C# -> csharp)
        run: python scripts/quarto_csharp_kernel_fix.py apply

      - name: Escape YAML-ambiguous `---` separators (issue #11611)
        run: python scripts/quarto_yaml_safe.py apply

      - name: Render Quarto site (PR check)
        run: quarto render --to html

      - name: Restore kernel language (hygiene)
        run: python scripts/quarto_csharp_kernel_fix.py restore

      - name: Restore YAML-safe separators
        run: python scripts/quarto_yaml_safe.py restore

      - name: Check output
        run: |
          test -d _site || (echo "::error::_site/ absent après quarto render" && exit 1)
          test -f _site/index.html || (echo "::error::_site/index.html absent" && exit 1)
          echo "_site/ présent avec $(find _site -type f | wc -l) fichiers"

      - name: Comment PR with summary
        # Resumé court : nombre de fichiers + diff notebooks si pertinent.
        # N'utilise PAS d'API GH externe ; le commentaire est posé via gh cli
        # dans le checkout (token GITHUB_TOKEN par defaut).
        if: always()
        run: |
          FILES=$(find _site -type f 2>/dev/null | wc -l)
          echo "Quarto build status: ${{ job.status }}"
          echo "Pages rendues: $FILES"
          if [ "${{ job.status }}" != "success" ]; then
            echo "::error::Le rendu Quarto a échoué en PR. Voir les logs ci-dessus."
            exit 1
          fi
