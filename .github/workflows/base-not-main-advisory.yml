name: Base-not-main advisory

# Part (a) of issue #10918: a PR whose base is NOT `main` delivers its content
# onto a branch. If that branch is never wired to main afterwards, the
# deliverable is orphaned -- exists, executed, referenced by a closed issue,
# visible to nobody. Measured firsthand 2026-08-14: #10770 and #10684 orphaned
# deliverables exactly this way (recovered via #10764/#10916).
#
# This workflow runs on EVERY pull_request event, but only acts when the PR's
# base != main: it labels the PR `base-not-main` and posts/updates an advisory
# comment that names the base and counts the open PRs from that base towards
# main -- 1+ = legitimate stack, 0 = orphan in formation.
#
# ADVISORY, never blocking (#10918): label + comment only, the job exits 0
# regardless. Idempotent: the comment is marker-guarded and updated (not
# re-posted) on synchronize.
#
# DORMANT depuis #14057 (Vague 2 tranche 1, patron #13384) : l'organe
# pull_request ci-dessous est absorbe par always-on-metadata-guards.yml --
# un seul workflow, un seul checkout, un seul slot de runner par PR (149
# runs/fenetre pour ~3 min de travail reel, mesure etape 1 de #14057). Le
# job est conserve verbatim pour la tracabilite ; le declencheur
# pull_request est retire. Le verrou #13232 (verdict METADONNEES, jamais de
# paths:) est porte par l'umbrella, verrouille par
# scripts/tests/test_base_not_main_no_paths_filter.py.

on:
  workflow_dispatch:
    # #12773 tranche 1a + ai-01 decision 2026-08-27 : l'organe lit UNIQUEMENT
    # l'API `gh pr` (cf scripts/base_not_main.py:143 -- baseRefName + title),
    # pas l'arbre. Son verdict depend des METADONNEES de la PR, pas du DIFF.
    # Aucune surface de paths: ne le reduit sans le rendre muet sur tout PR
    # qui ne touche pas exactement ces 3 chemins. Surface nominale = toutes
    # les pull_request. Reduction de fan-out via types:/concurrency, pas paths:.
    # Cf L412 acceptances #10045, test verrouilli par scripts/tests/test_base_not_main_no_paths_filter.py.

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: base-not-main-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signal:
    name: "Flag PR targeting a non-main base (advisory)"
    runs-on: ubuntu-latest
    # Skip the runner entirely for the ~95% of PRs whose base is main. The
    # event's OWN base ref drives the guard (not whatever main is at run time).
    if: github.event.pull_request.base.ref != 'main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Signal base != main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/base_not_main.py --pr "${{ github.event.pull_request.number }}"
