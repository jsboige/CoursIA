name: Stale guard-red sweep

# The gap left open by pr-gate-stale-sweep.yml, measured 2026-08-27 on the
# eleven-PR band of #13321.
#
# pr-gate-stale-sweep.yml refreshes stale PR gate verdicts, but its candidate
# filter only retains PRs where "no check is red besides PR gate itself". A PR
# whose OTHER guard failed -- and whose guard has since been FIXED on main --
# is never re-examined by anything. It stays BLOCKED until a human dates its
# red by hand.
#
# The founding band: 11 PRs (#13156 ... #13204) carried a red
# `Scripts Tests (CPU)` on an assertion that NO LONGER EXISTS -- the test was
# renamed by 62d47eb7d (#13148) at 2026-08-27T08:53Z, and every red in the
# band predates that fix by 2h43 at least. None of them had anything to fix.
#
# What this sweep does differently: it DATES the red by the FROZEN base the run
# was actually played against -- run.pull_requests[0].base.sha, embedded in the
# immutable run object -- NOT by completedAt and NOT by the CURRENT
# merge_commit_sha of the PR, which GitHub recomputes as main moves (founding
# discovery of #13321, measured on #13156: the drifted merge-ref already
# contains the fix while the run was played against an older base). A red is
# stale iff the guard is green on main at its CURRENT version AND the locating
# fix commit is NOT an ancestor of that frozen base. See
# scripts/check_stale_guard_reds.py for the full method, including the positive
# control: a red rendered AGAINST the fixed guard (base ahead of the fix) is a
# real defect and is NOT flagged.
#
# The remedy it prescribes is `gh pr update-branch` -- NEVER `gh run rerun`,
# which replays the frozen base and returns the same red. It never rebases
# and never re-runs anything itself: this is a signal organ (label + comment),
# because the rattrapage must stay ORTHONNANCE under runner starvation
# (#11860) -- eleven update-branches at once would push ~350 runs into a
# queue that already holds hundreds.
#
# Daily on an off-minute: the pr-gate sweep runs hourly because it actively
# unblocks merges; this one files an advisory and its remedy is executed by
# the owning lanes, one head at a time.

on:
  schedule:
    - cron: '53 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List candidates, post nothing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write   # label + comment (signal only, never update-branch)

concurrency:
  group: stale-guard-red-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Signal PRs blocked on a pre-fix red
    # Q35 etape 2 (#17397) : balayage cron pur-Python, aucun secret ni
    # toolchain locale -- routage #14283 inverse, retour sur ubuntu-latest
    # et sortie de SELF_HOSTED_WORKFLOW_ALLOWLIST dans le meme commit.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 25
    steps:
      # 2026-10-27 (#22722) : la commande qui echoue est le `git checkout --force -B`
      # final d'actions/checkout, pas son clean/reset interne (run 40476005592 :
      # clean et reset passent, "HEAD is now at eb8ab03489", puis le checkout
      # refuse le carnet JEPA "not uptodate; will not remove from working tree").
      # Ce refus est la verification de retrait du retrecissement sparse
      # (apply_sparse_checkout, WARNING_SPARSE_NOT_UPTODATE_FILE, git 2.43.0) :
      # a blob inchange, elle compare le fichier au blob de l'index ; ni --force
      # ni le reset interne ne la contournent. Mitigation EMPIRIQUE, mecanisme
      # NON TRANCHE : sur git 2.43.0 tout etat residuel reproduit localement est
      # deja nettoye par le clean+reset du built-in (ce step rejoue la meme
      # commande, sans effet ajoute), et l'etat qui a survecu a son reset n'est
      # pas reproduit (mutation entre reset et checkout ? checkout interrompu ?).
      - name: Restore the warm work tree before the sparse checkout
        run: |
          set -u
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            dirty=$(git -C "$GITHUB_WORKSPACE" -c safe.directory="$GITHUB_WORKSPACE" status --porcelain 2>/dev/null | head -n 1)
            if ! git -C "$GITHUB_WORKSPACE" -c safe.directory="$GITHUB_WORKSPACE" reset --hard --quiet; then
              echo "::warning::[heal-worktree] reset --hard a echoue -- le retrecissement sparse peut refuser (#22722)"
            elif [ -n "$dirty" ]; then
              echo "::notice::[heal-worktree] arbre restaure -- le job precedent avait laisse un etat sale (${dirty}) -- le retrecissement sparse passe (#22722)"
            fi
          fi
      - uses: actions/checkout@v4
        with:
          # Cone mode (le defaut) n'accepte que des REPERTOIRES : une entree de
          # fichier fait echouer le checkout (`fatal: ... is not a directory`).
          # Mesure : en non-cone ces chemins se listent SANS slash initial -- la
          # forme `/chemin` que suggere l'avertissement de git rend un checkout VIDE.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/check_stale_guard_reds.py

      - name: Find and signal stale guard reds
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -uo pipefail
          if [ "${DRY_RUN:-false}" = "true" ]; then
            python3 scripts/check_stale_guard_reds.py --repo "$REPO" --json
          else
            # --remeasure (#15350) : la re-mesure vit dans CE job -- fetch du
            # merge-ref frais + rejeu des tests echoues, zero run GitHub cree,
            # zero push (plancher DWELL des PR intact). Bornee a 2 par passage
            # (orthonance locale #11860 + timeout job releve 15 -> 25 min).
            python3 scripts/check_stale_guard_reds.py --repo "$REPO" --apply --remeasure --json
          fi

          # Advisory organ: it signals, it never blocks.
          exit 0
