name: PR gate (re-aggregate)

# Re-aggregation path for the stale-rollup defect (#10433 item-1 / #10435).
# Sister workflow to pr-gate.yml. Keep them in separate files on purpose: the
# delivery canary in pr_gate.py (derive_always_on_jobs) scans every workflow in
# this directory for jobs that run on EVERY pull_request and expects to find
# them on each PR. A workflow_run-only job does not run on pull_request, so
# folding it into pr-gate.yml (whose workflow-level trigger IS pull_request)
# would make the canary wait for a check that never surfaces -- tripping the
# #9858 partial-delivery alarm on ~180 merges/day. This file has NO pull_request
# trigger, so the canary skips it entirely (derive_always_on_jobs returns None
# from _pull_request_trigger and continues).
#
# What this fixes: pr-gate.yml aggregates once on pull_request with a short
# settle window (#11405). If a required guard (Variation Tag Guard, Lane Claim
# Guard, ...) flips green AFTER that aggregation completed with FAIL, the PR
# stays BLOCKED on the stale FAIL. This workflow re-triggers the aggregation
# when such a guard completes.
#
# MECHANISM -- rerun the original run, never POST a duplicate (#11519):
# the previous implementation re-aggregated here and POSTed the verdict as a
# check-run named "PR gate" (--self-name) onto the PR head SHA. Measured
# 2026-08-17 over 116 open PRs: the POSTed check-run lands in a DIFFERENT
# check suite (CodeQL, event dynamic), and GitHub requires EVERY check-run
# bearing a required check's name to be green -- an AND, not latest-wins. The
# POSTed leg could therefore only ever ADD a way to fail: 52 PRs sat BLOCKED
# with pull_request-leg FAILURE + posted-leg SUCCESS (the rescue did not
# rescue), and 3 PRs (#11444/#11489/#11493) sat BLOCKED with the gate green
# and the posted leg red (the rescue BLOCKED them). A `gh run rerun` of the
# original pr-gate.yml run instead produces a check-run in the SAME suite,
# where latest-wins holds and there is exactly one instance of the required
# name. The aggregation logic itself reads check state live via the API, so
# the rerun verdict is fresh even though the pull_request payload is frozen.
#
# Loop bounding: this workflow triggers on completion of the workflows listed
# below, and "PR gate" is never among them, so a rerun cannot re-trigger this
# workflow. If two guards complete close together, the second reaggregate job
# sees the target run already in_progress and skips -- each unblock attempt
# requires a NEW guard completion, so the chain cannot self-sustain.

on:
  workflow_run:
    # DERIVED LIST (#11865) -- regenerate, never hand-edit:
    #   python scripts/ci/derive_pr_gate_rerun_workflows.py --print-yaml
    # Membership rule: every workflow with a pull_request trigger producing
    # >= 1 non-advisory job (advisory checks never reach the gate's pending
    # list, so their completion cannot flip a verdict). #11405 chose the
    # first five by hand among guards observed slow at the time; under runner
    # starvation that set stopped being the slow one -- #11776 (Catalog
    # Drift / Quarto / CodeQL) and #11839 (Secret Scan) timed the gate out
    # on workflows with NO event-driven rescue path. workflow_run accepts no
    # wildcard, so the enumeration stays explicit in this YAML, but
    # pr-gate-rerun-drift-guard.yml reddens any PR that lets the committed
    # list diverge from the derivation -- each new workflow must regenerate
    # this list in the same PR.
    workflows: ["Bare cross-dir", "Bash Syntax Advisory", "Catalog Drift Check", "Cell-order gate", "Degenerate figure gate", "Docs Link Check", "Fabricated text output gate", "Fast lane (ombre)", "ICT-Series Tests", "Lane Claim Guard", "Lean CI (argumentation_lean)", "Lean CI (conway_cgt_lean)", "Lean CI (decision_theory_lean)", "Lean CI (erc20_lean)", "Lean CI (finiteness_lean)", "Lean CI (kelly_lean)", "Lean CI (learning_theory_lean)", "Lean CI (mathlib_examples)", "Lean CI (mimo_lean)", "Lean CI (minimax_lean)", "Lean CI (planning_lean)", "Lean CI (search_lean)", "Lean CI (sensitivity_lean)", "Lean CI (social_choice_lean_peters)", "Lean CI (sudoku_lean)", "Lean Calibration CI", "Lean Conway CI", "Lean Galois CI", "Lean Game Defs CI", "Lean Game Defs Ext CI", "Lean Game Theory CI", "Lean Grothendieck CI", "Lean Knot CI", "Lean Social Choice CI", "Lean i18n sibling drift", "ML & Prover Tests", "Manifest description_visuelle gate", "Markdown content-loss gate", "Notebook Exec Sequence Ratchet", "Notebook Execution Required", "Notebook Navlink Check", "Notebook Output Failure Ratchet", "Notebook Papermill Ratchet", "Notebook Validation", "OWUI Playwright — Compile & Collect", "QuantConnect notebook freshness", "Quarto Pages Deploy", "Regression Guard", "Rerun Workflows Drift Guard", "SVG broken-geometry gate", "SVG decimal-comma gate", "SVG empty-display gate", "SVG offscreen-flat gate", "Scripts & Notebook-Tools Tests", "Secret Scan", "Stale Base Branch Warning", "Translation Drift Check", "Translation Guard", "Translation parity gate (advisory)", "Twin Parity Check", "Validation Matrix", "Variation Tag Guard", "Workflow Label-Paths Coverage Guard", "banner-guard", "exercise-leak-ci", "harness-coauthor-guard", "hooks-parity", "machine-dep-timing-advisory", "markdown-rendering-guard", "notebook-interp-positioning-guard", "perimeter-review-guard", "pip-leak-guard", "prose-counts-guard", "solution-leak-guard", "testpaths-coverage-guard"]
    types: [completed]
  # Manual dispatch for testing the rerun path without waiting for a guard.
  # PR_NUMBER/HEAD_SHA default to empty; the job then no-ops unless both are
  # supplied.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number whose head SHA to re-aggregate (testing only)'
        required: false
        default: ''
      head_sha:
        description: 'Head SHA to re-aggregate (defaults to the PR head)'
        required: false
        default: ''

permissions:
  contents: read
  actions: write  # re-run the original pr-gate.yml run for the PR head SHA (#11519)

concurrency:
  # One re-aggregation per PR at a time: a later guard-completion supersedes an
  # in-flight one for the same PR. The job below runs in seconds (API calls
  # only, no polling), so the cancel window is tiny -- unlike the former
  # 10-min-poll design whose superseded runs silently posted no verdict
  # (measured 2026-08-17 over 100 runs, #11415: 69% cancelled).
  group: pr-gate-rerun-${{ github.event.workflow_run.pull_requests[0].number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  reaggregate:
    name: Re-aggregate after guard flip
    # A CANCELLED guard produced no verdict, so there is nothing to
    # re-aggregate -- and its payload carries the SUPERSEDED head SHA, so
    # acting on it would rerun a gate for a head that is no longer the PR's.
    # Before the ref-keyed concurrency groups added alongside this, guard
    # cancellations were rare; now every superseded generation ends this way,
    # which would have turned each saved guard run into a wasted gate rerun.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Re-run the original PR gate for the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          # The PR list travels in the workflow_run payload; index 0 is the PR
          # the guard built for. Absent when the guard ran on a non-PR commit
          # (e.g. a push to main) or when invoked via workflow_dispatch.
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || github.event.inputs.pr_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.inputs.head_sha }}
        run: |
          set -eu
          # No PR associated with this guard run -> nothing to unblock.
          if [ -z "$PR_NUMBER" ] || [ -z "$HEAD_SHA" ]; then
            echo "[pr-gate] workflow_run has no PR head to re-aggregate -- skip"
            exit 0
          fi
          # Find the original pr-gate.yml run for THIS head SHA. event=pull_request
          # only (pr-gate.yml also accepts workflow_dispatch, whose payload's
          # --sha target is not the PR head). Most recently CREATED, per #11519:
          # a rerun replays the frozen payload of its original event, so an older
          # run for the same SHA is fine (same SHA, fresh API reads) but a run
          # for an older SHA would re-aggregate a stale head.
          RUN_JSON=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "PR gate")] | sort_by(.created_at) | last')
          if [ -z "$RUN_JSON" ] || [ "$RUN_JSON" = "null" ]; then
            echo "[pr-gate] no pull_request PR gate run yet for ${HEAD_SHA} -- the gate will run on its own, skip"
            exit 0
          fi
          RUN_ID=$(echo "$RUN_JSON" | jq -r '.id')
          STATUS=$(echo "$RUN_JSON" | jq -r '.status')
          CONCLUSION=$(echo "$RUN_JSON" | jq -r '.conclusion')
          echo "[pr-gate] target run ${RUN_ID}: status=${STATUS} conclusion=${CONCLUSION}"
          # Already running/queued: it will aggregate the current check state
          # by itself -- rerunning now is impossible (API rejects it) and
          # useless. This is also the loop bound for near-simultaneous guard
          # completions (#11519: "borner la boucle").
          if [ "$STATUS" != "completed" ]; then
            echo "[pr-gate] run in flight (${STATUS}) -- it will see the fresh guard verdict, skip"
            exit 0
          fi
          # Green already: this leg is not what blocks the PR. No rerun.
          if [ "$CONCLUSION" = "success" ]; then
            echo "[pr-gate] run already green -- nothing to rescue, skip"
            exit 0
          fi
          # Full rerun (NOT --failed): the gate is a single job, and a full
          # rerun replays the aggregation end-to-end against live check state.
          if gh run rerun "$RUN_ID" --repo "${{ github.repository }}"; then
            echo "[pr-gate] rerun ${RUN_ID} issued -- fresh verdict lands in the original check suite (latest-wins, no duplicate name)"
          else
            echo "[pr-gate] rerun rejected (likely flipped to in_progress between read and rerun) -- ok"
          fi
