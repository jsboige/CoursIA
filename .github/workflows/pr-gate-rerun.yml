name: PR gate (re-aggregate)

# RETIRED event-driven path (#11860). This workflow NO LONGER triggers on
# `workflow_run`. Measured 2026-08-23 (window 06:06Z->06:58Z) the event-driven
# leg created 404 of the 784 repository CI runs (51.5%) -- `PR gate
# (re-aggregate)` -- of which 294 cancelled / 82 skipped / 24 pending /
# 0 success / 0 failure, and left 476 runs queued for 16 runners (~30x). The
# per-guard `workflow_run` trigger firing on a derived 76-workflow list, under a
# per-PR `cancel-in-progress: true` concurrency group, is a self-cancellation
# storm: every guard completion for a PR creates a run that cancels the
# previous one for that PR -- and each still takes a queue slot. The event path
# delivered ZERO verdicts in the window.
#
# The schedule-mutualized replacement is `pr-gate-stale-sweep.yml` (cron
# `7,27,47 * * * *`): it scans ALL open PRs, finds those whose only red is a
# stale `PR gate`, and re-runs their original gate run. It is universal (the
# only re-aggregation observer that does not depend on being triggerable, so it
# covers CodeQL and any guard) and `cancel-in-progress: false` (it never
# self-cancels). It already carries the corrected re-run (never-POST) mechanism
# of #11519. Once this storm is removed the runner queue drains and the sweep
# resolves stale verdicts within 20 minutes -- strictly better than the event
# path, which resolved none.
#
# This file is retained as a MANUAL `workflow_dispatch` harness for testing the
# re-run recipe by hand, without waiting for a guard. It is NOT a pull_request
# workflow, so the delivery canary (derive_always_on_jobs) skips it; and with no
# `workflow_run` trigger it cannot re-trigger on a gate completion, so there is
# no self-sustaining loop.
#
# MECHANISM -- re-run the original run, never POST a duplicate (#11519):
# POSTing a verdict as a check-run named "PR gate" lands it in a DIFFERENT check
# suite (CodeQL, event dynamic), and GitHub requires EVERY check-run bearing a
# required check's name to be green -- an AND, not latest-wins. A `gh run rerun`
# of the original pr-gate.yml run instead produces a check-run in the SAME
# suite, where latest-wins holds and there is exactly one instance of the
# required name. The aggregation logic reads check state live via the API, so
# the rerun verdict is fresh even though the pull_request payload is frozen.
#
# #16624 -- the ONE population where POST is not just legal but the only path:
# the gate-absent head. A PR retargeted onto main before the `edited` trigger
# existed (pr-gate.yml now listens to it) has NO `pull_request` run for its
# head SHA -- there is nothing to re-run, and nothing bearing the required
# name on the SHA to AND against, so the #11519 twin hazard cannot arise. The
# `aggregate_absent` job below runs the SAME aggregation script against live
# check state and POSTs the verdict onto the PR head. Two structural guards
# keep it honest: (a) the resolve step refuses the route when ANY "PR gate"
# check-run already exists on the SHA (never create a twin, even this way);
# (b) the POST is the script's own `--post-check-run`, the same mechanism the
# retired event path used, verdict computed -- never asserted. This dispatch
# is also the machine-readable exception to GITHUB_TOKEN anti-recursion
# (events created with GITHUB_TOKEN trigger nothing, EXCEPT workflow_dispatch
# and repository_dispatch), which is why the stale-sweep's gate-absent organ
# can drive it autonomously where a bot close+reopen would be inert.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number whose head SHA to re-aggregate (gate-absent legs set this)'
        required: false
        default: ''
      head_sha:
        description: 'Head SHA to re-aggregate (required for a real re-run)'
        required: false
        default: ''

permissions:
  contents: read
  actions: write  # re-run the original pr-gate.yml run for the PR head SHA (#11519)
  checks: write   # #16624: POST the aggregated verdict onto a gate-absent PR head

concurrency:
  group: pr-gate-rerun-${{ github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve the re-aggregation route (manual)
    # Q35 etape 2 (#17397) : agregateur pur -- resolve/re-run du gate, aucun
    # secret, docker, GPU ni toolchain locale (python stdlib seul, #17680).
    # Re-agreger decide si une PR est mergeable : tant que ce travail tourne
    # sur le parc local, il se degrade exactement quand la file qu'il doit
    # debloquer grossit (saturation du 2026-09-22). La garde same-repo
    # ci-dessous est conservee telle quelle -- seul le runner change, aucune
    # semantic de declenchement.
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      action: ${{ steps.resolve.outputs.action }}
      run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      # #17680 : la route vit dans scripts/ci/pr_gate_route.py (stdlib pur) --
      # testable en unitaire, horloge incluse. Le bash inline ne pouvait pas
      # distinguer une tentative queued MORTE d'une saine : statut identique,
      # decision identique, impasse complete (cf #17099, 19h30 queued).
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci/pr_gate_route.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve route
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          HEAD_SHA: ${{ github.event.inputs.head_sha }}
        run: |
          set -eu
          # Manual dispatch without both inputs -> nothing to unblock.
          if [ -z "$PR_NUMBER" ] || [ -z "$HEAD_SHA" ]; then
            echo "[pr-gate] dispatch without PR_NUMBER/HEAD_SHA -- nothing to re-aggregate, skip"
            echo "action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Route decision, cancel-and-wait for dead queued attempts included:
          # no run found -> twin guard / gate-absent (#11519/#16624); queued
          # beyond --stale-hours -> cancel + wait completed + rerun (#17680);
          # fresh in-flight -> skip; completed -> rerun unless green.
          python scripts/ci/pr_gate_route.py \
            --repo "$REPO" \
            --sha "$HEAD_SHA" \
            --pr-number "$PR_NUMBER"

  rerun:
    name: Re-run the original PR gate (manual)
    needs: resolve
    if: needs.resolve.outputs.action == 'rerun'
    # Q35 etape 2 (#17397) : idem resolve -- agregateur pur, ubuntu-latest.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Re-run the original run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ needs.resolve.outputs.run_id }}
        run: |
          set -eu
          if gh run rerun "$RUN_ID" --repo "$REPO"; then
            echo "[pr-gate] rerun ${RUN_ID} issued -- fresh verdict lands in the original check suite (latest-wins, no duplicate name)"
          else
            echo "[pr-gate] rerun rejected (likely flipped to in_progress between read and rerun) -- ok"
          fi

  aggregate_absent:
    name: Aggregate a gate-absent PR head (manual)
    needs: resolve
    if: needs.resolve.outputs.action == 'aggregate_absent'
    # Q35 etape 2 (#17397) : idem resolve -- agregateur pur, ubuntu-latest.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The aggregation script + the delivery canary both read the repo:
      # pr_gate.py globs DEFAULT_WORKFLOWS_DIR (.github/workflows) for
      # rule-8 always-on jobs. Same sparse cone as pr-gate.yml's own leg.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install canary dependency
        run: pip install pyyaml
      - name: Aggregate and POST the verdict onto the absent head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          HEAD_SHA: ${{ github.event.inputs.head_sha }}
        run: |
          set -eu
          # --post-check-run: this job's own check-run lands on the
          # default-branch commit (dispatch payload has no PR head), so the
          # POST is what makes the verdict visible to the PR's mergeState.
          # --no-self-cancel: a STARVED self-cancel would mark the harness
          # leg cancelled for a reason the log already names. --timeout-min 5:
          # the gate-absent population is classified with settled checks
          # (pr_gate_missing flags PRs whose rollup lacks the gate), so the
          # bounded wait is short by construction; a PR with pending
          # constituents yields STARVED -> skip, and the next dispatch (or a
          # real push) re-aggregates.
          # A non-PASS exit is a REAL verdict (FAIL / STARVED posted on the
          # head) -- it must not redden this harness job.
          python scripts/pr_gate.py \
            --repo "$REPO" \
            --sha "$HEAD_SHA" \
            --self-name "PR gate" \
            --pr "$PR_NUMBER" \
            --post-check-run \
            --timeout-min 5 \
            --poll-sec 30 \
            --settle-polls 2 \
            --dwell-min 120 \
            --no-self-cancel \
            || echo "[pr-gate] verdict non-PASS posted on the absent head -- a real verdict, not a harness failure"
