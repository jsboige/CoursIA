name: Windows .NET GradeBookApp.Tests

# Dispatch-only : ZERO declencheur pull_request/push, donc zero fan-out CI.
# Voir windows-self-hosted-tests.yml pour la rationale partagee (#12704 / #13097).
# Ce workflow execute `dotnet restore + build + test` sur le projet
# `GradeBookApp.Tests/GradeBookApp.Tests.csproj` (xunit, net9.0) et prouve
# que le runner Windows `myia-po-2024-fast-guards` peut absorber ce type de
# job — complement de la mission ai-01 chiffree dans l'issue #13378.

on:
  workflow_dispatch:

permissions:
  contents: read

# Un runner ephemeral ne peut prendre qu'un job a la fois : un second
# dispatch resterait en file pour toujours (plus de runner apres le 1er job).
# cancel-in-progress annule la file precedente au lieu de l'empiler.
concurrency:
  group: windows-dotnet-gradebook
  cancel-in-progress: true

jobs:
  windows-dotnet-tests:
    name: GradeBookApp.Tests (Windows runner)
    # Acceptance B item 1 (#12704) : garde fork EXPLICITE au niveau job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, coursia-ephemeral, coursia-fast-guards]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Preuve d'identite du runner + contexte d'execution.
      - name: Identity proof
        shell: pwsh
        run: |
          Write-Output "runner.name=$env:RUNNER_NAME"
          Write-Output "runner.os=$env:RUNNER_OS"
          Write-Output "runner.arch=$env:RUNNER_ARCH"
          Write-Output "runner.temp=$env:RUNNER_TEMP"
          dotnet --info | Out-String | Write-Output
          python --version
          python -m pip --version

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Restore explicite : le projet GradeBookApp.Tests reference
      # GradeBookApp.csproj (Lucene.NET 4.8.0-beta00017 + ClosedXML 0.105.0
      # + CsvHelper 33.1.0). Premier run valide que ces packages NuGet
      # arrivent bien sur le runner (sinon INTRINSIC reseau a documenter).
      - name: dotnet restore
        run: dotnet restore GradeBookApp.Tests/GradeBookApp.Tests.csproj

      - name: dotnet build
        run: dotnet build GradeBookApp.Tests/GradeBookApp.Tests.csproj --no-restore --configuration Release

      - name: dotnet test
        run: dotnet test GradeBookApp.Tests/GradeBookApp.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=gradebook-tests.trx"
