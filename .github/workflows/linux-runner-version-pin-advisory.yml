name: Linux runner version pin advisory

# Organe de pin de version des runners Linux self-hosted (#15201, suivi du
# compromis #15182 -- reserve n.2 de la review NanoClaw, declaree mineure
# mais qui nomme une panne reelle).
#
# Le compromis : `--disableupdate` dans l'entrypoint fige la version du
# runner a celle de l'image (le self-update du runner --ephemeral ne serait
# jamais conserve : le conteneur meurt avant, --rm efface le tarball). Le
# geste de bump est un REBUILD image (ARG RUNNER_VERSION du Dockerfile),
# documente en un seul endroit : le docblock de entrypoint.sh. Cf #15153,
# #15164.
#
# Le cout cache : entre deux rebuilds, si GitHub releve sa version requise,
# les slots restent ENREGISTRES et `online` -- et c'est GitHub qui refuse de
# leur confier un job ("required runner version"). Vu du superviseur, rien
# ne rougit : ni conteneur en erreur, ni boucle, ni sentinel. Mesure fond :
# le 2026-09-08 (pivot au rebuild), l'image epinglee 2.336.0 alors que
# GitHub exigeait 2.337.0 -- 5566 re-telechargements inutiles (~1,14 Tio,
# entrypoint.sh:75-85). Le mode de panne s'appelle "online mais non
# eligible" : un organe qui dit "online" ne mesure pas "eligible".
#
# Cet organe compare la pin (4 sites : Dockerfile ARG, Dockerfile.lean FROM,
# supervise.sh IMAGE/LEAN_IMAGE) a la derniere release publiee
# (`repos/actions/runner/releases/latest`, via gh + GITHUB_TOKEN) -- un PROXY
# de l'exigence : la version minimale exigee n'est pas exposee par GitHub, et
# l'ineligibilite qui pourrait en decouler n'est pas mesuree ici. Le rapport
# nomme donc ce qu'il mesure (review #15366). Sorties : rc 0 pin a jour et en
# phase ; rc 1 PIN_STALE ou IN_PHASE_FAILURE ; rc 2 release illisible -- un
# defaut de lecture ne justifie JAMAIS un vert.
#
# Advisory PAR CONSTRUCTION (doctrine #12817) : schedule + workflow_dispatch
# uniquement, jamais pull_request/push -- un run rouge ne bloque aucune PR.
# Cron a l'offset des sweeps 13,43 et du starvation 19,49 (jamais de
# collision). runs-on sur la jambe Linux self-hebergee (meme garde anti-fork
# que le starvation) : l'image runner porte gh + python3, zéro dependance.

on:
  schedule:
    - cron: '23,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read   # checkout du script + lecture des fichiers de pin

concurrency:
  group: linux-runner-version-pin-advisory
  cancel-in-progress: false

jobs:
  version-pin:
    name: Linux runner version pin advisory
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      # 2026-10-27 (#22722) : la commande qui echoue est le `git checkout --force -B`
      # final d'actions/checkout, pas son clean/reset interne (run 40476005592 :
      # clean et reset passent, "HEAD is now at eb8ab03489", puis le checkout
      # refuse le carnet JEPA "not uptodate; will not remove from working tree").
      # Ce refus est la verification de retrait du retrecissement sparse
      # (apply_sparse_checkout, WARNING_SPARSE_NOT_UPTODATE_FILE, git 2.43.0) :
      # a blob inchange, elle compare le fichier au blob de l'index ; ni --force
      # ni le reset interne ne la contournent. Mitigation EMPIRIQUE, mecanisme
      # NON TRANCHE : sur git 2.43.0 tout etat residuel reproduit localement est
      # deja nettoye par le clean+reset du built-in (ce step rejoue la meme
      # commande, sans effet ajoute), et l'etat qui a survecu a son reset n'est
      # pas reproduit (mutation entre reset et checkout ? checkout interrompu ?).
      - name: Restore the warm work tree before the sparse checkout
        run: |
          set -u
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            if ! dirty=$(git -C "$GITHUB_WORKSPACE" -c safe.directory="$GITHUB_WORKSPACE" status --porcelain 2>/dev/null); then
              echo "::warning::[heal-worktree] probe git status muet -- etat de l'arbre inconnu, reset applique quand meme (#22722)"
              dirty=""
            fi
            untracked=$(printf '%s\n' "$dirty" | grep -c '^??' || true)
            first_dirty=$(printf '%s\n' "$dirty" | head -n 1)
            if ! git -C "$GITHUB_WORKSPACE" -c safe.directory="$GITHUB_WORKSPACE" reset --hard --quiet; then
              echo "::warning::[heal-worktree] reset --hard a echoue -- le retrecissement sparse peut refuser (#22722)"
            elif [ -n "$dirty" ]; then
              echo "::notice::[heal-worktree] reset --hard effectue -- le job precedent avait laisse un etat sale (${first_dirty}) -- ${untracked} entree(s) non suivie(s) laissee(s) en place -- le retrecissement sparse passe (#22722)"
            fi
          fi
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          # L'organe ne lit que scripts/ci (le predicat + les fichiers de pin) :
          # clone partiel, pas de contenu hors portee (serie #11843).
          sparse-checkout: |
            scripts/ci
      # #17407 : `python` nu n'est pas expose par les slots natifs du parc
      # coursia-linux (contrat image seulement — l'organe est stdlib-only).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare runner version pin to GitHub requirement
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/check_runner_version_pin.py