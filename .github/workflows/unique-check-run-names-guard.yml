name: Unique Check-Run Names Guard

# Organe anti-homonymie (#11869) : `scripts/pr_gate.py::dedupe_latest` replie
# les check-runs par NOM seul. La premisse "le nom identifie le job" est
# enforcee ici : tout doublon de nom rendu entre jobs de workflows
# `pull_request` distincts fait rougir ce garde. Mesure fondatrice : SHA
# `cf968dcf` (PR #11856) portait 3 check-runs homonymes `Ratchet (base vs PR)`
# (notebook-papermill FAIL + 2 SUCCESS siblings plus tardifs) -- le repli a
# garde le SUCCESS, le PR gate a rapporte PASS sur un SHA qui portait un
# vrai FAIL. Le defaut est double :
#   1. le nom de job ne porte pas l'identite du workflow proprietaire
#   2. le repli garde le started_at max, indifferent a la consequence
# La correction est organisationnelle (renommer les doublons) et non
# algorithmique -- ne PAS tenter de dedupe par (workflow, name) comme
# rustine (cf. docstring dedupe_latest).
#
# Bare `main` (commit `05251bea3`) portait 3 doublons :
#   - `Ratchet (base vs PR)` x3 (3 ratchets, ACTIF sur toute PR notebook)
#   - `target-coverage` x2 (lean-conway + lean-knot, latent sur PR multi-lake)
#   - `Require genre diversity vs prev: (block on LIGHT adjacency, #11170)` x2
#     (variation-tag-guard: check-variation-adjacency-required + ...-comment)
# Renommes dans la PR #11869 (papermill / exec-sequence / output-failure,
# conway/knot target-coverage, suffix `required`/`comment`).
#
# `paths:` assumme : ce garde ne concerne QUE les workflows et le script.
# En dehors de son scope il ne produit AUCUN check (un workflow skippe par
# paths ne rapporte meme pas `skipped`), donc il ne laisse jamais de
# `pending` fantome sur les PRs sans impact.
#
# Exit codes du script : 0 = OK, 1 = duplicates trouves (rouge), 2 =
# instrument casse (verdict NUL, jamais un vert de complaisance).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, edited, reopened]
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/check_unique_check_run_names.py'
      - 'scripts/pr_gate.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Nom portant `-required` -> is_advisory() = False (pr_gate.py, motif etabli
  # par variation-tag-guard.yml).
  check-unique-names-required:
    name: 'Require unique rendered check-run names across PR workflows (#11869)'
    # Routage #14283 tranche 3 (decision ai-01 2026-09-02) : jambe Linux
    # auto-hebergee. Le `if:` ci-dessous est la garde anti-fork exigee par
    # scripts/ci/check_self_hosted_runner_policy.py ; un `runs-on` STATIQUE la
    # rend auditable (une expression dynamique leve DYNAMIC_RUNS_ON).
    # Les PRs de fork sautent le job -- pr_gate.py compte `skipped` comme OK.
    # 2026-10-27 (mesure ai-01) : migration vers `ubuntu-latest` par Q35 etape 2
    # (#17397) -- `scripts/ci/audit_self_hosted_needs.py` certifie ce workflow
    # comme n'ayant besoin de RIEN qui n'existe que sur le parc local, et le parc
    # local etait sature PAR SES CHECKOUTS (mesure 00:45Z : 11 des 12 slots
    # occupes dans `actions/checkout`, 614 runs en file). La garde anti-fork
    # ci-dessous est CONSERVEE : aucun code de fork ne change de surface.
    # 2026-10-27 (#22461, phase A) : forme hybride de debordement -- PR
    # meme-depot ET vars.CI_OVERFLOW_LOCAL == 'true' -> jambe Linux locale ;
    # tout le reste (variable absente ou fausse, forks, push/schedule/
    # dispatch) retombe sur ubuntu-latest (l'etat du 27/10). Bascule :
    # `gh variable set CI_OVERFLOW_LOCAL --body true|false --repo jsboige/CoursIA`.
    # Retour arriere = variable a `false` ou supprimee : routage 100 %
    # heberge, sans toucher ce fichier. Limite : runs-on se resout a la
    # creation du job, les runs deja en file ne bougent pas.
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository && vars.CI_OVERFLOW_LOCAL == 'true') && fromJSON('["self-hosted","coursia-ephemeral","coursia-linux"]') || 'ubuntu-latest' }}
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Le work dir de ce runner n'est PAS froid dans sa voie hebergee : le pool
      # `coursia-ephemeral` monte un volume nomme PERSISTANT par slot
      # (`supervise.sh` : `-v "${vol_prefix}-${slot}":"$WORK_MOUNT"`, #14285) et
      # seul le CONTENEUR est jetable -- c'est `actions/checkout` qui recoit le
      # meme repertoire de travail au job suivant. L'exclusion de ce fichier du
      # perimetre de #22931 reposait sur « deplace sur ubuntu-latest par
      # #22821 » ; #22921 (forme hybride de `runs-on`) a rendu cette premisse
      # fausse, en debordement le job tourne sur le meme pool chaud que les dix
      # workflows deja traites. Mesure #23127, 2026-10-28.
      # Sur `ubuntu-latest` la VM est neuve : le bloc est un no-op verifie par
      # `[ -d .git ]`, il ne coute rien et ne masque rien.
      - name: Restore the warm work tree before the sparse checkout
        run: |
          set -u
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            dirty=$(git -C "$GITHUB_WORKSPACE" -c safe.directory="$GITHUB_WORKSPACE" status --porcelain 2>/dev/null | head -n 1)
            if ! git -C "$GITHUB_WORKSPACE" -c safe.directory="$GITHUB_WORKSPACE" reset --hard --quiet; then
              echo "::warning::[heal-worktree] reset --hard a echoue -- le retrecissement sparse peut refuser (#22722)"
            elif [ -n "$dirty" ]; then
              echo "::notice::[heal-worktree] arbre restaure -- le job precedent avait laisse un etat sale (${dirty}) -- le retrecissement sparse passe (#22722)"
            fi
          fi
      - name: Checkout workflows + script
        uses: actions/checkout@v4
        with:
          # Cone mode (le defaut) n'accepte que des REPERTOIRES : une entree de
          # fichier fait echouer le checkout (`fatal: ... is not a directory`).
          # Mesure : en non-cone ces chemins se listent SANS slash initial -- la
          # forme `/chemin` que suggere l'avertissement de git rend un checkout VIDE.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows
            scripts/ci/check_unique_check_run_names.py
      - name: 'Detect duplicate rendered check-run names'
        run: |
          set -eu
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 scripts/ci/check_unique_check_run_names.py --check