name: Local path waiver guard

# #16780: a PR comment whose body is a local filesystem path (the
# `gh --body "@$TEMP/file.md"` accident) was read as a DWELL waiver -- but
# the file lives on one machine, so the "authorization" is unreadable by
# every PR reader. This advisory guard FLAGS (warning, never a gate) any
# comment body that is a lone path or carries a Windows profile path
# segment. A waiver counts only if its substance is ON the PR.
#
# #22937 (vague 2) : la jambe `issue_comment` est RETIREE. Mesure du 28/10 sur
# ce workflow : 72 des 100 runs les plus recents (tous dans la derniere heure
# et demie) etaient des runs `issue_comment` -- le premier contributeur a la file
# hebergee mesuree par le coordinateur (17 des 38 runs en file). Or le verdict
# de ce run s'attache a `main` : il n'apparait sur AUCUNE PR, ce que le
# workflow lui-meme documentait deja (#18853). La garde n'est pas retiree : son
# declencheur `pull_request` couvre la meme surface de commentaires, et le
# cote BLOQUANT de #16780 ne vit pas ici mais dans l'organe B.0
# (`scripts/check_unaddressed_nits.py`, `can_lift` + `_LONE_PATH_BODY_RE`),
# qui refuse un corps-pointeur comme levee. Ce qui disparait : l'avertissement
# tardif et invisible d'un chemin depose apres le dernier evenement de PR.
#
# Option ecartee : le debordement local de cette jambe. `issue_comment` est
# hors de `SAFE_SELF_HOSTED_TRIGGERS`
# (`scripts/ci/check_self_hosted_runner_policy.py`), qui est un default-deny :
# la passer en local relacherait une garde de securite pour un gain de slots.

on:
  # Pas de filtre `paths:` (#18853, review ai-01 5395319838) : il supprimait le
  # run `pull_request` sur presque toutes les PRs, or c'est la SEULE surface ou
  # l'avertissement s'affiche sur la PR. La garde porte sur la SURFACE DES
  # COMMENTAIRES, pas sur le diff : un commentaire peut deposer un chemin local
  # sur une PR qui ne touche aucun fichier particulier ; un filtre `paths:` la
  # rendrait aveugle sur exactement les PRs ou le defect arrive. Le
  # sparse-checkout suffit au gain de temps (91 s -> ~6 s).
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to check'
        required: true
        type: string

permissions:
  issues: read
  pull-requests: read

# The group is keyed by EVENT as well as by PR, so a manual run
# (`workflow_dispatch`) never supersedes the `pull_request` run of the same PR.
# The `issue_comment` leg that once forced this split is gone (#22937 vague 2) :
# it executed against the default branch, so its check-run attached to `main`,
# never to the PR head, and sharing one group let every comment cancel the
# PR-head run still waiting in the queue -- leaving the head with a `cancelled`
# check that `PR gate` reads as "never concluded" -> FAIL : an advisory guard
# turned into a kill-switch (measured 2026-09-22 on 25 open PRs, 22 gates
# citing it). With no main-attached run left, that defect cannot recur; the
# event key is kept so the two remaining kinds stay separated.
concurrency:
  group: local-path-waiver-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  guard:
    name: No local-path waiver bodies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/local-path-waiver-guard.yml
            scripts/check_local_path_waivers.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve PR number
        id: pr
        run: |
          PR="${{ github.event.pull_request.number || github.event.inputs.pr_number }}"
          echo "number=$PR" >> "$GITHUB_OUTPUT"
      - name: Check PR comment surface
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Arbitration ai-01 (#16780): the leak is VISIBLE but never a gate --
        # the path comes from a miswritten command on another machine; failing
        # the victim PR's check punishes the innocent and erases nothing.
        # The blocking side of #16780 lives in the B.0 organ (can_lift).
        run: python scripts/check_local_path_waivers.py "${{ steps.pr.outputs.number }}" --report-only
