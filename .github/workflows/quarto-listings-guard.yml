name: quarto-listings-guard

# Garde des listings Quarto (#25680, fille de l'EPIC #10921).
#
# Doctrine : un listing Quarto declare dans le front matter d'un `index.qmd`
# ou d'un `README.md` se rend VIDE si son motif `contents:` ne correspond a
# aucun fichier sur disque -- le lecteur voit une zone blanche et la console
# du navigateur porte l'erreur « The list needs to have at least one item on
# init ». Aucun organe existant ne voyait cette classe : `check_site_links.py`
# teste les liens, et un listing vide ne produit AUCUN lien casse.
#
# L'organe scripts/ci/check_quarto_listings.py resout chaque motif `contents:`
# et echoue si l'un ne matche aucun fichier. L'echec du check-run EST le
# signalement, visible sans ouvrir les logs.
#
# Le filtre de chemins couvre les carnets `.ipynb` : un carnet renomme peut
# vider un listing sans qu'aucun `index.qmd` ni `README.md` ne soit touche.

on:
  pull_request:
    paths:
      - '**/index.qmd'
      - '**/README.md'
      - '**/*.ipynb'
      - 'scripts/ci/check_quarto_listings.py'
      - 'scripts/ci/tests/test_check_quarto_listings.py'

permissions:
  contents: read

concurrency:
  group: quarto-listings-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  listings:
    # Forme hybride de debordement (#23053) : PR meme-depot ET
    # vars.CI_OVERFLOW_LOCAL == 'true' -> jambe Linux locale ; tout le reste
    # (variable absente ou fausse, forks, dispatch) retombe sur ubuntu-latest,
    # donc l'etat du 28/10 est conserve. Bascule :
    # `gh variable set CI_OVERFLOW_LOCAL --body true|false --repo jsboige/CoursIA`.
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository && vars.CI_OVERFLOW_LOCAL == 'true') && fromJSON('["self-hosted","coursia-ephemeral","coursia-linux"]') || 'ubuntu-latest' }}
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # ref: la TETE de la branche PR, jamais le merge ref -- le garde
          # mesure l'etat du code que la PR propose.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: "Chaque motif de listing resout au moins un fichier sur disque"
        run: python scripts/ci/check_quarto_listings.py
