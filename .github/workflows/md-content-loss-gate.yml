name: Markdown content-loss gate

# ABSORBE PAR LA VOIE RAPIDE (#12396, tranche 4) : sur `pull_request`, ce
# garde est desormais rendu par `fast-lane-shadow.yml` (check-run nomme
# `No markdown content loss in changed notebooks`, meme nom que ce job, meme
# verdict -- rc=1 defaut / rc=2 illisible, anti-auto-desarmement AGREGE
# porte par le flag `fail_on_all_warn` du moteur --, un seul checkout pour
# toute la lane). Ce fichier garde `workflow_dispatch` pour le re-run manuel
# sur `main` apres une panne CI (#9858). Les `paths:` et l'argv d'origine
# vivent dans `scripts/ci/fast_lane_registry.py` (TRANCHE4).

# Purpose
# -------
# Per-PR gate that catches markdown CONTENT LOSS a cellule tronquee : une PR
# du rollout #3966 (demotion de titres H1/H2 en callouts blockquote) peut,
# quand le correcteur one-shot opere sur une cellule dont le `source` est une
# chaine unique jointe, REMPLACER LA CELLULE ENTIERE par le seul callout. Une
# cellule de 941 caracteres (enonce + contraintes + indices) se reduit a 16 ;
# un bloc `**Navigation**` + 5 objectifs disparait. Aucun garde existant ne
# mesure le volume de prose markdown -> la CI reste verte (issue #8655).
#
# Ce gate est le filet : il compare chaque notebook modifie entre sa base git
# (origin/<base_ref>) et sa tete (working tree) et signale toute cellule
# markdown dont le contenu normalise chute sous 75 % du volume d'origine, et
# toute perte de motif structurant (Navigation / Objectifs / Prerequis / Enonce
# / liens de navigation). La transformation LEGITIME titre->callout est
# invisible apres normalisation (heading `#{1,6}` et callout `> **X :**` sont
# retires) -> pas de faux positif sur une demotion honnete.
#
# Detector: scripts/notebook_tools/detect_md_content_loss.py (#8655), run in
# --check mode (exit 0 clean, exit 1 on defect) on every notebook changed by
# the PR. Diff-scoped (base git vs working tree) : les pertes pre-existantes
# sur `main` ne sont pas relevees tant que le notebook n'est pas touche
# (clavette, comme degenerate-figure-gate).
#
# Sortie exploitable en review : fichier / cellule / avant-apres / ratio /
# motifs perdus. Le detecteur SIGNALE ; la PR justifie en review (une
# reformulation legitime qui resserre le texte reste au-dessus de 75 %).
#
# See issue #8655 (cahier des charges + 3 cas reels), registre #3966 (le rollout
# demotion-de-titres dont provient le defaut), degenerate-figure-gate.yml
# (modele de gate diff-scoped), detect_link_target_regression.py (modele de
# detecteur base-vs-head).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: md-content-loss-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  md-content-loss:
    name: "No markdown content loss in changed notebooks"
    # Route vers la jambe Linux auto-hebergee (#13378 tranche 5, decision ai-01
    # 2026-09-02) : garde Python pur, sans secret. La garde same-repo ci-dessous
    # saute les PRs de fork (pr_gate.py compte `skipped` comme OK) : aucun code de
    # fork n'atteint le runner. Retour arriere = revert de la PR.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gate changed notebooks
        env:
          # Forme sure : le body arrive comme variable d'environnement et
          # n'est jamais interpole dans le shell (identique a
          # always-on-guards.yml l.934). Sur workflow_dispatch,
          # github.event.pull_request est nul -> chaine vide -> inerte,
          # conforme a l'Acceptance #13491 (malforme = inert).
          MD_CONTENT_LOSS_PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::notice title=Markdown content-loss gate::Manual dispatch — nothing to diff."
            exit 0
          fi

          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- 'MyIA.AI.Notebooks/**/*.ipynb' || true)
          if [ -z "$CHANGED" ]; then
            echo "::notice title=Markdown content-loss gate::No notebooks changed — clean."
            exit 0
          fi

          # Justification par-cellule depuis le body de la PR (#13491, option a) :
          # le detecteur parse le body de la PR a la recherche de markers
          # `md-content-loss: reecriture assumee -- <notebook> cell <N> : <raison>`
          # qui exonerent le finding TRUNCATED_CELL correspondant (transparence :
          # le finding devient TRUNCATED_CELL_JUSTIFIED_BY_BODY et reste dans la
          # sortie machine, seul le verdict binaire --check passe a 0). Sans
          # marker pour un finding donne, le comportement nominal (rc=1) est
          # preserve. Le body est passe via l'env var in-memory
          # MD_CONTENT_LOSS_PR_BODY (canal recommande, evite le pattern CodeQL
          # `actions/code-injection` declenche par `printf` du body dans le shell
          # qui taint le body vers le shell). Le detecteur la resout en
          # priorite sur --pr-body-file / MD_CONTENT_LOSS_PR_BODY_FILE (canal
          # historique, conserve pour les tests unitaires et les out-of-band
          # invocations). Les PRs sans body (string vide) ne matchent rien,
          # comportement actuel preserve (cf Acceptance #13491 : malforme = inert).

          echo "## Markdown content-loss gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          fail=0
          checked=0
          unreadable=0
          while IFS= read -r nb; do
            [ -z "$nb" ] && continue
            # Skip notebooks deleted by the PR.
            [ -f "$nb" ] || continue
            checked=$((checked + 1))
            # `&& rc=0 || rc=$?` is load-bearing under `bash -e`: a bare `out=$(cmd)`
            # that exits non-zero aborts the step before `rc=$?` is read, making the
            # rc=1/rc=2 branches below dead code and the failure anonymous (#8884 motif).
            # NOT `|| true` (that makes $? read 0 from `true` and permanently disarms the gate).
            out=$(python scripts/notebook_tools/detect_md_content_loss.py --base "$BASE" --check "$nb" 2>&1) && rc=0 || rc=$?
            if [ "$rc" -eq 1 ]; then
              echo "::error title=Markdown content loss::$nb lost substantial markdown content (truncated cell or lost structuring motif). If this is a legit rephrase, add a per-cell marker in the PR body: 'md-content-loss: reecriture assumee -- <notebook> cell <N> : <raison>' (one per justified cell, see #13491)."
              echo "<details><summary><code>$nb</code></summary>" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "$out" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "</details>" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            elif [ "$rc" -eq 2 ]; then
              echo "::warning title=Markdown content-loss gate::$nb could not be read (rc=2); see detector log."
              unreadable=$((unreadable + 1))
            fi
          done <<< "$CHANGED"

          # Anti-self-disarmament guard (reserve ai-01 c.28 sur #8656) :
          # si CHAQUE notebook tente etait illisible (rc=2), le gate n'a rien
          # analyse -> il NE PEUT PAS certifier "no content loss". Un detecteur
          # casse ou une ref git manquante desarmerait silencieusement ce gate
          # (la classe de defaut meme qu'il attrape) en renvoyant un notice vert.
          # On fail loud dans ce cas plutot que de donner un quitus a l'aveugle.
          if [ "$checked" -gt 0 ] && [ "$unreadable" -eq "$checked" ]; then
            echo "::error title=Markdown content-loss gate::All $checked changed notebook(s) were unreadable (rc=2) — the gate analyzed NOTHING and cannot certify content integrity. This is likely a broken detector or a missing git ref (BASE=$BASE), not a clean bill of health. Failing loud (anti-self-disarmament, #8655/#8656)."
            echo "FIX: the gate could not read any changed notebook. Check the detector log above and the BASE ref ($BASE). Do NOT treat this as a pass." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "FIX: a markdown cell lost substantial content. Two usual causes (see the detector log above for which): (1) the demotion one-shot replaced a whole joined-string cell instead of its heading line only (#8655) -- restore the content and re-apply the heading->callout demotion LINE BY LINE via \`python scripts/notebook_tools/demote_md_asides.py --dir\` ; (2) a YAML frontmatter cost block was removed but its fields were NOT migrated equivalently into \`nb['metadata']['cost']\` (#8919) -- migrate the cost values verbatim (the detector names the divergent fields). A legit rephrase in the 4-75 % band (not a migration) is now admitted by per-cell markers in the PR body (#13491): add 'md-content-loss: reecriture assumee -- <notebook> cell <N> : <raison>' -- one per cell you knowingly rewrote; the gate verifies the marker names the right (notebook, cell) before honoring it." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "::notice title=Markdown content-loss gate::Checked $checked changed notebook(s); no content loss."
