      - 'MyIA.AI.Notebooks/Probas/Applications/Percolation/percolation_lean/lakefile.lean'
      - 'MyIA.AI.Notebooks/Probas/Applications/Percolation/percolation_lean/lean-toolchain'
      # geometry_lean (herite du wrapper lean-geometry.yml supprime, #13751 :
      # 0 sorry verifie de naissance, axiom target-modules "*" + allow-axioms vide,
      # fail-on-sorry true par defaut -- parametres reportes au manifeste)
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/Geometry/geometry_lean/**.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/Geometry/geometry_lean/lakefile.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/Geometry/geometry_lean/lean-toolchain'
      # hecke_lean (herite du wrapper lean-hecke.yml supprime, #13751 :
      # 0 sorry verifie, axiom target-modules "*" + allow-axioms vide,
      # fail-on-sorry true par defaut -- parametres reportes au manifeste)
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/hecke_lean/**.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/hecke_lean/lakefile.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/hecke_lean/lakefile.toml'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/hecke_lean/lean-toolchain'
      # sensitivity_lean (herite du wrapper lean-sensitivity.yml supprime, #13751 :
      # 0 sorry verifie, axiom target-modules "*" + allow-axioms vide,
      # fail-on-sorry true par defaut -- parametres reportes au manifeste)
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/sensitivity_lean/**.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/sensitivity_lean/lakefile.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/sensitivity_lean/lakefile.toml'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/sensitivity_lean/lean-toolchain'
      # compression_lean (lake dedie de l'EPIC #18706, decision D4 -- jumeau
      # formel de la serie Compression : 0 sorry de naissance, axiom
      # target-modules "*" -- parametres au manifeste)
      - 'MyIA.AI.Notebooks/Compression/Compression_lean/**.lean'
      - 'MyIA.AI.Notebooks/Compression/Compression_lean/lakefile.lean'
      - 'MyIA.AI.Notebooks/Compression/Compression_lean/lakefile.toml'
      - 'MyIA.AI.Notebooks/Compression/Compression_lean/lean-toolchain'
      - 'MyIA.AI.Notebooks/Compression/Compression_lean/lake-manifest.json'
      # riemann200_lean (lake dedie de la serie Riemann200, EPIC #20403
      # critere 2 -- 0 sorry verifie, axiom target-modules "*", Mathlib
      # epingle db584cd6d4 -- parametres au manifeste)
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/Riemann200/riemann200_lean/**.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/Riemann200/riemann200_lean/lakefile.lean'
