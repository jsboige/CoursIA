      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/Riemann200/riemann200_lean/lake-manifest.json'
      # Self-cover B.3 herite du wrapper lean-serre.yml supprime (#17336) :
      # le moteur d'axiomes change -> le gate axiom de serre100 rejoue.
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/lean_server.py'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/prover/lean_utils.py'
      # Self-cover du contrat certifie herite du wrapper lean-social-choice.yml
      # supprime (#17374) : l'instrument ou son test change -> la jambe
      # certifiee de gametheory rejoue.
      - 'scripts/lean/check_certified_sorry.py'
      - 'scripts/lean/count_code_sorry.py'
      - 'scripts/tests/test_check_certified_sorry.py'
      - '.github/workflows/lean-ci-matrix.yml'
      - '.github/workflows/lean-build.yml'
      - '.github/actions/lean-build/action.yml'
      - 'scripts/lean/ci_lakes.json'
      - 'scripts/lean/lake_matrix_dispatch.py'
      # Le lecteur de fichiers modifies EST le gate de dispatch : s'il
      # change, la detection change -> tous les lakes rejouent (#22065).
      - 'scripts/lean/lean_matrix_changed_files.py'
      - 'scripts/lean/tests/test_lean_matrix_changed_files.py'
      - 'scripts/ci/check_lake_matrix_paths.py'
      - '.github/actions/lean-axiom/action.yml'
      - 'scripts/lean/axiom_check_step.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Detection : quels lakes du manifeste sont touches par l'evenement.
  # Les fichiers changes viennent de l'API REST (pull_request : fichiers
  # de la PR ; push : compare avant..apres) -- pas d'un checkout profond
  # du depot. Sur workflow_dispatch : tous les lakes (le declenchement
  # manuel est une intention explicite de tout lancer ; le script y
  # arrive par le self-cover).
  changes:
    name: lean-matrix-changes
    # 2026-10-28 (#23053 famille (c), lane myia-ai-01:CoursIA-2) : forme hybride
    # de debordement CI (#22937/#22944/#23016). PR meme-depot ET
    # vars.CI_OVERFLOW_LOCAL == 'true' -> jambe Linux locale ; tout le reste
    # (variable absente ou fausse, forks, push/dispatch) retombe sur
    # ubuntu-latest. La garde same-repo vit dans l'expression elle-meme : c'est
    # la forme hybride acceptee par scripts/ci/check_self_hosted_runner_policy.py.
    # Bascule : `gh variable set CI_OVERFLOW_LOCAL --body true|false --repo
    # jsboige/CoursIA`. Retour arriere = variable a `false` ou supprimee, sans
    # toucher ce fichier.
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository && vars.CI_OVERFLOW_LOCAL == 'true') && fromJSON('["self-hosted","coursia-ephemeral","coursia-linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      any: ${{ steps.dispatch.outputs.any }}
      lake-set: ${{ steps.dispatch.outputs.lake-set }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Le checkout passe AVANT la lecture (#22065) : la lecture est
      # desormais un script du depot, pas une ligne de shell. Un repli
      # muet y etait possible (`|| echo -n "" > "$out"`) : un 403 de
      # quota vidait la liste des fichiers modifies, donc `any=false`,
      # donc le build Lean etait `skipped` -- et `skipped` se lit comme
      # un vert. Un build Lean qui n'a pas eu lieu s'affichait comme
      # fait (instance #21999, run 39814286963).
      - name: Checkout (dispatch script + manifest only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/lean
      - name: Changed files for this event
        run: |
          set -eu
          python3 scripts/lean/lean_matrix_changed_files.py \
            --event "${{ github.event_name }}" \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --before "${{ github.event.before }}" \
            --sha "${{ github.sha }}" \
            --out "$RUNNER_TEMP/changed.txt"
          echo "--- changed files (${{ github.event_name }}) ---"
          cat "$RUNNER_TEMP/changed.txt"
      - name: Dispatch lakes from manifest
        id: dispatch
        run: |
          python3 scripts/lean/lake_matrix_dispatch.py \
            --changed-file "$RUNNER_TEMP/changed.txt" \
            --outputs-file "$GITHUB_OUTPUT"
          echo "--- lake-set ---"
          cat "$GITHUB_OUTPUT"

  # Fan-out : passe l'ensemble au reutilisable, qui l'etale en une entree
  # par lake (job `ci-matrix` de lean-build.yml). Les 4 inputs mono-lake
  # sont des valeurs de facade (required: true au sens du schema) -- en
  # mode matrice, `ci` est garde par `if: lake-set == 'none'` et ne tourne
  # jamais ; il apparait comme check-run SKIPPED (inactif, jamais bloquant).
  lean-matrix:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    # Ref LOCALE `./` (pas `jsboige/CoursIA/...@main`) : la resolution
    # per-PR est la condition meme de livrabilite de cette PR -- sur une
    # PR de test, `@main` appellerait le lean-build.yml de main, qui n'a
    # pas encore l'input `lake-set` (echec d'appel : unknown input).
    # Meme pattern que le job proof-integrity de lean-knot.yml (« ref
    # locale ./ = resolution per-PR »).
    uses: ./.github/workflows/lean-build.yml
    with:
      project-path: scripts/lean/ci_lakes.json
      display-name: matrix
      sorry-baseline: "0"
      sorry-filter-mode: real
      lake-set: ${{ needs.changes.outputs.lake-set }}
