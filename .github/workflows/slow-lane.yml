name: Slow lane (voie asynchrone, tranches 1-2 #12856)

# VOIE LENTE — execution asynchrone sur main, hebdomadaire.
#
# Contexte (cf. #11835, #12856) :
#
#   Le depot pese 2,1 Go et 46 workflows le clonent avec `fetch-depth: 0` sur
#   `pull_request`. Une PR notebook declenche ~46 workflows pour ~235 min de
#   temps runner, contre 17 runners : le `PR gate` (borne 12 min) expire alors
#   sur des PR SAINES, et c'est ce faux rouge qui fait vieillir les PR.
#
#   Le pilote tranche 1 (#11835 volet 1) demontre la voie rapide (1 checkout
#   pour 9 gardes, gain d'execution 5,1x) en OMBRE — les workflows d'origine
#   tournent toujours. Le present workflow est le **complement asynchrone** :
#   sortir les controles **lourds et idempotents** du `pull_request` et les
#   payer une fois par fournee sur `main`.
#
# Strategie user 2026-08-23 :
#
#   "Les jobs lourds ne devraient etre payes qu'une fois par fournee,
#    les legers tournent a chaque fois, et pourquoi pas les moyens peuvent
#    etre declanches sur des batchs controles."
#
# TRANCHE 1 (cette PR) : CABLER LE MECANISME, NE PAS L'ACTIVER.
#
#   Ce workflow execute UN job de demonstration (`ict-tests-pilot`) qui re-run
#   la suite ICT-Series (`ict-tests.yml`) contre `main` sur schedule hebdo.
#   Aucun workflow d'origine n'est touche dans cette PR : c'est tranche 2+
#   qui deplacera reellement les triggers `pull_request`, en respect du
#   critere d'acceptance #12856-2 ("chaque workflow deplace perd son trigger
#   pull_request **dans le meme commit** que son ajout a la voie lente").
#
#   Le pilote sert de preuve que l'infrastructure est viable :
#     - le schedule declenche bien un run,
#     - le verdict est publie (annotation sur le run, ou commentaire de fournee),
#     - la mesure avant/apres est reproductible (`scripts/ci/measure_runner_demand.py`).
#
# Critere de sortie : la premiere MOUVEMENT reel d'un workflow dans la voie
# lente (tranche 2) ne se fait que si cette tranche 1 a ete observee en
# production pendant >= 1 semaine, avec publication de verdict, sans faux
# vert ni faux rouge. Cf. acceptance #12856-1, 3, 4.
#
# REVERSIBILITE : `git revert` d'un seul commit retire `slow-lane.yml` et
# restaure le regime actuel. Aucun fichier d'origine n'est modifie dans
# cette PR, donc la reversibilite est triviale.
#
# TRANCHE 2 (cette PR) : PREMIER MOUVEMENT REEL — CodeQL vers la voie lente.
#
#   Sortie de tranche 1 constatee : run schedule 33463688662 (2026-09-01
#   02:44 UTC) conclusion success, step "Publish verdict" success ; workflow
#   en production depuis ~1 semaine sans faux vert ni faux rouge.
#
#   Mesure 24h (niveau ETAPE, instrument du commentaire ai-01 2026-08-24 —
#   jamais run- ou job-level, contamines par l'attente en file) : le default
#   setup CodeQL a tire **78 runs `pull_request` en 24 h** (matrice x4 =
#   ~312 jobs Analyze, ~14 min/run github-hosted), y compris sur des PR
#   100 % docs/markdown qui ne touchent ni C#, ni JS, ni workflows — ~18 h
#   de runner par jour pour une detection qui n'est pas un check requis
#   (seul `PR gate` l'est, cf. #12856). Tout le reste du top step-level est
#   soit paths-filtre sur la surface touchee (Scripts Tests 9,2 min/run,
#   Notebook Validation 5,4, ML Tests 5,2, Quarto 3,7 post-scoping #14429,
#   golden-set 3,1 = regime H.7), soit hors scope (PR gate), soit deja
#   mutualise (Always-on guards). Deplacer ces derniers serait une
#   regression de couverture, pas une economie (#12856 : "a instruire, pas
#   a bouger a l'aveugle").
#
#   COT ADMIN — POINT DE COORDINATION AU MERGE (le trigger a retirer ne vit
#   pas dans un fichier) : CodeQL per-PR vient du DEFAULT SETUP
#   (`dynamic/github-code-scanning/codeql`, settings repo), inatteignable
#   par commit. La bascule COMPLETE = desactiver le default setup AU MERGE
#   de cette PR : Settings > Code security and analysis > Code scanning >
#   Default setup > Disable (ou `gh api -X PATCH
#   repos/jsboige/CoursIA/code-scanning/default-setup -f state=not-configured`).
#   Sans ce toggle, le default setup continue de tirer sur chaque PR EN PLUS
#   du schedule = double cout. Ne merger cette jambe qu'avec le toggle.
#
#   Reversibilite tranche 2 : `git revert` du commit + reactiver le default
#   setup restaurent le regime per-PR.
#
# TRANCHE 2 — JAMBE CODEQL RETIREE (issue #22548, 2026-10-25).
#
#   Le job `codeql-scheduled` ci-dessous n'existe plus : CodeQL passe en
#   ADVANCED SETUP (`.github/workflows/codeql.yml`, decision mainteneur
#   Q142 = c). Ce fichier porte desormais lui-meme le `schedule`
#   hebdomadaire ET le `push: main`, avec la meme matrice x4 sur le runner
#   heberge : garder les deux jambes aurait produit deux analyses de la meme
#   tete de `main` sous la MEME categorie SARIF (`/language:<lang>`), donc
#   des alertes qui se recouvrent. Le contenu du job a ete repris un a un
#   dans `codeql.yml` — runner heberge, `timeout-minutes: 45`, permissions
#   `security-events: write`, `fail-fast: false`, matrice x4, `init`/
#   `analyze` et le verdict publie (`::notice`/`::error` sur l'outcome de
#   l'analyse). Un seul ecart, deliberé : les langages interpretes et C#
#   tournent en `build-mode: none` et `autobuild` n'est plus utilise (voir
#   l'en-tete de `codeql.yml` : le default setup construisait le C#,
#   ~6 min 34 s sur #14746 — le `none` est un arbitrage de cout, pas un
#   portage iso-cout).
#
#   Le job `ict-tests-pilot` de la tranche 1 reste : il n'est pas concerne.

on:
  # Schedule hebdo (mardi 02:30 UTC, apres le pic push europeen) — une seule
  # execution par fournee, comme le demande la strategie.
  schedule:
    - cron: '30 2 * * 2'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Groupe distinct du `ict-tests.yml` d'origine : les runs slow-lane ne
  # partagent pas la cle avec les runs PR, donc pas de cancel-in-progress
  # croise (cf. pieges `pages-deploy` #11616).
  group: slow-lane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PILOTE — la suite ICT-Series (legerement lourde : ~3-5 min runner, 746
  # items + 42 items) est ideale pour ce pilote : elle a deja `push: main`
  # dans `ict-tests.yml`, donc le delta est nul sur main (la voie rapide y
  # tourne deja), mais le run slow-lane sert de preuve que la voie
  # asynchrone tient un verdict sur un cycle hebdomadaire. Tranche 2
  # deplacera reellement le trigger `pull_request` d'`ict-tests.yml` ici.
  ict-tests-pilot:
    name: Slow-lane ICT-Series pilot
    # Routage #14283 tranche 4 (ai-01 2026-09-02) : balayage cron pur-Python.
    # Declencheur `schedule` uniquement -- il ne tourne que sur la branche par
    # defaut, donc aucun code de fork ne peut l'atteindre et aucune garde
    # same-repo n'est requise (cf en-tete de check_self_hosted_runner_policy.py).
    # Retour arriere = remettre `runs-on: ubuntu-latest` + retrait de l'allowlist.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    # 60 min, comme `ict-tests.yml` (voie rapide). Mesure firsthand le
    # 2026-10-26 (runs 40333089185 / 40328940542) : la jambe `tests/` dure
    # jusqu'a 7 min 54 s et la jambe `ict/tests/` jusqu'a 10 min 26 s,
    # **en plus** de l'installation (~2 min). A 15 min, le correctif de
    # collecte aurait simplement transforme le faux vert en timeout rouge.
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install ICT-Series package
        working-directory: MyIA.AI.Notebooks/IIT/ICT-Series
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run ict-tests suite
        id: pytest
        working-directory: MyIA.AI.Notebooks/IIT/ICT-Series
        run: |
          set +e
          # DEUX invocations, DEUX rootdirs -- exactement ce que fait
          # `ict-tests.yml` (voie rapide). Une session unique
          # (`pytest tests ict/tests`) melange deux arbres qui partagent
          # 16 basenames de modules (`test_time_arrow.py`, `test_workspace.py`,
          # `test_catastrophe.py`, ...) SANS `__init__.py` : pytest les importe
          # par nom de fichier et refuse (`import file mismatch`) -> 16 erreurs
          # de COLLECTE, pas un defaut ICT. La suite ne collectait donc qu'UN
          # item et n'executait rien -- et le job, lui, restait `success`
          # (cf. le bloc "code de sortie" plus bas, et docs/ci/slow-lane.md,
          # section "faux vert du pilote").
          #
          # `--import-mode=importlib` sur la session unique serait un faux
          # VERT : ce mode ignore les `sys.path.insert` de niveau module, or
          # `ict/tests/` en depend pour son `from ict import ...` -- c'est
          # precisement pourquoi `ict/tests/pytest.ini` existe (il remet le
          # mode `prepend` pour cette jambe). En separant les deux jambes,
          # chacune garde son rootdir, donc chacune son mode d'import.
          # Les deux sorties sont conservees separement : un verdict agrege
          # qui masque la jambe tombee serait un faux vert.
          python -m pytest tests -q --no-header 2>&1 | tee /tmp/ict-pilot-tests.log
          RC_TESTS=${PIPESTATUS[0]}
          python -m pytest ict/tests -q --no-header 2>&1 | tee /tmp/ict-pilot-ict-tests.log
          RC_ICT=${PIPESTATUS[0]}
          echo "exit_code_tests=${RC_TESTS}" >> "$GITHUB_OUTPUT"
          echo "exit_code_ict_tests=${RC_ICT}" >> "$GITHUB_OUTPUT"
          # Le code de sortie de l'ETAPE vaut le code de sortie de la suite.
          # Avant ce correctif, `set +e` + `PIPESTATUS` ecrit dans un output
          # laissait l'etape se terminer sur le `echo` (donc 0) et le job
          # demeurait `success` meme quand la suite echouait : mesure sur le
          # run 39389459201 (2026-10-20), ou le log porte
          # `##[error]La suite ICT-Series a echoue (exit=2)` et que les etapes
          # 5 ET 6 sont `success`. Le verdict du pilote doit pouvoir ROUGIR
          # (criterion d'acceptance #12856-4) ; l'annotation `::error` de
          # l'etape suivante ne fait pas echouer une etape, il l'orne.
          if [ "${RC_TESTS}" -ne 0 ] || [ "${RC_ICT}" -ne 0 ]; then
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "exit_code=0" >> "$GITHUB_OUTPUT"

      - name: Publish verdict
        if: always()
        env:
          PYTEST_EXIT: "${{ steps.pytest.outputs.exit_code }}"
          RC_TESTS: "${{ steps.pytest.outputs.exit_code_tests }}"
          RC_ICT: "${{ steps.pytest.outputs.exit_code_ict_tests }}"
        run: |
          TAIL_TESTS="$(tail -n 15 /tmp/ict-pilot-tests.log 2>/dev/null || echo '(no log)')"
          TAIL_ICT="$(tail -n 15 /tmp/ict-pilot-ict-tests.log 2>/dev/null || echo '(no log)')"
          if [ "${PYTEST_EXIT}" != "0" ]; then
            echo "::error title=Slow-lane ICT-Series pilot (ECHEC DE LA SUITE)::La suite ICT-Series a echoue en mode slow-lane (tests/ exit=${RC_TESTS}, ict/tests/ exit=${RC_ICT}). Le job est ROUGE : c'est le verdict de la voie lente sur main, pas un incident du runner. Verdict : a investiguer. tail tests/ : ${TAIL_TESTS} -- tail ict/tests/ : ${TAIL_ICT}"
          else
            echo "::notice title=Slow-lane ICT-Series pilot (PASS)::La suite ICT-Series a reussi en mode slow-lane (tests/ exit=${RC_TESTS}, ict/tests/ exit=${RC_ICT}) (tranche 1 #12856). Ce job sera re-run chaque mardi 02:30 UTC."
          fi

