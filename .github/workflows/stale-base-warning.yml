name: Stale Base Branch Warning

# DORMANT depuis #14057 (Vague 2 tranche 1, patron #13384) : l'organe
# pull_request ci-dessous est absorbe par always-on-metadata-guards.yml --
# un seul workflow, un seul checkout, un seul slot de runner par PR (149
# runs/fenetre pour ~3 min de travail reel, mesure etape 1 de #14057). Le
# job est conserve verbatim pour la tracabilite ; le declencheur
# pull_request est retire.

on:
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: stale-base-warning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-base-age:
    name: Check base branch staleness
    # Route vers la jambe Linux auto-hebergee (#13378 tranche 5, decision ai-01
    # 2026-09-02) : garde Python pur, sans secret. La garde same-repo ci-dessous
    # saute les PRs de fork (pr_gate.py compte `skipped` comme OK) : aucun code de
    # fork n'atteint le runner. Retour arriere = revert de la PR.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    # #23349 : borne explicite. Mesure du 2026-11-09 sur les 3 derniers runs
    # verts de ce job : max 0.23 min. Marge x2 -- le defaut d'Actions est
    # 6 h, et un job fige tient son slot tout ce temps.
    timeout-minutes: 10
    steps:
      # 2026-10-27 (#22722) : la commande qui echoue est le `git checkout --force -B`
      # final d'actions/checkout, pas son clean/reset interne (run 40476005592 :
      # clean et reset passent, "HEAD is now at eb8ab03489", puis le checkout
      # refuse le carnet JEPA "not uptodate; will not remove from working tree").
      # Ce refus est la verification de retrait du retrecissement sparse
      # (apply_sparse_checkout, WARNING_SPARSE_NOT_UPTODATE_FILE, git 2.43.0) :
      # a blob inchange, elle compare le fichier au blob de l'index ; ni --force
      # ni le reset interne ne la contournent. Mitigation EMPIRIQUE, mecanisme
      # NON TRANCHE : sur git 2.43.0 tout etat residuel reproduit localement est
      # deja nettoye par le clean+reset du built-in (ce step rejoue la meme
      # commande, sans effet ajoute), et l'etat qui a survecu a son reset n'est
      # pas reproduit (mutation entre reset et checkout ? checkout interrompu ?).
      - name: Restore the warm work tree before the sparse checkout
        run: |
          set -u
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            if ! dirty=$(git -C "$GITHUB_WORKSPACE" -c safe.directory="$GITHUB_WORKSPACE" status --porcelain 2>/dev/null); then
              echo "::warning::[heal-worktree] probe git status muet -- etat de l'arbre inconnu, reset applique quand meme (#22722)"
              dirty=""
            fi
            untracked=$(printf '%s\n' "$dirty" | grep -c '^??' || true)
            first_dirty=$(printf '%s\n' "$dirty" | head -n 1)
            if ! git -C "$GITHUB_WORKSPACE" -c safe.directory="$GITHUB_WORKSPACE" reset --hard --quiet; then
              echo "::warning::[heal-worktree] reset --hard a echoue -- le retrecissement sparse peut refuser (#22722)"
            elif [ -n "$dirty" ]; then
              echo "::notice::[heal-worktree] reset --hard effectue -- le job precedent avait laisse un etat sale (${first_dirty}) -- ${untracked} entree(s) non suivie(s) laissee(s) en place -- le retrecissement sparse passe (#22722)"
            fi
          fi
      - uses: actions/checkout@v4
      # Ce garde ne lit AUCUN contenu de fichier : `git rev-list --count` et
      # `git show -s --format=%ct` n'interrogent que le graphe de commits
      # (`-s` supprime le diff). Un `fetch-depth: 0` nu transfere pourtant les
      # 1,82 Gio du pack -- dont ~800 Mo de revisions historiques de blobs
      # (une seule cellule TTS pese ~400 Mo en cumul de revisions) -- pour lire
      # des dates de commits.
      #
      # `filter: blob:none` garde le graphe complet, requis par `rev-list
      # BASE..origin/main --count`, et rend les blobs paresseux ; le
      # `sparse-checkout` limite ce que l'arbre de travail materialise a
      # `.github` (0,6 Mo), au lieu des 1058 Mo de HEAD (757 Mo de
      # MyIA.AI.Notebooks/ + 246 Mo de slides/). Le `git fetch origin main` de
      # l'etape suivante herite du filtre du clone partiel.
      #
      # Mesure attendue, a lire dans la duree de l'etape « Set up job » /
      # checkout de ce workflow avant et apres : c'est la seule facon de la
      # constater, elle ne se reproduit pas en local. See #11835.
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github
      - name: Check base age
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STALE_DAYS: "14"
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin main
          BASE_SHA="$BASE_REF"
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$BASE_SHA" = "$MAIN_SHA" ]; then
            echo "Base is up-to-date."
            exit 0
          fi
          BEHIND=$(git rev-list "$BASE_SHA..origin/main" --count)
          BASE_DATE=$(git show -s --format=%ct "$BASE_SHA" 2>/dev/null || echo 0)
          MAIN_DATE=$(git show -s --format=%ct "$MAIN_SHA" 2>/dev/null || echo 0)
          if [ "$BASE_DATE" -eq 0 ] || [ "$MAIN_DATE" -eq 0 ]; then
            echo "Could not determine commit dates."
            exit 0
          fi
          AGE_DAYS=$(( (MAIN_DATE - BASE_DATE) / 86400 ))
          echo "Base age: ${AGE_DAYS} days, behind: ${BEHIND} commits"
          if [ "$AGE_DAYS" -le "$STALE_DAYS" ]; then
            exit 0
          fi
          echo "::warning::Base is ${AGE_DAYS}d behind main (${BEHIND} commits)"
          gh pr comment "$PR_NUMBER" --body "## Base Branch Stale Warning - ${AGE_DAYS}d behind main (${BEHIND} commits). Consider rebasing." 2>/dev/null || true
          gh label create "base-stale-14d" --description "PR base >14d behind main" --color "FFA500" --force || true
          gh pr edit "$PR_NUMBER" --add-label "base-stale-14d" 2>/dev/null || true
