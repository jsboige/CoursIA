name: Workflow Label-Paths Coverage Guard

# Issue #8822. A `pull_request` workflow filtered by `on.pull_request.paths`
# runs ONLY when the PR's `base...head` diff touches those paths. If it also
# poses a label (gh pr edit --add-label / gh label create), then the commit
# that RETIRES the matching paths from the diff leaves the job unable to
# re-run -- its own --remove-label cleanup becomes dead code exactly when it is
# needed, and the label survives its cause. Demonstrated firsthand on #8820:
# the bot posed `exercises-unparseable`, the artifact was removed, the paths
# filter kept the job from re-running, and a human unlabeled six minutes later.
#
# The fix is the established repo convention: list the workflow's OWN path in
# its `paths:` (20 workflows already do -- scripts-tests.yml, lean-conway.yml,
# banner-guard.yml, ...). This guard enforces that invariant structurally.
#
# BLOCKING (not advisory), per #8822 acceptance 4: the target is a file
# invariant (own path under paths:), not a content judgement, so there is
# nothing to arbitrate and nothing to let slide. Contrast the exit-0 advisory
# exercises-advisory job (#8816) which guards pedagogical content (a judgement).
#
# Auto-covered by construction: this workflow's own file lives under
# `.github/workflows/**`, which is in its own `paths:` filter -- it can never
# be the first to violate its own rule.

on:
  pull_request:
    types: [opened, synchronize, edited, reopened]
    paths:
      - '.github/workflows/**'
      - 'scripts/check_workflow_label_paths.py'
      - 'scripts/tests/test_check_workflow_label_paths.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: label-paths-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label-paths-guard:
    name: "Label-poser workflows self-cover (blocking)"
    # Routage #14283 tranche 3 (decision ai-01 2026-09-02) : jambe Linux
    # auto-hebergee. Le `if:` ci-dessous est la garde anti-fork exigee par
    # scripts/ci/check_self_hosted_runner_policy.py ; un `runs-on` STATIQUE la
    # rend auditable (une expression dynamique leve DYNAMIC_RUNS_ON).
    # Les PRs de fork sautent le job -- pr_gate.py compte `skipped` comme OK.
    # 2026-10-27 (mesure ai-01) : migration vers `ubuntu-latest` par Q35 etape 2
    # (#17397) -- `scripts/ci/audit_self_hosted_needs.py` certifie ce workflow
    # comme n'ayant besoin de RIEN qui n'existe que sur le parc local, et le parc
    # local etait sature PAR SES CHECKOUTS (mesure 00:45Z : 11 des 12 slots
    # occupes dans `actions/checkout`, 614 runs en file). La garde anti-fork
    # ci-dessous est CONSERVEE : aucun code de fork ne change de surface.
    # 2026-10-27 (#22461, phase A) : forme hybride de debordement -- PR
    # meme-depot ET vars.CI_OVERFLOW_LOCAL == 'true' -> jambe Linux locale ;
    # tout le reste (variable absente ou fausse, forks, push/schedule/
    # dispatch) retombe sur ubuntu-latest (l'etat du 27/10). Bascule :
    # `gh variable set CI_OVERFLOW_LOCAL --body true|false --repo jsboige/CoursIA`.
    # Retour arriere = variable a `false` ou supprimee : routage 100 %
    # heberge, sans toucher ce fichier. Limite : runs-on se resout a la
    # creation du job, les runs deja en file ne bougent pas.
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository && vars.CI_OVERFLOW_LOCAL == 'true') && fromJSON('["self-hosted","coursia-ephemeral","coursia-linux"]') || 'ubuntu-latest' }}
    # #22954 : borne explicite. Mesure du 2026-10-29 sur les 4 derniers
    # runs verts de ce job : max 4.5 min. Marge large (le defaut
    # d'Actions est 6 h, et un job fige tient son slot tout ce temps).
    timeout-minutes: 15
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Guard -- every paths-filtered label-poser self-covers its own file
        # Blocking: exits 1 on any violation (or if 0 workflows were scanned).
        # The script prints the denominator (examined / label-posers /
        # path-filtered / non-covered) so coverage is auditable in the log.
        run: python scripts/check_workflow_label_paths.py
