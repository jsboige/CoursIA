name: Validation Matrix

on:
  push:
    branches: [main]
    paths:
      - '**.ipynb'
      - 'scripts/validation/**'
  pull_request:
    branches: [main]
    paths:
      - '**.ipynb'
      - 'scripts/validation/**'
  # Manual revalidate after a merge batch (issue #13861):
  # `cancel-in-progress` cancels each PR's run on the next push, leaving the
  # final tree of a merge batch un-revalidated. `workflow_dispatch` is the
  # only way to revalidate the final tree without an empty commit.
  workflow_dispatch:
    inputs:
      family:
        description: 'Family to validate (empty = all)'
        required: false
        default: ''
      quick:
        description: 'Quick mode (structure only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validation-matrix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    # Routage #14283 tranche 3 (decision ai-01 2026-09-02) : jambe Linux
    # auto-hebergee. Le `if:` ci-dessous est la garde anti-fork exigee par
    # scripts/ci/check_self_hosted_runner_policy.py ; un `runs-on` STATIQUE la
    # rend auditable (une expression dynamique leve DYNAMIC_RUNS_ON).
    # Les PRs de fork sautent le job -- pr_gate.py compte `skipped` comme OK.
    # Retour arriere = remettre `runs-on: ubuntu-latest` + retrait de l'allowlist.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml nbformat

    - name: Install notebook_tools
      run: |
        pip install -r scripts/notebook_tools/requirements.txt 2>/dev/null || true
        pip install papermill 2>/dev/null || true

    - name: Run validation matrix
      run: |
        ARGS=""
        if [ -n "${{ github.event.inputs.family }}" ]; then
          ARGS="--family ${{ github.event.inputs.family }}"
        else
          ARGS="--all"
        fi
        if [ "${{ github.event.inputs.quick }}" = "true" ]; then
          ARGS="$ARGS --quick"
        fi
        python scripts/validation/dispatch.py $ARGS --json --save
      continue-on-error: true

    - name: Upload validation results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: validation-results
        path: results/validation_run_*.json
        retention-days: 30
