name: Markdown claims anchored to previous output (advisory)

# Durable anti-regression advisory for two prose/output hazards:
# - markdown cites numeric values absent from nearby code outputs;
# - an explicit named relation is contradicted or left unproved by those outputs.
# Two open PRs in the same week exhibited the first class:
# this:
#   - PR #11435 (FT-02-QLoRA-Quantization.ipynb c10/c20)
#   - c.290 LSTM-vol notebook (M15)
#
# Sharing this job (#18354, ai-01 review 2026-09-29T18:39Z on #18402/#18404):
# two sibling detectors run as steps of THIS job rather than as their own
# workflows -- same trigger, same markdown-vs-output join, so one checkout and
# one report per detector instead of three self-hosted checkouts per PR:
#   - scripts/check_stale_claims.py: a claimed measurement value (a number
#     carrying a claim marker) absent from ALL committed outputs of the
#     notebook. The detector above only looks BACKWARD, so a claim in a cell
#     that PRECEDES its code is invisible to it -- measured CLEAN by ai-01 on
#     App-5-Timetabling (c.2/c.4 precede the code they describe).
#   - scripts/check_factual_mislabel.py: a markdown entity count or tuple
#     formula CONTRADICTED by the committed stream of the adjacent code cell
#     (typically copied from a twin notebook whose data differs).
#
# Why ADVISORY (not a blocking gate):
# The detector has a non-trivial false-positive rate: pedagogical
# markdown cells legitimately cite domain numbers (e.g. "OPT-1.3B",
# "1.3B params", "~4x speedup") that don't appear in the immediate
# previous code cell. A blocking gate would force every PR to ship
# with the detector disabled. The right model is:
#   1. Run on every PR
#   2. Post findings as a PR comment
#   3. Let the reviewer (human or bot) triage against the source code
#   4. Never block merge on this signal alone
#
# When the detector's precision improves (e.g. by adding a scope gate
# like "only flag claims present elsewhere in the notebook as tables"),
# promote this to a blocking gate.

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'MyIA.AI.Notebooks/**/*.ipynb'
      - 'scripts/check_markdown_claims_output.py'
      - 'scripts/tests/test_check_markdown_claims_output.py'
      - 'scripts/check_stale_claims.py'
      - 'scripts/tests/test_check_stale_claims.py'
      - 'scripts/check_factual_mislabel.py'
      - 'scripts/tests/test_check_factual_mislabel.py'
      - '.github/workflows/markdown-claims-output-advisory.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: markdown-claims-output-advisory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claims-output-advisory:
    name: "Markdown claims anchored to previous output (#11435 advisory)"
    # Routage #14283 tranche 3 (decision ai-01 2026-09-02) : jambe Linux
    # auto-hebergee. Le `if:` ci-dessous est la garde anti-fork exigee par
    # scripts/ci/check_self_hosted_runner_policy.py ; un `runs-on` STATIQUE la
    # rend auditable (une expression dynamique leve DYNAMIC_RUNS_ON).
    # Les PRs de fork sautent le job -- pr_gate.py compte `skipped` comme OK.
    # Retour arriere = remettre `runs-on: ubuntu-latest` + retrait de l'allowlist.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # The detector requires merge-base(origin/main, HEAD). A depth-1
          # checkout made the advisory abstain on ordinary pull requests.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run unit tests
        run: |
          python -m pip install --quiet pytest pytest-cov
          python -m pytest scripts/tests/test_check_markdown_claims_output.py \
                          scripts/tests/test_check_stale_claims.py \
                          scripts/tests/test_check_factual_mislabel.py -v
        continue-on-error: false

      - name: Run detector (advisory, do not gate)
        id: run
        run: |
          set +e
          # c.415 (#11873): the previous workflow scanned the entire corpus
          # via `git ls-files '*.ipynb'` -- 1037 notebooks -- and posted a
          # warning on EVERY PR regardless of whether the PR touched any
          # notebook. Reviewers ignored the signal (rouge-permanent = organe
          # eteint, cf. defect 1 in #11873). We now scan ONLY the diff:
          # notebooks CHANGED between merge-base origin/main HEAD (the
          # PR's actual surface), so the comment names what the PR
          # actually touched.
          #
          # Frozen-inheritance stance (#11754 sibling pattern): if
          # merge-base is unreachable (shallow fetch), ABSTAIN explicitly
          # rather than fall back to origin/main, which would make
          # "rien regarde" and "rien trouve" indistinguishable.
          BASE=$(git merge-base origin/main HEAD 2>/dev/null)
          if [ -z "$BASE" ]; then
            echo "exit=abstain" >> "$GITHUB_OUTPUT"
            echo "::warning::markdown-claims-output: merge-base origin/main HEAD introuvable -- detector abstains (shallow fetch or unanchored branch)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mapfile -t CHANGED < <(git diff --name-only --diff-filter=MR -M50% "$BASE" HEAD -- '*.ipynb' | head -50)
          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "exit=0" >> "$GITHUB_OUTPUT"
            echo "::notice::markdown-claims-output: aucun notebook modifie entre $BASE et HEAD -- rien a scanner." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # NanoClaw review nit (b): say the scan is bounded instead of letting
          # the sticky comment claim full coverage of "the notebooks this PR
          # changed" on a campaign-sized PR.
          if [ ${#CHANGED[@]} -eq 50 ]; then
            echo "truncated=1" >> "$GITHUB_OUTPUT"
            echo "::notice::markdown-claims-output: scan borne a 50 notebooks -- troncature possible au-dela (campagne)." >> "$GITHUB_STEP_SUMMARY"
          fi
          # One bounded invocation preserves checker exit codes and emits one
          # valid JSON document; the array also preserves spaces in paths.
          python scripts/check_markdown_claims_output.py --json "${CHANGED[@]}" \
            > /tmp/claims-output.json 2> /tmp/claims-output.err
          rc=$?
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
          echo "report=present" >> "$GITHUB_OUTPUT"
          if [ $rc -ne 0 ] && [ $rc -ne 1 ]; then
            echo "::warning::markdown-claims-output: detector exit code $rc (not 0/1) -- voir /tmp/claims-output.err." >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/claims-output.err >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set -e

      - name: Upload structured advisory report
        if: steps.run.outputs.report == 'present'
        uses: actions/upload-artifact@v4
        with:
          name: markdown-claims-output-report
          path: /tmp/claims-output.json
          retention-days: 7

      - name: Post advisory comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: markdown-claims-output-advisory
          message: |
            ${{ steps.run.outputs.exit == '0' && '✅ No prose/output mismatch detected in the notebooks this PR changed.' || steps.run.outputs.exit == 'abstain' && '⚠️ Detector abstained (merge-base introuvable, shallow fetch or unanchored branch).' || '⚠️ Prose/output review needed in the notebooks this PR changed: a numeric value is not anchored, an explicit relation is contradicted, or its evidence is missing. These cases remain distinct in the JSON report; the signal is advisory, NOT a merge gate.' }}${{ steps.run.outputs.truncated == '1' && '\n\n⚠️ Scan borné à 50 carnets — couverture partielle sur les PR de campagne (> 50 notebooks changed, only the first 50 were scanned).' || '' }}

            Scope = notebooks CHANGED in this PR, not the whole corpus. Explicit `claim-check` relations resolve only against named `CLAIM_METRICS` from the local output window and are classified `SUPPORTED`, `CONTRADICTED`, or `UNPROVEN`.
            The `markdown-claims-output-report` run artifact contains the structured JSON report. See `python scripts/check_markdown_claims_output.py --help` for re-running locally.
            Detector rationale: c.290 / c.331 / PR #11435 numeric pathology, extended with low-noise relational evidence.

      # --- Sibling detector 1/2 (#18354): unanchored measurement claims -----
      - name: Run stale-claim detector (advisory, do not gate)
        id: stale
        run: |
          set +e
          # Same diff-scoped contract as the detector above (#11873 defect 1:
          # a corpus-wide sweep posts a permanent red every reviewer ignores;
          # #11754: abstain explicitly when merge-base is unreachable instead
          # of falling back to origin/main, which would make "nothing looked
          # at" and "nothing found" indistinguishable).
          BASE=$(git merge-base origin/main HEAD 2>/dev/null)
          if [ -z "$BASE" ]; then
            echo "exit=abstain" >> "$GITHUB_OUTPUT"
            echo "::warning::stale-claim: merge-base origin/main HEAD introuvable -- detector abstains (shallow fetch or unanchored branch)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mapfile -t CHANGED < <(git diff --name-only --diff-filter=MR -M50% "$BASE" HEAD -- '*.ipynb' | head -50)
          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "exit=0" >> "$GITHUB_OUTPUT"
            echo "::notice::stale-claim: aucun notebook modifie entre $BASE et HEAD -- rien a scanner." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # NanoClaw review nit (b): say the scan is bounded instead of letting
          # the sticky comment claim full coverage of "the notebooks this PR
          # changed" on a campaign-sized PR.
          if [ ${#CHANGED[@]} -eq 50 ]; then
            echo "::notice::stale-claim: scan borne a 50 notebooks -- troncature possible au-dela (campagne)." >> "$GITHUB_STEP_SUMMARY"
          fi
          python scripts/check_stale_claims.py --json "${CHANGED[@]}" \
            > /tmp/stale-claim.json 2> /tmp/stale-claim.err
          rc=$?
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
          echo "report=present" >> "$GITHUB_OUTPUT"
          if [ $rc -ne 0 ] && [ $rc -ne 1 ]; then
            echo "::warning::stale-claim: detector exit code $rc (not 0/1) -- voir /tmp/stale-claim.err." >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/stale-claim.err >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set -e

      - name: Upload stale-claim report
        if: steps.stale.outputs.report == 'present'
        uses: actions/upload-artifact@v4
        with:
          name: stale-claim-report
          path: /tmp/stale-claim.json
          retention-days: 7

      - name: Post stale-claim comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: stale-claim-advisory
          message: |
            ${{ steps.stale.outputs.exit == '0' && '✅ No unanchored measurement claim detected in the notebooks this PR changed.' || steps.stale.outputs.exit == 'abstain' && '⚠️ Stale-claim detector abstained (merge-base introuvable, shallow fetch or unanchored branch).' || '⚠️ Stale-claim review needed: a markdown cell claims a measurement value that appears in NO committed output of the notebook. Advisory, NOT a merge gate — triage against the JSON artifact.' }}

            Scope = notebooks CHANGED in this PR, not the whole corpus. The `stale-claim-report` run artifact holds the structured JSON.
            Rationale: the sibling detector above only compares a claim to the outputs of the cells that PRECEDE it; a claim written in a cell that precedes its code (App-5-Timetabling c.2/c.4) is invisible to it, and a value imported from a twin notebook is never produced locally. See `python scripts/check_stale_claims.py --help`.

      # --- Sibling detector 2/2 (#18354): contradicted entity counts --------
      - name: Run factual-mislabel detector (advisory, do not gate)
        id: mislabel
        run: |
          set +e
          BASE=$(git merge-base origin/main HEAD 2>/dev/null)
          if [ -z "$BASE" ]; then
            echo "exit=abstain" >> "$GITHUB_OUTPUT"
            echo "::warning::factual-mislabel: merge-base origin/main HEAD introuvable -- detector abstains (shallow fetch or unanchored branch)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mapfile -t CHANGED < <(git diff --name-only --diff-filter=MR -M50% "$BASE" HEAD -- '*.ipynb' | head -50)
          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "exit=0" >> "$GITHUB_OUTPUT"
            echo "::notice::factual-mislabel: aucun notebook modifie entre $BASE et HEAD -- rien a scanner." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ ${#CHANGED[@]} -eq 50 ]; then
            echo "::notice::factual-mislabel: scan borne a 50 notebooks -- troncature possible au-dela (campagne)." >> "$GITHUB_STEP_SUMMARY"
          fi
          python scripts/check_factual_mislabel.py --json "${CHANGED[@]}" \
            > /tmp/factual-mislabel.json 2> /tmp/factual-mislabel.err
          rc=$?
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
          echo "report=present" >> "$GITHUB_OUTPUT"
          if [ $rc -ne 0 ] && [ $rc -ne 1 ]; then
            echo "::warning::factual-mislabel: detector exit code $rc (not 0/1) -- voir /tmp/factual-mislabel.err." >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/factual-mislabel.err >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set -e

      - name: Upload factual-mislabel report
        if: steps.mislabel.outputs.report == 'present'
        uses: actions/upload-artifact@v4
        with:
          name: factual-mislabel-report
          path: /tmp/factual-mislabel.json
          retention-days: 7

      - name: Post factual-mislabel comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: factual-mislabel-advisory
          message: |
            ${{ steps.mislabel.outputs.exit == '0' && '✅ No factual mislabel detected in the notebooks this PR changed (entity counts and tuple formulas checked against nearby committed streams).' || steps.mislabel.outputs.exit == 'abstain' && '⚠️ Factual-mislabel detector abstained (merge-base introuvable, shallow fetch or unanchored branch).' || '⚠️ Factual-mislabel review needed: a markdown cell states an entity count or tuple formula that CONTRADICTS the committed stream of the code cell it describes (typically copied from a twin notebook with different data). Advisory, NOT a merge gate — triage against the JSON artifact.' }}

            Scope = notebooks CHANGED in this PR, not the whole corpus. The `factual-mislabel-report` run artifact holds the structured JSON.
            Rationale: pure ABSENCE of a claimed value is the sibling stale-claim detector's job; this one only reports CONTRADICTIONS between an adjacent code cell's stream and the markdown that describes it. See `python scripts/check_factual_mislabel.py --help`.