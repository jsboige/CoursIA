name: Orphaned delivery scan

# The POST-MERGE organ for issue #10981: a PR merged with base != main
# delivers its content onto a branch. If that branch is squash-merged into
# main AFTERWARDS, the PR's mergeCommit is NOT an ancestor of main -- the
# deliverable is orphaned (exists, merged, referenced by a closed issue, and
# invisible to main). Measured firsthand 2026-08-14: #10972 merged into
# feature/c10923-quarto-normalize 24s AFTER #10965 squash-merged that base
# into main -- the site render infra never reached main and the site broke
# in production.
#
# The advisory at PR time (base-not-main-advisory.yml, #10918) measures
# "open PRs from base towards main" at pull_request events only; that
# verdict can die between events without re-triggering anything. THIS
# workflow re-examines every MERGED PR whose base != main and verifies that
# its mergeCommit is an ancestor of origin/main -- the check the advisory
# delegates to a human ("verifier au moment du merge") that nothing executed.
#
# ADVISORY, never blocking (same posture as orphan-branch-scan.yml):
#   - The job ALWAYS exits 0. The actionable payload is the label
#     `orphaned-delivery` + marker-guarded comment naming the mergeCommit and
#     the recovery command, NEVER the green conclusion.
#   - It does NOT auto-fix, does NOT close issues: it signals, ai-01 decides.
#
# Scheduled sweep (daily) is the primary trigger: an orphan is a STABLE state
# once it exists, nothing forces J+0 detection. The [closed] trigger is
# advisory-only and does NOT label (a base in flight is not yet an orphan).

on:
  schedule:
    # Daily, off-:00 minute (anti-stampede). 06:17 UTC.
    - cron: '17 6 * * *'
  pull_request:
    types: [closed]
    # #10600 tranche 2, filter PAR LA BASE, pas par paths : un orphelin est
    # par definition une PR mergee dont la base != main -- une PR visee sur
    # main ne peut PAS orpheliner (son merge atteint main directement). Le
    # filtre paths propose par #12773 aurait rendu l'alerte precoce aveugle
    # sur la classe canonique (PRs notebooks vers base feature). Ici la
    # jambe [closed] ne fire QUE la population a risque (~x20 moins de runs,
    # zero cecite) ; le sweep quotidien reste l'organe primaire inchange.
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log only, apply no label/comment'
        required: false
        type: boolean
        default: true

permissions:
  issues: write
  pull-requests: write
  contents: read

concurrency:
  group: orphaned-delivery-scan
  cancel-in-progress: false

jobs:
  sweep:
    name: "Verify merged PRs' mergeCommit reached main (advisory)"
    # Routage #14283 tranche 3 (decision ai-01 2026-09-02) : jambe Linux
    # auto-hebergee. Le `if:` ci-dessous est la garde anti-fork exigee par
    # scripts/ci/check_self_hosted_runner_policy.py ; un `runs-on` STATIQUE la
    # rend auditable (une expression dynamique leve DYNAMIC_RUNS_ON).
    # Les PRs de fork sautent le job -- pr_gate.py compte `skipped` comme OK.
    # 2026-10-27 (mesure ai-01) : migration vers `ubuntu-latest` par Q35 etape 2
    # (#17397) -- `scripts/ci/audit_self_hosted_needs.py` certifie ce workflow
    # comme n'ayant besoin de RIEN qui n'existe que sur le parc local, et le parc
    # local etait sature PAR SES CHECKOUTS (mesure 00:45Z : 11 des 12 slots
    # occupes dans `actions/checkout`, 614 runs en file). La garde anti-fork
    # ci-dessous est CONSERVEE : aucun code de fork ne change de surface.
    # 2026-10-27 (#22461, phase A) : forme hybride de debordement -- PR
    # meme-depot ET vars.CI_OVERFLOW_LOCAL == 'true' -> jambe Linux locale ;
    # tout le reste (variable absente ou fausse, forks, push/schedule/
    # dispatch) retombe sur ubuntu-latest (l'etat du 27/10). Bascule :
    # `gh variable set CI_OVERFLOW_LOCAL --body true|false --repo jsboige/CoursIA`.
    # Retour arriere = variable a `false` ou supprimee : routage 100 %
    # heberge, sans toucher ce fichier. Limite : runs-on se resout a la
    # creation du job, les runs deja en file ne bougent pas.
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository && vars.CI_OVERFLOW_LOCAL == 'true') && fromJSON('["self-hosted","coursia-ephemeral","coursia-linux"]') || 'ubuntu-latest' }}
    # #22954 : borne explicite. Mesure du 2026-10-29 sur les 4 derniers
    # runs verts de ce job : max 0.6 min. Marge large (le defaut
    # d'Actions est 6 h, et un job fige tient son slot tout ce temps).
    timeout-minutes: 10
    # On [closed], restrict to same-repo PRs: fork PRs cannot create an
    # internal base != main orphan and their limited token/fetch access would
    # only produce spurious failures on an advisory job.
    #
    # Forme universelle (#13874) : teste la presence du champ pull_request
    # (null pour schedule et workflow_dispatch, ce qui couvre ces triggers
    # legitimes) puis l'identite du repo source en un seul predicat. Couvre
    # pull_request ET pull_request_target d'un coup (le second est le vecteur
    # d'exfiltration classique sur runner public -- voir le commentaire
    # equivalent dans linux-self-hosted-tests.yml).
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # 2026-10-27 (#22722) : la commande qui echoue est le `git checkout --force -B`
      # final d'actions/checkout, pas son clean/reset interne (run 40476005592 :
      # clean et reset passent, "HEAD is now at eb8ab03489", puis le checkout
      # refuse le carnet JEPA "not uptodate; will not remove from working tree").
      # Ce refus est la verification de retrait du retrecissement sparse
      # (apply_sparse_checkout, WARNING_SPARSE_NOT_UPTODATE_FILE, git 2.43.0) :
      # a blob inchange, elle compare le fichier au blob de l'index ; ni --force
      # ni le reset interne ne la contournent. Mitigation EMPIRIQUE, mecanisme
      # NON TRANCHE : sur git 2.43.0 tout etat residuel reproduit localement est
      # deja nettoye par le clean+reset du built-in (ce step rejoue la meme
      # commande, sans effet ajoute), et l'etat qui a survecu a son reset n'est
      # pas reproduit (mutation entre reset et checkout ? checkout interrompu ?).
      - name: Restore the warm work tree before the sparse checkout
        run: |
          set -u
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            if ! dirty=$(git -C "$GITHUB_WORKSPACE" -c safe.directory="$GITHUB_WORKSPACE" status --porcelain 2>/dev/null); then
              echo "::warning::[heal-worktree] probe git status muet -- etat de l'arbre inconnu, reset applique quand meme (#22722)"
              dirty=""
            fi
            untracked=$(printf '%s\n' "$dirty" | grep -c '^??' || true)
            first_dirty=$(printf '%s\n' "$dirty" | head -n 1)
            if ! git -C "$GITHUB_WORKSPACE" -c safe.directory="$GITHUB_WORKSPACE" reset --hard --quiet; then
              echo "::warning::[heal-worktree] reset --hard a echoue -- le retrecissement sparse peut refuser (#22722)"
            elif [ -n "$dirty" ]; then
              echo "::notice::[heal-worktree] reset --hard effectue -- le job precedent avait laisse un etat sale (${first_dirty}) -- ${untracked} entree(s) non suivie(s) laissee(s) en place -- le retrecissement sparse passe (#22722)"
            fi
          fi
      - name: Checkout (full history, blobless)
        # Partial clone, serie #11843 (workflow 2). The scan interrogates the
        # commit graph (merge-base --is-ancestor, cat-file -e, diff --quiet
        # two-dot scoped to candidate paths) and the gh API -- it reads no
        # repository content blob. blob:none keeps the graph complete; the
        # fetch below inherits the filter. Sparse-checkout materializes only
        # scripts/ (14 Mo: the audited script + siblings) instead of the full
        # 1058 Mo tree. A missing script would fail loudly (python: can't
        # open file), not silently scan less.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts

      - name: Fetch ALL remote heads
        # actions/checkout@v4 only fetches the default branch. Ancestry of a
        # mergeCommit against origin/main requires every remote head present.
        # Inherits the blob:none filter of the partial clone (graph only).
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run post-merge orphan scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS="--days 7"
          # Apply only on the scheduled sweep (or a dispatch that explicitly
          # opts out of dry-run). A [closed] event is advisory-only: a base
          # still in flight is NOT an orphan yet, labeling on PR close would
          # be a false alarm.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="$ARGS --apply"
          elif [ "${{ inputs.dry_run }}" = "false" ]; then
            ARGS="$ARGS --apply"
          else
            ARGS="$ARGS --dry-run"
          fi
          python scripts/audit/check_orphan_merged_pr.py $ARGS --limit 200
