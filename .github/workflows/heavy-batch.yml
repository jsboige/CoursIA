name: Heavy batch (ombre)

# LOT QUOTIDIEN EN OMBRE (P3 du plan « CI à deux etages »).
#
# CE QUE CE WORKFLOW NE FAIT PAS : il ne juge aucune PR. Aucun check-run n'est
# émis sur une PR, aucune conclusion n'est rouge, rien ne bloque un merge. Le
# PR gate reste le seul juge. Ce workflow **mesure**.
#
# CE QU'IL MESURE :
#   - la duree d'un lot vert et d'un lot rouge ;
#   - la fin de lot AVANT l'echeance de son creneau (10:00Z / 13:00Z / 21:30Z /
#     00:00Z). Un lot qui deborde retarde le suivant : la cadence tient ou elle
#     ne tient pas, et c'est cette mesure qui le dira.
#
# LA CADENCE (quatre creneaux UTC, anti-stampede sur la minute) :
#   04:30Z, 10:30Z, 16:30Z, 21:30Z. Les creneaux sont volontairement hors des
#   heures de pointe de la file CI : le lot occupe le parc quand celui-ci
#   respire.
#
# UN SEUL LOT A LA FOIS : le groupe de concurrence est unique et
# `cancel-in-progress: false`. Un creneau qui deborde ne fait donc PAS annuler
# le lot en cours -- il l'attend. L'annulation automatique produirait un
# rapport partiel presente comme un lot complet.
#
# PERMISSIONS MINIMALES, AUCUN SECRET : `contents: read` et
# `pull-requests: read`, et rien d'autre. Aucun `secrets.*` n'est lu. Le job
# execute du code de PR (les tests de la PR materialisee dans un worktree) :
# ce code s'execute donc sur un runner heberge par GitHub, hors du parc de la
# flotte, et sans rien pouvoir lire de sensible.
#
# GARDE DE FORK : une PR issue d'un fork n'entre dans le lot qu'apres l'APPROVE
# du coordinateur (`myia-ai-01`). La regle est dans l'organe
# (`scripts/ci/heavy_batch.py`), pas dans une condition de job : la selection
# se fait sur le contenu du lot, et l'exclusion est **nommee** dans le
# rapport.
#
# RUNNER : `ubuntu-latest`, et c'est un choix, pas une defaut. Une jambe
# self-hosted exige une entree dans `SELF_HOSTED_WORKFLOW_ALLOWLIST`
# (`scripts/ci/check_self_hosted_runner_policy.py`) -- c'est une politique
# d'owner, et l'ajouter releve du coordinateur. Le lot execute du code de PR :
# l'heberger hors du parc de la flotte est la position prudente.
#
# ROLLBACK : supprimer ce fichier (ou retirer le declencheur `schedule`). Aucun
# autre fichier du depot n'en depend.

on:
  schedule:
    - cron: '30 4,10,16 * * *'
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      max_prs:
        description: "Taille maximale du lot"
        required: false
        default: '4'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: heavy-batch
  cancel-in-progress: false

jobs:
  lot:
    name: "Lot en ombre (mesure, non bloquant)"
    runs-on: ubuntu-latest
    # Fenetre du lot : le creneau le plus long est de 150 min (21:30 -> 00:00).
    timeout-minutes: 160

    steps:
      - uses: actions/checkout@v4
        with:
          # `fetch-depth: 0` est requis : le lot diffe chaque PR contre
          # `origin/main` et materialise sa ref de fusion (`refs/pull/N/merge`).
          # `filter: blob:none` garde le clone leger -- les blobs sont
          # materialises a la demande, comme partout ailleurs dans le depot.
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Dependances minimales du lot"
        # Le lot ne lance que les tests CONCERNES par la PR (selection par
        # chemin) : le spectre des dependances est donc etroit. Une dependance
        # manquante rend la PR « non mesurable », jamais rouge -- un
        # environnement incomplet n'est pas une regression.
        run: pip install --quiet "pytest>=8" pytest-xdist numpy pandas scipy requests pyyaml Pillow

      - name: "Planifier le lot"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp
          python scripts/ci/heavy_batch.py --max-prs "${{ inputs.max_prs || '4' }}" --json > .tmp/batch_plan.json

      - name: "Executer le lot et mesurer"
        id: run
        # `continue-on-error` : le lot est une mesure, pas une porte. Un lot
        # qui echoue est un resultat a publier, pas un travail a faire
        # repeter -- le rapport le dira.
        continue-on-error: true
        run: |
          python scripts/ci/heavy_batch.py --run \
            --plan .tmp/batch_plan.json \
            --results-out .tmp/batch_results.json \
            --json > .tmp/batch_summary.json

      - name: "Publier la mesure (toujours vert)"
        if: always()
        run: |
          {
            echo "## Lot en ombre"
            echo ""
            if [ -f .tmp/batch_summary.json ]; then
              cat .tmp/batch_summary.json
            else
              echo "Le lot n'a pas produit de mesure (voir le journal du job)."
            fi
            echo ""
            echo "### Detail par PR"
            echo ""
            if [ -f .tmp/batch_results.json ]; then
              python - <<'PY'
          import json
          data = json.load(open(".tmp/batch_results.json", encoding="utf-8"))
          print("| PR | statut | duree (s) | tests selectionnes |")
          print("|---|---|---|---|")
          for pr in data.get("prs", []):
              print(f"| #{pr.get('number')} | {pr.get('statut')} | {pr.get('duree_s')} | {pr.get('tests_selectionnes', '-')} |")
          PY
            else
              echo "Aucun resultat."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Deposer les resultats (artefact)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heavy-batch-results
          path: |
            .tmp/batch_plan.json
            .tmp/batch_results.json
            .tmp/batch_summary.json
          if-no-files-found: ignore
