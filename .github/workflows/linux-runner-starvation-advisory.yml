name: Linux runner starvation advisory

# Organe d'extinction des runners Linux self-hosted (#13378, dispatch ai-01
# 2026-09-02). Le 2026-09-02 entre ~07:00 et 10:25 UTC, le superviseur de
# conteneurs de myia-po-2024 est mort silencieusement : 11 des 12 workflows
# routes sur `coursia-linux` sont bloquants, donc un superviseur mort n'a pas
# degrade le CI -- il l'a arrete (3 PRs de contenu rouges ~35 h sur ce seul
# fait). Rien ne le mesurait. Cet observateur existe pour le dire.
#
# Pourquoi un schedule DEDIE et ubuntu-latest : il doit survivre a ce qu'il
# observe -- un observateur qui tournerait sur le label garde mourrait avec
# lui, et un job du workflow surveille n'est pas un observateur. Le predicat
# (scripts/ci/check_runner_starvation.py) mesure le SYMPTOME (jobs libelles
# queued > 15 min SANS aucun in_progress = la file ne drainne pas) avec le
# seul GITHUB_TOKEN, et l'EXTINCTION directe (zero runner online au label,
# via le secret read-only RUNNERS_READ_PAT, Administration:read -- incapable
# de minter un registration-token, par design). Sans PAT, l'organe degrade
# proprement sur le seul symptome.
#
# Advisory PAR CONSTRUCTION : schedule + workflow_dispatch uniquement, jamais
# pull_request/push -- un run rouge ne peut jamais bloquer une PR. Le nom
# porte "advisory" (ADVISORY_MARKER, cf pr-gate-sweep-health-advisory.yml).
# Le cron est a l'offset des sweeps 13,43 pour ne jamais les collider.

on:
  schedule:
    - cron: '19,49 * * * *'
  workflow_dispatch:

permissions:
  contents: read   # checkout du script
  actions: read    # lecture des runs/jobs (predicat STARVATION)

concurrency:
  group: linux-runner-starvation-advisory
  cancel-in-progress: false

jobs:
  starve:
    name: Linux runner starvation advisory
    # ubuntu-latest -- et non plus la jambe auto-hebergee (#16134, 2026-09-14).
    #
    # La tranche 5 de #13378 avait re-route ce job vers
    # `[self-hosted, coursia-ephemeral, coursia-linux]` au motif que « le garde
    # est du Python pur, sans secret ». C'est un motif de commodite, et il a
    # rendu FAUX le principe pose huit lignes plus haut : `coursia-linux` n'est
    # pas independant de `coursia-waiter` ni de `coursia-lean`, ce sont trois
    # jambes du MEME parc, invalidees ensemble par la meme reconstruction
    # d'image. L'observateur ne mourait donc plus avec son propre label -- il
    # mourait avec le parc, ce qui est le cas qu'il existe pour mesurer.
    #
    # Mesure du 2026-09-14 : parc mort ~1 h 15 apres un reboot de maintenance
    # (0 runner en ligne sur 45 slots). `runner-starvation-advisory` n'a pu
    # s'executer a 07:12Z que parce qu'une jambe etait deja revenue ; sur le
    # creneau precedent, 01:44Z -> 07:11Z, AUCUN run n'a ete produit pour un
    # cron declare `23,53 * * * *` -- les creneaux sans runner ne sont pas des
    # runs en echec, ce sont des runs qui n'existent pas.
    #
    # L'organe est sans dependance a l'hote : `check_runner_starvation.py` ne
    # lit aucun chemin local, aucun socket, aucun `systemctl` -- tout passe par
    # l'API GitHub. Il n'a jamais eu besoin du parc. Depot public : les minutes
    # GitHub-hosted sont gratuites, l'argument de cout ne s'applique pas.
    #
    # La garde same-repo qui vivait ici a ete retiree avec le routage : ce
    # workflow n'a que `schedule` et `workflow_dispatch`, donc
    # `github.event.pull_request` y est toujours nul et la condition etait
    # vacuously vraie. Elle etait le vestige du raisonnement qui a justifie
    # l'auto-hebergement, et la laisser invitait a le re-deriver.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Measure starvation on coursia-linux
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNERS_READ_PAT: ${{ secrets.RUNNERS_READ_PAT }}
          STARVE_MINUTES: "15"
          WINDOW_MAX_MINUTES: "360"
        run: python scripts/ci/check_runner_starvation.py
