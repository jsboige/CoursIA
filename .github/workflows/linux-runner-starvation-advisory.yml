name: Linux runner starvation advisory

# Organe d'extinction des runners Linux self-hosted (#13378, dispatch ai-01
# 2026-09-02). Le 2026-09-02 entre ~07:00 et 10:25 UTC, le superviseur de
# conteneurs de myia-po-2024 est mort silencieusement : 11 des 12 workflows
# routes sur `coursia-linux` sont bloquants, donc un superviseur mort n'a pas
# degrade le CI -- il l'a arrete (3 PRs de contenu rouges ~35 h sur ce seul
# fait). Rien ne le mesurait. Cet observateur existe pour le dire.
#
# Pourquoi un schedule DEDIE et ubuntu-latest : il doit survivre a ce qu'il
# observe -- un observateur qui tournerait sur le label garde mourrait avec
# lui, et un job du workflow surveille n'est pas un observateur. Le predicat
# (scripts/ci/check_runner_starvation.py) mesure le SYMPTOME (jobs libelles
# queued > 15 min SANS aucun in_progress = la file ne drainne pas) avec le
# seul GITHUB_TOKEN, et l'EXTINCTION directe (zero runner online au label,
# via le secret read-only RUNNERS_READ_PAT, Administration:read -- incapable
# de minter un registration-token, par design). Sans PAT, l'organe degrade
# proprement sur le seul symptome.
#
# Advisory PAR CONSTRUCTION : schedule + workflow_dispatch + un heartbeat
# workflow_run, jamais pull_request/push -- un run rouge ne peut jamais
# bloquer une PR (workflow_run ne cree pas de check-run sur une PR). Le nom
# porte "advisory" (ADVISORY_MARKER, cf pr-gate-sweep-health-advisory.yml).
# Le cron est a l'offset des sweeps 13,43 pour ne jamais les collider.
#
# #15332 : le scheduler GitHub a cesse de livrer l'evenement schedule le
# 2026-09-09 (4 h sans AUCUN declenchement planifie, depot entier, 159
# workflows) -- un organe porte par schedule seul meurt de la panne qu'il
# observe. Le heartbeat workflow_run s'ancre sur « Secret Scan », qui se
# declenche sur CHAQUE push et CHAQUE pull_request du depot, par jambe :
#   - jambe « pull_request » : elle se declenche sur l'activite PR, qui
#     continue quand le scheduler se tait -- mesure de la panne du
#     2026-09-09 : 47 fins push/main ET ~53 fins pull_request de l'ancre
#     entre 00:00Z et 06:00Z, dont la fenetre de panne (01:13Z -> 05:22Z).
#     C'est cette jambe qui compte le plus : un pool eteint bloque les jobs
#     de PR, donc les merges s'arretent -- une jambe « push » seule ne
#     declencherait plus rien, et l'observateur mourrait de la panne qu'il
#     mesure ;
#   - jambe « push » : sur un push vers main, les jobs de Secret Scan
#     tournent sur ubuntu-latest (mesure : 20/20 jobs lus) -- elle survit
#     donc a un parc self-hosted eteint.
# L'ancre « Notebook outputs required (H.4 schema) » est RETIREE de la liste :
# ses jobs sont sur le parc self-hosted depuis #21112 (« carrier routing »,
# forme hybride Linux) -- mesure : 20/20 jobs de ses runs push/main sur
# [self-hosted, coursia-ephemeral, coursia-linux]. La « jambe GitHub-hosted
# de bout en bout » que ce header annoncait n'existe donc plus (le routage
# l'a annulee sans que le header soit corrige) : le heartbeat ne survit
# aujourd'hui a la panne du SCHEDULER, pas a celle du parc. Et l'ensemble
# de declenchements de cette ancre est un SOUS-ENSEMBLE de celui de
# « Secret Scan » -- elle ne se declenche que sur les evenements qui
# touchent un *.ipynb, que Secret Scan voit aussi -- la garder ne doublait
# que le volume.
# La cadence SERVIE est mesuree par le script lui-meme (runs event=schedule
# uniquement -- les runs workflow_run ne faussent pas la mesure).
#
# PORTE DE MESURE (#22937) : le heartbeat se declenche sur chaque fin
# d'ancre -- mesure sur 24 h (fenetre `created=` cote serveur, paginee :
# le listing tronque a 100 runs, et une fenetre non paginee donne un
# FAUX 4,2/h la ou l'incident en montre 48/h) : 418 fins « Secret Scan »
# (309 pull_request + 109 push), soit 17,4 runs/h par advisory, 35 pour la
# paire. Chaque
# passage complet paie ~9 appels API (compteur `gh_calls` du script ;
# l'inventaire des runners en ajoute 1, volontairement non compte) sur le
# jeton de depot (budget 1000 req/h) : la paire consommait ~480 appels/h,
# et le 2026-10-28 22:04Z le jeton a ete sature (« API rate limit
# exceeded for installation ») -> 18 rouges sur main en 10 min. La porte
# (MEASURE_EVERY_N_RUNS) borne la MESURE : un passage complet sur 4, les
# autres ne paient que la lecture de la cadence servie (1 appel). Le RUN
# existe toujours et son rapport de cadence servie (#15332) est emis a
# chaque passage -- c'est la SURVIVANCE de l'observateur qui est la
# garantie, pas la frequence de la lecture complete. La jambe `schedule`
# n'est jamais gatee : elle est la cadence de reference de l'advisory.

on:
  schedule:
    - cron: '19,49 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Secret Scan"]
    types: [completed]

permissions:
  contents: read   # checkout du script
  actions: read    # lecture des runs/jobs (predicat STARVATION)

jobs:
  starve:
    name: Linux runner starvation advisory
    # Heartbeat workflow_run declenche par une PR de fork : job saute (mesure
    # du 2026-10-16). GitHub attribue ce run a l'auteur de la PR
    # de fork (triggering_actor) ; quand un run plus recent le remplace dans le
    # groupe de concurrence, il passe « cancelled » et GitHub envoie a cette
    # personne un email « Run cancelled ». Des eleves de l'APP3 en ont recu
    # plusieurs dans la nuit du 15 au 16/10 pour leurs PRs de TP. Les runs
    # internes, le schedule et le dispatch continuent d'alimenter l'observateur.
    #
    # La concurrence vit au niveau du JOB, plus du workflow : au niveau
    # workflow, un run en attente est annule AVANT l'evaluation de ce `if`,
    # et l'email part quand meme. Un job saute n'entre pas dans le groupe.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
    concurrency:
      group: linux-runner-starvation-advisory
      cancel-in-progress: false
    # ubuntu-latest -- et non plus la jambe auto-hebergee (#16134, 2026-09-14).
    #
    # La tranche 5 de #13378 avait re-route ce job vers
    # `[self-hosted, coursia-ephemeral, coursia-linux]` au motif que « le garde
    # est du Python pur, sans secret ». C'est un motif de commodite, et il a
    # rendu FAUX le principe pose huit lignes plus haut : `coursia-linux` n'est
    # pas independant de `coursia-waiter` ni de `coursia-lean`, ce sont trois
    # jambes du MEME parc, invalidees ensemble par la meme reconstruction
    # d'image. L'observateur ne mourait donc plus avec son propre label -- il
    # mourait avec le parc, ce qui est le cas qu'il existe pour mesurer.
    #
    # Mesure du 2026-09-14 : parc mort ~1 h 15 apres un reboot de maintenance
    # (0 runner en ligne sur 45 slots). `runner-starvation-advisory` n'a pu
    # s'executer a 07:12Z que parce qu'une jambe etait deja revenue ; sur le
    # creneau precedent, 01:44Z -> 07:11Z, AUCUN run n'a ete produit pour un
    # cron declare `23,53 * * * *` -- les creneaux sans runner ne sont pas des
    # runs en echec, ce sont des runs qui n'existent pas.
    #
    # L'organe est sans dependance a l'hote : `check_runner_starvation.py` ne
    # lit aucun chemin local, aucun socket, aucun `systemctl` -- tout passe par
    # l'API GitHub. Il n'a jamais eu besoin du parc. Depot public : les minutes
    # GitHub-hosted sont gratuites, l'argument de cout ne s'applique pas.
    #
    # La garde same-repo qui vivait ici a ete retiree avec le routage : ce
    # workflow n'a pas de declencheur pull_request, donc
    # `github.event.pull_request` y est toujours nul et la condition etait
    # vacuously vraie. Elle etait le vestige du raisonnement qui a justifie
    # l'auto-hebergement, et la laisser invitait a le re-deriver.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Measure starvation on coursia-linux
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNERS_READ_PAT: ${{ secrets.RUNNERS_READ_PAT }}
          STARVE_MINUTES: "15"
          WINDOW_MAX_MINUTES: "360"
          # #15332 : mesurer la cadence SERVIE (runs event=schedule de CE
          # workflow uniquement) contre la cadence declaree du cron.
          # Seuil 360 min (revue ai-01 2026-09-16) : la bande servie
          # observée à l'état nominal va jusqu'à ~323 min (mesure live du
          # run de validation ; #15332 cite 168 min ; le body 2,5-5 h) --
          # 240 était DANS la bande : fausses alertes SCHEDULER MUET en
          # service nominal. 360 couvre la queue observée + marge ; la
          # panne totale (arrêt complet du scheduler, 4 h mesurés le
          # 2026-09-09) la franchit dans la demi-journée.
          SELF_WORKFLOW: linux-runner-starvation-advisory.yml
          DECLARED_CADENCE_MINUTES: "30"
          CADENCE_WARN_MINUTES: "360"
          # #22937 : borne la MESURE complete -- le run existe toujours et
          # son rapport de cadence servie (#15332) est emis a chaque passage.
          MEASURE_EVERY_N_RUNS: "4"
        run: python3 scripts/ci/check_runner_starvation.py
