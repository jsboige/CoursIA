name: Learning image (GHCR)

# Pli 1.3 de l'Epic #27543 (#27546) : reconstruire l'image d'apprentissage
# quand son Dockerfile, ses exigences, ses temoins ou le manifeste du pli 1.1
# (#27544, docs/curriculum/manifeste-dependances.json) changent, executer un
# carnet temoin par famille de noyau, puis publier sur GHCR.
#
# Le deploiement (push vers le registre) n'a lieu que sur push sur main ;
# les PR executent construction + temoins SANS publication (load: true),
# ce qui prouve le vert sans toucher au paquet.

on:
  push:
    branches: [main]
    paths:
      - 'docker-configurations/notebook-runner/Dockerfile'
      - 'docker-configurations/notebook-runner/docker-compose.yml'
      - 'docker-configurations/notebook-runner/learning_image_policy.json'
      - 'docker-configurations/notebook-runner/requirements-learning.txt'
      - 'docker-configurations/notebook-runner/requirements-learning.lock.txt'
      - 'docker-configurations/notebook-runner/witness/**'
      - '.github/workflows/learning-image-ghcr.yml'
      # Manifeste du pli 1.1 : le chemin est celui de la branche #27544 ;
      # sur main, il ne declenche rien tant que #27572 n'est pas fusionne.
      - 'docs/curriculum/manifeste-dependances.json'
  pull_request:
    paths:
      - 'docker-configurations/notebook-runner/Dockerfile'
      - 'docker-configurations/notebook-runner/docker-compose.yml'
      - 'docker-configurations/notebook-runner/learning_image_policy.json'
      - 'docker-configurations/notebook-runner/requirements-learning.txt'
      - 'docker-configurations/notebook-runner/requirements-learning.lock.txt'
      - 'docker-configurations/notebook-runner/witness/**'
      - '.github/workflows/learning-image-ghcr.yml'
  workflow_dispatch:
    inputs:
      pousser:
        description: 'Publier vers GHCR (sinon : construction + temoins seulement)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: learning-image-ghcr-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/coursia-learning
  DOCKERFILE: docker-configurations/notebook-runner/Dockerfile
  CONTEXTE: docker-configurations/notebook-runner

jobs:
  construire-temoins-publier:
    name: Construire, executer les 7 temoins, publier
    # Runner heberge : build lourd (compilation du REPL Lean a froid), docker
    # et buildx disponibles, aucune contention avec les machines de la flotte.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquettes
        id: tags
        run: |
          set -euo pipefail
          date_tag="$(date -u +%Y%m%d-%H%M)"
          sha_tag="sha-${GITHUB_SHA::12}"
          echo "date_tag=$date_tag" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$sha_tag" >> "$GITHUB_OUTPUT"

      - name: Construction (mesuree, sans publication)
        id: build
        uses: docker/build-push-action@v6
        env:
          # Cache de couches dans le registre lui-meme (ref buildcache) :
          # le cache gha est plafonne a 10 Go, l'image pere ~14 Gio. Mais
          # sur evenement PR la connexion GHCR est sautee (aucune
          # publication) : un cache registre y ecrirait en anonyme et
          # echoue en 403 (mesure, run 44795615124). Sans login : pas de
          # cache du tout — la PR paie une construction a froid (~4 min),
          # c'est aussi la mesure a froid de l'acceptance.
          CACHE_FROM: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache', env.IMAGE) || '' }}
          CACHE_TO: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}
        with:
          context: ${{ env.CONTEXTE }}
          build-contexts: |
            lean_scripts=MyIA.AI.Notebooks/SymbolicAI/Lean/scripts
          file: ${{ env.DOCKERFILE }}
          target: learning
          load: true
          tags: ${{ env.IMAGE }}:smoke
          cache-from: ${{ env.CACHE_FROM }}
          cache-to: ${{ env.CACHE_TO }}

      - name: Temoin par famille de noyau (7 sur 7 exigees)
        run: |
          set -uo pipefail
          echo "debut: $(date -u +%FT%TZ)"
          rc=0
          mkdir -p .tmp-out
          for temoin in witness-python3 witness-global-313 witness-net-csharp \
                        witness-net-fsharp witness-net-powershell witness-rust \
                        witness-lean4; do
            echo "::group::temoin $temoin"
            debut=$(date +%s)
            if docker run --rm \
                 -v "$PWD/${{ env.CONTEXTE }}/witness:/witness:ro" \
                 -v "$PWD/.tmp-out:/out" \
                 -w /witness \
                 "${{ env.IMAGE }}:smoke" \
                 jupyter nbconvert --to notebook --execute \
                   --ExecutePreprocessor.timeout=600 \
                   --output "/out/${temoin}.executed.ipynb" \
                   "${temoin}.ipynb"; then
              duree=$(( $(date +%s) - debut ))
              echo "temoin $temoin : OK en ${duree}s"
            else
              rc=1
              echo "::error::temoin $temoin ECHOUE — le workflow echoue (acceptance #27546)"
            fi
            echo "::endgroup::"
          done
          rm -rf .tmp-out
          exit $rc

      - name: Publier (etiquettes date, sha, latest)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.pousser)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXTE }}
          build-contexts: |
            lean_scripts=MyIA.AI.Notebooks/SymbolicAI/Lean/scripts
          file: ${{ env.DOCKERFILE }}
          target: learning
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tags.outputs.date_tag }}
            ${{ env.IMAGE }}:${{ steps.tags.outputs.sha_tag }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Relever temps et taille
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## Image d'apprentissage — releve"
            echo
            echo "- evenement : ${{ github.event_name }}"
            if docker image inspect "${{ env.IMAGE }}:smoke" >/dev/null 2>&1; then
              taille="$(docker image inspect '${{ env.IMAGE }}:smoke' --format '{{.Size}}')"
              echo "- taille : ${taille} octets ($(( taille / 1024 / 1024 / 1024 )) Gio)"
            fi
            echo "- publication : ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.pousser)) && 'oui' || 'non (PR/depot sans pousser)' }}"
            echo "- etiquette date : \`${{ steps.tags.outputs.date_tag }}\`"
            echo "- etiquette sha : \`${{ steps.tags.outputs.sha_tag }}\`"
            echo
            echo "_Le temps de construction par etape est dans le journal du job ;_"
            echo "_le premier run apres un changement du Dockerfile est la mesure a froid._"
          } >> "$GITHUB_STEP_SUMMARY"
