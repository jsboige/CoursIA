name: Scripts & Notebook-Tools Tests

# Provisioned workflow for the scripts/ + notebook_tools/ + supporting test
# suites that the ML Pipeline Tests job (ml-tests.yml) deliberately does NOT
# cover — it is scoped to MyIA.AI.Notebooks/QuantConnect/ML-Training-Pipeline
# (see #2871, #2872). Running those suites in ml-tests.yml left the CI red on
# main for 9 days (2026-05-29 -> 2026-06-12) because the ML job installs only
# ML deps and `pytest.ini` testpaths pull in scripts/ suites that need more
# (`requests`, `bcrypt`, `jupyter_client`, ...).
#
# This workflow installs the full set of lightweight deps those suites import,
# so the signal is meaningful: a red here points at a real scripts/ regression,
# not a missing-dependency collection error.
#
# Remaining work tracked in #2871 (part 2): per-lane triage of the residual
# ubuntu failures (genai x16, wsl x7, catalog x1, notebook_tools x1). Those
# suites are collected and the passing majority runs here; the known-flaky
# subset is listed in the Known-flaky note below for the lane owners.

on:
  # #24828 : sans filtre paths, chaque commit de main obtient un verdict
  # Scripts Tests (CPU), y compris les commits qui ne touchent pas scripts/.
  push:
    branches: [main]
  pull_request:
    # #19426 option (b) : pas de branches: sur pull_request quand paths: scope
    # deja (precedent #19381) — le retarget d'une PR empilee reste capte.
    types: [opened, synchronize, edited, reopened]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'pytest.ini'
      - '.github/workflows/scripts-tests.yml'
      # #17850 : ce registre est relu par la suite de scripts.
      - 'arxiv_attributions_registry.yaml'
      # See the push: block above for why these two are pinned here.
      - '.github/workflows/catalog-cron.yml'
      - '.github/workflows/translation-sync.yml'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/tests/test_bg_tree_lock.py'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/prover/tree_lock.py'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/prover/run_prover_bg.py'
      # #6790 prover forensic-guards (mirror of the push paths above).
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/prover/forensic_guards.py'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/tests/test_prover_forensic_guards.py'
      # #18709 provider gate (mirror of the PR paths above).
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/prover/provider_gate.py'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/tests/test_provider_gate_18709.py'
      # #21331 prover harness suites (mirror of the push paths above).
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/prover/**'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/lean_server.py'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/tests/**'
      # #11349 native_decide ratchet rewire (mirror of the push paths above).
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/GOL/conway_lean/**.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/GOL/conway_lean/lakefile.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/GOL/conway_lean/lakefile.toml'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/GOL/conway_lean/lean-toolchain'
      # #1028 melody verdict (mirror of the push path above).
      - 'MyIA.AI.Notebooks/GenAI/Audio/04-Applications/v4/prosody_lab/syllable_pitch.py'
      # #19695 banc de reference TTS (mirror of the push path above).
      - 'MyIA.AI.Notebooks/GenAI/Audio/04-Applications/v4/prosody_lab/bake_*.py'
      - 'MyIA.AI.Notebooks/GenAI/Audio/04-Applications/v4/prosody_lab/bank_schema_v1.json'
      - 'MyIA.AI.Notebooks/GenAI/Audio/04-Applications/v4/prosody_lab/bootstrap_bank.py'
      - 'MyIA.AI.Notebooks/GenAI/Audio/04-Applications/v4/prosody_lab/test_bake_bank.py'
      # #17586 narrateur CustomVoice (mirror of the push path above).
      - 'MyIA.AI.Notebooks/GenAI/Audio/04-Applications/v4/p5_tts.py'
      - 'MyIA.AI.Notebooks/GenAI/Audio/04-Applications/v4/prosody_lab/qwen_tts_client.py'
      - 'MyIA.AI.Notebooks/GenAI/Audio/04-Applications/v4/tests/test_p5_narrator_routing.py'
      - 'MyIA.AI.Notebooks/GenAI/Audio/04-Applications/v4/tests/test_p5_customvoice_narrator.py'
      - 'MyIA.AI.Notebooks/GenAI/Audio/04-Applications/v4/tests/test_qwen_tts_client.py'
      # P2 segmentation (mirror of the push path above).
      - 'MyIA.AI.Notebooks/GenAI/Audio/04-Applications/v4/p2_segmentation.py'
      - 'MyIA.AI.Notebooks/GenAI/Audio/04-Applications/v4/tests/test_p2_segment_dedup.py'

      # #22905 organe de narration partage (mirror of the push path above).
      - 'MyIA.AI.Notebooks/GenAI/Audio/04-Applications/v4/narration.py'
      - 'MyIA.AI.Notebooks/GenAI/Audio/04-Applications/v4/tests/test_narration.py'
      # #11835 no-op guard (mirror of the push path above).
      - '.github/workflows/pr-gate-rerun.yml'
      # Mirror the push path above so fork workflow-only PRs execute the policy.
      - '.github/workflows/**'
      # #15058 ADK contracts (mirror of the push path above).
      - 'MyIA.AI.Notebooks/ML/DataScienceWithAgents/Track2-GoogleADK/**'
      # #25201 : le refactor ADK a déplacé une suite de contrat hors Track2.
      - 'MyIA.AI.Notebooks/ML/DataScienceWithAgents/07-Agent-Orchestration/**'
      # #17580 fallacy-detection snapshot guard (mirror of the push path above).
      - 'MyIA.AI.Notebooks/SymbolicAI/ArgumentAnalysis/data/**'
      - 'MyIA.AI.Notebooks/SymbolicAI/ArgumentAnalysis/ontologies/**'
      - 'scripts/fallacy_detection/**'
      # #18392 texte->PL : la suite pytest de ArgumentAnalysis/tests (collectee
      # par le job ci-dessous, cible ArgumentAnalysis entiere) n'avait AUCUN
      # declencheur sur ses propres sources -- argumentation_lib/** ne fait pas
      # partie de scripts/**, donc une PR qui vendorise un module + ses tests
      # n'executait jamais la suite (#10416 pattern). Miroir push/pull_request.
      - 'MyIA.AI.Notebooks/SymbolicAI/ArgumentAnalysis/argumentation_lib/**'
      - 'MyIA.AI.Notebooks/SymbolicAI/ArgumentAnalysis/tests/**'
      # #13746 tranche 2 (mirror of the push paths above).
      - 'MyIA.AI.Notebooks/QuantConnect/scripts/**'
      - 'MyIA.AI.Notebooks/ML/DataScienceWithAgents/01-Python-For-Data-Science/tests/**'
      - 'dotnet/GradeBookApp/**'
      # #21104 pli 0 Origami (mirror of the push path above).
      - 'MyIA.AI.Notebooks/GameTheory/gateway/**'
      # #21764 (mirror of the push path above).
      - 'MyIA.AI.Notebooks/GameTheory/GameTheory-06-EvolutionTrust-Python.ipynb'
      # #21886 (miroir du bloc push ci-dessus).
      - 'MyIA.AI.Notebooks/GameTheory/tests/**'
      - 'MyIA.AI.Notebooks/GameTheory/game_theory_utils.py'
      - 'MyIA.AI.Notebooks/GameTheory/limit_sets.py'
      - 'MyIA.AI.Notebooks/GameTheory/trust_simulation/**'
      - 'MyIA.AI.Notebooks/GameTheory/requirements.txt'
      # #21100 pli 0 Origami (Kernel Gateway) (mirror of the push path above).
      - 'MyIA.AI.Notebooks/SymbolicAI/SMT/Z3-API/gateway/**'
      # #23423 (mirror of the push path above).
      - 'MyIA.AI.Notebooks/QuantConnect/ML-Training-Pipeline/scripts/launchers/launch_capped.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scripts-tests-${{ github.ref }}-${{ github.event.action == 'edited' && github.event.changes.base == null && 'meta-edit' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scripts-tests:
    name: Scripts Tests (CPU)
    # Route vers la jambe Linux auto-hebergee (#13378 tranche 5, decision ai-01
    # 2026-09-02) : garde Python pur, sans secret. La garde same-repo ci-dessous
    # saute les PRs de fork (pr_gate.py compte `skipped` comme OK) : aucun code de
    # fork n'atteint le runner. Retour arriere = revert de la PR.
    #
    # T-L (#25510) : ce job est un job REQUIS -- tant qu'il n'a pas de verdict,
    # `main` n'est pas verifie. Il etait route sur le meme pool que les PRs
    # (`coursia-ephemeral`), donc il attendait derriere elles (mesure du
    # 2026-11-12 : plus de 27 minutes en file, 31 runners sur 31 occupes).
    # Il vise desormais le slot RESERVE (`coursia-main`) sur un push, et le
    # pool PR sinon -- repli ENUMERE, exige par
    # `scripts/ci/check_self_hosted_runner_policy.py` (forme auditee : jeu de
    # labels + garde `push` + repli ; le jeu seul, ou le jeu sans garde, ou
    # le jeu sans repli sont refuses).
    # La garde same-repo ci-dessous reste obligatoire : le repli est
    # auto-heberge, donc une PR de fork ne doit pas l'atteindre.
    # Le merge de ce routage suppose le slot DEPLOYE (`--apply` du script de
    # creation) : sans runner `coursia-main`, le job de `main` attendrait un
    # runner inexistant. Ordre : deployer le slot, puis merger.
    runs-on: ${{ (github.event_name == 'push') && fromJSON('["self-hosted","coursia-main","coursia-linux"]') || fromJSON('["self-hosted","coursia-ephemeral","coursia-linux"]') }}
    if: (github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository) && (github.event.action != 'edited' || github.event.changes.base != null)
    # Plafond 20 -> 30 (#15853) -> 40 (2026-11-12). Grandeur mesuree : le
    # mur du JOB (started_at -> completed_at du job nomme exactement
    # "Scripts Tests (CPU)"), celle sur laquelle timeout-minutes agit --
    # jamais la duree du run (file d'attente comprise, et pour un rerun les
    # deux tentatives : c'etait la faute de grandeur de la v1).
    #
    # Requete a rejouer telle quelle avant de citer ou de retirer ce
    # tableau (photographie datee, pas une verite) : runs du workflow
    # 296034456, branch=main, status=completed, run_started_at >
    # 2026-09-13T23:08:18Z (merge de xdist #15833) ; dans chaque run, job
    # de nom EXACT "Scripts Tests (CPU)".
    #
    # Mesure du 2026-09-15T07:00Z, rejouee a 07:22Z sans derive :
    #   70 runs conclus
    #     - 25 sans job : jobs: [], jamais demarres (supplantation de
    #       file) -- hors de toute discussion de plafond ;
    #     - 45 porteurs d'un job, max par conclusion :
    #         success    30   max 17,4 min
    #         failure    11   max 14,3 min
    #         cancelled   4   20,32-20,43 min
    # Les 4 cancelled ont bien ete termines au mur de 20 min, mais les
    # logs montrent des workers xdist morts puis 14-15 min de silence : ce
    # sont des hangs que relever le plafond ne repare pas (suivi #16288),
    # pas quatre cas de queue lente. (Retraction de la v1 run-level -- 26
    # runs, mediane 17,5 min, max 19,8 min, 16 annulations -- ecrite en
    # tete du body de #16087.)
    #
    # Mesure du 2026-11-12 (meme requete, meme grandeur) : 70 derniers runs
    # termines, 53 jobs mesures (17 runs sans job) :
    #     success    25   max 27,83 min
    #     failure     4   max 25,42 min
    #     cancelled 24   dont 7 a 30,65 / 31,02 / 31,03 / 31,05 / 31,13 /
    #                        31,17 / 31,55 min : le mur de 30 min les a
    #                        tranches. Les 17 autres sont plus courts
    #                        (concurrence, supersession) : pas des coupes.
    # Sous le plafond de 30, la marge du succes le plus long n'etait que
    # de 2,17 min, et 7 jobs sur 53 (13 %) avaient deja ete coupes.
    #
    # Les 7 coupes sont CENSUREES A DROITE : leur duree reelle est > 30 min
    # et inconnue. 40 est donc un plancher de decision, pas une borne
    # mesuree :
    #     enfant   27,83 x 1,44 -> 40   (12,17 min au-dessus du succes le
    #                                     plus long ; 8,45-9,35 min au-dessus
    #                                     de la bande des coupes)
    #     gate     40 + 15       -> 55   (marge de 15 min INCHANGEE : elle
    #                                     etait 30 -> 45) ; 55 reste sous
    #                                     le plafond propre de Quarto (60),
    #                                     donc la queue reelle de Quarto
    #                                     reste sur le chemin STARVED ->
    #                                     auto-annulation (#13510, #14412)
    #     runner   55 + 7        -> 62   (marge de 7 min pour le verdict
    #                                     INCHANGEE : elle etait 45 -> 52)
    # La regle (enfant < aggregateur < runner) et ses marges sont donc
    # preservees a l'identique : seule la valeur du mur de l'enfant bouge.
    #
    # Mesure du 2026-11-14 -- LA REPONSE, CORRIGEE PAR L'ANNOTATION.
    #
    # Premier passage (organe `scripts/ci/measure_declared_ceiling.py`,
    # meme grandeur : le mur du job "Scripts Tests (CPU)", 43,4 h
    # reellement couvertes) :
    #     plafond 30 min   29 candidats / 220 jobs  dont 25 CONFIRMEES (TIMEOUT)
    #     plafond 40 min   14 candidats / 523 jobs  dont 12 CONFIRMEES (TIMEOUT)
    # soit 2,3 % sous le plafond de 40 -- et la conclusion ecritte etait
    # « ne pas relever ».
    #
    # CE CHIFFRE ETAIT MAL COMPTE, et la faute n'est pas dans l'annotation :
    # elle est dans la POPULATION. L'endpoint `runs/<id>/jobs` ne renvoie,
    # par defaut, que la DERNIERE tentative d'un run ; or un job coupe au
    # mur est tres souvent REJOUE (rejeu automatique de la CI, ou re-run
    # humain) -- et le run ne porte alors plus que la tentative rejouee, qui
    # reussit. La coupe DISPARAIT de la population : elle est censuree par
    # le rejeu. Mesure du controle croise du 2026-11-14 (meme organe natif
    # `scripts/ci/classify_job_deaths.py`, classe `TIMEOUT` sur
    # l'annotation « The job has exceeded the maximum execution time »,
    # population collectee avec `filter=all`) : 26 des 40 coupes au mur du
    # segment 40 min sont ABSENTES du cache collecte SANS `filter=all`.
    # L'organe collecte donc desormais avec `filter=all`, et son cache
    # porte une VERSION : un cache anterieur est ignore, pas relu.
    #
    # Ce que dit la mesure CORRIGEE (population entiere, chaque coupe
    # CONFIRMEE par l'annotation de l'organe natif) :
    #     plafond 30 min   60 coupes / 249 jobs executes   (24,1 %)
    #     plafond 40 min   38 coupes / 582 jobs executes   ( 6,5 %)
    # (`skipped` exclus : un job jamais demarre n'a pas de duree.)
    # Le seuil de decision pose par la premiere mesure (>= 5 % des
    # executions coupees au mur) est donc franchi APRES le releve : le
    # plafond BINDE encore. Sur la fenetre mesuree, 42 PRs distinctes ont
    # porte au moins un rouge de mur.
    #
    # Le releve, et ses trois valeurs (les marges de la chaine ne
    # bougent pas) :
    #     enfant   40        -> 44
    #     gate     40 + 15   -> 59   (marge de 15 min INCHANGEE ; 59 reste
    #                                  SOUS le plafond propre de Quarto (60),
    #                                  donc la queue reelle de Quarto reste
    #                                  sur le chemin STARVED -> auto-annulation
    #                                  (#13510, #14412))
    #     runner   59 + 7    -> 66   (marge de 7 min pour le verdict
    #                              INCHANGEE)
    # 44 est le maximum coherent : l'agregateur doit rester SOUS 60, donc
    # l'enfant sous 45.
    #
    # Ce que le releve ne repare pas : les 8 coupes qui portent aussi un
    # etape en echec (le test y echoue, il n'y finit pas) et les annulations
    # par supersede. Le releve rend au succes les coupes AU MUR, pas la
    # duree de la jambe -- celle-ci se gagne sur le plan a deux etages
    # (#25510, etage 1) et sur le pool de runners (slot reserve pour
    # `main`, tranche T-L).
    #
    # Re-mesurer : `python scripts/ci/measure_declared_ceiling.py
    # --workflow scripts-tests.yml --hours 48 --jobs-cache
    # .tmp/ceiling_jobs_v2.json --annotate --out .tmp/ceiling4.json`
    timeout-minutes: 44

    steps:
      # ------------------------------------------------------------------
      # HEAL (#15387) : le pool self-hosted REUTILISE le work dir entre jobs.
      # Un job a profondeur par defaut y laisse un clone SHALLOW ; le
      # checkout ci-dessous (profondeur 1) declenche alors un fetch
      # d'approfondissement dont l'echec est AVALE par actions/checkout --
      # mesure firsthand sur #15492 (run 34542167016, job 103087137418) :
      # `error: Could not read 0102d652b3...` emis PENDANT le fetch, etape
      # rendue verte malgre tout. Le depot reste alors ni shallow ni
      # complet, et tout `git log --raw` / `git rev-list` ulterieur casse --
      # ce qui fait rougir un check REQUIS sur une panne d'infrastructure,
      # jamais sur du fond.
      #
      # T-K (#25510) : le `fetch --unshallow origin` SANS refspec tire
      # `+refs/heads/*` -- l'historique complet des 1 606 branches -- et c'est
      # exactement le cout que la tranche supprime (19 min sur 75e21a7fac,
      # job 131524893709, `curl 28` apres 22:12-22:31Z). L'historique utile
      # (tete + base) est tire par l'etape T-K ci-dessous, bornee et
      # VERIFIEE. Le work dir est donc conserve tel quel ; seule la purge
      # d'un graphe reellement incomplet reste.
      # ------------------------------------------------------------------
      - name: "Purger un work dir reutilise au graphe incomplet (#15387)"
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE" || exit 0
          if [ ! -d .git ]; then
            echo "[heal] aucun work dir preexistant -- checkout fera un clone neuf"
            exit 0
          fi
          if [ -f .git/shallow ]; then
            echo "::notice::[heal] work dir SHALLOW reutilise -- profondeur conservee ; l'historique utile (tete + base) sera tire par l'etape T-K, sans les 1 606 branches"
          fi
          if ! git rev-list --all --count >/dev/null 2>&1; then
            echo "::notice::[heal] graphe d'objets incomplet -- purge du work dir"
            rm -rf .git
            exit 0
          fi
          echo "[heal] work dir utilise -- graphe valide"

      # T-K (#25510) : le checkout ne tire PLUS les 1 606 branches.
      #
      # `fetch-depth: 0` fait tirer `+refs/heads/*` + les tags : l'historique
      # complet de TOUTES les branches. L'entree `refspec` de checkout v4 ne
      # peut PAS resoudre cela -- elle est IGNOREE par le code de l'action
      # (`src/git-source-provider.ts` appelle `getRefSpecForAllHistory`, qui
      # construit `+refs/heads/*:refs/remotes/origin/*` + `tagsRefSpec` ;
      # `settings.refspec` n'apparait nulle part). Mesure : 19 min de
      # checkout sur 75e21a7fac (job 131524893709) et 2 425 s sur le run
      # 43318043479.
      #
      # Le clone part a profondeur 1 (un commit + son arbre), puis UN fetch
      # elargit l'historique a la TETE (son ascendance complete) et a la
      # BASE (`origin/main`) -- rien d'autre.
      - uses: actions/checkout@v4
        with:
          # Full history of the HEAD and of the BASE is required by
          # test_twin_registry_integrity.py::test_audit_shas_exist_in_file_history
          # (#9399 volet b), which asserts each attested audit sha really
          # existed as a file blob, and by the base resolution of that same
          # test (`_resolve_base_commit` -> merge-base(base, HEAD)). T-K
          # keeps that guarantee while dropping the 1 605 other branches:
          # the depth-1 clone is deepened right after by a bounded fetch.
          fetch-depth: 1
          filter: blob:none

      - name: "T-K : ascendance de la tete + la base, sans les 1 606 branches"
        shell: bash
        run: |
          set -euo pipefail
          # Le clone de checkout est superficiel (profondeur 1). On elargit
          # l'historique a CE QUE la jambe lit :
          #   - la tete : son ascendance complete (historique des carnets
          #     jumeaux, merge-base du fast-lane) ;
          #   - la base : `origin/main` (candidat de `_resolve_base_commit`).
          #
          # `--unshallow` porte sur les refs donnees : il fait disparaitre le
          # bord du clone pour elles, sans toucher aux autres. Sur un work
          # dir reutilise, les objets sont deja la : la negociation
          # serveur ne renvoie rien et le cout est celui du reseau, pas
          # celui du volume.
          #
          # La tete est tiree par son SHA et non par sa ref : c'est le
          # precedence de checkout lui-meme (`getRefSpecForAllHistory` fait
          # `+${commit}:refs/remotes/pull/<N>/merge` -- l'API accepte un
          # SHA comme source), et la ref `refs/pull/<N>/merge` peut ne pas
          # exister (PR en conflit).
          deepen="--unshallow"
          if [ ! -f .git/shallow ]; then
            deepen=""
          fi
          git fetch --filter=blob:none --no-tags ${deepen} origin \
            "+${GITHUB_SHA}:refs/remotes/origin/tete" \
            "+refs/heads/main:refs/remotes/origin/main"

      - name: "T-K : controle -- l'historique de la base est lu"
        shell: bash
        run: |
          set -euo pipefail
          # Controle : l'historique est REELLEMENT lu, pas seulement
          # present. Un historique tronque ferait classer `fabricated` les
          # sha attestes du carnet jumeau -- le test jumeau rougirait sur
          # un sha qui n'est pas absent, mais rendu absent par la
          # troncature. Le plancher ci-dessous attrape la troncature avant
          # lui, et nomme la mesure.
          base=$(git merge-base origin/main HEAD || true)
          if [ -z "${base}" ]; then
            echo "::error::T-K : merge-base(origin/main, HEAD) introuvable -- l'historique n'a pas ete tire"
            exit 1
          fi
          commits=$(git rev-list --count "${base}")
          echo "T-K : base=${base} commits_dans_ascendance=${commits}"
          if [ "${commits}" -lt 1000 ]; then
            echo "::error::T-K : historique tronque (${commits} commits dans l'ascendance de la base)"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        # L'environnement de cette suite est installe par un script PARTAGE :
        # `scripts/ci/install_scripts_tests_deps.sh`. Le lot quotidien en
        # ombre de la voie lente (P3, #25510) installe le meme script --
        # c'est ce qui rend les durees du lot comparables a celles de la
        # suite qu'on veut deplacer. Le bloc d'installation a ete extrait
        # VERBATIM de cette etape le 2026-11-09 (PR #25521) : toute
        # modification de l'un doit etre portee dans l'autre.
        run: bash scripts/ci/install_scripts_tests_deps.sh
      - name: Epingler les pools de threads BLAS/OpenMP du job (#24696)
        # Le runner est un pool auto-heberge PARTAGE : quand plusieurs jobs se
        # partagent la machine, la creation de threads echoue et les
        # sous-processus qui importent numpy meurent avant de produire leur
        # sortie. Mesure (job 126652731468, run 41852640940, tentative 1,
        # 2026-11-04T15:09Z) : `2 failed, 24345 passed` sur
        # `test_wolfram_ksf.py::TestWolframKSFJsonRoundtrip` et
        # `test_wolfram_mode.py::TestWolframJsonRoundtrip`, avec
        # `OpenBLAS blas_thread_init: pthread_create failed for thread 14 of
        # 32: Resource temporarily unavailable`.
        #
        # Le defaut d'OpenBLAS dimensionne son pool sur le nombre de coeurs
        # vus par le runner (32 dans le message ci-dessus) -- et ce job lance
        # deja jusqu'a 4 workers xdist, chacun susceptible d'ouvrir un
        # sous-processus numpy. Le deficit n'est donc pas le CPU, c'est le
        # NOMBRE de threads creations simultanees : d'ou une valeur de 1, et
        # non le quota CPU.
        #
        # Cout mesure (poste ai-01, 2026-11-04, processus enfant
        # `scripts/hashlife/k_trajectory.py --mode wolfram-ksf --n-cells 64
        # --n-steps 64`) : 53 threads OS au pic sans epinglage, 8 avec
