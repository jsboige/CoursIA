            > scripts_scope.json

      - name: Run tests
        # #22468 tranche 4 : la portee (organe scripts/ci/changed_scripts_tests
        # .py -- suites liees aux chemins modifies, fail-OPEN) est ecrite par
        # le pas precedent, qui porte seul le jeton GitHub. Ce pas joue la
        # selection, ou la liste complete en cas de doute. Les planchers de
        # collecte ci-dessous restent
        # inconditionnels : un vert restreint ne doit pas pouvoir retrecir
        # en silence.
        #
        # Scope to the scripts/ + notebook_tools/ suites this job is named for.
        # The repo-wide pytest.ini testpaths also list GameTheory/tests,
        # QuantConnect/scripts/tests and DataScienceWithAgents/tests; those are
        # included below as they share the same lightweight dep profile. The
        # ML-Training-Pipeline suite is
        # owned by ml-tests.yml and intentionally excluded here (it duplicates
        # torch on its own job).
        #
        # The genai + wsl suites were previously excluded as missing-env
        # (#2871 part 2): they failed on ubuntu due to (a) missing papermill
        # dep at collection time and (b) two genuine test bugs now fixed —
        # test_genai_docker.py polluted sys.modules['config'] for sibling
        # tests, and wsl_papermill.win_to_wsl_path relied on Path.drive which
        # is empty under POSIX. Both are fixed; papermill/nbformat are now
        # installed above. The 7 suites run here green (354 tests, validated
        # under WSL ubuntu + CI deps). genai -> po-2023, wsl -> po-2025.
        #
        # #6790 tree-lock guard: test_bg_tree_lock.py loads tree_lock.py by
        # file path (stdlib-only) and importorskips the LLM stack for its 3
        # launcher-wiring tests, so on a bare runner it is hermetic: 14 pass,
        # 3 skip.
        #
        # #21331 prover harness suites: test_prover_guards.py +
        # test_lean_utils.py now collect on this bare runner (lazy
        # prover/__init__.py, PEP 562) and their tests/conftest.py
        # reclassifies LLM-stack absence (agent_framework /
        # agent_framework_openai) as SKIP — the same classification
        # importorskip gives. Measured under WSL on this job's exact pip
        # set, submodules absent: 164 pass / 163 skip, 0 fail; on a full
        # env (stack + submodules): 327 pass. The 5 inherited reds Hermes
        # flagged on #21324 are fixed: 2 layout pins skip with a written
        # motif when the game_theory_lean gitlink is not materialized,
        # 3 #18432 venue tests align Linux EEXIST-on-directory with the
        # Windows PermissionError semantics (unusable venue, no suffix
        # bump). agent_tests owner: po-2026 (Lean lane).
        #
        # scripts/audit/tests re-cabled here (family 2 of #14615): the
        # 2026-08-14 CI-EXCLUDED reason (4 env-dependent failures, DALLE-3
        # key) was fixed by #12837 (hermetic rewrite, urlopen monkeypatched).
        # Measured firsthand 2026-09-04 on origin/main: 455/455 green with the
        # OpenAI key unset (env -u re-run), zero network/gh subprocess, zero
        # dep delta vs this job (pillow arrives transitively with matplotlib).
        #
        # scripts/ci/tests re-cabled here (#22234, dossier preflight po-2025) :
        # la suite nouvelle de check_runner_starvation (20 tests, hermetique,
        # _gh_json monkeypathe) vivait dans un repertoire que ce run ne
        # collectait pas -- vert en local, jamais servi en CI. Les voisins
        # preexistants du repertoire sont hermetiques aussi (git ls-files
        # local, spawns python, psutil en importorskip ; timeline/comments
        # monkeypatches pour list_closed_unmerged_prs).
        #
        # Nombre de workers xdist borne par le plafond memoire du conteneur
        # (1 worker par Gio entier de `memory.max`, entre 1 et 4). Les slots a
        # 4 Gio (ai-01-wsl-*, po-2024-linux-docker-1) gardent `-n 4` a
        # l'identique. Les slots `po-2024-linux-persist-*`, plafonnes plus bas,
        # tuaient leurs workers par OOM du cgroup (`dmesg` : CONSTRAINT_MEMCG,
        # 2026-10-20 04:44Z et 05:00Z, 4 jobs sur 4 en echec) : ils ont ete
        # retires de `coursia-linux`, et sept slots sont restes inactifs devant
        # une file de 800 runs. Borner `-n` leur rend les jobs.
        #
        # #22735 -- huit suites de `scripts/**/tests/` etaient vertes en local et
        # jouees par AUCUN workflow : datasets, genai-stack, hashlife, i18n,
        # qc-mcp-lite, smartcontracts, sudoku, validation (666 tests mesures sur
        # `main` au 2026-10-26). La suite `scripts/sudoku/tests` certifie
        # l'invariant de hierarchie de difficulte du corpus -- sans cablage, le
        # defaut qu'elle refute redevient invisible. Hermeticite mesuree
        # firsthand sur ce poste (2026-10-26, Python 3.13) : 77 / 199+1 skip /
        # 164 / 50 / 58 / 26 / 60 / 31 tests verts, 58 s cumules, aucune
        # dependance hors du pip install de ce job pour SEPT des huit suites
        # (bcrypt compris, deja installe ici).
        #
        # La huitieme, `qc-mcp-lite`, fait exception : `server.py` l.31 importe
        # `mcp.server.fastmcp` a la COLLECTION, et le SDK MCP n'est pas dans le
        # pip install de ce job. Premier run (#122006788867, 2026-10-27) : le
        # job s'est arrete sur `ModuleNotFoundError: No module named 'mcp'`,
        # avec 21590 tests verts par ailleurs. La suite sort donc de ce run
        # et prend son propre job (`qc-mcp-lite-tests`), ou le SDK est
        # installe et epingle -- env isole, rayon d'action nul sur les 16000+
        # tests du job partage ( meme motif que `adk-contracts` plus bas).
        # L'inventaire des suites -- disque contre CI -- est
        # desormais un organe (`scripts/check_testpaths_coverage.py`, garde
        # `.github/workflows/testpaths-coverage-guard.yml`) et non une relecture
        # de workflow.
        #
        # Une meme invocation pytest ne peut pas porter deux suites `tests/`
        # sans paquet parent : pytest derive le nom de module du paquet le plus
        # proche portant `__init__.py`, et `scripts/genai-stack/tests/` comme
        # `agent_tests/tests/` se resolvent alors tous deux en `tests.conftest`
        # -- pluggy refuse d'enregistrer le meme objet sous deux noms ("Plugin
        # already registered under a different name"). Mesure : 1 collision sur
        # 694 modules distincts, la seule etant `tests.conftest`. Le correctif
        # est l'option ini `consider_namespace_packages` (pytest >= 8.0), qui
        # etend la resolution aux paquets-espace de noms et rend les noms de
        # modules uniques par chemin.
        run: |
          mem_max=$(cat /sys/fs/cgroup/memory.max 2>/dev/null \
            || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null \
            || echo max)
          if [ "$mem_max" -gt 0 ] 2>/dev/null; then
            xdist_n=$(( mem_max / 1073741824 ))
            [ "$xdist_n" -gt 4 ] && xdist_n=4
            [ "$xdist_n" -lt 1 ] && xdist_n=1
          else
            xdist_n=4
          fi
          echo "xdist workers: $xdist_n (cgroup memory limit: $mem_max)"
          # #22468 tranche 4 : la portee a ete calculee par le pas
          # "Compute test scope" (seul porteur du jeton) -- suites liees aux
          # chemins modifies (aire de veille = dossier parent de X/tests),
          # fail-OPEN pleine suite avec raison nommee (stderr du pas dedie).
          # La liste COMPLETE reste litterale dans le bloc pytest ci-dessous :
          # c'est la source unique de guard_test_root (#18888) ET de l'organe.
          # JSON absent ou illisible = fail-OPEN pleine suite ici aussi : un
          # organe en panne ne doit jamais pouvoir retrecir la suite. La
          # branche restreinte est volontairement sur UNE ligne (aucun '\' de
          # continuation) pour que PYTEST_BLOCK_RE matche toujours le bloc
          # litteral. rc=2 de l'organe = derive structurelle -> rouge bruyant
          # au pas dedie, jamais une liste inventee.
          SCOPE_MODE=full
          SUITES=""
          if [ -f scripts_scope.json ]; then
            SCOPE_MODE=$(python -c "import json; print(json.load(open('scripts_scope.json'))['mode'])") || SCOPE_MODE=full
            SUITES=$(python -c "import json; print(' '.join(json.load(open('scripts_scope.json'))['suites']))") || SUITES=""
          fi
          echo "portee: $SCOPE_MODE${SUITES:+ -- suites: $SUITES}"
          if [ "$SCOPE_MODE" = "restricted" ]; then
            python scripts/ci/xdist_watchdog.py --idle-limit 480 -- pytest $SUITES -n "$xdist_n" --dist loadscope --tb=short -q
          else
            python scripts/ci/xdist_watchdog.py --idle-limit 480 -- \
            pytest \
            scripts/tests \
            scripts/ci/tests \
            tests \
            scripts/notebook_tools/tests \
            scripts/lean/tests \
            scripts/translation/tests \
            scripts/audit/tests \
            scripts/fallacy_detection/tests \
            MyIA.AI.Notebooks/GameTheory/tests \
            MyIA.AI.Notebooks/IIT/ICT-Series/scripts/tests \
            MyIA.AI.Notebooks/QuantConnect/scripts/tests \
            MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/tests/test_bg_tree_lock.py \
            MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/tests/test_prover_guards.py \
            MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/tests/test_lean_utils.py \
            MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/tests/test_prover_forensic_guards.py \
            MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/tests/test_provider_gate_18709.py \
            MyIA.AI.Notebooks/GenAI/Audio/04-Applications/v4/prosody_lab/test_bake_bank.py \
            MyIA.AI.Notebooks/GameTheory/gateway/test_openspiel_cfr_core.py \
            MyIA.AI.Notebooks/SymbolicAI/SMT/Z3-API/gateway/test_z3_sudoku_core.py \
            MyIA.AI.Notebooks/SymbolicAI/SMT/Z3-API/gateway/test_run_gateway.py \
            MyIA.AI.Notebooks/SymbolicAI/SMT/Z3-API/gateway/test_flagship_endpoint.py \
            MyIA.AI.Notebooks/ML/DataScienceWithAgents/01-Python-For-Data-Science/tests \
            MyIA.AI.Notebooks/GenAI/Audio/04-Applications/v4/tests/test_p5_narrator_routing.py \
            MyIA.AI.Notebooks/GenAI/Audio/04-Applications/v4/tests/test_p5_customvoice_narrator.py \
            MyIA.AI.Notebooks/GenAI/Audio/04-Applications/v4/tests/test_qwen_tts_client.py \
            MyIA.AI.Notebooks/GenAI/Audio/04-Applications/v4/tests/test_p2_segment_dedup.py \
            MyIA.AI.Notebooks/GenAI/Audio/04-Applications/v4/tests/test_narration.py \
            scripts/secrets/tests \
            scripts/quantconnect/tests \
            MyIA.AI.Notebooks/SymbolicAI/ArgumentAnalysis \
            dotnet/GradeBookApp \
            scripts/datasets/tests \
            scripts/genai-stack/tests \
            scripts/hashlife/tests \
            scripts/i18n/tests \
            scripts/smartcontracts/tests \
            scripts/sudoku/tests \
            scripts/validation/tests \
            -n "$xdist_n" --dist loadscope --tb=short -q
          fi
        # Chien de garde xdist (#16288) : quand un worker meurt (`[gwN] node
        # down`), le master attend des workers morts SANS qu'aucun test soit en
        # cours -- la jambe reste muette 14 a 17 min apres `[99%]` jusqu'au mur
        # du job, et le gate lit le blocage comme un depassement. Le watchdog
        # recopie la sortie tel quel, puis tue et rend un verdict qui NOMME le
        # worker mort si la sortie se tait --idle-limit secondes.
        # 480 s, arithmetique : un run bloque echoue a (derniere progression
        # 3,3-5,5 min) + 480 s = 11,5-13,5 min < 17,4 min (plus long succes
        # legitime, mesure #16087) ; et un faux positif exigerait 8 min de
        # silence global alors que 4 workers emettent des points en continu
        # sous -q. pytest-timeout ne peut pas tirer ici (borne par TEST, aucun
        # test en cours) ; le plafond du job reste celui de #16087.
        # `--dist loadscope` is load-bearing, not a default: it groups tests by
        # module, so a module's tests never run concurrently with each other.
        # test_audit_engine_named_not_invoked.py writes ~17 fixed /tmp/_test_*
        # .ipynb names (l.121-129 and after) and is safe ONLY because loadscope
        # keeps the whole module on one worker -- under plain `--dist load` it
        # would collide with itself. Do not relax to `load` without first
        # migrating that module to tmp_path.
        #
        # `--import-mode importlib` (pytest.ini addopts) is equally load-bearing
        # here: three test basenames are duplicated across these 14 paths
        # (test_check_dataset_registry, test_check_public_anchor,
        # scan_slidev_composition), and without it pytest raises
        # `import file mismatch` -- sequentially too, not just under xdist.
        #
        # Audited for inter-module parallel safety before enabling: no shared
        # fixed-path writes outside the module above, no git mutation against
        # the real tree (every `git init` is in tmp_path), no real sockets (sole
# exception: tests/integration's localhost:8768 probe, timeout 1.0,
# self-skipping when refused), no
        # unrestored os.environ/os.chdir, no session-scoped fixtures, no
        # conftest.py in any of the 14 paths. Residual: module-scope fixtures
        # that seed the global PRNG without restoring it (e.g.
        # test_kuhn_poker_cfr.py:64-75) make module ORDER non-reproducible --
        # no test currently depends on it.

      - name: Session hygiene tests, sequential (5)
        # Ces 5 tests ne tournaient JAMAIS en CI (#17628). Leur `skipif` de
        # module saute des que `CI=true` ET `RUNNER_OS=Linux` ET
        # `PYTEST_XDIST_WORKER` est pose -- or le pool n'a que des runners
        # Linux self-hosted WSL, et l'etape precedente lance tout sous
        # `-n 4 --dist loadscope` : la condition matchait donc TOUT run de ce
        # job. Mesure du 2026-09-24 (job 107202539829) : `14989 passed,
        # 103 skipped` -- le vert ne prouvait pas que ces 5 avaient tourne.
        #
        # Le skipif autorise deja le run sequentiel (`PYTEST_XDIST_WORKER`
        # absent). Aucun changement du test : cette etape relance le fichier
        # SEUL et SANS `-n`, ce qui desamorce la saturation RLIMIT_NPROC du
        # cumul de subprocess git sous xdist (cause reelle du skip, #17496 /
        # commit b8a633f153) tout en rendant la couverture a l'organe
        # `scripts/coordination/session_hygiene.py` (#16736).
        #
        # `if: always()` comme les etapes de plancher voisines : meme si la
        # suite principale est rouge, on veut le verdict NOMME de ces 5 tests
        # plutot qu'un silence.
        if: always()
        run: |
          python -m pytest scripts/tests/test_session_hygiene.py -q --tb=short

      - name: Audit tests collection floor (455)
        # Companion guard of the audit re-cabling (family 2 of #14615), same
        # two-signal semantics as the GameTheory floor (#14614) and the dotnet
        # Shared.Tests floor (#14668): a green run must not silently shrink.
        # 0 collected = collection crash (import error), below floor = coverage
        # regression — distinct exit-1 signals either way.
        if: always()
        env:
          AUDIT_TESTS_FLOOR: 455
        run: |
          N=$(python -m pytest scripts/audit/tests --collect-only -q 2>/dev/null | tail -1 | grep -oE '[0-9]+ tests collected' | grep -oE '^[0-9]+')
          if [ -z "$N" ] || [ "$N" -eq 0 ]; then
            echo "::error::--collect-only returned no tests — the collection crashed (distinct from a coverage drop)."
            exit 1
          fi
          if [ "$N" -lt "$AUDIT_TESTS_FLOOR" ]; then
            echo "::error::Coverage regression: $N tests collected, floor=$AUDIT_TESTS_FLOOR."
            echo "::error::If the drop is intentional, raise AUDIT_TESTS_FLOOR in the same PR."
            exit 1
          fi
          echo "OK: $N tests collected (floor=$AUDIT_TESTS_FLOOR)."
      # CI-EXCLUDED — testpaths pytest.ini non couverts par ce run, garde #10903.
      # Retirer la ligne du répertoire câblé (et l'ajouter au run ci-dessus) quand
      # l'herméticité est démontrée sur runner nu. scripts/audit/tests a été
      # retiré de cette liste le 2026-09-04 (famille 2 de #14615) :
      # l'herméticité est démontrée (455/455 sans clé, #12837). Les raisons
      # restantes sont vérifiées firsthand (2026-08-14, po-2024) :
