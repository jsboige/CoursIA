        # cout, pas le calcul). Suite hashlife complete (175 tests) : 18,70 s
        # -> 17,25 s. L'epinglage ne coute donc rien de mesure.
        #
        # Meme famille de variables que le job ML (`Borner les threads au quota
        # CPU du conteneur`) et que les executeurs de carnets
        # (`scripts/notebook_tools/notebook_helpers.py`, #11111) : ici la
        # valeur est 1, et elle est AFFICHEE -- une contrainte non affichee
        # n'est pas prouvee.
        run: |
          for v in OPENBLAS_NUM_THREADS OMP_NUM_THREADS MKL_NUM_THREADS NUMEXPR_NUM_THREADS; do
            echo "$v=1" >> "$GITHUB_ENV"
