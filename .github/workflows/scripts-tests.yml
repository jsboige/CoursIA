      - name: Plancher explicite des tests @requires_jvm (#23542)
        # Aucun workflow n'installe jpype et les jars Tweety sont gitignores :
        # tous les tests @requires_jvm de cette suite sont SAUTES en CI. Le
        # plancher de collecte ci-dessus ne peut pas voir ce trou -- un test
        # saute est un test collecte. Ce census statique rougit si le trou
        # grandit sans declaration, ou si un marqueur disparait (perte de
        # couverture). Bumper --declared dans le meme geste que le test ajoute,
        # et le dire dans le body de la PR.
        if: always()
        run: |
          python scripts/ci/check_jvm_test_census.py --declared 8

      # #18981 : garde anti-recidive #18888 -- un test_*.py pose a la racine
      # d'un module (scripts/notebook_tools/, scripts/lean/, etc.) n'est
      # execute par aucune des jambes ci-dessus. La garde lit la liste des
      # chemins collectes depuis CE workflow (le bloc pytest LITTERAL du pas
      # Run tests -- la branche restreinte d'une ligne est invisible a
      # PYTEST_BLOCK_RE, #22468 tranche 4) et verifie qu'aucun
      # test_*.py n'apparait dans un dossier parent d'un chemin collecte sans
      # etre dans le sous-dossier collecte lui-meme. Verifiee localement le
      # 2026-10-03 : rc=0 sur main, rc=1 sur une branche jetable ou un
      # test_xxx_junk.py a ete pose a scripts/notebook_tools/. La garde est
      # stdlib-only, pas de dep a ajouter au pip install. if: always() pour
      # que la garde rougisse meme si pytest est rouge.
      - name: guard_test_root (#18888 anti-recidive)
        if: always()
        run: |
          python scripts/ci/guard_test_root.py

      # #20181 : parite de couverture des gardes absorbes (review NanoClaw,
      # CONCERNE 1 -- l'organe doit veiller, pas rester un instrument de banc).
      # Le retrait du declencheur pull_request d'un garde absorbe n'est legal
      # que si les `paths` du registre fast-lane couvrent les motifs retires :
      # la voie rapide REMPLACE le workflow, un motif perdu eteint le garde en
      # silence. Fail-closed : source de base illisible ou non parsable est un
      # finding. Les `paths` de ce workflow couvrent deja `scripts/**` et
      # `.github/workflows/**` -- le garde s'allume sur toute PR qui touche le
      # registre ou retire un declencheur. Mesure locale 2026-10-10 :
      # PARITY_OK (1 garde verifie, 19 ecartes deja consolides).
      - name: absorbed-path-parity (#20181)
        if: always()
        run: |
          python scripts/ci/check_absorbed_path_parity.py --base origin/main

  qc-mcp-lite-tests:
    name: qc-mcp-lite suite (58)
    # #22735 : `scripts/qc-mcp-lite/tests` (58 tests, verts en local) etait
    # verte mais jouee par AUCUN workflow -- le defaut qu'elle refute
    # (rate limiting, extraction de stats, auth) redev Invisible. Premier
    # cablage : ajout au run pytest partage du job CPU, qui a casse la
    # COLLECTE du job -- `scripts/qc-mcp-lite/server.py` l.31 importe
    # `mcp.server.fastmcp`, et le SDK MCP n'est pas dans le pip install de ce
    # job (run #122006788867, 2026-10-27 :
    # `ModuleNotFoundError: No module named 'mcp'`, 21590 tests verts par
    # ailleurs).
    #
    # Job dedie, PAS une entree du run pytest partage : meme motif que
    # `adk-contracts` -- installer une chaine de dependances dans l'env
    # partage du job CPU risquerait des conflits de pin avec les 16000+ tests
    # qui y tournent. Env isole = rayon d'action nul.
    #
    # Le SDK est epingle sur la version mesuree (1.30.0 -- 58 tests verts en
    # 3,8 s sur ce poste le 2026-10-27) : le pin est une garantie de
    # non-regression, pas un upgrade. pytest est epingle `>=8` pour
    # l'option ini `consider_namespace_packages` (cf. le run CPU plus haut).
    #
    # `requests` est une dependance de PREMIER rang du module, pas du test :
    # `scripts/qc-mcp-lite/server.py` l.30 fait `import requests`, et
    # `tests/test_server.py` l.357 patche `requests.post`. Premier run de ce
    # job (run #40467079713, job #122066616935, 2026-10-27 08:52Z) : la
    # COLLECTION echoue sur `ModuleNotFoundError: No module named 'requests'`
    # -- le SDK MCP ne l'embarque pas. Dependance absente du
    # `pip install`, ajoutee ici ; version epinglee `>=2.31` (convention du
    # depot : `MyIA.AI.Notebooks/GenAI/requirements.txt` l.5).
    #
    # Mesure d'hermetisme (2026-10-27, venv Python 3.11 vide) : avec
    # `mcp==1.30.0` + `pytest>=8` + `requests>=2.31`, la suite passe --
    # c'est le triplet exact du `pip install` ci-dessous.
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository && vars.CI_OVERFLOW_LOCAL == 'true') && fromJSON('["self-hosted","coursia-ephemeral","coursia-linux"]') || 'ubuntu-latest' }}
    if: (github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository) && (github.event.action != 'edited' || github.event.changes.base != null)
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "mcp==1.30.0" "pytest>=8" "requests>=2.31"

      - name: Run qc-mcp-lite suite
        run: |
          python -m pytest scripts/qc-mcp-lite/tests -q --tb=short

  adk-contracts:
    name: ADK runtime contracts (18)
    # #15058: #13572 makes 07-Agent-Orchestration/utils/test_adk_runtime_contracts.py
    # (C1-C7, REAL ADK 2.8 runtime with a scripted LLM -- offline, no key, no
    # network) its measuring organ, but no CI job ran it: portage was
    # established by declaration, exactly what #13572's clause wanted to
    # prevent. Dedicated job, NOT an entry in scripts-tests' shared pytest
    # list: the collection imports litellm + google-adk at module level
    # (utils/__init__ -> llm_client -> litellm; adk_runtime ->
    # google.adk.models.lite_llm, whose import guard demands litellm), and
    # installing that chain into the shared env would risk pin conflicts with
    # the 1600+ existing tests. Isolated env = zero blast radius.
    # Offre GitHub d'abord (#17397, consigne user du 2026-10-25) : le CI local pallie ses limites. Retour = remettre le label.
    # 2026-10-28 (#23053 b, lane myia-ai-01:CoursIA-2) : forme hybride de
    # debordement (#22461 phase A) -- PR meme-depot ET vars.CI_OVERFLOW_LOCAL
    # == 'true' -> jambe Linux locale ; sinon `ubuntu-latest` (etat du 27/10).
    # Retour arriere = variable `false` ou supprimee, sans toucher ce fichier.
    # Seul ce job est concerne : `scripts-tests` reste sur la jambe locale
    # STATIQUE (sa suite est couplee a la forme du runner, #22820).
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository && vars.CI_OVERFLOW_LOCAL == 'true') && fromJSON('["self-hosted","coursia-ephemeral","coursia-linux"]') || 'ubuntu-latest' }}
    if: (github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository) && (github.event.action != 'edited' || github.event.changes.base != null)
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # Exact pin chain of 07-Agent-Orchestration/requirements.txt (the verified
        # compatibility chain, #13948): litellm 1.93.2 + openai 2.24.0 +
        # google-adk 2.8.0 + pydantic 2.12.5. Measured firsthand on a clean
        # venv with exactly these pins: 16/16 green in ~10 s, no conflicts.
        run: |
          python -m pip install --upgrade pip
          pip install pytest "litellm==1.93.2" "openai==2.24.0" "google-adk==2.8.0" "pydantic==2.12.5" pydantic-settings python-dotenv

      - name: Run ADK runtime contracts
        run: |
          pytest "MyIA.AI.Notebooks/ML/DataScienceWithAgents/07-Agent-Orchestration/utils/test_adk_runtime_contracts.py" --tb=short -q

      - name: Contracts collection floor (18)
        # Same two-signal semantics as the audit (455) / secrets (148) /
        # GradeBook (15) floors above: 0 collected = collection crash (import
        # error -- the exact failure mode a naive wiring of these tests into
        # the shared job would have caused), below floor = a contract test
        # was deleted, which is a coverage regression, never housekeeping.
        if: always()
        env:
          ADK_CONTRACTS_FLOOR: 18
        run: |
          N=$(python -m pytest "MyIA.AI.Notebooks/ML/DataScienceWithAgents/07-Agent-Orchestration/utils/test_adk_runtime_contracts.py" --collect-only -q 2>/dev/null | tail -1 | grep -oE '[0-9]+ tests collected' | grep -oE '^[0-9]+')
          if [ -z "$N" ] || [ "$N" -eq 0 ]; then echo "::error::--collect-only returned no tests — the collection crashed (distinct from a coverage drop)."; exit 1; fi
          if [ "$N" -lt "$ADK_CONTRACTS_FLOOR" ]; then echo "::error::Coverage regression: $N tests collected, floor=$ADK_CONTRACTS_FLOOR. Removing a contract test is a contract change, not housekeeping."; exit 1; fi
          echo "OK: $N tests collected (floor=$ADK_CONTRACTS_FLOOR)."

      - name: Run provider default contracts
        # #20002: config/test_providers.py was run by NO CI leg -- the trigger
        # above already fired on 07-Agent-Orchestration/**, so the surface existed
        # while the collection was silently missing. Host is this job, not the
        # shared scripts-tests list: test_providers.py imports only pytest +
        # pathlib + importlib.util, and config/providers.py only pydantic +
        # pydantic_settings -- no litellm/google-adk at module level, the
        # reason the C1-C7 contracts needed their own env. This env already
        # carries that chain, so the hosting cost is nil.
        #
        # The suite is the invariant binding Settings' declared defaults to
        # ProviderConfig.DEFAULTS: it closes the #14755 class, where a retired
        # OpenRouter model survived as a Settings default because nothing
        # compared the two (get_provider_config resolves `settings.<p>_model or
        # defaults["model"]`, and the fallback only shows on an empty env var).
        run: |
          pytest "MyIA.AI.Notebooks/ML/DataScienceWithAgents/07-Agent-Orchestration/config/test_providers.py" --tb=short -q

      - name: Providers collection floor (30)
        # Two-signal semantics, same as the contracts (18) floor above: 0
        # collected = collection crash, below floor = a test was deleted.
        #
        # The floor is the count measured UNDER THIS JOB'S PIN
        # (pydantic==2.12.5), never the author's workstation: #20002 named the
        # pin gap as the trap to clear first (the suite had been measured under
        # 2.13.4). Replayed before wiring, on the head of this PR: 30 collected
        # / 30 passed under the pin, and 30 / 30 under 2.13.4 as well -- so the
        # gap was not material, and 30 is the floor.
        if: always()
        env:
          ADK_PROVIDERS_FLOOR: 30
        run: |
          N=$(python -m pytest "MyIA.AI.Notebooks/ML/DataScienceWithAgents/07-Agent-Orchestration/config/test_providers.py" --collect-only -q 2>/dev/null | tail -1 | grep -oE '[0-9]+ tests collected' | grep -oE '^[0-9]+')
          if [ -z "$N" ] || [ "$N" -eq 0 ]; then echo "::error::--collect-only returned no tests — the collection crashed (distinct from a coverage drop)."; exit 1; fi
          if [ "$N" -lt "$ADK_PROVIDERS_FLOOR" ]; then echo "::error::Coverage regression: $N tests collected, floor=$ADK_PROVIDERS_FLOOR."; exit 1; fi
          echo "OK: $N tests collected (floor=$ADK_PROVIDERS_FLOOR)."
