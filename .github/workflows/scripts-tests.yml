      # 254 tests / 9 modules, mesures firsthand le 2026-09-05 sur l'arbre de
      # fusion (ai-01) -- 253 verts + 1 skip, 3,9 s. Le skip est un garde de
      # donnee (spy.zip sous lean-workspace gitignore), pas un echec.
      # Le motif d'exclusion d'origine (deps yfinance + fichiers externes) ne
      # tient plus : yfinance est ABSENT de l'env de mesure et la suite passe
      # quand meme -- test_yfinance_to_lean_daily.py documente lui-meme que le
      # fetch est paresseux et non exerce. Deps reelles : numpy + pandas,
