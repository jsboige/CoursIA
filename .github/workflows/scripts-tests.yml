        # une suite d'execution_count continue et 0 erreur -- l'acceptance
        # mesuree sur l'image, pas supposee. Le plancher pyarrow>=26 est pose
        # plus haut, dans le meme job.
        run: |
          pip install "axelrod>=4.0.0"
