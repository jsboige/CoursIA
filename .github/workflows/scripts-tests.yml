            MyIA.AI.Notebooks/GameTheory/GameTheory-06-EvolutionTrust-Python.ipynb \
            /tmp/gt06-ci.ipynb -k python3
          python scripts/notebook_tools/check_exec_sequence.py /tmp/gt06-ci.ipynb --check
        env:
          MPLBACKEND: Agg

      # #22468 tranche 4 (revue ai-01 11/11, job 130763938091) : le jeton
      # GitHub ne vit QUE dans ce pas, et le seul consommateur est l'organe
      # de portee (repli API pour lire les chemins de la PR). Pose au niveau
      # du pas `Run tests`, il faisait heriter TOUTE la suite pytest d'un
      # jeton ambiant : deux tests le mesuraient (test_gh_identity.py
      # restaurait `***` au lieu de None ; test_exec_sequence_ack_required
      # .py::test_gh_comment_fetcher_no_repo_env_raises n'obtenait plus
      # FetchError). Il ecrit scripts_scope.json, lu par le pas suivant.
      # rc=2 (workflow illisible) = rouge bruyant volontaire ; tout le reste
      # est fail-OPEN et ecrit une portee pleine avec sa raison nommee.
      - name: Compute test scope (#22468)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci/changed_scripts_tests.py \
            --event "${{ github.event_name }}" \
            --repo "${{ github.repository }}" \
