name: Scripts & Notebook-Tools Tests

# Provisioned workflow for the scripts/ + notebook_tools/ + supporting test
# suites that the ML Pipeline Tests job (ml-tests.yml) deliberately does NOT
# cover — it is scoped to MyIA.AI.Notebooks/QuantConnect/ML-Training-Pipeline
# (see #2871, #2872). Running those suites in ml-tests.yml left the CI red on
# main for 9 days (2026-05-29 -> 2026-06-12) because the ML job installs only
# ML deps and `pytest.ini` testpaths pull in scripts/ suites that need more
# (`requests`, `bcrypt`, `jupyter_client`, ...).
#
# This workflow installs the full set of lightweight deps those suites import,
# so the signal is meaningful: a red here points at a real scripts/ regression,
# not a missing-dependency collection error.
#
# Remaining work tracked in #2871 (part 2): per-lane triage of the residual
# ubuntu failures (genai x16, wsl x7, catalog x1, notebook_tools x1). Those
# suites are collected and the passing majority runs here; the known-flaky
# subset is listed in the Known-flaky note below for the lane owners.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'pytest.ini'
      - '.github/workflows/scripts-tests.yml'
      # test_workflow_branch_pattern.py (#10145) pins the SHELL TEXT of these
      # two workflows, so editing them must run this suite. Without these two
      # entries the pin is blind to its own subject: #10416 changed the push in
      # catalog-cron.yml, no job ran, and the break only surfaced on the next
      # unrelated PR that happened to touch scripts/**.
      - '.github/workflows/catalog-cron.yml'
      - '.github/workflows/translation-sync.yml'
      # #6790 prover tree-lock: the offline lock-lifecycle tests + the two
      # source files they guard (see the pytest step for why only this one
      # agent_tests file is included, not the whole dir).
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/tests/test_bg_tree_lock.py'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/prover/tree_lock.py'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/prover/run_prover_bg.py'
      # #6790 prover forensic-guards: stdlib-only axiom-cheat + sorry-relocation
      # detection (prover/forensic_guards.py), loaded by file path so its tests
      # run hermetically without agent_framework (see pytest step).
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/prover/forensic_guards.py'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/tests/test_prover_forensic_guards.py'
      # #11349 native_decide ratchet rewire: scripts/lean/tests/test_proof_integrity_audit_wiring.py
      # pins the conway_lean proof-integrity-audit allow-list to the build-enumerated
      # footprint (61 names after #11368). The test lives under scripts/** so its only
      # trigger was an scripts/** push -- which means a PR adding a new native_decide
      # to conway_lean could pass un-rattled and the rouge would land on the first
      # next scripts/** pusher. Wire the lake path so the ratchet fires when its
      # subject moves; mirrored under pull_request: below.
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean/**.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean/lakefile.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean/lakefile.toml'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean/lean-toolchain'
      # #1028 melody verdict: scripts/tests/test_syllable_pitch_verdict.py pins
      # classify_melody, which lives in the prosody_lab module below. Same shape
      # as the conway entry just above -- a test under scripts/** whose SUBJECT
      # is outside it only ever fired on an unrelated scripts/** push, so a
      # change to the verdict policy could land un-rattled. Mirrored under
      # pull_request: below.
      - 'MyIA.AI.Notebooks/GenAI/Audio/04-Applications/v4/prosody_lab/syllable_pitch.py'
      # #11835 no-op guard: scripts/tests/test_pr_gate_rerun_noop_guard.py pins
      # the job-level if: of pr-gate-rerun.yml. Without this entry a PR touching
      # ONLY the workflow fires no scripts-tests run -- the guard is blind to
      # its own subject (#10416 pattern, flagged A2 by Hermes on #11845).
      # Mirrored under pull_request: below.
      - '.github/workflows/pr-gate-rerun.yml'
      # #12704 self-hosted policy: fork PR tokens cannot publish the fast-lane
      # check-runs. Keep one ordinary CI surface that executes the scanner for
      # every workflow change, including workflow-only PRs from forks.
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'pytest.ini'
      - '.github/workflows/scripts-tests.yml'
      # See the push: block above for why these two are pinned here.
      - '.github/workflows/catalog-cron.yml'
      - '.github/workflows/translation-sync.yml'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/tests/test_bg_tree_lock.py'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/prover/tree_lock.py'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/prover/run_prover_bg.py'
      # #6790 prover forensic-guards (mirror of the push paths above).
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/prover/forensic_guards.py'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/tests/test_prover_forensic_guards.py'
      # #11349 native_decide ratchet rewire (mirror of the push paths above).
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean/**.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean/lakefile.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean/lakefile.toml'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean/lean-toolchain'
      # #1028 melody verdict (mirror of the push path above).
      - 'MyIA.AI.Notebooks/GenAI/Audio/04-Applications/v4/prosody_lab/syllable_pitch.py'
      # #11835 no-op guard (mirror of the push path above).
      - '.github/workflows/pr-gate-rerun.yml'
      # Mirror the push path above so fork workflow-only PRs execute the policy.
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scripts-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scripts-tests:
    name: Scripts Tests (CPU)
    # Route vers la jambe Linux auto-hebergee (#13378 tranche 5, decision ai-01
    # 2026-09-02) : garde Python pur, sans secret. La garde same-repo ci-dessous
    # saute les PRs de fork (pr_gate.py compte `skipped` comme OK) : aucun code de
    # fork n'atteint le runner. Retour arriere = revert de la PR.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required by test_twin_registry_integrity.py::
          # test_audit_shas_exist_in_file_history (#9399 volet b), which asserts
          # each attested audit sha really existed as a file blob. A shallow
          # clone exposes only the HEAD blob, so legitimate drifts (e.g. the
          # ai-01 Sudoku-08/14-BDD/9 reserve) whose attested sha predates HEAD
          # would false-fail. Consistent with the other git-aware gates
          # (catalog-cron/catalog-drift/cell-order-gate/exercise-leak-ci).
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Core test deps imported across scripts/ + notebook_tools/ suites.
          # Mirror the ML job's scientific stack where suites reuse it, and add
          # the lightweight deps the scripts/ suites import that the ML job omits
          # (requests, bcrypt, jupyter_client — see #2871 root-cause list).
          pip install numpy pandas scipy pyarrow pytest
          pip install requests bcrypt jupyter_client
          pip install pyyaml tomli
          # python-dotenv: scripts/whisper_int8_comparison.py (and several
          # genai-stack modules) import `dotenv` at top level.
          pip install python-dotenv
          # matplotlib: MyIA.AI.Notebooks/GameTheory/trust_simulation/visualization.py
          # imports it at module top level. Without it, pytest bails on
          # collection errors for test_trust_simulation.py and skips the
          # entire suite, masking every other test result. See #4937.
          pip install matplotlib
          # papermill + nbformat: genai-stack/commands/notebooks.py imports
          # papermill at top level, so test_genai_notebooks.py needs it at
          # collection time. Both are declared deps of genai-stack
          # (scripts/genai-stack/requirements.txt). Lets us re-include the
          # genai test suites that were excluded as missing-dep (#2871 part 2).
          pip install papermill nbformat
          # nbconvert: scripts/notebook_tools/render_oversized_nbconvert.py +
          # scripts/tests/test_render_oversized_nbconvert.py (#10969). The
          # fail_non_notebook test asserts the real nbformat NotJSONError text,
          # so the env must have nbconvert installed (rule F, not a skipif).
          pip install nbconvert
          # torch (CPU) is needed at collection time by the Sudoku/RRN test
          # modules under scripts/tests/ (they `import torch` at top level and
          # skip themselves at runtime when CUDA is absent). Without it those
          # modules fail to import = collection errors. Same index as ml-tests.yml.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # arch (GARCH) for the scripts/tests/ml GARCH-baseline suite, which has
          # no other CI home: ml-tests.yml is scoped to ML-Training-Pipeline
          # (#2872), so without arch here those 9 tests are missing-dep failures.
          # Pulls statsmodels/patsy — still CPU-light.
          pip install arch

      - name: Run tests
        # Scope to the scripts/ + notebook_tools/ suites this job is named for.
        # The repo-wide pytest.ini testpaths also list GameTheory/tests,
        # QuantConnect/scripts/tests and DataScienceWithAgents/tests; those are
        # included below as they share the same lightweight dep profile. The
        # ML-Training-Pipeline suite is
        # owned by ml-tests.yml and intentionally excluded here (it duplicates
        # torch on its own job).
        #
        # The genai + wsl suites were previously excluded as missing-env
        # (#2871 part 2): they failed on ubuntu due to (a) missing papermill
        # dep at collection time and (b) two genuine test bugs now fixed —
        # test_genai_docker.py polluted sys.modules['config'] for sibling
        # tests, and wsl_papermill.win_to_wsl_path relied on Path.drive which
        # is empty under POSIX. Both are fixed; papermill/nbformat are now
        # installed above. The 7 suites run here green (354 tests, validated
        # under WSL ubuntu + CI deps). genai -> po-2023, wsl -> po-2025.
        #
        # #6790 tree-lock guard: only test_bg_tree_lock.py is included from
        # agent_tests/tests/, NOT the whole dir. That file loads tree_lock.py by
        # file path (stdlib-only) and importorskips the LLM stack for its 3
        # launcher-wiring tests, so on a bare runner it is hermetic: 14 pass,
        # 3 skip. Its sibling test_prover_guards.py imports prover.state/.tools,
        # which pull prover/__init__.py -> agent_framework at collection time and
        # would abort the whole pytest session with a collection error (masking
        # every other result) — the exact failure mode this workflow exists to
        # prevent. agent_tests owner: po-2026 (Lean lane).
        run: |
          pytest \
            scripts/tests \
            scripts/notebook_tools/tests \
            scripts/lean/tests \
            scripts/translation/tests \
            MyIA.AI.Notebooks/GameTheory/tests \
            MyIA.AI.Notebooks/QuantConnect/scripts/tests \
            MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/tests/test_bg_tree_lock.py \
            MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/tests/test_prover_forensic_guards.py \
            MyIA.AI.Notebooks/ML/DataScienceWithAgents/01-PythonForDataScience/tests \
            scripts/secrets/tests \
            --tb=short -q
      # CI-EXCLUDED — testpaths pytest.ini non couverts par ce run, garde #10903.
      # Retirer la ligne du répertoire câblé (et l'ajouter au run ci-dessus) quand
      # l'herméticité est démontrée sur runner nu. Chaque raison est vérifiée
      # firsthand (2026-08-14, po-2024) :
      # CI-EXCLUDED: scripts/audit/tests — 4 échecs env-dépendants (test_regen_img1_dalle3.py, clé DALLE-3/OpenAI requise), 405 passent
      # CI-EXCLUDED: scripts/quantconnect/tests — deps yfinance + fichiers de données externes, non hermétique sur runner nu
      # scripts/secrets/tests re-câblé (famille 4 de #14615, 2026-09-04) :
      # dir entier dans le run ci-dessus. Les 2 modules gitleaks
      # (test_gitleaks_qwen_rule.py, test_gitleaks_10143_classes.py) y sont
      # collectés mais SKIP sans binaire gitleaks (docstring : skip si absent,
      # gate autoritaire = secret-scan.yml qui les exécute avec le binaire).
      # CI-EXCLUDED: GradeBookApp — deps openpyxl/rapidfuzz/unidecode non installées dans ce job ; PII grading hors CI publique

      - name: Secrets tests collection floor (148)
        if: always()
        env:
          SECRETS_TESTS_FLOOR: 148
        run: |
          N=$(python -m pytest scripts/secrets/tests --collect-only -q 2>/dev/null | tail -1 | grep -oE '[0-9]+ tests collected' | grep -oE '^[0-9]+')
          if [ -z "$N" ] || [ "$N" -eq 0 ]; then echo "::error::--collect-only returned no tests — the collection crashed (distinct from a coverage drop)."; exit 1; fi
          if [ "$N" -lt "$SECRETS_TESTS_FLOOR" ]; then echo "::error::Coverage regression: $N tests collected, floor=$SECRETS_TESTS_FLOOR."; exit 1; fi
          echo "OK: $N tests collected (floor=$SECRETS_TESTS_FLOOR)."
