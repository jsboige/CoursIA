name: Linux Self-Hosted Tests

# Mission #13378 (dispatch ai-01 2026-08-31) : runner Linux conteneurise sur
# po-2024. Dispatch-only : ZERO declencheur pull_request/push, donc zero
# fan-out CI -- pattern #13097 (windows-self-hosted-tests.yml).
#
# PRECONDITION -- A LIRE AVANT TOUT DISPATCH (mesure du 2026-09-01) :
# AUCUN runner ne porte aujourd'hui le label `coursia-linux`. Le registre du
# depot contient un seul runner, `myia-po-2024-fast-guards`, qui est WINDOWS.
# Dispatcher ce workflow maintenant met le job en file INDEFINIMENT -- pas
# d'echec, pas de rouge, une attente muette qu'aucun timeout ne coupe
# (timeout-minutes ne court qu'a partir du DEMARRAGE du job).
#
# Pour l'activer, sur po-2024 :
#   docker build -t coursia-linux-runner:2.336.0 scripts/ci/docker/linux-runner/
#   scripts/ci/docker/linux-runner/supervise.sh start 2
# Verifier AVANT de dispatcher :
#   gh api repos/jsboige/CoursIA/actions/runners #     --jq '.runners[]|select([.labels[].name]|index("coursia-linux"))|.name'
# Sortie vide = ne pas dispatcher.
#
# Cycle de vie : le conteneur porte un runner --ephemeral (AU PLUS UN JOB
# puis desenregistrement natif). Un dispatch = un job = un conteneur. Le
# superviseur relance un conteneur des que le precedent meurt : N boucles
# = N jobs concurrents, ce qui est ce qui leve le plafond de 1 nomme par le
# census #13378 comme LE facteur limitant.
#
# Sous-semble pilote volontairement etroit : le guard de policy des runners
# self-hosted (python pur, aucune ecriture disque, non critique). Les 93
# jobs ubuntu-latest du census #13378 restent sur GitHub-hosted tant que la
# mesure d'empreinte n'a pas porte l'elargissement (decision coordinateur).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-policy-tests:
    name: Runner policy tests (Linux container)
    # Garde fork EXPLICITE au niveau job (defense-in-depth, pattern maison).
    # Le declencheur actuel est workflow_dispatch seul -- un fork ne peut pas
    # l'emettre -- mais "pas de trigger" est un etat qu'une ligne de YAML
    # defait : si un declencheur pull_request (ou pull_request_target) est
    # ajoute un jour, un evenement fork est refuse ICI.
    #
    # Forme universelle (#13874) : la garde ne s'appuie plus sur la valeur
    # textuelle de github.event_name (qui distingue pull_request de
    # pull_request_target -- le second est le vecteur d'exfiltration classique
    # sur runner self-hosted avec token en ecriture + acces secrets). Elle
    # teste la presence du champ pull_request (null hors PR) + l'identite du
    # repo source en un seul predicat, couvrant les deux variantes de
    # declencheur d'un coup. Un fork (head.repo.full_name != repository) est
    # refuse que le trigger s'appelle pull_request ou pull_request_target.
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    timeout-minutes: 10
    concurrency:
      group: linux-self-hosted-policy
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install pytest pyyaml

      # Preuve d'identite : ce job doit s'executer DANS le conteneur Linux
      # (RUNNER_OS=Linux, RUNNER_ARCH=X64), pas sur un runner Windows ou
      # GitHub-hosted -- sinon la demonstration #13378 est nulle.
      - name: Identity proof
        run: |
          echo "runner.name=$RUNNER_NAME"
          echo "runner.os=$RUNNER_OS"
          echo "runner.arch=$RUNNER_ARCH"
          echo "runner.temp=$RUNNER_TEMP"
          python --version
          [ "$RUNNER_OS" = "Linux" ] || { echo "FAIL: RUNNER_OS != Linux"; exit 1; }

      # Guard de policy self-hosted : python pur, non critique, aucune
      # ecriture hors workspace conteneurise.
      - name: Run runner-policy tests
        run: python -m pytest scripts/tests/test_check_self_hosted_runner_policy.py -v
