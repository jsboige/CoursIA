name: Dry-run sizing control (ai-01 reference copies)

# Acceptance A de #15228 (les trois reserves NanoClaw du 2026-09-08 sur #15214).
#
# La suite de controle du dry-run de dimensionnement existe, elle est serieuse
# -- 674 lignes, ~70 assertions, et son sujet est le MODE DE DEFAILLANCE (la
# premiere version du script rendait « passe » quand le budget etait illisible)
# -- mais elle n'etait appelee par AUCUN workflow. Un test que personne ne lance
# est un test qui cessera de passer sans que personne ne l'apprenne : il ne
# reste de lui que la confiance qu'il a value. Le cablage est presque gratuit,
# la suite s'injecte deja par variables d'environnement et ne demande aucun
# service.
#
# Aucune machine reelle n'est touchee par la suite : pas de systemd (un faux
# `systemctl` est fabrique sous un TMPDIR efface a la sortie), pas de `/etc`,
# pas de redemarrage, pas de docker. D'ou un runner GitHub-hosted : le job ne
# reclame ni slot auto-heberge (ressource rare, cf la famine de #12817) ni
# secret, et n'entre donc pas dans `SELF_HOSTED_WORKFLOW_ALLOWLIST`.
#
# DEUX ECHECS DISTINCTS, jamais confondus (doctrine #8819 « non mesure n'est
# pas verifie ») :
#
#   rc=1  une assertion est tombee          -> la configuration REGRESSE
#   rc=2  le harnais a ABANDONNE            -> la suite n'a RIEN mesure
#
# Le second n'est pas un succes deguise : il est rouge lui aussi, avec un
# message qui dit qu'on ne sait rien -- surtout pas que tout va bien. C'est
# exactement le piege que ce harnais a ete ecrit pour fermer (un budget
# illisible rendait « passe »), et le cabler en confondant les deux le
# rouvrirait au niveau du workflow.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/ci/docker/linux-runner/persist/ai-01/**'
      # Self-cover (#8822) : un workflow filtre par chemins doit lister son
      # propre fichier en premier. Sans cela, la PR qui retire le dernier
      # chemin filtre ne le re-declenche plus -- le job ne peut alors plus ni
      # re-mesurer ni retirer ce qu'il a pose, et son verdict survit a sa cause.
      - '.github/workflows/dryrun-sizing-control.yml'
  workflow_dispatch:
    inputs:
      repeat:
        description: "Nombre de passes consecutives de la suite (enquete de flakiness, #23051 point 3). Chaque passe garde sa sortie dans un groupe de log distinct."
        required: false
        default: "1"

permissions:
  contents: read

concurrency:
  group: dryrun-sizing-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dryrun-sizing-control:
    name: "Dry-run sizing control (ai-01 reference copies)"
    # 2026-10-28 (#23053 vague 3, famille (a) gardes/advisories) : forme
    # hybride de debordement -- la suite reste du bash pur, sans secret ni
    # acces machine, donc elle est routable sur la jambe Linux locale sans
    # perdre la garde anti-fork (elle vit DANS l'expression `runs-on`).
    # PR meme-depot ET vars.CI_OVERFLOW_LOCAL == 'true' -> local ; tout le
    # reste (variable absente ou fausse, forks, dispatch) -> ubuntu-latest.
    # Bascule : `gh variable set CI_OVERFLOW_LOCAL --body true|false
    # --repo jsboige/CoursIA`. Retour arriere = variable a `false` ou
    # supprimee, sans toucher ce fichier. Le workflow entre dans
    # SELF_HOSTED_WORKFLOW_ALLOWLIST dans la meme PR.
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository && vars.CI_OVERFLOW_LOCAL == 'true') && fromJSON('["self-hosted","coursia-ephemeral","coursia-linux"]') || 'ubuntu-latest' }}
    # Borne de duree (#23053) : 9 s mesures sur le dernier succes (run
    # 40635378933, job `dryrun-sizing-control`) ; la borne large de 20 min
    # couvre la copie des references et un clone froid, sans laisser un slot
    # se figer des heures.
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          # Cone-mode false (#23053) : le runner local `coursia-linux` embarque
          # git 2.43.0, dont le mode par defaut (cone) refuse un chemin de
          # fichier -- "is not a directory", rc=128. Mesure : WSL local,
          # git 2.43.0 -- cone + fichier rc=128, --no-cone + fichier rc=0.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/dryrun-sizing-control.yml
            scripts/ci/docker/linux-runner/persist/ai-01/

      - name: Syntaxe des deux scripts
        run: |
          set -euo pipefail
          bash -n scripts/ci/docker/linux-runner/persist/ai-01/dryrun-sizing-control.sh
          bash -n scripts/ci/docker/linux-runner/persist/ai-01/test-dryrun-sizing-control.sh
          echo "Les deux scripts parsent."

      - name: Suite de controle (fixtures, aucune machine reelle)
        env:
          REPEAT_PASSES: ${{ inputs.repeat || 1 }}
        run: |
          # `set -e` est volontairement ABSENT : il faut lire le code de retour
          # de chaque passe pour distinguer une assertion cassee d'un abandon
          # du harnais. `pipefail` n'a pas d'objet ici (aucun pipe).
          set -uo pipefail

          SUITE=scripts/ci/docker/linux-runner/persist/ai-01/test-dryrun-sizing-control.sh

          # TMPDIR POSIX explicite (chaque passe). La suite sonde elle-meme que
          # ses faux gagnent sur PATH et ABANDONNE (rc=2) sinon -- avec un
          # TMPDIR en forme Windows, `command -v systemctl` resout le VRAI
          # binaire et la suite appellerait le vrai `chown`. On ne devine pas
          # la forme de TMPDIR (un proxy) : la suite mesure l'effet, et on lui
          # donne le repertoire canonique.

          # Enquete de flakiness (#23051 point 3) : la suite a rendu un echec
          # non localise 1 fois sur 6 sur ai-01. Un dispatch peut desormais
          # rejouer N passes consecutives (workflow_dispatch, input `repeat`) ;
          # chaque passe garde sa sortie dans son groupe de log, et le job est
          # rouge si AU MOINS UNE passe echoue -- N passes dont une seule rouge
          # restent un echec, jamais une moyenne.
          # L input transite par env, jamais par interpolation directe dans le
          # run : un dispatcher ne doit pas pouvoir injecter du shell.
          N="${REPEAT_PASSES:-1}"
          case "$N" in ''|*[!0-9]*|0) N=1 ;; esac
          FAILS=0

          # stdin epingle par passe, en plus de la fermeture que la suite
          # fait elle-meme : le runner maintient un stdin ouvert, et le
          # cablage de l appelant ne doit jamais etre une entree du harnais
          # (cf #23051 point 3 -- la suite sautait des cas quand son stdin
          # heritait d un canal ouvert).
          i=0
          while [ "$i" -lt "$N" ]; do
            i=$((i + 1))
            echo "::group::Passe $i/$N"
            TMPDIR=/tmp bash "$SUITE" </dev/null
            rc=$?
            echo "::endgroup::"
            case "$rc" in
              0)
                echo "::notice::Passe $i/$N verte -- les refus attendus et les succes attendus sont tous tenus."
                ;;
              1)
                echo "::error::Passe $i/$N : ASSERTION CASSEE. Le dry-run de dimensionnement ne tient plus son contrat : voir le detail 'KO' ci-dessus. La suite A mesure, et elle a trouve une regression."
                FAILS=$((FAILS + 1))
                ;;
              2)
                echo "::error::Passe $i/$N : ABANDON DU HARNAIS. L'isolation a echoue (faux binaires non prioritaires sur PATH, ou script sous test introuvable) : la suite n'a RIEN mesure. Ni conformite ni non-conformite ne sont etablies -- ne pas lire ce rouge comme une regression de la configuration."
                FAILS=$((FAILS + 1))
                ;;
              *)
                echo "::error::Passe $i/$N : code de retour inattendu ($rc) -- verdict indetermine, ne pas conclure."
                FAILS=$((FAILS + 1))
                ;;
            esac
          done

          if [ "$FAILS" -ne 0 ]; then
            echo "::error::$FAILS passe(s) en echec sur $N."
            exit 1
          fi
