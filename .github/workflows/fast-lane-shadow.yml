name: Fast lane (ombre)

# VOIE RAPIDE, phase pilote en OMBRE (#11835).
#
# Constat qui motive ce workflow, mesure le 2026-08-19 sur les runs du jour,
# en temps d'etape a l'interieur des jobs (donc hors attente de file) :
#
#   Cell-order gate        checkout 225,5 s   analyse  ~1 s   99,1 %
#   Notebook Navlink       checkout 172,0 s   analyse   3 s   98,0 %
#   prose-counts-guard     checkout 122,0 s   analyse   1 s   98,4 %
#   banner-guard           checkout 121,5 s   analyse   2 s   97,2 %
#   perimeter-review       checkout  64,0 s   analyse   2 s   94,8 %
#   solution-leak          checkout  63,5 s   analyse 5,5 s   89,4 %
#
# Le depot pese 2,1 Go et 46 workflows le clonent avec `fetch-depth: 0`. Un
# push sur une branche notebook declenche ~46 workflows pour ~235 min de temps
# de runner, contre 17 runners : le `PR gate` (borne 12 min) expire alors sur
# des PR SAINES, et c'est ce faux rouge -- pas la diligence des lanes -- qui
# fait vieillir les PR.
#
# Ce workflow paie UN checkout et enchaine les analyses, en emettant un
# check-run nomme par garde (API Checks) : la granularite visible sur la PR est
# preservee, seule l'infrastructure est mutualisee.
#
# POURQUOI « ombre » : les check-runs sont prefixes `fast-lane (ombre): `, donc
# ils cohabitent avec les cinq workflows d'origine sans leur voler leur nom ni
# leur role, et la protection de branche n'est pas touchee. On compare les
# verdicts sur des PR reelles ; le basculement (retrait des workflows
# unitaires + reprise des noms canoniques) est un SECOND geste, separe et
# reversible. Un lot temoin entierement vert serait indiscernable d'un moteur
# debranche : la comparaison doit inclure au moins une PR rouge par garde.
#
# TRANCHE 1 D'ABSORPTION (#12567) : depuis le 2026-08-26 la lane tourne en
# mode MIXTE -- les gardes `absorbed` du registre (TRANCHE1) rendent leur
# verdict sous leur NOM CANONIQUE avec une conclusion REELLE (un bloquant
# en echec rougit la PR), et leurs workflows dedis ne se declenchent plus
# sur `pull_request`. Les gardes du pilote restent en ombre prefixee et
# neutralisee jusqu'a la conclusion de la comparaison.
#
# TRANCHE 2 (#12567) : trois gardes de plus (output-failure ratchet,
# fabricated-text, degenerate-figure), memes regles -- nom canonique,
# conclusion reelle, workflow d'origine retire de `pull_request`. Le
# compteur du job suit le registre : 16 gardes, toujours 1 checkout.
#
# TRANCHE 3 (#13097, remede A -- famine CI) : regression-guard absorbe.
# Premier garde de la vague « metadata guards » sans filtre paths: qui
# pesait ~50 % du volume pull_request ; le seul dont le verdict est une
# invocation python proche sans ecriture PR (les 8 autres exigent des
# write-perms lane ou une extension moteur -- voir registre TRANCHE3).
# TRANCHE 4 (#12396) : le noyau du grain -- le gate MARKDOWN
# md-content-loss (iter par notebook change + --base {base_ref}, son
# anti-auto-desarmement AGREGE porte par le flag `fail_on_all_warn`) -- et
# les 4 gates SVG de la serie #6959/#6971/#7008 (broken-geometry,
# decimal-comma, empty-display, offscreen-flat) avec la meme forme que
# degenerate-figure (rc=1 defaut / rc=2 illisible). La nouveaute de cette
# tranche : le CONTROLE POSITIF d'identite byte-a-byte
# (`check_absorbed_check_run_identity.py`, step ci-dessous) -- absent des
# tranches 1/2/3 -- qui cimente chaque `guard.name` absorbe au nom de
# check-run que rendait son workflow source (contrainte #12175 : un rename
# casse la protection de branche).
#
# Compteur : PILOT 10 + TRANCHE1 3 + TRANCHE2 3 + TRANCHE3 1 + TRANCHE4 5 = 22 gardes.
# NB collision #13203 : ce depot en parallele ouvre TRANCHE3 (1 garde) sur
# les memes fichiers -- le merge des deux ajuste le compteur a 22.

# DORMANT depuis #13384 : le job fast-lane est absorbe (checkout full +
# setup-python + dependances + `fast_lane.py --shadow` + controle d'identite,
# portes verbatim) par always-on-guards.yml -- un seul workflow, un seul
# checkout, un seul slot de runner par PR (37 % de la file CI etait les cinq
# gardes always-on pour ~3 min de travail reel, mesure #13384). Le job reste
# ICI en copie de reference pour la tracabilite ET pour le controle positif
# d'identite byte-a-byte (check_absorbed_check_run_identity.py lit ce
# fichier : le nom du job doit rester inchanger). NE PAS reinscrire
# pull_request ici sans retirer l'organe fastlane d'always-on-guards.

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write        # emettre un check-run par garde

concurrency:
  group: fast-lane-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-lane:
    name: "Fast lane (ombre) -- 22 gardes, 1 checkout"
    # Route vers la jambe Linux auto-hebergee (#13378 tranche 5, decision ai-01
    # 2026-09-02) : garde Python pur, sans secret. La garde same-repo ci-dessous
    # saute les PRs de fork (pr_gate.py compte `skipped` comme OK) : aucun code de
    # fork n'atteint le runner. Retour arriere = revert de la PR.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20

    steps:
      # `fetch-depth: 0` est requis ici pour la meme raison que dans les
      # workflows d'origine (la base doit etre joignable pour les deltas) --
      # mais il est paye UNE fois pour les neuf gardes au lieu de neuf fois.
      # Le resserrer est un sujet distinct, suivi dans #11835.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Dependances requises par les detecteurs (pyyaml pour le scan de
      # closure markdown-rendering, Pillow pour scan_md_hierarchy). Bare
      # setup-python ne fournit pas pyyaml ; sans install, le scan de
      # closure se traduit en ImportError et la cause est reportee a tort
      # comme un _quarto.yml invalide (issue #11850).
      - name: "Installer dependances detecteurs (pyyaml, Pillow)"
        run: pip install --quiet pyyaml Pillow

      - name: "Gardes de la voie rapide (verdicts en check-runs nommes)"
        env:
          GH_TOKEN: ${{ github.token }}
          FAST_LANE_BASE: origin/${{ github.base_ref }}
          FAST_LANE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FAST_LANE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FAST_LANE_PR: ${{ github.event.pull_request.number }}
        run: |
          git fetch origin "${{ github.base_ref }}" -q
          python scripts/ci/fast_lane.py --shadow

      # #12396 : controle POSITIF d'identite byte-a-byte. Sans lui, un renom
      # du registre (guard.name != nom du job rendu par le workflow source)
      # passerait : le check-run est emis sous le nouveau nom, mais la
      # protection de branche requiert l'ANCien nom -- ni satisfaite ni
      # rougie, echec silencieux de la branche (incident #12175). Ce step
      # rougit la lane si un nom absorbe diverge de sa source. `if: always()`
      # : diagnostique meme quand un verdict de garde a deja rougi le job.
      - name: "Controle positif : identite byte-a-byte des gardes absorbes"
        if: always()
        run: python scripts/ci/check_absorbed_check_run_identity.py --check
