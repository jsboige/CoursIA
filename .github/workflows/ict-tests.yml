name: ICT-Series Tests

# Organe manquant (#9387) : aucun workflow ne surveillait les tests de
# ICT-Series/. Ce workflow declenche sur toute modif sous ICT-Series/** et
# lance les DEUX suites depuis leur rootdir correct (piege d'import #9387) :
#   - tests/      -> rootdir = ICT-Series/  (pyproject.toml)
#   - ict/tests/  -> rootdir = ict/tests/   (pytest.ini, mode prepend)
#
# DEUX conventions de compte, ne pas confondre (post-#9478) :
#   - suite-name (matrix) compte les STRATES (classes/modules de test) :
#       tests/ = 55 strates (34 originales + 21 edge-cases spectral/bistable/
#       sensitivity consolides depuis ict/tests/, #9478).
#       ict/tests/ = 42 strates package.
#   - test-floor compte la COLLECTION parametree (items developpes par
#     @pytest.mark.parametrize) : tests/ = 1046 items, ict/tests/ = 686 items.
#     55 != 1046 PAR CONSTRUCTION (une strate se developpe en N items parametres) :
#     NE PAS "harmoniser" le floor sur le compte de strates, ni inversement. Le
#     floor garde la collection (1046/686), le label garde les strates (55/42).
#
# Provenance : a l'intro du workflow (59ac5fc10) le header reclamait 34/119
# tests, mais la CI a TOUJOURS collecte davantage (run d'origine 30896333149) :
# le 34 etait faux des l'inception. Les floors precedents (746/42, ai-01 @
# dbfbf73ab) ont DERIVE en silence -- la collecte croissait sans que rien ne
# le signale (746 -> 1046 / 42 -> 670, #15471). Les floors actuels (1046/670)
# sont mesures firsthand sur origin/main@5302d974aa (po-2023, venv Python 3.9
# + pyphi 1.2.0 + numpy 1.26.4, deux collectes consecutives identiques) et
# confirmes par la CI au run 34307798875 (main@9433e9a09d : 1046/670). Ils
# sont enforce par la collection floor-guard ci-dessous, pas seulement par ce
# commentaire -- et depuis #15471 le guard emet aussi un ::warning quand la
# collecte DEPASSE le floor (drift ascendant = floor a remonter dans la PR qui
# l'introduit). Quand la collection change, ajuster matrix.test-floor dans la
# meme PR.
# Imposer un troisieme rootdir depuis la racine reproduirait le ModuleNotFoundError
# documente dans #9387 (acceptance : une panne d'infra doit se distinguer d'un finding).
#
# Python 3.9 requis : pyphi==1.2.0 (pin pyproject.toml) exige collections.Iterable
# (retire en 3.10) + NumPy < 2.0 (compat pyemd). Cf. memoire pyphi-1-2-0-broken-python313.

on:
  push:
    branches: [main]
    paths:
      - 'MyIA.AI.Notebooks/IIT/ICT-Series/**'
      - '.github/workflows/ict-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'MyIA.AI.Notebooks/IIT/ICT-Series/**'
      - '.github/workflows/ict-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ict-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ict-tests:
    name: ICT ${{ matrix.suite-name }}
    # Routage #14283 tranche 3 (decision ai-01 2026-09-02) : jambe Linux
    # auto-hebergee. Le `if:` ci-dessous est la garde anti-fork exigee par
    # scripts/ci/check_self_hosted_runner_policy.py ; un `runs-on` STATIQUE la
    # rend auditable (une expression dynamique leve DYNAMIC_RUNS_ON).
    # Les PRs de fork sautent le job -- pr_gate.py compte `skipped` comme OK.
    # Retour arriere = remettre `runs-on: ubuntu-latest` + retrait de l'allowlist.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    # Plafond 15 -> 30 (#14598 Option A) -> 60 min. Le passage a 30 avait
    # DEPLACE le mur, pas mesure sa position : trois PRs de CONTENU sont mortes
    # dessus le 2026-09-12 (#15657, #15660, #15609 -- 30,5 / 30,4 / 30,4 min,
    # toutes `cancelled`, aucune `failure`).
    #
    # Le 60 est choisi CONTRE une mesure, pas contre une marge de confort.
    # Sonde hors plafond `ict-tests-profile.yml` (timeout 90 min, MEME commande,
    # MEME pool de runners), job 103508457858 / run 34676978324, runner
    # po-2024-linux-docker-2 :
    #
    #     1076 passed, 3 skipped, 7 warnings in 890.36s (0:14:50)
    #     step `Run` = 15,23 min mur
    #
    # Run tue (#15609, job 103531764037, runner po-2024-linux-docker-4), compare
    # sur le PREFIXE STRICTEMENT IDENTIQUE de la suite -- memes deux items
    # d'ancrage dans les deux logs (test_active_inference.py::
    # test_belief_pdf_normalized -> test_pregnance_animat.py::
    # test_behavioral_reversibility_verdict) :
    #
    #     prefixe sonde  =  847,22 s        prefixe tue = 1737,00 s
    #     ratio          =  2,050 x         <- variance RUNNER, pas derive de suite
    #
    # Extrapole au total : 30,42 min contre un budget de step de 28,94 min
    # (30 min de job - 1,06 min d'install). DEFICIT 89 s, soit 5,1 % : le
    # plafond de 30 etait pose SUR la frontiere, pas au-dessus. Le run tue
    # progressait normalement, a 58 % de la suite, une seconde avant la coupe.
    #
    # 60 min = 3,94 x le nominal mesure (15,23 min) et 1,97 x le pire cas
    # observe (30,42 min). Ce n'est PAS le correctif de fond -- la suite met
    # 89 % de son temps dans 25 items sur 6 modules, et `-n --dist loadscope`
    # ramene le chemin critique a ~4,25 min nominal (mesure #14598). C'est le
    # plafond qui cesse de tuer du contenu pendant que ce correctif se valide.
    #
    # A RELIRE quand la parallelisation atterrit : un plafond dimensionne pour
    # une suite sequentielle de 30 min n'a plus de sens sur une suite de 9 min.
    #
    # Ce qu'un `cancelled` ne dit pas : un kill par `timeout-minutes` rend
    # conclusion `cancelled`, JAMAIS `failure`. La couleur ne distingue pas
    # « le code est faux » de « la machine a ete coupee » -- ne pas imputer a
    # une lane un rouge produit par cette ligne.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # tests/ : 55 strates (34 originales + 21 edge-cases spectral/bistable/
          # sensitivity consolides depuis ict/tests/, #9478) -> 1046 items collectes
          # (cf. test-floor : le floor compte la COLLECTION parametree, PAS les
          # strates ; 55 != 1046 par construction ; compte mesure 2x sur
          # origin/main@5302d974aa, CI-confirme run 34307798875). Rootdir herite du
          # pyproject.toml d'ICT-Series/ (pip install -e . rend le package ict/
          # importable depuis n'importe quel cwd).
          # Floor 1046 -> 1071 : +25 items hooks torch du moteur causal
          # (#15479 tranche 2, tests/test_causal_hooks.py -- importorskip
          # FONCTION-niveau : comptes a la collecte meme sans torch, skips a
          # l'execution seulement, convention test_jlens_traces.py).
          # PARALLELISATION (#14598 levier b) -- cette jambe UNIQUEMENT.
          # Mesure de concentration sur la sonde `ict-tests-profile.yml`
          # (run 34676978324, --durations=25 --durations-min=0) : 25 items
          # = 792,56 s sur 890,36 s, soit 89,0 % du temps ; les 1054 autres
          # items = 97,80 s (11,0 %). Ces 25 items vivent dans 6 modules :
          #
          #   test_basin_landscape2d.py  255,08 s      test_collective_adoption.py  56,63 s
          #   test_basin_family.py       184,03 s      test_scale_free.py           19,76 s
          #   test_basin_asym.py         149,48 s      test_inhibited_invention.py   4,85 s
          #   test_bridge_testing.py     122,73 s
          #
          # POURQUOI `loadscope` ET PAS le defaut `load` : les 6 modules
          # declarent 7 fixtures `scope="module"`. Sous `--dist load` les
          # tests d'un module s'eparpillent sur les workers et la fixture est
          # RECONSTRUITE une fois par worker -- la parallelisation paierait
          # plus cher que le gain. `loadscope` garde un module entier sur un
          # worker : exactement une construction par module, comme aujourd'hui.
          #
          # POURQUOI 4 ET PAS `auto` : sous `loadscope` l'unite est le module
          # (ces 6 modules ne declarent AUCUNE classe de test -- verifie
          # firsthand), donc le chemin critique ne peut pas descendre sous le
          # plus gros module, 255,08 s. Repartition LPT des 7 modules sur 4
          # workers : [255] [184] [149+57] [123+20+5] -> makespan 255 s. A 8
          # workers le makespan reste 255 s : AU-DELA DE 4, ZERO GAIN. Et
          # `auto` lit les CPU de l'HOTE, pas la part du conteneur : plusieurs
          # conteneurs `coursia-ephemeral` co-locataires demanderaient chacun
          # N workers sur N coeurs partages -- c'est la sur-souscription qui
          # est le suspect n°1 de la variance 2,050 x mesuree. Un nombre fixe
          # et petit capte tout le gain sans ajouter au probleme.
          #
          # SURETE : `tests/` ne porte AUCUN `conftest.py` et AUCUNE fixture
          # `scope="session"` (verifie firsthand sur origin/main) -- les deux
          # choses qui rendent une suite hostile a xdist. Les 3 seuls sites
          # d'ecriture fichier passent par `tmp_path` ou
          # `tempfile.NamedTemporaryFile` (noms uniques par test). Ni socket,
          # ni port, ni `os.environ[...] =`, ni `chdir`.
          - suite-name: "tests/ (56)"
            test-cwd: MyIA.AI.Notebooks/IIT/ICT-Series
            test-args: tests
            test-parallel: "-n 4 --dist loadscope"
            test-floor: 1071
          # ict/tests/ : 42 strates package (85 - 43 consolides dans tests/,
          # #9478) -> 686 items collectes = 670 (mesure 2x sur
          # origin/main@5302d974aa, CI-confirme run 34307798875) + 16 tests
          # case 5 attention-schema #8182 (PR #15547, CI-mesure 686 au run
          # 34555990972 sur le head 7d737b4f8b -- le "strates == collection"
          # d'origine est tombe : le parametrize est devenu massif ici aussi).
          # Rootdir = ict/tests/ pour que le pytest.ini local
          # (mode prepend, neutralise --import-mode=importlib) s'applique -- sinon
          # test_reversibility_budget / test_time_arrow n'executent jamais
          # (sys.path.insert module-level ignore sous importlib).
          # Floor 670 -> 692 : +22 items coeur numpy du moteur causal
          # (#15479 tranche 1, ict/tests/test_causal_engine.py).
          # Floor 708 -> 728 : +20 items case 4 self-model minimal
          # #8182 (PR case 4, ict/tests/test_self_model_minimal.py --
          # 43e strate package, collection locale mesuree 728).
          #
          # SEQUENTIELLE, deliberement. Cette jambe n'a PAS ete mesuree par
          # la sonde, et elle n'est pas en danger : 6,85 min (run 34674233673)
          # et 8,35 min (run 34684756616) contre 15,1 / 25,4 min pour l'autre
          # jambe des memes runs. Elle porte en plus un `conftest.py` et un
          # `pytest.ini` propres (mode prepend, cf. #9387). Paralleliser ce
          # qu'on n'a pas mesure, sur la jambe qui ne coute rien, serait du
          # risque sans contrepartie -- `test-parallel` reste vide ici, et
          # c'est un choix, pas un oubli.
          - suite-name: "ict/tests/ (43 package)"
            test-cwd: MyIA.AI.Notebooks/IIT/ICT-Series/ict/tests
            test-args: .
            test-parallel: ""
            test-floor: 728

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: MyIA.AI.Notebooks/IIT/ICT-Series/pyproject.toml

      - name: Install ict package + deps dans venv per-job (pyphi 1.2.0, numpy<2, scipy, matplotlib)
        # Fix #14571a : le toolcache `/opt/hostedtoolcache/Python/3.9.x/x64` du runner
        # self-heberge `coursia-ephemeral` est PERSISTANT entre conteneurs (etiquette
        # declarative, pas mode --ephemeral). `pip install -e .` y ecrit des fichiers
        # .pth qu'un job ulterieur tente de desinstaller sur un cache devenu incoherent
        # -> Errno 2 en ~15 s sur des PRs sans rapport (#14559 a ete mal attribue
        # d'abord a un probleme de la PR). Le venv `$RUNNER_TEMP` est detruit a la fin
        # du job par GitHub Actions, donc zero contamination inter-jobs. Acceptance :
        # 2 runs consecutifs du MEME workflow sur le MEME runner, le 2e doit reussir.
        id: install
        working-directory: MyIA.AI.Notebooks/IIT/ICT-Series
        env:
          ICT_VENV: ${{ runner.temp }}/ict-venv
        run: |
          python -m venv "$ICT_VENV"
          # shellcheck disable=SC1091
          source "$ICT_VENV/bin/activate"
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-xdist
          # Garde-fou : verifier que `pip show` rapporte le site-packages du venv,
          # pas celui du toolcache partage. Un editable install fait pointer
          # `ict.__file__` vers le source-tree (par design), donc on interroge pip.
          if ! pip show ict-series 2>/dev/null | grep -q "$ICT_VENV"; then
            echo "::error title=ICT install hors venv::pip show ict-series ne pointe pas vers \$ICT_VENV -- l'install a ecrit dans le toolcache partage, ce qui reproduit le defaut #14571. Venv: $ICT_VENV"
            pip show ict-series || true
            exit 1
          fi
          echo "ICT install OK in venv (pip show ict-series -> $ICT_VENV)"
          python -c "import ict; print('ict import OK, __file__=', ict.__file__)"
          echo "$ICT_VENV/bin" >> "$GITHUB_PATH"

      # `matrix.test-parallel` est VIDE sur la jambe ict/tests/ : l'invocation
      # y reste mot pour mot celle d'avant. Le floor-guard ci-dessous, lui,
      # n'est JAMAIS parallelise -- il compte une collecte (`--co -q`), et le
      # resume canonique "N tests collected" qu'il parse n'a pas la meme forme
      # sous xdist. Il garde donc l'invocation sequentielle, qui reste
      # identique au step Run de la jambe non parallelisee (piege d'import
      # #9387 : `pytest`, jamais `python -m pytest`).
      - name: Run ${{ matrix.suite-name }}
        working-directory: ${{ matrix.test-cwd }}
        run: pytest ${{ matrix.test-args }} ${{ matrix.test-parallel }} --tb=short -v

      # Collection floor-guard (#9387). Acceptance de l'issue : "une panne
      # d'infra doit se distinguer d'un finding". pytest exit-code couvre deja
      # les cas brutaux (code 1 = test en echec, code 2 = collection error,
      # code 5 = zero test collecte). Ce guard couvre le cas restant, le plus
      # silencieux : une REGRESSION PARTIELLE ou N tests disparaissent sans
      # faire tomber la suite (un module entier passe en skip suite a un changement
      # d'env, un generateur parametrize produit moins de cas, un fichier deplace
      # hors du glob). pytest reste vert, mais 50 ou 200 tests ont evapore. La
      # gate reste verte alors que la couverture a chute. Ce step re-collecte
      # (--co -q, import-only, rapide) et echoue si le compte passe sous le
      # plancher. Floors = comptes observes sur origin/main@5302d974aa
      # (1046/670, deux collectes consecutives identiques, po-2023, #15471 ;
      # CI-confirme run 34307798875 -- suite deterministe). Quand des tests
      # sont retires INTENTIONNELLEMENT, abaisser matrix.test-floor dans la
      # meme PR -- le message d'erreur nomme la valeur a ajuster. Symetriquement,
      # un compte SUPERIEUR au floor emet un ::warning (drift ascendant, #15471)
      # -- remonter le floor dans la PR qui fait croitre la collection.
      #
      # Robustesse : on parse la ligne de resume CANONIQUE de pytest ("N tests
      # collected"), pas les nodeids via `grep -c '::'`. Le premier essai
      # comptait les nodeids : cassait sur ict/tests/ (mode prepend du pytest.ini
      # local -> format nodeid differents sur stdout -> grep trouvait 0) ET sous
      # le `set -e` par defaut de GHA (bash -eo pipefail) ou un grep a 0 match
      # (exit 1) + pipefail tuait le script avant l'echo de diagnostic. Le resume
      # "N tests collected" est le compte officiel de pytest, stable par
      # rootdir/mode. Les `|| true` neutralisent set -e sur l'extraction pour
      # qu'un compte 0 produise un message clair plutot qu'un exit muet.
      #
      # (a) INVOCATION IDENTIQUE au step Run ci-dessus : `pytest`, pas
      # `python -m pytest` (qui prefixe le CWD sur sys.path et reintroduit le
      # piege d'import #9387 que le pytest.ini local en mode prepend neutralise).
      # (b) ACCEPTANCE #9387 : "une panne d'infra doit se distinguer d'un
      # finding". Deux messages d'erreur DISTINCTS -- un echec de COLLECTE
      # (import casse / dep manquante -> panne d'infra) n'est pas une baisse de
      # COUVERTURE (tests disparus -> finding). Le premier arrete le guard avant
      # le plancher (on ne peut pas mesurer une couverture quand la collecte
      # meme plante) ; le second est le verdict de regression que ce guard existe
      # pour signer. Pas de 2>/dev/null : l'erreur de collecte reste VISIBLE.
      - name: Collection floor-guard (${{ matrix.suite-name }})
        if: always() && steps.install.outcome == 'success'
        working-directory: ${{ matrix.test-cwd }}
        env:
          ICT_TEST_FLOOR: ${{ matrix.test-floor }}
        run: |
          set -uo pipefail
          co_out=$(pytest ${{ matrix.test-args }} --co -q 2>&1) || {
            printf '%s\n' "$co_out"
            echo "::error title=ICT collection FAILED (${{ matrix.suite-name }})::pytest --co a echoue (exit != 0) -- PANNE D'INFRA (import casse, dep manquante, erreur de syntaxe), PAS une baisse de couverture. La collecte elle-meme a plante ; le plancher n'est pas evalue. Sortie complete de pytest ci-dessus dans le log."
            exit 1
          }
          collected=$(printf '%s\n' "$co_out" | grep -oE '[0-9]+ tests? collected' | tail -1 | grep -oE '[0-9]+' | head -1 || true)
          collected=${collected:-0}
          echo "Collected: $collected tests (floor: $ICT_TEST_FLOOR) for ${{ matrix.suite-name }}"
          if [ "$collected" -lt "$ICT_TEST_FLOOR" ]; then
            echo "::error title=ICT coverage regression (${{ matrix.suite-name }})::Collected $collected < floor $ICT_TEST_FLOOR -- FINDING : des tests ont disparu silencieusement (module en skip, parametrize casse, fichier hors-glob) alors que la collecte a reussi. Si cette baisse est INTENTIONNELLE (ex. consolidation de doublons), abaissez matrix.test-floor ($ICT_TEST_FLOOR) dans .github/workflows/ict-tests.yml a la meme PR que la suppression qui la justifie. Sinon, c'est une regression de couverture a corriger avant merge."
            exit 1
          fi
          # Ratchet a deux sens (#15471) : le drift ASCENDANT etait silencieux
          # (746 -> 1046 / 42 -> 670 passes inapercus) -- collected > floor
          # passait vert sans rien dire. Non bloquant (l'ajout de tests n'est
          # pas un finding), mais visible en annotation a chaque run tant que
          # le floor n'est pas rattrape.
          if [ "$collected" -gt "$ICT_TEST_FLOOR" ]; then
            echo "::warning title=ICT collection floor stale (${{ matrix.suite-name }})::Collected $collected > floor $ICT_TEST_FLOOR -- DRIFT ASCENDANT : la collecte a grandi depuis le dernier rattrapage (#15471). Remonter matrix.test-floor ($ICT_TEST_FLOOR -> $collected) dans la PR qui introduit ces tests, sinon une suppression future jusqu'a l'ancien floor resterait verte."
          fi
          echo "Floor OK ($collected >= $ICT_TEST_FLOOR)."
