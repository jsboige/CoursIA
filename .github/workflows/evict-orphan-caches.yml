name: Evict orphan Actions caches

# Sweep weekly des caches `codeql-overlay-base-database-…` dont le SHA
# n'est plus ancetre de main, OU dont le last_accessed est anterieur a
# 7 jours. Cf. issue #16088 -- le SHA-keying structurel de CodeQL default
# setup rend cross-run hit impossible ; l'eviction periodique libere le
# quota pour les caches reutilisables (lean, setup-python, etc.).
#
# Le script (scripts/ci/evict_orphan_caches.py) est dry-run par defaut ;
# ce workflow passe --apply apres le dry-run (mode JSON parse) pour
# confirmer qu'il y a effectivement du evictable avant DELETE. Le garde
# est dans le workflow (et non dans le script) : la sortie JSON est
# pipée dans `tee`, l'exit code du script est masque par le pipe, et
# c'est l'instruction `if [ "$EVICTABLE" = "0" ]` qui empeche la boucle
# DELETE. Donc "0 evictable -> on n'applique rien" est garanti par le
# test explicite du JSON, pas par le rc=1 du script.
#
# Concurrence : si une analyse CodeQL est en cours au moment du sweep,
# la cle de cache peut etre creee juste apres notre check et survive
# jusqu'au prochain sweep -- aucun risque de supprimer un cache vivant,
# le pattern SHA + runid + version-1 garantit qu'on n'attrape qu'un
# etat committe et termine.
#
# Defaut : tous les lundis 03:00 UTC (apres la nuit europeenne, avant
# l'activite US). Ajustable via workflow_dispatch.
#
# Reouverture de #16088 (2026-09-28) : le sweep passe AUSSI a chaque push sur
# main. Chaque merge ecrit ses overlays CodeQL (un par langue) ; mesure du
# 28/09, 33 overlays en ~5 h (3,96 Go) avec un quota a 10,14 / 10 Go, et le
# cache `.lake` de knot_lean evince moins de 10 h apres sa sauvegarde. Un
# passage hebdomadaire ne suit pas cette cadence, et le cron de ce depot
# est servi avec des heures de retard. Le script garde les 3 overlays les
# plus recents par famille (`--keep-latest`, defaut 3) et evince le reste.
#
# #18309 (2026-10-03) : le declenchement sur push passe AVANT l'ecriture
# qu'il doit borner -- chaque overlay est ecrit ~25-30 min apres son push,
# le temps de l'analyse CodeQL, donc une rafale de N merges laisse ses
# overlays en attente du push SUIVANT. Le sweep se declenche desormais
# aussi a la COMPLETION du workflow CodeQL (default setup, workflow
# dynamique "CodeQL" -- visible dans actions/workflows, id 301766627 ;
# `workflow_run` le voit par son nom, precedents in-repo :
# pr-gate-rerun, variation-tag-guard, etc.). Un evenement par SHA pousse
# (le default setup est un run unique multi-langages), file dans le groupe
# de concurrence existant. Le trigger push reste : il borne les orphelins
# non-CodeQL et le residu des analyses echouees.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CodeQL]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: "Evict caches whose last_accessed_at is older than this many hours."
        required: false
        default: "168"
        type: string

permissions:
  contents: read
  actions: write   # requis pour DELETE /repos/:o/:r/actions/caches/:id

concurrency:
  group: evict-orphan-caches
  cancel-in-progress: false

jobs:
  evict:
    name: Evict orphan CodeQL caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # #18309 -- mesure embarquee : le default setup etant un workflow
      # dynamique, l'emission d'evenements workflow_run par son nom ("CodeQL")
      # est la question ouverte de l'issue. Ce step journalise le contexte du
      # declencheur a CHAQUE passage : si les logs des prochains merges montrent
      # des lignes event_name=workflow_run, la piste 1 est confirmee ;
      # sinon (push/schedule seulement), le trigger est inert et la piste 2
      # (balayage differe dans le job de push) devient la voie suivante.
      - name: Log trigger context (measurement for #18309)
        run: |
          echo "event_name=${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "triggering_workflow=${{ github.event.workflow_run.name }}"
            echo "triggering_conclusion=${{ github.event.workflow_run.conclusion }}"
            echo "triggering_head_sha=${{ github.event.workflow_run.head_sha }}"
          fi
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git merge-base --is-ancestor a besoin du graphe
          sparse-checkout: |
            .github/workflows/evict-orphan-caches.yml
            scripts/ci/evict_orphan_caches.py
            tests/test_evict_orphan_caches.py

      - name: Dry-run first (log to Actions UI, no delete)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/ci/evict_orphan_caches.py \
            --max-age-hours "${{ inputs.max_age_hours || '168' }}" \
            --json > /tmp/evict_dry.json
          echo "DRY-RUN SUMMARY:"
          cat /tmp/evict_dry.json

      - name: Apply (DELETE) the listed evictable caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/ci/evict_orphan_caches.py \
            --max-age-hours "${{ inputs.max_age_hours || '168' }}" \
            --apply \
            --json | tee /tmp/evict_apply.json
          EVICTABLE=$(python -c "import json,sys; d=json.load(open('/tmp/evict_apply.json')); print(d['evictable'])")
          if [ "$EVICTABLE" = "0" ]; then
            echo "Aucun cache evictable : sweep termine sans DELETE."
            exit 0
          fi
          echo "Supprime $EVICTABLE caches orphelins."

      - name: Tests invariants (regex + classification)
        run: |
          python -m unittest tests.test_evict_orphan_caches -v
