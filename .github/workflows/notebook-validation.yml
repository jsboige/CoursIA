name: Notebook Validation

on:
  push:
    branches: [ main ]
    paths:
      - '**.ipynb'
  pull_request:
    branches: [ main ]
    paths:
      - '**.ipynb'
  # Manual revalidate after a merge batch (issue #13861):
  # `cancel-in-progress` cancels each PR's run on the next push, leaving the
  # final tree of a merge batch un-revalidated. `workflow_dispatch` is the
  # only way to revalidate the final tree without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notebook-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-notebooks:
    # Route vers la jambe Linux auto-hebergee (#13378 tranche 5, decision ai-01
    # 2026-09-02) : garde Python pur, sans secret. La garde same-repo ci-dessous
    # saute les PRs de fork (pr_gate.py compte `skipped` comme OK) : aucun code de
    # fork n'atteint le runner. Retour arriere = revert de la PR.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nbformat

    - name: Validate notebook structure
      run: |
        echo "Validating notebook JSON structure and nbformat..."
        ERRORS=0
        while IFS= read -r nb; do
          python -c "
        import json, sys
        import nbformat
        path = '$nb'
        try:
            with open(path, 'r', encoding='utf-8') as f:
                nb = nbformat.read(f, as_version=4)
            nbformat.validate(nb)
            print(f'OK {path}')
        except json.JSONDecodeError as e:
            print(f'FAIL {path}: invalid JSON - {e}')
            sys.exit(1)
        except nbformat.ValidationError as e:
            print(f'WARN {path}: nbformat warning - {e.message[:100]}')
        except Exception as e:
            print(f'FAIL {path}: {e}')
            sys.exit(1)
        " || ERRORS=$((ERRORS + 1))
        done < <(find . -name "*.ipynb" -not -path "*/\.*" -not -path "*/.ipynb_checkpoints/*")

        if [ $ERRORS -gt 0 ]; then
          echo "FAILED: $ERRORS notebook(s) with errors"
          exit 1
        fi
        echo "All notebooks validated successfully"

    - name: Check C.2 compliance (execution outputs)
      run: |
        python scripts/notebook_tools/check_c2_compliance.py --json > /tmp/c2_results.json || true
        VIOLATIONS=$(python -c "
        import json
        data = json.load(open('/tmp/c2_results.json'))
        nb_violations = [r for r in data if r['violations']]
        total_cells = sum(len(r['violations']) for r in nb_violations)
        print(f'{len(nb_violations)} notebooks, {total_cells} cells')
        ")
        echo "C.2 compliance: $VIOLATIONS with violations"
        # Report but don't block — C.2 is advisory on PRs, enforced on merge
        if echo "$VIOLATIONS" | grep -q "0 notebooks"; then
          echo "All notebooks C.2 compliant."
        else
          echo "::warning::$VIOLATIONS missing outputs (C.2)"
        fi
