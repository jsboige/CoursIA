name: Candidate-Delivered Advisory

# The missing ORGAN for issue #10466: the pool `gh issue list --state open` is
# saturated with work already delivered but not closed (delivery PRs write
# `See #N` even when they fully resolve the issue, so GitHub does not close it).
# The next worker re-picks it in duplicate -- measured firsthand on #9568
# (delivered 2026-08-06, then two post-delivery `[CLAIMED]` landed on it, one
# +4 days after the merge).
#
# This scheduled sweep labels OPEN non-EPIC issues that are referenced by a
# MERGED PR and have had NO comment activity since that merge. The pool scan
# then becomes a filter:
#     gh issue list --state open --search '-label:candidate-delivered'
#
# ADVISORY, never blocking (#10466 "Ce que l'organe ne doit pas faire"):
#   - The job ALWAYS exits 0. The actionable payload is the
#     `candidate-delivered` LABEL, NEVER the green conclusion.
#   - It does NOT auto-close. Closing requires reading the body + confronting
#     the verdict (G.9); the label signals, a human (or ai-01) decides.
#   - Only a PR whose state is MERGED counts.
#   - EPICs are excluded (title/label contains "epic"): a living EPIC
#     referenced by a merged PR stays open correctly. The checkbox heuristic
#     suggested in #10466 was measured firsthand and is UNRELIABLE (EPIC #1454
#     has no checkboxes; delivered leaf #10143 has 4) -- title/label is the
#     robust signal. See scripts/candidate_delivered.py.
#   - Issues referenced by an OPEN PR are excluded as "in_flight" (#11100): a
#     multi-phase rollout writes the CORRECT `See #N` partial-delivery syntax
#     and receives no post-merge comments by construction -- the merged+silent
#     heuristic alone mislabeled exactly that shape (measured on #10984:
#     open #10986 + six merged PRs). The sweep retracts the label when an
#     open PR appears, same as it does for post-merge activity.
#   - A MERGED PR counts only if it carries a DECLARED DELIVERY MARKER
#     (`See #N` / `Part of #N` / `Closes #N` / `Fixes #N` / `Refs #N`) for the
#     issue in its CURRENT body (#15060, measured 2026-09-10): the timeline's
#     cross-referenced event is posed on FIRST mention and never retracted
#     when the mention is later amended away, so "merged + silent" alone
#     mislabeled #15060 via a research-prep PR (#15200, contextual mention
#     "verified by dispatch #15060") and a stale cross-ref surviving a body
#     amend (#15149). See scripts/candidate_delivered.py.

on:
  schedule:
    # Daily, off-:00 minute (anti-stampede). 05:37 UTC.
    - cron: '37 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log only, apply no labels'
        required: false
        type: boolean
        default: true

permissions:
  issues: write
  contents: read

concurrency:
  group: candidate-delivered-advisory
  cancel-in-progress: false

jobs:
  sweep:
    name: "Label delivered-but-unclosed issues (advisory)"
    # Routage #14283 tranche 4 (ai-01 2026-09-02) : balayage cron pur-Python.
    # Declencheur `schedule` uniquement -- il ne tourne que sur la branche par
    # defaut, donc aucun code de fork ne peut l'atteindre et aucune garde
    # same-repo n'est requise (cf en-tete de check_self_hosted_runner_policy.py).
    # Retour arriere = remettre `runs-on: ubuntu-latest` + retrait de l'allowlist.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    steps:
      # 2026-10-27 (#22722) : la commande qui echoue est le `git checkout --force -B`
      # final d'actions/checkout, pas son clean/reset interne (run 40476005592 :
      # clean et reset passent, "HEAD is now at eb8ab03489", puis le checkout
      # refuse le carnet JEPA "not uptodate; will not remove from working tree").
      # Ce refus est la verification de retrait du retrecissement sparse
      # (apply_sparse_checkout, WARNING_SPARSE_NOT_UPTODATE_FILE, git 2.43.0) :
      # a blob inchange, elle compare le fichier au blob de l'index ; ni --force
      # ni le reset interne ne la contournent. Mitigation EMPIRIQUE, mecanisme
      # NON TRANCHE : sur git 2.43.0 tout etat residuel reproduit localement est
      # deja nettoye par le clean+reset du built-in (ce step rejoue la meme
      # commande, sans effet ajoute), et l'etat qui a survecu a son reset n'est
      # pas reproduit (mutation entre reset et checkout ? checkout interrompu ?).
      - name: Restore the warm work tree before the sparse checkout
        run: |
          set -u
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            dirty=$(git -C "$GITHUB_WORKSPACE" -c safe.directory="$GITHUB_WORKSPACE" status --porcelain 2>/dev/null | head -n 1)
            if ! git -C "$GITHUB_WORKSPACE" -c safe.directory="$GITHUB_WORKSPACE" reset --hard --quiet; then
              echo "::warning::[heal-worktree] reset --hard a echoue -- le retrecissement sparse peut refuser (#22722)"
            elif [ -n "$dirty" ]; then
              echo "::notice::[heal-worktree] arbre restaure -- le job precedent avait laisse un etat sale (${dirty}) -- le retrecissement sparse passe (#22722)"
            fi
          fi
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/candidate-delivered-advisory.yml
            scripts/candidate_delivered.py
            scripts/issue_containers.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run sweep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fenetre tournante (#10466, mesure du 2026-10-27) : le depot portait
          # 588 issues ouvertes alors que la lecture s'arretait a 200 -- les 388
          # du dessous n'etaient JAMAIS classifiees, donc jamais etiquetees, donc
          # re-servies indefiniment aux lanes (#20078 -> #20079, #19241 -> #22454,
          # #22715 -> #22719). Lire tout d'un coup ne tient pas dans le plafond
          # GITHUB_TOKEN (1000 appels/h, ~2 par issue) : on garde une fenetre
          # bornee et on fait tourner son point de depart a chaque run.
          # CE QUE LA ROTATION EST, dit sans l'embellir : un ECHANTILLONNAGE, pas
          # une couverture. Le depart avance de WINDOW modulo le nombre d'issues
          # ouvertes ; a N=590 et WINDOW=400 la suite revient sur elle-meme tous
          # les 59 runs, soit 59 jours au cron quotidien, et deux fenetres
          # consecutives se recouvrent. La queue est ATTEINTE (c'est le defaut
          # corrige), elle n'est pas balayee de facon exhaustive.
          WINDOW: '400'
        run: |
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          OFFSET=$(( ${{ github.run_number }} * WINDOW ))
          python scripts/candidate_delivered.py $DRY --sleep 2.0 \
            --limit "$WINDOW" --offset "$OFFSET"
