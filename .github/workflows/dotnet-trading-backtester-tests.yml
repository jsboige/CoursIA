name: Trading Backtester Tests

on:
  push:
    branches: [main]
    paths:
      - 'dotnet/MyIA.Trading.Backtester/**'
      - 'dotnet/MyIA.Trading.Backtester.Tests/**'
      - 'dotnet/MyIA.Trading.Converter/**'
      - 'dotnet/MyIA.AI.Shared/**'
      - '.github/workflows/dotnet-trading-backtester-tests.yml'
  pull_request:
    types: [opened, synchronize, edited, reopened]
    paths:
      - 'dotnet/MyIA.Trading.Backtester/**'
      - 'dotnet/MyIA.Trading.Backtester.Tests/**'
      - 'dotnet/MyIA.Trading.Converter/**'
      - 'dotnet/MyIA.AI.Shared/**'
      - '.github/workflows/dotnet-trading-backtester-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-backtester-tests-${{ github.ref }}-${{ github.event.action == 'edited' && github.event.changes.base == null && 'meta-edit' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backtester-tests:
    name: Backtester.Tests (windows-latest, 115 floor)
    if: (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      BACKTESTER_TESTS_FLOOR: 115

    steps:
      - uses: actions/checkout@v4

      # B2-T2 (#24320) : Backtester.Tests construit MyIA.Trading.Backtester ->
      # MyIA.AI.Shared, qui reference les binaires .deploy du sous-module Z3.Linq
      # (HintPath) -- le checkout nu ne les embarque pas (MSB3245 -> CS0246, run
      # 41534502040). Init ciblee du seul sous-module concerne ; sous Windows le
      # natif libz3.dll est copie au sortie par le csproj de Shared.
      - name: Init Z3.Linq submodule (.deploy binaries for the FOL bridge)
        shell: bash
        run: git submodule update --init MyIA.AI.Notebooks/SymbolicAI/SMT/Z3.Linq

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: true
          cache-dependency-path: |
            dotnet/MyIA.Trading.Backtester.Tests/MyIA.Trading.Backtester.Tests.csproj
            dotnet/MyIA.Trading.Backtester/MyIA.Trading.Backtester.csproj
            dotnet/MyIA.Trading.Converter/MyIA.Trading.Converter.csproj
            dotnet/MyIA.AI.Shared/MyIA.AI.Shared.csproj

      - name: Run Backtester.Tests
        run: dotnet test dotnet/MyIA.Trading.Backtester.Tests/MyIA.Trading.Backtester.Tests.csproj --nologo

      - name: Collection floor-guard
        if: always()
        shell: bash
        env:
          DOTNET_CLI_UI_LANGUAGE: en
        run: |
          PROJECT=dotnet/MyIA.Trading.Backtester.Tests/MyIA.Trading.Backtester.Tests.csproj
          LISTED=$(dotnet test "$PROJECT" --list-tests --nologo | grep -cE '^    [A-Za-z_]' || true)
          if [ "$LISTED" -eq 0 ]; then
            echo "::error::No tests collected from Backtester.Tests."
            exit 1
          fi
          if [ "$LISTED" -lt "$BACKTESTER_TESTS_FLOOR" ]; then
            echo "::error::Coverage regression: $LISTED tests listed; floor=$BACKTESTER_TESTS_FLOOR. Update the floor in the same PR if intentional."
            exit 1
          fi
          echo "OK: $LISTED tests listed (floor=$BACKTESTER_TESTS_FLOOR)."
