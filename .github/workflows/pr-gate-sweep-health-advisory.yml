name: PR gate sweep health advisory

# Form 1 of #11860 / #12588 -- the "last successful sweep run older than 1h"
# alert. Complement to the dashboard line (form 2, written by ai-01 each
# /coordinate cycle), which is the floor. See #12588 for the full framing:
# #12547 removed the event-driven `workflow_run` path of pr-gate-rerun.yml, so
# pr-gate-stale-sweep.yml is now the ONLY mechanism that re-aggregates a stale
# `PR gate` verdict. If that sweep's scheduler stops -- saturated runners,
# accidental disable, plan expiry on a repo inert 60 days -- no rescue remains
# and nothing says so. This observer exists to say so.
#
# Why a DEDICATED schedule and not a job inside pr-gate-stale-sweep.yml: an
# observer sitting inside the workflow it watches dies with it. The whole
# point is to detect "the sweep's cron stopped", so this workflow keeps its
# own cron, offset from the sweep's 7,27,47 so the two never collide. The
# offset does NOT remove form 1's known limit -- both still share
# runner-saturation -- which is exactly why #12588 insists form 2 (dashboard,
# immune to runner failure) is the floor and form 1 is the complement.
#
# The workflow name carries "advisory" (ADVISORY_MARKER in scripts/pr_gate.py):
# the PR gate then treats a red version of this check as non-blocking, so it
# can rougir to surface the alarm without appearing to block a merge.
#
# 2026-09-09 (#15332): the observer itself went silent at 01:13Z WITH the rest
# -- the last `event=schedule` run of the whole repository -- because its own
# heartbeat was a `schedule:`. An observer that dies of the cause it reports
# observes nothing. It now also fires on `push` to main: merges keep flowing
# while the scheduler is mute, so the alarm still gets a chance to speak during
# the exact outage it exists to report.
#
# Why `push` and not `workflow_run` on a frequent workflow (the first shape
# #15332 suggested): a self-hosted job gated on `workflow_run` is refused by
# scripts/ci/check_self_hosted_runner_policy.py (UNSAFE_TRIGGER -- workflow_run
# can be reached by fork code). `push` is in SAFE_SELF_HOSTED_TRIGGERS and, on
# `branches: [main]`, only ever runs repository-owned code -- the same property
# the schedule-only routing relied on.
#
# 2026-09-10 repair (ai-01 dispatch): the cadence probe and the sweep-age probe
# are the two sondes of this advisory. A red first step used to SKIP the second
# (default Actions short-circuit) -- the observer went half-blind exactly when
# it was red. Both probes now always run (continue-on-error) and a final
# aggregate step carries the red: one red probe must not silence the other.

on:
  schedule:
    # Every 30 minutes on off-:00 minutes, offset from the sweep's 7,27,47.
    - cron: '13,43 * * * *'
  # Heartbeat independent of the `schedule` event class (#15332).
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read       # gh run list --workflow (Actions API)

concurrency:
  group: pr-gate-sweep-health-advisory
  cancel-in-progress: false

jobs:
  health:
    name: PR gate sweep health advisory
    # Routage #14283 tranche 4 (ai-01 2026-09-02) : balayage cron pur-Python.
    # Declencheurs `schedule` + `push` sur main -- les deux ne portent que des
    # refs du depot (SAFE_SELF_HOSTED_TRIGGERS), donc aucun code de fork ne peut
    # l'atteindre et aucune garde same-repo n'est requise (cf en-tete de
    # check_self_hosted_runner_policy.py). Retour arriere = remettre
    # `runs-on: ubuntu-latest` + retrait de l'allowlist.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Cone mode (le defaut) n'accepte que des REPERTOIRES : une entree de
          # fichier fait echouer le checkout (`fatal: ... is not a directory`).
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/ci/check_scheduler_liveness.py

      - name: Measure served cadence of the schedule event class (#15332)
        id: cadence
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # Mesure la cadence SERVIE par organe (declaree vs observee) et rougit
          # quand la livraison de l'evenement 'schedule' est morte. Advisory :
          # le nom du workflow porte le marqueur, donc un rouge n'est pas
          # bloquant -- il parle sans bloquer un merge. continue-on-error ici ne
          # neutralise PAS le rouge : l'exit code est reporte au step final
          # d'agregation, qui porte le rouge de CE step et de la sonde d'age --
          # sans cela, un echec ici SKIPPERAIT la sonde d'age (short-circuit
          # Actions, repare sur dispatch ai-01 2026-09-10).
          python scripts/ci/check_scheduler_liveness.py --repo "$REPO"

      - name: Check age of last successful sweep run
        id: sweep_age
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_AFTER_MINUTES: "60"
        run: |
          set -uo pipefail

          # Most recent *successful* run of the sweep, with its creation time.
          # Filtering to conclusion=success keeps a transient failure from
          # tripping the alarm as long as a success happened inside the window.
          RUN=$(gh run list --workflow pr-gate-stale-sweep.yml --status success --limit 1 \
                --json createdAt,conclusion 2>/dev/null) \
            || { echo "[sweep-health] gh run list failed (upstream) -- skip this check"; exit 0; }

          # No successful run at all -> that absence IS the state this exists
          # to catch (history purged or scheduler dead). Fail visibly but, being
          # advisory, non-blocking.
          AGE_S=$(python - "$RUN" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          runs = json.loads(sys.argv[1])
          if not runs:
              print("NO_SUCCESS_IN_HISTORY", file=sys.stderr)
              sys.exit(1)
          created = (runs[0].get("createdAt") or "").replace("Z", "+00:00")
          if not created:
              print("NO_CREATED_AT", file=sys.stderr)
              sys.exit(1)
          age_s = (datetime.now(timezone.utc) - datetime.fromisoformat(created)).total_seconds()
          print(int(age_s))
          PY
          ) || { echo "::error::[sweep-health] no successful pr-gate-stale-sweep run found -- is its schedule alive? (#11860 / #12588)"; exit 1; }

          if [ "$AGE_S" -gt "$((STALE_AFTER_MINUTES * 60))" ]; then
            echo "::error::[sweep-health] last successful pr-gate-stale-sweep run is ${AGE_S}s old (> ${STALE_AFTER_MINUTES} min). The PR gate now has NO rescue -- the dashboard line (form 2) is the floor. See #12588."
            exit 1
          fi

          echo "[sweep-health] last successful sweep run: ${AGE_S}s ago -- OK"

      - name: Aggregate probe verdicts (a red probe must not silence the other)
        if: always()
        run: |
          set -uo pipefail
          # Les deux sondes portent continue-on-error : elles s'executent toutes
          # les deux quelle que soit la couleur de l'autre, et CE step porte le
          # rouge agrage. Un echec de sonde n'est donc jamais avalé, et aucune
          # sonde n'est skippée par l'echec de l'autre (dispatch ai-01
          # 2026-09-10 : "les exécuter toutes deux puis agréger rc rouge").
          rc=0
          if [ "${{ steps.cadence.outcome }}" = "failure" ]; then
            echo "::error::[sweep-health] served-cadence probe RED -- details in its step log above (#15332)"
            rc=1
          fi
          if [ "${{ steps.sweep_age.outcome }}" = "failure" ]; then
            echo "::error::[sweep-health] sweep-age probe RED -- details in its step log above (#11860 / #12588)"
            rc=1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "[sweep-health] both probes green (cadence + sweep age)"
          fi
          exit $rc
