name: Docs Link Check

# ABSORBE PAR LA VOIE RAPIDE (#12567, tranche 1) : sur `pull_request`, ce
# garde est desormais rendu par `fast-lane-shadow.yml` (check-run nomme
# `check-links`, meme nom que ce job, meme verdict, un seul checkout pour
# toute la lane). Ce fichier garde `workflow_dispatch` pour le re-run manuel
# sur `main` apres une panne CI (#9858). Les `paths:` d'origine vivent dans
# `scripts/ci/fast_lane_registry.py` (TRANCHE1).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-links:
    # Route vers la jambe Linux auto-hebergee (#13378 tranche 5, decision ai-01
    # 2026-09-02) : garde Python pur, sans secret. La garde same-repo ci-dessous
    # saute les PRs de fork (pr_gate.py compte `skipped` comme OK) : aucun code de
    # fork n'atteint le runner. Retour arriere = revert de la PR.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Check docs/ links
        # No --quiet: on failure, print each new broken link (source:line -> target)
        # so the CI log is self-diagnosing. On success the output is a single summary
        # line, so verbosity costs nothing. --quiet stays available for local/pre-commit use.
        run: python scripts/check_docs_links.py --check
