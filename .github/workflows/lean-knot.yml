name: Lean Knot CI

# CI for knot_lean (SymbolicAI/Lean/knot_lean).
# Knot theory formalization (PD-codes, Reidemeister moves, tricolorability,
# Conway knot, Lidman unknotting number). Epic #2874.
# Rule lean-merge-discipline: lake build SUCCESS local OBLIGATOIRE avant merge.
#
# Follows the "Pattern identique aux projets existants" (conway_lean,
# social_choice_lean, ...) documented in Epic #2874. knot_lean was the only
# Lean project without a dispatcher — this closes that gap so future Knots
# PRs (Phase 5 re-modeling and beyond) are CI-gated like the other 13.
#
# Uses the shared lean-build.yml reusable workflow.
#
# Sorry profile (switched 2026-07-11 to `real` mode, baseline=17; was prose-header/28,
# then 16 after #8766 discharged trefoil_not_unknot [sorry 5->4], raised back to 17 by
# PR #9966 which adds the characterized wrapper front tricolorable_forward_r1 [sorry 4->5]):
# knot_lean's docstrings legitimately reference "sorry" (Phase-1 scaffolding prose:
# "sorry permanent", "sorry commentés", "chaque sorry", the MathlibPrerequisites
# roadmap index, the TODO on well-formedness). Under `prose-header` mode these
# prose mentions counted toward the baseline, so any bilingual/docstring PR that
# added a legitimate prose "sorry" tripped the counter (e.g. #6171 had to raise
# the baseline 28->30 for +2 prose mentions, 0 new tactic sorry). Per lean-build.yml's
# guidance ("Use `real` when docstring prose legitimately says 'sorry' so comment
# edits do not flip the raw count"), switch to `real` mode: strip Lean comments
# (-- line + nested /- -/ block) then count word-bounded `\bsorry\b`. This mirrors
# the prover harness `count_real_sorries` (FX-6 #1453) — counts exactly
# compiled-tactic sorries, immune to docstring edits.
# Real-mode breakdown (firsthand counted 2026-09-12 at head 852813291 with the exact
# CI instrument `scripts/lean/count_code_sorry.py --json --lake
# MyIA.AI.Notebooks/SymbolicAI/Lean/knot_lean`, champ `distinct_code_sorry`):
#   - Conway.lean:              6 (4 tactic sorry de bornes + 2 def stubs
#                                  `IsSmoothlySlice := sorry` l.1147 et
#                                  `IsTopologicallySlice := sorry` l.1155 — ces
#                                  deux derniers sont des *def stubs* dont le
#                                  `sorry` fait partie du corps de la
#                                  définition (`Prop := sorry`), pas des sorries
#                                  tactic ; `count_code_sorry.py` les ignore
#                                  par construction — d'où l'écart −2 vs le
#                                  bloc per-file antérieur qui les comptait à
#                                  tort comme sorries tactic)
#   - Invariant.lean:           0 (post-#15082 `Knot.unknottingNumber` DISCHARGÉ
#                                  via `Nat.sInf` de `{n | k.UnknottableIn n}` —
#                                  témoin `unknot_unknottingNumber = 0` prouvé ;
#                                  cf README §Phase 5 / #14992. Les 3 sorries
#                                  résiduels `tricolorable_invariant` étaient
#                                  déjà DISCHARGÉS par #11211/#11227 [5->3]
#                                  + #8766 [3->2] + fox/col [2->0] avant #15082.
#                                  Mesure firsthand 2026-09-12 : `grep -nE
#                                  "^\s*sorry\b" Knots/Invariant.lean` rend 0 ligne)
#   - Lidman.lean:              2 (11n102 unknotting number = 2 — Heegaard-Floer)
#   - Reidemeister.lean:        2 (reidemeister_theorem x2 — PL topology, OOS)
#   - Basic.lean:               0 (the "1" under prose-header was a TODO prose comment)
#   - MathlibPrerequisites.lean:0 (the "2" were the prose roadmap index)
# Total real tactic sorry = 10 (aligné avec `LEAN_INVENTORY.md` ligne 27
# « `knot_lean | 10² » post-#15082, mesure 2026-09-11 ; cohérent avec
# `knot_lean/README.md` ligne 13 « **10 réels** ». La baseline CI
# `sorry-baseline: "10"` est inchangée — seule la **distribution per-file**
# est corrigée. Historique : 16 (après #8766) → 17 (#9966 wall fronted) → 16
# (wall DISCHARGED) → 14 (#11211/#11227 fox/col) → 11 (mesure 2026-08-28
# `count_code_sorry.py`) → **10** (post-#15082, mesure 2026-09-12). La
# trajectoire à venir : 10 → 9 par #15440 (`conway_trivial_alexander`) puis
# 9 → 8 par #15460 (`KT_trivial_alexander` MERGED)).
# Raising this baseline requires a documented
# justification in the PR body (a NEW real tactic sorry, not prose).

on:
  push:
    branches: [main]
    paths:
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/knot_lean/**.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/knot_lean/lakefile.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/knot_lean/lakefile.toml'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/knot_lean/lean-toolchain'
      # A change to the gate must run the gate. Without these three lines the
      # workflows that define this CI are the only files it never checks, so a
      # defect in them ships unverified -- which is exactly how the broken
      # `cd` reached main (#8712): the axiom job could not run on the PR that
      # introduced it, and its first execution ever was post-merge.
      - '.github/workflows/lean-knot.yml'
      - '.github/workflows/lean-axiom.yml'
      - '.github/workflows/lean-build.yml'
      # Self-cover des composites consommes par les jobs routes (#14337 2a) :
      # le gate doit tourner quand son propre code change (lecon #8712).
      - '.github/actions/lean-build/action.yml'
      - '.github/actions/lean-axiom/action.yml'
      # ...and the gate is not only its YAML. The axiom step is a Python
      # program whose whole body is `from lean_server import LeanVerifier`,
      # so lean_server.py (and the helper it loads) ARE gate inputs. Omitting
      # them reopened #8712 one layer down: #8725 edited the enumerator, no
      # path matched, the gate never ran on the PR, and an import that dies on
      # a bare runner reached main unobserved (#8722).
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/lean_server.py'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/prover/lean_utils.py'
      # Advisory target-coverage check (See #8782): the target-modules list is
      # hand-maintained while the lakefile glob grows; a change to the checker
      # must run it.
      - 'scripts/lean/check_target_coverage.py'
  pull_request:
    branches: [main]
    paths:
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/knot_lean/**.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/knot_lean/lakefile.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/knot_lean/lakefile.toml'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/knot_lean/lean-toolchain'
      - '.github/workflows/lean-knot.yml'
      - '.github/workflows/lean-axiom.yml'
      - '.github/workflows/lean-build.yml'
      - '.github/actions/lean-build/action.yml'
      - '.github/actions/lean-axiom/action.yml'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/lean_server.py'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/prover/lean_utils.py'
      - 'scripts/lean/check_target_coverage.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-knot-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Routage #14337 tranche 2a (arbitrage (B) composite action, ai-01 DM
  # 2026-09-04 msg-20260904T132737-02hnpi) : jambe Lean auto-hébergée sur le
  # pool coursia-lean (image Dockerfile.lean = elan + toolchain pré-cuits,
  # volume .lake chaud par slot #14285). Le `if:` ci-dessous est la garde
  # anti-fork exigée par scripts/ci/check_self_hosted_runner_policy.py ; un
  # `runs-on` STATIQUE la rend auditable (une expression dynamique lève
  # DYNAMIC_RUNS_ON). Les PRs de fork sautent le job -- pr_gate.py compte
  # `skipped` comme OK (le code d'un fork ne tourne jamais sur le pool).
  # Le twin composite-action (.github/actions/lean-build/action.yml) porte
  # les steps ; le checkout vit ICI car une action locale ne se résout
  # qu'une fois le dépôt materialisé dans le workspace.
  # Retour arrière = remettre `uses: jsboige/CoursIA/.github/workflows/lean-build.yml@main`
  # + retirer runs-on/if/steps du job, ET retirer `build-jobs:` du bloc `with:`
  # -- dans le job `ci` COMME dans le job `proof-integrity`, les deux le portent.
  # `build-jobs` est un input de la COMPOSITE ACTION seulement :
  # le reusable n'en declare que quatre (`project-path`, `display-name`,
  # `sorry-baseline`, `sorry-filter-mode`). Le laisser en place rend le fichier
  # de workflow INVALIDE -- il n'est alors plus charge du tout, et le gate
  # disparait en silence au lieu de tomber en erreur visible.
  # Aucune restauration de toolchain n'est requise de ce cote : le reusable
  # installe elan lui-meme (step `Install elan`, .github/workflows/lean-build.yml)
  # puis `lake exe cache get`. Le toolchain pre-cuit est ce que le pool
  # coursia-lean apporte EN PLUS, pas ce qui manque a la voie hebergee.
  ci:
    name: "Lean CI (knot_lean)"
    runs-on: [self-hosted, coursia-ephemeral, coursia-lean]
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    # BACKSTOP DE LIBERATION DE RUNNER -- PAS UN SEUIL DE SANTE (#15698).
    #
    # L'enlisement d'origine (knot_lean proof-integrity, run 103451688746) a
    # retenu la moitie du pool coursia-lean 3 h 17 sans jamais conclure. La
    # borne convertit l'enlisement en check ROUGE, visible du merge-gate.
    #
    # 300 et pas 60 : maximum LEGITIME mesure du job `ci` = 215 min (succes),
    # 3 succes au-dessus de 60 min sur 23, mediane 7 min (30 runs, 2026-09-12).
    # Le maximum legitime et la pathologie vivent dans la meme plage : aucun
    # seuil de temps de mur ne les separe. NE PAS RESSERRER.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lean-build
        with:
          project-path: MyIA.AI.Notebooks/SymbolicAI/Lean/knot_lean
          display-name: knot_lean
          sorry-baseline: "10"
          sorry-filter-mode: real
          # #14821 : le pool coursia-lean OOM-kill (exit 137) sur le pic
          # d'elaboration des siblings Conway/Conway_en DANS le meme job —
          # la contention entre jobs est REFUTEE (Proof integrity mort seul,
          # 18 min apres liberation de l'autre job, DM ai-01 2026-09-06).
          # Serialisation d'abord comme INSTRUMENT DE MESURE (reco ai-01,
          # msg-20260906T133912-j6rlew) : si ca passe, c'est aussi le remede
          # court terme ; si ca OOM, le pic d'un Conway seul depasse la boite.
          # NB: Lake 5.0 n'a pas de -j (tentative 1 = run 34037681207, mort
          # a l'option parsing) — le cap passe par LEAN_NUM_THREADS.
          build-jobs: "1"

  # Level 3 proof-integrity gate (criterion B.3 of pr-review-discipline).
  # Closes #8677: catches forbidden axioms (incl. transitive `sorryAx`)
  # that the textual sorry counter cannot see. Runs after the build to
  # reuse the cached lake artifacts.
  # Opt-in per lake; knot_lean is the pilote because it has a stable
  # sorry profile (16 real tactic sorries, all enumerated + justified).
  # #14337 tranche 2a: routed to the coursia-lean pool via the composite
  # twin (.github/actions/lean-axiom) -- job-level `uses:` on the local
  # reusable replaced by a LOCAL job (runs-on/if/steps) invoking the
  # composite. check_target_coverage.py unions BOTH wiring forms.
  #
  # Serialized after `ci` (#14921): both jobs used to start at the same
  # second, doubling the anonymous git burst from this machine's IP (2x
  # mathlib + 2x plausible) -- the burst trips GitHub's per-IP anonymous
  # limit and lake dies at `plausible` with `could not read Username`
  # (exit 128). Running second, this job also restores the cache entry
  # `ci` just saved, making the axiom pass fetch-free. This also makes
  # the job true to its own comment above ("Runs after the build").
  proof-integrity:
    name: "Proof integrity (knot_lean)"
    needs: ci
    runs-on: [self-hosted, coursia-ephemeral, coursia-lean]
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    # BACKSTOP DE LIBERATION DE RUNNER -- PAS UN SEUIL DE SANTE (#15698).
    #
    # C'est CE job qui s'est enlise 3 h 17 dans l'incident d'origine. La borne
    # convertit l'enlisement en check ROUGE, sur lequel le merge-gate peut agir.
    #
    # 300 et pas 60 : maximum LEGITIME mesure de `proof-integrity` = 177 min,
    # conclusion `success` (job 102677021168, branche
    # feature/2874-conway-trivial-alexander, step `lean-axiom` 22:58:13Z ->
    # 01:53:13Z = 2 h 55). Un `timeout-minutes: 60` l'aurait TUE -- exactement
    # le faux positif que ce fichier cherche a eviter. Mediane 8 min sur
    # 20 succes : la queue vient du cache Mathlib froid. NE PAS RESSERRER.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lean-axiom
        with:
          project-path: MyIA.AI.Notebooks/SymbolicAI/Lean/knot_lean
          display-name: knot_lean
          target-modules: "*"
          allow-axioms: ""
          # 10 acknowledged tactic `sorry`s = the `sorry-baseline` declared by the
          # build job above; the gate tolerates them (`fail-on-sorry: false`) but
          # still reports `has_sorry` per module and hard-fails forbidden axioms.
          # The per-module enumeration now lives in the gate's runtime derivation
          # (issue #10889) -- flip to `true` when the baseline reaches 0.
          fail-on-sorry: false
          # #14821 : meme instrument que le job ci (voir le commentaire du
          # job ci) — ce job REBUILD le lake avec sa propre cle de cache,
          # donc le pic des siblings se rejoue ici aussi.
          build-jobs: "1"

  # Advisory proof-integrity coverage (See #8782). Same pattern as conway_lean
  # (#8787): the `target-modules` list above is hand-maintained while the
  # lakefile glob (.submodules Knots, Knots_en) grows as modules are added; a
  # gate that inspects 5 of 14 compiled modules is a "vert hors-cible" --
  # visually indistinguishable from a targeted green in the check rollup. This
  # job prints the delta (compiled vs target) and ALWAYS exits 0: it never
  # fails CI, it makes the gap legible in the log.
  #
  # `--from-workflow` reads THIS file and unions target-modules over every job
  # whose `uses:` resolves to lean-axiom.yml, instead of restating the list a
  # second time here. knot_lean has a single gate job today, so the union is
  # the same set -- the point is that it stays the same set if a second gate
  # job is ever added, which is exactly where the conway copy went stale
  # (it reported the audit job's module as a blind spot). See #8782.
  target-coverage:
    name: knot target-coverage
    # Routage #14283 tranche 3 (decision ai-01 2026-09-02) : jambe Linux
    # auto-hebergee. Le `if:` ci-dessous est la garde anti-fork exigee par
    # scripts/ci/check_self_hosted_runner_policy.py ; un `runs-on` STATIQUE la
    # rend auditable (une expression dynamique leve DYNAMIC_RUNS_ON).
    # Les PRs de fork sautent le job -- pr_gate.py compte `skipped` comme OK.
    # Retour arriere = remettre `runs-on: ubuntu-latest` + retrait de l'allowlist.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    if: (github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository) && always()
    # Bound at 30 minutes (See #15698): this is a lightweight Python scan,
    # not a Lean build -- a wedge here is much cheaper than on `ci`/`proof-
    # integrity`, but still must not pin a runner forever.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Advisory target-coverage delta
        run: |
          python3 scripts/lean/check_target_coverage.py \
            --project-path MyIA.AI.Notebooks/SymbolicAI/Lean/knot_lean \
            --from-workflow .github/workflows/lean-knot.yml \
            --lib-root Knots \
            --name knot_lean
