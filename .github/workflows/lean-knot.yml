name: Lean Knot CI

# CI for knot_lean (SymbolicAI/Lean/knot_lean).
# Knot theory formalization (PD-codes, Reidemeister moves, tricolorability,
# Conway knot, Lidman unknotting number). Epic #2874.
# Rule lean-merge-discipline: lake build SUCCESS local OBLIGATOIRE avant merge.
#
# Follows the "Pattern identique aux projets existants" (conway_lean,
# social_choice_lean, ...) documented in Epic #2874. knot_lean was the only
# Lean project without a dispatcher — this closes that gap so future Knots
# PRs (Phase 5 re-modeling and beyond) are CI-gated like the other 13.
#
# Uses the shared lean-build.yml reusable workflow.
#
# Sorry profile (switched 2026-07-11 to `real` mode, baseline=17; was prose-header/28,
# then 16 after #8766 discharged trefoil_not_unknot [sorry 5->4], raised back to 17 by
# PR #9966 which adds the characterized wrapper front tricolorable_forward_r1 [sorry 4->5]):
# knot_lean's docstrings legitimately reference "sorry" (Phase-1 scaffolding prose:
# "sorry permanent", "sorry commentés", "chaque sorry", the MathlibPrerequisites
# roadmap index, the TODO on well-formedness). Under `prose-header` mode these
# prose mentions counted toward the baseline, so any bilingual/docstring PR that
# added a legitimate prose "sorry" tripped the counter (e.g. #6171 had to raise
# the baseline 28->30 for +2 prose mentions, 0 new tactic sorry). Per lean-build.yml's
# guidance ("Use `real` when docstring prose legitimately says 'sorry' so comment
# edits do not flip the raw count"), switch to `real` mode: strip Lean comments
# (-- line + nested /- -/ block) then count word-bounded `\bsorry\b`. This mirrors
# the prover harness `count_real_sorries` (FX-6 #1453) — counts exactly
# compiled-tactic sorries, immune to docstring edits.
# Real-mode breakdown (instantané re-mesuré le 2026-09-19 au head a1ff7fd4b1a9 par
# `python scripts/lean/count_code_sorry.py --json` — champ `distinct_code_sorry`,
# déclarations nommées via `scan_file` du même script ; LA COMMANDE FAIT FOI,
# ce commentaire est un instantané daté, pas une source : re-mesurer plutôt que
# maintenir — un bloc dérivé à la main se re-périme, motif #15598) :
#   - Conway.lean:              4 (IsSmoothlySlice + IsTopologicallySlice — définitions
#                                  des propriétés de tranche — et les bornes
#                                  conway_not_smoothly_slice / conway_topologically_slice ;
#                                  conway_trivial_alexander et KT_trivial_alexander
#                                  DISCHARGED, unités preuve du split #14821)
#   - Invariant.lean:           0 (intégralement déchargé : fox/col résidus fermés
#                                  par #11211/#11227, Knot.unknottingNumber redéfini
#                                  par sInf par #15082 — le récit par déclaration vit
#                                  dans `knot_lean/README.md` §sorry, il ne vit plus ici)
#   - Lidman.lean:              2 (unknotting_11n102_upper + unknotting_11n102 —
#                                  11n102 unknotting number = 2, Heegaard-Floer)
#   - Reidemeister.lean:        2 (reidemeister_theorem x2 — PL topology, OOS)
#   - Basic.lean:               0 (the "1" under prose-header was a TODO prose comment)
#   - MathlibPrerequisites.lean:0 (the "2" were the prose roadmap index)
# Total real tactic sorry = 8 (mesure `count_code_sorry.py` champ
# `distinct_code_sorry` ; historique :
# 16 (après #8766) → 17 (#9966 wall fronted) → 16 (wall DISCHARGED) → 14
# (#11211/#11227 fox/col) → 11 (mesure 2026-08-28, `count_code_sorry.py`) →
# 10 (#15082 unknottingNumber par sInf) → 9 (conway_trivial_alexander
# DISCHARGED, unité preuve-Conway du split de PR 14821) → **8**
# (KT_trivial_alexander DISCHARGED par transvections, unité preuve-KT
# du split de PR 14821).
# Cette valeur DOIT rester synchronisée avec `LEAN_INVENTORY.md` ligne « knot_lean
# | 8 » et avec `knot_lean/README.md` table des sorries — cf. #13312 ; split
# #14821 terminé (CLOSED) : la synchronisation est à jour au 2026-09-19, elle
# n'est plus déléguée à une PR du split (#15598).
# Raising this baseline requires a documented
# justification in the PR body (a NEW real tactic sorry, not prose).

on:
  push:
    branches: [main]
    paths:
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/knot_lean/**.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/knot_lean/lakefile.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/knot_lean/lakefile.toml'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/knot_lean/lean-toolchain'
      # A change to the gate must run the gate. Without these three lines the
      # workflows that define this CI are the only files it never checks, so a
      # defect in them ships unverified -- which is exactly how the broken
      # `cd` reached main (#8712): the axiom job could not run on the PR that
      # introduced it, and its first execution ever was post-merge.
      - '.github/workflows/lean-knot.yml'
      - '.github/workflows/lean-axiom.yml'
      - '.github/workflows/lean-build.yml'
      # Self-cover des composites consommes par les jobs routes (#14337 2a) :
      # le gate doit tourner quand son propre code change (lecon #8712).
      - '.github/actions/lean-build/action.yml'
      - '.github/actions/lean-axiom/action.yml'
      # ...and the gate is not only its YAML. The axiom step is a Python
      # program whose whole body is `from lean_server import LeanVerifier`,
      # so lean_server.py (and the helper it loads) ARE gate inputs. Omitting
      # them reopened #8712 one layer down: #8725 edited the enumerator, no
      # path matched, the gate never ran on the PR, and an import that dies on
      # a bare runner reached main unobserved (#8722).
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/lean_server.py'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/prover/lean_utils.py'
      # Advisory target-coverage check (See #8782): the target-modules list is
      # hand-maintained while the lakefile glob grows; a change to the checker
      # must run it.
      - 'scripts/lean/check_target_coverage.py'
  pull_request:
    types: [opened, synchronize, edited, reopened]
    paths:
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/knot_lean/**.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/knot_lean/lakefile.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/knot_lean/lakefile.toml'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/knot_lean/lean-toolchain'
      - '.github/workflows/lean-knot.yml'
      - '.github/workflows/lean-axiom.yml'
      - '.github/workflows/lean-build.yml'
      - '.github/actions/lean-build/action.yml'
      - '.github/actions/lean-axiom/action.yml'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/lean_server.py'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/prover/lean_utils.py'
      - 'scripts/lean/check_target_coverage.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-knot-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Essai de routage hosted per arbitrage #16496 (ai-01 DM
  # msg-20260917T224942-z8bbnm, 2026-09-17) : le pool coursia-lean OOM-kill
  # (exit 137) le pic d'elaboration des siblings Conway/Conway_en MEME
  # SERIALIZES (LEAN_NUM_THREADS=1, run 35175031202, instrument #14821) --
  # le pic d'un Conway seul depasse la boite self-hosted. Cette PR est
  # l'essai exige par l'arbitrage : retour a la forme pre-#14337 (reusable
  # lean-build.yml = ubuntu-latest, 16 GB RAM + swap 32 G /mnt -- le pattern
  # qui a absorbe le pic conway_lean HashlifeCorrectness avant le split
  # #9863, PR #9798/#9840). Le routage ne devient DEFINITIF qu'apres la
  # mesure de runtime sur cette PR (guidance ~45 min, timeout 300 min --
  # #15698, NE PAS RESSERRER), rapportee sur le dashboard.
  # NB cache : la cle actions/cache de la composite #14337 et celle du
  # reusable sont IDENTIQUES (lake-<name>-${{ runner.os }}-, Linux des deux
  # cotes) -- le premier run hosted peut restaurer les entrees sauvees par
  # l'ere self-hosted ; verifier la ligne "Cache restored from key" dans le
  # log avant de lire la mesure comme un regime froid.
  # Rollback = git revert de cette PR (remet la forme composite #14337 :
  # runs-on [self-hosted, coursia-ephemeral, coursia-lean] + garde if: +
  # steps + `build-jobs:` dans le bloc `with:` de CHAQUE job -- le reusable
  # n'en declare que quatre, le laisser rend le fichier INVALIDE, cf #15579).
  ci:
    uses: jsboige/CoursIA/.github/workflows/lean-build.yml@main
    with:
      project-path: MyIA.AI.Notebooks/SymbolicAI/Lean/knot_lean
      display-name: knot_lean
      sorry-baseline: "8"
      sorry-filter-mode: real

  # Level 3 proof-integrity gate (criterion B.3 of pr-review-discipline).
  # Closes #8677: catches forbidden axioms (incl. transitive `sorryAx`)
  # that the textual sorry counter cannot see. Runs after the build to
  # reuse the cached lake artifacts.
  # Opt-in per lake; knot_lean is the pilote because it has a stable
  # sorry profile (8 real tactic sorries, all enumerated + justified).
  # Essai de routage hosted per arbitrage #16496 (voir le commentaire du
  # job `ci`) : retour au reusable lean-axiom.yml (forme pre-#14337, ref
  # locale `./` = resolution per-PR). check_target_coverage.py unions
  # BOTH wiring forms.
  #
  # Serialized after `ci` (#14921) : en tournant second, ce job restaure
  # l'entree de cache que `ci` vient de sauver, ce qui rend la passe
  # axiomatique fetch-free (la moitie IP-anonyme du motif #14921 etait
  # specifique au pool self-hosted ; le benefice cache reste).
  proof-integrity:
    needs: ci
    uses: ./.github/workflows/lean-axiom.yml
    with:
      project-path: MyIA.AI.Notebooks/SymbolicAI/Lean/knot_lean
      display-name: knot_lean
      target-modules: "*"
      allow-axioms: ""
      # 8 acknowledged tactic `sorry`s = the `sorry-baseline` declared by the
      # build job above; the gate tolerates them (`fail-on-sorry: false`) but
      # still reports `has_sorry` per module and hard-fails forbidden axioms.
      # The per-module enumeration now lives in the gate's runtime derivation
      # (issue #10889) -- flip to `true` when the baseline reaches 0.
      fail-on-sorry: false

  # Advisory proof-integrity coverage (See #8782). Same pattern as conway_lean
  # (#8787): the `target-modules` list above is hand-maintained while the
  # lakefile glob (.submodules Knots, Knots_en) grows as modules are added; a
  # gate that inspects 5 of 14 compiled modules is a "vert hors-cible" --
  # visually indistinguishable from a targeted green in the check rollup. This
  # job prints the delta (compiled vs target) and ALWAYS exits 0: it never
  # fails CI, it makes the gap legible in the log.
  #
  # `--from-workflow` reads THIS file and unions target-modules over every job
  # whose `uses:` resolves to lean-axiom.yml, instead of restating the list a
  # second time here. knot_lean has a single gate job today, so the union is
  # the same set -- the point is that it stays the same set if a second gate
  # job is ever added, which is exactly where the conway copy went stale
  # (it reported the audit job's module as a blind spot). See #8782.
  target-coverage:
    name: knot target-coverage
    # Routage #14283 tranche 3 (decision ai-01 2026-09-02) : jambe Linux
    # auto-hebergee. Le `if:` ci-dessous est la garde anti-fork exigee par
    # scripts/ci/check_self_hosted_runner_policy.py ; un `runs-on` STATIQUE la
    # rend auditable (une expression dynamique leve DYNAMIC_RUNS_ON).
    # Les PRs de fork sautent le job -- pr_gate.py compte `skipped` comme OK.
    # Retour arriere = remettre `runs-on: ubuntu-latest` + retrait de l'allowlist.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    if: (github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository) && always()
    # Bound at 30 minutes (See #15698): this is a lightweight Python scan,
    # not a Lean build -- a wedge here is much cheaper than on `ci`/`proof-
    # integrity`, but still must not pin a runner forever.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Advisory target-coverage delta
        run: |
          python3 scripts/lean/check_target_coverage.py \
            --project-path MyIA.AI.Notebooks/SymbolicAI/Lean/knot_lean \
            --from-workflow .github/workflows/lean-knot.yml \
            --lib-root Knots \
            --name knot_lean
