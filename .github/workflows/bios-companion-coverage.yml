name: bi-OS companion coverage

# Organe de l'item 3 de #10643 (criteres 2-3 de l'acceptance) : ces
# criteres "se constataient a la main, ou ne se constataient pas".
# Le garde gele l'etat mesure au 2026-10-05 (20/20 in-scope couverts,
# 0 cross-ref README manquant, 0 carnet Setup windows-only apres
# calibration du faux positif C# IsOSPlatform) :
#   - uncovered_companion : .ps1 d'infrastructure sans .sh compagnon --
#     ECHEC (c'est la dent du garde : un nouveau .ps1 seul rougit la PR) ;
#   - missing_readme_xref / setup_windows_only : avertissements visibles,
#     jamais fatals (le distant peut se refermer sans rouge).
# Perimetre = celui de l'acceptance : Vibe-Coding/, docs/archive/ et
# _archive/ exclus, .ps1 Windows par nature exemptes (table dans le script).
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.ps1'
      - '**/*.sh'
      - '**/README*.md'
      - '**/*[Ss]etup*.ipynb'
      - 'scripts/ci/check_companion_coverage.py'
      - '.github/workflows/bios-companion-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bios-companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Companion coverage (ps1/sh + Setup bi-OS)
    # Routage #14283 tranche 3c (ai-01 2026-09-02) : jambe Linux auto-hebergee.
    # Garde anti-fork au niveau job + runs-on STATIQUE (une expression leverait
    # DYNAMIC_RUNS_ON dans check_self_hosted_runner_policy.py).
    # 2026-10-27 (mesure ai-01) : migration vers `ubuntu-latest` par Q35 etape 2
    # (#17397) -- `scripts/ci/audit_self_hosted_needs.py` certifie ce workflow
    # comme n'ayant besoin de RIEN qui n'existe que sur le parc local, et le parc
    # local etait sature PAR SES CHECKOUTS (mesure 00:45Z : 11 des 12 slots
    # occupes dans `actions/checkout`, 614 runs en file). La garde anti-fork
    # ci-dessous est CONSERVEE : aucun code de fork ne change de surface.
    # 2026-10-27 (#22461, phase A) : forme hybride de debordement -- PR
    # meme-depot ET vars.CI_OVERFLOW_LOCAL == 'true' -> jambe Linux locale ;
    # tout le reste (variable absente ou fausse, forks, push/schedule/
    # dispatch) retombe sur ubuntu-latest (l'etat du 27/10). Bascule :
    # `gh variable set CI_OVERFLOW_LOCAL --body true|false --repo jsboige/CoursIA`.
    # Retour arriere = variable a `false` ou supprimee : routage 100 %
    # heberge, sans toucher ce fichier. Limite : runs-on se resout a la
    # creation du job, les runs deja en file ne bougent pas.
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository && vars.CI_OVERFLOW_LOCAL == 'true') && fromJSON('["self-hosted","coursia-ephemeral","coursia-linux"]') || 'ubuntu-latest' }}
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Couverture compagnons bi-OS
        run: python scripts/ci/check_companion_coverage.py
