name: Catalog Auto-Regen (main, scheduled)

# Purpose
# -------
# Keep COURSE_CATALOG.generated.{json,md} + README CATALOG-STATUS markers
# CANONICAL ON MAIN without any human or agent regenerating them by hand.
#
# Why a scheduled job is needed:
#   The catalog embeds git-derived fields (last_validation, issue_pr_associee...)
#   and a maturity heuristic that drift purely as commits land on main -- even
#   when no notebook changes. Nothing refreshes main's catalog on a cadence, so
#   it goes stale over time. A feature branch that later regenerates against a
#   stale main produces a large spurious diff (the "stale-catalog poison",
#   incidents #2376 / #2383 / #2385) that has to be hand-resolved at merge time.
#   Refreshing main on a schedule removes that drift at the source.
#
# Companion automation (do NOT duplicate):
#   - catalog-drift.yml         : per-PR sync (auto-regen+commit on same-repo PR
#                                 branches; informational annotation on forks).
#   - stale-base-warning.yml    : labels PRs whose base is >14d behind main.
#
# Governance rule (.claude/rules/catalog-pr-hygiene.md):
#   Agents MUST NOT regenerate or commit COURSE_CATALOG.generated.* nor the
#   CATALOG-STATUS markers on a feature branch. The catalog is owned by this
#   automation. New entries appear at the next run (eventual consistency, <24h).
#
# The generator (scripts/notebook_tools/generate_catalog.py) preserves curated
# git fields from origin/main for entries untouched on the current ref
# (_load_main_catalog + _merge_curated_fields, the #2433 fix), so running it on
# main is idempotent: only the time-drifted fields are refreshed.
#
# Delivery model: long-lived PR (issue #10136)
# --------------------------------------------------
# Why this workflow DOES NOT push directly to main:
#   The `PR gate` status check on main's branch protection is required for ANY
#   push to main. A `schedule:` trigger never runs that gate (it only fires on
#   pull_request), so github-actions[bot] is blocked by GH006 / "Required status
#   check 'PR gate' is expected" (first observed on catalog-cron run
#   31293765051, 2026-08-09T04:03Z, after main's protection was tightened).
#   The same structural barrier also blocks the post-merge delivery proposed
#   in #10133 (translation-sync.yml on push to main).
#
# Instead, this workflow:
#   (a) checks out the long-lived branch `chore/catalog-refresh-pending`
#       (created from origin/main the first time, refreshed thereafter);
#   (b) regenerates + commits the catalog on that branch (no `[skip ci]`
#       since #10421: this workflow's `on:` lists no `push:` listener, so
#       a self-trigger is structurally impossible; the directive was
#       suppressing the required-check set on the long-lived PR);
#   (c) pushes the branch to origin;
#   (d) opens a PR via github-script if none exists yet, OR updates the
#       existing PR's body / re-pings a maintainer on subsequent runs.
# The PR goes through normal checks (PR gate, gitleaks, etc.). When a
# maintainer merges it, main's catalog is refreshed exactly as before — only
# the bottleneck changed (a maintained PR replaces a direct bot push).
#
# Push failures must be loud: see the hard-fail block at the end of the
# `commit + push + PR` step (echo ::error + exit 1).

on:
  schedule:
    # 03:37 UTC daily -- off-peak, off-:00 minute to avoid the top-of-hour rush.
    - cron: '37 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write   # open/update the refresh PR via github-script
  actions: write         # approve the runs this push parks (see "Release the
                         # parked runs" below -- without this the delivery PR
                         # stays BLOCKED forever)

concurrency:
  group: catalog-cron-main
  cancel-in-progress: false

jobs:
  regen:
    name: Regenerate catalog on long-lived PR
    # Routage #14283 tranche 4 (ai-01 2026-09-02) : balayage cron pur-Python.
    # Declencheur `schedule` uniquement -- il ne tourne que sur la branche par
    # defaut, donc aucun code de fork ne peut l'atteindre et aucune garde
    # same-repo n'est requise (cf en-tete de check_self_hosted_runner_policy.py).
    # Retour arriere = remettre `runs-on: ubuntu-latest` + retrait de l'allowlist.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    steps:
      - name: Checkout main (history only)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0          # full history so git-derived fields are exact
          persist-credentials: true

      # Prepare the long-lived branch from origin/main. We reset (not rebase)
      # onto origin/main unconditionally. Catalog regen is fully idempotent and
      # the previous bot commit holds no curated state worth preserving -- the
      # --merge-curated-fields logic runs against origin/main at regeneration
      # time, not against the prior bot commit. Rebasing instead yields the
      # same structural add/add conflict pattern observed on translation-sync
      # (issue #10373): any human PR that touches a catalog-derived file will
      # block the cron until the bot commit is manually dropped.
      # --force-with-lease is safe here: branch is mono-writer bot-owned
      # (git-workflow.md allows it on lane-unique feature branches; main is
      # untouched either way).
      - name: Prepare chore/catalog-refresh-pending branch
        run: |
          set -euo pipefail
          BRANCH="chore/catalog-refresh-pending"
          git fetch origin main
          git checkout -B "$BRANCH" origin/main
          echo "Working on branch: $(git rev-parse --abbrev-ref HEAD) at $(git rev-parse --short HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # PyYAML is required by generate_catalog.py's editorial-review registry
      # loader (_load_editorial_registry, added in #8345). Without it the
      # generator crashes: ModuleNotFoundError: No module named 'yaml'.
      - name: Install PyYAML
        run: pip install pyyaml

      - name: Regenerate catalog (.json + .md) + README markers
        run: |
          set -euo pipefail
          # No --json-only here: refresh BOTH root artifacts (.json AND .md).
          # --git-tracked-only keeps CI output deterministic (ignores untracked).
          python scripts/notebook_tools/generate_catalog.py --git-tracked-only
          python scripts/notebook_tools/expand_catalog_markers.py
          # Health dashboard (#4210 acceptance #4): derive
          # docs/archive/reference/HEALTH_DASHBOARD.md from the freshly-regenerated
          # catalog so it never drifts again (See #7422, #9982).
          python scripts/notebook_tools/generate_health_dashboard.py
          # Learning paths (parcours, #7422): derive the 5 curriculum pages
          # under docs/curriculum/ from the freshly-regenerated catalog so
          # they never drift again (See #7422).
          python scripts/notebook_tools/generate_parcours.py

      - name: Commit + push to chore/catalog-refresh-pending if the catalog drifted
        id: drift
        run: |
          set -euo pipefail
          BRANCH="chore/catalog-refresh-pending"
          git add COURSE_CATALOG.generated.json COURSE_CATALOG.generated.md docs/archive/reference/HEALTH_DASHBOARD.md
          # Stage the 5 generated curriculum (parcours) pages if they drifted.
          mapfile -t changed_parcours < <(git ls-files -m -- 'docs/curriculum/*.md')
          if [ "${#changed_parcours[@]}" -gt 0 ]; then
            git add -- "${changed_parcours[@]}"
          fi
          # Stage only README files actually modified by marker expansion.
          mapfile -t changed_readmes < <(git ls-files -m -- '*README.md')
          if [ "${#changed_readmes[@]}" -gt 0 ]; then
            git add -- "${changed_readmes[@]}"
          fi

          if git diff --cached --quiet; then
            echo "::notice title=Catalog::main catalog already canonical -- no change."
            # Stamp "no-op" run so the downstream open/update-PR step can
            # detect it and skip PR activity.
            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "drift_detected=true" >> "$GITHUB_OUTPUT"

          echo "Drift detected. Files to commit:"
          git diff --cached --name-only

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "chore(catalog): scheduled auto-regenerate" \
            -m "Refresh COURSE_CATALOG.generated.{json,md} + CATALOG-STATUS markers." \
            -m "Catalog is owned by automation; agents must not regenerate it on feature branches (see .claude/rules/catalog-pr-hygiene.md, #2433, #10136)."

          # Push the long-lived branch. Direct push to main would trigger GH006
          # because the `PR gate` status check is required and a schedule
          # trigger never runs it (issue #10136, run 31293765051, 2026-08-09T04:03Z).
          # Note: prior versions carried `[skip ci]` in the commit message;
          # removed in #10421. This workflow's `on:` block lists only
          # `schedule:` and `workflow_dispatch:` (no `push:`), so the bot
          # commit on `chore/catalog-refresh-pending` cannot re-trigger
          # this workflow by construction. The `[skip ci]` paid for that
          # non-risk by suppressing the entire required-check set on the
          # long-lived PR, locking it in `BLOCKED` state indefinitely
          # (measured firsthand, see #10421 acceptance note).
          #
          # Even after the `[skip ci]` removal, the bot push still
          # produces a head that `mergeStateStatus` reports as `BLOCKED`,
          # carrying 5 default-Setup CodeQL checks (all green) and no
          # repo-owned check.
          #
          # CORRECTED 2026-09-21 -- the recorded cause was wrong, and it
          # cost 8 days of stale catalog on main. #11202 concluded that
          # "a push with GITHUB_TOKEN never emits a pull_request event
          # (GitHub anti-recursion guard)", so the repo-owned workflows
          # simply never start. Measurement refutes it: they DO start.
          #
          #   gh run list --branch chore/catalog-refresh-pending --limit 60
          #   -> 40 runs, event=pull_request, conclusion=action_required
          #
          # The runs are created and then PARKED awaiting manual approval.
          # A parked run is neither green nor red: it never executed, so
          # the required check it carries does not exist at the head, and
          # the PR sits `BLOCKED` with nothing red to explain it. That is
          # a different defect with a different fix -- the runs have to be
          # APPROVED, which the step below now does. The "empty-commit
          # wake-up" that #11202 designated as canonical is a manual
          # gesture that nobody performed on 8 consecutive days; it is
          # kept documented but it is no longer the remedy.
          #
          # The standing witness is `scripts/ci/check_catalog_freshness.py`
          # (`--delivery`), which counts the parked runs and the age of the
          # delivery PR. A cron that succeeds while main freezes is silent
          # by construction; that organ is what makes it loud.
          #
          # The push MUST be a force-with-lease, and that is not a shortcut:
          # this job re-roots the branch on fresh main every run
          # (`git checkout -B "$BRANCH" origin/main` above), so its HEAD is a
          # sibling of -- never a descendant of -- whatever the branch already
          # carries. A plain push therefore succeeds exactly once, on the run
          # that creates the branch, and is rejected non-fast-forward on every
          # run afterwards (measured: runs 31354714030 / 31439360626 /
          # 31457376652, three consecutive failures once the branch held a
          # commit, all three reported as a permission problem by the old
          # message below -- which is what made this read as the #10136 403).
          #
          # Nothing is lost by overwriting: the branch is a materialized view,
          # regenerated from scratch from main on each run, owned solely by the
          # automation. The "agents are forbidden from pushing to it" rule
          # (catalog-pr-hygiene.md, regle HARD 1) is about **content** (ne pas
          # regenerer le catalogue sur la branche) -- it does NOT carve out
          # the wake-up gesture described in #11202, which is mechanically
          # distinct (commit vide, arbre identique, sous identite non-bot).
          # When the bot's head lands BLOCKED with 5 CodeQL verts, the
          # canonical fix is exactly that empty-commit push, and the rule
          # file documents how to perform it. Nothing in this workflow
          # should ever regenerate or amend the catalog content from a
          # non-bot identity; an empty commit at the tip is the only
          # permitted non-bot push on this branch.
          #
          # git-workflow.md permits force-push on a single-owner PR branch
          # with --force-with-lease -- and the lease is what keeps it honest:
          # fetching the branch first materializes refs/remotes/origin/$BRANCH,
          # so the push refuses if anything pushed to it between that fetch
          # and this push.
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          if ! git push --force-with-lease origin "HEAD:$BRANCH"; then
            echo "::error title=Catalog push rejected::Could not push $BRANCH to origin. The lease failed (someone pushed to $BRANCH after this run fetched it) or github-actions[bot] lacks push rights on chore/*. Re-run this workflow; if it repeats, inspect the branch tip."
            exit 1
          fi
          echo "::notice title=Catalog::$BRANCH pushed; PR open/update follows in next step."

      # Open the refresh PR if it does not exist yet; otherwise, ping a
      # maintainer comment on the existing PR to signal a new push is ready.
      # The PR is what carries the catalog onto main -- the bot NEVER pushes
      # to main itself.
      - name: Open or update the catalog-refresh PR
        if: steps.drift.outputs.drift_detected == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = 'chore/catalog-refresh-pending';
            const prTitle = 'chore(catalog): scheduled auto-regenerate (long-lived PR)';
            const prBody = [
              '## Purpose',
              '',
              'Long-lived PR refreshed daily by `catalog-cron.yml` (schedule cron 03:37 UTC) to keep',
              '`COURSE_CATALOG.generated.{json,md}` + `CATALOG-STATUS` markers + the curriculum (`docs/curriculum/*.md`)',
              'and health dashboard (`docs/archive/reference/HEALTH_DASHBOARD.md`) canonical on `main`.',
              '',
              '**Maintainer review only — no direct push to `main`** (issue #10136). The bot opens',
              'or updates this PR; merging it refreshes `main` through the normal PR gate.',
              '',
              '## What to review',
              '',
              '- Catalog totals (`notebook_count`, per-family counts) drift only if new notebooks landed on `main` since the last merge.',
              '- README `<!-- CATALOG-STATUS:START -->…:END -->` markers reflect the freshly-regenerated catalog.',
              '- Curriculum pages under `docs/curriculum/` and `docs/archive/reference/HEALTH_DASHBOARD.md` stay consistent.',
              '',
              '## Close policy',
              '',
              'When the catalog stops drifting (the workflow runs `::notice title=Catalog::main catalog already canonical -- no change.`),',
              'this PR will be auto-closed by `catalog-pr-close.yml` to keep the queue clean. Subsequent',
              'drift reopens it under the same branch.',
              '',
              'See `.claude/rules/catalog-pr-hygiene.md` and #2433, #10136.',
            ].join('\n');

            // Look for an existing open PR on this branch (HEAD_REF exact).
            const existing = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', head: `${owner}:${branch}`, per_page: 1,
            });
            if (existing.length > 0) {
              const pr = existing[0];
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: pr.number,
                body: [
                  `New commit pushed on \`${branch}\` by catalog-cron (run \`${context.runId}\`).`,
                  `Last commit SHA: \`${context.sha.slice(0, 12)}\`.`,
                  'Catalog drift detected; the bot has nothing else to do here. Maintainer: please review + merge when convenient.',
                ].join('\n'),
              });
              core.info(`Updated existing PR #${pr.number} (${pr.html_url})`);
              return;
            }

            // Otherwise create the PR targeting main.
            const created = await github.rest.pulls.create({
              owner, repo,
              title: prTitle,
              head: branch,
              base: 'main',
              body: prBody,
              maintainer_can_modify: true,
            });
            await github.rest.issues.addLabels({
              owner, repo,
              issue_number: created.data.number,
              labels: ['catalog-refresh', 'automation'],
            });
            core.info(`Opened new PR #${created.data.number} (${created.data.html_url})`);

      # Release the runs this push just parked.
      #
      # A same-repo push by github-actions[bot] creates the `pull_request`
      # workflow runs and leaves them in `action_required` -- waiting for a
      # manual approval that, measured over 8 consecutive days, never came.
      # A parked run never executes, so the required check it carries is
      # ABSENT at the head (not failing -- absent), and the delivery PR stays
      # `BLOCKED` with every visible check green. That is the whole reason
      # main's catalog went 9 days stale while this workflow reported
      # `success` every morning.
      #
      # Approving them here closes the loop the workflow header promises.
      # If the token is not allowed to approve its own runs, this step says
      # so and does NOT fail the job: the catalog refresh itself succeeded,
      # and `check_catalog_freshness.py --delivery` is the organ that will
      # keep the unfinished delivery visible rather than silent.
      - name: Release the parked runs on the delivery branch
        if: steps.drift.outputs.drift_detected == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/catalog-refresh-pending
        run: |
          set -u
          head_sha="$(git rev-parse HEAD)"
          echo "::notice title=Catalog::releasing parked runs at $head_sha"
          parked="$(gh run list --repo "$GITHUB_REPOSITORY" --branch "$BRANCH" \
                      --limit 100 \
                      --json databaseId,headSha,conclusion,workflowName \
                      --jq ".[] | select(.conclusion==\"action_required\") \
                            | select(.headSha==\"$head_sha\") \
                            | \"\(.databaseId)\t\(.workflowName)\"" || true)"
          if [ -z "$parked" ]; then
            echo "::notice title=Catalog::no parked run at this head -- nothing to release."
            exit 0
          fi
          released=0; refused=0
          while IFS="$(printf '\t')" read -r rid name; do
            [ -z "$rid" ] && continue
            if gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$rid/approve" >/dev/null 2>&1; then
              released=$((released + 1))
            else
              refused=$((refused + 1))
              echo "::warning title=Catalog::could not approve run $rid ($name)"
            fi
          done <<EOF
          $parked
          EOF
          echo "::notice title=Catalog::released $released run(s), refused $refused"
          if [ "$refused" -gt 0 ]; then
            echo "::warning title=Catalog::$refused run(s) still parked -- the delivery PR will stay BLOCKED. Approve them by hand, or grant a token that may approve workflow runs. check_catalog_freshness.py --delivery reports this state."
          fi
