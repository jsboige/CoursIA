name: Lane Claim Guard

# Organe debloquant (#10223): un renvoi FERMANT (`Closes|Fixes|Resolves #N`)
# dans le body d'une PR ne doit pas fermer une issue qu'une autre lane detient
# en claim actif. Deux collisions le meme jour (2026-08-09, #10169 puis #10161)
# -- dans les deux la lane doublee (po-2025) etait protocol-conforme et a ete
# doublee quand meme, parce que `scripts/check_lane_claim.py` (livre en #9775,
# l'outil qui les aurait attrapees) n'etait appele par personne. Ce gate en est
# le consommateur obligatoire.
#
# Le gate ne peut pas EMPECHER la collision (au moment ou la PR existe, le
# travail est deja ecrit) : il rend impossible de la MERGER sans arbitrage
# ecrit. Cet arbitrage est le marqueur `[OVERRIDE]` (Tache 2 de #10223) -- sans
# lui, un coordinateur ne peut pas merger contre un claim detenu.
#
# Discriminant = mots-cles fermants UNIQUEMENT. Un `See #N` / `Part of #N` sur
# une EPIC est multi-lane par construction (#1454, #1027, #3801 portent des
# claims concurrents legitimes) et bloquer dessus rougirait la moitie du depot.
# Les renvois non-fermants etaient un label advisory seul (`lane-claim-
# conflict`, Tache 4) ; retire en #10395 Variante 3 (2026-08-11) parce que
# trois mesures (#10370, le trio OR-Tools, et le miroir #10353/#10370) ont
# montre qu'il etait pose sur des PRs protocol-conformes. Seul `lane-claim-
# absent` (closing ref sans claim) survit ; le blocage reste sur chemin
# fermant.
#
# Architecture = le motif etabli par les quatre gates de variation-tag-guard.yml
# : decision dans `scripts/ci/lane_claim_required.py` (testable, verdict JSON
# une ligne, fetcher de commentaires injectable -- les tests ne touchent jamais
# le reseau), YAML reduit a la plomberie, suffixe `-required` sur le nom du job
# pour que `is_advisory()` de scripts/pr_gate.py ne le neutralise pas.

# DORMANT depuis #13384 : les DEUX jobs (required + advisory) sont absorbes
# (run blocks portes verbatim) par always-on-guards.yml -- un seul workflow,
# un seul checkout, un seul slot de runner par PR (37 % de la file CI etait
# les cinq gardes always-on pour ~3 min de travail reel, mesure #13384). Les
# jobs restent ICI en copie de reference pour la tracabilite. NE PAS
# reinscrire pull_request ici sans retirer les organes lane-claim
# d'always-on-guards.

on:
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: lane-claim-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blocking. Nom portant `-required` -> is_advisory() = False (pr_gate.py).
  # Pas de filtre `paths:` : un job filtre par chemin reste `pending` a vie sur
  # les PR hors scope, et un `pending` sur un check requis vaut BLOCKED a vie
  # (cf pr-gate.yml, #10045 regle 2).
  check-lane-claim-required:
    name: 'Require no closing-ref against another lane active claim (block on lane collision, #10223)'
    # Route vers la jambe Linux auto-hebergee (#13378 tranche 5, decision ai-01
    # 2026-09-02) : garde Python pur, sans secret. La garde same-repo ci-dessous
    # saute les PRs de fork (pr_gate.py compte `skipped` comme OK) : aucun code de
    # fork n'atteint le runner. Retour arriere = revert de la PR.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout the lane-claim helper (sparse)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci/lane_claim_required.py
            scripts/check_lane_claim.py
            scripts/grain_tag.py
            scripts/tests/test_check_lane_claim.py
      - name: 'Resolve closing-ref vs other lanes active claims (block on collision)'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set -uo pipefail

          # ATTENTION au shell reel : GitHub invoque ce bloc avec
          # `/usr/bin/bash -e {0}` -- l'errexit est actif, et `set -uo pipefail`
          # ne l'annule pas (cf variation-tag-guard.yml). Ce qui garde ce job
          # correct n'est pas l'absence de `-e`, c'est que chaque commande
          # faillible est dans une condition (`if`/`case`, exempts d'errexit)
          # ou suffixee `|| true`. Jamais `|| true` sur la capture d'un code de
          # retour (`rc=$?` apres `cmd || true` lit le 0 de `true`, pas celui
          # de `cmd` -- desarme le controle en permanence).

          # Hors scope : bots (catalogue auto-regenere) et forks (PRs
          # etudiantes, cf student-pr-reviews.md -- review bienveillante, aucun
          # critere interne ne s'y applique).
          case "$PR_AUTHOR" in
            *"[bot]") echo "Auteur bot ($PR_AUTHOR) : hors scope."; exit 0 ;;
          esac
          if [ "$IS_FORK" = "true" ]; then
            echo "PR issuee d'un fork : hors scope (PR etudiante)."
            exit 0
          fi

          # Body -> fichier. printf '%s' preserve verbatim (pas de newline
          # ajoute, pas d'interpretation des backslash).
          printf '%s' "${PR_BODY:-}" > /tmp/pr_body.txt

          # #10323: GitHub-authoritative closing refs. closingIssuesReferences
          # est ce que GitHub fermera REELLEMENT au merge ; le finder regex
          # seul false-positivait sur un mot-cle fermant dans un code span /
          # une negation ("NOT closing #N") que le parser de GitHub ignore. On
          # fetch une fois et on passe au helper. Sur ECHEC du fetch, on omet
          # l'arg -> le helper retombe sur le regex + warn (ne desarme pas le
          # gate sur un blip reseau). `gh ... --jq` sort 0 sur un set vide
          # (chaine vide), non-zero sur auth/erreur -> le `if` discrimine.
          if PR_CLOSING_REFS=$(gh pr view "$PR_NUMBER" \
              --json closingIssuesReferences \
              --jq '[.closingIssuesReferences[].number] | join(",")' 2>/dev/null); then
            PR_CREFS_ARG=(--pr-closing-refs "$PR_CLOSING_REFS")
          else
            PR_CREFS_ARG=()
            echo "::warning::closingIssuesReferences fetch failed; falling back to regex finder (#10323)."
          fi

          # Le helper fetch chaque issue referencee par mot-cle fermant via
          # `gh issue view`, reduit l'etat des claims, et sort 0 (pass /
          # fail-open) ou 1 (block sur un claim frais d'une autre lane).
          # stderr exempte pour debug.
          python3 scripts/ci/lane_claim_required.py \
            --body-file /tmp/pr_body.txt "${PR_CREFS_ARG[@]}" \
            > /tmp/verdict.json 2>/tmp/verdict.err
          RC=$?

          if [ -s /tmp/verdict.err ]; then
            echo "--- helper stderr ---"
            cat /tmp/verdict.err
          fi
          echo "--- verdict ---"
          cat /tmp/verdict.json

          # Surface des warnings fail-open meme sur le chemin pass (claim
          # perime, echec de fetch) pour que l'auteur voie le vide.
          python3 -c "import json; [print('::warning::'+w) for w in json.load(open('/tmp/verdict.json')).get('warnings',[])]" 2>/dev/null || true

          if [ "$RC" -eq 0 ]; then
            echo "Aucun claim frais d'une autre lane sur un renvoi fermant -- job passes."
            exit 0
          fi

          # Chemin bloquant. Commentaire idempotent via le marqueur HTML
          # invisible (un `synchronize` ne doit pas re-spammer).
          REASON=$(python3 -c "import json; print(json.load(open('/tmp/verdict.json')).get('reason','unknown'))" 2>/dev/null || echo "unknown")
          echo "::error::collision de lane sur une reference fermante: $REASON"

          gh pr comment "$PR_NUMBER" --body "$(cat <<EOF
          <!-- lane-claim-conflict -->
          **Collision de lane sur une reference fermante (#10223).**

          ${REASON}

          Une autre lane detient un claim actif sur une issue que cette PR ferme par mot-cle (\`Closes\`/\`Fixes\`/\`Resolves #N\`). Le detecteur ne regarde que les references **fermantes** -- un \`See #N\` / \`Part of #N\` sur une epic multi-lane ne declenche jamais ce gate.

          Les **trois sorties** pour passer ce gate :
          - la lane detenrice **relache** son claim (\`[RELEASED] lane <machine:workspace>\` sur l'issue concernee), ou
          - le **coordinateur ecrit** un arbitrage (\`[OVERRIDE] lane <cette lane>\` -- c'est la trace qui rend l'override mecaniquement traçable, #10223 Tache 2), ou
          - le claim atteint **48 h** de peremption (le protocole re-arbitre les claims d'une lane inactive).

          Voir #10223 et \`lane-claim-protocol.md\`.
          EOF
          )" 2>/dev/null || true

          exit 1

      # #13336 : controle positif LIVE du contrat de schema gh. Le guard ci-dessus
      # depend de `gh pr view --json state,mergedAt` ; quand gh retire/deplace un
      # champ, TOUT lookup echoue et le gate degenerate silencieusement (v2 -> v1,
      # chaque [DELIVERED] relache son claim -- duplication mesuree sur #13216).
      # Un self-test qui ne tourne jamais ne protege rien (#13331) : ce job a
      # GH_TOKEN et tourne sur chaque PR, le controle vit donc ICI, pas dans
      # scripts-tests.yml (push main, sans token). Le test ne tourne QUE ce
      # controle (skipped hors CI sans LANE_CLAIM_LIVE, le reste de la suite
      # reste hermetique).
      - name: 'Live gh schema self-test (pr-state contract, #13336)'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANE_CLAIM_LIVE: '1'
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest scripts/tests/test_check_lane_claim.py \
            -k test_13336_live_control_real_pr -q

  # Advisory (#10223 Tache 4) : pose deux labels pour mesurer l'adoption du
  # protocole de claim SANS jamais bloquer. Nom portant "advisory" ->
  # is_advisory() = True (pr_gate.py ne compte pas ce job dans le gate
  # required). Le helper sort son verdict (guard_pass + advisory_labels) ; ce
  # job exit 0 quoi qu'il arrive et ne fait que refleter advisory_labels en
  # labels GitHub. Creation idempotente des labels (deja presents -> no-op),
  # pattern des autres jobs advisory (exercises-advisory, markdown-table-guard).
  check-lane-claim-advisory:
    name: 'Advisory lane-claim labels (adoption telemetry, non-blocking, #10223)'
    # Route vers la jambe Linux auto-hebergee (#13378 tranche 5, decision ai-01
    # 2026-09-02) : garde Python pur, sans secret. La garde same-repo ci-dessous
    # saute les PRs de fork (pr_gate.py compte `skipped` comme OK) : aucun code de
    # fork n'atteint le runner. Retour arriere = revert de la PR.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout the lane-claim helper (sparse)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci/lane_claim_required.py
            scripts/check_lane_claim.py
            scripts/grain_tag.py
      - name: 'Apply lane-claim advisory labels'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set -uo pipefail

          # Hors scope : bots et forks (meme gating que le job required).
          case "$PR_AUTHOR" in
            *"[bot]") exit 0 ;;
          esac
          [ "$IS_FORK" = "true" ] && exit 0

          printf '%s' "${PR_BODY:-}" > /tmp/pr_body.txt

          # #10323: meme cross-check closingIssuesReferences que le job required,
          # pour que lane-claim-absent ne se declenche pas sur un mot-cle fermant
          # dans un code span/negation que GitHub ignore.
          if PR_CLOSING_REFS=$(gh pr view "$PR_NUMBER" \
              --json closingIssuesReferences \
              --jq '[.closingIssuesReferences[].number] | join(",")' 2>/dev/null); then
            PR_CREFS_ARG=(--pr-closing-refs "$PR_CLOSING_REFS")
          else
            PR_CREFS_ARG=()
          fi

          # Le helper sort 0/1/2 ; ici on ignore le code (advisory) et on ne
          # lit que advisory_labels. `|| true` garde le job vert meme sur un
          # block du sibling required (le verdict JSON est ecrit sur stdout
          # avant l'exit 1 du block path).
          python3 scripts/ci/lane_claim_required.py \
            --body-file /tmp/pr_body.txt "${PR_CREFS_ARG[@]}" \
            > /tmp/verdict.json 2>/tmp/verdict.err || true

          # #13129 -- surface dead-scope globs as GitHub annotations so the
          # author sees them at the call site (the stderr WARN goes to the
          # job log; `::warning::` lands on the PR Files tab). The advisory
          # job runs `check_lane_claim.py` on the PR body with the PR's
          # declared Grain: lane as `my_lane`, captures `caller_empty_scope`
          # (mirror of the SCOPE_DEAD_GLOB stderr WARN) and emits one
          # annotation per dead glob. Non-blocking on purpose: this is a
          # usability hint, not a gate -- a missing path can be a typo
          # (motif A/C of #13129) or a legitimate future file (#12740).
          # `|| true` keeps the job vert when the verdict is unparseable
          # (legacy/fork paths); the advisory label below is still applied.
          # #13129 -- surface dead-scope globs as GitHub annotations. The
          # author sees the suggestion at the call site (the stderr WARN
          # goes to the job log; `::warning::` lands on the PR Files tab).
          # The annotation format `::warning file=...,title=...::msg` shows
          # in the PR Checks panel -- the lane sees it where they can
          # still correct the typo before pushing again. Delegated to
          # `emit_dead_scope_warnings.py` because the loop spans a line
          # and the GitHub Actions bash shell does not accept a multi-line
          # `python3 -c "..."` literal in a YAML scalar. The helper reads
          # the body file, calls `check_lane_claim.py`, and prints one
          # annotation per dead glob -- non-blocking, fail-CLOSED via
          # `|| true` so an unparseable verdict does not red the job.
          PYTHONPATH=scripts python3 scripts/ci/emit_dead_scope_warnings.py \
            --body-file /tmp/pr_body.txt \
            > /tmp/lc_annotations.txt 2>/dev/null || true
          if [ -s /tmp/lc_annotations.txt ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && echo "$line"
            done < /tmp/lc_annotations.txt
          fi

          # Creation idempotente du seul label survivant. `lane-claim-conflict`
          # a ete RETIRE en #10395 Variante 3 (2026-08-11) : trois mesures
          # (#10370, #10353 et le trio OR-Tools) ont montre qu'il etait pose
          # sur des PRs protocol-conformes (les See #N sur EPIC multi-lane
          # sont le geste prescrit). Les labels existants restent sur le
          # travail passe comme marqueurs historiques; aucun nouveau n'est
          # pose par ce job.
          mk_label() {
            gh label create "$1" --description "$2" --color "$3" --force 2>/dev/null || true
          }
          mk_label "lane-claim-absent" "Closing issue carries no claim at all (#10223)" "fbca04"

          set_label()   { gh pr edit "$PR_NUMBER" --add-label "$1" || true; }
          unset_label() { gh pr edit "$PR_NUMBER" --remove-label "$1" 2>/dev/null || true; }

          # Reflete advisory_labels : pose si present, retire sinon. Fail-safe
          # : si le verdict est illisible (caller error), aucun label n'est
          # dans la liste -> on retire lane-claim-absent.
          has() { python3 -c "import json,sys; sys.exit(0 if '$1' in json.load(open('/tmp/verdict.json')).get('advisory_labels',[]) else 1)" 2>/dev/null; }

          if has "lane-claim-absent"; then set_label "lane-claim-absent"; else unset_label "lane-claim-absent"; fi

          # Nettoyage a la volee des anciens labels `lane-claim-conflict` qui
          # auraient pu etre poses par les versions precedentes du job; on
          # les retire systematiquement pour ne pas laisser un marqueur
          # trompeur sur les PRs recentes.
          unset_label "lane-claim-conflict"

          echo "advisory labels applied."
          exit 0
