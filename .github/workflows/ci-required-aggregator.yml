name: CI Required Aggregator

# Gate de coagulation CI : agrège les check-runs d'une PR en un seul verdict
# PASS/FAIL requis au merge. Voir #9819 pour le diagnostic fondateur
# (incident #9762 : `ci / Lean CI (grothendieck_lean)` rouge au merge,
# `proof-integrity` rouge au merge, `gh pr merge` a passé quand même parce
# que `required_status_checks` est vide sur `main`).
#
# Pourquoi un aggregator check-runs via API et pas un `needs:` cross-workflow :
# GitHub Actions ne permet PAS à un workflow d'avoir un job qui `needs:` les
# jobs d'un AUTRE workflow via workflow_call. Les seules options étaient :
#   - regrouper les jobs des N workflows en UN seul workflow (invasif),
#   - ce pattern : UN workflow qui poll l'API `checks.listForRef`.
# Ce pattern est le moins invasif et le plus rapide à itérer.
#
# La logique de classification/verdict vit dans `scripts/ci/aggregate_checks.py`
# (stdlib only, 0 dépendance externe) — testable via pytest. Le workflow ne
# fait que (a) fetch les check-runs via l'API, (b) pipe NDJSON au script,
# (c) refléter le verdict (exit 1 = setFailed).
#
# Triple trigger pour eviter le faux-negatif "12 PENDING sur la 1ère run" :
#   1. `pull_request` (open/synchronize/reopen) -> verdict frais a chaque push
#   2. `workflow_run` (completed) -> re-run quand un upstream workflow settle
#   3. `check_run` (completed) -> re-run quand un upstream check settle
# Sans (2) ou (3), la 1ère run tire un snapshot souvent-incomplet
# (in_progress upstream) et verdicts BLOCKED-PENDING indefiniment jusqu'au
# prochain push. Le (2)+(3) fait que l'aggregator re-tourne et donne un
# verdict final MERGE-CLEAN des que tous les upstream checks sont completes.
#
# Note : `check_run` peut etre inconsistants selon les orgs/repos (les events
# sont livres par workflow-subscription, et un workflow neuf peut avoir un
# delai de quelques minutes avant la 1ère livraison). `workflow_run` est le
# fallback canonique documente par GitHub pour le cross-workflow trigger.
# On garde les DEUX pour maximiser les chances de re-fire.
#
# Ce workflow n'altère PAS `required_status_checks` (étape 2 owner-only dans
# #9819, gated user explicite). Il tourne, rapporte PASS/FAIL, et attend le
# flip repo setting pour bloquer le merge. Tant qu'il n'est pas enregistré
# comme `required_status_check`, il ne bloque rien -- observation seule.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["*"]
    types: [completed]
  check_run:
    types: [completed]

# Lecture seule sur contents, lecture+écriture checks pour ajouter un
# check_run récapitulatif (optionnel, met fin au débat "où est le verdict").
permissions:
  contents: read
  checks: write

jobs:
  aggregate-checks:
    name: Aggregate upstream check-runs
    runs-on: ubuntu-latest
    # Annule les runs anterieurs pour la meme PR SHA -- sinon le check_run
    # trigger peut empiler 20 runs sur une PR chargee. `cancel-in-progress`
    # garde uniquement le run le plus recent (celui qui voit le SHA le plus
    # a jour, et qui observe le check_run qui vient de finir).
    concurrency:
      group: ci-aggregator-${{ steps.resolve.outputs.pr_number || github.run_id }}
      cancel-in-progress: true
    # Le job regarde ce que les AUTRES workflows ont produit. Si pas de
    # check-runs à observer (PR ouverte depuis peu, ou self-only PR), on
    # laisse le job fail-safe : core.setFailed avec un message explicite.
    # Pas de skip silencieux -- "un aggregator qui ne peut pas rougir n'est
    # pas un aggregator" (cf #9819 acceptance criterion 1).
    steps:
      - name: Resolve head SHA + PR number
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Resolution uniforme entre pull_request / check_run / workflow_run :
          #   - pull_request : direct via github.event.pull_request.{number,head.sha}
          #   - check_run : head_sha direct, PR via /commits/{sha}/pulls
          #   - workflow_run : head_branch + head_sha via github.event.workflow_run,
          #                    PR via /commits/{sha}/pulls (plus robuste que
          #                    pull_requests[] qui peut etre vide)
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "trigger=pull_request"
            exit 0
          fi
          # pull_request absent : on est sur check_run ou workflow_run
          if [ -n "${{ github.event.check_run.head_sha }}" ]; then
            HEAD_SHA="${{ github.event.check_run.head_sha }}"
            echo "trigger=check_run"
          elif [ -n "${{ github.event.workflow_run.head_sha }}" ]; then
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
            echo "trigger=workflow_run"
          else
            echo "::error::Unknown event type: cannot resolve head_sha"
            exit 1
          fi
          PR_DATA=$(gh api -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/commits/${HEAD_SHA}/pulls" \
            | jq -c '[.[] | select(.state == "open")] | .[0]')
          PR_NUMBER=$(echo "${PR_DATA}" | jq '.number // empty')
          if [ -z "${PR_NUMBER}" ]; then
            echo "::warning::No open PR found for head_sha=${HEAD_SHA} (workflow may have run on main directly, skipping)"
            exit 0
          fi
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch upstream check-runs
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Récupère tous les check-runs pour ce SHA, paginé.
          # On utilise `gh api` (déjà authentifié via GITHUB_TOKEN) plutôt que
          # github-script pour rester proche d'un script shell testable localement.
          ALL_RUNS="[]"
          PAGE=1
          while :; do
            PAGE_DATA=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/commits/${{ steps.resolve.outputs.head_sha }}/check-runs?per_page=100&page=${PAGE}")
            PAGE_RUNS=$(echo "${PAGE_DATA}" | jq -c '.check_runs')
            PAGE_COUNT=$(echo "${PAGE_RUNS}" | jq 'length')
            ALL_RUNS=$(jq -c -s 'add' <(echo "${ALL_RUNS}") <(echo "${PAGE_RUNS}"))
            echo "Fetched page ${PAGE}: ${PAGE_COUNT} check-runs (total so far: $(echo "${ALL_RUNS}" | jq 'length'))"
            if [ "${PAGE_COUNT}" -lt 100 ]; then
              break
            fi
            PAGE=$((PAGE + 1))
          done
          echo "${ALL_RUNS}" > check_runs.json
          echo "Total check-runs saved to check_runs.json: $(jq 'length' check_runs.json)"

      - name: Aggregate verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # NDJSON : un check-run par ligne (format robuste consommé par
          # aggregate_checks.main() — accepte aussi JSON array / API envelope).
          jq -c '.[]' check_runs.json | python scripts/ci/aggregate_checks.py
