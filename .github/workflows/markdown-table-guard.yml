name: Markdown table syntax advisory

# Source-level lint for GFM markdown table syntax defects (#10097, sub-issue of
# #3966). The scanner (scripts/notebook_tools/scan_md_table_syntax.py) detects
# seven pathologies that break table rendering: COL_MISMATCH (bare unescaped |
# in a cell), CODE_SPAN_PIPE and notebook-only MATH_SPAN_PIPE (the notebook
# renderer does not protect either span), NO_SEP (missing |---| separator),
# NO_BLANK_BEFORE/AFTER (paragraph glued to the table), and ORPHAN_TABLE_ROW.
# This workflow makes
# defects in *.ipynb markdown cells and *.md / README* files VISIBLE on the PR.
#
# ADVISORY, never blocking (mirrors exercises-advisory.yml, #8814 acceptance 5):
# the job ALWAYS exits 0. The actionable payload is the `markdown-table-syntax`
# LABEL, never the green job conclusion (which is green by construction). A
# reviewer who reads only "exit 0" as "conforming" has read the wrong signal.
#
# Advisory (not blocking) on purpose: the day-1 fleet residual is non-trivial
# (LaTeX-heavy families carry genuine d-sep / norm-bar cases), and GitHub's
# renderer is lenient on some NO_BLANK_BEFORE cases. Surfacing for human triage
# is the right grain; promoting to a blocking gate is a separate decision, to
# revisit once the residual is at 0 and stable (cf exercises-advisory "Hors
# scope").
#
# Per-PR scope: runs the scan ONLY on the *.ipynb / *.md modified by the PR, not
# a repo-wide scan on every push (the canon scan_md_table_syntax.py consumes the
# path list; the workflow does not re-implement detection).
#
# Tranche 2 #12817: the per-PR fork guard died with the pull_request trigger
# (false under schedule -> job SKIPPED, organ extinguished). The nocturne
# scans the last-24h window of main; labels are PR-only and noop'd at night.

on:
  schedule:
    # Nocturnal sweep -- post-merge main verification.
    # Tranche 1 #12817 : sortir les advisory lourds de pull_request
    # (clone 2.22 Go par run). Stratification user 2026-08-23 :
    # "les jobs lourds devraient être payés une fois par fournée".
    - cron: '15 03 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Upsert the marker-guarded MD-TABLE-SWEEP comment on the rendezvous issue (default: dry-run). See #13660.'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: write
  # Used only to post the marker-guarded sweep comment (#13660); the job stays
  # advisory (exit 0), it never closes anything nor blocks a merge.
  issues: write

concurrency:
  group: markdown-table-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  md-table-syntax-advisory:
    name: "Markdown table syntax advisory (label, non-blocking)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Advisory check on modified notebooks / markdown
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # '' under schedule/dispatch (no PR context) -> nocturne window below.
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          BASE: ${{ github.event.pull_request.base.sha || '' }}
          HEAD: ${{ github.event.pull_request.head.sha || '' }}
          LABEL_DEFECT: markdown-table-syntax
        run: |
          set -uo pipefail

          # ---- Nocturne window (#12817 tranche 2) ----
          # Under schedule/dispatch there is no PR: BASE is empty. Resolve the
          # last 24 h of main so the sweep measures the day's merged apport.
          # Labels are PR-only -- noop'd when there is no PR to label.
          NOCTURNE=0
          if [ -z "${BASE:-}" ]; then
            NOCTURNE=1
            BASE=$(git rev-list -1 --before="24 hours ago" HEAD)
            [ -n "$BASE" ] || BASE=$(git rev-list --max-parents=0 HEAD | tail -1)
            HEAD=$(git rev-parse HEAD)
            PR_NUMBER=""
            echo "Nocturne window: $(git rev-parse --short "$BASE")..$(git rev-parse --short "$HEAD") (24 h of main)"
          fi

          # Added/modified *.ipynb + *.md + README* in the PR (deletions
          # excluded). Skip vendored / archived trees where we do not enforce
          # this (.lake/ Mathlib, docs/_archives/, node_modules).
          # 3-point diff (#10403): merge-base...HEAD -- strictly this PR's apport.
          git diff --name-only --diff-filter=d "$BASE...$HEAD" \
            -- '*.ipynb' '*.md' '*README*' \
            | grep -v -E '^(\.lake/|docs/_archives/|node_modules/)' \
            | grep -v $'\r$' > changed.txt || true
          COUNT=$(wc -l < changed.txt | tr -d ' ')
          echo "Modified *.ipynb/*.md/README* in scope: $COUNT"

          # Label helpers (idempotent).
          ensure_label() {
            gh label create "$1" --description "$2" --color "$3" --force 2>/dev/null || true
          }
          set_label()   { gh pr edit "$PR_NUMBER" --add-label "$1" || true; }
          unset_label() { gh pr edit "$PR_NUMBER" --remove-label "$1" 2>/dev/null || true; }
          if [ "$NOCTURNE" -eq 1 ]; then
            # No PR to label at night: the signal stays in the run output.
            ensure_label() { true; }
            set_label()   { true; }
            unset_label() { true; }
          fi

          ensure_label "$LABEL_DEFECT" "PR introduces a markdown table syntax defect (COL_MISMATCH / CODE_SPAN_PIPE / MATH_SPAN_PIPE / NO_SEP / NO_BLANK_BEFORE/AFTER / ORPHAN_TABLE_ROW). Advisory, non-blocking. See #10097." "d93f0b"

          if [ "$COUNT" -eq 0 ]; then
            echo "No in-scope files to scan."
            unset_label "$LABEL_DEFECT"
            exit 0
          fi

          # Advisory: the job ALWAYS exits 0. The actionable signal is the
          # LABEL decided from the JSON total below.
          python scripts/notebook_tools/scan_md_table_syntax.py $(cat changed.txt) --json > payload.json || true
          cat payload.json

          TOTAL=$(python -c "import json,sys; print(json.load(open('payload.json'))['total_findings'])" 2>/dev/null || echo 0)
          echo "Total table-syntax defects in changed files: $TOTAL"

          if [ "$TOTAL" -gt 0 ]; then
            set_label "$LABEL_DEFECT"
            if [ "$NOCTURNE" -eq 1 ]; then
              echo "::warning::Found $TOTAL markdown table syntax defect(s) in the last-24h window on main. See scan_md_table_syntax.py --check locally."
            else
              echo "::warning::Found $TOTAL markdown table syntax defect(s) in changed files (label '$LABEL_DEFECT' added). See scan_md_table_syntax.py --check locally."
            fi
          else
            unset_label "$LABEL_DEFECT"
            echo "Clean."
          fi

          # ---- Nocturne : upserter le verdict sur une issue de rendez-vous OUVERTE (#13660) ----
          # Patron GRAIN-ORPHANS-SWEEP (#13086) : un verdict qui tombe dans un log
          # planifie que personne n'ouvre est un organe muet (le scan trouvait,
          # personne ne le voyait). On upserte un commentaire marker-garde
          # (MD-TABLE-SWEEP) sur l'issue de rendez-vous. ADVISORY (exit 0) : pas
          # de tag, pas de fermeture, pas de blocage de merge -- on route, ai-01
          # tranche. apply : schedule toujours ; workflow_dispatch seulement si
          # apply=true (defaut dry-run, le corps s'imprime pour controle).
          if [ "$NOCTURNE" -eq 1 ]; then
            WINDOW_DESC="$(git rev-parse --short "$BASE")..$(git rev-parse --short "$HEAD") (24 h de main)"
            EXTRA=""
            if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
              EXTRA="--apply"
            fi
            python scripts/notebook_tools/md_table_sweep_comment.py \
              --payload payload.json --window "$WINDOW_DESC" \
              --issue 13660 $EXTRA || true
          fi
          exit 0
