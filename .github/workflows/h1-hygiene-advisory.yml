name: h1-hygiene-advisory

# Advisory (non-blocking) H1 hygiene signal for notebook PRs (#11840).
# Labels a PR whose ADDED notebooks carry an H1 with inline markdown
# (**bold**, `code`), emojis, or the redundant "Notebook:" prefix — the
# defects the catalog now sanitizes at generation (sanitize_title,
# generate_catalog.py). Never fails a PR: inherited defects are tolerated
# (same frozen-inheritance stance as pip-leak-guard #6314); only NEW
# notebooks are flagged so authors write clean H1s going forward.

on:
  schedule:
    # Nocturnal sweep -- post-merge main verification.
    # Tranche 1 #12817 : sortir les advisory lourds de pull_request
    # (clone 2.22 Go par run). Stratification user 2026-08-23 :
    # "les jobs lourds devraient être payés une fois par fournée".
    - cron: '13 03 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: h1-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  h1-hygiene:
    name: H1 hygiene advisory (label, non-blocking, #11840)
    # Routage #14283 tranche 4 (ai-01 2026-09-02) : balayage cron pur-Python.
    # Declencheur `schedule` uniquement -- il ne tourne que sur la branche par
    # defaut, donc aucun code de fork ne peut l'atteindre et aucune garde
    # same-repo n'est requise (cf en-tete de check_self_hosted_runner_policy.py).
    # Retour arriere = remettre `runs-on: ubuntu-latest` + retrait de l'allowlist.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # base ref must be reachable for the added-files diff

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan notebooks ADDED by the PR (advisory)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # '' under schedule/dispatch (no PR context) -> nocturne window below.
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail

          # ---- Nocturne window (#12817 tranche 2) ----
          # Under schedule, BASE_SHA was empty: `git diff ""..HEAD` failed into
          # `|| true`, ADDED came out empty and the job printed "No notebooks
          # added" every night -- a green no-op masquerading as a scan. Resolve
          # the last 24 h of main so the sweep measures the day's merged apport.
          NOCTURNE=0
          if [ -z "${BASE_SHA:-}" ]; then
            NOCTURNE=1
            BASE_SHA=$(git rev-list -1 --before="24 hours ago" HEAD)
            [ -n "$BASE_SHA" ] || BASE_SHA=$(git rev-list --max-parents=0 HEAD | tail -1)
            PR_NUMBER=""
            echo "Nocturne window: $(git rev-parse --short "$BASE_SHA")..HEAD (24 h of main)"
          fi
          ADDED=$(git diff --name-only --diff-filter=A "$BASE_SHA"..HEAD -- '*.ipynb' || true)
          if [ -z "$ADDED" ]; then
            if [ "$NOCTURNE" -eq 1 ]; then
              echo "No notebooks added in the last-24h window — advisory skips."
            else
              echo "No notebooks added by this PR — advisory skips."
            fi
            exit 0
          fi
          echo "Added notebooks:"; echo "$ADDED"
          # Advisory scan: exit 0 always; findings emit a ::warning and label.
          python scripts/notebook_tools/h1_hygiene_scan.py $ADDED > /tmp/scan.txt || true
          cat /tmp/scan.txt
          if grep -q "scan complete: 0 notebook" /tmp/scan.txt; then
            echo "No H1 hygiene defects in added notebooks."
            exit 0
          fi
          if [ "$NOCTURNE" -eq 1 ]; then
            echo "::warning::H1 hygiene defects in notebooks added by the last-24h window: see scan output above (#11840)"
            exit 0
          fi
          gh label create "h1-hygiene-advisory" \
            --description "Added notebook(s) carry H1 markdown/emoji/'Notebook:' prefix (#11840, advisory)" \
            --color "D4AC0D" --force 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --add-label "h1-hygiene-advisory" 2>/dev/null || true
          echo "::warning::H1 hygiene advisory: see scan output above (#11840)"
