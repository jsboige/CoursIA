name: MD Hierarchy Drift Advisory

# #11831 (EPIC #11829) : une PR qui introduit de nouveaux defauts de rendu
# markdown (headings geants dans des listes, hints-as-heading, ...) ne doit
# plus passer inapercue parce qu'un autre notebook de la meme PR brule
# l'equivalent ailleurs (cas fondateur : PR #11823, 6 hits, CI vert).
#
# Mode ADVISORY au premier tour (mandat de l'issue) : le job reste VERT, un
# commentaire nomme chaque (notebook, kind, delta). Le passage en bloquant
# sera decide ulterieurement une fois le scan stabilise.
#
# La baseline (scripts/notebook_tools/md_hierarchy_baseline.json) est un
# artefact d'automatisation : elle est re-seedee dans le MEME commit que toute
# regle de scanner (via --update-baseline), jamais a la main.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "MyIA.AI.Notebooks/**/*.ipynb"
      - "scripts/notebook_tools/scan_md_hierarchy.py"
      - "scripts/notebook_tools/md_hierarchy_baseline.json"
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  drift:
    name: scan_md_hierarchy drift (advisory)
    # Routage #14283 tranche 3 (decision ai-01 2026-09-02) : jambe Linux
    # auto-hebergee. Le `if:` ci-dessous est la garde anti-fork exigee par
    # scripts/ci/check_self_hosted_runner_policy.py ; un `runs-on` STATIQUE la
    # rend auditable (une expression dynamique leve DYNAMIC_RUNS_ON).
    # Les PRs de fork sautent le job -- pr_gate.py compte `skipped` comme OK.
    # Retour arriere = remettre `runs-on: ubuntu-latest` + retrait de l'allowlist.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Drift check vs baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # #12735: le gate juge l'apport de la PR, pas le corpus entier contre
          # une baseline burndown. On restreint le scan aux notebooks que la PR
          # a reels changes (git -M resout les renommages) ; a defaut (dispatch,
          # BASE_SHA vide) on retombe sur un drift whole-corpus.
          # #13315: la reference "avant" est la BASE DE FUSION re-scannee
          # (--reference-base), pas la baseline stockee -- une PR basee sur un
          # main ancien ne doit pas voir imputer la derive de la baseline. Le
          # mode fallback (sans BASE_SHA) garde la baseline stockee, et la
          # phrase du commentaire est alors attenuee.
          EXTRA=""
          SCOPED=0
          if [ -n "$BASE_SHA" ]; then
            git diff -M --name-status "$BASE_SHA...$HEAD_SHA" \
              -- 'MyIA.AI.Notebooks/' > name_status.txt
            EXTRA="--name-status name_status.txt --reference-base $BASE_SHA"
            SCOPED=1
          fi
          set +e
          python scripts/notebook_tools/scan_md_hierarchy.py MyIA.AI.Notebooks/ \
            --baseline --diff $EXTRA > drift_report.txt 2> drift_err.txt
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            {
              echo "## MD hierarchy drift -- ${HEAD_SHA:0:9}"
              echo ""
              if [ "$SCOPED" -eq 1 ]; then
                echo "Cette PR augmente le compte de defauts de rendu markdown"
                echo "par rapport a la base de fusion ${BASE_SHA:0:9} re-scannee."
                echo "Nouveaux defauts imputables au diff :"
              else
                echo "Drift vs la baseline stockee (mode dispatch, sans base de"
                echo "fusion) -- derive du corpus, pas d'imputation stricte a ce"
                echo "diff. Details :"
              fi
              echo ""
              echo '```'
              cat drift_report.txt
              echo '```'
              echo ""
              if [ "$SCOPED" -eq 1 ]; then
                echo "Corriger (ex. \`- # Indice : ...\` -> \`- **Indice :** ...\`). See #11831."
              else
                echo "Si la regle scanner change dans CETTE PR, re-seeder la baseline"
                echo "dans le meme commit : \`--update-baseline\`. See #11831."
              fi
            } > comment_body.md
            gh pr comment "$PR_NUMBER" --body-file comment_body.md
            echo "::warning file=scripts/notebook_tools/md_hierarchy_baseline.json::MD hierarchy drift detected (advisory, #11831) -- see PR comment"
            exit 0
          elif [ "$rc" -eq 1 ]; then
            echo "::error::scan_md_hierarchy drift mode broken (unreadable baseline / vacuous scan):"
            cat drift_err.txt
            exit 1
          fi
          if [ "$SCOPED" -eq 1 ]; then
            echo "No drift imputable au diff de la PR (reference = base de fusion ${BASE_SHA:0:9} re-scannee)."
          else
            echo "No drift: every per-notebook delta <= 0."
          fi
