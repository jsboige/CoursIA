name: Stale-claim gate (advisory)

# Organe #18354 tranche 1 (campagne d'audit #17073) : une cellule
# markdown d'interprétation qui affirme une valeur de mesure absente de
# TOUS les outputs committés du carnet -- canoniquement un nombre
# importé d'un twin ou d'un autre notebook (App-4b : « ≈ 12 » affiché,
# optimum réel committé 11 ; App-3 : « > 80% » de satisfaction sans
# output local).
#
# Pourquoi ADVISORY (patron #11435 markdown-claims-output-advisory) :
# la prose pédagogique cite légitimement des approximations décrivant
# des figures committées en image ou des données d'outils distants --
# plancher FP mesuré 29/09 : 19 findings / 30 carnets sains après
# gardes (statistiques de convention, années, versions, durées,
# dimensions, ordres de grandeur). Un blocage exigerait un détecteur
# plus étroit ; le bon modèle est rapport + triage reviewer, jamais
# blocage seul.

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'MyIA.AI.Notebooks/**/*.ipynb'
      - 'scripts/check_stale_claims.py'
      - 'scripts/tests/test_check_stale_claims.py'
      - '.github/workflows/stale-claim-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: stale-claim-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stale-claim-advisory:
    name: "Stale-claim gate (#18354 advisory)"
    # Routage #14283 tranche 3 : jambe Linux auto-hebergee. La garde
    # anti-fork exigee par scripts/ci/check_self_hosted_runner_policy.py :
    # runs-on STATIQUE auditable ; les PRs de fork sautent le job.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run unit tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest scripts/tests/test_check_stale_claims.py -v

      - name: Run detector (advisory, do not gate)
        id: run
        run: |
          set +e
          # Scan ONLY the diff (#11873 defect 1 : un balayage corpus
          # produit un rouge-permanent ignoré). Abstention explicite si
          # merge-base introuvable (#11754 frozen-inheritance).
          BASE=$(git merge-base origin/main HEAD 2>/dev/null)
          if [ -z "$BASE" ]; then
            echo "exit=abstain" >> "$GITHUB_OUTPUT"
            echo "::warning::stale-claim: merge-base introuvable -- detector abstains." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mapfile -t CHANGED < <(git diff --name-only --diff-filter=MR -M50% "$BASE" HEAD -- '*.ipynb' | head -50)
          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "exit=0" >> "$GITHUB_OUTPUT"
            echo "::notice::stale-claim: aucun notebook modifie -- rien a scanner." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python scripts/check_stale_claims.py --json "${CHANGED[@]}" \
            > /tmp/stale-claim.json 2> /tmp/stale-claim.err
          rc=$?
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
          echo "report=present" >> "$GITHUB_OUTPUT"
          if [ $rc -ne 0 ] && [ $rc -ne 1 ]; then
            echo "::warning::stale-claim: detector exit code $rc (not 0/1)." >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/stale-claim.err >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set -e

      - name: Upload structured advisory report
        if: steps.run.outputs.report == 'present'
        uses: actions/upload-artifact@v4
        with:
          name: stale-claim-report
          path: /tmp/stale-claim.json
          retention-days: 7

      - name: Post advisory comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: stale-claim-advisory
          message: |
            ${{ steps.run.outputs.exit == '0' && '✅ No stale numeric claim detected in the notebooks this PR changed (interpretation cells checked against ALL committed outputs).' || steps.run.outputs.exit == 'abstain' && '⚠️ Stale-claim detector abstained (merge-base introuvable).' || '⚠️ Stale-claim review needed: an interpretation cell claims a measured value absent from ALL committed outputs of the notebook (likely imported from a twin/other notebook, #18354). Advisory, NOT a merge gate — triage against the JSON artifact.' }}
