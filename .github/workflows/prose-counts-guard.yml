name: prose-counts-guard

# Les donnees quantitatives sont tenues par le CI, pas par la prose manuelle
# (mandat user 2026-08-04, registre #9377).
#
# Le catalogue genere a ete mis en place parce que les agents ouvraient des PR
# sans fin pour resynchroniser des decomptes de notebooks. Le genre a survecu en
# migrant vers la prose, ou aucun generateur ne l'atteint : 11 PR de resynchro
# mergees en 3 semaines au 2026-08-04, dont une (#9153) dont le titre avoue
# « re-drift post #6914 ».
#
# Le guard ne juge que les lignes AJOUTEES : le stock existant (#9377) ne fait
# echouer personne. BLOQUANT depuis #17636 (critere de sortie de #9377 : « le
# guard est passe en bloquant », mandat user 2026-08-04) -- la seconde moitie
# du critere (stock a 0) se resorbe separemment, par tranches de serie. Une PR
# qui ajoute un compteur quantitatif en prose rougit ; l'echec du check-run
# EST le signalement, visible sans ouvrir les logs.
#
# Historique #17636 : la phase advisory etait MUE -- le checker rendait rc=0
# avec ses findings noyes dans le log, le workflow ne posait aucun label (il
# n'a jamais eu la permission `issues: write`), et le commentaire d'origine
# promettait ce label. #17029 a fusionne ainsi, revertee par #17632.

on:
  pull_request:
    paths:
      - '**/*.ipynb'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: prose-counts-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prose-counts:
    # Route vers la jambe Linux auto-hebergee (#13378 tranche 1, decision ai-01
    # 2026-09-01) : garde Python pur, sans secret ni usage du GITHUB_TOKEN. La garde
    # same-repo ci-dessous saute les PRs de fork (pr_gate.py compte `skipped` comme
    # OK) : aucun code de fork n'atteint le runner. Retour arriere = revert de la PR.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Shallow checkout (fetch-depth: 2) instead of full history. The
          # base ref is then fetched explicitly with depth=1, so the diff
          # below still works. Issue #11835 — saves the bulk of CI time
          # on the 2.1 Go repo (was ~120 s of clone-time per push).
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compteurs quantitatifs ajoutes en prose
        run: |
          # `checkout@v4` avec `fetch-depth: 2` ne tire que le HEAD et son
          # parent -- `origin/<base_ref>` n'est PAS present. Un fetch
          # explicite depth=1 le ramene. Le commentaire anterieur precisait
          # qu'un `--depth=0` etait invalide (entier positif exige) ; ce
          # fetch est depth=1, donc legal, et tient en quelques Ko.
          git fetch --depth=1 origin "${{ github.base_ref }}" -q
          python scripts/notebook_tools/check_prose_quantitative_claims.py \
            --diff "origin/${{ github.base_ref }}...HEAD" --strict
