name: Translation Guard

# Purpose
# -------
# PREVENT agents/humans from hand-editing translation-owned files on feature
# branches. Translations are DERIVED artifacts (like the catalog), owned by:
#   - translation-sync.yml  (per-PR auto-commit bot, same-repo PRs)
#   - the T1/T3/T4 toolchain (extract_cells_to_csv.py -> translate_csv.py
#     -> render_notebook.py, scripts/translation/)
#
# The source of truth for multilingual alignment is the NOTEBOOK in its source
# language (FR) + the translation CSV (translations/<famille>/<serie>.csv). A
# PR that edits a *_<lang>.ipynb or a translations/** CSV by hand breaks the
# invariant: the next run of translation-sync.yml would regenerate (and
# silently overwrite) the hand-edit. This is the exact analog of the
# stale-catalog-silent-revert pattern (#2744/#2632), applied to translations.
#
# Owned files (FAIL if a non-bot author touches them):
#   - translations/**                      (the sync CSVs, derived from notebooks)
#   - MyIA.AI.Notebooks/**/*_{en,ru,pt,es,ar,fa,zh}.ipynb  (rendered translations)
#
# Exceptions:
#   - github-actions[bot]  (translation-sync.yml auto-commits)
#   - workflow_dispatch    (emergency maintainer override)
#
# See #10038 (i18n umbrella), #10042 (grain C), #4957 (infra design).

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: "No hand-edited translation files on feature branch"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for translation-owned file changes
        id: check
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          # Allow the translation auto-sync bot to bypass this check entirely.
          if [ "$PR_AUTHOR" = "github-actions[bot]" ]; then
            echo "::notice title=Translation guard::Author is github-actions[bot] (translation-sync automation) — guard bypassed."
            echo "bypass=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For workflow_dispatch (no pull_request context), skip.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::notice title=Translation guard::Manual dispatch — guard bypassed."
            echo "bypass=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3-dot diff: translation-owned files changed on the PR branch.
          # translations/** = sync CSVs (derived). *_<lang>.ipynb = rendered
          # translation notebooks (derived by render_notebook.py T4). Target
          # langs match check_perimeter.py TARGET_LANGS (en/es/ar/fa/zh/ru/pt),
          # the single source of truth (#10109).
          #
          # Hand-edit = modification d'un fichier dérivé déjà présent sur
          # origin/<base>. L'ajout d'un nouveau fichier dérivé (jamais présent
          # sur main, premier rendu d'un notebook source) est **légitime** : il
          # ne peut pas avoir été hand-édité puisque pas encore commit. On le
          # laisse passer ; translation-sync.yml le reprendra ensuite depuis
          # le CSV comme tout autre _en.ipynb. Cf. #10307 (cycle c.190 --
          # premier cas déclencheur : PR #10306 deep_research_optimization_en
          # jamais rendu auparavant).
          ALL_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- \
            'translations/**' \
            'MyIA.AI.Notebooks/**/*_en.ipynb' \
            'MyIA.AI.Notebooks/**/*_ru.ipynb' \
            'MyIA.AI.Notebooks/**/*_pt.ipynb' \
            'MyIA.AI.Notebooks/**/*_es.ipynb' \
            'MyIA.AI.Notebooks/**/*_ar.ipynb' \
            'MyIA.AI.Notebooks/**/*_fa.ipynb' \
            'MyIA.AI.Notebooks/**/*_zh.ipynb' \
            || true)

          # Reduce to files that ALREADY EXIST on the base. New files
          # (additions) are produced by the legitimate rendering pipeline
          # for a notebook that wasn't translated before — see comment above.
          CHANGED=""
          for f in $ALL_CHANGED; do
            if git cat-file -e "origin/${{ github.base_ref }}:$f" 2>/dev/null; then
              CHANGED="$CHANGED $f"
            else
              echo "::notice title=Translation guard::$f -- new file on feature branch (not on base), allowed."
            fi
          done
          CHANGED="${CHANGED# }"   # strip leading whitespace

          if [ -z "$CHANGED" ]; then
            echo "::notice title=Translation guard::No translation-owned files MODIFIED — clean."
            echo "violated=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Translation guard FAILED::PR modifies translation-owned files that are generated by automation ($CHANGED). See #10042 and #10038. Edit the source notebook (FR) instead; the bot re-derives translations."
            echo ""
            echo "## Translation Guard Violation" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "This PR modifies translation-owned (derived) files:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            for f in $CHANGED; do
              echo "- \`$f\`" >> "$GITHUB_STEP_SUMMARY"
            done
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### How to fix" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Translation CSVs (\`translations/**\`) and rendered notebooks (\`*_<lang>.ipynb\`) are **derived** from the source notebook + the T1/T3/T4 toolchain. Edit the **source notebook** (FR) instead; \`translation-sync.yml\` re-extracts, re-translates (changed cells only), and re-renders automatically." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```bash' >> "$GITHUB_STEP_SUMMARY"
            echo "git checkout origin/main -- $CHANGED" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "See [#10038](https://github.com/${{ github.repository }}/issues/10038) (i18n umbrella) and [#10042](https://github.com/${{ github.repository }}/issues/10042) (grain C)." >> "$GITHUB_STEP_SUMMARY"
            echo "violated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if violated
        if: steps.check.outputs.violated == 'true'
        run: |
          echo "::error title=Translation guard FAILED::This PR modifies translation-owned (derived) files. Restore them with: git checkout origin/main -- translations/ <lang-notebooks>, and edit the source notebook instead."
          exit 1
