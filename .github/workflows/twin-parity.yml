name: Twin Parity Check

# Purpose: FAIL any PR that introduces DRIFT or MISSING in the twin parity
# register (#8057, parent #4208). The register lists every Python/C# twin
# pair and the git blob SHA of each notebook at the time of the last audit;
# this workflow re-runs the check against the PR's merge ref and fails if a
# notebook has moved without a re-audit (parite silently broke) or if a path
# is now missing (typo, deletion, twin never created).
#
# Why BLOCKING (unlike catalog-drift.yml): the twin parity check is the
# safety net for the structural parity of bilingual notebooks (Search/CSP,
# ML.NET, Z3/SMT, SemanticWeb, Probas/InferNET, GameTheory/.NET). A silent
# drift means the two implementations diverge without anyone re-auditing;
# this directly contradicts #4956 ("parity Python/C# marathon") and #8057
# ("metadonnee de parite auditable, pas declarative"). Blocking is the only
# way to make the auditable promise real.
#
# Per-pair semantics (#8264): the workflow runs in `--per-pair --base
# <commit>` mode, comparing the registry + blob SHAs at the PR's HEAD vs
# at the PR's base (#22292) -- `github.event.pull_request.base.sha`, the main
# GitHub built the merge on; `origin/main` only when there is no PR base
# (`workflow_dispatch`). The gate FAILS only on pairs that the PR
# itself has moved (base=OK, head=DRIFT/MISSING) or introduced/removed
# without rebaseline. Drift already present at the base is reported as
# `drift_pre_existing` but does NOT fail the gate -- it belongs to a
# dedicated rebaseline PR (cf #8264 batch precedent: #8282, #8289, #8322,
# #8372). This keeps the gate green for legitimate single-side edits while
# still surfacing fleet-wide stale SHAs through the report.
#
# Pattern: the worker who edits a twin must either re-audit and rebaseline the
# SHAs in the registry -- `python scripts/notebook_tools/check_twin_parity.py
# --update --pair "<entry name>" --by "<machine:workspace>"` (the selector is
# mandatory, cf #8508; the write is surgical, cf #8570) -- OR split the edit so
# the twin moves in lockstep on the same PR. The workflow tells them which side
# has drifted.
#
# Two remediation lots, selected on the per-pair `head_status` (vocabulary
# OK / DRIFT / NUMBERING-DRIFT / MISSING) and never on `verdict` alone:
# a content drift (both notebooks present, blob SHA moved) gets the rebaseline
# command; a DELETED notebook (base_status=OK, head_status=MISSING) gets an
# explicit deletion notice and its two real fixes -- a rebaseline attests a
# content fingerprint, it cannot restore a missing file.
#
# Third lot (#22920): STALE_BRANCH -- a pair MOVED by the base branch after the
# PR forked (the PR tree's registry still declares the old path). The rebaseline
# command would be WRONG here: it attests a path main has already abandoned, and
# the attestation regresses the registry at merge. The remediation line is
# `gh pr update-branch` + redo the work on the new paths. Stale pairs get their
# own counter (`stale_branch`) and are never counted in `drift_introduced`.
#
# Paths watched:
#   - scripts/notebook_tools/twin_pairs.d/** (registry file-per-entry, #8542)
#   - scripts/notebook_tools/check_twin_parity.py (the tool itself)
#   - All jumeau notebooks: MyIA.AI.Notebooks/**/*.ipynb (broad pattern;
#     the tool itself filters down to the pairs in the registry).
#
# Reuses the proven structure of catalog-drift.yml (read-only checkout of
# the PR merge ref, run tool, surface result) but FAILS on DRIFT_INTRODUCED.

on:
  pull_request:
    paths:
      - 'scripts/notebook_tools/twin_pairs.d/**'
      - 'scripts/notebook_tools/check_twin_parity.py'
      - 'MyIA.AI.Notebooks/**/*.ipynb'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twin-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  twin-parity:
    name: "Twin parity audit (#8057)"
    # 2026-10-27 (#22461, phase A du debordement, appliquee ici dans un PR
    # DISTINCT de #22921 -- ce workflow en avait ete explicitement exclu de
    # #22921 pour cause de G-VAR-3, cf le commit d'exclusion) : forme
    # hybride de debordement -- PR meme-depot ET
    # vars.CI_OVERFLOW_LOCAL == 'true' -> jambe Linux locale ; tout le reste
    # (variable absente ou fausse, fork, workflow_dispatch) retombe sur
    # ubuntu-latest (l'etat du 27/10). Bascule :
    # `gh variable set CI_OVERFLOW_LOCAL --body true|false --repo jsboige/CoursIA`.
    # 2026-10-27 (apres le merge de #22921, squash 0c7affa2927) : la garde
    # de debordement et l'instrument qui l'authentifie sont sur `main` ;
    # l'exclusion PROVISOIRE de twin-parity.yml (commit d'exclusion, G-VAR-3)
    # n'a jamais ete mergee -- ce workflow passe donc par une PR a part, dont
    # le diff ne porte que ce fichier.
    # La garde anti-fork ci-dessous est CONSERVEE : aucun code de fork ne
    # change de surface.
    # Limite : runs-on se resout a la creation du job, les runs deja en file
    # ne bougent pas.
    # Retour arriere = variable a `false` ou supprimee : routage 100 %
    # heberge, sans toucher ce fichier.
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository && vars.CI_OVERFLOW_LOCAL == 'true') && fromJSON('["self-hosted","coursia-ephemeral","coursia-linux"]') || 'ubuntu-latest' }}
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    # Borne de securite (incident du 15/10) : la forme hybride renvoie ce job
    # sur nos slots ephemeres, ou un run fige (checkout `filter: blob:none`
    # sans borne) tient un slot pendant 6 h -- le defaut d'Actions -- et le
    # retire aux PR gates. 16 des 18 slots ephemeres etaient occupes de
    # cette facon le 15/10, et le workflow a du etre desactive a 07:26Z
    # pour liberer le parc (104 runs en file annules).
    # Duree mesuree sur 20 runs verts heberges : mediane 1,3 min, max 4,7 min
    # -> borne a 20 min (marge large pour le parc local, plus lent que
    # l'heberge sur un clone `fetch-depth: 0`).
    timeout-minutes: 20

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run twin parity check
        id: check
        # `EVENT`/`PR_BASE` are read from the event, never derived from the shape of the
        # checkout: a branch whose tip happens to BE a merge commit passes a bare `HEAD^2`
        # test, and HEAD^1 would then be that branch's first parent -- not main.
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          # Separate stdout (the JSON report, the machine contract) from stderr (diagnostics).
          # Previously `OUTPUT=$(... 2>&1)` merged tool warnings (missing-notebook notices etc.,
          # check_twin_parity.py emits 6 `print(..., file=sys.stderr)` sites) INTO the JSON file,
          # so json.load crashed with "Extra data" and the gate failed with a raw traceback on
          # any PR where a warning fired -- masking the real drift verdict. Direct redirection
          # captures python's exit code correctly AND keeps the report pure JSON.
          # Base = the main GitHub built the merge on (#22292). `origin/main` is re-fetched when
          # the job STARTS; after hours in the queue it is newer than the merge ref, and every
          # pair rebaselined on main in between reads DRIFT here and OK there -- a
          # DRIFT_INTRODUCED on a PR that never touched it (#22218, 2026-10-24: 11 pairs,
          # 117 main commits between the two reads). A stack PR is also covered: its base is
          # the parent branch, which is the truth for a drift-introduced gate.
          BASE=origin/main
          if [ "$EVENT" = "pull_request" ] && git rev-parse -q --verify "$PR_BASE^{commit}" >/dev/null; then
            BASE="$PR_BASE"
          fi
          # Resolved ONCE, and the commit id is what gets passed: every message below -- and the
          # tool's own "Impossible de lire le registre au base-ref '<ref>'" when a promisor blob
          # fetch fails under `filter: blob:none` -- then names a checkable object instead of a
          # moving ref name.
          BASE_SHA="$(git rev-parse --verify "$BASE^{commit}")"
          echo "Twin parity base: $BASE = $BASE_SHA"
          python scripts/notebook_tools/check_twin_parity.py --json --check --per-pair --base "$BASE_SHA" > twin_parity_report.json 2>twin_parity_stderr.log
          EXIT=$?
          set -e
          if [ -s twin_parity_stderr.log ]; then
            echo "Twin-parity tool diagnostics (stderr, non-fatal):"
            cat twin_parity_stderr.log
          fi
          # Guard: fail with a CLEAR ::error if the report is unparseable, instead of a raw
          # json.load traceback. The report must be stdout-only JSON (stream separation above).
          if ! python -c "import json; json.load(open('twin_parity_report.json'))" 2>/dev/null; then
            echo "::error title=Twin parity report unparseable::The JSON report (twin_parity_report.json) could not be parsed. Tool exit was $EXIT. Report tail + stderr are shown below and uploaded as artifacts. This indicates the report stream was corrupted or the tool crashed before emitting JSON (see #8957 stream-separation fix)."
            echo "Base ref resolved to $BASE = $BASE_SHA. If the tool reports it cannot READ the registry, suspect a promisor blob fetch (partial clone, blob:none) before the ref itself: re-verify this commit is present with \`git cat-file -e $BASE_SHA^{commit}\`."
            echo "--- report tail (last 400 chars) ---"
            tail -c 400 twin_parity_report.json || true
            echo "--- stderr ---"
            cat twin_parity_stderr.log 2>/dev/null || true
            exit 1
          fi
          if [ $EXIT -eq 0 ]; then
            INTRO=$(python -c "import json; d=json.load(open('twin_parity_report.json')); print(d.get('drift_introduced',0))")
            PRE=$(python -c "import json; d=json.load(open('twin_parity_report.json')); print(d.get('drift_pre_existing',0))")
            STALE=$(python -c "import json; d=json.load(open('twin_parity_report.json')); print(d.get('stale_branch',0))")
            echo "drift_introduced=$INTRO" >> "$GITHUB_OUTPUT"
            echo "drift_pre_existing=$PRE" >> "$GITHUB_OUTPUT"
            echo "stale_branch=$STALE" >> "$GITHUB_OUTPUT"
            echo "Twin parity OK : $PRE paire(s) en DRIFT pre-existant (base=$BASE_SHA) ne fail pas le gate (rellevent d'une PR de rebaseline dediee, cf #8264)."
          elif [ $EXIT -eq 1 ]; then
            INTRO=$(python -c "import json; d=json.load(open('twin_parity_report.json')); print(d.get('drift_introduced',0))")
            PRE=$(python -c "import json; d=json.load(open('twin_parity_report.json')); print(d.get('drift_pre_existing',0))")
            STALE=$(python -c "import json; d=json.load(open('twin_parity_report.json')); print(d.get('stale_branch',0))")
            echo "drift_introduced=$INTRO" >> "$GITHUB_OUTPUT"
            echo "drift_pre_existing=$PRE" >> "$GITHUB_OUTPUT"
            echo "stale_branch=$STALE" >> "$GITHUB_OUTPUT"
            echo ""
            echo "--------------------------------------------------------------"
            echo "  Twin parity : $INTRO paire(s) mise(s) en DRIFT ou SUPPRIMEE(S)"
            echo "  par cette PR, et $STALE paire(s) de branche PERIMEE (paire"
            echo "  deplacee sur la branche base apres le fork, cf #22920)."
            echo "  Le registre stocke le git blob SHA de chaque jumeau : TOUTE"
            echo "  edition le deplace, y compris markdown-only."
            echo "  Tu rebaselines pour ATTESTER la parite, pas pour la reparer."
            echo "  Un carnet SUPPRIME n'est PAS une derive : le rebaseline ne"
            echo "  restaure pas un fichier supprime (il echoue ou ne fait rien)."
            echo "  Une paire STALE-BRANCH n'est PAS ta derive : le rebaseline y"
            echo "  serait FAUX, le remede est gh pr update-branch (#22920)."
            echo ""
            echo "  Re-audite la paire firsthand, puis applique la remediation"
            echo "  du lot qui la concerne ci-dessous :"
            echo ""
            # Capture the remediation block so we can put it INTO the
            # ::error annotation (#10391). The annotation is the ONLY output a
            # lane sees without opening the job log -- four lanes stalled a
            # night on this gate because the annotation said "see the log above"
            # instead of carrying the command.
            #
            # Three lots, selected in check_twin_parity.py (unit-tested there,
            # never re-inlined here): content drift -> rebaseline command;
            # DELETED notebook (head_status == "MISSING") -> deletion notice, a
            # rebaseline cannot restore a file; STALE_BRANCH (#22920, pair moved
            # by the base branch after the fork) -> `gh pr update-branch`, a
            # rebaseline on the abandoned paths would regress the registry at
            # merge. The selection lives in check_twin_parity.py
            # (split_introduced_pairs / split_stale_pairs /
            # render_introduced_remediation).
            CMDS=$(python -c "import json,sys; sys.path.insert(0,'scripts/notebook_tools'); import check_twin_parity as ctp; d=json.load(open('twin_parity_report.json')); print('\n'.join(ctp.render_introduced_remediation(d.get('pairs',[]))))")
            echo "$CMDS" | sed 's/^/    /'
            echo "  Pour une paire en DRIFT de contenu, l'ecriture est"
            echo "  chirurgicale (#8570) : seules les lignes last_audit de cette"
            echo "  paire changent. Ajoute une ligne en tete de"
            echo "  known_differences expliquant l'edition, puis commit."
            echo "--------------------------------------------------------------"
            echo ""
            # Workflow-command escaping for the annotation body: %0A = newline,
            # %25 = literal %, %0D = CR. Without %0A the annotation truncates at
            # the first newline and the multi-line command is lost.
            CMDS_ANN=${CMDS//$'\n'/%0A}
            echo "::error title=Twin parity DRIFT INTRODUCED by this PR::La PR a introduit $INTRO paire(s) en DRIFT/MISSING qui etaient OK au base-ref $BASE_SHA, et $STALE paire(s) STALE-BRANCH (paire deplacee sur la branche base apres le fork #22920). Applique la remediation du lot qui la concerne (le selecteur --pair est obligatoire #8508, lecons L963/L974) :%0A%0A$CMDS_ANN%0A%0A--update va en DERNIER et ne concerne QUE les paires en DRIFT de contenu : si le DRIFT vient d'une normalisation outillee (strip_probe_banner.py / strip_machine_paths.py / scrub_papermill_paths.py), these strips deplacent le blob SHA -- attester PUIS stripper invalide l'attestation (#8957). Un carnet SUPPRIME ne se rebaseline pas : restaure-le dans la PR, ou retire l'entree du registre si la suppression est voulue. Une paire STALE-BRANCH ne se rebaseline PAS non plus : gh pr update-branch, puis rejoue le travail sur les nouveaux chemins -- un rebaseline sur les anciens chemins regresserait le registre au merge (#22920). L'ecriture est chirurgicale et preserve les commentaires du registre (#8570). Alternative : splitter la PR pour que chaque cote evolue separement. Drift pre-existant ($PRE paire(s)) releve d'une PR dediee cf #8264. Voir twin_parity_report.json dans les artifacts."
            exit 1
          else
            echo "::error title=Twin parity tool error::Erreur d'execution du check (exit $EXIT). Voir les logs ci-dessus."
            exit $EXIT
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twin-parity-report
          path: |
            twin_parity_report.json
            twin_parity_stderr.log
          if-no-files-found: ignore

  twin-parity-sha-mismatch:
    # Advisory gate (#9399 volet b) : verifie que les SHA enregistres dans
    # le registre (last_audit.python_sha/csharp_sha, content_*_sha) sont
    # identiques aux SHA calcules au HEAD du PR.
    #
    # Pourquoi ADVISORY d'abord : 3 paires en mismatch pre-existant sur main
    # (Sudoku-08 / Sudoku-14 BDD / Sudoku-09 GraphColoring) -- detail cf
    # c.1267 smoke test + rapport design-gate c.1205. Un gate bloquant
    # rendrait main permanent red ; un gate advisory surface la regression
    # sans bloquer le merge, et fournit une baseline quantifiee pour la
    # promotion (B)->(A) post-rebaseline des 3 drifts.
    #
    # Promotion (B)->(A) : quand les 3 pre-existing Sudoku sont rebaselines
    # (PR dediee cf #8264 batch precedent), basculer le if final en
    # `exit 1` au lieu de `echo "::warning..."`. Cf twin-parity-drift-audit
    # pour le precedent advisory-then-blocking.
    name: "Twin parity SHA mismatch (#9399 volet b, advisory)"
    # 2026-10-27 (#22461, phase A du debordement) : meme forme hybride que le
    # job `twin-parity` ci-dessus -- PR meme-depot ET
    # vars.CI_OVERFLOW_LOCAL == 'true' -> jambe Linux locale, sinon
    # ubuntu-latest. La garde anti-fork ci-dessous est CONSERVEE.
    # Retour arriere = variable a `false` ou supprimee.
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository && vars.CI_OVERFLOW_LOCAL == 'true') && fromJSON('["self-hosted","coursia-ephemeral","coursia-linux"]') || 'ubuntu-latest' }}
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    # Borne de securite (incident du 15/10) : sur nos slots ephemeres, un run
    # fige sans borne tient un slot 6 h (defaut d'Actions) et le retire aux PR
    # gates ; 16 des 18 slots etaient occupes de cette facon le 15/10.
    # Duree mesuree sur 20 runs verts heberges : mediane 1,2 min, max 1,4 min
    # -> borne a 20 min (marge large pour le parc local).
    timeout-minutes: 20

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run recorded-SHA verification
        id: verify
        run: |
          set +e
          python scripts/notebook_tools/check_twin_parity.py --json --check --verify-recorded-sha > twin_sha_report.json 2>twin_sha_stderr.log
          EXIT=$?
          set -e
          if [ -s twin_sha_stderr.log ]; then
            echo "Twin-SHA tool diagnostics (stderr, non-fatal):"
            cat twin_sha_stderr.log
          fi
          if ! python -c "import json; json.load(open('twin_sha_report.json'))" 2>/dev/null; then
            echo "::error title=Twin SHA report unparseable::The JSON report (twin_sha_report.json) could not be parsed. Tool exit was $EXIT. Likely a tool crash before JSON emission."
            tail -c 400 twin_sha_report.json || true
            cat twin_sha_stderr.log 2>/dev/null || true
            exit 1
          fi
          # Status dispatch (parity with twin-parity-drift-audit.yml pattern):
          #   exit 0 = OK; exit 1 = mismatch found; exit !=0,1 = tool failure (RED).
          python -c "import json; d=json.load(open('twin_sha_report.json')); [print(f'{k}={v}') for k,v in (('total',d.get('total',0)),('ok',d.get('ok',0)),('mismatch',d.get('mismatch',0)),('no_audit',d.get('no_audit',0)))]" | tee -a "$GITHUB_OUTPUT"
          if [ "$EXIT" != "0" ] && [ "$EXIT" != "1" ]; then
            echo "::error title=Twin SHA tool crashed::Tool exit code was $EXIT (neither 0=clean nor 1=mismatch). Tool failure, not a mismatch."
            exit 1
          fi

      - name: Advisory SHA mismatch summary
        if: always() && steps.verify.outcome == 'success'
        run: |
          MISMATCH="${{ steps.verify.outputs.mismatch }}"
          NO_AUDIT="${{ steps.verify.outputs.no_audit }}"
          TOTAL="${{ steps.verify.outputs.total }}"
          OK="${{ steps.verify.outputs.ok }}"
          {
            echo "## Twin parity recorded-SHA verification"
            echo ""
            echo "Recorded pairs: **${TOTAL:-?}**. Recorded-SHA matches HEAD: **${OK:-?}**. Mismatch: **${MISMATCH:-?}**. No audit record: **${NO_AUDIT:-?}**."
            echo ""
            echo "**Advisory** (#9399 volet b, design-gate posture B): a non-zero mismatch count is a warning, not a red. Mismatch means the YAML's recorded `python_sha` / `csharp_sha` (or `content_*_sha` post-#9447) differs from the SHA computed at HEAD -- fix with \`python scripts/notebook_tools/check_twin_parity.py --update --pair \"<name>\" --by \"<machine:workspace>\"\`."
            echo ""
            if [ "${MISMATCH:-0}" != "0" ] || [ "${NO_AUDIT:-0}" != "0" ]; then
              echo "Mismatched / un-audited pairs:"
              python -c "import json; d=json.load(open('twin_sha_report.json')); [print(f\"- **{p['name']}** ({p.get('family','?')}): {p.get('status')}\") for p in d.get('pairs',[]) if p.get('status') != 'OK']" || true
            else
              echo "All recorded SHAs match HEAD. Promotion criterion (B)->(A) is met : this gate can flip to blocking."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Advisory: non-zero mismatch -> ::warning, exit 0. Tool failures above red.
          if [ "${MISMATCH:-0}" != "0" ]; then
            echo "::warning title=Twin parity recorded-SHA mismatch (advisory)::${MISMATCH:-?} pair(s) have a recorded python_sha/csharp_sha (or content_*_sha) that differs from the SHA computed at HEAD. Advisory per design-gate #9399 posture (B). See job summary. Run \`check_twin_parity.py --update --pair <name>\` to rebaseline. Volet (c) (#9447) added content_*_sha to make this gate metadata-immune."
          fi

      - name: Upload SHA report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twin-sha-mismatch-report
          path: |
            twin_sha_report.json
            twin_sha_stderr.log
          if-no-files-found: ignore
