name: Twin Parity Check

# Purpose: FAIL any PR that introduces DRIFT or MISSING in the twin parity
# register (#8057, parent #4208). The register lists every Python/C# twin
# pair and the git blob SHA of each notebook at the time of the last audit;
# this workflow re-runs the check against the PR's merge ref and fails if a
# notebook has moved without a re-audit (parite silently broke) or if a path
# is now missing (typo, deletion, twin never created).
#
# Why BLOCKING (unlike catalog-drift.yml): the twin parity check is the
# safety net for the structural parity of bilingual notebooks (Search/CSP,
# ML.NET, Z3/SMT, SemanticWeb, Probas/InferNET, GameTheory/.NET). A silent
# drift means the two implementations diverge without anyone re-auditing;
# this directly contradicts #4956 ("parity Python/C# marathon") and #8057
# ("metadonnee de parite auditable, pas declarative"). Blocking is the only
# way to make the auditable promise real.
#
# Per-pair semantics (#8264): the workflow runs in `--per-pair --base
# origin/main` mode, comparing the registry + blob SHAs at the PR's HEAD vs
# at origin/main (the base ref). The gate FAILS only on pairs that the PR
# itself has moved (base=OK, head=DRIFT/MISSING) or introduced/removed
# without rebaseline. Drift already present at origin/main is reported as
# `drift_pre_existing` but does NOT fail the gate -- it belongs to a
# dedicated rebaseline PR (cf #8264 batch precedent: #8282, #8289, #8322,
# #8372). This keeps the gate green for legitimate single-side edits while
# still surfacing fleet-wide stale SHAs through the report.
#
# Pattern: the worker who edits a twin must either re-audit and rebaseline the
# SHAs in the registry -- `python scripts/notebook_tools/check_twin_parity.py
# --update --pair "<entry name>" --by "<machine:workspace>"` (the selector is
# mandatory, cf #8508; the write is surgical, cf #8570) -- OR split the edit so
# the twin moves in lockstep on the same PR. The workflow tells them which side
# has drifted.
#
# Paths watched:
#   - scripts/notebook_tools/twin_pairs.d/** (registry file-per-entry, #8542)
#   - scripts/notebook_tools/check_twin_parity.py (the tool itself)
#   - All jumeau notebooks: MyIA.AI.Notebooks/**/*.ipynb (broad pattern;
#     the tool itself filters down to the pairs in the registry).
#
# Reuses the proven structure of catalog-drift.yml (read-only checkout of
# the PR merge ref, run tool, surface result) but FAILS on DRIFT_INTRODUCED.

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/notebook_tools/twin_pairs.d/**'
      - 'scripts/notebook_tools/check_twin_parity.py'
      - 'MyIA.AI.Notebooks/**/*.ipynb'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  twin-parity:
    name: "Twin parity audit (#8057)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run twin parity check
        id: check
        run: |
          set +e
          # Separate stdout (the JSON report, the machine contract) from stderr (diagnostics).
          # Previously `OUTPUT=$(... 2>&1)` merged tool warnings (missing-notebook notices etc.,
          # check_twin_parity.py emits 6 `print(..., file=sys.stderr)` sites) INTO the JSON file,
          # so json.load crashed with "Extra data" and the gate failed with a raw traceback on
          # any PR where a warning fired -- masking the real drift verdict. Direct redirection
          # captures python's exit code correctly AND keeps the report pure JSON.
          python scripts/notebook_tools/check_twin_parity.py --json --check --per-pair --base origin/main > twin_parity_report.json 2>twin_parity_stderr.log
          EXIT=$?
          set -e
          if [ -s twin_parity_stderr.log ]; then
            echo "Twin-parity tool diagnostics (stderr, non-fatal):"
            cat twin_parity_stderr.log
          fi
          # Guard: fail with a CLEAR ::error if the report is unparseable, instead of a raw
          # json.load traceback. The report must be stdout-only JSON (stream separation above).
          if ! python -c "import json; json.load(open('twin_parity_report.json'))" 2>/dev/null; then
            echo "::error title=Twin parity report unparseable::The JSON report (twin_parity_report.json) could not be parsed. Tool exit was $EXIT. Report tail + stderr are shown below and uploaded as artifacts. This indicates the report stream was corrupted or the tool crashed before emitting JSON (see #8957 stream-separation fix)."
            echo "--- report tail (last 400 chars) ---"
            tail -c 400 twin_parity_report.json || true
            echo "--- stderr ---"
            cat twin_parity_stderr.log 2>/dev/null || true
            exit 1
          fi
          if [ $EXIT -eq 0 ]; then
            INTRO=$(python -c "import json; d=json.load(open('twin_parity_report.json')); print(d.get('drift_introduced',0))")
            PRE=$(python -c "import json; d=json.load(open('twin_parity_report.json')); print(d.get('drift_pre_existing',0))")
            echo "drift_introduced=$INTRO" >> "$GITHUB_OUTPUT"
            echo "drift_pre_existing=$PRE" >> "$GITHUB_OUTPUT"
            echo "Twin parity OK : $PRE paire(s) en DRIFT pre-existant (base=origin/main) ne fail pas le gate (rellevent d'une PR de rebaseline dediee, cf #8264)."
          elif [ $EXIT -eq 1 ]; then
            INTRO=$(python -c "import json; d=json.load(open('twin_parity_report.json')); print(d.get('drift_introduced',0))")
            PRE=$(python -c "import json; d=json.load(open('twin_parity_report.json')); print(d.get('drift_pre_existing',0))")
            echo "drift_introduced=$INTRO" >> "$GITHUB_OUTPUT"
            echo "drift_pre_existing=$PRE" >> "$GITHUB_OUTPUT"
            echo ""
            echo "--------------------------------------------------------------"
            echo "  Twin parity : $INTRO paire(s) mise(s) en DRIFT par cette PR."
            echo "  Le registre stocke le git blob SHA de chaque jumeau : TOUTE"
            echo "  edition le deplace, y compris markdown-only. Tu rebaselines"
            echo "  pour ATTESTER la parite, pas pour la reparer."
            echo ""
            echo "  Re-audite la paire firsthand, puis lance exactement :"
            echo ""
            python -c "import json; d=json.load(open('twin_parity_report.json')); ns=[p['name'] for p in d.get('pairs',[]) if p.get('verdict')=='DRIFT_INTRODUCED'] or ['<nom exact de l entree>']; [print('    python scripts/notebook_tools/check_twin_parity.py --update --pair \"%s\" --by \"<machine:workspace>\"' % n) for n in ns]"
            echo "  L'ecriture est chirurgicale (#8570) : seules les lignes"
            echo "  last_audit de cette paire changent. Ajoute une ligne en tete"
            echo "  de known_differences expliquant l'edition, puis commit."
            echo "--------------------------------------------------------------"
            echo ""
            echo "::error title=Twin parity DRIFT INTRODUCED by this PR::La PR a introduit $INTRO paire(s) en DRIFT/MISSING qui etaient OK au base-ref origin/main. La commande de rebaseline exacte (avec le nom de la paire) est imprimee juste au-dessus dans ce log. Le selecteur --pair est obligatoire (#8508, lecons L963/L974) ; l'ecriture est chirurgicale et preserve les commentaires du registre (#8570). Alternative : splitter la PR pour que chaque cote evolue separement. Drift pre-existant ($PRE paire(s)) releve d'une PR dediee cf #8264. Voir twin_parity_report.json dans les artifacts."
            exit 1
          else
            echo "::error title=Twin parity tool error::Erreur d'execution du check (exit $EXIT). Voir les logs ci-dessus."
            exit $EXIT
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twin-parity-report
          path: |
            twin_parity_report.json
            twin_parity_stderr.log
          if-no-files-found: ignore
