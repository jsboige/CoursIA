name: Lean CI (geometry_lean)

# CI for geometry_lean (MyIA.AI.Notebooks/SymbolicAI/Lean/Geometry).
# Companion lake of the Geometry series (EPIC #18601 volet B): each Python
# concept notebook gets a Lean module formalizing what the algorithm computes.
# First theorem: the midpoint of the hypotenuse (position 05 of #17544).
# 0 sorry (raw=0, verified), fully proven from birth.
# Template: lean-percolation.yml (small lake, sorry-filter-mode: real).

on:
  push:
    branches: [main]
    paths:
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/Geometry/geometry_lean/**.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/Geometry/geometry_lean/lakefile.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/Geometry/geometry_lean/lean-toolchain'
      # The gate's own implementation: a change to it must re-run the gate
      # (same rationale as lean-galois.yml / lean-conway.yml, cf #8951).
      - '.github/workflows/lean-geometry.yml'
      - '.github/workflows/lean-axiom.yml'
      # The axiom step is a Python program (`from lean_server import LeanVerifier`);
      # lean_server.py + lean_utils.py ARE gate inputs (cf #8722).
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/lean_server.py'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/prover/lean_utils.py'
  pull_request:
    types: [opened, synchronize, edited, reopened]
    paths:
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/Geometry/geometry_lean/**.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/Geometry/geometry_lean/lakefile.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/Geometry/geometry_lean/lean-toolchain'
      # The gate must run on the PR that introduces or changes it (cf #8712).
      - '.github/workflows/lean-geometry.yml'
      - '.github/workflows/lean-axiom.yml'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/lean_server.py'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/prover/lean_utils.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-geometry-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: jsboige/CoursIA/.github/workflows/lean-build.yml@main
    with:
      project-path: MyIA.AI.Notebooks/SymbolicAI/Lean/Geometry/geometry_lean
      display-name: geometry_lean
      sorry-baseline: "0"
      sorry-filter-mode: real

  # Level 3 proof-integrity gate (criterion B.3 of pr-review-discipline):
  # a lake born with a dedicated workflow -- B.3 never reads "non applicable".
  # fail-on-sorry: true -- sorry-baseline is 0, the lake is fully proven.
  # target-modules: "*" (issue #10889) -- the module list is derived at runtime
  # from the lake walk, so it cannot drift out of view. The `_en` i18n siblings
  # are EXCLUDED by default (FR-only measurement; the byte-parity of the i18n
  # pair is covered structurally by `lean-i18n-drift.yml`, #10007).
  proof-integrity:
    needs: ci  # serialize the two compiles (parity with knot_lean #14922)
    uses: jsboige/CoursIA/.github/workflows/lean-axiom.yml@main
    with:
      project-path: MyIA.AI.Notebooks/SymbolicAI/Lean/Geometry/geometry_lean
      display-name: geometry_lean
      target-modules: "*"
      allow-axioms: ""
      fail-on-sorry: true
