# Parity-check for the pre-commit harness (issue #9888, suite).
# Advisory: surfaces in CI but does not block. The worker is the owner
# of the missing-local-hook state, not the PR.
name: hooks-parity

on:
  # Monthly cron so a long-running worker that drifted since last push
  # still gets a nudge back into the harness.
  schedule:
    # 05:17 UTC on the 1st of each month (avoids the top-of-hour rush).
    - cron: "17 5 1 * *"
  push:
    paths:
      - ".pre-commit-config.yaml"
      - ".github/workflows/hooks-parity.yml"
      - "scripts/check_hooks_parity.py"
      - "scripts/setup_hooks.py"
  pull_request:
    paths:
      - ".pre-commit-config.yaml"
      - ".github/workflows/hooks-parity.yml"
      - "scripts/check_hooks_parity.py"
      - "scripts/setup_hooks.py"

concurrency:
  group: hooks-parity-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  parity:
    name: parity gate
    # Route vers la jambe Linux auto-hebergee (#13378 tranche 1, decision ai-01
    # 2026-09-01) : garde Python pur, sans secret ni usage du GITHUB_TOKEN. La garde
    # same-repo ci-dessous saute les PRs de fork (pr_gate.py compte `skipped` comme
    # OK) : aucun code de fork n'atteint le runner. Retour arriere = revert de la PR.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    # Advisory: surfaces the warning without breaking the rest of the CI run.
    # `continue-on-error` is only valid on a job or a step -- at the workflow
    # root it is an unknown key, which Actions rejects with a startup_failure
    # (0 jobs created, no log to read). See the PR body for the diagnosis.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Run parity check
        id: parity
        # Exit 0 = all gates green, 1 = some gate KO. We surface the
        # warning either way because the gate is advisory.
        run: |
          python scripts/check_hooks_parity.py || echo "PARITY_FAIL_RC=$?"
      - name: Annotate if any gate KO
        if: steps.parity.outcome == 'failure'
        run: |
          echo "::warning::hooks-parity gate: declared-vs-installable mismatch. Run on the worker: python scripts/setup_hooks.py --install"
