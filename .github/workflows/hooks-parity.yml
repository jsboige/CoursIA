# Parity-check for the pre-commit harness (issue #9888, suite).
# Advisory: surfaces in CI but does not block. The worker is the owner
# of the missing-local-hook state, not the PR.
name: hooks-parity

on:
  # Monthly cron so a long-running worker that drifted since last push
  # still gets a nudge back into the harness.
  schedule:
    # 05:17 UTC on the 1st of each month (avoids the top-of-hour rush).
    - cron: "17 5 1 * *"
  push:
    paths:
      - ".pre-commit-config.yaml"
      - ".github/workflows/hooks-parity.yml"
      - "scripts/check_hooks_parity.py"
      - "scripts/setup_hooks.py"
  pull_request:
    paths:
      - ".pre-commit-config.yaml"
      - ".github/workflows/hooks-parity.yml"
      - "scripts/check_hooks_parity.py"
      - "scripts/setup_hooks.py"

concurrency:
  group: hooks-parity-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  parity:
    name: parity gate
    # Route vers la jambe Linux auto-hebergee (#13378 tranche 1, decision ai-01
    # 2026-09-01) : garde Python pur, sans secret ni usage du GITHUB_TOKEN. La garde
    # same-repo ci-dessous saute les PRs de fork (pr_gate.py compte `skipped` comme
    # OK) : aucun code de fork n'atteint le runner. Retour arriere = revert de la PR.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    # Advisory: surfaces the warning without breaking the rest of the CI run.
    # `continue-on-error` is only valid on a job or a step -- at the workflow
    # root it is an unknown key, which Actions rejects with a startup_failure
    # (0 jobs created, no log to read). See the PR body for the diagnosis.
    continue-on-error: true
    steps:
      # sparse-checkout non-cone : le garde ne lit que 4 entrees
      # (acceptance #14295). Forme non-cone obligatoire (cone mode
      # n'accepte que des repertoires, voir PR #14380 lesson). Chemins
      # SANS slash initial pour materialiser les fichiers ; avec un
      # slash initial, git sparse-checkout produit un checkout VIDE en
      # silence (mesure c.913). `sparse-checkout-cone-mode: false`
      # EXPLICITE (defaut actions/checkout@v4 = true ; sans override,
      # `git sparse-checkout set` refuse les fichiers non-directory --
      # '.pre-commit-config.yaml is not a directory', run 33896239827 ;
      # le mode cone-mais-non-repertoire n'existe pas, c.915). Paths =
      # ce que le garde lit, etabli par lecture de
      # scripts/check_hooks_parity.py.
      # 2026-10-27 (#22722) : un work dir chaud conserve les fichiers materialises
      # par le job precedent. Quand le set sparse de CE job est plus etroit, git
      # refuse de retirer un fichier modifie et ecrit
      # "Path '...' not uptodate; will not remove from working tree." -- une
      # annotation `failure` portee par un job `success` (faux rouge de la
      # famille #12856 ; mesure API : 3 occurrences sur les 5 tetes de main les
      # plus recentes, job 'PR gate sweep health advisory'). `git reset --hard`
      # restaure l'arbre : le retrecissement passe alors sans message
      # (experience locale mesuree : le refus disparait ; `git clean -ffdx` seul
      # ne suffit pas -- le fichier fautif est suivi, donc non nettoye).
      - name: Restore the warm work tree before the sparse checkout
        run: |
          set -u
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            dirty=$(git -C "$GITHUB_WORKSPACE" -c safe.directory="$GITHUB_WORKSPACE" status --porcelain 2>/dev/null | head -n 1)
            if ! git -C "$GITHUB_WORKSPACE" -c safe.directory="$GITHUB_WORKSPACE" reset --hard --quiet; then
              echo "::warning::[heal-worktree] reset --hard a echoue -- le retrecissement sparse peut refuser (#22722)"
            elif [ -n "$dirty" ]; then
              echo "::notice::[heal-worktree] arbre restaure -- le job precedent avait laisse un etat sale (${dirty}) -- le retrecissement sparse passe (#22722)"
            fi
          fi
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .pre-commit-config.yaml
            .github
            scripts/check_hooks_parity.py
            scripts/setup_hooks.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Run parity check
        id: parity
        # Exit 0 = all gates green, 1 = some gate KO. We surface the
        # warning either way because the gate is advisory.
        run: |
          python scripts/check_hooks_parity.py || echo "PARITY_FAIL_RC=$?"
      - name: Annotate if any gate KO
        if: steps.parity.outcome == 'failure'
        run: |
          echo "::warning::hooks-parity gate: declared-vs-installable mismatch. Run on the worker: python scripts/setup_hooks.py --install"
