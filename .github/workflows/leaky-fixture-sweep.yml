name: Leaky Fixture Sweep (date-window)

# Advisory detector for the date-bomb defect class that reddened main at
# 2026-09-02T00:24Z (picker, #14206): a test fixture pinning an ABSOLUTE date
# (e.g. mergedAt: "2026-09-01T00:00:00Z") while its module derives a sliding
# window from the REAL clock (NOW - timedelta(days=1)). On the next calendar
# boundary the fixture falls out of the window and the test fails, breaking
# main for the whole fleet with no push, no review, no guard able to catch it.
#
# The organ proves the class by doing the thing that breaks it: advance the
# clock (libfaketime) and run the clock-windowed test surface. A test that
# survives +8d/+31d is not a bomb; one that fails IS, and needs triage (make
# the fixture relative to NOW, or justify the absolute date on the issue).
#
# Advisory BY CONSTRUCTION: schedule- + dispatch-only, never on
# pull_request/push, so a red run can never block a PR on an unrelated diff —
# the exact failure mode #14206 is built to avoid. A red run here means a real
# date-window fixture exists and must be triaged.
#
# Scope: the date-windowed test files only (not the full suite), for two
# reasons honored firsthand (2026-09-02, po-2024):
#   (1) scripts/audit/tests + scripts/quantconnect/tests are CI-EXCLUDED from
#       scripts-tests.yml (#2037/#2871): their suites need yfinance, external
#       data files or an OpenAI key at collection. Targeting the individual
#       hermetic file (not the directory) keeps collection clean (verified:
#       test_nit_lift_authorship.py + test_audit_projects.py collect with
#       pytest alone).
#   (2) the full scripts/tests suite bails at import (test_check_workflow_
#       label_paths.py triggers sys.exit(2) at load), which would mask the
#       date-bomb signal in collection-noise. The date-windowed surface re-
#       scopes the sweep to the files that actually derive windows from NOW.
#
# The candidate list below comes from the #14206 table (date-fragile files
# identified by their pinned absolute dates). Sweeping them daily catches a
# REGRESSION (future change re-introducing a bomb) without the collection
# noise of the full suite. A new date-fragile file should be added here when
# a new date-window test lands.

on:
  schedule:
    # Daily, off-:00 minute (avoid the :00/:30 API spike).
    - cron: '43 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leaky-fixture-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Date-window sweep
    # HOSTED, PAS LE POOL (#16141, 2026-09-14). Ce job est le cas que la
    # doctrine #14283 tranche 5 a explicitement EXCLU du pool : il a besoin de
    # root/apt pour installer `libfaketime`, et le conteneur du pool tourne en
    # uid 1001 sous `--security-opt=no-new-privileges`, sans sudo ni dpkg
    # (docs/ci/self-hosted-runners.md ; issuecomment-5516335275 ;
    # quarto-pages-deploy.yml l.134). Motif identique a celui qui exclut
    # slides-composition-advisory (`playwright --with-deps` exige root).
    #
    # Ce n'est pas une precaution : route ici le 2026-09-02 (#14283 tranche 4),
    # ce workflow n'a JAMAIS rendu un run vert. 12 runs, 12 `failure`, du
    # 2026-09-03 au 2026-09-14, tous `event=schedule` ; l'organe n'a donc
    # jamais balaye quoi que ce soit. Cause mesuree sur le log du run
    # 34826882416 : `sudo: command not found` -> exit 127 a l'etape
    # d'installation, les deux etapes de balayage jamais atteintes.
    #
    # C'est le retour arriere que ce commentaire documentait deja. Rollback s'il
    # faut revenir au pool : `runs-on: [self-hosted, coursia-ephemeral,
    # coursia-linux]` + reintegration dans SELF_HOSTED_WORKFLOW_ALLOWLIST.
    #
    # `schedule` + `workflow_dispatch` uniquement -- il ne tourne que sur la
    # branche par defaut, donc aucun code de fork ne peut l'atteindre.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # `libfaketime` seul NE SUFFIT PAS, et c'est le second defaut du job. Sur
      # Ubuntu le paquet `libfaketime` n'installe QUE les bibliotheques
      # (`/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1`) -- aucun binaire.
      # Le CLI `faketime` que les deux etapes de balayage appellent vient du
      # paquet `faketime` (noble, universe, 0.9.10-2.1), qui depend de
      # `libfaketime` : l'installer tire les deux.
      #
      # Mesure (dispatch 34857209217, apres le retour sur `ubuntu-latest`) :
      # l'installation de `libfaketime` seule REUSSIT, et le preflight sort
      # « outil(s) absent(s) sur ce runner : faketime ». Le defaut etait masque
      # jusqu'ici par l'echec de routage, qui tuait le job une etape plus tot --
      # deux pannes independantes, une seule visible a la fois.
      - name: Install pytest + faketime
        run: |
          python -m pip install --quiet pytest
          sudo apt-get update
          sudo apt-get install --yes faketime

      # Le `127` de #16141 etait muet : `Process completed with exit code 127`
      # ne nommait ni l'outil manquant ni le runner, et il a fallu descendre au
      # log du job pour lire `sudo: command not found`. Ce preflight nomme les
      # deux AVANT de balayer, et ecrit le diagnostic dans le resume du job --
      # un prochain echec d'environnement doit se lire tout seul.
      - name: Preflight -- les outils du balayage sont-ils la ?
        run: |
          missing=""
          for tool in faketime python; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            msg="Date-window sweep -- outil(s) absent(s) sur ce runner :${missing}."
            msg="$msg Le balayage n'a PAS tourne (runner : $(uname -srm))."
            {
              echo "### Date-window sweep -- environnement incomplet"
              echo
              echo "- outils absents : \`${missing# }\`"
              echo "- runner : \`$(uname -srm)\`"
              echo "- consequence : les deux horizons (+8d, +31d) n'ont pas ete"
              echo "  balayes, donc ce run ne dit RIEN de la classe date-bomb."
              echo "  Un rouge ici n'est pas un verdict sur les fixtures."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$msg"
            exit 1
          fi
          echo "outils du balayage presents ; runner : $(uname -srm)"

      # The date-windowed surface. Each file is a single target so collection
      # stays hermetic (no sibling deps).
      #
      # `-f` EST OBLIGATOIRE, et c'est le troisieme defaut de ce job (#16141).
      # Sans lui, `faketime` remet son argument a `/bin/date -d`, qui n'entend
      # pas les offsets relatifs. Mesure du dispatch 34857525712 -- la premiere
      # fois que cette etape a pu s'executer depuis la creation du fichier :
      #
      #     date: invalid date '+8d'
      #     Error: Timestamp to fake not recognized, please re-try with a different timestamp.
      #
      # Les offsets relatifs (`[+/-]123[m/h/d/y]`) appartiennent au format
      # AVANCE, que `-f` active (man 1 faketime, « ADVANCED TIMESTAMP FORMAT »).
      # La forme sans `-f` date de la creation du fichier (commit c59dac98ef) :
      # elle n'a jamais rien balaye.
      #
      # A relire aussi : ce bloc revendiquait « 189 tests verts sous les deux
      # horizons (valide 2026-09-02, po-2024) ». Cette validation ne peut pas
      # avoir porte sur CETTE ligne de commande, qui meurt avant `pytest` --
      # elle a eu lieu sur une invocation correcte, et la transcription a perdu
      # le `-f`. Le chiffre de 189 est donc a re-mesurer, pas a croire.
      #
      # La ligne `horloge decalee` mesure que le decalage atteint un
      # sous-processus PYTHON, pas seulement le binaire `date`. Sans elle, un
      # decalage qui ne s'appliquerait pas a `pytest` rendrait un FAUX VERT :
      # un organe anti-date-bomb declarant « aucune bombe » sans avoir decale
      # l'horloge.
      - name: Sweep clock-windowed surface at +8 days
        run: |
          faketime -f '+8d' python -c "import datetime; print('horloge decalee (+8d) :', datetime.datetime.now().isoformat())"
          faketime -f '+8d' python -m pytest \
            scripts/tests/test_pick_idle_grain.py \
            scripts/tests/test_pick_idle_grain_cache.py \
            scripts/tests/test_pick_nanoclaw_concerns.py \
            scripts/tests/test_pick_claim_filter.py \
            scripts/tests/test_substance_drought.py \
            scripts/tests/test_coordination_budget.py \
            scripts/audit/tests/test_nit_lift_authorship.py \
            scripts/quantconnect/tests/test_audit_projects.py \
            --tb=short -q

      - name: Sweep clock-windowed surface at +31 days
        run: |
          faketime -f '+31d' python -c "import datetime; print('horloge decalee (+31d) :', datetime.datetime.now().isoformat())"
          faketime -f '+31d' python -m pytest \
            scripts/tests/test_pick_idle_grain.py \
            scripts/tests/test_pick_idle_grain_cache.py \
            scripts/tests/test_pick_nanoclaw_concerns.py \
            scripts/tests/test_pick_claim_filter.py \
            scripts/tests/test_substance_drought.py \
            scripts/tests/test_coordination_budget.py \
            scripts/audit/tests/test_nit_lift_authorship.py \
            scripts/quantconnect/tests/test_audit_projects.py \
            --tb=short -q
