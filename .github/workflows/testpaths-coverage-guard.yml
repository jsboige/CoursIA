name: testpaths-coverage-guard

# #12567 tranche 5 : cette garde est absorbee par la voie rapide
# (scripts/ci/fast_lane.py). Le declenchement `pull_request` est retire ici
# pour eviter la double execution (lane + workflow dedie) ; `workflow_dispatch`
# reste pour execution manuelle / replay. La garde est rendue par la voie
# rapide sous son nom canonique `testpaths vs CI coverage` (conclusion reelle,
# conclusion_for ne neutralise pas les absorbes).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testpaths-coverage-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: testpaths vs CI coverage
    # Q35 etape 2 (#17397) : garde Python pur (testpaths coverage), vehicule
    # d'identite absorbe par fast-lane (cf. entete du fichier l. 3-8). Aucun
    # secret, aucun GPU/CUDA/Lean/.NET. La garde same-repo ci-dessous est
    # conservee telle quelle -- seul le runner change. Sortie de
    # SELF_HOSTED_WORKFLOW_ALLOWLIST dans le meme commit.
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check testpaths coverage
        # Garde de dérive (#10903) : tout testpath pytest.ini ni couvert par un
        # workflow pytest ni déclaré `# CI-EXCLUDED: <path> — <raison>` fait
        # échouer la PR. Le script vérifie aussi que chaque cible déclarée
        # apparaît verbatim dans son workflow (dérive dans les deux sens).
        run: python scripts/check_testpaths_coverage.py --verbose
