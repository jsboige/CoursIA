name: Enrich-quality gate

# Purpose
# -------
# Per-PR REGRESSION gate for enrich-wave content defects (CoursIA #13410
# aggregate 2026-09-01, roo-extensions #3374): the systemic classes the
# cell-ORDERING gate cannot see -- de-accented rewrites, href 404s,
# MAIN-space `code[N]` anchors, phantom entities, worked solutions in front
# of TODO exercises, false inline arithmetic.
# For every notebook changed by the PR, compare its HIGH enrich-quality
# findings (scripts/notebook_tools/scan_enrich_quality.py) between the base
# revision and the PR revision and FAIL only on a regression -- a HIGH
# finding introduced by the PR. Pre-existing findings (legacy leaks, earlier
# waves' mis-anchored notebooks) do NOT block unrelated PRs. A new notebook
# (no base) must be clean.
#
# Anchor convention enforced: code[N] = the N-th CODE cell, 0-based, counted
# in the HEAD layout (after every markdown insertion). Convention doc:
# .claude/rules/notebook-conventions.md ("Ancrage code[N] des cellules").

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'MyIA.AI.Notebooks/**/*.ipynb'
      - 'scripts/notebook_tools/scan_enrich_quality.py'
      - 'scripts/notebook_tools/enrich_quality_ci.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enrich-quality:
    name: "No enrich-quality regression in changed notebooks"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gate changed notebooks
        run: |
          set -uo pipefail
          BASE="origin/${{ github.base_ref }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::notice title=Enrich-quality gate::Manual dispatch — nothing to diff."
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE"...HEAD -- 'MyIA.AI.Notebooks/**/*.ipynb' || true)
          if [ -z "$CHANGED" ]; then
            echo "::notice title=Enrich-quality gate::No notebooks changed — clean."
            exit 0
          fi

          tmp=$(mktemp -d)
          fail=0
          echo "## Enrich-quality gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r nb; do
            [ -z "$nb" ] && continue
            # Skip notebooks deleted by the PR.
            [ -f "$nb" ] || continue
            basef="NONE"
            if git cat-file -e "$BASE:$nb" 2>/dev/null; then
              basef="$tmp/base.ipynb"
              git show "$BASE:$nb" > "$basef" 2>/dev/null || basef="NONE"
            fi
            out=$(python scripts/notebook_tools/enrich_quality_ci.py --base "$basef" --head "$nb") && rc=0 || rc=$?
            if [ $rc -ne 0 ]; then
              echo "::error title=Enrich-quality regression::$nb introduces new HIGH enrich-quality finding(s)."
              echo "$out"
              echo "<details><summary><code>$nb</code></summary>" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "$out" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "</details>" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            else
              echo "  OK  $nb"
            fi
          done <<< "$CHANGED"

          if [ "$fail" -ne 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Ground-truth each finding (the signal is not a verdict, rule G.1). Anchor convention: \`code[N]\` = the N-th CODE cell, 0-based, at HEAD." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "::notice title=Enrich-quality gate::No enrich-quality regression in changed notebooks."
