name: Enrich-quality gate

# Purpose
# -------
# Per-PR REGRESSION gate for enrich-wave content defects (CoursIA #13410
# aggregate 2026-09-01, roo-extensions #3374): the systemic classes the
# cell-ORDERING gate cannot see -- de-accented rewrites, href 404s,
# MAIN-space `code[N]` anchors, phantom entities, worked solutions in front
# of TODO exercises, false inline arithmetic.
# For every notebook changed by the PR, compare its HIGH enrich-quality
# findings (scripts/notebook_tools/scan_enrich_quality.py) between the base
# revision and the PR revision and FAIL only on a regression -- a HIGH
# finding introduced by the PR. Pre-existing findings (legacy leaks, earlier
# waves' mis-anchored notebooks) do NOT block unrelated PRs. A new notebook
# (no base) must be clean.
#
# Anchor convention enforced: code[N] = the N-th CODE cell, 0-based, counted
# in the HEAD layout (after every markdown insertion). Convention doc:
# .claude/rules/notebook-conventions.md ("Ancrage code[N] des cellules").
#
# PR-introduced filter (#22298). The change list below is computed against the
# PR's BASE BRANCH, which is correct for a PR on `main` and wrong for a STACKED
# PR whose base lags `main`: the diff then carries everything `main` gained
# since the fork, and findings already merged on `main` are attributed to the
# PR. Measured on #21650 (base 521 commits behind): 287 notebooks audited for
# a 1-file PR, 3 HIGH `MD_REWRITE` on notebooks byte-identical to `origin/main`.
# `scripts/ci/filter_pr_introduced_notebooks.py` keeps a notebook only when a
# commit OWNED by the PR touched it (not reachable from `main`; a merge counts
# for what it writes itself, not for what it transports) -- a blob-equality
# test alone left 34 of 287, because a notebook `main` rewrote after the fork
# also differs from HEAD. Fail-open: an undeterminable set drops nothing, so
# the gate never goes quiet for lack of a ref; an organ that CRASHES, however,
# fails the gate -- an empty stdout must never read as "nothing to audit".
#
# Le corps du fichier est en anglais (convention du depot) ; les commentaires
# de bloc ajoutes restent en francais, comme le reste de l'harnais CI.

on:
  pull_request:
    paths:
      - 'MyIA.AI.Notebooks/**/*.ipynb'
      - 'scripts/notebook_tools/scan_enrich_quality.py'
      - 'scripts/notebook_tools/enrich_quality_ci.py'
      - 'scripts/ci/filter_pr_introduced_notebooks.py'
  workflow_dispatch:

# Condition jointe à l'arbitrage #19426 (c.6300191475) : tout workflow
# touché sans bloc concurrency en reçoit un, clé sur la PR.
concurrency:
  group: enrich-quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  enrich-quality:
    name: "No enrich-quality regression in changed notebooks"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gate changed notebooks
        env:
          # Body marker channel (#17744). Payload-at-event-time like the sibling
          # gates (md-content-loss / plan-loss): a marker added to the body is
          # visible to the runs triggered by the NEXT push, not to reruns.
          ENRICH_QUALITY_PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -uo pipefail
          BASE="origin/${{ github.base_ref }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::notice title=Enrich-quality gate::Manual dispatch — nothing to diff."
            exit 0
          fi

          # Rename-aware change list (#15106): resolve each changed notebook's
          # BASE name via --name-status -M. A pure rename (R100, e.g. the
          # zero-pad 9_ -> 09_ waves) leaves the file absent from BASE under
          # its HEAD name, which made the gate treat renamed notebooks as
          # brand-new and fail them on pre-existing findings.
          STATUS=$(git diff --name-status -M "$BASE"...HEAD -- 'MyIA.AI.Notebooks/**/*.ipynb' || true)

          # Filtre "introduit par la PR" (#22298). Un carnet n'est « introduit
          # par la PR » que si un commit PROPRE a la PR l'a touche -- merge
          # compris, pour ce que le merge ECRIT lui-meme (resolution de
          # conflit) ; absent de `main`. Sur une PR empilee dont la base est en
          # retard, le diff contre la base attribue a la PR tout ce que `main` a
          # gagne depuis le fork (mesure #21650 : 287 carnets pour 1 fichier).
          # Fail-open COTE ORGANE : un ensemble indeterminable ne retire rien.
          # Mais un organe QUI PLANTE n'est pas « indeterminable » : son stdout
          # est vide, et la branche `-z` ci-dessous conclurait « clean » -- le
          # gate serait ETEINT en silence sur toutes les PRs a carnets. Le rc de
          # la substitution est donc teste explicitement : c'est la seule facon
          # de distinguer « aucun carnet » de « le filtre n'a pas tourne »
          # (releve par Hermes sur #22302). Sous `pipefail`, printf et python
          # comptent : une jambe qui echoue rougit le gate, jamais ne le verte.
          if [ -n "$STATUS" ]; then
            if ! STATUS=$(printf '%s\n' "$STATUS" | python scripts/ci/filter_pr_introduced_notebooks.py --base "$BASE" --main-ref origin/main --head-ref HEAD --stats); then
              echo "::error title=Enrich-quality gate::filtre PR-introduit en echec -- gate non concluant, stderr ci-dessus"
              exit 1
            fi
          fi

          if [ -z "$STATUS" ]; then
            echo "::notice title=Enrich-quality gate::No notebooks changed — clean."
            exit 0
          fi

          tmp=$(mktemp -d)
          fail=0
          # Body marker canal (#17744, meme politique que MD_CONTENT_LOSS_PR_BODY) :
          # l'env var evite le pattern CodeQL actions/code-injection d'un printf
          # du body dans le shell. Les marqueurs 'enrich-quality: reecriture
          # assumee' ne couvrent QUE les categories base-vs-head (MD_REWRITE /
          # MD_SURVIVAL_LOW) du notebook nomme.
          printf '%s' "${ENRICH_QUALITY_PR_BODY:-}" > "$tmp/pr_body.txt"
          echo "## Enrich-quality gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # Rows are TAB-separated: "R099<TAB>old<TAB>new" for renames,
          # "A/M<TAB>path" otherwise (third column empty -> base_nb is the path).
          while IFS=$'\t' read -r st base_nb nb; do
            if [ "$st" = "D" ] || [ -z "$base_nb" ]; then continue; fi
            if [ -z "$nb" ]; then nb="$base_nb"; fi
            # Skip notebooks deleted by the PR.
            [ -f "$nb" ] || continue
            basef="NONE"
            if git cat-file -e "$BASE:$base_nb" 2>/dev/null; then
              basef="$tmp/base.ipynb"
              git show "$BASE:$base_nb" > "$basef" 2>/dev/null || basef="NONE"
            fi
            out=$(ENRICH_QUALITY_PR_BODY_FILE="$tmp/pr_body.txt" \
                  python scripts/notebook_tools/enrich_quality_ci.py --base "$basef" --head "$nb") && rc=0 || rc=$?
            if [ $rc -ne 0 ]; then
              echo "::error title=Enrich-quality regression::$nb introduces new HIGH enrich-quality finding(s)."
              echo "$out"
              echo "<details><summary><code>$nb</code></summary>" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "$out" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "</details>" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            else
              echo "  OK  $nb"
            fi
          done <<< "$STATUS"

          if [ "$fail" -ne 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Ground-truth each finding (the signal is not a verdict, rule G.1). Anchor convention: \`code[N]\` = the N-th CODE cell, 0-based, at HEAD." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "::notice title=Enrich-quality gate::No enrich-quality regression in changed notebooks."
