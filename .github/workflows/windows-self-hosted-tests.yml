name: Windows Self-Hosted Tests

# Dispatch-only : ZERO declencheur pull_request/push, donc zero fan-out CI
# (#13097). La famine rend tout declencheur automatique contre-productif ;
# ce workflow existe pour etre appele a la demande, au moment ou un runner
# ephemeral myia-po-*-fast-guards est Idle (voir #12704 / #13097).
#
# Cycle de vie : un runner --ephemeral traite AU PLUS UN JOB puis se
# desenregistre (docs/ci/self-hosted-runners.md, manage_self_hosted_runner.py).
# Chaque dispatch consomme donc l'enregistrement courant : un dispatch,
# un job, un runner. Ne pas dispatcher deux fois de suite sans avoir
# re-enregistre un runner.
#
# Deux jobs, groupes de concurrence SEPARES : un dispatch confinement
# n'annule pas un dispatch .NET en cours (et inversement). Justification :
# restore NuGet GradeBookApp.Tests (Lucene.NET/ClosedXML/CsvHelper) prend
# ~3-5 min ; cancel-in-progress croise gaspillerait ce travail.
#
# Selection du job : un input `target` choice {confinement, dotnet} est
# declare sur workflow_dispatch. Chaque job est garde par
# `inputs.target == '<job>'` (combine au garde fork existant). Un seul
# job eligible par dispatch -- sinon, le runner ephemere
# myia-po-*-fast-guards peut laisser un job en file sans runner (cf
# commentaire adjoint preflight #13605 issuecomment-5467391147 + DM
# po-2025:CoursIA-2 msg-20260830T072849-2le6l1 + DM ai-01:CoursIA
# msg-20260830T072329-ah0km5 greenlight (B) confirme allowlist runtime
# inchangee -- le repair preserve le vehicule option B).

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Job a executer (un seul par dispatch -- runner ephemere)"
        type: choice
        required: true
        default: "confinement"
        options:
          - confinement
          - dotnet

permissions:
  contents: read

jobs:
  windows-confinement-tests:
    name: Scripts Tests (Windows runner)
    # Acceptance B item 1 (#12704) : garde fork EXPLICITE au niveau job.
    # Le declencheur actuel est workflow_dispatch seul -- un fork ne peut pas
    # l'emettre -- mais "pas de trigger" est un etat qu'une ligne de YAML
    # defait : si un declencheur pull_request est ajoute un jour, un evenement
    # fork est refuse ICI, defense-in-depth qui ne se defe pas d'un clic d'UI.
    # Garde selection : inputs.target == 'confinement' (sinon ce job n'est
    # pas eligible -- un dispatch `target=dotnet` ne planifie que le job .NET).
    if: (github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository) && inputs.target == 'confinement'
    runs-on: [self-hosted, coursia-ephemeral, coursia-fast-guards]
    timeout-minutes: 15
    concurrency:
      group: windows-self-hosted-confinement
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install pytest

      # Les 9 tests @requires_windows (skippes par #13063 : aucun runner
      # Windows en CI) couvrent la surface de confinement du gestionnaire
      # de runners : rendu des scripts PowerShell (compte, ACL, teardown),
      # probes d'isolation, allowlist d'environnement. Ils n'ecrivent rien
      # sur l'hote : toutes les mutations passent par des callables injectes.
      - name: Run Windows-confinement tests
        run: python -m pytest scripts/tests/test_manage_self_hosted_runner.py -v

  windows-dotnet-tests:
    # Job GradeBookApp.Tests -- mission ai-01 chiffree dans #13378 :
    # valider que le runner Windows `myia-po-2024-fast-guards` peut absorber
    # un job .NET 9 (csproj Lucene.NET/ClosedXML/CsvHelper). Identity proof
    # + restore + build Release + test xunit avec TRX logger.
    name: GradeBookApp.Tests (Windows runner)
    # Garde fork explicite au niveau job (cf job ci-dessus rationale partagee).
    # Garde selection : inputs.target == 'dotnet' (sinon ce job n'est pas
    # eligible -- un dispatch `target=confinement` ne planifie que le job
    # confinement).
    if: (github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository) && inputs.target == 'dotnet'
    runs-on: [self-hosted, coursia-ephemeral, coursia-fast-guards]
    timeout-minutes: 20
    # Groupe separe : un dispatch .NET ne doit PAS annuler un dispatch
    # confinement en cours, et inversement (restore NuGet = ~3-5 min).
    concurrency:
      group: windows-self-hosted-dotnet
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      # Preuve d'identite du runner + contexte d'execution.
      - name: Identity proof
        shell: pwsh
        run: |
          Write-Output "runner.name=$env:RUNNER_NAME"
          Write-Output "runner.os=$env:RUNNER_OS"
          Write-Output "runner.arch=$env:RUNNER_ARCH"
          Write-Output "runner.temp=$env:RUNNER_TEMP"
          dotnet --info | Out-String | Write-Output
          python --version
          python -m pip --version

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Restore explicite : le projet GradeBookApp.Tests reference
      # GradeBookApp.csproj (Lucene.NET 4.8.0-beta00017 + ClosedXML 0.105.0
      # + CsvHelper 33.1.0). Premier run valide que ces packages NuGet
      # arrivent bien sur le runner (sinon INTRINSIC reseau a documenter).
      - name: dotnet restore
        run: dotnet restore GradeBookApp.Tests/GradeBookApp.Tests.csproj

      - name: dotnet build
        run: dotnet build GradeBookApp.Tests/GradeBookApp.Tests.csproj --no-restore --configuration Release

      - name: dotnet test
        run: dotnet test GradeBookApp.Tests/GradeBookApp.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=gradebook-tests.trx"

