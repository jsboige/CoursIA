name: Windows Self-Hosted Tests

# Dispatch-only : ZERO declencheur pull_request/push, donc zero fan-out CI
# (#13097). La famine rend tout declencheur automatique contre-productif ;
# ce workflow existe pour etre appele a la demande, au moment ou un runner
# ephemeral myia-po-*-fast-guards est Idle (voir #12704 / #13097).
#
# Cycle de vie : un runner --ephemeral traite AU PLUS UN JOB puis se
# desenregistre (docs/ci/self-hosted-runners.md, manage_self_hosted_runner.py).
# Chaque dispatch consomme donc l'enregistrement courant : un dispatch,
# un job, un runner. Ne pas dispatcher deux fois de suite sans avoir
# re-enregistre un runner.

on:
  workflow_dispatch:

permissions:
  contents: read

# Un runner ephemeral ne peut prendre qu'un job a la fois : un second
# dispatch resterait en file pour toujours (plus de runner apres le 1er job).
# cancel-in-progress annule la file precedente au lieu de l'empiler.
concurrency:
  group: windows-self-hosted-tests
  cancel-in-progress: true

jobs:
  windows-confinement-tests:
    name: Scripts Tests (Windows runner)
    runs-on: [self-hosted, coursia-ephemeral, coursia-fast-guards]
    timeout-minutes: 15

    steps:
      # ACCEPTANCE B (issue #12704, mission ai-01 2026-08-28T14:33Z) : preuves
      # runtime du confinement du compte dedie, executees PAR le runner donc
      # sous coursia-runner. Un whoami ne prouve pas une absence de droit :
      # chaque preuve est une lecture qui doit ECHOUE (deny ACE) ou REUSSIR
      # (_work). Jamais de contenu imprime -- seule l'erreur de refus d'acces.
      # Version de BRANCHE jetable : jamais merger (la version main reste
      # l'execution pytest de confinement).
      - name: 'Acceptance B: .secrets read MUST be denied'
        run: |
          $p = 'C:\dev\CoursIA\.secrets\master.env'
          try {
            Get-Content -LiteralPath $p -TotalCount 1 -ErrorAction Stop | Out-Null
            Write-Output "FAIL: read SUCCEEDED on $p -- confinement broken"
            exit 1
          } catch {
            Write-Output "OK DENIED: $p -- $($_.Exception.GetType().Name)"
            exit 0
          }

      - name: 'Acceptance B: .ssh read MUST be denied'
        run: |
          $p = 'C:\Users\jsboi\.ssh'
          try {
            Get-ChildItem -LiteralPath $p -ErrorAction Stop | Out-Null
            Write-Output "FAIL: read SUCCEEDED on $p -- confinement broken"
            exit 1
          } catch {
            Write-Output "OK DENIED: $p -- $($_.Exception.GetType().Name)"
            exit 0
          }

      - name: 'Acceptance B: gh keyring read MUST be denied'
        run: |
          $p = 'C:\Users\jsboi\AppData\Roaming\GitHub CLI\hosts.yml'
          try {
            Get-Content -LiteralPath $p -TotalCount 1 -ErrorAction Stop | Out-Null
            Write-Output "FAIL: read SUCCEEDED on $p -- confinement broken"
            exit 1
          } catch {
            Write-Output "OK DENIED: $p -- $($_.Exception.GetType().Name)"
            exit 0
          }

      - name: 'Acceptance B: own _work read MUST succeed'
        run: |
          $p = 'C:\CoursIA-Runners\fast-guards\_work'
          Get-ChildItem -LiteralPath $p -ErrorAction Stop | Select-Object -First 3 -ExpandProperty Name
          Write-Output "OK READABLE: $p"

