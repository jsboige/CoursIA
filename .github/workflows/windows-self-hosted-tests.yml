name: Windows Self-Hosted Tests

# Dispatch-only : ZERO declencheur pull_request/push, donc zero fan-out CI
# (#13097). La famine rend tout declencheur automatique contre-productif ;
# ce workflow existe pour etre appele a la demande, au moment ou un runner
# ephemeral myia-po-*-fast-guards est Idle (voir #12704 / #13097).
#
# Cycle de vie : un runner --ephemeral traite AU PLUS UN JOB puis se
# desenregistre (docs/ci/self-hosted-runners.md, manage_self_hosted_runner.py).
# Chaque dispatch consomme donc l'enregistrement courant : un dispatch,
# un job, un runner. Ne pas dispatcher deux fois de suite sans avoir
# re-enregistre un runner.

on:
  workflow_dispatch:

permissions:
  contents: read

# Un runner ephemeral ne peut prendre qu'un job a la fois : un second
# dispatch resterait en file pour toujours (plus de runner apres le 1er job).
# cancel-in-progress annule la file precedente au lieu de l'empiler.
concurrency:
  group: windows-self-hosted-tests
  cancel-in-progress: true

jobs:
  windows-confinement-tests:
    name: Scripts Tests (Windows runner)
    runs-on: [self-hosted, coursia-ephemeral, coursia-fast-guards]
    timeout-minutes: 15

    steps:
      # CONTROLE NEGATIF DE FORK (acceptance D item 2, #12704 -- mission ai-01
      # 2026-08-28T14:33Z, ordre strict item 2) : simulation PAR PAYLOAD de
      # l'evenement fork, executee sur le runner. Le garde canonique vit dans
      # l'expression YAML du job (PR #13382) ; cette sonde prouve sa SEMANTIQUE
      # sur les trois classes de payload -- fork refuse, same-repo et non-PR
      # autorises. Auto-tranchante : un payload fork autorise a tort = run rouge.
      # Version de BRANCHE jetable : jamais merger.
      - name: 'Fork sim: fork PR payload MUST be refused'
        run: |
          $ev = 'pull_request'
          $headRepo = 'some-student-fork/CoursIA'
          $allowed = ($ev -ne 'pull_request') -or ($headRepo -eq 'jsboige/CoursIA')
          if ($allowed) {
            Write-Output "FAIL: fork payload ($headRepo) was ALLOWED -- guard semantics broken"
            exit 1
          }
          Write-Output "OK REFUSED: event=$ev head=$headRepo -- fork never reaches the job"
          exit 0

      - name: 'Fork sim: same-repo PR payload MUST be allowed'
        run: |
          $ev = 'pull_request'
          $headRepo = 'jsboige/CoursIA'
          $allowed = ($ev -ne 'pull_request') -or ($headRepo -eq 'jsboige/CoursIA')
          if (-not $allowed) {
            Write-Output "FAIL: same-repo payload was REFUSED -- guard too strict"
            exit 1
          }
          Write-Output "OK ALLOWED: event=$ev head=$headRepo"
          exit 0

      - name: 'Fork sim: non-PR event (workflow_dispatch) MUST be allowed'
        run: |
          $ev = 'workflow_dispatch'
          $headRepo = ''
          $allowed = ($ev -ne 'pull_request') -or ($headRepo -eq 'jsboige/CoursIA')
          if (-not $allowed) {
            Write-Output "FAIL: dispatch payload was REFUSED -- guard too strict"
            exit 1
          }
          Write-Output "OK ALLOWED: event=$ev (guard scoped to pull_request events only)"
          exit 0
