name: concurrency-conj-guard

# #13488 -- refoule la conjonction ``push: main`` + ``concurrency.group`` portant
# ``github.ref`` + ``concurrency.cancel-in-progress: true`` (litteral).
# Le defaut que #13372 corrige (mesure 2026-08-28 : 27/30 et 26/30 runs
# annules par le merge suivant) est silencieux isolement et bruyant en
# cascade : un seul run isole passe, mais la premiere paire de merges
# successifs detruit la moitie de la verification. Cet organe rend la
# regression impossible a relivrer : la prochaine PR qui reintroduit la
# conjonction rougit ici, nomme le fichier + la ligne + la forme du fix.
#
# DORMANT depuis #14057 (Vague 2 tranche 1, patron #13384) : l'organe
# pull_request ci-dessous est absorbe par always-on-metadata-guards.yml --
# un seul workflow, un seul checkout, un seul slot de runner par PR (149
# runs/fenetre pour ~3 min de travail reel, mesure etape 1 de #14057). Le
# job est conserve verbatim pour la tracabilite ; le declencheur
# pull_request est retire.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: concurrency-conj-guard-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    name: concurrency-conj-guard
    # Q35 etape 2 (#17397) : garde Python pur (concurrency-conj), vehicule
    # d'identite dormant absorbe par always-on-metadata-guards.yml (cf. entete
    # l. 12-17). Aucun secret, aucun GPU/CUDA/Lean/.NET. La garde same-repo
    # ci-dessous est conservee telle quelle -- seul le runner change, aucune
    # semantic de declenchement. Sortie de SELF_HOSTED_WORKFLOW_ALLOWLIST
    # dans le meme commit.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    steps:
      # 2026-10-27 (#22722) : la commande qui echoue est le `git checkout --force -B`
      # final d'actions/checkout, pas son clean/reset interne (run 40476005592 :
      # clean et reset passent, "HEAD is now at eb8ab03489", puis le checkout
      # refuse le carnet JEPA "not uptodate; will not remove from working tree").
      # Ce refus est la verification de retrait du retrecissement sparse
      # (apply_sparse_checkout, WARNING_SPARSE_NOT_UPTODATE_FILE, git 2.43.0) :
      # a blob inchange, elle compare le fichier au blob de l'index ; ni --force
      # ni le reset interne ne la contournent. Mitigation EMPIRIQUE, mecanisme
      # NON TRANCHE : sur git 2.43.0 tout etat residuel reproduit localement est
      # deja nettoye par le clean+reset du built-in (ce step rejoue la meme
      # commande, sans effet ajoute), et l'etat qui a survecu a son reset n'est
      # pas reproduit (mutation entre reset et checkout ? checkout interrompu ?).
      - name: Restore the warm work tree before the sparse checkout
        run: |
          set -u
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            dirty=$(git -C "$GITHUB_WORKSPACE" -c safe.directory="$GITHUB_WORKSPACE" status --porcelain 2>/dev/null | head -n 1)
            if ! git -C "$GITHUB_WORKSPACE" -c safe.directory="$GITHUB_WORKSPACE" reset --hard --quiet; then
              echo "::warning::[heal-worktree] reset --hard a echoue -- le retrecissement sparse peut refuser (#22722)"
            elif [ -n "$dirty" ]; then
              echo "::notice::[heal-worktree] arbre restaure -- le job precedent avait laisse un etat sale (${dirty}) -- le retrecissement sparse passe (#22722)"
            fi
          fi
      - uses: actions/checkout@v4
        with:
          # Cone mode (le defaut) n'accepte que des REPERTOIRES : une entree de
          # fichier fait echouer le checkout (`fatal: ... is not a directory`).
          # Mesure : en non-cone ces chemins se listent SANS slash initial -- la
          # forme `/chemin` que suggere l'avertissement de git rend un checkout VIDE.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows
            scripts/ci/check_concurrency_conj.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML if absent
        # PyYAML n'est pas preinstalle sur les runners ubuntu-latest par
        # defaut. Pattern partage avec unique-check-run-names-guard.yml :
        # import-test en dry-run, fallback pip install silencieux. Sans
        # cette etape, exit 2 BROKEN_INSTRUMENT masquerait la conjonction
        # en rouge de complaisance (cf #11850).
        run: python -c "import yaml" 2>/dev/null || pip install --quiet pyyaml

      - name: Check concurrency conjunction
        # Forme fix de #13372 deja majoritaire : cancel-in-progress gate sur
        # event_name == 'pull_request' pour annuler sur PR (un groupe par
        # PR, jamais collision) et laisser vivre sur push:main (les merges
        # successifs ne se tuent pas entre eux).
        run: python scripts/ci/check_concurrency_conj.py --check --json
