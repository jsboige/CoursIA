name: Cell-order gate

# Purpose
# -------
# Per-PR REGRESSION gate for cell ordering / enchainement (Epic #3240).
# For every notebook changed by the PR, compare its HIGH cell-ordering findings
# (scripts/notebook_tools/scan_cell_ordering.py) between the base revision and
# the PR revision and FAIL only on a regression -- a HIGH finding introduced by
# the PR. Pre-existing findings in legacy notebooks (tracked under #3240) do NOT
# block unrelated PRs. A new notebook (no base) must be clean.
#
# Convention: .claude/rules/notebook-conventions.md ("Enchainement et ordre
# canonique des cellules"). Skill: /check-cell-order.

# ABSORBE PAR LA VOIE RAPIDE (#22209, registre TRANCHE39) : la jambe per-PR
# vit desormais dans le job fast-lane d'always-on-guards.yml, sous le MEME
# nom de check-run (contrat d'identite byte-a-byte
# `check_absorbed_check_run_identity.py`), avec le pre-controle pytest du
# scanner porte par `pre_argv` et le mode `--base-ref` du detecteur. Le
# declencheur `pull_request` est retire ci-dessous ; ce fichier reste pour
# (a) la re-mesure manuelle via `workflow_dispatch` (la jambe ci-dessous
# re-joue le gate contre origin/main -- le corps du job reste fonctionnel,
# precedent mermaid-fill-color-advisory.yml TRANCHE27) et (b) la source du
# nom canonique du job. Le bloc `paths:` d'origine est conserve en
# commentaire pour tracabilite (le perimetre vit dans `Guard.paths` du
# registre, qui doit le COUVRIR -- garde de migration #12567) :
#   pull_request:
#     paths:
#       - 'MyIA.AI.Notebooks/**/*.ipynb'
#       - 'scripts/notebook_tools/scan_cell_ordering.py'
#       - 'scripts/notebook_tools/cell_order_ci.py'
#
# L'entree SELF_HOSTED_WORKFLOW_ALLOWLIST de check_self_hosted_runner_policy.py
# RESTE : la jambe de re-mesure manuelle est toujours self-hosted (la sortie
# d'allowlist vise les workflows migrés vers ubuntu-latest, pas les absorbus
# qui gardent leur jambe manuelle -- precedent mermaid TRANCHE27).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cell-order-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cell-order:
    name: "No cell-ordering regression in changed notebooks"
    # Le `if:` original est CONSERVE tel quel : son premier disjoncte
    # (`== null`) est vrai sur `workflow_dispatch` (pas de contexte PR), ce
    # qui laisse la re-mesure manuelle tourner ; le second saute les PRs de
    # fork si le declencheur `pull_request` etait un jour re-cable.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Re-mesure manuelle vs origin/main
        run: |
          set -uo pipefail
          git fetch origin main -q
          CHANGED=$(git diff --name-only origin/main...HEAD -- 'MyIA.AI.Notebooks/**/*.ipynb' || true)
          if [ -z "$CHANGED" ]; then
            echo "::notice title=Cell-order gate::No notebooks changed vs origin/main — clean."
            exit 0
          fi

          fail=0
          echo "## Cell-order gate (re-mesure manuelle)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r nb; do
            [ -z "$nb" ] && continue
            # Skip notebooks deleted by the branch.
            [ -f "$nb" ] || continue
            # `&& rc=0 || rc=$?` is load-bearing under `bash -e` (#8884 motif);
            # NOT `|| true` (it permanently disarms the gate).
            out=$(python scripts/notebook_tools/cell_order_ci.py --base-ref origin/main --head "$nb") && rc=0 || rc=$?
            if [ $rc -ne 0 ]; then
              echo "::error title=Cell-order regression::$nb introduces new HIGH cell-ordering finding(s) vs origin/main."
              echo "$out"
              echo "<details><summary><code>$nb</code></summary>" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "$out" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "</details>" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            else
              echo "  OK  $nb"
            fi
          done <<< "$CHANGED"

          if [ "$fail" -ne 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Ground-truth each finding (the signal is not a verdict, rule G.1), then re-order with \`NotebookEdit\` (bottom-up) and re-execute (C.2). See the \`/check-cell-order\` skill." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "::notice title=Cell-order gate::No ordering regression vs origin/main."
