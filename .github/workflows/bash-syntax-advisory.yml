name: Bash Syntax Advisory

# Advisory organ for the Linux/macOS .sh companions (#10644, EPIC #10643).
# Closes the two remaining acceptance criteria of #10644:
#   1. "bash -n syntax check OK sur tous les nouveaux .sh" -- no organ ever
#      ran `bash -n` on scripts/**/*.sh. A broken .sh (the bash analog of the
#      .ps1 `[Text.Encoding]::Latin1` bug tracked in #10840) would survive on
#      main until a manual run.
#   2. "dry-run advisory en CI ubuntu-latest" -- non-blocking advisory signal,
#      following the repo pattern of stale-base-warning.yml (warning + PR
#      comment, never a hard failure on the advisory path).
#
# Layering:
#   - syntax-check: FAILS on a broken .sh (that is the point -- it must be
#     visible). Scope repo-wide since #10643 (2026-09-04): every tracked .sh,
#     not just scripts/ -- 46 of the 56 companions lived outside scripts/
#     and were never read by this guard. The EPIC body's out-of-scope zones
#     (Vibe-Coding, docs/archive/, _archive/) are excluded: frozen
#     inheritance + one known-broken teaching artefact tracked separately.
#   - shebang-dry-run-advisory: continue-on-error -- never fails the PR;
#     warns + posts a PR comment when a shebang / executable-bit issue is
#     found, and EXECUTES every companion that declares a no-build dry mode
#     with a `# CI-CHECK:` header line (declare-dry-run step). `bash -n`
#     above proves a companion parses; this step proves it still runs --
#     the "execute rather than parse" half of acceptance criterion 4, which
#     was met in appearance only while one script was hardcoded here (#10643,
#     relecture 2026-10-05 : 10 of 64 in-scope companions expose a dry mode,
#     one was wired).

on:
  push:
    branches: [main]
    paths:
      - '**/*.sh'
      - '.github/workflows/bash-syntax-advisory.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, edited, reopened]
    paths:
      - '**/*.sh'
      - '.github/workflows/bash-syntax-advisory.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bash-syntax-advisory-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  syntax-check:
    name: bash -n every tracked .sh (advisory)
    # Routage #14283 tranche 3c (ai-01 2026-09-02) : jambe Linux auto-hebergee.
    # Garde anti-fork au niveau job + runs-on STATIQUE (une expression leverait
    # DYNAMIC_RUNS_ON dans check_self_hosted_runner_policy.py).
    # Retour arriere = remettre `runs-on: ubuntu-latest` + retrait de l'allowlist.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: |
          set -euo pipefail
          FAILED=0
          while IFS= read -r f; do
            if bash -n "$f"; then
              echo "OK: $f"
            else
              echo "::error::bash syntax error: $f"
              FAILED=1
            fi
          done < <(git ls-files '*.sh' | grep -v -E '^(MyIA.AI.Notebooks/GenAI/Vibe-Coding/|docs/archive/)|(^|/)_archive/' | sort)
          exit "$FAILED"

  runner-script-tests:
    name: Runner script behavioural tests
    # Complements bash -n (syntax) with execution: the sibling bash tests that
    # live alongside the self-hosted Linux runner scripts
    # (scripts/ci/docker/linux-runner/test_*.sh). Discovered by glob so a new
    # test_*.sh is wired automatically -- a semantic regression of the block
    # under test can no longer land unappercu (NanoClaw reserve, PR #15226
    # review 16:54:37Z). Runs on the same self-hosted jambe as syntax-check
    # (routing #14283 tranche 3c, do not revert independently); it is queued
    # while that runner is starved, exactly like syntax-check.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - name: Run linux-runner test_*.sh
        run: |
          set -euo pipefail
          FAILED=0
          for t in scripts/ci/docker/linux-runner/test_*.sh; do
            [ -e "$t" ] || continue
            echo "== $t =="
            if bash "$t"; then
              echo "OK: $t"
            else
              echo "::error::runner script test failed: $t"
              FAILED=1
            fi
          done
          exit "$FAILED"

  shebang-dry-run-advisory:
    name: Shebang + dry-run advisory (non-blocking)
    # Routage #14283 tranche 3c (ai-01 2026-09-02) : jambe Linux auto-hebergee.
    # Garde anti-fork au niveau job + runs-on STATIQUE (une expression leverait
    # DYNAMIC_RUNS_ON dans check_self_hosted_runner_policy.py).
    # Retour arriere = remettre `runs-on: ubuntu-latest` + retrait de l'allowlist.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Shebang + executable-bit audit
        id: audit
        run: |
          set -euo pipefail
          WARN=0
          while IFS= read -r f; do
            if ! head -1 "$f" | grep -qE '^#!(/usr/bin/env bash|/bin/bash)$'; then
              echo "::warning::non-bash shebang or missing: $f"
              WARN=1
            fi
            if [ ! -x "$f" ]; then
              echo "::warning::not executable (chmod +x): $f"
              WARN=1
            fi
          done < <(git ls-files '*.sh' | grep -v -E '^(MyIA.AI.Notebooks/GenAI/Vibe-Coding/|docs/archive/)|(^|/)_archive/' | sort)
          echo "warnings=$WARN" >> "$GITHUB_OUTPUT"
      - name: Execute every companion declaring a dry mode (# CI-CHECK:)
        run: |
          set -uo pipefail
          # Declared, not guessed. A companion opts in with a header line at
          # column 0:
          #     # CI-CHECK:             <- no argument (check-only default)
          #     # CI-CHECK: --check      <- arguments forwarded verbatim
          # Discovery, not a hardcoded list: the guard cannot go stale on the
          # next companion, and no script is executed on a guess -- only on its
          # author's declaration.
          #
          # Safety: every wired declaration was READ before wiring; none of the
          # five installs anything.
          #   setup_environment.sh      check-only without --auto-fix (every
          #                             installer sits behind that flag). It does
          #                             append its relative CHECKPOINT_FILE
          #                             (setup_checkpoint.txt) to the CWD -- a
          #                             log file, harmless in an ephemeral job
          #                             workspace, and the only write of the set.
          #   audit_environment.sh      read-only without --export-json.
          #   setup_lean4_native.sh --check / h7_p3_notebook_runner.sh
          #                             --check-env verify then exit.
          #   build_advisory.sh check   denominator check, no build.
          # Companions whose only mode mutates the host or the tree stay OUT on
          # purpose: install-ffmpeg.sh (sudo apt-get), z3-build-deploy.sh and
          # automata-build-deploy.sh (rm -rf + cp into the tracked .deploy/), and
          # the three ML-Training-Pipeline launchers (their --dry-run still runs
          # the training entry point, so it needs the ML environment).
          #
          # A non-zero exit is REPORTED, never fatal: these checks measure a HOST
          # state, and the CI runner is not a notebook host -- exit 1 here means
          # "this host is not provisioned", which is expected. The signal bought
          # is that a declared dry mode can no longer rot unseen: a companion
          # whose check starts crashing shows up in this log.
          mapfile -t DECLARED < <(
            git ls-files '*.sh' \
              | grep -v -E '^(MyIA.AI.Notebooks/GenAI/Vibe-Coding/|docs/archive/)|(^|/)_archive/' \
              | sort \
              | while IFS= read -r f; do
                  grep -qE '^# CI-CHECK:' "$f" && echo "$f"
                done
          )
          echo "companions declaring a dry mode: ${#DECLARED[@]}"
          RAN=0; BAD=0
          for f in "${DECLARED[@]}"; do
            args="$(sed -n 's/^# CI-CHECK:[[:space:]]*//p' "$f" | head -1)"
            echo "== $f [args: ${args:-none}]"
            rc=0
            # shellcheck disable=SC2086 -- the declaration carries its own argv
            bash "$f" $args || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "   OK (exit 0)"
            else
              echo "::notice::declared dry mode exited $rc: $f"
              BAD=$((BAD + 1))
            fi
            RAN=$((RAN + 1))
          done
          echo "executed: $RAN companion(s), non-zero: $BAD"
          if [ "$RAN" -eq 0 ]; then
            echo "::warning::no companion declares '# CI-CHECK:' -- this path is inert"
          fi
      - name: Post advisory comment on PR
        if: steps.audit.outputs.warnings == '1' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body "## Bash Syntax Advisory — shebang / executable-bit warnings
          See the \`Shebang + dry-run advisory\` job log for the per-file \`::warning::\` lines. Non-blocking."
