name: Degraded-mode confession detector (advisory)

# Durable advisory for the #11754 pathologie: a re-executed notebook in
# graceful-degradation mode SAYS in its committed outputs that it skipped
# a branch ("OpenAI API key non configuree - comparaison skippee",
# "WARNING: .env non trouve") while every structural gate stays green
# (monotone execution_count, 0 error, outputs populated). Founding case:
# PR #11443 commit 66e2a429bb -- cell 26 of 01-5-Kokoro-TTS-Local went
# 12 outputs / 1.35 MB to 4 outputs / 491 KB, and the TOTAL PR output
# volume still GREW (5.40 -> 5.86 MB), so even a total-volume check
# would have passed it.
#
# Why ADVISORY (not blocking): the four confession patterns
# (NON_CONFIGURED / SKIPPED / NOT_FOUND / UNAVAILABLE_FR) have ~118
# pre-existing occurrences on the corpus (measured 2026-08-19). The
# detector only signals NEW confessions vs the merge-base
# (frozen-inheritance, cf. h1_hygiene_scan #11840 / pip-leak-guard
# #6314), which keeps the signal clean on inherited debt -- but the
# false-positive tail of "new yet legitimate" (a pedagogical cell that
# newly demonstrates a skip path ON PURPOSE) is not yet measured. A
# reviewer triages; never block a merge on this signal alone.
#
# Orthogonality vs check_render_volume_delta (#11656): that organ reads
# relative OUTPUT VOLUME per MIME family and carries its own narrow
# UNAVAILABLE_SIGNAL (non disponible / not available / importerror).
# None of those three matches the founding confession. This organ reads
# the DECLARED text. Keep both.
#
# Expression-safety note (ai-01 lesson, 2026-08-19T21:43Z): the
# render-volume advisory shipped an unparseable `${{ ... s\'abstient ... }}`
# expression -- GitHub Actions knows no backslash escape, and the run
# died BEFORE creating any job (0 jobs = 0 log = organ dead while
# "green-ish"). This file keeps NO apostrophe inside any `${{ }}`
# expression on purpose.

on:
  schedule:
    # Nocturnal sweep -- post-merge main verification.
    # Tranche 1 #12817 : sortir les advisory lourds de pull_request
    # (clone 2.22 Go par run). Stratification user 2026-08-23 :
    # "les jobs lourds devraient être payés une fois par fournée".
    - cron: '10 03 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: degraded-mode-advisory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  degraded-mode-advisory:
    name: "Degraded-mode confessions (#11754 advisory)"
    # Routage #14283 tranche 4 (ai-01 2026-09-02) : balayage cron pur-Python.
    # Declencheur `schedule` uniquement -- il ne tourne que sur la branche par
    # defaut, donc aucun code de fork ne peut l'atteindre et aucune garde
    # same-repo n'est requise (cf en-tete de check_self_hosted_runner_policy.py).
    # Retour arriere = remettre `runs-on: ubuntu-latest` + retrait de l'allowlist.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 obligatoire pour que `git merge-base origin/main HEAD`
          # resolve sur une branche en retard (cf. #11646/#11658 : un
          # fetch-depth limite fait echouer merge-base silencieusement).
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest scripts/notebook_tools/tests/test_detect_degraded_mode.py -v

      - name: Run detector (advisory, do not gate)
        id: run
        run: |
          set +e
          # Base de fusion = merge-base origin/main HEAD. Si introuvable :
          # ABSTENTION EXPLICITE -- jamais de fallback silencieux sur
          # origin/main (qui rendrait « pas regarde » et « rien trouve »
          # indistinguables, cf. garde anti-auto-desarmement #8655/#8662).
          BASE=$(git merge-base origin/main HEAD 2>/dev/null)
          if [ -z "$BASE" ]; then
            echo "findings_total=abstain" >> "$GITHUB_OUTPUT"
            echo "::warning::degraded-mode: merge-base origin/main HEAD introuvable -- detector abstains (shallow fetch or unanchored branch)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Notebooks modifies/renommes entre BASE et HEAD (pas origin/main
          # deux-points : une branche en retard y lirait les evolutions de
          # main hors PR). -M50% attrape les renames.
          CHANGED=$(git diff --name-only --diff-filter=MR -M50% "$BASE" HEAD | grep -E '\.ipynb$' | head -50)
          if [ -z "$CHANGED" ]; then
            echo "findings_total=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/notebook_tools/detect_degraded_mode.py \
            $CHANGED \
            --base "$BASE" --check --json > /tmp/degraded-mode.json 2> /tmp/degraded-mode.err
          rc=$?
          if [ "$rc" = "2" ]; then
            echo "findings_total=abstain" >> "$GITHUB_OUTPUT"
            echo "::warning::degraded-mode: structural error (rc=2) -- detector abstains. See workflow log." >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/degraded-mode.err >&2
            exit 0
          fi
          findings_total=$(python -c "import json;print(json.load(open('/tmp/degraded-mode.json'))['findings_total'])" 2>/dev/null || echo "abstain")
          echo "findings_total=$findings_total" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          d = json.load(open('/tmp/degraded-mode.json'))
          for r in d.get('results', []):
              if 'error' in r:
                  print(f"::warning::{r['notebook']}: {r['error']}")
                  continue
              for f in r.get('findings', []):
                  bb = f.get('cell_output_bytes_base')
                  bbs = str(bb) if bb is not None else '?'
                  print(f"::warning file={r['notebook']}::"
                        f"NEW {f['pattern']} cell {f['cell_index']} "
                        f"[{bbs} -> {f['cell_output_bytes_head']} bytes] : {f['line'][:120]}")
          PY
          set -e

      - name: Post advisory comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: degraded-mode-advisory
          message: |
            ${{ steps.run.outputs.findings_total == '0' && 'No new degraded-mode confessions in modified notebooks (vs merge-base). Inherited confessions are tolerated by design (frozen-inheritance).' || steps.run.outputs.findings_total == 'abstain' && 'Degraded-mode detector ABSTAINS: merge-base unresolved or structural error -- no verdict. See workflow log.' || format('WARNING: {0} new degraded-mode confession(s) in committed outputs (vs merge-base): a re-exec may have run in degraded mode (missing .env / API key in a worktree, service down) and silently dropped content. Check the workflow warnings for cell, bytes and the confession line. Advisory, NOT a merge gate.', steps.run.outputs.findings_total) }}

            Detector: `python scripts/notebook_tools/detect_degraded_mode.py <nb> --base <merge-base> --check`
            Rationale: #11754 / #11443 (860 KB lost while all structural gates stayed green).
