name: Lean Axiom Check (reusable)

# Reusable Level 3 axiom-check CI for any Lean project in the repo.
# Closes #8677 criterion 4 (criterion B.3 of pr-review-discipline:
# "Proof integrity SUCCESS"). The Python helper `LeanVerifier.check_axioms`
# was wired in #8680 (sorryAx policy + per-declaration `#print axioms`).
# This workflow is the *câblage CI* on the lake side: opt-in per lake,
# caller pattern below.
#
# The check is NOT a build run — we assume `lean-build.yml` already ran
# successfully upstream. We just need the lake project cached and the
# toolchain present, so we run the same setup steps — and since #14921
# option 1 the cache key is the SAME as lean-build's, so `needs: ci`
# hands us the ci job's own build artifacts (exact HIT, no rebuild).
# If `lake build`
# fails, the `#print axioms` step will too, and the job will exit 1 with
# the lake error in the logs.
#
# Callers invoke this via:
#   jobs:
#     proof-integrity:
#       uses: jsboige/CoursIA/.github/workflows/lean-axiom.yml@main
#       with:
#         project-path:   MyIA.AI.Notebooks/SymbolicAI/Lean/knot_lean
#         display-name:   knot_lean
#         target-modules: "Knots.Basic,Knots.Conway,Knots.Invariant,Knots.Reidemeister,Knots.Lidman"
#         allow-axioms:   "propext,funext,Quot.lift,Quot.mk,Quot.sound,Classical.choice"
#
# Output:
# - On success: prints "OK: no forbidden axioms" plus a per-declaration
#   summary (declaration -> axioms list) for review traceability.
# - On failure: prints the forbidden axioms with the declarations that
#   pulled them in, then exits 1. The PR review rule B.3 is satisfied by
#   quoting the relevant block from this log.

on:
  workflow_call:
    inputs:
      project-path:
        description: "Repo-relative path to the lake project root"
        type: string
        required: true
      display-name:
        description: "Human-readable project name (for job labels)"
        type: string
        required: true
      target-modules:
        description: "Comma-separated dotted module names to check (e.g. 'Knots.Basic,Knots.Conway'). Per-module, theorem/lemma/def/axiom/instance/structure/inductive decls are enumerated from the source file. May also be '*' (issue #10889): the module list is then derived at runtime by walking every *.lean under project-path (minus .lake/, .git, node_modules, .venv, lakefile*, lean-toolchain) -- the same set `lake -R build` would elaborate, modulo the lean_lib orphan trap #19015 (a file in a non-default lib, or in no lean_lib, is never built; covered by the dedicated `lean_lib orphan check` step below)."
        type: string
        required: true
      include-i18n-siblings:
        description: "When `target-modules: \"*\"`, whether the runtime derivation keeps `_en` i18n siblings (any path segment -- dir or stem -- ending in `_en`). Default 'false' excludes them, matching the FR-only measurement of #10889; a caller that wants the full bilingual surface opts in. Ignored when target-modules is an explicit list."
        type: string
        default: "false"
      allow-axioms:
        description: "Comma-separated additional axioms to whitelist beyond the defaults (propext, funext, Classical.choice, Quot.lift, Quot.mk, Quot.sound). Use sparingly — adding an axiom to this list is an explicit acknowledgement that the project's proofs may depend on it."
        type: string
        default: ""
      fail-on-sorry:
        description: >-
          Whether a transitive `sorryAx` fails the run. Leave at `true` for a
          lake whose proofs are meant to be complete. Set to `false` for a lake
          with acknowledged open `sorry`s: the job then still hard-fails on
          forbidden axioms, and reports `has_sorry` per module without gating
          on it. This is an honesty knob, not a leniency one — a gate that can
          never go green teaches reviewers to ignore it, which is the exact
          mirror of a gate that can never go red.
        type: boolean
        default: true
      strict-orphan-check:
        description: >-
          Issue #19015: whether the lean_lib orphan gate runs in --strict mode.
          Default false (advisory: orphans are reported but the job does not
          fail). Set true ONLY for lakes that have been audited clean — a green
          CI on a lake with an orphan says nothing about the orphan's axioms.
          A false positive here (orphan flagged that is actually intentional)
          is opt-out per-file via `orphan-exclude`.
        type: boolean
        default: false
      orphan-exclude:
        description: >-
          Issue #19015: lake-relative path of a .lean file to whitelist as an
          intentional orphan (e.g. ``GameTheory.lean`` for EPIC #4365's
          skeleton aggregator). Comma-separated, repeatable; consumed by
          ``scripts/lean/check_lean_orphans.py --exclude``. Ignored unless
          ``strict-orphan-check: true``.
        type: string
        default: ""

# A reusable workflow cannot request more than its caller grants. #8951 gave the
# callers (lean-conway.yml, lean-knot.yml) `permissions: {contents: read}`, which
# implicitly sets pull-requests to none -- so this block's `pull-requests: write`
# became unsatisfiable and both callers died at startup, gate included. The grant
# was dead anyway (this file posts no comment, runs no `gh`, no github-script:
# grep-verified), exactly like the one #8951 removed from lean-build.yml. Dropping
# it completes that hardening instead of contradicting it. See #8949.
permissions:
  contents: read

jobs:
  axiom-check:
    name: "Proof integrity (${{ inputs.display-name }})"
    runs-on: ubuntu-latest
    # BACKSTOP DE LIBERATION DE RUNNER -- PAS UN SEUIL DE SANTE (#15698).
    #
    # Sans borne, un `lake exe env lean` ou un `LeanVerifier.check_axioms`
    # enlise retient le runner les 6 h du defaut GH Actions et le check ne
    # conclut jamais -- le PR gate reste BLOCKED sur un verdict qui n'atterrit
    # pas. La borne convertit l'enlisement en check ROUGE, que le merge-gate
    # peut voir.
    #
    # 300 et pas 60. Maximum LEGITIME mesure de `proof-integrity` = 177 min,
    # conclusion `success` (job 102677021168, step `lean-axiom` de 2 h 55) ;
    # 1 succes sur 20 depasse 60 min, mediane 8 min (30 runs, 2026-09-12). La
    # fenetre de 12 runs qui justifiait « 60 = 2x le pire observe » ratait la
    # queue de distribution : le pire observe n'etait pas le pire legitime.
    #
    # NE PAS RESSERRER sur l'intuition : le maximum legitime et la pathologie
    # vivent dans la meme plage de temps de mur. 300 laisse 1,7x de marge et
    # rend le runner 3 h avant le defaut GH.
    timeout-minutes: 300
    steps:
    - uses: actions/checkout@v4

    - name: Install elan
      run: |
        curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
        ./elan-init -y --default-toolchain none
        echo "$HOME/.elan/bin" >> $GITHUB_PATH

    - name: Restore Lake build artifacts
      id: lake-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ inputs.project-path }}/.lake
        # Key is IDENTICAL to lean-build's (workflows/lean-build.yml and
        # actions/lean-build/action.yml, etape `Restore Lake build artifacts`): same path, same hashed file set
        # {lakefile.lean|toml, lean-toolchain}. Callers run `needs: ci`, so the
        # ci job of the SAME run has already saved this exact key — here it is
        # an exact HIT and the `lake -R build` below is a no-op trace, not a
        # rebuild. One cache entry per lake instead of two (footprint /2,
        # See #14921 option 1). Legacy `-axiom-` keys do not prefix-match the
        # new restore-keys, so they expire by LRU without ever being served.
        # RESTORE SEUL (#19658) : le SAVE appartient au job `ci` du meme run
        # (et, hors run, a `main` seul) -- cette jambe ne fait que consommer.
        key: lake-${{ inputs.display-name }}-${{ runner.os }}-${{ hashFiles(format('{0}/lakefile.lean', inputs.project-path), format('{0}/lakefile.toml', inputs.project-path), format('{0}/lean-toolchain', inputs.project-path)) }}
        restore-keys: lake-${{ inputs.display-name }}-${{ runner.os }}-

    - name: Add swap space
      # Same OOM guard as lean-build.yml (see the comment there): a cache-miss
      # build of a large local module (conway_lean HashlifeCorrectness.lean)
      # exceeds the 16 GB of hosted runners and the VM is torn down with exit 143.
      # With the shared key the steady state is a HIT, but the swap stays: on
      # cache eviction (or a first run of a new lake) this job still builds
      # cold — the observed failure mode of PR #9798, where both jobs died at
      # exit 143 with two independently-missed caches.
      # 16 G -> 32 G (2026-08-07, PR #9840): teardown recurred with the swap step
      # green, and the peak is inside a SINGLE module — see the long note in
      # lean-build.yml for the measurements.
      run: |
        df -h /mnt
        sudo fallocate -l 32G /mnt/lean-swap
        sudo chmod 600 /mnt/lean-swap
        sudo mkswap /mnt/lean-swap
        sudo swapon /mnt/lean-swap
        free -h

    - name: Authenticate lake's git clones
      shell: bash
      run: |
        # Anonymous clones of lake deps die under a rafale of concurrent Lean jobs:
        # GitHub demands credentials and git (no TTY) exits code 128, and the package
        # that drops is whoever crosses the window (See #14886). Route every
        # github.com clone through the job token so no clone goes anonymous.
        git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
        # Confirm the rewrite is in effect without ever printing the job token.
        git config --global --get-regexp 'url\..*\.insteadof' | sed -E 's#x-access-token:[^@]+@#x-access-token:***@#g'

    - name: Lake build
      working-directory: ${{ inputs.project-path }}
      run: |
        set -o pipefail   # propagate lake's exit code through the pipeline (FAILED must
                          # exit != 0; See incident conway_lean HashlifeCorrectness L1058, 2026-06-14).
        lake exe cache get || true
        # Heartbeat (#15709): `tail` renders its window only at EOF, so a long
        # lake build is INVISIBLE from the step log — the wedged knot_lean runs
        # (3 h 13 and 2 h 10 of total console silence, cache HIT and cache MISS
        # alike) were cancelled blind at arbitrary durations. While the pipeline
        # is alive, print elapsed time + the log's last line every 10 min.
        # Read-only observability: the pipeline runs in a subshell whose exit
        # status `wait` propagates, so the #8915 failure group and the
        # 2026-06-14 pipefail invariant below are unchanged.
        (
          # On failure, surface the error lines the `tail` window loses (See #8915).
          if lake -R build 2>&1 | tee "$RUNNER_TEMP/lake.log" | tail -10; then
            :
          else
            rc=$?
            echo "::group::Error lines from the full lake log (See #8915)"
            grep -nE "^error:|\.lean:[0-9]+:[0-9]+: (error|warning)" "$RUNNER_TEMP/lake.log" | head -100 || true
            echo "::endgroup::"
            exit "$rc"
          fi
        ) &
        _lake_pipeline=$!
        _elapsed=0
        # Poll every 5 s, print every 10 min. A bare `sleep 600` here held the
        # runner until the next 10-min tick after the build had ended: 102 of
        # 140 runner-minutes on the 11 Lean jobs of PR #18186 were that sleep.
        while kill -0 "$_lake_pipeline" 2>/dev/null; do
          sleep 5
          _elapsed=$((_elapsed + 5))
          [ $((_elapsed % 600)) -eq 0 ] || continue
          kill -0 "$_lake_pipeline" 2>/dev/null || break
          echo "[lake-heartbeat] still running after $((_elapsed / 60)) min - last line: $(tail -1 "$RUNNER_TEMP/lake.log" 2>/dev/null | cut -c1-160)"
        done
        wait "$_lake_pipeline"

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    # No `working-directory:` here, and no `cd`, on purpose. Both paths are
    # derived from the environment below. A `working-directory:` on this step
    # is silently cancelled by any `cd` inside `run:`, which is exactly the
    # defect this replaces: the step declared the lake root, the `run` block
    # then moved to `$GITHUB_WORKSPACE`, and the check ran against the repo
    # root where no lake exists. `lake build` (which has a correct
    # `working-directory` and no `cd`) succeeded, so the job looked like an
    # axiom violation while it was really a "no lake here" error. See #8712.
    - name: Run lean_lib orphan check (#19015)
      # Issue #19015: a green ``lake -R build`` compiles only ``@[default_target]``
      # libs. Any .lean file in a non-default lib (or in no lean_lib at all)
      # is never elaborated -- the axiom check above then runs on a vacuous
      # view. This step closes the gap by enumerating the union of every
      # lean_lib's globs and reporting any file that is neither in a globs
      # nor imported by one. Strict-mode is opt-in per lake via
      # ``strict-orphan-check: true``; otherwise the step is advisory
      # (``if: always()`` so it runs even on a failed axiom step, surfacing
      # the orphan as a probable cause for the failure).
      if: always()
      env:
        DISPLAY_NAME: ${{ inputs.display-name }}
        PROJECT_PATH: ${{ inputs.project-path }}
        STRICT: ${{ inputs.strict-orphan-check }}
        EXCLUDE: ${{ inputs.orphan-exclude }}
      run: |
        set +e
        cd "$GITHUB_WORKSPACE"
        EXCLUDES=""
        if [ -n "$EXCLUDE" ]; then
          # Comma-separated list -> repeated --exclude flags.
          IFS=',' read -ra TOKS <<< "$EXCLUDE"
          for tok in "${TOKS[@]}"; do
            tok_trim="$(echo "$tok" | xargs)"
            [ -n "$tok_trim" ] && EXCLUDES="$EXCLUDES --exclude $tok_trim"
          done
        fi
        if [ "$STRICT" = "true" ]; then
          # In strict mode, propagate the script exit code (1 on orphan, 0 clean).
          python scripts/lean/check_lean_orphans.py \
            --project-path "$PROJECT_PATH" \
            --lakefile "$PROJECT_PATH/lakefile.lean" \
            --name "$DISPLAY_NAME" \
            --strict $EXCLUDES
        else
          # Advisory: always exit 0 so the gate does not block on a known
          # intentional orphan (e.g. ``GameTheory.lean`` on game_theory_lean,
          # EPIC #4365 skeleton). The ORPHAN list still goes to the job log
          # for review.
          python scripts/lean/check_lean_orphans.py \
            --project-path "$PROJECT_PATH" \
            --lakefile "$PROJECT_PATH/lakefile.lean" \
            --name "$DISPLAY_NAME" $EXCLUDES
          exit 0
        fi
    - name: Run axiom check
      env:
        MODULES: ${{ inputs.target-modules }}
        ALLOW: ${{ inputs.allow-axioms }}
        DISPLAY_NAME: ${{ inputs.display-name }}
        PROJECT_PATH: ${{ inputs.project-path }}
        FAIL_ON_SORRY: ${{ inputs.fail-on-sorry }}
        INCLUDE_I18N_SIBLINGS: ${{ inputs.include-i18n-siblings }}
      run: |
        set -eu
        # The check body lives in scripts/lean/axiom_check_step.py since
        # #17336 -- extracted VERBATIM from this heredoc so the matrix path
        # (.github/actions/lean-axiom) runs the same rule instead of a copy.
        # Env-driven contract (see the script docstring): inputs never come
        # from the cwd (#8712).
        python scripts/lean/axiom_check_step.py
    - name: Drop Mathlib oleans before the cache save
      # actions/cache saves `.lake` in its post step, at the end of this job
      # (success only). Mathlib's own oleans make up most of that archive:
      # ~2.4 GB per lake, so three lakes fill the 10 GB repo quota and evict
      # each other's caches -- the cold knot_lean builds of #18100 (#18185).
      # `lake exe cache get` in the build step fetches them again from the
      # Mathlib cache server, outside the quota (37 s in run 36378467990).
      # The lake's own build and the other packages stay cached.
      # Keep this step LAST: any later step would find Mathlib unbuilt.
      working-directory: ${{ inputs.project-path }}
      run: |
        rm -rf .lake/packages/mathlib/.lake/build
        du -sh .lake 2>/dev/null || true

    # SAVE EXPLICITE, main only (#19658). Les refs de PR restaurent mais
    # n'ecrivent plus : une PR qui manque la cle repart du cache de main via
    # `restore-keys` (prefixe), au lieu d'ajouter sa propre copie de ~650 Mo.
    - name: Save Lake build artifacts (main only)
      if: github.ref == 'refs/heads/main' && steps.lake-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ inputs.project-path }}/.lake
        key: ${{ steps.lake-cache.outputs.cache-primary-key }}
