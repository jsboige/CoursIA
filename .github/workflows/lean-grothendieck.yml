name: Lean Grothendieck CI

# CI for grothendieck_lean (SymbolicAI/Lean/grothendieck_lean).
# Grothendieck tribute — Mathlib tour of Grothendieck's mathematical language.
# Rule lean-merge-discipline: lake build SUCCESS local OBLIGATOIRE avant merge.
#
# Migrated to the reusable lean-build.yml per ai-01 DRY decision (option 2: matrix).
# Behavior is identical to the former inline check-sorry + build jobs.
#
# Sorry profile (switched 2026-07-12 to `real` mode, baseline=0; was prose-header/0):
# every Grothendieck module carries the bilingual boilerplate header "All `sorry`s
# eliminated at creation" / "Tous les `sorry`s éliminés à la création" (i18n #4980).
# prose-header mode filtered the possessive (`sorry's`) but still counted 3 mentions
# on main (the bare-word prose "sorry" in roadmap/index comments), and any bilingual
# docstring PR adding a legitimate prose "sorry" tripped the counter — #6208/#6202/#6197
# (SheafBasics/MathlibMap/Yoneda i18n, 0 new tactic sorry) all FAILED "count (3) >
# baseline (0)". Per lean-build.yml's guidance ("Use `real` when docstring prose
# legitimately says 'sorry' so comment edits do not flip the raw count"), switch to
# `real` mode: strip Lean comments (-- line + nested /- -/ block) then count
# word-bounded `\bsorry\b`. Mirrors the prover harness `count_real_sorries`
# (FX-6 #1453) — counts exactly compiled-tactic sorries, immune to docstring edits.
# Real-mode baseline = 0 (firsthand counted 2026-07-12 with the exact CI awk on
# origin/main across all 25 own .lean files: grothendieck_lean is FULLY PROVEN,
# zero tactic `sorry`). Mirrors the knot_lean switch in #6186.

on:
  push:
    branches: [main]
    paths:
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/grothendieck_lean/**.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/grothendieck_lean/lakefile.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/grothendieck_lean/lakefile.toml'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/grothendieck_lean/lean-toolchain'
      - '.github/workflows/lean-grothendieck.yml'
      - '.github/workflows/lean-axiom.yml'
      - '.github/workflows/lean-build.yml'
      # The axiom step is a Python program (`from lean_server import LeanVerifier`);
      # lean_server.py + lean_utils.py ARE gate inputs (cf #8722). Without these, an edit
      # to the enumerator reaches main unverified the same way the broken `cd` did.
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/lean_server.py'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/prover/lean_utils.py'
  pull_request:
    branches: [main]
    paths:
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/grothendieck_lean/**.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/grothendieck_lean/lakefile.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/grothendieck_lean/lakefile.toml'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/grothendieck_lean/lean-toolchain'
      # The gate must run on the PR that introduces or changes it, else a defect
      # in the gate ships unverified (cf #8712: a gate whose first run is
      # post-merge is no gate). These three lines make the workflow a gate input.
      - '.github/workflows/lean-grothendieck.yml'
      - '.github/workflows/lean-axiom.yml'
      - '.github/workflows/lean-build.yml'
      # The axiom step is a Python program (`from lean_server import LeanVerifier`);
      # lean_server.py + lean_utils.py ARE gate inputs (cf #8722). Without these, an edit
      # to the enumerator reaches main unverified the same way the broken `cd` did.
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/lean_server.py'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/agent_tests/prover/lean_utils.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: jsboige/CoursIA/.github/workflows/lean-build.yml@main
    with:
      project-path: MyIA.AI.Notebooks/SymbolicAI/Lean/grothendieck_lean
      display-name: grothendieck_lean
      sorry-baseline: "0"
      sorry-filter-mode: real

  # Level 3 proof-integrity gate (criterion B.3 of pr-review-discipline).
  # Closes #8677: catches forbidden axioms (incl. transitive `sorryAx`) the
  # textual sorry counter cannot see. Mirrors the câblage in lean-knot.yml /
  # lean-conway.yml, per ai-01 c.83 GO decision on #8782 (3rd lake cabling:
  # 2/23 lakes -> 3 on a gate that is structurally blind everywhere else).
  #
  # Why this lake is the easy one (firsthand re-verified 2026-08-05, correct
  # Lean-aware count_real_sorries: strip nested /- -/ blocks + -- lines +
  # string/backtick literals, then word-bound \bsorry\b): 0 real tactic
  # `sorry`, 0 `native_decide` across all 34 own modules. The 24 raw prose
  # mentions are the bilingual i18n boilerplate "All `sorry`s eliminated at
  # creation" / "Tous les `sorry`s éliminés" inside /- ... -/ docstrings --
  # backtick-quoted, never compiled. So:
  #   - allow-axioms: "" -- ONLY the reusable-workflow defaults
  #     (propext, funext, Classical.choice, Quot.lift, Quot.mk, Quot.sound),
  #     which lean-axiom.yml grants for free. `Classical.choice` comes in via
  #     Mathlib transitively and needs no enumeration here (lean-axiom.yml
  #     L49 documents the defaults). Contrast lean-conway.yml, which must
  #     enumerate 19 native_decide allow-axiom names -- grothendieck has none.
  #   - fail-on-sorry: true -- the lake is fully proven (sorry-baseline 0
  #     above); a transitive sorryAx must hard-fail, not be tolerated.
  #   - target-modules: "*" -- the module list is derived at runtime from the
  #     lake contents (issue #10889), so a hand-maintained list can never
  #     drift out of the gate's view again ("vert hors-cible", cf #8782).
  # NOTE: `uses: ./...` (not `@main`) -- this PR is what gives lean-axiom.yml
  # the `"*"` sentinel; resolving the callee from `main` would run the old
  # script, which treats `"*"` as a literal module, enumerates 0 declarations
  # and hard-fails lake non-vacuity. `./` resolves the callee per-PR (same
  # pattern as lean-knot.yml). Keep `./` until #10889 lands, then either form
  # is correct.
  proof-integrity:
    uses: ./.github/workflows/lean-axiom.yml
    with:
      project-path: MyIA.AI.Notebooks/SymbolicAI/Lean/grothendieck_lean
      display-name: grothendieck_lean
      target-modules: "*"
      allow-axioms: ""
      fail-on-sorry: true

