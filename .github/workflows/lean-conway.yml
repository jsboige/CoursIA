name: Lean Conway CI

# CI for conway_lean (SymbolicAI/Lean/conway_lean).
# Conway's Game of Life formalization (Hashlife, Kochen-Specker, Free Will).
# Rule lean-merge-discipline: lake build SUCCESS local OBLIGATOIRE avant merge.
#
# Consolidated per ai-01 DRY decision (option 2: matrix). Supersedes the inline
# version in PR #2747 (same standalone-tactic mode, same baseline 8, now via the
# shared lean-build.yml reusable workflow).
#
# Sorry profile (re-verified 2026-07-16 post-#6792, standalone-tactic mode,
# baseline=8): conway has 8 real tactic sorries, ALL in HashlifeCorrectness.lean.
# The standalone-tactic filter also counts the Lean case-bullet form `· sorry`
# (fixed in lean-build.yml, See #2747). Prose mentions ("Each sorry is a
# target", "Left as sorry", "remain sorry-gated") are excluded by the
# sole-token check. Breakdown of the 8:
#   - HashlifeCorrectness.lean: 8 = 5 sub-goals of the p4_succ_membership
#     decomposition (#6792: 4 mp quadrant cases + 1 mpr routing case)
#     + 3 downstream P4-gated (p5_large_n_jump, hashlife_correctN,
#     p5_large_n_jumpN)
#   - HashlifeMemo.lean:        0 (discharged since #2794, Phase 3c)
#   - Pillars.lean:             0 (discharged since #2790, scaffolding witnesses)
# Raising this baseline requires a documented justification in the PR body.
#
# Proof-integrity gate (c.949, See #8677, follows PR #8740 knot_lean pattern):
# Wired with `target-modules=Conway.Life.Computation` only (v1 — the module
# that holds the 105 native_decide-driven theorems). fail-on-sorry=false
# (acknowledged 8 sorries in HashlifeCorrectness.lean — same justification
# pattern as knot_lean's fail-on-sorry=false for its 17 sorries). allow-axioms
# is empty per global axiom policy (fail_on_sorry=True par défaut, écarts
# locaux justifiés — each native_decide hit is documented as a follow-up).

on:
  push:
    branches: [main]
    paths:
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean/**.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean/lakefile.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean/lakefile.toml'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean/lean-toolchain'
      - '.github/workflows/lean-conway.yml'
  pull_request:
    branches: [main]
    paths:
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean/**.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean/lakefile.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean/lakefile.toml'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean/lean-toolchain'
      - '.github/workflows/lean-conway.yml'
  workflow_dispatch:

jobs:
  ci:
    uses: jsboige/CoursIA/.github/workflows/lean-build.yml@main
    with:
      project-path: MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean
      display-name: conway_lean
      sorry-baseline: "8"
      sorry-filter-mode: standalone-tactic

  proof-integrity:
    uses: jsboige/CoursIA/.github/workflows/lean-axiom.yml@main
    with:
      project-path: MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean
      display-name: conway_lean
      target-modules: "Conway.Life.Computation"
      allow-axioms: ""
      fail-on-sorry: false
