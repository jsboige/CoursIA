name: Lean Conway CI

# CI for conway_lean (SymbolicAI/Lean/conway_lean).
# Conway's Game of Life formalization (Hashlife, Kochen-Specker, Free Will).
# Rule lean-merge-discipline: lake build SUCCESS local OBLIGATOIRE avant merge.
#
# Consolidated per ai-01 DRY decision (option 2: matrix). Supersedes the inline
# version in PR #2747 (same standalone-tactic mode, same baseline 8, now via the
# shared lean-build.yml reusable workflow).
#
# Sorry profile (re-verified 2026-08-07 post-#6724 P4 mpr assembly, standalone-
# tactic mode, baseline=5): conway has 5 real tactic sorries.
# The standalone-tactic filter also counts the Lean case-bullet form `· sorry`
# (fixed in lean-build.yml, See #2747) and EXCLUDES `*_en.lean` i18n siblings
# (byte-identical mirrors of the FR file — counting both double-inflates,
# C513-L1 #6429). Prose mentions ("Each sorry is a target", "Left as sorry",
# "remain sorry-gated") are excluded by the sole-token check. Breakdown of the 5:
#   - HashlifeCorrectness.lean: 4 =
#       p4_sw_overlap_wall (1)        -- SW mirror of the NW overlap wall (#9132)
#       p4_sw_supercell_agree (1)     -- SW supercell-agree scaffold (#9132)
#       p4_se_overlap_wall (1)        -- SE mirror of the NW overlap wall
#       p5_large_n_jumpN (1)          -- downstream P4-gated
#     6 -> 5 (this PR, See #6724): p4_succ_membership mpr PROVED (four _rev
#     membership arms + quad_partition_bounds router at the succ call site) —
#     a proof, not a deletion (anti-regression §D).
#   - HashlifeMarginFragment.lean: 1  -- documented framework sorry
#     (hashlife_correct_margin, Livrable B #9568, acceptance-B state)
#   - HashlifeMemo.lean:        0 (discharged since #2794, Phase 3c)
#   - Pillars.lean:             0 (discharged since #2790, scaffolding witnesses)
# Raising this baseline requires a documented justification in the PR body.
#
# Proof-integrity gate (c.950 reprise, See #8677, follows PR #8740 knot_lean pattern):
# v2 scope élargi — Conway.KochenSpecker + Conway.FreeWillTheorem (les modules
# d'affiche, à ranger PAR TRANCHES avant Conway.Life.Computation). The gate
# lists 19 native_decide axioms EXPLICITEMENT (no wildcard `*native_decide*`:
# that would destroy the "new native_decide = new red" property required to
# triage any future introduction one-by-one). fail-on-sorry=true (the
# 2 acknowledged tactic sorries (1 frozen P5 in HashlifeCorrectness.lean +
# 1 documented framework sorry in HashlifeMarginFragment.lean) are governed by
# the lean-build.yml `sorry-baseline: "2"`, not by this gate — no double-cover).
# Lowered 5→2 by PR B of #9863: the 3 SW+SE wall sorries (p4_sw_overlap_wall,
# p4_se_overlap_wall + supercell/g3_bridge) are discharged — ported from #9840.
#
# Reprise rationale (ai-01 DM HIGH msg-20260728T231209-43cuju, c.950):
#   1. allow-axioms MUST list the 19 explicit names — wildcard forbidden
#   2. fail-on-sorry: true (not false)
#   3. target-modules élargi — start with KochenSpecker + FreeWillTheorem,
#      profile before gater, puis rest of Conway/Life/ by tranche
#
# Follow-up triage = PR #8752 (docs-only, jsboige himself, MED/prover-tooling):
# 22-lake triage + §B.3 rule update. Will need to be re-aligned to the new
# explicit-names approach once this PR lands (the triage doc still recommends
# wildcard `native_decide.*`).

on:
  push:
    branches: [main]
    paths:
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean/**.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean/lakefile.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean/lakefile.toml'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean/lean-toolchain'
      - '.github/workflows/lean-conway.yml'
      # The gate's own implementation: a change to it must re-run the gate.
      # knot lists it already; conway did not (added with #8951's startup break).
      - '.github/workflows/lean-axiom.yml'
      - 'scripts/lean/check_target_coverage.py'
  pull_request:
    branches: [main]
    paths:
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean/**.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean/lakefile.lean'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean/lakefile.toml'
      - 'MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean/lean-toolchain'
      - '.github/workflows/lean-conway.yml'
      # The gate's own implementation: a change to it must re-run the gate.
      # knot lists it already; conway did not (added with #8951's startup break).
      - '.github/workflows/lean-axiom.yml'
      - 'scripts/lean/check_target_coverage.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: jsboige/CoursIA/.github/workflows/lean-build.yml@main
    with:
      project-path: MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean
      display-name: conway_lean
      sorry-baseline: "2"
      sorry-filter-mode: standalone-tactic

  # c.8133 (#8782 reconciliation): the blocking gate's allow-axioms list was
  # a fossil -- 18 ``Conway.Life.*`` names that the gate's target closure
  # (Conway.KochenSpecker + Conway.FreeWillTheorem, import Mathlib basics only)
  # could NEVER reach. The list was historical, inherited from the pre-#8782
  # era when the same workflow carried the HashlifeCorrectness audit. The audit
  # now lives in ``proof-integrity-audit`` below (option (b), 46-name list,
  # fail-on-sorry: false). The blocking gate's scope is the sorry-free showcase
  # modules, whose actual axiom footprint is the standard Mathlib defaults:
  # propext / funext / Quot.sound / Classical.choice. Pinned by
  # ``scripts/lean/tests/test_conway_blocking_gate_whitelist_aligned.py``
  # (audit script: ``scripts/lean/audit_conway_blocking_gate_whitelist.py``).
  proof-integrity:
    uses: jsboige/CoursIA/.github/workflows/lean-axiom.yml@main
    with:
      project-path: MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean
      display-name: conway_lean
      target-modules: "Conway.KochenSpecker,Conway.FreeWillTheorem"
      allow-axioms: "Classical.choice,propext,funext,Quot.lift,Quot.mk,Quot.sound"
      fail-on-sorry: true

  # Advisory proof-integrity AUDIT -- option (b) of #8782 (decision c.50,
  # assigned to po-2023, taken up by po-2026 after 4 days idle + no WIP). The
  # blocking `proof-integrity` job above targets Conway.KochenSpecker +
  # Conway.FreeWillTheorem (the sorry-free showcase modules): it is green BY
  # CONSTRUCTION on the 7 acknowledged tactic sorries, because it never
  # inspects the module that carries them (#8809: SUCCESS beside a file with 8
  # sorries). That is the "vert hors-cible" this issue opened on -- a gate
  # whose green teaches reviewers to trust it while it slept through the only
  # module that matters.
  #
  # This advisory job closes that gap: it runs the axiom audit ON the
  # sorry-bearing module with fail-on-sorry: false. The 8 sorries surface as
  # `has_sorry` (reported, not gated -- an honesty knob, not a leniency one),
  # while a FORBIDDEN axiom -- one beyond the 19 native_decide allow-list and
  # the standard defaults -- still hard-fails. So the job can go red on a real
  # regression and green on the acknowledged state, neither of which the
  # blocking gate could distinguish from "did not look".
  #
  # Criterion 1 (#8782, reformulated): the log renders WHICH declarations were
  # enumerated, not only the module. The public anchor `hashlifeResult_central_correct`
  # closes the private sorry chain (p4_nw_overlap_wall), so its `#print axioms`
  # carries sorryAx -- the sorry is REACHED, not hidden. A module whose sorry
  # sat in a private chain no public decl closes would read `enumerated=0`
  # explicitly (lean-axiom.yml guards it), never as a silent clean.
  #
  # target-modules scope: Conway.Life.HashlifeCorrectness (where all 8 sorries
  # AND 28 native_decide axioms live -- see allow-axioms below) PLUS the 4
  # axiom-clean Life foundations: MacroCell + Hashlife (and their _en siblings).
  # Those 4 were verified clean by STATIC analysis (grep over conway_lean source):
  # native_decide=0, decide=0, sorry=0, and their import graph pulls in NONE of
  # the nd-bearing Life modules (Computation/Oscillators/RLE/Spaceships/
  # HashlifeMemo/HashlifeMarginDemo), so #print axioms resolves to the standard
  # defaults only (propext/Classical.choice/Quot.* -- already allowed) and the
  # audit stays green-on-acknowledged. MacroCell (43 decls) + Hashlife (20) are
  # the data/structure layer the sorry-bearing proof builds on. The _en siblings
  # ARE separate compiled modules (i18n convention: docstrings only differ) -- a
  # coverage gate that counts compiled modules must not omit half a bilingual pair
  # by default (the knot_lean 5/12-vs-5/14 miscount, #8782 pitfall 2). Moving the
  # covered count 3 -> 7 closes 4 of the 50 blind-spot modules.
  #
  # RESIDUAL (follow-up, needs a warm Mathlib junction to enumerate): the 6
  # nd-bearing sorry-free Life modules each carry their OWN native_decide axioms
  # (NOT in the 28-name allow-list, which is HashlifeCorrectness-specific) -- adding
  # them requires build-enumerated allow-axioms entries, not a static guess.
  proof-integrity-audit:
    uses: jsboige/CoursIA/.github/workflows/lean-axiom.yml@main
    with:
      project-path: MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean
      # #8848: the advisory (fail-on-sorry: false) job carries the ' (audit)' suffix
      # so it is distinguishable from the blocking proof-integrity job above in the
      # CI check rollup ("Proof integrity (conway_lean (audit))" vs "(conway_lean)").
      # Without it a reviewer saw two identical "Proof integrity (conway_lean)" checks
      # and could not tell which tolerates the 8 acknowledged sorries from which
      # refuses them. Pinned by scripts/lean/tests/test_proof_integrity_display_names.py.
      display-name: conway_lean (audit)
      # #9863 (displacement-pur split): the monolithic HashlifeCorrectness.lean (7082 ln)
      # was split into an import aggregator + Foundation + Walls/{NW,NE,SW,SE}. The 8
      # acknowledged tactic sorries now live in Walls/{NW,NE,SW,SE} (native_decide=0
      # there), so those submodules MUST be in target-modules to keep the sorries
      # surfaced by this advisory job (fail-on-sorry: false reports them as has_sorry).
      # The 38-name allow-axioms list below is UNCHANGED: native_decide axiom names are
      # namespace-derived (Conway.Life.<decl>._native.native_decide.ax_1_N), and every
      # submodule reopens `namespace Conway` / `namespace Life` with no extra segment,
      # so declaration names -- hence axiom names -- are stable across the split.
      target-modules: "Conway.Life.HashlifeCorrectness,Conway.Life.HashlifeCorrectness.Foundation,Conway.Life.HashlifeCorrectness.Walls.NW,Conway.Life.HashlifeCorrectness.Walls.NE,Conway.Life.HashlifeCorrectness.Walls.SW,Conway.Life.HashlifeCorrectness.Walls.SE,Conway.Life.MacroCell,Conway.Life.Hashlife,Conway.Life.MacroCell_en,Conway.Life.Hashlife_en,Conway.Life.Oscillators,Conway.Life.Spaceships,Conway.Life.Spaceships_en,Conway.Life.RLE,Conway.Life.HashlifeMemo,Conway.Life.HashlifeMarginDemo,Conway.Life.GridCanonical,Conway.Life.GridCanonical_en"
      # allow-axioms: the 38 native_decide axioms that HashlifeCorrectness ACTUALLY
      # depends on (empirical footprint revealed by THIS audit job's first CI run).
      # These are DISTINCT from the blocking gate's 19-name list above: that list
      # was triaged from the SHOWCASE modules (KochenSpecker/FreeWillTheorem, #8749),
      # a different scope -- the 19 are vestigial for this module (zero overlap).
      # Auditing HashlifeCorrectness directly revealed the true native_decide
      # footprint of the P4/hashlife correctness machinery is 38, not 19 -- exactly
      # the vert-hors-cible this issue opened on (the blocking gate was green
      # because it never looked here). All 38 are decide-kernel
      # (`._native.native_decide.ax_1_N` = `decide` on finite Fin-typed props),
      # the same acknowledged class as the 19; allow-listing the exact set lets
      # the audit go green-on-acknowledged + red-on-a-NEW native_decide (the
      # "new native_decide = new red" property the no-wildcard rule preserves).
      allow-axioms: "Conway.Life.hashlife_correct_implies_block_2._native.native_decide.ax_1_1,Conway.Life.hashlife_correct_implies_toad_2._native.native_decide.ax_1_1,Conway.Life.hashlife_correct_implies_glider_2._native.native_decide.ax_1_1,Conway.Life.hashlife_correct_implies_blinker_h_2._native.native_decide.ax_1_1,Conway.Life.hashlife_correct_implies_beacon_2._native.native_decide.ax_1_1,Conway.Life.box_assez_grandN_single_cell._native.native_decide.ax_1_4,Conway.Life.box_assez_grandN_single_cell._native.native_decide.ax_1_2,Conway.Life.box_assez_grandN_single_cell._native.native_decide.ax_1_3,Conway.Life.box_assez_grandN_single_cell._native.native_decide.ax_1_1,Conway.Life.box_assez_grandN_single_cell_8._native.native_decide.ax_1_1,Conway.Life.box_assez_grandN_single_cell_3._native.native_decide.ax_1_1,Conway.Life.box_assez_grandN_block_8._native.native_decide.ax_1_1,Conway.Life.box_assez_grandN_glider_8._native.native_decide.ax_1_1,Conway.Life.boxAssezGrandN_block_8._native.native_decide.ax_1_1,Conway.Life.boxAssezGrandN_glider_8._native.native_decide.ax_1_1,Conway.Life.box_assez_grand_single_cell_3_false._native.native_decide.ax_1_1,Conway.Life.box_assez_grand_single_cell_8_false._native.native_decide.ax_1_1,Conway.Life.box_assez_grand_single_cell_2._native.native_decide.ax_1_1,Conway.Life.box_assez_grand_not_vacuous._native.native_decide.ax_1_1,Conway.Life.p4_wf_witness_k2._native.native_decide.ax_1_1,Conway.Life.p4_wf_witness_k1._native.native_decide.ax_1_1,Conway.Life.p4_base_exhaustive._native.native_decide.ax_1_1✝,Conway.Life.p4_base_blinker._native.native_decide.ax_1_1,Conway.Life.p4_base_block._native.native_decide.ax_1_1,Conway.Life.p4_base_glider._native.native_decide.ax_1_1,Conway.Life.p4_base_dead._native.native_decide.ax_1_1,Conway.Life.p4_unrestricted_counterexample._native.native_decide.ax_1_1,Conway.Life.padCenter2_correct_block_level1._native.native_decide.ax_1_1,Conway.Life.pulsar_period_three._native.native_decide.ax_1_1,Conway.Life.pentadecathlon_period_15._native.native_decide.ax_1_1,Conway.Life.RLE.glider_parse_ok._native.native_decide.ax_1_1,Conway.Life.RLE.lwss_parse_ok._native.native_decide.ax_1_1,Conway.Life.RLE.pulsar_parse_ok._native.native_decide.ax_1_1,Conway.Life.RLE.gosper_gun_parse_ok._native.native_decide.ax_1_1,Conway.Life.RLE.lwss_rle_roundtrip._native.native_decide.ax_1_1,Conway.Life.RLE.pulsar_rle_roundtrip._native.native_decide.ax_1_1,Conway.Life.RLE.gosper_gun_cell_count._native.native_decide.ax_1_1,Conway.Life.RLE.glider_parsed_cell_count._native.native_decide.ax_1_1"
      fail-on-sorry: false

  # Advisory proof-integrity coverage (See #8782). The `target-modules` lists
  # above are hand-maintained while the lakefile glob (.submodules Conway,
  # Conway_en) grows as modules are added; a gate that inspects 3 of N compiled
  # modules is a "vert hors-cible" -- visually indistinguishable from a targeted
  # green in the check rollup. This job prints the delta (compiled vs target)
  # and ALWAYS exits 0: it never fails CI, it makes the gap legible in the log.
  #
  # `--from-workflow` reads THIS file and unions target-modules over every job
  # whose `uses:` resolves to lean-axiom.yml. It replaces a literal
  # `--target-modules` flag that had been given the blocking job's list only:
  # when option (b) of #8782 added the audit job above, the advisory kept the
  # old list and reported Conway.Life.HashlifeCorrectness as a blind spot --
  # false about precisely the module the audit job inspects. A drift-detector
  # that keeps its own copy of the list detects everyone's drift but its own.
  target-coverage:
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Advisory target-coverage delta
        run: |
          python3 scripts/lean/check_target_coverage.py \
            --project-path MyIA.AI.Notebooks/SymbolicAI/Lean/conway_lean \
            --from-workflow .github/workflows/lean-conway.yml \
            --lib-root Conway \
            --name conway_lean
