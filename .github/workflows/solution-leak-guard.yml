name: solution-leak-guard

# Advisory (WARN-phase) guard for the "Exercice cell containing its solution"
# academic-integrity vector (issue #8053, parent epic #4208). Mirrors the
# pip-leak-guard HIGH-delta pattern (#6314) but runs in WARN mode: it reports
# only HIGH-severity solution-leak findings *newly introduced* by the PR (vs
# its base ref), and NEVER fails.
#
# Why WARN, not FAIL (acceptance #8053: "Mode WARN d'abord, puis bascule FAIL
# une fois le backlog nettoyé"):
#   - the detector (scripts/notebook_tools/audit_solution_leaks.py) currently
#     emits ~498 function_body_leak findings across the repo, the large
#     majority of which are legitimate worked examples (functions with >3 logic
#     lines that are guided examples, not exercise stubs with their solution
#     pasted in). Precision on C#/.NET+Lean is known low (~95% FP, fleet memory
#     solution-leak-detector-csharp-lean-fp; retracted for `// TODO` c.827).
#   - an absolute FAIL would therefore block the whole cluster. The delta +
#     WARN form posts an advisory summary a reviewer reads, without freezing.
#
# THE WORD `advisory` IN THE JOB `name:` BELOW IS LOAD-BEARING (#12389).
# `scripts/pr_gate.py` recognises a non-blocking check by exactly one signal:
# the case-insensitive substring `advisory` **in the rendered check-run name**
# (`ADVISORY_MARKER`, rule 6 of its module docstring -- deliberately a name
# convention, so that no separate registry has to be kept in sync). Declaring
# the intent in THIS comment, or naming the job "(WARN phase)", carries no
# weight whatsoever: `is_advisory()` never reads the file, only the name.
#
# Until 2026-08-22 the job name said "WARN phase" and not "advisory". A job
# this header calls advisory three times -- and whose report step is literally
# named "never fails" -- therefore landed in `pr_gate`'s BAD set and failed
# `PR gate`, the ONLY required check on `main` (verified firsthand that day:
# `required: ["PR gate"]`). Measured on PR #12142: this check-run was
# `cancelled` at 15m04 against `timeout-minutes: 15` below. `cancelled` means
# "no verdict", and pr_gate is right to refuse to call that a pass -- what was
# wrong is that a non-blocking guard could reach a blocking verdict at all.
#
# WHEN THE WARN -> FAIL SWITCH LANDS (#8053, gated on the detector-precision
# fix below): REMOVE `advisory` from the job name in the same commit. Leaving
# it makes the switch a no-op that looks enabled -- the job would fail, and
# `pr_gate` would divert it to the advisory list and let the PR merge anyway.
#   - the FAIL switch (a future --fail-on-delta flag on solution_leak_delta.py)
#     is gated on a detector-precision fix and backlog drain, tracked out of
#     scope here.

on:
  pull_request:
    branches: [ main ]
    paths:
      - '**.ipynb'
      - 'scripts/notebook_tools/audit_solution_leaks.py'
      - 'scripts/notebook_tools/solution_leak_delta.py'
      - '.github/workflows/solution-leak-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solution-leak-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solution-leak-delta:
    name: "Solution-leak HIGH delta (advisory, WARN phase, #8053)"
    # Route vers la jambe Linux auto-hebergee (#13378 tranche 1, decision ai-01
    # 2026-09-01) : garde Python pur, sans secret ni usage du GITHUB_TOKEN. La garde
    # same-repo ci-dessous saute les PRs de fork (pr_gate.py compte `skipped` comme
    # OK) : aucun code de fork n'atteint le runner. Retour arriere = revert de la PR.
    runs-on: [self-hosted, coursia-ephemeral, coursia-linux]
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Shallow checkout (fetch-depth: 2) instead of full history. The
          # base SHA is then fetched explicitly so the BASE scan step
          # below can `git checkout <base.sha>`. Issue #11835 — saves
          # the bulk of CI time on the 2.1 Go repo (was ~120 s of
          # clone-time per push).
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: HEAD scan (PR head)
        run: |
          python scripts/notebook_tools/audit_solution_leaks.py --json > /tmp/head.json

      # Swap MyIA.AI.Notebooks/ to the PR base ref, scan, then restore. head.json
      # is already captured above, so the swap cannot contaminate the delta.
      - name: BASE scan (PR base ref)
        if: github.event_name == 'pull_request'
        run: |
          # Fetch the base SHA explicitly — `checkout@v4` avec fetch-depth: 2
          # ne le ramene pas, et `git checkout <unknown sha>` echoue. Le fetch
          # depth=1 suffit : on ne lit que le commit reference, pas son arbre
          # (le working tree est restore depuis ce checkout juste apres).
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}" -q
          git checkout ${{ github.event.pull_request.base.sha }} -- MyIA.AI.Notebooks
          python scripts/notebook_tools/audit_solution_leaks.py --json > /tmp/base.json
          git checkout HEAD -- MyIA.AI.Notebooks

      - name: "Report HIGH delta (WARN — never fails)"
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "## Solution-leak HIGH delta (WARN phase, #8053)"
            echo ""
            echo "_Advisory only — this check does NOT fail the PR. Lists HIGH"
            echo "solution-leak candidates newly introduced by this PR vs its base ref."
            echo "Detector candidates, not auto-verdicts: verify by CONTENT"
            echo "(cf exercise-example-labeling.md) — a guided example is legitimate._"
            echo ""
            python scripts/notebook_tools/solution_leak_delta.py /tmp/base.json /tmp/head.json
          } >> "$GITHUB_STEP_SUMMARY"

      # workflow_dispatch (no base ref): single scan, full markdown report to summary.
      - name: "Full inventory (manual dispatch)"
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "## Solution-leak audit (manual dispatch)"
            echo ""
            python scripts/notebook_tools/audit_solution_leaks.py
          } >> "$GITHUB_STEP_SUMMARY"
