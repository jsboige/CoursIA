name: Secret Scan (controls)

# Les deux controles du scanner de secrets, sortis de secret-scan.yml (#25510,
# tranche T-B du tri voie rapide / voie lente du 2026-11-12).
#
# Pourquoi un workflow separe : `gitleaks` doit voir CHAQUE PR (il scanne
# l'arbre entier, et un secret peut arriver dans n'importe quel fichier). Les
# deux jobs ci-dessous ne lisent, eux, qu'un petit nombre d'entrees :
#   - `positive-controls` prouve que l'allowlist de `.gitleaks.toml` n'a pas
#     desarme les detecteurs : ses entrees sont `.gitleaks.toml`, le pin de
#     `.pre-commit-config.yaml`, ses deux modules de test et `run_control_tests.py` ;
#   - `assert-egress` cherche un `assert` qui ecrirait un secret dans le log CI :
#     il ne lit que des fichiers `*.py` et sa baseline.
# Sur une PR qui ne touche aucune de ces entrees -- une PR de carnet, de
# traduction, de doc --, les rejouer produit le meme verdict qu'a la tete de
# `main`, pour deux runners et deux checkouts. Mesure du 2026-11-12 (#25510) :
# une PR de carnet declenche environ 33 workflows, et le cout de la file vient
# du NOMBRE de jobs, pas de leur poids (1,2 min medianes, 82 % de checkout).
#
# Le filtre `paths:` ne s'applique qu'aux PRs : chaque push sur `main` rejoue
# les deux controles sur l'arbre fusionne, quel que soit le diff.
#
# Le pin `GITLEAKS_VERSION` est repete ici : GitHub Actions ne partage pas un
# `env` entre deux fichiers. La parite ne repose pas sur la vigilance : le job
# `positive-controls` compare son pin a `.pre-commit-config.yaml`, exactement
# comme le scanner de secret-scan.yml, et une montee de version touche ces deux
# fichiers, donc declenche ce workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '**/*.py'
      - '.gitleaks.toml'
      - '.pre-commit-config.yaml'
      - 'scripts/secrets/tests/baseline_assert_secret_egress.json'
      - '.github/workflows/secret-scan.yml'
      - '.github/workflows/secret-scan-controls.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-controls-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Positive controls for the allowlist regexes (.gitleaks.toml lines ~108-128).
  # The scanner job of secret-scan.yml proves the corpus is clean; this job
  # proves the allowlist did not disarm the detectors (#9888 failure mode). The
  # test modules resolve GITLEAKS_BIN in this order: env > PATH > local
  # scratchpad -- setting GITLEAKS_BIN here turns off the `requires_gitleaks`
  # skip so the tests actually run in CI (without this job they skip forever and
  # the `0` is true but unguarded, cf c.10143 comment 5255089235). See #10143.
  positive-controls:
    name: Gitleaks positive controls (#10143)
    # Routage #14283 tranche 3c (ai-01 2026-09-02) : jambe Linux auto-hebergee.
    # Garde anti-fork au niveau job + runs-on STATIQUE jusqu'au 2026-10-27 ;
    # depuis #22461 la garde de debordement (meme-depot && vars.CI_OVERFLOW_LOCAL
    # == 'true') est une forme hybride ENUMEREE par
    # check_self_hosted_runner_policy.py, admise avec LINUX_RUNNER_LABELS.
    # Retour arriere = variable CI_OVERFLOW_LOCAL a `false` ou supprimee.
    # Rapatrie sur l'offre GitHub le 2026-10-25 (#17397, consigne user : le CI local pallie
    # les limites de l'offre hebergee, il ne la remplace pas).
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository && vars.CI_OVERFLOW_LOCAL == 'true') && fromJSON('["self-hosted","coursia-ephemeral","coursia-linux"]') || 'ubuntu-latest' }}
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    # Borne de securite (incident du 15/10) : sur nos slots ephemeres, un run
    # fige sans borne tient un slot 6 h (defaut d'Actions) et le retire aux PR
    # gates ; 16 des 18 slots etaient occupes de cette facon le 15/10.
    # Duree mesuree sur 20 runs verts heberges : mediane 1,1 min, max 1,3 min
    # -> borne a 15 min (marge large pour le parc local).
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.24.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pytest
        run: pip install pytest
      - name: Fetch gitleaks binary (pinned to the same version as the scanner job)
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          if ! curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 "$url" -o /tmp/gitleaks.tgz; then
            echo "::error title=Gitleaks binary fetch failed::telechargement du binaire en echec (reseau/Releases) -- pas un finding de scan"
            exit 1
          fi
          mkdir -p /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tgz -C /tmp/gitleaks-bin
          echo "GITLEAKS_BIN=/tmp/gitleaks-bin/gitleaks" >> "$GITHUB_ENV"
      - name: Assert gitleaks version matches the CI pin and the pre-commit rev
        # Same drift guard as the scanner job: the test binary MUST equal the
        # scanner binary, or a suppression can pass here and fail there. Since
        # the two jobs no longer share a file, the pin is also compared to
        # `.pre-commit-config.yaml`, which the scanner job checks too: two
        # equalities to the same reference make the two pins equal.
        run: |
          actual="$("$GITLEAKS_BIN" version)"
          echo "::notice title=Test gitleaks binary version::$actual"
          case "$actual" in *"$GITLEAKS_VERSION"*) ;; *) echo "::error title=Gitleaks version drift::test binary '$actual' != pin ${GITLEAKS_VERSION}"; exit 1;; esac
          expected="$(grep -oE 'rev: v[0-9]+\.[0-9]+\.[0-9]+' .pre-commit-config.yaml | head -n1 | cut -d' ' -f2 | tr -d 'v')"
          if [ -z "${expected}" ]; then
            echo "::error title=Arbre de checkout incomplet::'.pre-commit-config.yaml' absent de l'arbre (pin non extrait) -- ce n'est PAS une derive de version. Voir #20174 / #18312."
            exit 1
          fi
          if [ "${GITLEAKS_VERSION}" != "${expected}" ]; then
            echo "::error title=Gitleaks version drift::secret-scan-controls.yml pins ${GITLEAKS_VERSION} but .pre-commit-config.yaml pins v${expected}. Update secret-scan.yml, secret-scan-controls.yml and .pre-commit-config.yaml together."
            exit 1
          fi
      - name: Run gitleaks positive-control tests
        # Only the two gitleaks test modules (the other scripts/secrets/tests/
        # suites require .secrets/master.env, which is gitignored and absent
        # from a fresh checkout -- running them here would be env-dependent noise).
        # `run_control_tests.py` distingue trois cas que `pytest` confond : arbre
        # de checkout ampute (fichier commite absent du disque), controle vide
        # (aucune assertion evaluee), et vrai echec de test. Les trois sortent en
        # non-zero ; seul le diagnostic change (#20200).
        #
        # `--pytest-arg=-v` porte deux roles : il rend la sortie verbose, et il
        # declare dans le bloc la commande reellement executee. Le garde
        # `check_testpaths_coverage.py` ne classe un bloc `run:` comme executant
        # que si une de ses lignes nomme `pytest` (l. 222-230) : sans ce token, les
        # deux cibles declarees ci-dessous disparaissent de son releve et la garde
        # rougit sur une couverture qui est pourtant reelle. Le mot est exact --
        # l'organe lance bien `pytest`, il l'enveloppe.
        run: |
          python scripts/ci/run_control_tests.py \
            --label "Gitleaks positive controls" \
            --pytest-arg=-v \
            scripts/secrets/tests/test_gitleaks_qwen_rule.py \
            scripts/secrets/tests/test_gitleaks_10143_classes.py

  # Assert-egress control (#17276): the mirror image of the job above.
  # Gitleaks proves nothing SECRET is COMMITTED; this proves a test does not
  # WRITE a secret into the CI log at runtime -- a surface Gitleaks cannot see
  # (the log is not the repository, and the value only appears on failure).
  #
  # Separate job on purpose: folding these steps into `positive-controls` would
  # make that job's name ("Gitleaks positive controls") false. The cost of the
  # split is one checkout + setup-python.
  #
  # NOT a required status check: only `PR gate` is (verified 2026-09-21,
  # `gh api .../branches/main/protection`).
  assert-egress:
    name: Assert secret egress guard (#17276)
    # Meme forme hybride que le job ci-dessus (tranche A2 de #22937) -- PR
    # meme-depot ET vars.CI_OVERFLOW_LOCAL == 'true' -> jambe Linux locale,
    # sinon ubuntu-latest. Garde anti-fork CONSERVEE ci-dessous.
    # Retour arriere = variable CI_OVERFLOW_LOCAL a `false` ou supprimee.
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository && vars.CI_OVERFLOW_LOCAL == 'true') && fromJSON('["self-hosted","coursia-ephemeral","coursia-linux"]') || 'ubuntu-latest' }}
    if: github.event.pull_request.head.repo.full_name == null || github.event.pull_request.head.repo.full_name == github.repository
    # Borne de securite (incident du 15/10), meme motif que ci-dessus.
    # Duree mesuree sur 20 runs verts heberges : mediane 1,2 min, max 1,5 min
    # -> borne a 15 min (marge large pour le parc local).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pytest
        run: pip install pytest
      - name: Run the guard's own tests
        # Pure stdlib (no gitleaks binary, no .secrets/master.env), so unlike the
        # rest of scripts/secrets/tests this suite runs on a fresh checkout.
        # Meme organe que la jambe `positive-controls` : un arbre ampute y rendait
        # `file or directory not found` + `exit 4`, code d'USAGE de pytest, lu dans
        # l'onglet des checks comme un verdict contre la PR (#20200). `--pytest-arg=-v`
        # pour la meme raison qu'en face (lisibilite du bloc pour
        # `check_testpaths_coverage.py`, sortie verbose).
        run: |
          python scripts/ci/run_control_tests.py \
            --label "Assert secret egress guard" \
            --pytest-arg=-v \
            scripts/secrets/tests/test_check_assert_secret_egress.py
      - name: Assert no NEW assert-secret-egress site
        # Green on the baseline's known sites, RED on the next introduction --
        # which is the entire value: the guard catches the class at the moment
        # it is introduced, not after a token has been printed to a log. The
        # guard scans `*.py` only, which is why the `paths:` filter above may
        # skip every PR that touches no Python file.
        run: python scripts/secrets/check_assert_secret_egress.py --check
