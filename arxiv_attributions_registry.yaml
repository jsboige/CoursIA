# Registre des attributions arXiv corrigées
#
# Ce registre liste les corrections d'attributions arXiv appliquées dans le dépôt,
# issues des passes 1-4 de l'EPIC #11168 (vérification des citations arXiv).
#
# Le script `scripts/check_arxiv_attributions.py` lit ce registre et vérifie
# que chaque entrée est **toujours présente** dans le notebook indiqué
# (la chaîne `expected_citation` doit être trouvable dans la cellule `cell_index`).
# Si une entrée disparaît (notebook renommé, cellule supprimée, attribution
# ré-écrite), le check lève rouge en CI.
#
# Format de chaque entrée :
#   - arxiv_id       : identifiant arXiv (ex. "2015.02355")
#   - notebook       : chemin relatif au notebook (depuis la racine du dépôt)
#   - cell_index     : index 0-based de la cellule contenant la citation
#   - expected_citation : chaîne exacte (sensible casse) qui doit subsister
#   - source_pr      : PR qui a livré la correction (pour traçabilité)
#   - correction     : description courte de la correction appliquée
#   - date           : date de la correction (YYYY-MM-DD)
#
# **Chaque entrée est extraite MÉCANIQUEMENT depuis le diff de la PR source** :
# le path, le cell_index et l'exact_citation sont lus depuis `git diff origin/main...<source_pr>`,
# JAMAIS rédigés de mémoire. Le test `test_real_registry_passes_when_no_drift`
# valide la mécanique du script ; le test `test_real_registry_passes_against_main`
# valide la vivacité du registre contre le main actuel.

