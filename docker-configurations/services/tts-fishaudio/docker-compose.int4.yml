# FishAudio S2-Pro TTS — int4 weight-only deployment variant (po-2023 bench)
#
# The canonical compose (docker-compose.yml) is the fp16 path (`--half`,
# ~20.3 GiB VRAM). This file is the int4 variant — the mode that ships on the
# shared RTX 3090. It pins serve_int4.py (FISHAUDIO_SERVE_SCRIPT) with NO
# --half: the int4 kernel needs the scales_and_zeros buffers to stay
# bfloat16, and --half would cast every float buffer to float16 (garbage out).
#
# Bounds: mem_limit = memswap_limit = 12g (swap off), pids_limit = 256.
# 12g is the smallest bound that survives the load transient once
# serve_int4.py inits the model under bf16 — peak measured 10 536 MiB
# (weights "All keys matched", /v1/health 200, load ~3.5 min); steady state
# stays ~2.8-3 GiB. Without that bf16 init, from_pretrained instantiates the
# model full-size in fp32 BEFORE the int4 conversion and the load peaks at
# ~14 120 MiB, OOM-killing (exit 137) under every bound 6/8/12/14g — the
# service only survived pre-#303 because it had NO bound at all. Full
# mechanism + measured peaks: README.md, section "Variante int4".
#
# Checkpoints / references are shared with the canonical tree via bind mounts
# (relative to this directory; override with CHECKPOINTS_PATH /
# REFERENCES_PATH in .env — see .env.example). The model weights are not
# duplicated between the two variants.

services:
  tts-fishaudio:
    image: fishaudio/fish-speech:latest
    container_name: tts-fishaudio
    hostname: tts-fishaudio
    entrypoint: ["/app/.venv/bin/python"]
    # int4 route: fixed script, no --half (the int4 kernel needs bf16 buffers).
    command:
      - serve_int4.py
      - --llama-checkpoint-path
      - ${LLAMA_CHECKPOINT_PATH:-checkpoints/fs-1.2-int4-g128}
      - --decoder-checkpoint-path
      - ${DECODER_CHECKPOINT_PATH:-checkpoints/s2-pro/codec.pth}
      - --decoder-config-name
      - ${DECODER_CONFIG_NAME:-modded_dac_vq}
      - --listen
      - 0.0.0.0:8080

    ports:
      - "127.0.0.1:${FISHAUDIO_PORT:-8197}:8080"

    # Maintenance#303 + 2026-11-10 crash-loop repair bounds.
    mem_limit: 12g
    memswap_limit: 12g
    pids_limit: 256

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${FISHAUDIO_GPU_ID:-1}']
              capabilities: [gpu]

    volumes:
      - type: bind
        source: ${CHECKPOINTS_PATH:-./checkpoints}
        target: /app/checkpoints
      - type: bind
        source: ${REFERENCES_PATH:-./references}
        target: /app/references
      # int4 server script — local to this directory, mounted read-only.
      - type: bind
        source: ./serve_int4.py
        target: /app/serve_int4.py
        read_only: true
      - type: volume
        source: fishaudio-cache
        target: /root/.cache

    environment:
      - NVIDIA_VISIBLE_DEVICES=${FISHAUDIO_GPU_ID:-1}
      - LLAMA_CHECKPOINT_PATH=${LLAMA_CHECKPOINT_PATH:-checkpoints/fs-1.2-int4-g128}
      - DECODER_CHECKPOINT_PATH=${DECODER_CHECKPOINT_PATH:-checkpoints/s2-pro/codec.pth}
      - DECODER_CONFIG_NAME=${DECODER_CONFIG_NAME:-modded_dac_vq}
      - API_SERVER_NAME=0.0.0.0
      - API_SERVER_PORT=8080
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Europe/Paris}
      - HUGGING_FACE_HUB_TOKEN=${HUGGINGFACE_TOKEN:-}
      - HF_TOKEN=${HUGGINGFACE_TOKEN:-}

    # Single-worker contention: a long generation blocks the event loop for
    # minutes, so /v1/health can time out DURING active synthesis -- the flap
    # is expected under load, not a crash.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/v1/health || exit 1"]
      interval: 60s
      timeout: 60s
      retries: 5
      start_period: 600s

    restart: unless-stopped

    networks:
      - fishaudio-network

    labels:
      - "com.myia.service=tts-fishaudio"
      - "com.myia.gpu=rtx-3090"
      - "com.myia.model=fishaudio-s2-pro-int4"

volumes:
  fishaudio-cache:
    name: tts-fishaudio-cache

networks:
  fishaudio-network:
    driver: bridge
    name: fishaudio-network
