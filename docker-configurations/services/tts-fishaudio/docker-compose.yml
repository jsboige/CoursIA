# FishAudio S2-Pro TTS Service - official snapshot, fp16 (--half) on GPU1
# API server with CUDA support on GPU1 (RTX 3090 24GB)
#
# GPU: RTX 3090 24GB - ~20GB VRAM with the official fp16 snapshot (--half)
# Port: 8197
# API: POST /v1/tts, GET /v1/health
# Docs: http://localhost:8197/docs
#
# Notes:
#   - Checkpoint: official HuggingFace snapshot fishaudio/s2-pro (~11GB safetensors)
#     in checkpoints/s2-pro/ (see README setup -- snapshot_download)
#   - The former custom image fishaudio/fish-speech:server-cuda-bnb4 (~5GB VRAM,
#     NF4) was never published upstream and is lost; its 4-bit checkpoints in
#     checkpoints/s2-pro-bnb4/ use a house format (mixed fp16 embeddings + packed
#     linear layers, no separate scales) that upstream images cannot load.
#     The official fp16 snapshot is the supported path (measured 2026-10-06:
#     warm-up 20.33GB VRAM, 3.7 tok/s generation on a RTX 3090).
#   - The upstream image entrypoint (run_webui.py) intercepts CLI args: the
#     compose file pins the api_server entrypoint explicitly.
#   - Reference voices stored in ./references/ (sample.wav + sample.lab)
#   - S2 Pro supports 15000+ emotion tags: (whisper), (shout), (laugh)...
#   - Use parenthesis syntax for emotions: (angry), (sad), (excited)

services:
  tts-fishaudio:
    image: fishaudio/fish-speech:latest
    container_name: tts-fishaudio
    hostname: tts-fishaudio
    entrypoint: ["/app/.venv/bin/python"]
    command:
      - tools/api_server.py
      - --llama-checkpoint-path
      - ${LLAMA_CHECKPOINT_PATH:-checkpoints/s2-pro}
      - --decoder-checkpoint-path
      - ${DECODER_CHECKPOINT_PATH:-checkpoints/s2-pro/codec.pth}
      - --decoder-config-name
      - ${DECODER_CONFIG_NAME:-modded_dac_vq}
      - --listen
      - 0.0.0.0:8080
      - --half

    ports:
      - "127.0.0.1:${FISHAUDIO_PORT:-8197}:8080"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${FISHAUDIO_GPU_ID:-1}']
              capabilities: [gpu]

    volumes:
      - type: bind
        source: ${CHECKPOINTS_PATH:-./checkpoints}
        target: /app/checkpoints
      - type: bind
        source: ${REFERENCES_PATH:-./references}
        target: /app/references
      - type: volume
        source: fishaudio-cache
        target: /root/.cache

    environment:
      - NVIDIA_VISIBLE_DEVICES=${FISHAUDIO_GPU_ID:-1}
      - LLAMA_CHECKPOINT_PATH=${LLAMA_CHECKPOINT_PATH:-checkpoints/s2-pro}
      - DECODER_CHECKPOINT_PATH=${DECODER_CHECKPOINT_PATH:-checkpoints/s2-pro/codec.pth}
      - DECODER_CONFIG_NAME=${DECODER_CONFIG_NAME:-modded_dac_vq}
      - API_SERVER_NAME=0.0.0.0
      - API_SERVER_PORT=8080
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Europe/Paris}
      - HUGGING_FACE_HUB_TOKEN=${HUGGINGFACE_TOKEN:-}
      - HF_TOKEN=${HUGGINGFACE_TOKEN:-}

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/health || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 600s

    restart: unless-stopped

    networks:
      - fishaudio-network

    labels:
      - "com.myia.service=tts-fishaudio"
      - "com.myia.gpu=rtx-3090"
      - "com.myia.model=fishaudio-s2-pro"

  # Sidecar: Idle Monitor - Stop container after inactivity
  idle-monitor:
    build:
      context: ../shared
      dockerfile: Dockerfile.idle-monitor
    container_name: tts-fishaudio-idle-monitor
    hostname: tts-fishaudio-idle-monitor

    environment:
      - HEALTH_URL=http://tts-fishaudio:8080/v1/health
      - CONTAINER_NAME=tts-fishaudio
      - IDLE_TIMEOUT=${IDLE_TIMEOUT:-1200}
      - CHECK_INTERVAL=${CHECK_INTERVAL:-60}
      - STARTUP_GRACE=${STARTUP_GRACE:-600}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-Europe/Paris}

    working_dir: /app

    command: ["python", "service_idle_monitor.py"]

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    depends_on:
      tts-fishaudio:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - fishaudio-network

    labels:
      - "com.myia.service=tts-fishaudio-idle-monitor"
      - "com.myia.type=sidecar"

volumes:
  fishaudio-cache:
    name: tts-fishaudio-cache

networks:
  fishaudio-network:
    driver: bridge
    name: fishaudio-network
