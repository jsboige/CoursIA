# Multi-Model TTS Service - Kokoro + TADA + Qwen3
# OpenAI-compatible TTS API with 3 models
#
# GPU: RTX 3090 (24GB) - shares GPU with other services
# Gateway Port: 8196
# URL: tts-multi.myia.io
#
# Healthchecks: every probe here is time-bounded, deliberately. Measured 2026-11-25
# on tts-qwen: when the application stops answering, its probes do NOT get killed by
# the healthcheck timeout -- 221 curl processes stayed stuck in state S over 5.5 h --
# they accumulate inside the container and starve pids_limit (507/512), after which
# the container cannot execute anything at all, its own healthcheck included. A probe
# without its own timeout turns one hung service into an unrecoverable container.

services:
  # Gateway - Routes requests to appropriate TTS model
  tts-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: tts-gateway
    hostname: tts-gateway

    ports:
      - "127.0.0.1:${TTS_GATEWAY_PORT:-8196}:8000"

    # Maintenance#303 bounds: router only, no model in-process.
    # Measured 2026-11-07: 57 MiB / 5 PIDs.
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128

    environment:
      - PYTHONUNBUFFERED=1
      - KOKORO_SERVICE_URL=http://tts-kokoro:8000
      - TADA_SERVICE_URL=http://tts-tada:8000
      - QWEN_SERVICE_URL=http://tts-qwen:8000
      - TZ=${TZ:-Europe/Paris}
      - API_KEY=${TTS_GATEWAY_API_KEY:-}

    volumes:
      - type: bind
        source: ../shared
        target: /app/shared
        read_only: true

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; print(urllib.request.urlopen('http://localhost:8000/health', timeout=5).read().decode())\" | grep -q healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    restart: unless-stopped

    networks:
      - tts-network

    depends_on:
      tts-kokoro:
        condition: service_healthy
      tts-tada:
        condition: service_healthy
      # tts-qwen is deliberately NOT a dependency: it sits behind the `qwen-tts` profile
      # (see the service) because it cannot load on this VM while the memory arbitration
      # is open, and a `depends_on` entry would select it on every default `up -d`. The
      # gateway routes per request and answers for a stopped upstream.

  # Kokoro TTS - Existing model, backward compatible
  tts-kokoro:
    build:
      context: ./kokoro
      dockerfile: Dockerfile
    container_name: tts-kokoro
    hostname: tts-kokoro

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${KOKORO_GPU_ID:-1}']
              capabilities: [gpu]

    # Maintenance#303 bounds: mem_limit = memswap_limit = 2g (swap disabled),
    # pids_limit 128. Measured 2026-11-07: 280 MiB idle, but 549 MiB right
    # after a recreate (model load) -- 1g sat at 54% and would have been one
    # generation burst away from an OOM-kill, so the ceiling is 2g.
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 128

    volumes:
      - type: bind
        source: ${MODELS_PATH:-./models}
        target: /app/models
      - type: volume
        source: kokoro-cache
        target: /root/.cache

    environment:
      # CUDA_DEVICE_ORDER=PCI_BUS_ID: the container's default CUDA enumeration
      # is fastest-first, which inverts the host nvidia-smi order on this
      # mixed-GPU host (measured on tts-qwen, #11624: model loaded on GPU0 /
      # display GPU despite *_GPU_ID=1). PCI-bus order matches nvidia-smi.
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=${KOKORO_GPU_ID:-1}
      - NVIDIA_VISIBLE_DEVICES=${KOKORO_GPU_ID:-1}
      - PYTHONUNBUFFERED=1
      - TTS_DEVICE=cuda
      - DEFAULT_TTS_MODEL=kokoro
      - DEFAULT_TTS_VOICE=af_sky
      - SAMPLE_RATE=24000
      - PRELOAD_MODEL=${PRELOAD_MODEL:-false}
      - IDLE_TIMEOUT=${IDLE_TIMEOUT:-1200}
      - TZ=${TZ:-Europe/Paris}

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; print(urllib.request.urlopen('http://localhost:8000/health', timeout=5).read().decode())\" | grep -q healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    restart: unless-stopped

    networks:
      - tts-network

    # Expose only internally (not to host)
    expose:
      - "8000"

  # TADA 3B ML - HumeAI's advanced TTS model
  tts-tada:
    build:
      context: ./tada
      dockerfile: Dockerfile
    container_name: tts-tada
    hostname: tts-tada

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${TADA_GPU_ID:-1}']
              capabilities: [gpu]

    # Maintenance#303 bounds: steady state measured 316 MiB / 44 PIDs, but the
    # on-demand load path (PRELOAD_MODEL=false) was never measured and the old
    # 2g bound killed the container before the encoder finished.
    # Measured 2026-11-27 on this image and this cache volume (throwaway
    # replicas, cgroup memory.peak, one 9-word synthesis):
    #   - encoder + aligner alone: 3 275 MiB host, 2.41 GiB VRAM;
    #   - full path as the model card loads it (bfloat16 then .to("cuda")):
    #     6 557 MiB host in the probe, 6 248 MiB on the service, 10.91 GiB VRAM
    #     (torch allocated), 85 434 samples (3.56 s) generated end to end;
    #   - the same path in float16: killed at an 8g bound before the 3B finished
    #     (float16 forces a conversion copy the bfloat16 checkpoint does not need);
    #   - device_map="cuda" loads at 5 720 MiB host but leaves the decoder nested
    #     in __init__ on CPU, so the synthesis fails: not a RAM saving.
    # 8g covers the measured peak with ~1.9 GiB of margin; the model itself lives
    # on the GPU, so the host bound only has to cover the load path.
    mem_limit: 8g
    memswap_limit: 8g
    pids_limit: 128

    volumes:
      - type: bind
        source: ${MODELS_PATH:-./models}
        target: /app/models
      # The service runs as appuser (HOME=/home/appuser). The previous target
      # (/root/.cache) was unreadable to it, so the volume stayed empty and the
      # Hugging Face cache lived in the container's writable layer, lost at
      # every recreate (measured 2026-11-27: the volume held only pip/, while
      # 1.5 GiB of codecs sat in the writable layer).
      - type: volume
        source: tada-cache
        target: /home/appuser/.cache

    environment:
      # Same enumeration fix as tts-kokoro (see comment there, #11624).
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=${TADA_GPU_ID:-1}
      - NVIDIA_VISIBLE_DEVICES=${TADA_GPU_ID:-1}
      - PYTHONUNBUFFERED=1
      - TTS_DEVICE=cuda
      - DEFAULT_TTS_MODEL=tada
      - SAMPLE_RATE=24000
      - PRELOAD_MODEL=${PRELOAD_MODEL:-false}
      - IDLE_TIMEOUT=${IDLE_TIMEOUT:-1200}
      - TZ=${TZ:-Europe/Paris}
      - HUGGING_FACE_HUB_TOKEN=${HUGGINGFACE_TOKEN}
      - HF_TOKEN=${HUGGINGFACE_TOKEN}
      - KOKORO_SERVICE_URL=http://tts-kokoro:8000

    depends_on:
      tts-kokoro:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; print(urllib.request.urlopen('http://localhost:8000/health', timeout=5).read().decode())\" | grep -q healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s

    restart: unless-stopped

    networks:
      - tts-network

    expose:
      - "8000"

  # Qwen3 TTS - Via vLLM-Omni
  tts-qwen:
    # Renvoi distillation #19341 (pont 3.3, Sona / arXiv 2608.11015) : ce service
    # vLLM-Omni est le candidat naturel pour servir le tokenizer semantique figé de
    # Sona, à reconfigurer en mode extraction plutôt que génération.
    build:
      context: ./qwen
      dockerfile: Dockerfile
    container_name: tts-qwen
    hostname: tts-qwen

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${QWEN_GPU_ID:-1}']
              capabilities: [gpu]

    # Bounds measured 2026-11-25 on this service, not estimated. 6g is BELOW what the
    # two-stage engine needs, which is why this service sits behind the `qwen-tts` profile.
    # - With `mem_limit: 6g` (both runs also set `VLLM_ENABLE_V1_MULTIPROCESSING=0`; see the
    #   environment block) the cgroup reaches `memory.peak` == `memory.max` (6 GiB) and
    #   OOM-kills one stage worker (`memory.events: oom 2 / oom_kill 1`, log `Worker proc
    #   VllmWorker-0 died unexpectedly`). What survives that kill still sums to 6.17 GiB of
    #   RSS over five processes (1.25 serve, 1.02 + 1.02 + 0.01 multiprocessing children,
    #   0.95 EngineCore, 2.22 Worker), so 6g cannot hold the engine with both stages alive.
    # - With `mem_limit: 8g` (same flag) the engine loads further, but the Docker VM starves
    #   before startup completes: `MemAvailable` fell to 721 MiB (min 637 MiB) at t+345 s
    #   against the ~460 s the second stage needs, and the outside guard stopped the service.
    # - The VM has 23.5 GiB because its cap was lowered to 24 GB on 2026-11-17, after a host
    #   memory famine; the other 18 containers hold 16.1 GiB, so 6.98 GiB is available with
    #   this service stopped, against a survivor tree of 6.17 GiB with a stage already dead.
    #   The complete engine's footprint has never been measured here -- it never finished
    #   loading. The shortfall is roughly 1 to 2 GiB; which service yields it, or whether the
    #   VM cap itself moves, is an owner-level arbitration, not a compose value.
    # - PID pressure was not the binding constraint: 394 of 1024 measured at load. That run
    #   also set `VLLM_ENABLE_V1_MULTIPROCESSING=0`, to try to drop one process per stage;
    #   a separate `VLLM::EngineCore` process was still there, so the flag did not shrink
    #   the topology. The 507/512 incident counted 221 stuck probes plus the engine's
    #   threads -- `nlwp`, not process count, is what `pids_limit` limits.
    mem_limit: 8g
    memswap_limit: 8g
    pids_limit: 1024

    # Opt-in on purpose: this engine needs more host memory than the VM has free while its
    # other services run (measurements above). Start it deliberately, once the memory
    # arbitration recorded on the workspace dashboard has landed:
    #   docker compose --profile qwen-tts up -d tts-qwen
    # The container's own mem_limit does not protect the VM: it is above what is free.
    profiles: ["qwen-tts"]

    # tini as PID 1: vLLM forks worker processes, and an init reaps orphaned children
    # instead of letting them count against pids_limit. Suggested by po-2023:vllm after
    # the PID saturation of 2026-11-25; not measured separately here.
    init: true

    # Entrypoint mounted from the repo so the versioned script is the one that runs
    # (the image carries a baked copy as a fallback). See qwen/entrypoint.sh for the
    # model-resolution fix of 2026-11-25.
    entrypoint: ["/bin/bash", "/app/entrypoint.sh"]

    volumes:
      - type: bind
        source: ${MODELS_PATH:-./models}
        target: /app/models
      - type: bind
        source: ./qwen/entrypoint.sh
        target: /app/entrypoint.sh
        read_only: true
      - type: bind
        source: ./qwen/healthcheck.py
        target: /app/healthcheck.py
        read_only: true
      # The process runs as appuser (HOME=/home/appuser). The cache volume used to be
      # mounted on /root/.cache, which appuser can neither read nor write: measured
      # 2026-11-25, the downloaded model (4.3 GiB) lived in the container's ephemeral
      # layer and was lost on every recreate, while the volume held only 25 MiB of
      # root-owned build caches, never used by the service. HOME is the mount target
      # because a fresh named volume inherits the image's ownership there (1000:1000,
      # writable); /home/appuser/.cache does not exist in the image and is created
      # root-owned (both cases measured on throwaway volumes).
      - type: volume
        source: qwen-home
        target: /home/appuser

    environment:
      # Same enumeration fix as tts-kokoro (see comment there, #11624) —
      # measured on this very service: the vLLM-Omni container loaded the
      # 1.7B model on GPU0 (3080 Ti Laptop, the display GPU — freeze pattern
      # 2026-06-21) despite device_ids ['1'] and CUDA_VISIBLE_DEVICES=1.
      # NOTE: CUDA_VISIBLE_DEVICES must stay an integer index — the app
      # int()s it, a UUID breaks startup (ValueError).
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=${QWEN_GPU_ID:-1}
      - NVIDIA_VISIBLE_DEVICES=${QWEN_GPU_ID:-1}
      - PYTHONUNBUFFERED=1
      # VLLM_ENABLE_V1_MULTIPROCESSING is deliberately NOT set here. The 6g run set it to
      # 0, to try to remove one process per stage, and a separate `VLLM::EngineCore`
      # process was still in the tree, so it did not buy the reduction it was set for; and
      # no run reached a working engine, so the two modes were never compared.
      # VLLM_USE_MODELSCOPE is deliberately NOT set: vllm_omni tests it for mere
      # presence (a non-empty string is truthy, "false" included) and would route the
      # model download through ModelScope. See qwen/entrypoint.sh.
      - MODEL_TYPE=${QWEN_MODEL_TYPE:-CustomVoice}
      - GPU_MEMORY_UTILIZATION=${QWEN_GPU_MEMORY_UTILIZATION:-0.3}
      - TZ=${TZ:-Europe/Paris}

    healthcheck:
      # Honest probe: `GET /health` answers 200 in 1 ms with a stage worker dead (measured
      # 2026-11-25, twice), so the probe also requires one live `VLLM::Worker` per stage of
      # `stage_configs/qwen3_tts.yaml` (2). Bounded inside the script: the Docker
      # healthcheck timeout does not kill a probe.
      test: ["CMD", "python3", "/app/healthcheck.py"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 600s

    restart: unless-stopped

    networks:
      - tts-network

    expose:
      - "8000"

networks:
  tts-network:
    driver: bridge
    name: tts-network

volumes:
  kokoro-cache:
    name: tts-kokoro-cache
  tada-cache:
    name: tts-tada-cache
  # tts-qwen-cache (25 MiB, root-owned build caches, inert since the service runs as
  # appuser) is left on disk untouched; its removal belongs to the owner of the bench.
  qwen-home:
    name: tts-qwen-home
