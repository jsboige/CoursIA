# Whisper API - Transcription audio avec faster-whisper
# OpenAI-compatible API for speech-to-text
#
# GPU: RTX 3080 Ti (16GB) - GPU 0
# Port: 8190
# URL: whisper-api.myia.io

services:
  whisper-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whisper-api
    hostname: whisper-api

    # Maintenance#303 bounds: the whole limits block moved from
    # deploy.resources.limits to the service-level spellings, because compose
    # v5 refuses to mix them ("can't set distinct values on 'pids_limit' and
    # 'deploy.resources.limits.pids'") and deploy limits cannot express
    # memory-swap at all. Result on the container is identical and stricter:
    # --cpus=2 --memory=4g --memory-swap=4g --pids-limit=256. Only the GPU
    # reservation stays under deploy. Measured 2026-11-07: 343 MiB / 29 PIDs.
    cpus: '2'
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 256

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_DEVICE_ID:-0}']
              capabilities: [gpu]

    ports:
      - "127.0.0.1:${WHISPER_API_PORT:-8190}:8190"

    volumes:
      - type: bind
        source: ${MODELS_PATH:-./models}
        target: /app/models
      - type: bind
        source: ../shared
        target: /app/shared
        read_only: true
      - type: volume
        source: whisper-cache
        target: /home/appuser/.cache

    environment:
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-0}
      - PYTHONUNBUFFERED=1
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3-turbo}
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8_float16}
      - MAX_FILE_SIZE=26214400
      - PRELOAD_MODEL=${PRELOAD_MODEL:-false}
      - IDLE_TIMEOUT=${IDLE_TIMEOUT:-1200}
      - TZ=${TZ:-Europe/Paris}
      - API_KEY=${WHISPER_API_KEY:-}

    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8190/health | grep -q healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    read_only: true
    tmpfs:
      - /tmp:size=100M

    restart: unless-stopped

    networks:
      - whisper-network

    labels:
      - "com.myia.service=whisper-api"
      - "com.myia.gpu=rtx-3080ti"
      - "com.myia.model=faster-whisper-large-v3-turbo"
      - "com.myia.compute-type=int8_float16"

networks:
  whisper-network:
    driver: bridge
    name: whisper-network

volumes:
  whisper-cache:
    name: whisper-cache
