# Demucs API - Source separation with Demucs v4
# HTTP API for music stem extraction
#
# GPU: RTX 3090 (24GB) - GPU_PCI_INDEX 1. Convention #28423 :
#      CUDA_DEVICE_ORDER=PCI_BUS_ID, index nvidia-smi (0 = 3080 Ti, 1 = 3090).
#      Les cles GPU_DEVICE_ID et CUDA_VISIBLE_DEVICES du .env ne sont plus lues :
#      elles portent l'ancienne convention d'index, ou 0 designe la 3090.
# Port: 8193
# VRAM: ~4GB

services:
  demucs-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demucs-api
    hostname: demucs-api

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_PCI_INDEX:-1}']
              capabilities: [gpu]

    ports:
      - "127.0.0.1:${DEMUCS_API_PORT:-8193}:8193"

    # Maintenance#303 bounds: mem_limit = memswap_limit = 4g (swap disabled),
    # pids_limit 256. Measured 2026-11-07: 252 MiB / 21 PIDs (idle); the
    # demucs model lives on the GPU, host RAM stays modest during separation.
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 256

    volumes:
      - type: bind
        source: ${MODELS_PATH:-./models}
        target: /app/models
      - type: bind
        source: ${OUTPUT_PATH:-./outputs}
        target: /app/outputs
      - type: bind
        source: ../shared
        target: /app/shared
        read_only: true
      - type: volume
        source: demucs-cache
        target: /root/.cache

    environment:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=${GPU_PCI_INDEX:-1}
      - NVIDIA_VISIBLE_DEVICES=${GPU_PCI_INDEX:-1}
      - PYTHONUNBUFFERED=1
      - DEMUCS_MODEL=${DEMUCS_MODEL:-htdemucs_ft}
      - DEMUCS_DEVICE=cuda
      - PRELOAD_MODEL=${PRELOAD_MODEL:-false}
      - IDLE_TIMEOUT=${IDLE_TIMEOUT:-1200}
      - TZ=${TZ:-Europe/Paris}
      - API_KEY=${DEMUCS_API_KEY:-}

    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8193/health | grep -q healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    restart: unless-stopped

    networks:
      - demucs-network

    labels:
      - "com.myia.service=demucs-api"
      - "com.myia.gpu=rtx-3090"

networks:
  demucs-network:
    driver: bridge
    name: demucs-network

volumes:
  demucs-cache:
    name: demucs-cache
