# TTS API - Text-to-Speech with Kokoro
# OpenAI-compatible TTS API
#
# GPU: RTX 3080 Ti (16GB) - GPU_PCI_INDEX 0, partagee avec comfyui-qwen et le
#      serveur d'embeddings. Convention #28423 : CUDA_DEVICE_ORDER=PCI_BUS_ID,
#      index nvidia-smi (0 = 3080 Ti, 1 = 3090). Les cles GPU_DEVICE_ID et
#      CUDA_VISIBLE_DEVICES du .env ne sont plus lues : elles portent l'ancienne
#      convention d'index, ou 0 designe la 3090.
# Port: 8191
# URL: tts-api.myia.io

services:
  tts-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tts-api
    hostname: tts-api

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_PCI_INDEX:-0}']
              capabilities: [gpu]

    ports:
      - "127.0.0.1:${TTS_API_PORT:-8191}:8191"

    # Maintenance#303 bounds: mem_limit = memswap_limit = 4g (swap disabled),
    # pids_limit 256. Measured 2026-11-07: 1.98 GiB / 51 PIDs.
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 256

    volumes:
      - type: bind
        source: ${MODELS_PATH:-./models}
        target: /app/models
      - type: bind
        source: ../shared
        target: /app/shared
        read_only: true
      - type: volume
        source: tts-cache
        target: /root/.cache

    environment:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=${GPU_PCI_INDEX:-0}
      - NVIDIA_VISIBLE_DEVICES=${GPU_PCI_INDEX:-0}
      - PYTHONUNBUFFERED=1
      - TTS_DEVICE=cuda
      - DEFAULT_TTS_MODEL=kokoro
      - DEFAULT_TTS_VOICE=af_sky
      - SAMPLE_RATE=24000
      - PRELOAD_MODEL=${PRELOAD_MODEL:-false}
      - IDLE_TIMEOUT=${IDLE_TIMEOUT:-1200}
      - TZ=${TZ:-Europe/Paris}
      - API_KEY=${TTS_API_KEY:-}

    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8191/health | grep -q healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    restart: unless-stopped

    networks:
      - tts-network

networks:
  tts-network:
    driver: bridge
    name: tts-network

volumes:
  tts-cache:
    name: tts-cache
