# Whisper-WebUI - Transcription et sous-titrage audio
# Base: jhj0517/whisper-webui (Gradio)
# Config originale: D:\Production\Whisper-WebUI\docker-compose-myia.yaml
#
# GPU: RTX 3090 (24GB) - GPU_PCI_INDEX 1. Convention #28423 :
#      CUDA_DEVICE_ORDER=PCI_BUS_ID, index nvidia-smi (0 = 3080 Ti, 1 = 3090).
#      Les cles GPU_DEVICE_ID et CUDA_VISIBLE_DEVICES du .env ne sont plus lues :
#      elles portent l'ancienne convention d'index.
# Partage la carte avec whisper-api et demucs-api (decision #28423, paragraphe 2).
# Port externe: 36540 (configurable via .env)
# Auth: Gradio Basic Auth

services:
  whisper-webui:
    image: jhj0517/whisper-webui:latest
    container_name: whisper-webui
    hostname: whisper-webui

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_PCI_INDEX:-1}']
              capabilities: [gpu]

    ports:
      - "127.0.0.1:${WHISPER_PORT:-36540}:7860"

    # Maintenance#303 bounds: mem_limit = memswap_limit = 4g (swap disabled),
    # pids_limit 256. Measured 2026-11-07: 2.12 GiB / 46 PIDs.
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 256

    volumes:
      - type: bind
        source: ${WHISPER_MODELS_PATH:-./models}
        target: /Whisper-WebUI/models
      - type: bind
        source: ${WHISPER_CONFIGS_PATH:-./configs}
        target: /Whisper-WebUI/configs
      - type: bind
        source: ${WHISPER_OUTPUTS_PATH:-../../shared/outputs/audio}
        target: /Whisper-WebUI/outputs

    environment:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=${GPU_PCI_INDEX:-1}
      - NVIDIA_VISIBLE_DEVICES=${GPU_PCI_INDEX:-1}
      - TZ=${TZ:-Europe/Paris}
      - HF_TOKEN=${HF_TOKEN:-}

    entrypoint:
      - python
      - app.py
      - --server_port
      - "7860"
      - --server_name
      - "0.0.0.0"
      - --username
      - "${WHISPER_USER:-admin}"
      - --password
      - "${WHISPER_PASSWORD:?WHISPER_PASSWORD must be set in this service .env (no committed default, it would be a published credential)}"
      - --whisper_type
      - "${WHISPER_TYPE:-insanely_fast_whisper}"

    stdin_open: true
    tty: true
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7860/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    networks:
      - whisper-network

    labels:
      - "com.myia.service=whisper-webui"
      - "com.myia.gpu=rtx-3090"
      - "com.myia.model=whisper-large-v3-turbo"

networks:
  whisper-network:
    driver: bridge
    name: whisper-network
