# H.7 P3 Notebook Runner — GitHub Actions compatible
# Executes notebooks across Python, .NET Interactive, and Lean 4 kernels
#
# Usage:
#   docker-compose build
#   docker-compose run notebook-runner /notebooks/path/to/notebook.ipynb
#   docker-compose run notebook-runner --batch /notebooks/MyIA.AI.Notebooks/ML/

services:
  notebook-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coursia-notebook-runner
    volumes:
      # Mount entire notebook tree (read-write for output persistence)
      - type: bind
        source: ../../MyIA.AI.Notebooks
        target: /notebooks
        read_only: false

      # Mount scripts (read-only)
      - type: bind
        source: ../../scripts
        target: /scripts-repo
        read_only: true

      # QuantConnect data (if available locally)
      - type: bind
        source: ../../MyIA.AI.Notebooks/QuantConnect/data
        target: /Lean/Data
        read_only: true

    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - LANG=C.UTF-8
      # QuantConnect credentials (passed from GitHub Actions secrets)
      - QC_API_USER_ID=${QC_API_USER_ID:-}
      - QC_API_ACCESS_TOKEN=${QC_API_ACCESS_TOKEN:-}
      # GenAI service URLs (empty = skip API-dependent cells)
      - QWEN_IMAGE_EDIT_URL=${QWEN_IMAGE_EDIT_URL:-}
      - WHISPER_API_URL=${WHISPER_API_URL:-}

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

    # Timeout for the entire run (prevents hangs)
    # Override with: docker-compose run -e EXECUTION_TIMEOUT=600 notebook-runner ...
    command: ["--help"]

  # Image d'APPRENTISSAGE (pli 1.2 de l'Epic #27543, #27545) : une image
  # unique qui demarre JupyterLab avec les noyaux canoniques du depot
  # (python3, global-3.13, .net-csharp/.net-fsharp/.net-powershell, lean4,
  # rust). Elle REBUILT les etages du notebook-runner au lieu de les
  # dupliquer : meme Dockerfile, cible `learning`.
  #
  # `additional_contexts` fournit le wrapper canonique du noyau Lean depuis
  # le depot (MyIA.AI.Notebooks/SymbolicAI/Lean/scripts/lean4-kernel-wrapper.py)
  # : il n'est ni recopie ni reecrit dans le contexte Docker. Sans ce
  # contexte, la construction echoue (fail-closed).
  learning:
    build:
      context: .
      dockerfile: Dockerfile
      target: learning
      additional_contexts:
        lean_scripts: ../../MyIA.AI.Notebooks/SymbolicAI/Lean/scripts
    image: coursia/learning:latest
    container_name: coursia-learning
    ports:
      - "8888:8888"
    volumes:
      - type: bind
        source: ../../MyIA.AI.Notebooks
        target: /notebooks
        read_only: false
      - type: bind
        source: ../../scripts
        target: /scripts-repo
        read_only: true
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - LANG=C.UTF-8
    command: ["jupyterlab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root"]

networks:
  default:
    name: coursia-notebook-network

