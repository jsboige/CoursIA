[pytest]
testpaths =
    scripts/notebook_tools/tests
    scripts/lean/tests
    MyIA.AI.Notebooks/GameTheory/tests
    MyIA.AI.Notebooks/ML/DataScienceWithAgents/01-Python-For-Data-Science/tests
    MyIA.AI.Notebooks/QuantConnect/ML-Training-Pipeline/scripts/tests
    MyIA.AI.Notebooks/IIT/ICT-Series/scripts/tests
    scripts/tests
    scripts/audit/tests
    scripts/quantconnect/tests
    scripts/translation/tests
    scripts/secrets/tests
    scripts/fallacy_detection/tests
    scripts/ci/tests
    scripts/datasets/tests
    scripts/genai-stack/tests
    scripts/hashlife/tests
    scripts/i18n/tests
    scripts/qc-mcp-lite/tests
    scripts/smartcontracts/tests
    scripts/sudoku/tests
    scripts/validation/tests
    MyIA.AI.Notebooks/QuantConnect/scripts/tests
    MyIA.AI.Notebooks/GenAI/shared/helpers
    GradeBookApp
    MyIA.AI.Notebooks/SymbolicAI/Argument_Analysis
pythonpath =
    MyIA.AI.Notebooks/QuantConnect/ML-Training-Pipeline/scripts
    MyIA.AI.Notebooks/GenAI/shared/helpers
addopts = -v --tb=short --import-mode importlib
# #22735 -- pytest derive le nom de module du PAQUET le plus proche portant
# `__init__.py` : deux suites `tests/` sans paquet parent (`scripts/genai-stack`
# et `agent_tests`) se resolvent toutes deux en `tests.conftest`, et pluggy
# refuse d'enregistrer le meme objet sous deux noms ("Plugin already registered
# under a different name"). `consider_namespace_packages` (pytest >= 8.0)
# etend la resolution aux paquets-espace de noms : les noms de modules
# redeviennent uniques par chemin. Sur un pytest < 8, cette option ini serait
# ignoree sans bruit (le job CI fige pytest >= 8 pour que cela n'arrive pas).
consider_namespace_packages = true
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
markers =
    c1301_23: marque les tests d'integration c.1301+23 post-cablage scanner quant-prose (issue #10012, cablage #10016)
    network: test qui appelle reellement un service distant ; opt-in explicite (RUN_NETWORK_TESTS=1)
