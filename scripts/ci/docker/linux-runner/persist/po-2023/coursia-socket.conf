# Po-2023 -- epingle le daemon docker-ce sur /var/run/docker-ce.sock.
# Recette de flotte : docs/ci/self-hosted-runners.md, "Persistance du superviseur"
# (deployee po-2024, ai-01, po-2028). Le socket PAR DEFAUT de cette machine
# revient au proxy Docker Desktop, qui porte les 20 conteneurs GenAI : le
# conteneur de CI ne doit jamais partager l'engine interactif.
#
# PIEGE mesure le 2026-10-20 sur po-2028 : l'unite stock docker.service porte
# Requires=docker.socket. Sans le vidage ci-dessous, demarrer docker.service
# activerait docker.socket, qui detient /run/docker.sock -- le socket par
# defaut resterait cote CI quoi qu'on ecrive dans ExecStart.
#
# Po-2023 : le demon a ete installe AVANT ce drop-in, avec /usr/sbin/policy-rc.d
# en place, pour que le postinst ne puisse pas demarrer docker.service sur le
# socket de Docker Desktop. Constat apres installation : docker.service et
# docker.socket tous deux `inactive`, /var/run/docker.sock toujours celui de
# Desktop.
[Unit]
Requires=
Requires=sysinit.target system.slice

[Service]
ExecStart=
ExecStart=/usr/bin/dockerd -H unix:///var/run/docker-ce.sock --containerd=/run/containerd/containerd.sock
