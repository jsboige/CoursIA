# Po-2023 -- docker.socket ne doit JAMAIS detenir /run/docker.sock.
#
# MESURE 2026-10-24 : l'unite stock porte `Requires=docker.socket` (ligne 6 de
# /usr/lib/systemd/system/docker.service) et `ListenStream=/run/docker.sock`
# (ligne 7 de docker.socket). Le vidage `Requires=` du drop-in
# docker.service.d/coursia-socket.conf n'a PAS retire cette dependance : apres
# `systemctl daemon-reload`, `systemctl show docker.service -p Requires` rendait
# toujours `system.slice sysinit.target docker.socket`. Resultat mesure : le
# premier `systemctl start docker` a active docker.socket, qui a pris
# /var/run/docker.sock -- Docker Desktop a perdu son entree de chemin et le CLI
# de la distro a parle au mauvais moteur (le piege que po-2028 decrivait).
#
# Plutot que de lutter contre la dependance, on deplace l'ecoute : le socket
# peut demarrer (Requires satisfait) sans jamais toucher au chemin par defaut.
[Socket]
ListenStream=
ListenStream=/run/docker-ci-socket-activation.sock
