# Po-2028 -- epingle le daemon docker-ce sur /var/run/docker-ce.sock.
# Recette de flotte : docs/ci/self-hosted-runners.md, "Persistance du superviseur"
# (deployee po-2024 puis ai-01). Le socket PAR DEFAUT de cette machine revient
# au proxy Docker Desktop (engine qui porte claudish-proxy) : le conteneur de CI
# ne doit jamais partager l'engine interactif.
#
# PIEGE mesure le 2026-10-20 sur po-2028 : l'unite stock docker.service porte
# Requires=docker.socket. Sans le vidage ci-dessous, demarrer docker.service
# activerait docker.socket, qui detient /run/docker.sock -- le socket par
# defaut resterait cote CI quoi qu'on ecrive dans ExecStart (etat constate
# apres l'apt install : docker-ce squattait /var/run/docker.sock, et le proxy
# Desktop, lui, n'avait plus que docker-cli.sock).
[Unit]
Requires=
Requires=sysinit.target system.slice

[Service]
ExecStart=
ExecStart=/usr/bin/dockerd -H unix:///var/run/docker-ce.sock --containerd=/run/containerd/containerd.sock
