# Copie de REFERENCE : l'original vit sous
# /etc/systemd/system/coursia-runner.service.d/40-scale-14.conf dans la distro
# Ubuntu d'ai-01. Ce fichier n'est execute par personne dans le depot
# (cf. persist/README.md).
#
# Le drop-in `10-sizing.conf` est le drop-in de DIMENSIONNEMENT (memoire, cap
# par slot, nombre de slots). Celui-ci porte le SCALAGE et le BUDGET, qui
# dependent de l'etat de la machine -- ils sont donc un second fichier, pas une
# surcharge du premier.
#
# ARBITRAGE `ai01-c2721-23037-budget` (coordinateur ai-01:CoursIA, 2026-10-28) :
# budget CPU 32 -> 40 vCPU, sans couper aucune famille.
#
# LA MESURE QUI FONDE LA DECISION (relevée sur ai-01, WSL Ubuntu, 2026-10-28
# ~02:40Z, `scripts/ci/docker/linux-runner/persist/ai-01/dryrun-sizing-control.sh`
# et lecture directe du cgroupfs) :
#
#   demande DECLAREE   : start 14 x 2 = 28 vCPU  +  waiters 10 x 1 = 10 vCPU
#                         = 38 vCPU de caps demandes
#   slice               : coursia-ci.slice, cpu.max = 3200000 100000
#                         soit 32 coeurs, sur une machine de 32 vCPU
#   noyau               : cpu.stat de la slice -> nr_throttled 7,
#                         throttled_usec 2 417 700 (2,42 s cumulees) sur
#                         ~25 h d'uptime de l'hote
#   slots individuels   : un conteneur de la slice a 3 688 evenements et
#                         856 s de throttling cumulees -- la contrainte qui
#                         mordait etait le cap PAR SLOT, pas le plafond
#                         agrege
#
# CE QUE CETTE DECLARATION NE FAIT PAS. Elle ne donne pas un CPU de plus a la
# machine : la slice plafonne a 32 coeurs et l'hote en a 32. Elle ne change pas
# l'arithmetique du garde VIVANT, qui exclut la famille `waiters` de la somme
# depuis #15574 (arbitrage du 2026-10-01 : un waiter est oisif la quasi-totalite
# du temps, son cap est un PLAFOND, pas une reservation) -- la somme du garde
# reste 28 vCPU contre un plafond qui passe de 32 a 40, donc toujours franchi.
# Elle change une chose de verifiable : l'INSTRUMENT de dimensionnement, qui
# compte les waiters, rendait un REFUSE permanent (38 > 32) sur une composition
# qui tourne depuis deux semaines et que le noyau dessert sans peine
# (2,42 s de throttling agrege en 25 h).
#
# CE QUI VAUT LA DECISION, ET SON CONTRE-TEMOIN. Une declaration de budget
# n'est pas une mesure : le seul instrument qui dise si elle est realiste est
# le THROTTLING mesure. D'ou le temoin ajoute a `dryrun-sizing-control.sh`
# (section 4bis) : il lit `nr_throttled` / `throttled_usec` de la slice et
# alerte au-dela de 60 s cumulees par 24 h. Si ce temoin passe, la declaration
# n'est pas contredite par le noyau ; s'il alerte, elle l'est -- et c'est une
# MESURE, pas une hypothese.
#
# Passage 10 -> 14 slots (ai-01, 2026-10-14 ~21:10Z, coordinateur ai-01:CoursIA,
# demande user de faire remonter la productivite). Etat mesure avant le geste :
# ~2160 runs en file sur coursia-ephemeral/coursia-linux depuis 14:04Z, po-2024
# a 1 slot linux-docker inscrit sur 7 ; commit Windows 73,9 % ; WSL 71 Go
# disponibles ; load 10/32 ; disque 183 Go libres.
# Budget : slots 14 x 2 = 28 vCPU (waiters exclus, #15574) <= 32 ;
#          memoire 14 x 4096m + waiters 16 x 512m = 64 Go <= 64.
# Retrait : supprimer ce fichier, coursia-waiters.service.d/40-scale-14.conf et
# coursia-ci.slice.d/40-scale-14.conf, daemon-reload, restart coursia-runner.
[Service]
ExecStart=
ExecStart=/usr/local/bin/coursia-runner-start.sh 14
Environment=COURSIA_RUNNER_CPU_BUDGET=40
Environment=COURSIA_RUNNER_BUDGET_GB=80
# BUDGET_GB 64 -> 80 (meme jour, 21:05Z) : au redemarrage, le garde nominal compte
# les conteneurs de la generation precedente encore en job (3 x 4096m + waiters
# 8192m = 20480 Mo) EN PLUS des 14 slots demandes -- double compte, refus x5,
# unite en failed (mesure 21:03:48Z). Le plafond reel reste MemoryMax=66G sur
# coursia-ci.slice ; les 16 Go de marge nominale absorbent ces orphelins.
