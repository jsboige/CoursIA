# Copie de REFERENCE : l'original vit sous
# /etc/systemd/system/coursia-waiters.service.d/10-sizing.conf dans la distro
# Ubuntu d'ai-01 (depose le 2026-10-28 avec COURSIA_RUNNER_CPU_BUDGET=10).
# DEPUIS LE 2026-10-30 cette copie CORRIGE l'original vivant : elle porte le
# budget inter-familles a 40, la ou le vivant pose 10 -- la valeur qui a casse
# le service au boot du 30/10 (recit en bas de fichier). Deployer cette copie
# sur la machine rend le drop-in de depannage 20-cpu-budget.conf redondant.
# Ce fichier n'est execute par personne ici (cf. persist/README.md).
#
# Dimensionnement du pool d'attente PR-gate (famille B, ai-01).
#
# Mesure du 2026-10-28 sur l'unite transitoire `coursia-waiters-b.service`
# (10 slots en ligne, conteneurs `--cpus=1 --memory=512m --pids-limit=128`).
# Ces valeurs sont celles qui tournaient : le passage a la persistance ne
# les change pas.
#
# CE QUE COURSIA_RUNNER_CPU_BUDGET EST VRAIMENT : un plafond INTER-FAMILLES,
# pas la taille de la famille waiters. supervise.sh l.72 le documente comme
# la « somme MAX de vCPU des familles », et chaque unite lit la valeur dans
# SON environnement. Depuis #15574, les waiters eux-memes sont EXCLUS de la
# somme (un slot d'attente ne calcule pas) : poser un budget dans CE drop-in
# plafonne donc la somme des familles de CALCUL -- pas « 10 slots x 1 vCPU ».
#
# CE QUE LA MESURE REVELAIT AU PASSAGE (2026-10-28, `dryrun-sizing-control.sh`) :
# l'instrument de dimensionnement ne pouvait plus produire de verdict, parce
# que `coursia-waiters.service` n'existait plus -- il REFUSAIT de sous-compter
# les waiters plutot que de rendre un verdict permissif. L'unite deposee ici
# lui rend cette capacite. Verdict rendu sur la configuration effective :
#   start   14 x 2 = 28 vCPU
#   waiters 10 x 1 = 10 vCPU
#   TOTAL          = 38 vCPU contre un budget declare de 32 -> REFUSE
# Le 38 est anterieur a ce depot : c'est la composition qui tournait deja. Le
# noyau, lui, ne borne pas : `cpu.stat` de la slice compte 7 evenements de
# throttling pour 2,4 s cumulees sur 22 h d'uptime, et la slice plafonne a
# 32 coeurs sur une machine de 32 vCPU. Les caps DECLARES ne sont donc pas
# satures simultanement -- l'arbitrage du budget appartient a ai-01, pas a
# cette PR.
#
# CET ARBITRAGE A EU LIEU (2026-10-28, `ai01-c2721-23037-budget`) : le budget
# inter-familles passe de 32 a **40 vCPU** (drop-in
# `ai-01/coursia-runner.service.d/40-scale-14.conf`), et l'instrument rend
# desormais `TOTAL 38.00 / 40 -> passe` sur cette meme configuration.
#
# LA PANNE QUE LE « 10 » A PRODUITE (30/10). Depose le 2026-10-28 avec
# COURSIA_RUNNER_CPU_BUDGET=10, ce drop-in cassait son propre service :
# chaque demarrage des waiters faisait compter la famille start seule
# (14 x 2 = 28 vCPU) contre le plafond de 10 -- « budget CPU inter-familles
# depasse : 28.00 vCPU demandes pour un plafond de 10 » -- et
# `coursia-waiters.service` restait en echec, du boot de 12:04Z a la
# reparation de 16:52Z (drop-in live 20-cpu-budget.conf = 40, pose par le
# coordinateur). Meme classe de piege que le budget memoire du 23/10 : la
# valeur a ete lue comme une taille de famille, alors que la variable est
# un plafond inter-familles.
#
# Le 40 pose ici est CELUI DE L'ARBITRAGE 2026-10-28, aligne sur
# 40-scale-14.conf : start 14 x 2 = 28 vCPU, waiters exclus (#15574),
# 28 <= 40 -> le demarrage passe.
[Service]
Environment=COURSIA_RUNNER_WAITER_CPUS=1
Environment=COURSIA_RUNNER_WAITER_MEMORY=512m
Environment=COURSIA_RUNNER_WAITER_PIDS=128
Environment=COURSIA_RUNNER_CPU_BUDGET=40
