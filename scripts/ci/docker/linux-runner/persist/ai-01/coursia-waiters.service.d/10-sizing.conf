# Copie de REFERENCE : l'original vit sous
# /etc/systemd/system/coursia-waiters.service.d/10-sizing.conf dans la distro
# Ubuntu d'ai-01 (depose le 2026-10-28, identique octet pour octet a cette
# copie). Ce fichier n'est execute par personne ici (cf. persist/README.md).
#
# Dimensionnement du pool d'attente PR-gate (famille B, ai-01).
#
# Mesure du 2026-10-28 sur l'unite transitoire `coursia-waiters-b.service`
# (10 slots en ligne, conteneurs `--cpus=1 --memory=512m --pids-limit=128`).
# Ces valeurs sont celles qui tournaient : le passage a la persistance ne
# les change pas.
#
# Le budget CPU est arme ici (10 slots x 1 vCPU = 10 vCPU, plafond 10) :
# jusqu'ici la famille waiters ne declarait AUCUN budget, donc
# `assert_cpu_budget` etait INACTIF pour elle (defaut 0 = garde desactive) --
# un slot de plus aurait passe sans jamais etre refuse. Le budget declare
# rend le refus possible, et il est cale sur la demande mesuree.
#
# CE QUE LA MESURE REVELLE AU PASSAGE (2026-10-28, `dryrun-sizing-control.sh`) :
# l'instrument de dimensionnement ne pouvait plus produire de verdict, parce
# que `coursia-waiters.service` n'existait plus -- il REFUSAIT de sous-compter
# les waiters plutot que de rendre un verdict permissif. L'unite deposee ici
# lui rend cette capacite. Verdict rendu sur la configuration effective :
#   start   14 x 2 = 28 vCPU
#   waiters 10 x 1 = 10 vCPU
#   TOTAL          = 38 vCPU contre un budget declare de 32 -> REFUSE
# Le 38 est anterieur a ce depot : c'est la composition qui tournait deja. Le
# noyau, lui, ne borne pas : `cpu.stat` de la slice compte 7 evenements de
# throttling pour 2,4 s cumulees sur 22 h d'uptime, et la slice plafonne a
# 32 coeurs sur une machine de 32 vCPU. Les caps DECLARES ne sont donc pas
# satures simultanement -- l'arbitrage du budget appartient a ai-01, pas a
# cette PR.
#
# CET ARBITRAGE A EU LIEU (2026-10-28, `ai01-c2721-23037-budget`) : le budget
# declare de la famille `start` passe de 32 a **40 vCPU** (drop-in
# `ai-01/coursia-runner.service.d/40-scale-14.conf`), et l'instrument rend
# desormais `TOTAL 38.00 / 40 -> passe` sur cette meme configuration.
# Le budget de CETTE famille (les waiters) reste a 10 vCPU : il borne les
# 10 slots x 1 vCPU de la famille B, il ne se confond pas avec le budget
# inter-familles du runner, qui est porte par l'autre drop-in.
[Service]
Environment=COURSIA_RUNNER_WAITER_CPUS=1
Environment=COURSIA_RUNNER_WAITER_MEMORY=512m
Environment=COURSIA_RUNNER_WAITER_PIDS=128
Environment=COURSIA_RUNNER_CPU_BUDGET=10
