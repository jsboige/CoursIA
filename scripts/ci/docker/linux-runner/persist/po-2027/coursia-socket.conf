# Po-2027 -- epingle le daemon docker-ce sur /var/run/docker-ce.sock.
# Recette de flotte : docs/ci/self-hosted-runners.md, "Persistance du superviseur".
# Le socket PAR DEFAUT de cette machine revient au proxy Docker Desktop (engine qui
# porte claudish-proxy) : le conteneur de CI ne doit jamais partager l'engine
# interactif.
#
# PIEGE mesure sur po-2028 (2026-10-20) puis ici (2026-10-24) : l'unite stock
# docker.service porte Requires=docker.socket ET After=...docker.socket. Vider
# Requires= ne suffit pas a dockerd-ce 29.9.2 : docker.socket masque, systemctl
# refuse le demarrage sur la reference d'ordre. Les deux sont donc vidEES.
[Unit]
Requires=
Requires=sysinit.target system.slice
After=
After=network-online.target firewalld.service containerd.service time-set.target basic.target nss-lookup.target system.slice systemd-journald.socket sysinit.target

[Service]
ExecStart=
ExecStart=/usr/bin/dockerd -H unix:///var/run/docker-ce.sock --containerd=/run/containerd/containerd.sock
