# Dimensionnement po-2024 de la jambe DOCKER EXECUTION -- drop-in, jamais l'unite.
#
# POURQUOI UN DROP-IN, ET PAS UNE MODIFICATION DE L'UNITE
# -------------------------------------------------------
# `coursia-runner.service` est, dans persist/README.md, la copie de reference
# partagee entre ai-01 et po-2024. Le drop-in est la forme qui rend le
# perimetre explicite : il ne vit QUE sur po-2024, et l'unite partagee reste
# intacte pour ai-01. Cf. le drop-in jumeau
# `po-2024/coursia-waiters.service.d/10-sizing.conf` (waiters 12 -> 6) et son
# pendant ai-01.
#
# CE QUE CE DROP-IN CHANGE, ET CE QU'IL NE CHANGE PAS
# ---------------------------------------------------
# CHANGE 1 : NOMBRE de slots, 4 -> 2.
# CHANGE 2 : cap memoire unitaire, 1536m -> 4g, surcharge
#            COURSIA_RUNNER_MEMORY exportee au superviseur.
# CHANGE 3 : cap pids unitaire, 384 -> 512, surcharge
#            COURSIA_RUNNER_PIDS exportee au superviseur.
# NE CHANGE PAS : BUDGET_GB (reste 21, declare par le wrapper
#                  /usr/local/bin/coursia-runner-start.sh), CPU_BUDGET (reste
#                  18, declare par le meme wrapper), labels, toolcache,
#                  _work, image.
#
# LA MESURE QUI MOTIVE 4 -> 2 slots / 1536m -> 4g (2026-10-15, ai-01 DM
# msg-20261015T152005-eeho7i, mesure firsthand) :
#
#   - 11/11 echecs `scripts-tests.yml` du 15/10 sur les 4 linux-docker slots
#     po-2024 avec la signature `KeyError: <WorkerController gwN>` dans le
#     journal du job -- donc MEME signature que les wsl ai-01 frappes par
#     d'autres defauts, et les deux runs que la c.336 precedente avait cites
#     sur wsl (38739640582, 38733992062) n'ont PAS la signature (`workerctl=0`
#     dans le journal) : la mesure c.336 etait une correlation, pas une
#     causalite.
#   - Scripts Tests demande ~3,5 Gio et ~384 pids (mesure supervise.sh:117-142
#     documentee verbatim, cap mort 7898 events au slot 2 cfb377c4b3 du
#     2026-09-18). Au defaut 1536m+384, le job SURVIT en thrashant -- le
#     KeyError est xdist qui remplace des workers morts, pas un transient.
#   - Les slots ai-01 sont a 4 Gio et tournent : sur la meme classe de job,
#     un cap 2,7x plus grand tient. Le 4g est la traduction directe pour
#     po-2024.
#
# ARITHMETIQUE BUDGET (apres ce drop-in) :
#     2 slots docker x 4 Gio   =  8 Gio    (avant : 4 x 1536m = 6 Gio)
#     6 waiters      x 512 Mio =  3 Gio    (cap unitaire INCHANGE)
#     1 slot lean    x 6 Gio   =  6 Gio    (verdict J+7 du 2026-10-08)
#     --------------------------------------
#     total CAPS                17 Gio   sur 24 Gio VM -> marge ~7 Gio
#
# BUDGET_GB reste 21 (defini par le wrapper) : 17 << 21, large marge
# d'admission. assert_memory_budget (supervise.sh:l.2194) accepte. Les
# TROIS JAMBES (runner, lean, waiters) doivent annoncer le MEME nombre
# (po-2024 : 21, 21, 21 -- voir
# po-2024/coursia-waiters.service.d/10-sizing.conf et le wrapper lean
# po-2024/coursia-lean.service.d). Aucune modif requise de ce cote.
#
# CPU_BUDGET reste 18 (defini par le wrapper) : 2 x 3 (docker) + 1 x 6 (lean)
# = 12 << 18, large marge. assert_cpu_budget accepte.
#
# LA CONCURRENCE PASSE DE 4 A 2 SLOTS, ET C'EST DELIBERE. 2 slots a 4 Gio
# chacun, c'est 8 Gio de memoire d'execution, 33 % de plus qu'aujourd'hui
# (4 x 1536m = 6 Gio), pour 50 % de jobs en parallele. Le ratio
# memoire / concurrence passe de 1,5 Gio/slot a 4 Gio/slot -- un job
# lourd garde le meme regime memoire (4 Gio au lieu de thrash a 1,5),
# il attend son tour au lieu de pousser la machine dans le swap. La
# regle #15202 de persist/README.md (abaisser un cap interdit sans nommer
# les jobs) ne s'applique pas ici : on n'ABAISSE rien, on REMONTE le cap
# et on REDUIT la concurrence.
#
# ALTERNATIVE 3 SLOTS EVALUEE ET REJETEE : 3 x 4g + 6 x 512m + 1 x 6g =
# 21 216 Mio, pile sur le BUDGET_GB=21. Aucune marge d'admission -- un
# futur slot lean supplementaire ou un waiter de plus ferait rougir
# assert_memory_budget. 2 slots gardent 4 Gio de marge sur le budget,
# de quoi absorber une variation.
#
# CRITERE DE MORT (cote lane) : prochain Scripts Tests vert sur un slot
# po-2024 sans KeyError dans le journal du job, mesuree par
# `gh run view <id> --log-failed | grep -c WorkerController`. Tant que
# ce vert n'est pas vu, le redimensionnement n'est pas valide.
#
# REFERENCES
# ----------
# - DM ai-01 2026-10-15T15:20:05Z (msg-20261015T152005-eeho7i)
# - Issue #20891 diagnostic COLLECT_CRASH (cid 6194729954 v2 corrige)
# - supervise.sh:117-142 (le defaut et la mesure du pic 3,5 Gio / 384 pids)
# - xdist #19915 (transient KeyError upstream, identifie ici comme
#   worker mort -- pas transient -- par la memoire/pids cap)
[Service]
ExecStart=
ExecStart=/usr/local/bin/coursia-runner-start.sh start 2
Environment=COURSIA_RUNNER_MEMORY=4g
Environment=COURSIA_RUNNER_PIDS=512
