# Dimensionnement po-2024 de la jambe WAITERS -- drop-in, jamais l'unite.
#
# POURQUOI UN DROP-IN, ET PAS UNE MODIFICATION DE L'UNITE
# -------------------------------------------------------
# `coursia-waiters.service` est, dans persist/README.md, la copie de reference
# d'**ai-01** -- et cette machine-la l'a deploye pour de vrai. po-2024 execute
# la MEME unite, byte-identique au depot (sha256 verifie le 2026-10-08 :
# `/etc/systemd/system/coursia-waiters.service` == `persist/coursia-waiters.service`).
#
# Les deux parcs partagent donc ce fichier. Editer son `ExecStart=... 12` pour
# descendre po-2024 a 6 ferait descendre ai-01 au prochain deploiement, sans
# que rien ne le signale -- un changement de dimensionnement pris sur une
# machine et applique a une autre. Le drop-in est la forme qui rend le
# perimetre explicite : il ne vit QUE sur po-2024, et l'unite partagee reste
# intacte pour ai-01. C'est le meme mecanisme que
# `ai-01/coursia-runner.service.d/10-sizing.conf`, pris par l'autre bout.
#
# CE QUE CE DROP-IN CHANGE, ET CE QU'IL NE CHANGE PAS
# ---------------------------------------------------
# CHANGE : le NOMBRE de slots, 12 -> 6.
# NE CHANGE PAS : le cap memoire unitaire (`WAITER_MEMORY=512m`), le cap CPU
# (`WAITER_CPUS=1`), les labels, les pids.
#
# C'est delibere, et c'est la regle #15202 de persist/README.md qui l'impose :
# toute PR qui ABAISSE une borne doit nommer les jobs mesures sous la nouvelle
# valeur ET les jobs non mesures qui tournent sur le pool. Un waiter n'est pas
# un conteneur inerte -- il EXECUTE les jobs PR-gate (label `coursia-waiter`).
# Descendre son cap a 256 Mo changerait le regime memoire de jobs que personne
# n'a mesures ; reduire le nombre de slots, non : chaque job garde exactement
# le meme cap, seule la concurrence baisse. Le geste sur est celui-la.
#
# LA MESURE QUI MOTIVE LE 12 -> 6 (2026-10-08, firsthand sur po-2024) :
#
#   docker stats : 12 waiters, 59 a 118 Mo consommes pour un cap de 512 Mo
#                  (12 % a 23 %) -- le cap n'est JAMAIS approche ;
#   API GitHub   : 12 waiters, 12 `busy: false` a l'instant du releve ;
#   pendant ce temps, 3 des 6 slots docker etaient a 99 % de leur cap.
#
# Autrement dit : a l'instant ou la machine etouffait sous le swap, la famille
# qui consommait etait `docker`, et celle qui reservait 6 144 Mo de caps sans
# en toucher le quart etait `waiters`. Le 12 -> 6 rend 3 072 Mo de budget
# d'admission a la composition, sans retirer un octet a aucun job.
#
# Le nombre 6 n'est pas un plancher mesure -- cette machine n'a pas de
# historique d'occupation des waiters, seulement un instantane. Il est choisi
# pour rester STRICTEMENT superieur au nombre de slots docker (4) : la file de
# gates garde de quoi absorber une rafale sans jamais faire attendre un job
# derriere un slot d'execution. Si l'occupation soutenue des waiters venait a
# approcher 6, c'est le budget de la machine qu'il faudrait rouvrir -- pas ce
# nombre qu'il faudrait deviner a la hausse sans mesure.
#
# `COURSIA_RUNNER_BUDGET_GB=21` : le wrapper waiters appartient a ai-01 et ne
# declare pas de budget. Le garde de memoire (assert_memory_budget, l.2194)
# somme les conteneurs en vol de TOUTES les familles contre cette valeur : sans
# elle ici, cette jambe retomberait sur le defaut 12 et refuserait des slots
# sains. Les trois jambes de po-2024 annoncent le meme nombre.
#
# Le drop-in re-declare `ExecStart=` a vide d'abord : c'est la forme qui EFFACE
# la valeur de l'unite de base avant de poser la sienne. Sans la ligne vide,
# systemd refuserait deux ExecStart concurrents.
[Service]
Environment=COURSIA_RUNNER_BUDGET_GB=21
ExecStart=
ExecStart=/usr/local/bin/coursia-waiters-start.sh 6
