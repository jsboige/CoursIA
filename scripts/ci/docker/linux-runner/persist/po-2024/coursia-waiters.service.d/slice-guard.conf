# Garde d'activation + placement + fail-closed de la slice CI pour la jambe
# WAITERS (dispatch ai-01 c1600 du 2026-10-09, suite signalement ms#76).
# Le wrapper coursia-waiters-start.sh appartient a ai-01 (byte-identique sur
# les deux sieges, non modifie) et n'exporte NI slice NI garde : supervise.sh
# les lit dans SON environnement (COURSIA_RUNNER_CGROUP_PARENT l.276,
# COURSIA_REQUIRE_CI_SLICE l.295) -- ce drop-in les y injecte, perimetre
# po-2024 uniquement, meme mecanisme explicite que 10-sizing.conf.
# Une slice vide demarree reste active avec ses limites lisibles (valide
# mesure sur la jambe CI le meme jour ; Wants/After active au boot).
[Unit]
Wants=coursia-ci.slice
After=coursia-ci.slice

[Service]
Environment="COURSIA_RUNNER_CGROUP_PARENT=coursia-ci.slice"
Environment="COURSIA_REQUIRE_CI_SLICE=1"
