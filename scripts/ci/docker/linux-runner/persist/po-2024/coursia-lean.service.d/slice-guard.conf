# Garde d'activation + fail-closed de la slice CI (signalement ms#76, 2026-10-09).
# Wants/After : la slice demarre au boot avec l'unite (une slice vide demarree
# reste active avec ses limites lisibles — valide mesure). REQUIRE_CI_SLICE=1 :
# assert_ci_slice de supervise.sh devient fail-closed — slice absente = unite
# FAILED lisible, jamais un pool non borne silencieux.
[Unit]
Wants=coursia-ci.slice
After=coursia-ci.slice

[Service]
Environment="COURSIA_REQUIRE_CI_SLICE=1"
