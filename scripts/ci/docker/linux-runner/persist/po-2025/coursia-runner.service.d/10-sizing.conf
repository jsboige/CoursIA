# Dimensionnement po-2025 de la jambe DOCKER EXECUTION -- drop-in, jamais l'unite.
#
# POURQUOI UN DROP-IN : `coursia-runner.service` est la copie de reference
# partagee entre tout le parc. Le nombre de slots appartient a la machine, pas
# a l'unite ; le drop-in est la forme qui rend ce perimetre explicite et laisse
# l'unite partagee intacte.
#
# N = 2 (dispatch ai-01 du 2026-10-24, point 3 : « demarre a N = 2, mesure la
# temperature CPU pendant un vrai job, et recule si elle tient au-dessus de
# 90 C »). Ce n'est pas un choix esthetique : po-2025 est un PORTABLE (i9-12900HK,
# 14 cœurs / 20 logiques) qui sert aussi de poste interactif, et il a deja subi
# trois arrets thermiques le 2026-04-28.
#
# ARITHMETIQUE DES GARDES, verifiee contre le wrapper :
#     CPU     : 2 slots x 3 vCPU = 6  <= COURSIA_RUNNER_CPU_BUDGET=10
#     MEMOIRE : 2 slots x 1536 Mo = 3 072 Mo <= COURSIA_RUNNER_BUDGET_GB=3 (3 072 Mo) -- somme des caps, convention #22532
#     DISQUE  : 2 x ~4 Gio de _work + toolcache sur 674 G libres (> 20 % libre)
#
# LES CAPS UNITAIRES NE SONT PAS TOUCHES ici (3 vCPU / 1536 Mo / 384 pids) :
# ils sont le defaut mesure du parc, et reduire la concurrence est la bonne
# variable quand la machine chauffe, pas le cap d'un job.
#
# POUR CHANGER N : editer ce fichier, `systemctl daemon-reload`, puis
# `systemctl restart coursia-runner`. Ne PAS relancer `supervise.sh start` a la
# main en session : c'est precisement ce que le service remplace, et deux
# superviseurs sur les memes noms se livrent une guerre de flap name-replace.
[Service]
ExecStart=
ExecStart=/usr/local/bin/coursia-runner-start.sh start 2
