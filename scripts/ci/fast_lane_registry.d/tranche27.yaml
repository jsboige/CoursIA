# TRANCHE27 -- genere depuis scripts/ci/fast_lane_registry.py (#28117), ne pas editer a la main sans relire le chargeur.
group: TRANCHE27
guards:
  -
    name: "Consecutive code cells >= 2 advisory (label, non-blocking)"
    argv: ["python", "scripts/notebook_tools/detect_consecutive_code_cells.py", "--json", "{changed_paths}"]
    source: "consecutive-code-cells-advisory.yml"
    paths: ["**/*.ipynb", ".github/workflows/consecutive-code-cells-advisory.yml"]
    blocking: false
    iterates_paths: true
    absorbed: true
    iterate_paths: ["**/*.ipynb"]
  -
    name: "Mermaid fill-without-color advisory (label, non-blocking)"
    argv: ["python", "scripts/notebook_tools/detect_mermaid_fill_without_color.py", "--json", "--root", ".", "{changed_paths}"]
    source: "mermaid-fill-color-advisory.yml"
    paths: ["**/*.md", "**/*.ipynb", "scripts/notebook_tools/detect_mermaid_fill_without_color.py", "scripts/notebook_tools/tests/test_detect_mermaid_fill_without_color.py", "scripts/notebook_tools/tests/fixtures/mermaid_fill_no_color.md", ".github/workflows/mermaid-fill-color-advisory.yml"]
    blocking: false
    iterates_paths: true
    absorbed: true
    warn_rc:
      -
        2
    iterate_paths: ["**/*.md", "**/*.ipynb"]
    pre_argv: ["python", "scripts/notebook_tools/detect_mermaid_fill_without_color.py", "--self-test"]
  -
    name: "Markdown table syntax advisory (label, non-blocking)"
    argv: ["python", "scripts/notebook_tools/scan_md_table_syntax.py", "--json", "{changed_paths}"]
    source: "markdown-table-guard.yml"
    paths: ["**/*.ipynb", "**/*.md", "**/*README*", ".github/workflows/markdown-table-guard.yml", "scripts/notebook_tools/scan_md_table_syntax.py", "scripts/notebook_tools/md_table_sweep_comment.py"]
    blocking: false
    iterates_paths: true
    absorbed: true
    warn_rc:
      -
        2
    iterate_paths: ["**/*.ipynb", "**/*.md", "**/*README*"]
