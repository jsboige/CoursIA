# TRANCHE47 -- genere depuis scripts/ci/fast_lane_registry.py (#28117), ne pas editer a la main sans relire le chargeur.
group: TRANCHE47
guards:
  # Le detecteur prouve qu'il tire avant de rendre un vert (#11685).
  # rc=2 : erreur d'invocation (carnet illisible). Incident, jamais un
  # vert silencieux.
  -
    name: "Uncommented code (#26690)"
    argv: ["python", "scripts/notebook_tools/check_uncommented_code.py", "--diff", "{base_ref}"]
    source: "native"
    paths: ["**.ipynb", "scripts/notebook_tools/check_uncommented_code.py", "scripts/notebook_tools/tests/test_check_uncommented_code.py", "scripts/ci/fast_lane.py", "scripts/ci/fast_lane_registry.py"]
    blocking: true
    needs_base: true
    absorbed: true
    warn_rc:
      -
        2
    pre_argv: ["python", "-m", "pytest", "-q", "scripts/notebook_tools/tests/test_check_uncommented_code.py"]
