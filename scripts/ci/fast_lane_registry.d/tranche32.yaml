# TRANCHE32 -- genere depuis scripts/ci/fast_lane_registry.py (#28117), ne pas editer a la main sans relire le chargeur.
group: TRANCHE32
guards:
  -
    name: "twin-index-collision-guard"
    argv: ["python", "scripts/notebook_tools/check_twin_index_collisions.py", "--base", "{base_ref}", "--head", "HEAD", "--gate"]
    source: "native"
    paths: ["scripts/notebook_tools/twin_pairs.d/**", "scripts/notebook_tools/check_twin_index_collisions.py", "scripts/notebook_tools/twin_open_claims.py", "scripts/ci/fast_lane.py", "scripts/ci/fast_lane_registry.py"]
    blocking: true
    needs_base: true
    absorbed: true
    warn_rc:
      -
        2
  -
    # #27969 : attestation de parite orpheline -- une attestation qui cite un
    # blob qui N'EXISTE NI sur la base NI a la tete de la revision ne peut pas
    # survivre au squash : le squash ecrit l'arbre de la branche, pas son
    # historique. Le blob cite existe dans l'historique de la branche (donc le
    # test de branche est vert) mais n'arrive jamais sur `main`, ou
    # `test_audit_shas_exist_in_file_history` le classe « fabrique » et
    # rougit `main` pour TOUTE la flotte. Mesures : #27860 (python
    # 7abe7001cb) et #27773 (csharp bf908d37a1), tous deux verts sur la
    # branche et orphelins apres fusion.
    #
    # Le perimetre est un DELTA borne au diff : seules les attestations
    # AJOUTEES ou MODIFIEES par la revision sont examinees ; une attestation
    # heritee de la base n'est jamais un motif de refus.
    #
    # rc=1 = attestation orpheline (bloquant, avec le geste de correction) ;
    # rc=2 = incident d'entree (git/parse), neutre au check-run.
    name: "twin-attestation-orphan-guard"
    source: "native"
    paths: ["scripts/notebook_tools/twin_pairs.d/**", "scripts/ci/check_twin_attestation_orphans.py", "scripts/notebook_tools/check_twin_parity.py", "scripts/ci/fast_lane.py", "scripts/ci/fast_lane_registry.py"]
    argv: ["python", "scripts/ci/check_twin_attestation_orphans.py", "--base", "{base_ref}", "--head", "HEAD", "--gate"]
    blocking: true
    needs_base: true
    diff_bounded: true
    absorbed: true
    warn_rc:
      -
        2
  -
    # Heritage d'execution entre carnets jumeaux : l'artefact COPIE
    # (#27992, decouvert sur la PR #27872). Un carnet qui porte les
    # horodatages d'execution d'un autre carnet de sa famille n'a pas ete
    # execute : il a ete copie, et ses sorties ne sont pas les siennes.
    # Le verdict est un DELTA borne au diff (seules les familles touchees
    # par la PR sont examinees) : un rouge ne peut pas heriter de `main`.
    #
    # Corps porte depuis `scripts/ci/fast_lane_twin_heritage.py` (main,
    # #27995) : dans un registre en donnees, la specification d'une porte
    # est une entree comme les autres ; le module qui la portait n'a plus
    # de consommateur.
    name: "twin-execution-heritage-guard"
    source: "native"
    paths: ["scripts/notebook_tools/twin_pairs.d/**", "scripts/notebook_tools/rust_conformance.d/**", "**/*.ipynb", "scripts/notebook_tools/check_twin_execution_heritage.py", "scripts/ci/fast_lane.py", "scripts/ci/fast_lane_registry.py"]
    argv: ["python", "scripts/notebook_tools/check_twin_execution_heritage.py", "--diff", "{base_ref}...HEAD", "--gate"]
    blocking: true
    absorbed: true
    needs_base: true
    diff_bounded: true
    warn_rc:
      -
        2
