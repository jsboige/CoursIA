# TRANCHE39 -- genere depuis scripts/ci/fast_lane_registry.py (#28117), ne pas editer a la main sans relire le chargeur.
group: TRANCHE39
guards:
  -
    name: "No cell-ordering regression in changed notebooks"
    argv: ["python", "scripts/notebook_tools/cell_order_ci.py", "--base-ref", "{base_ref}", "--head", "{changed_paths}"]
    source: "cell-order-gate.yml"
    paths: ["MyIA.AI.Notebooks/**/*.ipynb", "scripts/notebook_tools/scan_cell_ordering.py", "scripts/notebook_tools/cell_order_ci.py"]
    blocking: true
    needs_base: true
    iterates_paths: true
    absorbed: true
    iterate_paths: ["MyIA.AI.Notebooks/**/*.ipynb"]
    pre_argv: ["python", "-m", "pytest", "-q", "scripts/notebook_tools/tests/test_scan_cell_ordering.py"]
