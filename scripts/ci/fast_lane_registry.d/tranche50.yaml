group: TRANCHE50
guards:
  -
    name: "Enrich-quality regression (base vs PR, advisory)"
    argv: ["python", "scripts/notebook_tools/enrich_quality_delta.py", "--base-ref", "{base_ref}"]
    source: "native"
    paths: ["**.ipynb", "scripts/notebook_tools/enrich_quality_delta.py", "scripts/notebook_tools/enrich_quality_ci.py", "scripts/notebook_tools/scan_enrich_quality.py", "scripts/ci/filter_pr_introduced_notebooks.py"]
