submodules:
  # Contrat de retour amont (#13902, item 4) : une collision avec un organe de
  # cette section n'est PAS blanchie par la seule « copie declaree » -- le body
  # doit porter la section « ce que cette extraction rend a l'amont » (ou
  # declarer explicitement ne rien rendre). Ces depots sont des sous-modules =
  # geste de perennite (mandat user 2026-09-01) : extraire leur ame sans nommer
  # le contrat de retour est le mecanisme d'affaiblissement que l'EPIC interdit.
  #
  # Source des symboles : MESURE au 2026-10-23 sur les arbres GitHub des cinq
  # depots AUX GITLINKS EPINGLES d'origin/main (git ls-tree), convention C# une
  # classe publique par fichier, spot-checks Fallacy.cs (« public class
  # Fallacy ») et VettingLevel.cs (« public enum VettingLevel »). Curation :
  # noms distinctifs seulement -- les noms d'algorithmes standards (Differential
  # Evolution, Simulated Annealing...) sont exclus : reimplementer un algorithme
  # de manuel n'est pas extraire l'organe. Borne connue : DEF_RE ne voit que
  # def/class -- un « record », « enum » ou « type » F# ajoute hors du
  # sous-module n'est pas attrape.
