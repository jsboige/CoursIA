version: 1
# Index des API publiques caracteristiques des organes de series (#16776, fille de #13564).
#
# Regle servie : .claude/rules/organ-first-implementation.md (merge #16778) --
# avant de reimplementer une semantique qu'une autre serie possede deja, la PR
# doit nommer l'organe (5 questions) ou declarer une copie pedagogique.
#
# Source des symboles : MESURE sur l'arbre au cycle 41 (def/class publics des
# .py des packages + cellules code des .ipynb par serie). Aucun symbole de
# memoire. Les exemples illustratifs de la spec d'origine (`grounded_extension`,
# `sparql_update`, `assert_expr`, `plan`...) ont ete mesures a 0 hit sur l'arbre
# -- ils ne sont PAS dans l'index.
#
# Curation : symboles GENERIQUES exclus volontairement (solve, install, main,
# Search, Marginal, download, benchmark, plot_dist, memoize...) : une collision
# ne compte que sur un nom distinctif de l'organe. Une re-curation doit
# re-mesurer (grep def/class par serie) avant d'ajouter un symbole.

