  ne cree le generateur de bruit que si `noise > 0` ; `run_tournament` initialise `rng_seed = 1`
  et l''incremente a chaque match ; le tournoi de la librairie part avec
  `axl.Tournament(..., seed=42)`). Consequence mesuree : les deux classements du carnet (avec
  et sans bruit) sont reproductibles d''une execution a l''autre -- deux executions completes
  du carnet produisent des sorties byte-identiques. Audit firsthand du carnet Python au head
  4b8095e84f : meme plan, meme socle theorique (IPD, tournoi d''Axelrod, strategies classiques,
  processus de Moran), sorties issues des cellules re-executees en session unique, prose
  realignee sur les valeurs commitees. Le cote C# est inchange (csharp_sha aed25022 identique
  a l''audit 0028) : la modification rapproche les deux jumeaux de la semantique du jumeau C#,
  elle n''introduit aucune divergence, niveau de parite `semantic` preserve. Aucune normalisation
  outillee n''a ete appliquee apres cet audit.'
