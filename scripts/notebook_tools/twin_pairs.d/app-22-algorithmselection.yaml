- name: App-22 AlgorithmSelection
  family: Search/Part3-Cas-pratiques
  python: MyIA.AI.Notebooks/Search/Part3-Cas-pratiques/App-22-AlgorithmSelection-Python.ipynb
  csharp: MyIA.AI.Notebooks/Search/Part3-Cas-pratiques/App-22-AlgorithmSelection-CSharp.ipynb
  parity_level: semantic
  bridge_verdict: SOTA-OK
  bridge_verdict_reason: "Python = `pandas` + `numpy` + `matplotlib` (pile d'analyse de donnees de reference : lecture CSV, groupby, vecteurs, figure). C# = BCL pure (System.IO/System.Linq/System.Collections.Generic/System.Globalization + SVG inline) -- choix delibere de la fiche de portage de #26078, ou le jumeau .NET doit montrer chaque etape de calcul (lecture CSV, dominance, normalisation, bootstrap) plutot que la deleguer a un `groupby` opaque. Aucun moteur n'est bride : l'analyse ne depend d'aucune API proprietaire, les valeurs committes sont identiques au carnet Python (profils, fronts de Pareto, vainqueurs par profil de preference, point de bascule 0,30 de l'analyse de sensibilite, pivots `nodes_explored`). Le seul ecart numerique est l'intervalle bootstrap, dont le generateur differe (declare ci-dessous). SOTA-OK : le C# n'invente pas un substitut a un moteur manquant, il reimplemente exactement ce que son hypothese pedagogique demande, et la parite est verifiee."
  known_differences:
    - 'Figure : le carnet Python trace la frontiere de Pareto en matplotlib sur un axe des temps LINEAIRE ; le C# ecrit un SVG inline (aucune dependance graphique) sur un axe LOG10, les temps des familles Sudoku s''etalant sur plus de trois decennies (`dancing_links` ~0,006 s a `genetic` ~9,4 s). Le contenu represente est le meme (points, front non domine en rouge, etiquettes).'
    - 'Bootstrap : le Python appelle `numpy.default_rng(2026)` ; le C# utilise un SplitMix64 deterministe de graine 2026. Les deux sont reproductibles, mais les tirages different : les bornes des IC 95 % divergent au troisieme chiffre significatif. Les conclusions (direction, largeur relative, familles a intervalle nul) sont identiques ; les bornes ne se recopient pas d''un carnet a l''autre.'
    - 'Mise en forme des tableaux : le Python imprime `DataFrame.to_string()` (pandas) ; le C# imprime des colonnes alignees par `PadRight`/`PadLeft`. Memes valeurs, memes arrondis a trois decimales, largeurs de champ differentes.'
    - 'Bibliotheques tierces : aucune cote C# (CSV, moyennes, ecart-type ddof=1, percentiles, dominance et SVG sont ecrits dans le carnet), contre pandas/numpy/matplotlib cote Python. Le trace de controle (meme instance, memes sorties) est la sortie committee.'