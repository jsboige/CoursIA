- name: "Search-03 Informed"
  family: Search/Part1-Foundations
  python: MyIA.AI.Notebooks/Search/Part1-Foundations/Search-03-Informed.ipynb
  csharp: MyIA.AI.Notebooks/Search/Part1-Foundations/Search-03-Informed-Csharp.ipynb
  parity_level: native-both
  bridge_verdict: SOTA-OK
  bridge_verdict_reason: "Python = stdlib + networkx (helper viz graph + heuristic lookup) + heapq (priority queue A*/Greedy/Best-First). Pas de lib SOTA-tier Python pour informed search pure (`aima-python` est jouet non maintained, `pySearch` est un essai), le port pedagogique AIMA ch.4 from-scratch reste canonique. C# = `QuikGraph` NuGet (Pelikan521, MIT-license, lib SOTA graphe .NET : `using QuikGraph;` + `using QuikGraph.Algorithms.ShortestPath;` + `DijkstraShortestPathAlgorithm<TVertex,TEdge>` / `AStarShortestPathAlgorithm<TVertex,TEdge>`, version 2.5.0). Verdict SOTA-OK (modèle owner PR #10412 MERGED pour Sudoku-09 / PR #10387 MERGED pour Search-02b NetworkX) : QuikGraph EST la lib SOTA graphe canonique .NET (Bellman-Ford, Dijkstra, A*, BFS, DFS -- tout y est), l'API `AStarShortestPathAlgorithm` permet un bridge direct A* avec heuristique. Asymetrie documentee : PY from-scratch (algos pedagogiques AIMA), C# bridge via lib SOTA (algo canonique)."
  known_differences:
    - "Socle pedagogique commun : A* et Greedy Best-First avec differentes heuristiques (distance Manhattan, euclidienne, h=0=degenere en UCS). Arrive en Roumanie + 8-puzzle."
    - "Idiomes framework : Python = `import heapq` (priority queue avec (f, tie_breaker, noeud)). C# = `PriorityQueue<AStarNode, double>` (f-cost = g + h)."
    - "Asymetrie pedagogique interessante : le notebook Python inclut une discussion sur l'admissibilite vs consistance des heuristiques (h <= h* + coherence), le C# se concentre sur les benchmarks (noeuds explores pour h=Manhattan vs h=Euclidean sur le meme probleme)."
    - "Tranche 2 #10382 (bucket-1 .NET natif, parite lib-vs-lib) cote C# : QuikGraph.AStarShortestPathAlgorithm<string, STaggedEdge<string, double>> sur la meme instance (franceGraph 13 villes + heuristique Haversine) que from-scratch cell 10-11. Le jumeau Python reste from-scratch (pas de networkx A* cote Python, choix pedagogique coherent avec le reste de la serie -- A* n'est pas le point fort de networkx). Verdict SOTA-OK ecrit (Prong A) + Prong B verifie par discrimination `from-scratch == QuikGraph` (meme 1055 km, meme chemin). `parity_level` reste `semantic` : A* via QuikGraph est un ajout .NET local (pas un jumeau bilaterale), il sert de verification croisee du from-scratch, pas de substitution. difference avec Search-02b : Search-02b a flippe semantic -> native-both car LES DEUX jumeaux utilisent un moteur SOTA (Python networkx + .NET QuikGraph). Ici le Python n'utilise pas de moteur SOTA par choix (heapq stdlib), donc la parite reste semantique."
    - "Methode de reconstruction du chemin : from-scratch utilise `cameFrom` (dict predecesseur explicite). QuikGraph 2.5.0 expose l'observateur canonique `VertexPredecessorRecorderObserver<TVertex, TEdge>` (API `Attach(algo)` + `TryGetPath(goal, out aretes)`, aretes -> projection en sommets) qui encapsule la condition d'optimalite `GetDistance(source) + poids(u, v) = GetDistance(v)` ; utilise sur A* (cell 16) et les siblings (Search-02b cell 14, Search-2 cell 38, Search-02c cell 17). Remplace la remontee manuelle par recherche dans `IncomingEdges`, dupliquee sur 5 cellules (nit Hermes #11107, decision #11113). Search-02c cell 11 conserve la remontee manuelle comme demonstration pedagogique de la condition d'optimalite."
