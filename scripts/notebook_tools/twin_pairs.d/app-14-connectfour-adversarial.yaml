    - "Socle pedagogique commun : Puissance 4 adversarial (variant Connect-4, IA jeux combinatoires) comme application canonique. Les deux twins couvrent le meme socle theorique (formulation variables/domaines/contraintes, resolution, experimentation) avec parite semantique sur les concepts cibles."
    - "Idiomes framework : Python = collections + typing (variant Connect-4 adversarial) ; C# = System.* BCL pure (System.Text), 0 NuGet."
    - "Asymetrie pedagogique : Python met l'accent sur le solveur SOTA (OR-Tools CP-SAT / library specialisee) + visualisation matplotlib + experimentation comparative ; le C# demontre l'implementation from-scratch en BCL pure (ou binding NuGet du meme solver pour App-8/10/15), presentation compacte. Meme socle theorique, leviers de demonstration differents."
    - "2026-08-20 (c.1301+261, myia-po-2025:CoursIA-2) : flip verdict RECOVERABLE-LOCAL -> SOTA-OK (bucket 3 de #10382). Faux positif : la raison mentionnait 'ni Python ni C# n'invoque de moteur SOTA partage' puis maintenait RECOVERABLE-LOCAL. Verifie firsthand : Python stdlib (collections + typing), C# BCL pure 0 NuGet. Les DEUX cotes implementent les memes algorithmes adversariaux (minimax/alpha-beta + MCTS Monte Carlo) en from-scratch pedagogique -- le from-scratch EST la contrepartie (bucket 3). asymetrie de couverture de l'enveloppe pedagogique (Python 18 cellules vs C# 10 cellules) preserve, aucune asymetrie de couverture moteur a corriger."
