- name: "ICT-36h FLens RFNestedCV"
  family: ICT-Series
  python: MyIA.AI.Notebooks/IIT/ICT-Series/ICT-36h-FLens-RFNestedCV-Python.ipynb
  csharp: MyIA.AI.Notebooks/IIT/ICT-Series/ICT-36h-FLens-RFNestedCV-CSharp.ipynb
  parity_level: semantic
  known_differences:
    - "2026-11-25 (myia-po-2023:CoursIA) : jumeau C# ecrit en BCL pure -- ni scikit-learn ni NumPy, aucun paquet NuGet. Le terrain synthetique (AR(1) par region, gradient anterieur-posterieur, dimension de Higuchi, complexite de Lempel-Ziv binarisee a la mediane) est reimplemente a la main, avec un generateur SplitMix64 + Box-Muller a la place du PCG64 de NumPy : les valeurs ne sont pas comparables chiffre a chiffre, et le carnet le declare dans son en-tete."
    - "Foret aleatoire ecrite a la main : seize quantiles par descripteur et par noeud comme candidats de coupure, mtry = racine carree du nombre de descripteurs, importance d'impurete cumulee sur les arbres. Ce n'est pas l'implementation de scikit-learn ; les precisions different de quelques points (LZC 0,811 en C# contre 0,770 en Python sur les memes graines)."
    - "Decoupage groupe glouton (le plus gros sujet restant va au pli le plus leger) au lieu du StratifiedGroupKFold de scikit-learn : aucun sujet ne franchit la frontiere dans les deux implementations, mais la repartition des sujets n'est pas identique. Les deux variantes du carnet C# partagent le meme decoupage, donc leur comparaison (Q3) reste valable."
    - "Parite de STRUCTURE, pas de nombre. Chaque table du portage affiche la valeur du portage, la valeur citee par la source et l'ecart sous tolerance declaree ; trois ecarts depassent leur tolerance et s'affichent comme tels : le niveau de la fuite de groupe (+0,143 en C# contre +0,082 en Python, ecart +0,061 pour une tolerance de 0,05), la precision a eta = 0,04 (0,641 contre 0,693, ecart -0,052 pour 0,05) et le partage de l'importance entre familles (HFD 0,39 / LZC 0,61 contre 0,31 / 0,69). Ce qui se reproduit : Q1 decodable et au-dessus de la nulle (p au plancher de 0,032 dans les deux), Q2 non mesurable dans les deux (signe instable entre graines), Q3 positif sur les huit graines des deux, Q4 retombe sous le quantile 95 a eta = 0 puis le depasse des eta = 0,02, region posterieure en tete de l'importance et region 0 au-dessus de sa part uniforme."
    - "Les figures sont en caracteres. Le carnet Python trace avec matplotlib ; le portage n'installe aucun paquet, donc la figure de la nulle, le profil de puissance et le profil d'importance sont redessines en caracteres depuis les valeurs imprimees, dans le bloc de sortie de leur table. Aucun rendu pixel n'est compare."
    - "Les ancres des descripteurs sont assertees contre la mesure d'antropy 0.1.6 (n = 600, kmax = 18), pas contre les valeurs citees par l'issue de portage : 1,7689 annonce pour une sequence aleatoire (mesure 1,0767), 0,7383 pour un motif de periode 2 (mesure 0,0461 ; 0,738305 est la mesure d'un AR(1) binarise), 1,0000 a 1e-9 pour une rampe (mesure 1,010840) et 1,6481 pour un AR(1) (mesure 1,694298). Les cas deterministes se comparent a 1e-4, les cas stochastiques sous tolerance declaree, le tirage n'etant pas celui de la source."
