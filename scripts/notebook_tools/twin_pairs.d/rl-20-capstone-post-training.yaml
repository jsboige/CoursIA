- name: RL-20 Capstone Post-Training
  family: RL
  python: MyIA.AI.Notebooks/RL/RL-20-Capstone-PostTraining-Python.ipynb
  csharp: MyIA.AI.Notebooks/RL/RL-20-Capstone-PostTraining-CSharp.ipynb
  parity_level: semantic
  bridge_verdict: SOTA-OK
  bridge_verdict_reason: |
    Capstone de lecture : les deux carnets ne ré-entraînent rien. Ils lisent les sorties committées des onze carnets RLPT-* de la sous-série PostTraining (JSON via `json` côté Python, `System.Text.Json` côté C#), extraient les nombres par recherche de libellé (regex Python `re` contre `System.Text.RegularExpressions`), normalisent les accents (`unicodedata.NFD` + filtrage `Mn` contre `String.Normalize(FormD)` + `CharUnicodeInfo.GetUnicodeCategory == NonSpacingMark`), puis calculent les mêmes statistiques (moyenne, écart-type d'échantillon n-1, z combiné, t apparié, part du plafond de Bayes, coût par point de gain). Aucun moteur RL tiers n'est invoqué de part ni d'autre : le contenu pédagogique est la discipline de mesure, pas un modèle.
  known_differences:
    - "Socle commun : les onze carnets sources, les libellés d'ancrage, les quatre comparaisons (z sur une barre contre z sur deux barres, t apparié maison contre TRL, résolution d'un item sur 48, écart-type de récompense contre exactitude), le plafond de Bayes, le seuil analytique du reward hacking, le coût par point de gain, et les trois exercices (z_combine, part_du_plafond + marge_en_points, t_apparie)."
    - "Différences de calcul : Python invoque `re`, `unicodedata`, `json`, `math`, `pathlib` ; C# invoque les équivalents BCL .NET 9. Les deux utilisent la même formule d'écart-type d'échantillon (n-1)."
    - "Différences d'arrondi à mi-chemin : .NET `ToString(\"0.000\")` arrondit half-away-from-zero ; Python `f'{v:.3f}'` arrondit half-even. Le seul point mesuré où les deux divergent est la moyenne d'accuracy RLPT-00d (0.6695 exactement à mi-chemin, arrondi 0.670 côté C# contre 0.669 côté Python) — sans incidence sur les conclusions statistiques."
    - "Sortie committée du Python pour RLPT-00 : le carnet Python affiche `0.657` à la section 3 pour RLPT-00 ; le carnet C# affiche `0.665`. Ce n'est pas une divergence de calcul : la sortie committée du capstone Python date d'avant la ré-exécution de RLPT-00 en #26247 (feat TorchSharp CPU), et la valeur actuellement dans les outputs de RLPT-00 est 0.665. Le capstone C# reflète donc l'état courant des sources, ce qui est sa vocation."
    - "Trois exercices sont stubs compilables côté C# (`double? ZCombine(...)`, `PartDuPlafond`, `MargeEnPoints`, `TApparie`) : retournent `null` avec `// TODO etudiant`, sans révéler la solution. Les attendus affichés sont identiques à ceux du Python."
