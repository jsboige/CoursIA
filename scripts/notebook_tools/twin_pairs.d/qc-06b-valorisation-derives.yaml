- name: "QC-06b Valorisation-Derives"
  family: QuantConnect
  python: MyIA.AI.Notebooks/QuantConnect/Python/QC-Py-06b-Derivatives-Valuation-From-Scratch.ipynb
  csharp: MyIA.AI.Notebooks/QuantConnect/CSharp/QC-06b-Valorisation-Derives-CSharp.ipynb
  parity_level: semantic
  bridge_verdict: SOTA-OK
  bridge_verdict_reason: "La paire est solver-free by design des DEUX cotes : Black-Scholes, arbre binomial CRR et Monte-Carlo sont des moteurs de manuel reconstruits a la main des deux cotes (cote Python : numpy/scipy pour la loi normale et les tirages ; cote C# : System.Math, loi normale implementee depuis le bas par l'approximation d' Abramowitz-Stegun de la fonction d'erreur, tirages par Box-Muller). Aucun solveur externe n'est accessible ni saute : les trois moteurs sont le SUJET du carnet, pas un substitut a un outil SOTA. Parite semantic (meme contenu mathematique, API idiomatique differente : snake_case/numpy/scipy d'un cote, PascalCase/BCL pur de l'autre)."
  known_differences:
    - "2026-11-20 (myia-po-2023:CoursIA-2, #26083) : jumeau C# cree depuis le jumeau Python -- meme contrat (call europeen ATMF S0=100, K=100, T=1 an, r=5 %, sigma=20 %, sans dividende), memes trois moteurs confrontes sur ce contrat, memes verifications (parite put-call au residu machine, convergence oscillante de l'arbre CRR, put americain et prime d'exercice anticipee, verification de Merton, convergence Monte-Carlo en 1/sqrt(M) avec IC 95 %) et memes quatre exercices. Chiffres mesures de reference : call BS 10,450575 ; put BS 5,573518 ; residu de parite -0,0000000 ; CRR N=2000 -> 10,449584 ; put americain N=1600 -> 6,089893 ; MC M=1e6 -> 10,454572 (demi-IC 0,028818)."
    - "Implementation : la loi normale N(x) est implementee cote C# depuis le bas (erf par Abramowitz-Stegun 7.1.26, Φ(x) = ½(1+erf(x/√2))) en BCL pur, zero package NuGet, zero dependance externe ; le cote Python utilise scipy.stats. Les tirages Monte-Carlo passent par Box-Muller des deux cotes (System.Random a graine fixe cote C#, numpy.random a graine fixe cote Python) : le cote C# est deterministe par graine explicite, ce qui permet d'attester les chiffres a l'identite."
    - "Asymetrie de couverture : le jumeau Python compte 36 cellules (5 figures matplotlib : payoff, convergence CRR, convergence MC, comparaisons de couts) et developpe en entier le cas du call asiatique arithmatique avec variable de controle par le payoff geometrique ; le jumeau C# compte 28 cellules, remplace les figures par des tableaux texte (le kernel .net-csharp ne trace pas de figure sans dependance graphique) et s'arrete au paradigme asiatique (section markdown : quand la forme fermee n'existe pas pour la cible, la simulation porte la reference). Les sections 1 a 6 (contrat, Black-Scholes + greeks, arbre CRR, put americain, Monte-Carlo, regime de cout) sont couvertes des deux cotes et portent les memes valeurs mesurees."
    - "Nommage : le cote C# porte le nom commun `QC-06b-Valorisation-Derives-CSharp` (conforme a la nomenclature du couple de #26083) ; le source Python conserve son nom legacy `QC-Py-06b-Derivatives-Valuation-From-Scratch`. Le renommage du source vers `QC-06b-Valorisation-Derives-Python` est une tranche de nomenclature distincte et differee (decision #26083 : ne pas melanger renommage et port dans la meme PR). Les numeros de base extraits des deux basenames sont identiques ('06') : aucune derive de numerotation."
