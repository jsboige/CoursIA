- name: "GameTheory-22 Stochastic Games Shapley"
  family: GameTheory/.NET-Parity
  python: MyIA.AI.Notebooks/GameTheory/GameTheory-22-Jeux-Stochastiques-Shapley-Python.ipynb
  csharp: MyIA.AI.Notebooks/GameTheory/GameTheory-22-Jeux-Stochastiques-Shapley-CSharp.ipynb
  parity_level: semantic
  bridge_verdict: SOTA-OK
  bridge_verdict_reason: "Les deux carnets construisent un petit jeu stochastique à somme nulle et résolvent les matrices 2×2 puis l'opérateur de Bellman from-scratch. Les calculs sont déterministes et CPU, sans moteur externe applicable : NumPy/Matplotlib côté Python, tableaux BCL et SVG inline côté C#. Le jumeau C# préserve les paramètres du modèle (deux états, gamma=0.9, tolérance 1e-9, plafond 20000), le témoin de selle pure, l'expérience de transition contestée et les trois exercices. Le verdict SOTA-OK désigne ce port fidèle d'un contenu analytique, pas l'usage d'un solveur externe. Les valeurs numériques sont des itérations flottantes, non une preuve exacte."
  known_differences:
    - "Python utilise NumPy et Matplotlib; C# utilise les tableaux et collections BCL avec un SVG inline statique à deux panneaux. Les résultats sont comparés sémantiquement sous les mêmes paramètres et seuils, pas par identité des sorties texte ou du rendu."
    - "Les trois exercices C# sont répartis et réordonnés selon la progression : un état, trois états, courbe de gamma. Les stubs restent ouverts ; les gardes contrôlent les G/P/gamma réellement transmis aux callbacks, leurs valeurs retournées, les traces et leur critère d’arrêt. Ces fixtures bornées ne prouvent pas toute implémentation étudiante."
    - "Les deux carnets nomment l'écart entre valeur statique et valeur dynamique et portent la même cellule témoin, qui évalue sur la même partie les deux départages du joueur myope (2 s'il reste, 3,8 s'il saute). Les trois définitions de stubs Python restent sans sortie ; le C# imprime une sortie informative dans chacune de ses onze cellules code et fixe la culture invariante pour des sorties reproductibles."
    - "2026-11-25 (myia-po-2023:CoursIA, portage Rust #27131) : troisième côte ajouté, `GameTheory-22-Jeux-Stochastiques-Shapley-Rust.ipynb`, kernel evcxr (`rust`), crates `ndarray` 0.16 et `plotters` 0.3 (`default-features = false`, features `evcxr` et `line_series`). Même structure de cellules que le jumeau Python (25 cellules, 9 code aux mêmes index), mêmes paramètres (deux états, gamma=0.9, tolérance d'arrêt 1e-9, plafond 20000), même témoin de selle pure et même expérience de transition contestée ; `G` est un `Array3<f64>` (2,2,2) et `P` un `Array4<f64>` (2,2,2,2) construits par affectation, la valeur 2x2 écrit le point selle pur par `max_i min_j` / `min_j max_i` avant la formule mixte, et sous evcxr chaque cellule de code est autonome (elle redéfinit `valeur_statique_mat`, `operateur_bellman` et `valeur_iteration` là où elle les consomme). La figure de la section 4 est un SVG à deux panneaux (convergence de l'itération et barres des écarts) émis en `image/svg+xml` : la forme `plotters::evcxr::evcxr_figure` enveloppe le SVG dans du HTML et ne s'affiche pas dans le rendu GitHub du carnet (#26613), elle n'est pas employée ; sans la feature `ttf`, le SVG ne porte aucun texte, la légende est en markdown sous la figure. L'exécution réelle (papermill, kernel `rust`, 23,2 s) donne 0 erreur sur les 9 cellules de code et les valeurs du jumeau Python : `v_statique = [2.0, 4.0]`, témoin `3.0` / `p = [1, 0]` / `q = [0, 1]`, `V = [3.8, 4.0]` en 189 itérations, `écart = [+1.8, -0.0]`, myopes `W(0) = 2.0` et `3.8`, `Vc = [2.0, 4.0]`. Le triplet Python/C#/Rust est mesuré par le registre de conformité `scripts/notebook_tools/rust_conformance.d/gametheory-22-jeux-stochastiques-shapley.yaml` (17 mesures, 0 divergence) : l'affichage diffère par nature entre les trois côtés (NumPy imprime `[3.8 4. ]`, Rust `[3.8000, 4.0000]`, le C# une liste à virgules ; Rust ajoute des lignes de lecture), le registre compare des grandeurs extraites par motif, pas le texte. Côtés déclarés ABSENTS avec leur motif : le contrôle analytique chiffré `2 + 2*gamma` (le C# écrit une phrase sans nombre) et les trois cellules d'exercice (aucune sortie côté Python ni Rust, stub Rust `#[allow(dead_code)]` rendant `None`), que le C# redistribue en cellules 10/15/17/25 avec des lignes de garde. Le bloc « Vérifiez votre compréhension » garde la forme du jumeau Python (`<details><summary>Réponse</summary>` par question), acceptée par l'organe `check_end_block_answers.py`."
