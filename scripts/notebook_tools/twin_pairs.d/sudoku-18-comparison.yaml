- name: "Sudoku-18 Comparison"
  family: Sudoku
  python: MyIA.AI.Notebooks/Sudoku/Sudoku-18-Comparison-Python.ipynb
  csharp: MyIA.AI.Notebooks/Sudoku/Sudoku-18-Comparison-Csharp.ipynb
  parity_level: native-both
  bridge_verdict: SOTA-OK
  bridge_verdict_reason: "Lib-vs-lib meme moteur Google OR-Tools CP-SAT : Python = `ortools` PyPI package (CP-SAT via `from ortools.sat.python import cp_model`, 21 refs `ortools` runtime). C# = `Google.OrTools` NuGet package (CP-SAT via `Google.OrTools.Sat.CpModel`, 15 refs `ortools` + 5 `Google.OrTools` namespace). Meme solveur CP-SAT upstreams de Google Operations Research, accessible via les bindings officiels Python (.whl) et C# (.nupkg). Verifie firsthand (c.234 audit 2026-08-12, myia-po-2023:CoursIA-2) : 68 cells Python / 68 cells C#, structure symetrique (memes benchmarks, memes configurations, memes hard puzzles). Pont cross-stack impossible : CP-SAT est un moteur C++ natif, les deux bindings sont des wrappers SWIG officiels (cp_model.py = SWIG-generated, Google.OrTools.Sat.CpModel = SWIG-generated). Pas de bytecode Python ↔ C# bridgeable ; la parite est garantie par le fait que les deux utilisent la meme version du meme solveur upstream. Verdict SOTA-OK : OR-Tools CP-SAT est la SOTA CP-SAT solver pour les deux stacks, et la parite semantique est mecaniquement preservee tant que les deux versions PyPI/NuGet restent synchronisees (cf c.217 PR #10557 App-tranche-4 precedent qui a verifie 5 paires A-1/3/4/11/15 sur le meme pattern `ortools` ↔ `Google.OrTools`). parity_level `semantic` coherente : idiomes differents (Python dynamique vs C# statique) mais moteur commun."
  known_differences:
    - "Rebaseline 2026-08-29 (#13045, PR #13069) : DEUX cotes deplaces. Cote Python = RE-EXECUTION reelle (papermill 2.7.0, 2026-08-29T10:51:00Z -> 10:55:06Z, 246,1 s, exception None, 25 cellules code, 0 execution_count nul, 0 erreur) apres reecriture du benchmark en protocole a mediane censuree ; les sorties committees sont celles de ce run. Cote C# = restauration d'une idee pedagogique (difficulte humaine vs difficulte algorithmique) perdue par la reecriture, plus la conversion de 3 separateurs decoratifs par le hook fix-hr-separator. Les DEUX cotes ont en outre recu la renumerotation zero-pad de #13357 (liens de navigation, cellules 1 et 4, reprise telle quelle depuis main). Parite structurelle inchangee (68 cellules par cote). Attestations = nouveaux blob SHAs des deux cotes."
    - "Rebaseline 2026-08-14 : DEUX cotes deplaces par drain wallclock #9434 / PR #10874 (remplacement des timings machine-dependants en ms par des ordres de grandeur dans 2 cellules markdown par cote). Parite semantique inchangee (cellules code byte-identiques, aucune sortie, aucun exec_count touche). Attestations = nouveaux blob SHAs des deux cotes."
    - "Rebaseline 2026-08-05 : cote Python deplace par de-hardcodage de la version numpy depuis le markdown (classe ENV #9434, edition markdown-only). Parite semantique inchangee (aucune cellule code, aucune sortie, aucun exec_count touche) ; cote C# non modifie. Attestation = nouveau blob SHA du cote Python."
    - "Socle pedagogique commun : comparaison synthese de TOUS les solveurs de la serie Sudoku (backtracking, dancing links, genetic, OR-Tools, Z3, BDD, probabiliste), meme concept (tableau de benchmark croise : temps de resolution / robustesse / complexite), meme arc conclusif (Fin de serie)."
    - "Parite structurelle forte : Python et C# ont exactement la meme structure (25 cellules code / 43 markdown chacun), memes en-tetes de navigation ('Fin de serie'), memes solveurs compares. Les deux cotes instrumentent les memes familles de solveurs."
    - "Idiomes framework : chaque cote invoque les solveurs disponibles dans son ecosysteme (Python = ortools/z3/numpy/stdlib ; C# = Infer.NET/Choco/Z3/BDD/stdlib). La comparaison croisee est le livrable pedagogique commun."
