  bridge_verdict_reason: "Resolved 2026-08-12 (myia-po-2023:CoursIA, tranche 2). Le C# desormais branche Google.OR-Tools CP-SAT (#r nuget:Google.OrTools), le moteur SOTA de son ecosysteme. Le verdict RECOVERABLE-LOCAL pose par #10588 (ecart = NuGet first-class manquant) est clot : le port est livre. Le solveur from-scratch (section 4) reste pour enseigner la mecanique ; la tranche 2 (section 4bis) demontre la deduction par propagation UNSAT + la contrainte globale total-mines (Exercice 1), deux capacites que le backtracking manuel n'a pas. parity_level passe semantic -> native-both : chaque twin fait maintenant le travail au moyen d'un moteur de production externe (C# : OR-Tools CP-SAT ; Python : python-constraint), au sens de l'arbitrage #11200 Option A (parite de moteur, pas de meme moteur)."
  known_differences:
    - "Socle pedagogique commun : Demineur (CSP : contraintes sommes exactes, library python-constraint) comme application canonique. Les deux twins couvrent le meme socle theorique (formulation variables/domaines/contraintes, resolution, experimentation) avec parite semantique sur les concepts cibles."
    - "Idiomes framework : Python = library python-constraint (ExactSum) + matplotlib ; C# = from-scratch en BCL pure (System.*, section 4) + bridge OR-Tools CP-SAT (NuGet Google.OrTools, section 4bis ajoute 2026-08-12)."
    - "Asymetrie pedagogique : Python met l'accent sur la library specialisee python-constraint + visualisation matplotlib + experimentation comparative ; le C# demontre l'implementation from-scratch en BCL pure (section 4, pour la mecanique de recherche) PUIS branche le solveur SOTA OR-Tools CP-SAT (section 4bis, pour la propagation + contrainte globale). Meme socle theorique, le C# couvre desormais les deux niveaux (manuel puis moteur)."
    - "Tranche 2 OR-Tools (section 4bis, 2026-08-12) : le C# ajoute le bridge Google.ORTools CP-SAT sur le meme modele CSP. Deux demos : (1) deduction par tests UNSAT (O(k) resolutions tronquees par propagation CDCL vs O(2^k) enumeration), confirme les 0 cellules forcees du from-scratch par voie independante ; (2) contrainte globale total-mines (Exercice 1 TODO), native pour CP-SAT, hors-portee du from-scratch. CP-SAT n'enumerant pas toutes les solutions par defaut, les probabilites restent calculees par le from-scratch (section 4, enumeration bornee a frontiere<=22)."
    - "Pont CP-SAT cote Python (2026-11-25, PR de qualification #27070) : le Python recoit a son tour un CP-SAT (section 4bis, cellules 23 a 33), et sa fonction n'est pas la meme que celle du C#. Cote C#, CP-SAT sert la deduction UNSAT et la contrainte globale, la ou le from-scratch ne peut pas suivre. Cote Python, python-constraint resout deja correctement ; le pont mesure donc le COUT des deux voies sur frontiere reelle, avec temoin positif d'accord (meme ensemble force) et temoin negatif (branche inconsistante : INFEASIBLE contre liste vide). Mesure publiee telle quelle : sur les frontieres du demineur l'enumeration l'emporte (1,7 ms contre 184,6 ms en 8x8 ; 3,3 ms contre 270,0 ms en 16x16), le croisement n'apparaissant qu'au-dela de quelques milliers de solutions. Asymetrie intentionnelle : le C# demontre une capacite que le from-scratch n'a pas, le Python mesure deux organes egalement capables. Le twin C# n'est pas touche."
