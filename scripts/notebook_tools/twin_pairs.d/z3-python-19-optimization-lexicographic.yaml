- name: "Z3-Python-19 Optimization Lexicographic"
  family: SMT/Z3-API
  python: MyIA.AI.Notebooks/SymbolicAI/SMT/Z3-API/Z3-19-Optimization-Lexicographic-Python.ipynb
  csharp: MyIA.AI.Notebooks/SymbolicAI/SMT/Z3-API/Z3-19-Optimization-Lexicographic-CSharp.ipynb
  parity_level: native-both
  bridge_verdict: SOTA-OK
  bridge_verdict_reason: "Multi-objectif Z3 branche NATIVEMENT des deux cotes : Microsoft.Z3 .NET (ctx.MkOptimize, MkMaximize/MkMinimize pour la priorite lexicographique par ordre de declaration, enumeration du front par contrainte d'exclusion MkOr/MkNot, MkReal pour les poids rationnels) et pyz3 (Optimize, maximize/minimize, Or des x_p != m[x_p]) sont les deux bindings officiels du meme coeur C++ Z3 -- pas un pont intermediaire. Aucune asymetrie de machinerie a corriger."
  known_differences:
    - "Python : pyz3 (Optimize, maximize/minimize, enumeration Pareto par exclusion, float alpha dans l'objectif). C# : Microsoft.Z3 .NET (ctx.MkOptimize, MkMaximize/MkMinimize, MkAdd au lieu de Sum, alphas portes en rationnels exacts (Num, Den) via ctx.MkReal -- 1.3 encode 13/10, decision iso du Python)."
    - "Identite par index dans le calcul des seuils d'alpha : un ValueTuple contenant un tableau ne supporte pas l'egalite de valeur en C#, le `t is s` du Python devient un saut i == j."
    - "Formatage : Python '.4g' rend 'inf' ; C# 'G4' rend 'Infinity' -- helper G4() mappe vers 'inf'. La selection lex s'affiche [\"B\", \"C\"] (C#) vs ['B', 'C'] (Python)."
    - "2026-11-21 (myia-po-2023:CoursIA) creation de la paire avec le jumeau C# (fiche Z3-19, #26081 fournée 1) : verdicts mesurés identiques (lex B+C impact 18 cout 12 ; 7 solutions énumérées dont 6 Pareto-optimales ; sweep alpha identique ligne a ligne ; seuils [1.6, inf] / [1.5, 1.6] / [1.333, 1.5] / [0, 1.333]). --update en DERNIERE opération (cf #8957)."
