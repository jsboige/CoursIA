  known_differences:
    - '2026-08-31 : ATTESTATION UNILATERALE (PR #13659, lane myia-ai-01:CoursIA) -- reparation d''echappements JSON manges dans le markdown du cote C#. CAUSE : dans le .ipynb, la sequence dollar-\bot-dollar ecrite avec UN SEUL antislash est lue par le parseur JSON comme l''echappement \b (backspace, U+0008) ; la source chargee porte un caractere de controle et le notebook rend un dollar-ot-dollar prive de sa commande LaTeX. FIX : doubler l''antislash (\\bot). Le DRIFT est UNILATERAL parce que le DEFAUT l''est : la contrepartie Search-4-LocalSearch.ipynb (Python), 39 cellules markdown, a ete scannee sous controle positif (le litteral defectueux passe a json.loads doit rendre U+0008 -- assertion verifiee avant le scan) et ne porte AUCUN caractere de controle U+0008/U+000B/U+000C. Il n''y a donc rien a reparer de ce cote : l''attestation ne consacre aucune asymetrie de contenu. PORTEE DU DIFF cote repare (comparaison des JSON parses origin/main -> HEAD) : markdown uniquement, 0 cellule code touchee, 0 sortie modifiee, 0 execution_count deplace, 0 cellule ajoutee ou retiree.'
    - "Socle pedagogique commun : metaheuristiques de recherche locale — Hill Climbing (variations steepest/first-improvement + diagnosis plateau/ridge), Simulated Annealing (schema de refroidissement, critere de Metropolis), Tabu Search (liste tabou, memoire a court terme). Comparaison empirique sur N-Reines. Les deux twins implementent les 3 algorithmes from-scratch (parite algorithmique, pas seulement narratif)."
    - "Citations canoniques presentes des deux cotes (audit #8081 po-2023 c.909) : Kirkpatrick/Gelatt/Vecchi 1983 (Simulated Annealing, Science), Glover 1986/1989 (Tabu Search), Russell & Norvig AIMA (cadre local search)."
    - "Idiomes framework : Python = stdlib + numpy/matplotlib (viz des paysages de fitness, courbes de convergence par temperature, 11 imports, 62 cellules avec demos riches N-Reines). C# = pur System.* (System / System.Collections.Generic / System.Linq), 0 NuGet, 2 using, 28 cellules (implementation minimale from-scratch, presentation tabulaire)."
    - "Asymetrie pedagogique : Python exploite matplotlib pour la visualisation des paysages de fitness et courbes de refroidissement + section comparative N-Reines approfondie ; le C# travaille en BCL pure sans viz (tableaux + asci), implementation plus compacte. Meme socle theorique (3 metaheuristiques classiques + citations), leviers de demonstration differents."
    - "Interpretation du paradoxe du programme logarithmique (c.49, po-2025:CoursIA-2) : le C# possede une cellule d'interpretation dediee au paradoxe theorie-vs-pratique (logarithmique 'theoriquement optimal' Hajek 1988 mais empiriquement le pire a budget fixe 2000 iters). Le Python possede une interpretation DIFFERENTE du meme sujet (cell 22 : tableau comparatif Lineaire/Exponentiel/Logarithmique avantages/inconvenients, sans le paradoxe asymptotique-vs-budget). Parite semantique tenue : les deux jumeaux interpreten le choix du cooling schedule, sous des angles complementaires (C# = paradoxe budget ; Python = tableau comparatif). Rebaseline markdown-only legitime, pas de strip outille."
    - "2026-08-20 (c.1301+261, myia-po-2025:CoursIA-2) : flip verdict RECOVERABLE-LOCAL -> SOTA-OK (bucket 3 de #10382). Faux positif : la raison listait explicitement 'Pas de lib SOTA-tier pour local search en Python pur (simanneal est un jouet non-maintained)' puis maintenait RECOVERABLE-LOCAL. Verifie firsthand : Python stdlib only (random + math + copy.deepcopy + numpy helper), C# BCL pure System.Random.Shared .NET 9. Aucune lib SOTA partage (AIMA ch.4 = reference pedagogique from-scratch). Les DEUX cotes portent les memes metaheuristiques (Hill-Climbing / Simulated Annealing / Local Beam Search) en from-scratch pedagogique -- le from-scratch EST la contrepartie (bucket 3)."
