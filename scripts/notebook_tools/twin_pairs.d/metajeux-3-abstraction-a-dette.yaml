  csharp: MyIA.AI.Notebooks/GameTheory/Metajeux/Metajeux-03-Abstraction-a-Dette-CSharp.ipynb
  parity_level: semantic
  bridge_verdict: SOTA-OK
  bridge_verdict_reason: "Paire from-scratch des deux cotes sur le meme contenu mathematique (abstraction, resolution exacte par enumeration de supports, dette retransportee sur les blocs de duels) : 0 NuGet, 0 lib, meme plan de 24 cellules. Route BCL SEULE cote C#, conformement au cahier des charges de l'issue #28655 (parent #26070) : « BCL seulement ; aucun NuGet, reseau, Lean, solveur ni acces au compendium prive » et « AUCUN processus externe dans le jumeau -- ce que la source delegue est refait en BCL, ou cite comme donnee ». Le carnet C# ne lance donc aucun compilateur, aucun solveur, aucun processus : il n'importe rien du module Lean `game_theory_lean/Abstraction`. Les fonctions que le carnet consomme dans le module (`gain`, `vHaut`, `vBas`, `dette`, `sommeBloc`, `detteBloc`) sont REIMPLEMENTEES en BCL (classe `Mj03Abstraction`, traduction litterale des entiers du module) et la classe `Mj03Format` en assure les assertions. La sortie du compilateur Lean produite par le jumeau Python est reprise comme DONNEE CITEE (theorem `raffinement_aggrave_la_dette`, `depends on axioms: [propext]`, valeurs 3 / 4 / 0) ; elle est explicitement etiquettee « citee » dans la cellule et n'est jamais presentee comme recalculee. Les trois valeurs citees sont confrontees au rejeu BCL avec une tolerance declaree de 0 (entiers) : la cellule echoue si un ecart apparait. Ce qui est verifie cote C# est donc l'arithmetique de la dette (rejeu independant) ; ce qui reste cite est l'elaboration par le noyau Lean (par le jumeau Python)."

  known_differences:
    - "Le noyau Lean n'est PAS branche cote C# (exigence explicite de l'issue #28655) : la sortie du compilateur est reprise comme donnee citee, et la certitude formelle (axiomes, absence de sorry, absence de native_decide) porte sur le jumeau Python. Cote C#, la certitude est arithmetique : rejeu BCL des fonctions du module, valeurs confrontees aux valeurs citees avec tolerance 0."
    - "Les 24 gains des 6 duels sont des DONNEES CITEES cote C# (le MT19937 de Python n'est pas reconstructible en BCL) : affichees et etiquetees comme citees, jamais presentees comme recalculees ; leurs invariants (portee, comptage, unicite des duels) sont verifies. Tout le reste du carnet -- abstraction, resolution exacte, retransport, courbe de dette -- est RECALCULE en BCL."
    - "Cote C#, la cellule d'exemple guide 4 ajoute un DEUXIEME chemin : les valeurs citees (3, 4, 0) sont confrontees au rejeu BCL des memes fonctions, ecarts affiches (Q 0, P 0, D 0). La lecture du resultat et les assertions du carnet C# sont donc plus denses que celles du jumeau Python, sans diverger sur les valeurs."
    - "Sorties de cellules francisees cote C# (accents ajoutes) vs sorties ASCII de la source ; parite numerique verifiee valeur par valeur (v(G) = -4,214285714285714 ; BR_1 = -2,8181818181818183 ; BR_2 = 4,7272727272727275 ; exploitabilite = 1,9090909090909092 ; courbe 6 / 4 / 3 / 2 = 0 / 1,9090909090909092 / 1,9090909090909092 / 6,4210909090909091 ; contributions 0,4545 x2, 0,0000 x2, 0,5000 x2)."
    - "Stubs d'exercices (cellules 5 / 10 / 14 / 19) : meme motif que la source (`Console.WriteLine(\"Exercice a completer : ...\")` + resultat a null, sans reveler la solution) ; l'exercice 4 est formule en termes BCL (la dette se lit dans la reimplementation des fonctions du module), sans temoin Lean cote C#."
