- name: "Sudoku-09 GraphColoring"
  family: Sudoku
  python: MyIA.AI.Notebooks/Sudoku/Sudoku-09-GraphColoring-Python.ipynb
  csharp: MyIA.AI.Notebooks/Sudoku/Sudoku-09-GraphColoring-Csharp.ipynb
  parity_level: native-both
  bridge_verdict: SOTA-OK
  bridge_verdict_reason: "Lib-vs-lib idiomatic-stack : Python = networkx (SOTA Python graph library, `nx.sudoku_graph()` construit le graphe de contraintes 81 sommets / 810 aretes, `nx.connected_components` verifie la connexite, coloration via hand-written backtracking/MRV/DSATUR au-dessus). C# = QuikGraph 2.5.0 (SOTA .NET graph library, `UndirectedGraph<int, Edge<int>>` + `ConnectedComponentsAlgorithm` -- equivalent .NET de networkx documente en tranche 2 c.211 #10412). Les deux jumeaux utilisent la SOTA graph library de leur stack respective. Pont cross-stack impossible : networkx est pur Python (CPython C-extension), QuikGraph est pur .NET ; aucun bytecode commun bridgeable (pas d'IKVM/JPype path). Pas de \"vrai\" solveur SOTA a brancher -- la coloration est hand-written des deux cotes (networkx ne resout pas la coloration, QuikGraph non plus). Verdict SOTA-OK : chaque jumeau utilise la SOTA lib de son ecosystme, asymetrie d'ecosysteme pas d'engine-mismatch. parity_level `native-both` confirmee par ai-01 #10412 (QuikGraph proprement reference, algorithme ConnectedComponents invoque)."
  known_differences:
    - "2026-09-02 (PR #14266, myia-po-2027:CoursIA) : normalisation nbformat du champ source string->liste (tranche Sudoku de #14209) -- forme seule, jumeau C# seul (Python non touche). Contenu rejoint byte-identique (digest sha1 par cellule, 0 divergence), outputs/execution_count/nb de cellules inchanges, pas de re-exec (C.3). Les blob SHAs et content SHAs deplaces dans l audit ci-dessus sont des artefacts de forme (le content_sha hashe la structure JSON des cellules, forme du champ source incluse), pas une divergence pedagogique."
    - "Rebaseline 2026-08-14 : cote C# deplace par drain wallclock #9434 / PR #10874 (remplacement des timings machine-dependants en ms par des ordres de grandeur dans le markdown). Parite semantique inchangee (cellules code byte-identiques, aucune sortie, aucun exec_count touche) ; cote Python non modifie. Attestation = nouveau blob SHA du cote C#."
    - "Socle pedagogique commun : reformulation du Sudoku comme un probleme de coloration de graphe (une cellule = un noeud, le graphe de contraintes Sudoku, coloration propre a 9 couleurs), meme concept mathematique (graphe de conflits, coloration propre), meme cas d'application."
    - "Idiomes framework : Python = networkx (construction du graphe via nx.sudoku_graph(), 81 sommets / 810 aretes) ; la coloration (backtracking / MRV / DSATUR) est hand-written au-dessus. C# = stdlib System.* (construction + solveur from-scratch, tranche 1). [Corrige 2026-08-11 : une mention anterieure a OR-Tools CP-SAT etait inexacte -- le jumeau Python n'importe ni ortools ni cp_model, seul networkx est present.]"
    - "Tranche 2 (2026-08-11, po-2023) : le C# delegue desormais la structure du graphe de contraintes a QuikGraph 2.5.0 (UndirectedGraph<int,Edge<int>>) -- equivalent .NET de networkx. Algorithme QuikGraph reel invoque : composantes connexes (ConnectedComponentsAlgorithm -> 1 composante, graphe connexe). La coloration reste hand-written des deux cotes (networkx non plus ne resout pas la coloration). Verdict SOTA SOTA-OK (QuikGraph proprement reference, graphe construit, algorithme invoque). parity_level semantic -> native-both."
    - "Parite structurelle proche : Python 11 cellules code / 18 markdown ; C# 14 cellules code / 22 markdown."
    - "Re-attestation 2026-08-11 (ai-01, #10412) : le blob SHA C# a bouge sous strip_probe_banner.py --apply (9 lignes probeAddresses injectees par le kernel .NET dans la cellule de restore #r nuget -- enumeration NetworkInterface du runner). Strip verifie firsthand : 9 lignes retirees, 9 lignes vides, aucune insertion ; la parite semantique est inchangee. --update relance EN DERNIER, apres le strip (cf #8957 : attester puis stripper invalide l'attestation)."
