# Registre de parite des jumeaux Python/C# (#8057, parent #4208).
#
# Chaque entree decrit une paire de notebooks jumeaux : le chemin des deux
# cotes, le niveau de parite, l'enregistrement d'audit (date + auteur + git blob
# SHA de chaque notebook au moment de l'audit) et les differences connues documentees.
#
# L'enregistrement d'audit a deux formes (#9399 volet a) :
#   - `last_audit:` singleton (forme legacy, historique) ;
#   - `audits:` liste append-only (forme cible) : chaque audit ajoute une entree
#     distincte, rien n'ecrase plus rien. Le singleton etait un aimant a collision
#     sous lanes paralleles (#9171 cle dupliquee, #9237/#9245 CONFLICT, ecrasement
#     silencieux du plus recent). Le reader lit le dernier enregistrement
#     (`audits[-1]` ou `last_audit`). La migration legacy -> audits: est paresseuse
#     (a la volee, sur le 1er drift reel) -- pas de reecriture massive.
#
# Depuis #9399 volet (c), chaque enregistrement porte en plus
# `content_python_sha` / `content_csharp_sha` (SHA-256 du notebook SANS
# `nb["metadata"]` -- cost, papermill, kernelspec, language_info). Le verdict
# DRIFT preferere ces content_sha (metadata-immunes) quand l'audit les enregistre
# et retombe sur les git blob SHA (`python_sha`/`csharp_sha`) pour les paires
# legacy. Un tampon `metadata.cost` seul ne fait plus rougir le gate ni declencher
# de faux audit au --update ; les vrais changements (prose, re-exec) derives
# toujours. Les content_sha sont ajoutés A COTE des blob SHA (anti-regression :
# ces derniers restent enregistres pour inspection humaine).
#
# Le check `check_twin_parity.py` compare le SHA courant (git ls-tree HEAD) au
# SHA audite : DRIFT = un cote a evolue sans re-audit -> parite a reverifier.
# Apres une audit firsthand, rebaseline UNE paire avec :
#   python scripts/notebook_tools/check_twin_parity.py --update \
#       --pair "<nom exact de l'entree>" --by "<machine:workspace>"
# `--update` refuse de tourner sans selecteur (--pair / --family / --yes-all-pairs) :
# sans lui il rebaselinerait les 116 paires d'un coup et masquerait des DRIFTs
# legitimes (#8508). L'ecriture est chirurgicale : seul le bloc d'audit de la
# paire ciblee change (les autres cles top-level et les commentaires sont
# preserves, #8570) ; depuis #9399 un rebaseline d'une paire legacy qui drift la
# migre vers `audits:` en preservant l'ancien enregistrement (item[0]).
#
# parity_level :
#   surface     = meme plan/sections, implimentations independantes
#   semantic    = meme contenu mathematique/conceptuel, API idiomatique differente
#   native-both = CHAQUE cote fait le travail du notebook au moyen d'un moteur
#                 de production/reference externe (package, solveur, service).
#                 Test : pour chaque cote, NOMMER le moteur et le point d'entree
#                 qui produit le resultat. Un cote qui reimplemente le sujet du
#                 notebook a la main n'est PAS natif — meme si sa sortie est
#                 identique, meme si ses cellules se correspondent une a une.
#                 native-both ne dit RIEN de la correspondance structurelle
#                 cellule-par-cellule.
#
# bridge_verdict (OPTIONNEL, #10439) : CORRELE a parity_level, a sens unique
# (croisement des 157 entrees, 2026-08-16, arbitrage #11200) :
#   native-both  => SOTA-OK (36/37)
#   SOTA-OK     =/> native-both (82 contre-exemples sous semantic/surface)
# La raison est dans l'enumeration ci-dessous : SOTA-OK couvre explicitement
# « solver-free by design des deux cotes ». Les deux champs repondent a deux
# questions differentes — bridge_verdict juge LE TRAVAIL (a-t-on saute un
# moteur atteignable ?), parity_level decrit L'ETAT LIVRE (les deux cotes
# tournent-ils sur un moteur ?). Decrit si un
# moteur SOTA est branchable/branche du cote .NET, pour qu'un verdict INTRINSIC
# deja rendu en prose (dans known_differences) cesse d'etre invisible aux
# detecteurs et de re-signaler la paire comme "ecart de parite" a chaque scan.
# Enumeration = les 5 verdicts de .claude/rules/sota-not-workaround.md :
#   SOTA-OK              = le vrai outil SOTA est proprement branche (ou la paire
#                          est solver-free by design des deux cotes, aucune
#                          asymetrie de machinerie a corriger)
#   RECOVERABLE-LOCAL    = outil installable/invoquable sur la machine du worker
#   RECOVERABLE-MACHINE  = reachle sur une machine specifique (GenAI/GPU/Lean/...)
#   RECOVERABLE-USER-HAND = action user one-time requise (token, OAuth, hardware)
#   INTRINSIC            = aucun chemin SOTA reel (lib non-bridgeable, limite prouvee)
# Quand bridge_verdict: INTRINSIC, bridge_verdict_reason: est OBLIGATOIRE (le
# verdict sans le raisonnement ne vaut rien ; la prose detaillee reste dans
# known_differences, le reason est un resume court). La plupart des paires ne
# portent PAS bridge_verdict (non-rompu = actionnable, candidat a un pont).
# `check_twin_parity.py --summary-by-verdict` compte les paires par verdict et
# soustrait INTRINSIC + SOTA-OK du denominateur "actionnable" sans intervention
# manuelle. Validation fail-loud : une valeur hors enum fait sortir le check en
# code 2 (jamais ignoree silencieusement).
#
# PILOTE (po-2024, 2026-07-23) : famille SMT/Z3-API (6 paires, NB-01..06).
# Familles suivantes peuplees dans des PRs ulterieurs : Search/Part1-Part2 (c.802/#8079, 7 paires)
# + ML.NET/Python (c.803, 8 paires ; ML-6 ONNX exclu = format d'echange, SKIP per #4956 CLOSED)
# + Probas/Infer.NET-PyMC (c.812, 11 paires ; C# Infer.NET EP/VMP compile vs Python PyMC NUTS/HMC + ADVI)
# + GameTheory/.NET-Parity (c.804, 3 paires) + SemanticWeb/dotNetRDF-rdflib (c.809, 11 paires)
# + Search/Part3-Advanced (c.833, 3 paires) + Tweety/IKVM-JPype (c.810, 11 paires) + SymbolicAI/Planners (c.836, 9 paires).
#   Consolidation c.867/#8264 (po-2024, 2026-07-25) : ces 5 dernieres familles (37 paires) etaient
#   initialement 5 tranches PR serial-conflictuelles (#8124/#8165/#8169/#8172/#8192, toutes editant
#   ce fichier -> au plus 1 pouvait merger). Fold en une seule PR rebaselinee sur le format post-#8372,
#   SHA courant recalcule par `git ls-tree HEAD` (requis par le gate CI --per-pair). Voir #8057.


