- name: "Sudoku-10 ORTools"
  family: Sudoku
  python: MyIA.AI.Notebooks/Sudoku/Sudoku-10-ORTools-Python.ipynb
  csharp: MyIA.AI.Notebooks/Sudoku/Sudoku-10-ORTools-CSharp.ipynb
  parity_level: native-both
  bridge_verdict: SOTA-OK
  bridge_verdict_reason: "Lib-vs-lib meme moteur Google OR-Tools (3 sous-modules : ConstraintSolver routing, LinearSolver LP, Sat CP-SAT) : Python = `ortools` PyPI package (`from ortools.sat.python import cp_model`, `from ortools.linear_solver import pywraplp`, `from ortools.constraint_solver import pywrapcp`). C# = `Google.OrTools.{Sat,LinearSolver,ConstraintSolver}` NuGet packages (bindings SWIG officiels). Meme solveur C++ natif upstreams de Google Operations Research, accessible via les bindings Python (.whl) et C# (.nupkg). Verifie firsthand (c.235 audit 2026-08-12, myia-po-2023:CoursIA-2) : Python 30 cells / C# 35 cells, structure pedagogique symetrique (memes configurations de puzzles, memes benchmarks CP-SAT, memes options solver). Pont cross-stack impossible : bindings SWIG non bridgeables (meme pattern que Sudoku-18 precedent c.234). Parite semantique mecaniquement preservee tant que les versions PyPI/NuGet restent synchronisees. Verdict SOTA-OK : OR-Tools est la SOTA OR solver pour les deux stacks."
  known_differences:
    - "Socle pedagogique commun : resolution du Sudoku par programmation par contraintes avec OR-Tools CP-SAT (Google.OrTools), meme solveur sous-jacent, meme modelisation (variables IntVar par case, contraintes AllDifferent sur lignes/colonnes/blocs, objectif de satisfaction)."
    - "Idiomes framework symetriques : Python = `from ortools.sat.python import cp_model` (binding Python natif), C# = NuGet `#r \"nuget: Google.OrTools\"` + `using IntVar / SimpleCPSolver / SimpleConstraint` (binding .NET). Les deux cotes deleguent au meme moteur CP-SAT de Google, seules les API de binding different."
    - "Parite structurelle proche : Python 13 cellules code / 17 markdown ; C# 14 cellules code / 21 markdown. Arc pedagogique identique (formulation CP-SAT -> exemple resolu -> benchmark de passage a l'echelle)."
    - "2026-10-11 (grain REPAIR/MED notebook-python #20356, myia-po-2027:CoursIA-2) : normalisation C.1 du stub d'exercice booleen cote Python -- `return False  # TODO` devient `return None  # TODO`. Le jumeau C# n'est PAS touche : sa convention de stub est `return null; // TODO` partout ou le type le permet (Dictionary, objets), et `return false;` / `return 0;` la ou le type l'interdit -- bool et int ne sont pas nullables en C#. C'est une contrainte de langage, pas une divergence pedagogique : la serie C# entiere porte ces litteraux (Sudoku-09 cell27, Sudoku-12 cell37/41, Sudoku-18 cell23, entre autres). Les DEUX cotes restent des exercices NON IMPLEMENTES ; seul le litteral de retour a change cote Python, d'un resultat fabrique vers une absence explicite. Le blob SHA Python deplace dans l'audit ci-dessus est l'artefact de cette normalisation, pas une derive de l'algorithme enseigne."
