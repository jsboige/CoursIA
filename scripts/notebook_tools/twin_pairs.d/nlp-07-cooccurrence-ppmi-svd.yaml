  csharp: MyIA.AI.Notebooks/NLP/07-Vecteurs-de-Mots-Coocc-PPMI-SVD-CSharp.ipynb
  parity_level: semantic
  bridge_verdict: SOTA-OK
  bridge_verdict_reason: "Les deux notebooks enseignent le comptage de cooccurrences et le PPMI depuis zéro puis effectuent une véritable SVD via NumPy (Python) et MathNet.Numerics 5.0.0 (C#). Le calcul pédagogique est solver-free by design, tandis que l'étape de factorisation utilise le moteur matriciel natif de chaque écosystème ; aucun pont interlangage n'est nécessaire."
  known_differences:
    - "Socle commun : corpus construit de 13 phrases, vocabulaire trié de 41 mots, fenêtre symétrique ±3 sans position centrale, PPMI et réduction de rang k=2 après centrage par ligne."
