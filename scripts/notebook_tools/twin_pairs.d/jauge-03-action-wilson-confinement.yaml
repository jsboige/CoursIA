- name: "Jauge-03 Action Wilson Confinement"
  family: Physique/Jauge
  python: MyIA.AI.Notebooks/Physique/Jauge/Jauge-03-Action-Wilson-Confinement-Python.ipynb
  csharp: MyIA.AI.Notebooks/Physique/Jauge/Jauge-03-Action-Wilson-Confinement-CSharp.ipynb
  parity_level: semantic
  bridge_verdict: SOTA-OK
  bridge_verdict_reason: |
    Le jumeau C# refait le meme parcours avec la seule bibliotheque standard : liens SU(2) et phases U(1) en double (System.Numerics.Complex), action de Wilson et agrafes, Metropolis, fonctions de Bessel I0 et I1 par leur serie entiere, K_nu par quadrature de Gauss-Legendre a 40 noeuds par panneau, pente par moindres carres, anneau Z[q, q^-1] sur BigInteger pour la R-matrice. Le carnet Python s'appuie sur numpy, sympy et mpmath ; aucune de ces bibliotheques n'est remplacee par une sortie de repli : chaque identite et chaque verdict est recalcule, en arithmetique exacte la ou le carnet Python l'etablissait symboliquement. Meme verdict, instruments differents.
  known_differences:
    - "Generateur aleatoire : le carnet Python seme PCG64 (numpy) et tire les quaternions par rng.normal ; le jumeau seme System.Random et tire ses gaussiennes par Box-Muller. Meme valeur de graine, memes reseaux, memes couplages, memes balayages. Tension 1.2499 (Python) contre 1.2514 (C#), ecarts 0.20 % et 0.33 % pour un seuil de 5 % ; pente -0.808 contre -0.805, prediction -0.807 ; chi(1,1) 1.2214 / 0.2867 (Python) contre 1.2236 / 0.2848 (C#), rapports 4.26 et 4.30. Les seuils et les verdicts sont les memes."
    - "Taux d'acceptation : le carnet Python compte chaque passe de parite (N sites) au denominateur et n'ajoute que les propositions acceptees au numerateur, ce qui affiche un taux deux fois trop petit (0.44, 0.40, 0.29). Le jumeau compte les propositions (0.88, 0.80, 0.58). La correction du carnet Python fait l'objet d'une PR separee."
    - "Precision de la section 8 : le carnet Python mene les deux voies avec mpmath a 40 chiffres et trouve un ecart de l'ordre de 1e-41 ; le jumeau, en double, trouve 4.74e-12. La combinaison du test de non-liberte est de l'ordre de 1e-24 dans les deux carnets."
    - "Six combinaisons echantillonnees de la section 8 : meme distribution et meme numero de graine, generateur different."
    - "Section 3 : le residu |Delta S_W| vaut 5.684e-14 (un ULP) dans le carnet Python et 0 sur le tirage du jumeau ; la cellule de code du jumeau mesure ce zero (309 des 486 angles de plaquette changes, ecarts par terme d'au plus 3.3e-15) et le controle sur 400 tirages (210 zeros exacts, 368 ecarts d'au plus un ULP, maximum 3 ULP). Ce bloc de diagnostic n'existe pas dans le carnet Python."
    - "Exercices : les quatre exercices sont des stubs qui renvoient null ou affichent un message, sans erreur volontaire ; le carnet s'execute de bout en bout."
    - "Assertions executables (2026-11-25) : trente-sept assertions Exige doublent les verdicts des sections 1 a 9 et font lever l'execution si l'une echoue ; le carnet Python affiche ses booleens. La section 7 du jumeau definit en outre l'inverse par la relation de Hecke et controle R . R^-1 = I, la trace et le determinant, la ou le carnet Python inverse la matrice symboliquement et lit les valeurs propres."
    - "Section 5 : le seuil pre-enregistre de 5 % ne separe pas le temoin -ln(beta/2) = 1.2040 de la loi exacte (3.94 % de la mesure) ; le jumeau l'ecrit et ecarte le temoin en barres d'erreur (loi exacte a 0.9 barre, temoin a 10.0). Le carnet Python affirme que la loi exacte discrimine la ou le temoin echouerait : correction a porter cote source."
    - "Attestation de parite (derniere cellule de code du jumeau) : douze grandeurs comparees aux sorties du carnet Python, tolerance de quatre ecarts-types de la difference pour les grandeurs stochastiques -- avec des barres d'erreur ajoutees au chi(1,1) en 4D, que la source n'imprime pas -- et une demi-unite du dernier chiffre commun pour les grandeurs deterministes. Douze accords, et les identites de la section 7 reprises en bloc."
    - "2026-11-24 (myia-po-2024:CoursIA, #28082) : naissance du jumeau. --update en DERNIERE operation (cf #8957)."