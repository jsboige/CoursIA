- name: "SW-11 Knowledge-Graphs"
  family: SemanticWeb/dotNetRDF-rdflib
  python: MyIA.AI.Notebooks/SymbolicAI/SemanticWeb/SW-11-Python-KnowledgeGraphs.ipynb
  csharp: MyIA.AI.Notebooks/SymbolicAI/SemanticWeb/SW-11-CSharp-KnowledgeGraphs.ipynb
  parity_level: native-both
  bridge_verdict: SOTA-OK
  bridge_verdict_reason: "Modele nominal lib-vs-lib (#10382, comme PyMC/Infer.NET) : C# = dotNetRDF 3.2.1 (NuGet officiel `#r \"nuget: dotNetRDF, 3.2.1\"` + espaces VDS.RDF.*, native .NET) et Python = rdflib (from rdflib import *, native Python). Chaque cote atteint le moteur SOTA de son ecosysteme -- ni pont intermediaire (IKVM/PythonNet) ni reimplementation from-scratch. Aucune asymetrie de machinerie a corriger. Verifie firsthand : C# VDS.RDF refs + execution_count, Python rdflib imports."
  known_differences:
    - "PR #17059 (redressement densite #17040) : cote C# seul edite, markdown seul -- retrait des 5 cellules de campagne `### Lecture ... (ancre sur code[N])` et leur absorption dans la section. Les 15 cellules de code et leurs sorties sont byte-identiques a la base ; machinerie lib-vs-lib inchangee."
    - "Arc-narratif #18703 (tranche SW-11-CSharp) : cote C# seul edite, markdown seulement -- lecture simple remontee (construire, interroger, parcourir/visualiser, exemples, verdict), anciennes sections 5 Qualite et 6 Centralite deplacees en annexes D/E, murs de contexte/patterns SPARQL/implementations de parcours en annexes A/B/C, renumerotation de la ligne principale 0-8. Les 15 cellules de code sont byte-identiques a la base (ordre change, dependances d'execution preservees) ; sorties re-executees sous kernel .net-csharp, 14/15 textuellement identiques, la derniere (exemple guide 1, paires de realisateurs) ne differe que par l'ordre des paires ex aequo a 1 genre commun (ORDER BY non total sur les ties). Machinerie lib-vs-lib inchangee."
    - "Socle commun : construction d'un graphe de connaissances (RDF + ontologie + requetage)."
    - "Asymetrie de profondeur (surface) : le Python combine TROIS librairies -- `rdflib` (RDF), `owlready2` (ontologie OWL), et `networkx` (algorithmes de graphe : centralite, composantes connexes, plus courts chemins). Le C# reste sur `dotNetRDF` seul (`VDS.RDF.Query`), sans dimension d'analyse de graphe (centralite/communautes)."
    - "Le Python ajoute donc une dimension d'analyse topologique (networkx) absente du C# -> parite `surface` (le C# est un pendant tronque sur cet aspect)."
