  known_differences:
    - "Socle pedagogique commun : A* et Greedy Best-First avec differentes heuristiques (distance Manhattan, euclidienne, h=0=degenere en UCS). Arrive en Roumanie + 8-puzzle."
    - "Idiomes framework : Python = `import heapq` (priority queue avec (f, tie_breaker, noeud)). C# = `PriorityQueue<AStarNode, double>` (f-cost = g + h)."
    - "Asymetrie pedagogique interessante : le notebook Python inclut une discussion sur l'admissibilite vs consistance des heuristiques (h <= h* + coherence), le C# se concentre sur les benchmarks (noeuds explores pour h=Manhattan vs h=Euclidean sur le meme probleme)."
    - "Tranche 2 #10382 (bucket-1 .NET natif, parite lib-vs-lib) cote C# : QuikGraph.AStarShortestPathAlgorithm<string, STaggedEdge<string, double>> sur la meme instance (franceGraph 13 villes + heuristique Haversine) que from-scratch cell 10-11. Le jumeau Python reste from-scratch (pas de networkx A* cote Python, choix pedagogique coherent avec le reste de la serie -- A* n'est pas le point fort de networkx). Verdict SOTA-OK ecrit (Prong A) + Prong B verifie par discrimination `from-scratch == QuikGraph` (meme 1055 km, meme chemin). `parity_level` reste `semantic` : A* via QuikGraph est un ajout .NET local (pas un jumeau bilaterale), il sert de verification croisee du from-scratch, pas de substitution. difference avec Search-15 : Search-15 a flippe semantic -> native-both car LES DEUX jumeaux utilisent un moteur SOTA (Python networkx + .NET QuikGraph). Ici le Python n'utilise pas de moteur SOTA par choix (heapq stdlib), donc la parite reste semantique."
    - "Methode de reconstruction du chemin : from-scratch utilise `cameFrom` (dict predecesseur explicite). QuikGraph n'expose pas directement le predecesseur de AStar ; on le retrouve par recherche dans `IncomingEdges` du graphe (meme pattern que Search-15 cell 15 pour Dijkstra : pour chaque v remonte a l'arete entrante dont `GetDistance(source) + e.Tag == GetDistance(v)` -- `GetDistance` est la methode publique sur `ShortestPathAlgorithmBase` dans QuikGraph 2.5.0 ; `GetVertexDistance` est `protected` et inaccessible)."
