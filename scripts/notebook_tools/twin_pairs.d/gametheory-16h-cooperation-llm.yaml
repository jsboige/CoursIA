- name: "GameTheory-16h Cooperation LLM"
  family: GameTheory
  python: MyIA.AI.Notebooks/GameTheory/GameTheory-16h-Cooperation-LLM-Python.ipynb
  csharp: MyIA.AI.Notebooks/GameTheory/GameTheory-16h-Cooperation-LLM-CSharp.ipynb
  parity_level: semantic
  bridge_verdict: SOTA-OK
  bridge_verdict_reason: "Simulation sans solveur des deux côtés : bibliothèque standard Python (random.Random, listes, dictionnaires) côté Python, BCL .NET (System.Random, List, Dictionary, LINQ) côté C#. Mêmes entrées gelées des deux côtés : payoffs (T, R, P, S) = (5, 3, 1, 0), 100 tours, 50 rencontres par paire, graines {0, 1, 7, 42, 99}, quatre hétérogénéités définies comme des couples des six mêmes politiques (tft, generous_tft, suspicious_tft, always_defect, uniform_random_seed, llm_proxy_tft). Aucun solveur n'est en jeu : le moteur est le tournoi de dilemme du prisonnier itéré lui-même, réimplémenté des deux côtés selon la même spécification (Axelrod 1984). Les grandeurs déterministes coïncident exactement et sont assertées valeur par valeur dans le jumeau : llm_only et mix_llm_scripted à 1.0000 (payoff 300.00), always_defect à 0.0000 (payoff 100.00), contrôle négatif du §3 à 0/0 et 100/100."
  known_differences:
    - "Attestation 0003 (PR #28710) : rebaseline après l'édition du carnet Python portée par cette PR — seule la ligne **Navigation** a changé (lien entrant vers le jumeau C#, plus une normalisation de fin de source), aucune cellule de code, aucune sortie. La parité `semantic` n'est pas affectée ; les deux blobs sont ré-attestés tels qu'ils sont à cette tête."
    - "Les générateurs pseudo-aléatoires diffèrent : random.Random (MT19937) côté Python, System.Random côté C#, sur les cinq mêmes graines. Les valeurs tirées ne sont donc pas égales entre les deux carnets et ne sont pas présentées comme telles. Modèle nul, coopération moyenne par graine : Python 0.5126 / 0.5056 / 0.4994 / 0.5060 / 0.4954 (moyenne 0.5038, écart-type 0.0066) ; C# 0.5046 / 0.5056 / 0.5064 / 0.5146 / 0.5038 (moyenne 0.5070, écart-type 0.0044). scripted_only : 0.9187 ± 0.0104 côté Python, 0.9012 ± 0.0054 côté C#. Le jumeau asserte les LOIS partagées et non l'égalité des tirages : modèle nul dans la bande ± 0.05 de 0.5 sur chacune des cinq graines et en moyenne ; always_defect strictement à 0 % et payoff 100 ; llm_only et mix_llm_scripted à 100 % ; scripted_only au-dessus de la bande et strictement sous 1 ; bilan 0 H0 / 4 H1."
    - "Lien entrant et ligne README de série : posés par cette PR et non plus différés à #28361 — la ligne **Navigation** du carnet Python porte le lien vers le jumeau C#, et la ligne 16h de GameTheory/README.md annonce les deux noyaux. La coexistence avec #28361 (jumeau Rust, mêmes deux fichiers) a été mesurée sans conflit avant ces éditions."
