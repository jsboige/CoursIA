  csharp: MyIA.AI.Notebooks/InformationCalcul/Complexity/Complexity-03d-ETH-Refutation-Annoncee-Lean-CSharp.ipynb
  parity_level: semantic
  bridge_verdict: SOTA-OK
  bridge_verdict_reason: "Mesure chronometrique de l'enumeration exacte from-scratch des deux cotes, solver-free by design : l'enumeration mesuree EST le sujet du carnet, aucun moteur externe n'est sautable."
  known_differences:
    - "Python stdlib (random, perf_counter) cote Python ; BCL (Random, Stopwatch) cote C# -- instances et chronometres distincts, la parite porte sur la structure du verdict, pas sur les valeurs absolues."
    - "Pentes mesurees different par machine et par execution : la parite porte sur l'ordre de grandeur et sur la structure du verdict, pas sur les valeurs. Sur l'execution commitee de chaque cote, la pente log2(temps) par variable vaut de l'ordre de 1 dans chaque gamme de tailles -- Python : environ 0,9 en cache puis 1,1 en memoire ; C# : environ 1,1 pour n = 12..15 puis 1,3 pour n = 17..21 -- et la pente globale ajustee sur n = 12..21 sort de la fenetre par le haut, puis est reparee par le re-examen par gammes. Les valeurs exactes sont celles qu'imprime la sortie commitee : Python 0.92 / 1.11 (pente globale 1.321), C# 1.11 / 1.27 (pente globale 1.159). Les deux cotes concluent H1 CONFIRME APRES EXAMEN et s_3 = 1 (mur exact 2^n). Le saut t(17)/t(15) vaut, sur ces executions-ci, 17x cote Python (saut de cache distinct) contre 4.8x pour 4.6x attendus cote C# (aucun saut distinct) : la parite porte sur la procedure et le verdict, pas sur la cause du saut."
    - "2026-11-27 (myia-po-2027:CoursIA) #27307 : les pentes sont ecrites en ordre de grandeur, chaque valeur exacte etant citee de la sortie commitee de son execution. La variation est mesuree cote C# : deux executions ont donne une pente globale de 1.068 (pentes par gamme 0.89 / 1.09, dans la fenetre) puis de 1.159 (1.11 / 1.27, hors fenetre). Un chiffre de pente n'est donc pas une propriete stable du carnet et aucune prose ne doit le presenter comme tel."
    - "2026-11-26 (myia-po-2027:CoursIA) #27307 : cote C#, l'interpretation imprimee de la section 5a est calculee a partir des chiffres mesures (trois branches sur le saut compare au travail attendu, verdict derive des pentes par gamme) ; protocole cinq passages et collecte memoire hors chronometre, critere pre-enregistre 0.85..1.15 inchange. Cote Python, cette interpretation reste un litteral."
    - "2026-11-21 (myia-po-2023:CoursIA) creation de la paire avec le jumeau C# (#27307) : memes verdicts H1 CONFIRME APRES EXAMEN et s_3 = 1 des deux cotes. --update en DERNIERE operation (cf #8957)."
