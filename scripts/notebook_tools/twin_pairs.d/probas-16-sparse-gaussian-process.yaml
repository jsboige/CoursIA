  known_differences:
  - 'Socle pedagogique commun : gaussiens parcimonieux (Sparse GP) EXECUTES dans les deux stacks — C# Infer.NET
    via SparseGP (basis set, 4 inducteurs vs base complete) ; Python PyMC via pm.gp.HSGP (approximation spectrale,
    m=[15,15] et m=[25,25], section 6 ajoutee 2026-08-26 #13043 : dense baseline N=200 chronometree 69s vs HSGP 4-7s,
    log-loss OOS equivalente 0.113-0.114, ecart de frontiere 0.006). MarginalSparse (inducing points PyMC) non retenu :
    likelihood Normal uniquement, incompatible classification Bernoulli (documente dans le notebook).'
  - 'Moteurs d''inference distincts : C# Infer.NET = inference deterministe approchee (Expectation Propagation / Variational
    Message Passing, modele compile en code d''inference) ; Python PyMC = echantillonnage MCMC (NUTS/HMC par defaut) + ADVI
    (variationnel) sur backend PyTensor. Memes concepts, paradigmes d''inference differents.'
