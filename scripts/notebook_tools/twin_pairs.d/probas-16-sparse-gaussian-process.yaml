- name: Probas-16 Sparse-Gaussian-Process
  family: Probas/Infer.NET-PyMC
  python: MyIA.AI.Notebooks/Probas/PyMC/PyMC-16-Sparse-Gaussian-Process.ipynb
  csharp: MyIA.AI.Notebooks/Probas/Infer/Infer-16-Sparse-Gaussian-Process.ipynb
  parity_level: native-both
  bridge_verdict: SOTA-OK
  bridge_verdict_reason: "Modele nominal lib-vs-lib cite par owner #10382 (\"PyMC vs Infer, 2 moteurs qui brillent\") : C# = Microsoft Infer.NET (Microsoft.ML.Probabilistic, NuGet officiel, native .NET, inférence variationnelle EP/VMP) et Python = PyMC (pip pymc, native Python, NUTS/HMC + ADVI). Chaque cote atteint le moteur SOTA de son ecosysteme probabiliste -- ni pont intermediaire ni reimplementation. Aucune asymetrie de machinerie a corriger. Verifie firsthand : C# Microsoft.ML.Probabilistic refs + execution_count, Python pymc imports."
  known_differences:
  - 'Socle pedagogique commun : GP scalable REELLEMENT EXECUTE des deux cotes, par deux familles
    d''approximation : C# Infer.NET = points induits (SparseGP basis set, 4 inducteurs vs full, section 7) ;
    Python PyMC = base spectrale de Hilbert (pm.gp.HSGP, section 6 : budgets m=[10,10]/[20,20],
    mur O(N^3) du dense mesure jusqu''a N=6400, N=1200 en 12 s). Les deux approches sparse sont
    distinctes (inducing points vs approximation Hilbertienne) -- c''est la comparaison pedagogique.'
  - 'Moteurs d''inference distincts : C# Infer.NET = inference deterministe approchee (Expectation Propagation / Variational
    Message Passing, modele compile en code d''inference) ; Python PyMC = echantillonnage MCMC (NUTS/HMC par defaut) + ADVI
    (variationnel) sur backend PyTensor. Memes concepts, paradigmes d''inference differents.'
