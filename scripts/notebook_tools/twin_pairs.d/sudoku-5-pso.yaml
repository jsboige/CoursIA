    - "Idiomes framework : Python = numpy + matplotlib, 15 cellules code ; C# = pur System.* (System / System.Collections.Generic / System.Linq), 0 NuGet, 13 cellules code. Asymetrie attendue (le C# evite les libs numeriques), meme enseignement algorithmique (pbest/gbest + update de vitesse)."
    - "2026-08-16 (c.140, myia-po-2026:CoursIA-2) : Tranche 2 GeneticSharp ajoutee cote C# (lib-vs-lib #10382, bucket mealpy/simanneal -> MGS) : chromosome permutation-ligne, fitness -NbErrors, operateurs custom (OX par ligne, swap intra-ligne), TplTaskExecutor + RandomizationProvider, redemarrages, comparaison croisee PSO-from-scratch vs GA-GeneticSharp sur 3 puzzles faciles (15 s max). Correction honnetete du census : mealpy cote Python = import optionnel NON execute (output committe : « mealpy non installe (optionnel) - ce notebook utilise PSO manuel ») -- le PSO execute cote Python est manuel numpy, symetrique du System.* cote C# Tranche 1. Grain d'enrichissement Python restant (non bloquant) : installer mealpy et brancher la cellule deja prevue."
