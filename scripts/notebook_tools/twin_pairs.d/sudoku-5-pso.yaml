  known_differences:
    - "2026-08-21 (Tranche 4 #11977, myia-po-2026:CoursIA) : PSO a operateurs d'echange ajoute cote C# uniquement -- velocite = liste de swaps (algebre Move/Minus/Times, reference Hernandez & Gonzalez 'Metaheuristics in C#' MIT 2012, reimplementation propre) sur l'encodage permutation-de-ligne de la Tranche 2 : swap (ligne, a, b) parmi cellules vides -> lignes valides par construction. Execution reelle commitee : pur RESOLU 111 ms / 111 iterations x 40 particules ; memetique (hill-climbing tous les 25 pas) RESOLU 31 ms / 25 iterations ; duel a graine fixe 42. 20 cellules code cote C#. mealpy n'a pas de PSO a swaps natif -> pas de port Python symetrique possible via lib, precedent Tranche 3 (C#-only assumee). Cette validation = pierre angulaire de l'axe 3 #12049 (graduation DiscretePSO en compound MGS)."
    - "2026-08-21 (#11977 axe 2, myia-po-2026:CoursIA) : Tranche 3 ajoutee cote C# uniquement -- PSO canonique a velocite (Shi & Eberhart, Clerc constriction) via le compound ParticleSwarmOptimization de MetaGeneticSharp (submodule, pointeur 549e6ca5 par #12030) : chromosome continu [1,10) par cellule vide, fitness -conflits lignes+colonnes+blocs, execution reelle commitee (fitness -35, 35 conflits residuels, 31055 ms pour 400 gen x 500 particules, verdict honnete NON resolu + interpretation continu-vs-combinatoire). 18 cellules code cote C#. Prolonge la ligne Tranche 2 (lib-vs-lib #10382) : cote C# la narration couvre desormais 3 familles (essaim custom System.*, GA permutation GeneticSharp, PSO canonique MGS). Cote Python INCHANGE (SHA 3f8a330a) : PSO manuel numpy, mealpy toujours optionnel non execute -- le PSO canonique a velocite que mealpy executerait reste le grain d'enrichissement Python documente."
    - "Socle pedagogique commun : optimisation par essaim de particules (Particle Swarm Optimization) appliquee au Sudoku -- population de particules, vecteurs position/vitesse, update via best personnel (pbest) et global (gbest), fonction de fitness (conflits Sudoku). Meme algorithme, meme cas d'application (optimisation stochastique d'une grille)."
    - "Divergence d'implementation : le Python (numpy + matplotlib, 15 cellules code) implemente le PSO avec visualisation (convergence de la fitness, trajectoires de l'essaim) ; le C# (pur System.* stdlib + GeneticSharp 3.1.4 Tranche 2, 16 cellules code) implemente le PSO from scratch (Tranche 1, System.*) puis un moteur GA de production (Tranche 2, GeneticSharp) sans visualisation (sorties texte). Meme algorithme de base, deux moteurs cote C# (from-scratch + lib SOTA)."
    - "Idiomes framework : Python = numpy + matplotlib, 15 cellules code, mealpy optionnel (import try/except non execute -- output committe) ; C# = System.* (Tranche 1) + GeneticSharp 3.1.4 (Tranche 2), 16 cellules code. Asymetrie attendue cote C# : Tranche 1 sans lib numerique (System.* stdlib), Tranche 2 avec moteur metaheuristique de production (GeneticSharp)."
    - "2026-08-19 (c.140, myia-po-2026:CoursIA-2) : Tranche 2 GeneticSharp ajoutee cote C# (lib-vs-lib #10382, bucket mealpy/simanneal -> MGS) : chromosome permutation-ligne, fitness -NbErrors, operateurs custom (OX par ligne, swap intra-ligne), TplTaskExecutor + RandomizationProvider, redemarrages, comparaison croisee PSO-from-scratch vs GA-GeneticSharp sur 3 puzzles faciles (15 s max). Correction honnetete du census : mealpy cote Python = import optionnel NON execute (output committe : « mealpy non installe (optionnel) - ce notebook utilise PSO manuel ») -- le PSO execute cote Python est manuel numpy, symetrique du System.* cote C# Tranche 1. Grain d'enrichissement Python restant (non bloquant) : installer mealpy et brancher la cellule deja prevue."
    - "Tranche 5 (#10382, 2026-08-22 re-applique, lane myia-po-2025:CoursIA ; initialement Tranche 3 le 2026-08-20, renumerotee apres l atterrissage des Tranches 3-4 #11977 sur main) : double-face mealpy. Twin Python : fix de l import drift (mealpy.problem -> mealpy.utils.problem, mealpy 3.x) + annexe mealpy native OriginalPSO 3 seeds. Twin C# : pont PythonNet -> mealpy (meme instance/budget/seeds), insere apres la Tranche 4. Les deux chains re-executees post-merge (0 erreur). Flip RECOVERABLE-LOCAL -> SOTA-OK."
