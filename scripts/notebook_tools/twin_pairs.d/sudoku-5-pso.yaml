  bridge_verdict_reason: "Python = `mealpy` PyPI (Hong Viet Nguyen et al., MIT-license, 233+ metaheuristiques dont PSO variants : BasePSO, ImprovedPSO, CPSO, HPSO, etc., `from mealpy.swarm_based import PSO` ou `from mealpy import PSO` selon la version, interface uniforme `model.solve(problem)`). C# = BCL pure from-scratch (Particle + Swarm + position/velocity/pbest/gbest from-scratch, 0 NuGet PSO SOTA tiers). Pas de lib SOTA PSO .NET equivalente : `AForge.NET` est generic-machine-learning mais n'a pas de PSO canonique, `Accord.NET` ne couvre pas PSO en 2024-2026. Verdict RECOVERABLE-LOCAL (asymetrie assumee : lib SOTA cote PY, from-scratch cote C# -- un bridge utile serait d'ajouter `PSO` via Accord.Extensions si dispo, mais pas une lib SOTA officielle). La portabilite de l'algo PSO est OK (def standard, equations standards), la complexite est dans le tuning (inertia/c1/c2), pas dans la lib. Note nuance (c.140, #10382) : la Tranche 2 cote C# branche GeneticSharp 3.1.4, moteur GA (pas PSO) de production -- c'est un pont sur la famille metaheuristique voisine (bucket #10382 « mealpy/simanneal -> MGS »), pas une refutation du verdict PSO specifique qui reste RECOVERABLE-LOCAL. Voir les entrees `known_differences` pour les details de la Tranche 2."
