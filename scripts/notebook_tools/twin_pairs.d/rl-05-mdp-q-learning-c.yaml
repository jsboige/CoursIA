- name: "RL-05 MDP-Q-Learning C#"
  family: RL
  python: MyIA.AI.Notebooks/RL/RL-05-MDP-Programmation-Dynamique-Q-Learning-Python.ipynb
  csharp: MyIA.AI.Notebooks/RL/RL-05-MDP-Programmation-Dynamique-Q-Learning-CSharp.ipynb
  parity_level: semantic
  bridge_verdict: SOTA-OK
  bridge_verdict_reason: "Les deux cotes sont des implementations pedagogiques tabulaires from-scratch des MEMES algorithmes : iteration de valeur, iteration de politique, Q-Learning, SARSA, Expected SARSA et n-step TD sont ecrits a la main des deux cotes, et aucun moteur d'apprentissage par renforcement n'est disponible ni omis (ni Stable Baselines3, ni Torch/SB3, ni PPO sur ce sujet). Cote Python, gymnasium ne fournit que les DEUX environnements de reference (FrozenLake-v1, CliffWalking-v1) et matplotlib les figures ; le carnet Python utilise `gymnasium.make` pour ces deux mondes, sans appel a un moteur d'algorithmes. Cote C#, le BCL .NET seul (aucun NuGet, aucune directive #r) reconstruit les deux grilles a la main et les figures sont des SVG inline. L'absence de gymnasium du cote C# n'est donc pas l'omission d'un outil meilleur : c'est l'objet du carnet, et la reconstruction est verifiee sur une valeur publiee (V*(depart) = 0,542 pour FrozenLake-v1 4x4 is_slippery=True a gamma = 0,99). parity_level semantic : meme contenu conceptuel et meme protocole, API idiomatiques differentes."
  known_differences:
    - "Divergence mesuree sur l'ablation n-step, nommee et non lissée. Le carnet Python applique dans `n_step_sarsa` un amorcage sur `argmax(Q[s'])`, donc il calcule ce que le port C# appelle « n-step Q » (amorcage glouton) et non le SARSA n-step (amorcage sur l'action jouee). Le port C# implemente les DEUX variantes derriere un meme drapeau `greedyBootstrap`, dans une seule boucle. Deux controles exacts en decoulent : a n = 1, l'amorcage sur l'action jouee reproduit SARSA (-17,0) et l'amorcage glouton reproduit Q-Learning (-13,0). L'ecart residuel du carnet Python sur n = 5 (ecart-type 0,87, une graine sur quatre a -19) n'est PAS reproduit par la mesure C#, et cette mesure n'etablit pas la cause de cet ecart : les deux implementations different sur la condition de mise a jour (`len(states) > n` d'un cote, `tau = t - n` de l'autre), mais aucune des deux hypotheses n'est verifiee par la mesure."
    - "Source des environnements : gymnasium d'un cote (FrozenLake-v1 et CliffWalking-v1), reconstruction a la main de l'autre, avec la meme convention d'action (0 = Gauche, 1 = Bas, 2 = Droite, 3 = Haut). Controle d'equivalence mesure du cote C# : V*(depart) = 0,542 sur le lac glissant a gamma = 0,99, qui est la valeur publiee de FrozenLake-v1 4x4 is_slippery=True."
    - "Generateurs aleatoires : NumPy d'un cote, System.Random de l'autre, avec des graines partagees (42 pour le protocole unique, 0/1/7/42 pour CliffWalking). Les trajectoires ne sont donc pas identiques au bit pres ; le protocole, lui, l'est (10 000 episodes, alpha = 0,1, gamma = 0,99, epsilon de 1,0 a 0,01 en decay 0,999), et les retours gloutons mesures coincident : Q-Learning -13,0, Expected SARSA -15,0, SARSA -17,0 des deux cotes."
    - "Figures : matplotlib (PNG) cote Python, SVG statique inline (text/html) cote C#, sans bibliotheque graphique dans les deux cas pour le contenu de la grille — le port C# compose le SVG a la main, y compris la table de valeurs et la grille de fleches en texte pour la lecture chiffrée."
    - "Exercices : sept des deux cotes. Le port C# les laisse volontairement non resolus, avec des squelettes compilables qui impriment leur ligne « a completer » ; le carnet Python livre en revanche la solution complete dans les squelettes des exercices 5 et 6 (pont Q-Learning/SARSA et ecart-type contre horizon)."
    - "Port C# ajoute une table de comparaison des methodes (section 10) recomposee depuis les objets vivants du noyau — les valeurs affichees ne peuvent donc pas deriver de leurs propres mesures — et une section de cloture avec quiz ; le carnet Python s'arrete sur ses exercices."
