reason: 'AUDIT DE PARITE, et non re-attestation aveugle : la derive a ete mesuree avant d''etre entregistree.
  Origine : la reparation de la regle 2 du STOP #13410 sur cette PR (une sortie = une lecture). 19 cellules
  de lecture empilees/dupliquees supprimees sur les deux carnets (14 sur App-2b, 5 sur Search-05), 4 reecrites.
  Mesure de la regle 2 (check_split_reading_cells.py --fail-on-findings) : App-2b base rc=0 (0 lecture
  pour 13 sorties) -> tete de PR rc=2 (19 lectures, 5 sorties a >=2, jusqu''a 7) -> apres reparation rc=0
  « clean ». Search-05 : 13 lectures / 0 sortie a >=2 a la base -> 23 / 3 a la tete (code 24 -> [25,26,27],
  code 50 -> [51,53], code 66 -> [67,68]) -> apres reparation 0 sortie a >=2. Trois mesures de non-divergence
  pedagogique : (1) LA DERIVE EST UNILATERALE -- un seul cote bouge par paire, et c''est celui que la
  PR touche (cote C# pour App-2 GraphColoring, cote Python pour Search-05) ; le jumeau de l''autre cote
  est intact, donc aucune edition en lockstep n''est due. (2) LE CONTENU NE BOUGE QU''EN MARKDOWN -- le
  multiset de SHA (JSON canonique) des cellules de code et celui de leurs outputs sont IDENTIQUES base/head
  (13/13 et 33/33, assertions du script de fusion), et TOUTES les cellules markdown de la base sont presentes
  et intactes (16/16 et 48/48). Aucun modele, aucune sortie, aucune execution rejouee. (3) CONTROLE DE
  NON-PERTE -- detect_md_content_loss.py --base d319c41d39 --check rend findings=0 et le head porte PLUS
  de markdown que la base (11387 vs 9003 caracteres normalises pour App-2b ; 30062 vs 28554 pour Search-05)
  : la reparation retire de la redite et des affirmations fausses, pas du contenu. Socle pedagogique commun
  preserve : coloration de graphes (CSP, heuristiques gloutonnes + chi exact + CP-SAT) et algorithmes
  genetiques (OneMax, Trap, Rastrigin, TSP) -- aucun claim de l''axe partage n''est modifie. Effet declare
  : la densite pedagogique passe sous le seuil advisory de 1200 (1221 -> 1040 et 1205 -> 1089) ; c''est
  le resultat honnete, l''apport de la PR etant du remplissage non ancre plutot que de la densite ancree.
  Defauts de fond corriges au passage sur ce carnet : (a) trois cellules ajoutees empilaient une seconde
  lecture sur une lecture de base deja presente (cellules 27, 51 et 67 portaient chacune l''interpretation
  du meme output) ; (b) une lecture plaçait une taxonomie des encodages juste apres le code des methodes
  de selection, sans ancrage sur l''output qu''elle suivait ; (c) la lecture de la comparaison GA / solveur
