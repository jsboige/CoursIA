  bridge_verdict_reason: "Solver-free by design des deux cotes : le carnet fait a la main l'algebre exacte du boost (eq. 83 : G = (3/2) eta, K1 = [[0, 1/2], [2, 0]] ; eq. 84 : exp(th K1) au point (ch, sh) = (5/4, 3/4), exp^T G exp = G) et l'enumeration entiere des cartes (eq. 85 : diag(4,-1) aux bornes 10/1000/100000, puis diag(1,-2) de 12 a 20 cartes) — Python en fractions.Fraction (stdlib) avec math.isqrt, C# en rationnel exact local (Rationnel, record struct sur System.Numerics.BigInteger) et dichotomie RacineEntiere sur long, 0 package externe. Aucun moteur externe canonique nommable d'un cote comme de l'autre, comme Chaines-05/-06/-08/-09 qui font la meme arithmetique exacte."
  known_differences:
    - "Enregistrement de livraison (myia-po-2028:claudish, harnais nb_coder stages 0-5) : portage C# de Chaines-12-Boosts-Et-L-Unite-Une-Python.ipynb. Execution reelle sur kernel .net-csharp : 11 cellules, 0 erreur. Verification independente : approve. Premiere attestation ecrite par l'integration de livraison (check_twin_parity --update), en DERNIERE operation (cf #8957)."
    - "Arithmetique et valeurs porteuses : les quatre blocs de calcul du carnet (appariements du §56, eq. 83, eq. 84, eq. 85 et contraste Pell) sont CALCULES des deux cotes — aucun n'est transcrit d'un cote quand l'autre le calcule. C# implemente un rationnel exact local (Rationnel, reduction par PGCD, denominateur decale d'un pour que la valeur par defaut d'une case vaille 0/1) ; Python utilise fractions.Fraction. Eq. 85 : Python enumere en int natifs avec math.isqrt, C# en long avec checked et RacineEntiere (dichotomie). Les sorties coincident verbatim : 24 rotations, 48 appariements, 48/48 blocs nuls, residu K1^T G + G K1 nul, K1^2 = diag(1,1,0,0), exp^T G exp = G, tanh 3/5 et x/t 6/5, 4/0 cartes de (4,-1) aux trois bornes, 12/8 puis 20/16 pour (1,-2), 12/12 au releve."
    - "Appareil de controle en plus cote C# : journal de parite (VerifierParite -> comparaisonsParite, leve InvalidOperationException sur tout ecart) et attestation de fin de cellule 30 en 8 sections / 59 comparaisons (4 + 1 + 3 + 7 + 6 + 5 + 19 + 14), que le Python n'a pas — il imprime les memes verdicts sans lever et conclut par « Total : 12 / 12 », sortie que le C# reproduit avant l'attestation. Valeurs d'attendu epinglees cote C#, imprimees cote Python : cellule 14, le C# verifie 4 et 0 a chaque borne (le Python ne teste 4/0 qu'au releve de la cellule 30) ; cellule 16, le C# verifie (10 -> 12 cartes, 8 de mixage) et (100 -> 20, 16) alors que le Python imprime ces comptes et ne teste que la croissance 12 < 20. Ces litteraux sont ceux de l'execution Python (sa sortie de la cellule 16) : c'est une reference transcrite, pas une derivation independante."
    - "Census du §56 (cellules 5 et 20) : chiffres CITES des deux cotes, non recalcules. Le C# compare en plus ses lignes citees a une reference en dur (referenceCitee56 / referenceCitee56b = les lignes de sortie du Python) : « §56 — Transcription du census (CITE) : CONFORME, 0 ecart sur 19 comparaisons » atteste la conformite de la transcription a la sortie Python, pas la justesse du census. De meme « table decisive re-derivee en Lean aux 48 appariements » est une affirmation citee du source, que ni le Python ni le C# ne rejoue."
    - "Exercices (cellules 24, 26, 28) : a completer des deux cotes, sortie « Exercice a completer » identique ; le Python laisse None, le C# initialise des placeholders types (Array.Empty, Rationnel 0, matrice 0x0)."
