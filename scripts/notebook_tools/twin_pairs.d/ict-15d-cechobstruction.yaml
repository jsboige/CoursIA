- name: "ICT-15d CechObstruction"
  family: IIT/ICT-Series
  python: MyIA.AI.Notebooks/IIT/ICT-Series/ICT-15-IntegratedComplexity/ICT-15d-CechObstruction-Python.ipynb
  csharp: MyIA.AI.Notebooks/IIT/ICT-Series/ICT-15-IntegratedComplexity/ICT-15d-CechObstruction-CSharp.ipynb
  parity_level: semantic
  bridge_verdict: SOTA-OK
  bridge_verdict_reason: "Solver-free by design des deux cotes : la cochaine de Cech (ProxySections, TransportResidual, Holonomy, ObstructionClass, Verdict) est une implementation maison -- paquet ict Python d'un cote, port BCL .NET 9 de l'autre. Aucun moteur externe n'est contourne : les seules primitives numpy (RNG, svd) sont remplacees par des equivalents declares (cf known_differences), et la regle de verdict est la meme expression que ict.cech_obstruction.cech_obstruction_verdict (planchers 0.05 / 0.05 / 0.5, meme ordre des branches)."
  known_differences:
    - "RNG : numpy PCG64 (Python) vs xorshift64* seede + Box-Muller (C#). Les deux cotes sont deterministes par graine mais les flux ne sont pas bit-identiques. Consequence mesuree : les quatre verdicts sont identiques (NON_TRIVIAL, TRIVIAL, NON_TRIVIAL, NON_TRIVIAL) ; les valeurs numeriques des substrats stochastiques different d'un echantillon a l'autre. Cote a cote, (mean_coboundary, mean_cocycle, obstruction_ratio, sign_consistency, s2_over_s1) lus dans les sorties commitees -- gray_scott : Python 0.3418 / 0.6081 / 1.7791 / 0.6333 / 0.1939, C# 0.3078 / 0.6140 / 1.9948 / 0.6333 / 0.1855 ; axelrod : mean_coboundary, mean_cocycle et obstruction_ratio a 0.0000 des deux cotes (s2_over_s1 : voir l'entree dediee) ; grokking : Python 0.7649 / 0.2263 / 0.2959 / 0.7000 / 0.5624, C# 0.7806 / 0.2521 / 0.3229 / 0.6667 / 0.5692 ; may : Python 0.5992 / 0.5633 / 0.9402 / 0.5333 / 0.4081, C# 0.6297 / 0.8075 / 1.2824 / 0.6000 / 0.3762. L'ecart est un ecart d'echantillonnage, pas de modele."
    - "Champ initial de Gray-Scott : leger par le RNG (Seed(64, 12, 0.02)) des deux cotes, donc instance differente malgre les memes parametres F=0.030, k=0.062 et le meme regime de Turing. Consistence mesuree : sign_consistency identique (0.6333) et range de U comparable, cocycle a 1 % (0.6081 contre 0.6140)."
    - "Point de depart du replicateur d'Axelrod : la source tire un Dirichlet(50) ; le port part de l'uniforme perturbee par un bruit normal d'ecart-type 13 %, tronquee et renormalisee (#12318 : l'uniforme exact est le point fixe du replicateur et argmax n'y departage que du bruit d'arrondi)."
    - "Axelrod, etats visites : la source n'en visite qu'un (unique=1), donc ses sections sont constantes, sa matrice normalisee nulle, et son s2_over_s1 = 1.0000 avec rang 3 vient du plancher np.maximum(s, 1e-12) applique a une matrice nulle -- un artefact, pas une structure. Le port en visite deux (l'index dominant change une fois sur les 401 pas) et rend s2_over_s1 = 0.0000, rang 1. Le verdict TRIVIAL est le meme des deux cotes ; le contre-exemple « rang maximal, cocycle nul » de la source n'est pas reproduit et le jumeau ne s'en sert pas."
    - "Valeurs singulieres : np.linalg.svd (LAPACK, Python) vs valeurs propres de la matrice de Gram M M^T (3x3, Jacobi cyclique maison), dont les racines carrees sont les valeurs singulieres (C#). Exact pour une matrice a trois lignes ; le rang effectif utilise le meme plancher de 10 % de s1 et vaut 2 pour gray_scott et 3 pour grokking et may des deux cotes ; seul axelrod differe (3 cote Python, par le plancher 1e-12 sur une matrice nulle, contre 1 cote C#, cf l'entree dediee)."
    - "Nombre de fenetres imprime : la source annonce n_windows=29 (formule (n_total - window_size) // window_size) alors que ses sections ont la forme (30,) ; le port imprime 30, le nombre reel de fenetres contigues non recouvrantes ((n_total - 1) // window_size). Les tailles de fenetre sont identiques (136, 13, 66, 66) et les sections de meme longueur (30) des deux cotes."
    - "Culture : le carnet C# epingle les trois setters (CurrentCulture, DefaultThreadCurrentCulture, DefaultThreadCurrentUICulture) a InvariantCulture, sinon le separateur decimal virgule de la locale machine fausserait les ecarts."
    - "Rendu de la figure : matplotlib subplots(1, 3) + barh + axvline, savefig (Python) vs trois panneaux de rectangles ScottPlot 5.0.55 embarques en data-URI (C#). Meme contenu : une ligne par substrat, de bas en haut (gray_scott, axelrod, grokking, may), un panneau pour le cocycle, un pour le cobord moyen, un pour le verdict, et le plancher 0.05 en pointilles rouges sur les deux panneaux de mesure comme dans la source -- seul le plancher du cocycle entre dans le verdict. Verifie par une mesure des pixels (12 barres, 3 panneaux alignes, 2 lignes pointillees) et par une relecture independante du rendu (ordre des lignes, longueur relative des barres, verdicts lus)."
