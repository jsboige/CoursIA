- name: "Z3-Python-16d Meal Planner Convergence Scale"
  family: SMT/Z3-API
  python: MyIA.AI.Notebooks/SymbolicAI/SMT/Z3-API/Z3-16d-Meal-Planner-Convergence-Scale-Python.ipynb
  csharp: MyIA.AI.Notebooks/SymbolicAI/SMT/Z3-API/Z3-16d-Meal-Planner-Convergence-Scale-CSharp.ipynb
  parity_level: native-both
  bridge_verdict: SOTA-OK
  bridge_verdict_reason: "Z3 pseudo-booleen (PBEq/PBLe/PBGe ponderes) et theorie des tableaux (Store/Select) branches NATIVEMENT des deux cotes : pyz3 (`from z3 import *`, PbEq/PbLe/PbGe, Array/Store/Select) et Microsoft.Z3 .NET (`#r \"nuget: Microsoft.Z3\"`, ctx.MkPBEq/MkPBLe/MkPBGe, ctx.MkConstArray/MkStore/MkSelect) sont les deux bindings officiels du meme coeur C++ Z3 — pas de pont intermediaire. Meme cache de recettes Ciqual x RecipeML, meme theoreme (7 menus x 5 plats), memes verdicts mesures cote a cote (A explose a la construction, B unknown, C/C'/C'' sat)."
  known_differences:
    - "2026-11-21 (myia-po-2027:CoursIA, #27290) : creation du jumeau C# natif (port complet du grain 16d). Reference de parite extraite des sorties committeees du carnet Python : R=712 recettes solveur-usables (sur 1465 brutes), C=5 ; bornes energie/menu [20515, 91485] kJ, proteines >= 135 g, sel <= 25 g ; encodage A 10500 / 31500 / 74760 disjonctions ; pools Entree=52, Plat principal=370, Accompagnement=47, Pain=65, Dessert=178. Les valeurs absolues de temps different entre les deux carnets (overhead ctypes de z3-solver cote Python, binding .NET direct cote C#) : ce qui est comparable et reproduit est l'ordre relatif des trois encodages et les verdicts, pas les durees."
    - "Idiome pseudo-booleen : `z3-solver` Python fusionne booleen et coefficient dans une liste de paires (`PbEq([(b, w), ...], k)`), Microsoft.Z3 .NET prend deux tableaux paralleles (`MkPBEq(int[] coeffs, BoolExpr[] args, uint k)`). Meme contrainte, signatures differentes — seul ecart d'ecriture entre les deux jumeaux sur cette section, documente dans la cellule 2.3 du carnet C#."
    - "Constantes de statut : Microsoft.Z3 expose `Status.SATISFIABLE` / `Status.UNSATISFIABLE` / `Status.UNKNOWN` (et non `Status.SAT` / `Status.UNSAT`, qui ne compilent pas) ; le carnet C# mappe vers les libelles `sat` / `unsat` / `unknown` pour rester lisible cote a cote avec le jumeau Python."
    - "Encodeur A : le C# mesure la CONSTRUCTION seule (assertions accumulees, aucune resolution lancee) exactement comme le Python, et n'affiche donc aucun verdict — les deux carnets presentent cette sonde comme un temps de construction, jamais comme une preuve d'insatisfiabilite."
    - "2026-11-21 (myia-po-2027:CoursIA, revue de la prose Python de main) : le carnet Python 16d annonce encore un facteur ~150x dans la cellule de bilan, mesure historique d'une iteration anterieure a ~1000 recettes non reproduite par les sorties committeees ; le carnet C# reprend le chiffre en le declarant explicitement comme mesure historique non reproduite, et ne le presente pas comme un resultat du run. La correction de la prose Python reste a faire dans une tranche de serie."