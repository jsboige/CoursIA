- name: "Z3-Python-16d Meal Planner Convergence Scale"
  family: SMT/Z3-API
  python: MyIA.AI.Notebooks/SymbolicAI/SMT/Z3-API/Z3-16d-Meal-Planner-Convergence-Scale-Python.ipynb
  csharp: MyIA.AI.Notebooks/SymbolicAI/SMT/Z3-API/Z3-16d-Meal-Planner-Convergence-Scale-CSharp.ipynb
  parity_level: native-both
  bridge_verdict: SOTA-OK
  bridge_verdict_reason: "Z3 pseudo-booleen (PBEq/PBLe/PBGe ponderes) et theorie des tableaux (Store/Select) branches NATIVEMENT des deux cotes : pyz3 (`from z3 import *`, PbEq/PbLe/PbGe, Array/Store/Select) et Microsoft.Z3 .NET (`#r \"nuget: Microsoft.Z3\"`, ctx.MkPBEq/MkPBLe/MkPBGe, ctx.MkConstArray/MkStore/MkSelect) sont les deux bindings officiels du meme coeur C++ Z3 — pas de pont intermediaire. Meme cache de recettes Ciqual x RecipeML, meme theoreme (7 menus x 5 plats), memes verdicts mesures cote a cote (A : temps de construction mesure seul, sans resolution lancee ; B unknown par timeout ; C/C'/C'' sat)."
  known_differences:
    - "2026-11-25 (myia-po-2027:CoursIA, reprise de la reserve de ai-01 sur la PR #27702) : edition des deux carnets. Premiere passe (commit 8b5e9616549e, les deux carnets re-executes) : la formulation du budget de 15 s remplace le mot 'insoluble' aux quatre endroits nommes par la revue (objectifs, titre de section, tableau de bilan, ligne 16d du README) ; la ligne de conclusion de la cellule 'theorie des tableaux' est ecrite, dans les deux carnets, en fonction du statut rendu par le solveur ; les notes de port ne portent plus de figure non mesuree. Deuxieme passe (jumeau Python re-execute seul, jumeau C# markdown seul) : le jumeau Python imprime en tete la version de son moteur, comme le jumeau C# le faisait deja, et les sorties committees disent 'Moteur : z3-solver 5.1.0' d'un cote et 'Moteur : Microsoft.Z3 Z3 4.12.2.0' de l'autre ; les notes d'honnetete de port sont reecrites : l'ecart de temps a la construction est constate, sa cause (overhead du binding, appel par appel) est donnee comme une interpretation et non comme un profil, et cette lecture remplace l'attribution affirmee comme un fait dans l'entree du 2026-11-21 ci-dessous ; la phrase d'introduction du carnet Python est corrigee contre les sorties committees de l'ancetre Z3-Linq2Z3/09_Meal_Planner_Convergence_Scale.ipynb, ou sur le corpus plein (R=4934) le port C# mesure les encodages B (UNKNOWN en 15,0 s) et C (SATISFIABLE, resolution 29,4 s) et construit l'encodage A jusqu'a R=1000 seulement. Le facteur ~150x est declare mesure historique non reproduite dans le jumeau Python depuis e53954577212 (#26689, sur main) : sur ce point l'entree du 2026-11-21 sur la prose Python est caduque."
    - "Faits mesures le 2026-11-25 sur la meme machine (po-2027) : (a) les deux carnets font tourner deux versions du moteur Z3, `z3-solver 5.1.0` dans le kernel `python3` et `Microsoft.Z3 Z3 4.12.2.0` via une reference NuGet non epinglee ; le pont est natif des deux cotes, mais les temps ne sont pas ceux du meme moteur. (b) Les menus exhibes par les cellules one-hot, course-onehot et vegetarien changent d'une execution a l'autre et entre les deux carnets a source identique : ils ne sont pas un objet de parite ; le statut, le compte de booleens, les pools par creneau et les bornes le sont. (c) Les temps absolus ne se transportent ni d'un carnet a l'autre ni d'une execution a l'autre. Construction de l'encodage A a R=100 / 300 / 712 : Python 1.28s / 9.54s / 24.13s (execution du 2026-11-25T20:47:30Z), 1.18s / 9.04s / 22.38s (execution du 2026-11-25T20:17:36Z, commit 8b5e9616549e), 1.08s / 3.35s / 8.18s (execution du 2026-10-05, atteignable a 36391b2df076) ; C# 0,14s / 0,38s / 0,89s (execution du 2026-11-25T20:18:40Z). Dans toutes ces executions, les comptes (10500 / 31500 / 74760 disjonctions ; 24920 et 4984 booleens ; 46 recettes interdites), les bornes et les verdicts (A construit sans resolution, B unknown par timeout, C sat) sont identiques."
    - "2026-11-21 (myia-po-2027:CoursIA, #27290) : creation du jumeau C# natif (port complet du grain 16d). Reference de parite extraite des sorties committeees du carnet Python : R=712 recettes solveur-usables (sur 1465 brutes), C=5 ; bornes energie/menu [20515, 91485] kJ, proteines >= 135 g, sel <= 25 g ; encodage A 10500 / 31500 / 74760 disjonctions ; pools Entree=52, Plat principal=370, Accompagnement=47, Pain=65, Dessert=178. Les valeurs absolues de temps different entre les deux carnets (overhead ctypes de z3-solver cote Python, binding .NET direct cote C#) : ce qui est comparable et reproduit est l'ordre relatif des trois encodages et les verdicts, pas les durees."
    - "Idiome pseudo-booleen : `z3-solver` Python fusionne booleen et coefficient dans une liste de paires (`PbEq([(b, w), ...], k)`), Microsoft.Z3 .NET prend deux tableaux paralleles (`MkPBEq(int[] coeffs, BoolExpr[] args, uint k)`). Meme contrainte, signatures differentes — seul ecart d'ecriture entre les deux jumeaux sur cette section, documente dans la cellule 2.3 du carnet C#."
    - "Constantes de statut : Microsoft.Z3 expose `Status.SATISFIABLE` / `Status.UNSATISFIABLE` / `Status.UNKNOWN` (et non `Status.SAT` / `Status.UNSAT`, qui ne compilent pas) ; le carnet C# mappe vers les libelles `sat` / `unsat` / `unknown` pour rester lisible cote a cote avec le jumeau Python."
    - "Encodeur A : le C# mesure la CONSTRUCTION seule (assertions accumulees, aucune resolution lancee) exactement comme le Python, et n'affiche donc aucun verdict — les deux carnets presentent cette sonde comme un temps de construction, jamais comme une preuve d'insatisfiabilite."
    - "2026-11-21 (myia-po-2027:CoursIA, revue de la prose Python de main) : le carnet Python 16d annonce encore un facteur ~150x dans la cellule de bilan, mesure historique d'une iteration anterieure a ~1000 recettes non reproduite par les sorties committeees ; le carnet C# reprend le chiffre en le declarant explicitement comme mesure historique non reproduite, et ne le presente pas comme un resultat du run. La correction de la prose Python reste a faire dans une tranche de serie."