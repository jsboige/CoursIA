  known_differences:
    - "2026-09-02 (grain hr-separateurs famille Sudoku, myia-po-2027:CoursIA) : conversion des separateurs markdown --- vers *** via fix_hr_separator.py (incident #11451 : un --- seul ouvre un bloc YAML Pandoc et casse quarto render) -- jumeau Python seul (1 separateur). Cellules markdown uniquement, aucune source de code ni output modifiee, pas de re-exec (C.2 exception markdown-only). Les blob et content SHAs deplaces dans l audit ci-dessus sont des artefacts de cette conversion markdown (le content_sha hashe le JSON canonique des cellules), pas une divergence pedagogique."
    - "Socle pedagogique commun : automates symboliques et resolution de Sudoku via Z3 (automates finis symboliques, representation symbolique des contraintes, liens avec SMT). Meme concept (automates symboliques + Z3 comme backend de decision), meme cas d'application (Sudoku). Les deux couvrent Z3, z3, symbolic, Solver."
    - "Divergence d'implementation : le C# (Microsoft.Z3 via NuGet + auto-suffisant en annexe S10, 19 cellules code apres #10459) utilise la theorie des chaines Z3 et la regle `re.++` / `re.*` / `re.range` / `str.to_re` pour la partie symbolique. Le Python (pyz3, 10 cellules code) utilise les bindings Z3 directement. Meme enseignement (automates symboliques + Z3), deux niveaux."
    - "Plafond academique documente (issue AutomataDotNet/Automata#6, voir SOTA ledger Entry #008) : la voie SFAz3 d'origine a un cap du temoin a ~21 caracteres (SFAz3 + Z3 'monstre regex tronque'). Ce plafond est **academique** et frappe les deux jumeaux a l'identique ; il est documente ici et **ne peut pas** motiver un verdict de parite. Le contournement par la theorie des chaines directe (annexe S10 du notebook C#) montre la lib Microsoft.Z3 sans ce plafond."
    - "Idiomes framework : C# = Microsoft.Z3 (NuGet, registre #3801 axe 1) + System.* stdlib + Annexe S10 cellule auto-suffisante ; Python = pyz3. Meme concept (automates symboliques), implementations avec le meme moteur (Z3)."
    - "Rebaseline 2026-08-17 : cote C# draine wall-clock MACHINE-DEP en cell[43] (table banc d'essai 13 voies x 3 grilles, ~31 valeurs) et cell[44] (table consolidant 9 voies x 4x4/9x9, ~10 valeurs) - mandat #9377/#9434, drain des wall-clock prose (mandat user : seules les valeurs reproductibles d'une execution a l'autre sont conservees). Resultats de resolution (SAT / TIMEOUT / unknown / OOM / faux negatif / rejet compile) et tendance qualitative conserves. Parite semantique inchangee (aucune cellule code, aucune sortie, aucun exec_count touche) ; cote Python non modifie (pas de table wall-clock identique). Attestation = nouveau blob SHA (csharp) + nouveau content_csharp_sha."
    - "Tranche 2026-08-29 (annexe S11, issue #10382, lane myia-po-2025:CoursIA) : le C# passe a 20 cellules code avec le pont pythonnet 3.1.0 -> CPython -> dd 0.6.0 (meme moteur que la section 9 du jumeau Python, dd natif). Le BDD mini-Sudoku (6 variables booleennes, encodage verbatim) donne des chiffres identiques des deux cotes -- 90 noeuds, 6 lignes valides (3!), modele (2, 1, 3) -- contre-verifies par enumeration exhaustive des 64 lignes de la table de verite menee independamment cote C# ET cote Python (accord True avec le pick_iter du BDD). parity_level semantic INCHANGE : la regle _schema (un cote qui reimplemente le sujet du notebook a la main n'est PAS natif) garde cours -- le C# conserve ses sections from-scratch porteuses (monstre regex, explosion DFA, emission SMT-LIB StringBuilder ; motif de l'annexe S10 : en plus, jamais a la place), et le jumeau Python aussi (backtracking recursif naif). Distinction avec le precedent Sudoku-05 (passe native-both) : le moteur-sujet (mealpy) portait TOUT le travail du notebook des deux cotes ; ici le from-scratch pedagogique reste deliberement porteur des deux cotes."
