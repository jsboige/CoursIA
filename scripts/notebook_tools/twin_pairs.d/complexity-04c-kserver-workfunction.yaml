  known_differences:
    - "Tirage aleatoire : les deux cotes executent le meme protocole (200 instances, meme graine, meme famille de metriques) mais les flux ne coincident pas terme a terme -- Python `random` (Mersenne Twister, `random.Random(seed)`) d'un cote, `System.Random` de l'autre. Mesure au 2026-11-18 sur le protocole n=6, k=3 : ratio moyen 1,190 / max 1,714 cote Python, 1,197 / 1,750 cote C#, 0 violation de la garantie k dans les deux cas."
    - "Formatage des nombres : le noyau .NET rend la virgule decimale (ratio moy=1,197) et le noyau Python le point (ratio moy=1.190) ; le noyau C# verrouille `InvariantGlobalization` pour que la sortie ne depende pas de la locale du poste."
