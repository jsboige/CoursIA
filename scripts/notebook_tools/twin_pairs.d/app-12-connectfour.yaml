  bridge_verdict_reason: "Python = numpy + matplotlib + framework AIMA (Game, namedtuple, https://github.com/aimacode/aima-python, MIT, Russell/Norvig) + algo minimax alpha-beta + MCTS (22 cellules code). C# = BCL pure (System.*, 0 NuGet, from-scratch) + algo minimax alpha-beta + MCTS (16 cellules code). Verdict RECOVERABLE-LOCAL : socle pedagogique paritable (Puissance 4 / Connect Four, IA jeux combinatoires : minimax alpha-beta + MCTS, framework AIMA comme structure de donnees). L'asymetrie reside dans le moteur : Python invoque framework AIMA (lib de reference MIT, Russell/Norvig) + numpy/matplotlib pour viz ; C# implemente from-scratch en BCL pure. Le port de AIMA vers C# est realisable (AIMA-python est structurel) mais hors scope -- le C# demontre l'implementation from-scratch en BCL pure, presentation compacte. parity_level: semantic preserve. Readjudication 2026-08-25 (dispatch #10382, comment 5412568851, lane myia-po-2024:CoursIA) : le postulat « Python invoque framework AIMA » est FAUX, verifie firsthand -- la cellule 41 du twin Python declare un « Framework AIMA simplifie » INLINE inspire de games4e.py et aima-java ; imports reels du notebook : collections, copy, math, matplotlib, numpy, random, sys, time (aucun package aima-python installe ni importe). Les DEUX jumeaux implementent minimax alpha-beta + MCTS from-scratch (Python stdlib+numpy / C# BCL pure) : le test native-both (nommer moteur + point d'entree par cote) echoue des deux cotes, precedent csp-7-soft (sections Semiring/Fuzzy solver-free). Il n'existe aucun moteur externe installable a bridger : RECOVERABLE-LOCAL etait premature, aucune recuperation n'est possible ni necessaire. Verdict reevalue SOTA-OK -- parite from-scratch des algorithmes eux-memes ; numpy/matplotlib sont des outils de viz/calcul, pas des moteurs d'IA. parity_level: semantic preserve."
  known_differences:
    - "Socle pedagogique commun : Puissance 4 / Connect Four (IA jeux combinatoires : minimax alpha-beta, MCTS, framework AIMA) comme application canonique. Les deux twins couvrent le meme socle theorique (formulation variables/domaines/contraintes, resolution, experimentation) avec parite semantique sur les concepts cibles."
    - "Idiomes framework : Python = numpy/matplotlib + framework AIMA (Game, namedtuple) + viz ; C# = System.* BCL pure, 0 NuGet, 29 cellules compactes."
    - "Asymetrie pedagogique : Python met l'accent sur le solveur SOTA (OR-Tools CP-SAT / library specialisee) + visualisation matplotlib + experimentation comparative ; le C# demontre l'implementation from-scratch en BCL pure (ou binding NuGet du meme solver pour App-8/10/15), presentation compacte. Meme socle theorique, leviers de demonstration differents."
    - "Re-baseline 2026-10-27 (myia-po-2023:CoursIA-2, #20441) : le jumeau Python a recu une precision pedagogique sur le seul point \"Pour aller plus loin\" -- la puce DQN/RL devient explicite sur son hors-scope (EPIC DQN-RL dedie), la formulation precedente laissait croire que la serie RL etait un prolongement immediat du carnet. Portee : markdown seul, une puce, aucune cellule code touchee, aucun re-run du. Parite semantique inchangee -- le jumeau C# n'a pas de section \"Pour aller plus loin\" (asymetrie deja connue, cf entree 3), donc rien a aligner de son cote ; c'est une clarification unilaterale assumee, pas une divergence de socle."
    - "Renommage 2026-11-14 (#12933, doctrine #5081, lane myia-po-2027:CoursIA) : le jumeau C# App-12c-ConnectFour.ipynb devient App-12b-ConnectFour-CSharp.ipynb -- meme numero 12b et meme titre que le Python, seul le suffixe kernel varie. Contenu strictement inchange (git mv) hormis le H1 markdown (App-12c -> App-12b, 1 ligne) et les lignes de navigation ; code, execution_count et outputs intacts. Parite semantique inchangee."
    - "Renommage 2026-11-21 (#26707 fournée remontée de trou, PR #27475, lane myia-po-2024:CoursIA) : les deux jumeaux App-12b-ConnectFour-Python.ipynb et App-12b-ConnectFour-CSharp.ipynb deviennent App-12-ConnectFour-Python.ipynb et App-12-ConnectFour-CSharp.ipynb -- remontée de la seule lettre orpheline de la série (12b) vers le numéro nu 12, doctrine #25341 (les deux noyaux d'un même sujet portent le même numéro). Renommage pur (git mv) des deux côtés à la fois ; code, execution_count et outputs byte-identiques (grep du diff = 0 ligne code/outputs). Re-attestation 0024 du 2026-11-20 posée sous les nouveaux chemins (--update --by myia-po-2024:CoursIA). Parité sémantique inchangée."
    - "2026-11-25 (myia-po-2027:CoursIA, PR #28574) : la ligne de navigation du jumeau Python recoit le lien [jumeau Rust](App-12-ConnectFour-Rust.ipynb) vers le nouveau carnet App-12-ConnectFour-Rust.ipynb, ce qui satisfait le lien entrant intra-serie exige par check-nav-chain (precedents CSP-4 #27680, Complexity-03c #27854). Portee : une ligne markdown de la cellule 0, cote Python seul ; 0 cellule de code touchee, 0 sortie modifiee, 0 execution_count deplace. Le jumeau C# et les differences anterieures restent inchanges ; parite semantique inchangee. Attestation 0025 emise apres le commit du carnet, en derniere operation (cf #8957)."
    - "2026-11-27 (myia-po-2027:CoursIA, PR #28574) : troisieme cote Rust declare (`rust:`) -- le carnet App-12-ConnectFour-Rust.ipynb rejoue le Python en Rust standard (evcxr, `std` seule, aucun crate), avec le generateur MT19937 reproduit au contrat CPython, d'ou les memes coups sur les parties imprimees coup par coup. La parite des grandeurs est portee par `rust_conformance.d/app-12-connectfour.yaml` (20 mesures a tolerance 0 : coups legaux, jetons, scores, longueurs de partie par IA, matrice du tournoi, benchmark AIMA), et les figures sont remplacees par leurs donnees. Parite semantique : les trois cotes calculent les memes valeurs ; ce carnet ne partage pas les nuages aleatoires de scikit-learn mais le tirage est fixe par graine, ce que le registre declare."
