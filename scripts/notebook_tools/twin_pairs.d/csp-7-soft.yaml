  bridge_verdict_reason: 'Python = `ortools.sat.python.cp_model` (Google, Apache-2.0, CP-SAT SOTA soft constraints : `CpModel()` + variables + `AddMaxEquality` + cout de violation + `solver.Solve()` pour optimisation sous contraintes souples) + abstractions `abc.ABC`/`abstractmethod` (4 paradigmes : Semiring-based CSP, Fuzzy CSP, Weighted CSP, OR-Tools CP-SAT integration) + `dataclasses`. C# = Choco-solver 4.10.17 (Apache-2.0) via IKVM 8.15.0 home shade DLL (recette #4711) avec `org.chocosolver.solver.Model` + `IntVar` + `arithm` + cost-aware constraints + `getSolver().findOptimalSolution(cost, MINIMIZE)` pour Weighted CSP uniquement (24 cellules C# vs 53 cellules PY, 11 code C# vs 20 code PY). Verdict RECOVERABLE-LOCAL : ASYMETRIE STRUCTURELLE DOCUMENTEE -- le C# est un twin PARTIEL (Weighted CSP uniquement), le PY couvre 4 paradigmes soft constraints (Semiring/Fuzzy/Weighted/OR-Tools). `parity_level: surface` preserve deja cette couverture limitee. La section PY Fuzzy est desormais portee cote C# (section 4 du twin C#, livree par PR #12159 MERGED 2026-08-21, commit bb5750e64 : planification de vacances Choco avec degres [0..1000], combinaison min, verifiee firsthand c.1301+334 -- 26 cellules dont 12 code, 12/12 executees). La section PY Semiring est desormais portee cote C# (section 5 du twin C#, livree par PR #12616 : interface generique ISemiring<T> + classe SoftCsp<T>, accord numerique exact verifie contre le moteur Choco sur le probleme de vacances floues). Le fil Hierarchical CSP reste le seul gap residuel sans equivalent C#. Cote C# : Choco supporte nativement Weighted CSP + Fuzzy via ses semiring interfaces, l''extension est techniquement faisable (`org.chocosolver.solver.constraints.set.PropFuzzy` etc.) mais pedagogiquement non livree. Cote PY : `python-constraint` MIT + `pychoco` (binding Choco Python, MIT) ajouteraient une lib SOTA alignable sur Choco C#. `parity_level: surface` preserve : parite seulement sur la couverture Weighted CSP (surface limit du twin C#). Adjudication 2026-08-19 (dispatch #10382, comment 5335643895, lane myia-po-2026:CoursIA) : surface CONFIRME pour l''etat livre, verifie firsthand sur deux fondements -- (1) twin C# partiel : 0 occurrence Semiring/Fuzzy dans le C# (24 cellules) contre 33/28 cote Python (53 cellules) + fil Hierarchical CSP absent ; (2) le cote Python est LUI-MEME partiellement solver-free : les sections Semiring/Fuzzy sont des frameworks from-scratch sur abstractions stdlib (`abc.ABC`, `dataclasses`), pas un moteur externe -- le test native-both (nommer moteur + point d''entree par cote) echoue donc au-dela du sous-ensemble Weighted, des deux cotes. Le sous-ensemble couvert est en parite de moteurs REELS : Choco/IKVM 11/11 cellules code executees cote C#, OR-Tools CP-SAT 20/20 cote Python. RECOVERABLE-LOCAL maintenu (extension Choco semiring/fuzzy faisable, non livree).'
