  bridge_verdict_reason: "Python = `ortools.sat.python.cp_model` (Google, Apache-2.0, CP-SAT SOTA soft constraints : `CpModel()` + variables + `AddMaxEquality` + cout de violation + `solver.Solve()` pour optimisation sous contraintes souples) + abstractions `abc.ABC`/`abstractmethod` (4 paradigmes : Semiring-based CSP, Fuzzy CSP, Weighted CSP, OR-Tools CP-SAT integration) + `dataclasses`. C# = Choco-solver 4.10.17 (Apache-2.0) via IKVM 8.15.0 home shade DLL (recette #4711) avec `org.chocosolver.solver.Model` + `IntVar` + `arithm` + cost-aware constraints + `getSolver().findOptimalSolution(cost, MINIMIZE)` pour Weighted CSP uniquement (24 cellules C# vs 53 cellules PY, 11 code C# vs 20 code PY). Verdict RECOVERABLE-LOCAL : ASYMETRIE STRUCTURELLE DOCUMENTEE -- le C# est un twin PARTIEL (Weighted CSP uniquement), le PY couvre 4 paradigmes soft constraints (Semiring/Fuzzy/Weighted/OR-Tools). `parity_level: surface` preserve deja cette couverture limitee. Les sections PY Semiring + Fuzzy sont entierement absentes du C#. Cote C# : Choco supporte nativement Weighted CSP + Fuzzy via ses semiring interfaces, l'extension est techniquement faisable (`org.chocosolver.solver.constraints.set.PropFuzzy` etc.) mais pedagogiquement non livree. Cote PY : `python-constraint` MIT + `pychoco` (binding Choco Python, MIT) ajouteraient une lib SOTA alignable sur Choco C#. `parity_level: surface` preserve : parite seulement sur la couverture Weighted CSP (surface limit du twin C#)."
