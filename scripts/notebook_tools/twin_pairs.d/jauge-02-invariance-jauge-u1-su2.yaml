- name: "Jauge-02 Invariance Jauge U1 SU2"
  family: Physique/Jauge
  python: MyIA.AI.Notebooks/Physique/Jauge/Jauge-02-Invariance-Jauge-U1-SU2-Python.ipynb
  csharp: MyIA.AI.Notebooks/Physique/Jauge/Jauge-02-Invariance-Jauge-U1-SU2-CSharp.ipynb
  parity_level: semantic
  bridge_verdict: SOTA-OK
  bridge_verdict_reason: |
    Le jumeau C# refait le meme parcours en arithmetique exacte avec la seule bibliotheque standard : rationnels reduits sur BigInteger, polynomes explicites en (t, x), phase par s = tan(alpha/2), rotation SU(2) par vecteur de Cayley, developpements de Taylor exacts a l'ordre 2. Le moteur du carnet Python est sympy ; le jumeau ne le imite pas par des flottants : il etablit chaque identite par polynome nul sur la classe de champs declaree, puis sur 32 coefficients symboliques libres pour la section 6. Meme verdict, arithmetique differente.
  known_differences:
    - "Methode : le carnet Python etablit chaque identite par calcul formel sympy sur des champs trigonometriques ; le jumeau C# la verifie sur des polynomes explicites a coefficients rationnels, en concluant au polynome nul. La section 6 est en outre etablie sur 32 coefficients symboliques libres."
    - "Rotation SU(2) : le jumeau parametre la rotation par le vecteur de Cayley k = 2 tan(r/4), sans trigonometrie ; ce parametrage n'atteint pas U = -I. Les sections 7 et 8 sont menes point par point sur la grille 6 x 6, avec developpements de Taylor exacts a l'ordre 2 autour de chaque point."
    - "Exemple numerique : meme grille (36 points de 0,1 a 1,0), meme point de controle (0.37, 0.81) et meme couplage g = 7/10, mais des champs d'exemple differents (polynomes et fractions rationnelles au lieu de sinus, cosinus et exponentielles). Les ecarts numeriques du carnet Python (3.12e-18 en unitarite, 3.92e-15 en invariance) sont des zeros exacts dans le jumeau ; le contre-temoin abelien vaut 8.16e-01 en Python et 1.21e-01 dans le jumeau, avec le meme verdict (transformation incomplete detectee)."
    - "Contre-epreuve propre au jumeau : une formule de Rodrigues au coefficient faux est executee (ecart d'unitarite 1.26e-02, ecart d'invariance 1.06e-01) ; le carnet Python ne contient que le contre-temoin abelien."
    - "Exercices : les trois exercices sont des stubs Func<bool> qui renvoient null, sans erreur volontaire ; le carnet s'execute de bout en bout."
    - "2026-11-24 (myia-po-2024:CoursIA, #28065) : naissance du jumeau. --update en DERNIERE operation (cf #8957)."
