  bridge_verdict_reason: "Parite from-scratch / from-scratch / from-scratch, sans bibliotheque de resolution d'un cote ni de l'autre : le sujet du carnet est le modele lui-meme (jeu de biens publics a N personnes), et les trois cotes l'ecrivent a la main. Le modele exact (eq. 7, D(x) = E_binom[b(i+1) - b(i)] - c/b, esperance binomiale a taille de groupe finie), l'approximation eq. 9 (x+ = 1 - (c/b)^(1/(N-1))) et la continuation quasi-statique de l'equation du replicateur dx/dt = x (1 - x) D(x) sont implementes dans les trois langages, sans appel a un integrateur ni a une loi binomiale de bibliotheque. Moyens : Python numpy 2.5.4 + matplotlib ; C# BCL pure (System.*, 0 NuGet) avec un formateur SVG maison ; Rust ndarray 0.17.2 + plotters 0.3 via `:dep` evcxr, std pour le reste. Les valeurs mesurees coincident : carte des regimes au modele exact (192 cellules : coexistence 32 / 16.7 %, bistable 91 / 47.4 %, defection 69 / 35.9 %, C# et Python identiques), fenetre d'hysteresis c/b dans [0.07, 0.27] avec ecart max +0.482, prediction N-personnes non lineaire 0.1294 (RATEE contre les 0.30 observes). Le registre differentiel `rust_conformance.d/dynamics-09-biens-publics.yaml` confronte Python et Rust sur 21 mesures : 0 divergence. Aucun moteur SOTA n'est contourne, il n'en existe pas pour ce modele. parity_level: semantic."
  known_differences:
    - "Figures (E2b carte des regimes, E3 bifurcation) : le jumeau Python rend deux PNG matplotlib, les jumeaux C# et Rust deux SVG (formateur maison cote C#, plotters cote Rust). Les figures sont qualitatives et hors du registre differentiel : elles se comparent a l'oeil, pas par valeur."
    - "Le cote C# imprime en plus la distribution par archetype sur les 78 formes canoniques (PD 1, SH 6, SD 1, H 6, Other 64) et la verification eq. 9 contre l'approximation (k-1)/(N-1) a N = 3, 10, 100 : deux sorties pedagogiques que Python et Rust ne rendent pas sous cette forme. Les grandeurs communes (24 rangements, 576 jeux bruts, 78 formes normales) coincident."
    - "Les trois jumeaux portent les memes trois exercices stubes en fin de section (anatomie des 64 jeux « Other », frontiere defection / bistable, largeur de la fenetre d'hysteresis) : sortie de consigne, aucune erreur volontaire."
    - "2026-11-27 (PR #28661, myia-po-2027:CoursIA) : troisieme cote declare (`rust:`, organe 1 de #27098) et atteste a la tete. Le jumeau Rust perd les `execute_result` `()` que ses boucles `for` (cellules 4 et 9) laissaient en sortie : un `let _ = ();` final rend la cellule muette, sans changer le comportement ni la sortie utile. Re-execute par papermill (kernel `rust`, 24 cellules sur 24, 0 erreur) ; le registre `rust_conformance.d/dynamics-09-biens-publics.yaml` rejoue a cette tete rend 21 mesures conformes, 0 divergence."
