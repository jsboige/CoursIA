- name: "ICT-15c MetaProxyObstruction"
  family: IIT/ICT-Series
  python: MyIA.AI.Notebooks/IIT/ICT-Series/ICT-15-IntegratedComplexity/ICT-15c-MetaProxyObstruction-Python.ipynb
  csharp: MyIA.AI.Notebooks/IIT/ICT-Series/ICT-15-IntegratedComplexity/ICT-15c-MetaProxyObstruction-CSharp.ipynb
  parity_level: semantic
  bridge_verdict: SOTA-OK
  bridge_verdict_reason: "Solver-free by design des deux cotes : les six organes du meta-proxy (transition_matrix, transition_graph, laplacien + valeurs propres, observed_adjacency, local_sensitivity, obstruction_vector) sont une implementation maison -- paquet ict Python d'un cote, port BCL .NET 9 de l'autre. Aucun moteur externe n'est contourne : NumPy/SciPy n'ont pas d'equivalent installe a invoquer dans le kernel .net-csharp, et le port remplace chaque primitive par un equivalent declare (cf known_differences)."
  known_differences:
    - "RNG : numpy PCG64 (Python) vs xorshift64* seede + Box-Muller (C#). Les deux cotes sont deterministes par graine mais les flux ne sont pas bit-identiques. Consequence mesuree : Gray-Scott est insensible au tirage (l'attracteur (U=1, V=0) absorbe le bruit initial), donc ses signatures coincident avec la source ; Axelrod, Grokking et May sont stochastiques et rendent d'autres tirages, donc d'autres signatures -- l'ecart est un ecart d'echantillonnage, pas de modele, et il est borne par la tolerance de Monte-Carlo declaree ici."
    - "Valeurs propres : np.linalg.eigvalsh (LAPACK, Python) vs rotation de Jacobi cyclique maison (C#). Accord a la precision machine sur les matrices symetriques 2x2 a 16x16 du banc ; le gap spectral est e_i[1] - e_i[0] sur des valeurs triees croissantes des deux cotes."
    - "Rendu de la heatmap : matplotlib imshow (Python) vs rectangles ScottPlot 5.0.55 (C#). La ligne 0 est replacee en haut par y = n - 1 - i, les etiquettes sont des objets Text hors de la grille, et la rampe viridis est implementee localement (10 points de controle, interpolation lineaire) : l'API Colormaps de ScottPlot n'expose pas de methode statique utilisable depuis ce kernel. Les valeurs affichees dans les cellules sont identiques."
    - "Ordre d'association du Laplacien : le port C# conserve l'ordre de ict.reaction_diffusion.laplacian (roll(+1, axe0) + roll(-1, axe0) + roll(+1, axe1) + roll(-1, axe1) - 4*f) pour que le stencil soit bit-exact a la source, malgre la commutativite de l'addition en virgule flottante non associative."
    - "Culture : le carnet C# epingle les trois setters (CurrentCulture, DefaultThreadCurrentCulture, DefaultThreadCurrentUICulture) a InvariantCulture, sinon le separateur decimal virgule de la locale machine fausserait les ecarts."