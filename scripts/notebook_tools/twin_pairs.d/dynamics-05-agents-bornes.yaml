  - "2026-11-21 (myia-ai-01:CoursIA-2, portage Rust #27797) : troisieme cote ajoute, `Dynamics-05-Agents-Bornes-Rust.ipynb`, kernel evcxr (`rust`), `std` seule, aucune dependance externe. Meme structure de cellules que le jumeau Python (37 cellules, 11 code aux memes index) : la dataclass gelee devient une `struct BoundedAgent` avec `impl Display` (le `__repr__` Python que `f\"{agent}\"` emploie faute de `__str__`), l'enum Python devient un `enum ProgramCode` avec `fn name()`, le dict canonique PD devient deux tableaux `PD_KEYS`/`PD_VALS` reconstruits par `join` (un `HashMap` n'a pas d'ordre, un `BTreeMap` trierait les cles), et booleens et tuples sont rendus a la facon Python (`py_bool`, `py_tuple`) pour que les 9 couples de la matrice et les 8 certificats s'impriment au caractere pres. Chaque cellule de code est autonome : elle redonne ses types, ses organes et sa famille (aucune fonction ne survit d'une cellule a l'autre). Les trois exercices gardent leurs gardes (oracle recalcule par les organes, `assert!` sur les reponses, `None` explicite tant que l'exercice n'est pas fait). Le libelle `Python=` de la table de certificats est HERITE du tableau de reference : c'est ce carnet Rust qui etablit le verdict, la cellule 21 le dit explicitement. Ecarts de forme documentes dans le registre de conformite `scripts/notebook_tools/rust_conformance.d/dynamics-05-agents-bornes.yaml` : le jumeau C# affiche l'agent en enregistrement .NET, la matrice sans le remplissage a 12 colonnes, ni le dictionnaire PD, ni les intitules d'exercice ; ces cotes y sont declares ABSENTS avec leur motif, les grandeurs partagees (budgets, gains canoniques, compte des certificats) etant comparees sur les trois cotes. Le triplet Python/Rust est verifie cellule a cellule : stdout identique au caractere pres sur les 11 cellules de code (0 divergence), sur la base d'une PASSE evcxr REELLE (kernel `rust`, papermill, 22/11) et non d'une copie de l'artefact Python ; les cellules dont la derniere forme est une expression (6, 12, 17, 19, 32) sont terminees par `;`, faute de quoi evcxr emet un `execute_result` `()` que le jumeau Python n'a pas."
