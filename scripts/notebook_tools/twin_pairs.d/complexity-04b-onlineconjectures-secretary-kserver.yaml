  bridge_verdict_reason: "Aucun solveur externe des deux cotes : les matroides, les strategies en ligne, l'optimum hors-ligne et les work functions sont codes explicitement pour l'enseignement, sur l'interface d'oracle d'independance que la conjecture de Singla suppose. Le cote C# n'emploie que la BCL (System.Random, Fisher-Yates, LINQ), sans paquet NuGet : rien n'est omis ni remplace par un substitut."
  known_differences:
    - "Generateur : PCG64 (numpy default_rng) cote Python, System.Random (BCL) cote C#, flux principal seme 42 dans les deux cas et memes huit graines pour la dispersion (0, 1, 7, 42, 99, 123, 256, 1024). Les flux ne coincident pas terme a terme : les valeurs tirees different, les budgets et les experiences sont identiques."
    - "Les grandeurs qui ne dependent d'aucun tirage coincident exactement : sur le cycle C_5 avec les serveurs en (0, 1) et les requetes alternant 3 et 4, l'optimum hors-ligne vaut 3, le WFA 5 et le ratio 1,667 a toute longueur (T = 60, 120, 480), le glouton 61 a T = 60. Les mesures tirees (secretaire a 1/e, competitivite des matroides, ligne a huit points) sont propres a chaque carnet."
    - "Affichage : le noyau .NET rend les nombres avec le separateur decimal de sa culture (virgule en fr-FR), le noyau Python avec le point. Aucun calcul n'en depend."
    - "Exercices : le carnet C# ajoute a chacun un controle automatique qui accepte une solution de reference et rejette un mutant nomme (#26842) ; le carnet Python porte les stubs nus, sans garde. Le contenu mathematique des enonces est le meme."