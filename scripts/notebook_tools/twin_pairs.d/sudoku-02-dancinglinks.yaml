  known_differences:
    - "Socle pedagogique commun : algorithme Dancing Links (DLX) de Knuth / Algorithm X pour la couverture exacte (exact cover), applique a un mini-Sudoku 4x4. Meme concept mathematique (matrice binaire de couverture, selection de colonnes a cardinalite minimale, unlinking/relinking des noeuds), meme cas d'application (mini-Sudoku 4x4), meme exercice pedagogique (construire la matrice de couverture, stub TODO)."
    - "Divergence d'implementation : le C# delegue a la lib DlxLib (NuGet `#r \"nuget: DlxLib\"`, classe `DancingLinkSolver : ISudokuSolver` qui wrappe le solveur de la lib, importe le socle `Sudoku-00-Environment-CSharp.ipynb`) ; le Python implemente Dancing Links ENTIEREMENT from scratch (`class DancingLinksNode` a 4 voisins gauche/droite/haut/bas + `class DancingLinks` construisant la matrice creuse et executant l'Algorithm X de Knuth manuellement). Meme algorithme, deux niveaux d'abstraction : lib industrielle cote C# vs reconstruction pedagogique a la main cote Python."
    - "Asymetrie structurelle : Python 12 cellules code / 21 markdown (implementation complete from scratch + docstring algorithmique detaillee) ; C# 10 cellules code / 16 markdown (wrapper DlxLib + exercice BuildMiniSudokuMatrix). Idiomes framework : C# = DlxLib + System.*, Python = stdlib (typing, dataclasses), 0 dependance numerique."
    - "2026-10-11 (grain REPAIR/MED notebook-python #20356, myia-po-2027:CoursIA-2) : normalisation C.1 du stub d'exercice booleen cote Python -- `return False  # TODO` devient `return None  # TODO`. Le jumeau C# n'est PAS touche : sa convention de stub est `return null; // TODO` partout ou le type le permet (Dictionary, objets), et `return false;` / `return 0;` la ou le type l'interdit -- bool et int ne sont pas nullables en C#. C'est une contrainte de langage, pas une divergence pedagogique : la serie C# entiere porte ces litteraux (Sudoku-09 cell27, Sudoku-12 cell37/41, Sudoku-18 cell23, entre autres). Les DEUX cotes restent des exercices NON IMPLEMENTES ; seul le litteral de retour a change cote Python, d'un resultat fabrique vers une absence explicite. Le blob SHA Python deplace dans l'audit ci-dessus est l'artefact de cette normalisation, pas une derive de l'algorithme enseigne."
