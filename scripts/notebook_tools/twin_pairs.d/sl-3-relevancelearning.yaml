  bridge_verdict_reason: "Python = BCL from-scratch pour determinations fonctionnelles + treillis des determinations + MINIMAL-CONSISTENT-DET + lien Web Semantique + defi presentation ; application phare = selection d'attributs guidee, faite avec **sklearn** (`mutual_info_classif`, cellule 21). C# = BCL .NET from-scratch (`HashSet<T>` + `Dictionary<TKey,TValue>` + powerset via combinatoire) pour determinations + treillis (powerset) + determination minimale + application activite biologique des molecules + borne PAC quantifiee + information mutuelle (section 7). Verdict initial RECOVERABLE-LOCAL (2026-08-04) : le coeur pedagogique (RBL) est paritable des deux cotes, l'asymetrie residait dans les enrichissements distincts (Web Semantique cote Python, borne PAC + MI cote C#). Verdict REVOQUE par la tranche 2 (epic #10382, 2026-08-15) : le twin Python selectionne les attributs avec sklearn (lib de reference) ; le twin C# branche le pendant .NET de production — **Microsoft.ML** (`PermutationFeatureImportance`, PFI, Breiman 2001) — sur le meme jeu `moleculeData` (section 9) : foret gradient-boostee FastTree, chute d'AUC par permutation d'attribut (PFI agrege sur 5 seeds MLContext, top-2 {logp, mw} stable 5/5), rang confronte a l'information mutuelle from-scratch et a la determination minimale `{mw, logp}` (concordance top-2, 5/5 seeds). Axes binding #10459 : NuGet .NET = le canal (Microsoft.ML 5.0.0 + Microsoft.ML.FastTree 5.0.0, pas de reimplementation), P/Invoke N/A, CLI N/A, IKVM N/A, PythonNet N/A. Le from-scratch est conserve (sections 4 et 7 gardent leur valeur pedagogique : comment la MI se calcule, pourquoi la determination minimale est une contrainte logique). `parity_level: native-both` (les deux jumeaux referencent un moteur d'apprentissage de production : sklearn cote Python, ML.NET cote C#)."
  known_differences:
    - "Socle commun : Relevance-Based Learning (RBL) approfondi -- determinations fonctionnelles, treillis des determinations, algorithme MINIMAL-CONSISTENT-DET, selection d'attributs guidee."
    - "Asymetrie de couverture : Python (42 cellules, 17 code) couvre determinations + treillis + MINIMAL-CONSISTENT-DET + lien Web Semantique + defi presentation ; C# (26 cellules, 12 code) couvre determinations + treillis (powerset) + determination minimale + application activite biologique + borne PAC + information mutuelle + pont ML.NET (section 9). Les deux cotes apportent des enrichissements distincts (Web Semantique cote Python, borne PAC cote C#)."
    - "Application phare : Python sur selection d'attributs via sklearn (`mutual_info_classif` sur jeu synthetique R1..R2 + N1..N8) ; C# sur activite biologique des molecules (10 molecules, mw/logp/hbd/hba) via MI from-scratch + pont ML.NET PFI (FastTree). Les deux classent les attributs pertinents ; le C# confronte le rang ML.NET (top-2 {logp, mw} stable 5/5 seeds) a la determination minimale `{mw, logp}` (concordance)."
    - "Selection d'attributs : sklearn (Python, statistique MI) vs ML.NET (C#, PFI sur foret FastTree) — deux instruments differents (mesure statistique vs importance modele-basee par permutation) qui repondent a la meme question et convergent sur le meme top-2 {logp, mw} (epic #10382, tranche 2)."
    - "Normalisation de rendu markdown (2026-08-28, PR #13272, cibles #13266) : conversion des separateurs decoratifs ```---``` en ```***``` (anti setext-heading), cote(s) touche(s) : Python (10 cellules separateurs) / C# (2 cellules separateurs). Changement purement cosmetique : sources des cellules code byte-identiques, substance pedagogique inchangee (spot-audit main<->HEAD)."
    - "Fix du choix du temoin de violation (2026-09-06, issue #14837) : le diagnostic de determination exhibait comme temoin deux lignes QUI S'ACCORDENT sur la cible (ex. Cu high vs Cu high), ce qui ne demontre pas une violation ; on conserve desormais la PREMIERE paire reellement en conflit (deux lignes qui different sur la cible). Fix symetrique Python (cellule 4, check_determination) et C# (cellule 3, CheckDetermination) pour la parite de contenu, plus recadrage du docstring functional_violations (Python cellule 26) et d'un encart metadonnees (cellule 25). Notebooks re-executes AVEC outputs ; sources des autres cellules inchangees."
