  bridge_verdict_reason: "Le 15-puzzle et l'A* admissible sont reconstruits from-scratch des deux cotes : Python en numpy autonome (pas d'ortools, pas de deap) sur des etats tuples immuables, C# en BCL pure 0 NuGet avec l'etat encode en 4 bits par case dans un `ulong`. Aucun moteur SOTA partage n'est invoque ni invocable a la place des deux implementations : le sujet pedagogique EST l'ecriture de la recherche informee, pas l'appel a un solveur. Les DEUX jumeaux couvrent les memes cinq sections (espace d'etats, invariant de parite des inversions, Manhattan et linear conflict, mesure noeuds x longueur contre glouton, trois exercices) avec les MÊMES trois exercices. Verdict SOTA-OK : le from-scratch est la contrepartie attendue (bucket 3 de #10382), et l'asymetrie de representation de l'etat (tuples Python vs `ulong` C#) est un idiome de langage, pas une asymetrie de couverture moteur."
  known_differences:
    - "Audit de parite 2026-11-06 (myia-ai-01:CoursIA-2, #23020) : derive cote C# SEUL, cote Python byte-identique a main (content_python_sha inchange). DEUX mutations successives du cote C# mesurees contre le blob atteste (18 cellules -> 18 cellules, 3369 -> 3730 mots) : (1) #23268 (2026-10-31, a1f0fac98d26c) -- 9 cellules markdown modifiees, **identiques aux accents pres** (comparaison NFD sans diacritiques : egalite stricte), 0 cellule de code et 0 sortie touchee, correction typographique pure ; (2) #24473 (2026-11-04, bd5d53b1129a) -- **correction de fond** : la troisieme recherche du tableau de mesure n'etait pas l'A* pondere (w=2) que l'enonce annoncait, mais le **glouton** (f = h). Le carnet C# a recu la fonction `Greedy()` (file prioritaire sur h(s) seul), la colonne 'A* pondere (w=2)' du tableau est devenue 'Glouton (h seul)', le controle `pondereDegrade` est devenu `gloutonDegrade`, et 2 cellules de markdown (8 et 17) ont ete reecrites. Sorties re-executees (9/9 cellules de code, kernel .net-csharp, runtime .NET 10.0.8 -- le run precedent affichait 10.0.13) : profondeur 20 -> 92 noeuds developpes pour un cout moyen de 26 (A* Manhattan : 80 noeuds, cout 17) ; profondeur 40 -> 1127 noeuds pour 123 (A* Manhattan : 36428 noeuds, cout 31) ; profondeur 60 -> 636 noeuds pour 82 (A* Manhattan : 40814 noeuds, cout 32) ; profondeur 80 -> 1951 noeuds pour 151 (A* Manhattan : 160948 noeuds, cout 36). Verification finale : le glouton degrade le cout sur au moins un puzzle (True). Le glouton developpe MOINS de noeuds aux profondeurs 40, 60 et 80 mais davantage a profondeur 20 (92 contre 80) : l'effet n'est donc pas uniforme, ce que la prose du carnet dit au lieu de le lisser. Effet de parite : #24473 **restore la parite de fond** -- le cote Python mesurait deja un glouton (f = h) comme contraste non admissible, le cote C# mesurait un A* pondere, une famille distincte ; les deux cotes contrastent desormais l'A* admissible avec le glouton. Difference residuelle **declaree** : le carnet C# conserve un troisieme exercice sur l'A* pondere (son exercice 3, ecart d'optimalite d'un A* pondere) et le dit lui-meme dans son dernier paragraphe (une famille distincte du glouton mesure au paragraphe 4), alors que l'exercice 3 du cote Python porte sur la perte d'optimalite du glouton. Attestation d'une asymetrie declaree et d'une parite de fond retablie, pas reparation. L'entree d'audit correspondante est datee du 2026-11-06 : elle remplace celle du 2026-11-03, qui n'a jamais ete publiee et dont les empreintes C# etaient deja perimees au moment de la livraison."
    - "Representation de l'etat : Python = tuples immuables hachables (idiome collections/typing) ; C# = encodage 4 bits par case dans un `ulong` (idiome BCL, pas de dependance). Meme espace d'etats (S, s0, A, T, G), meme definition des successeurs."
    - "Le carnet C# declare expliciter l'encodage en `ulong` comme motif de performance BCL ; le carnet Python s'appuie sur les tuples et laisse numpy porter les mesures. Aucun des deux n'introduit de bibliotheque de recherche."
    - "Le carnet Python porte l'expose de mesure le plus detaille (diagramme noeuds x profondeur, echelle log) ; le C# reste compact et renvoie au carnet Python pour le protocole experimental, dont il reproduit les sections."
