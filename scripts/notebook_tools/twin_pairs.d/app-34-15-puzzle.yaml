  bridge_verdict_reason: "Le 15-puzzle et l'A* admissible sont reconstruits from-scratch des deux cotes : Python en numpy autonome (pas d'ortools, pas de deap) sur des etats tuples immuables, C# en BCL pure 0 NuGet avec l'etat encode en 4 bits par case dans un `ulong`. Aucun moteur SOTA partage n'est invoque ni invocable a la place des deux implementations : le sujet pedagogique EST l'ecriture de la recherche informee, pas l'appel a un solveur. Les DEUX jumeaux couvrent les memes cinq sections (espace d'etats, invariant de parite des inversions, Manhattan et linear conflict, mesure noeuds x longueur contre glouton, trois exercices) avec les MÊMES trois exercices. Verdict SOTA-OK : le from-scratch est la contrepartie attendue (bucket 3 de #10382), et l'asymetrie de representation de l'etat (tuples Python vs `ulong` C#) est un idiome de langage, pas une asymetrie de couverture moteur."
  known_differences:
    - "Audit de parite 2026-11-03 (myia-ai-01:CoursIA-2, #23020) : derive cote C# SEUL, cote Python byte-identique a main. Mesure contre le blob enregistre : 18 cellules -> 18 cellules, 9 cellules markdown modifiees, **identiques aux accents pres** (comparaison NFD sans diacritiques : egalite stricte, 3369 mots avant et apres), 0 cellule de code et 0 sortie touchee. Cause unique : #23268 (accentuation complete du markdown des trois carnets Part3). Correction typographique pure : la lecture des deux cotes est inchangee, aucun nombre en jeu. Attestation (le blob SHA se deplace), pas reparation."
    - "Representation de l'etat : Python = tuples immuables hachables (idiome collections/typing) ; C# = encodage 4 bits par case dans un `ulong` (idiome BCL, pas de dependance). Meme espace d'etats (S, s0, A, T, G), meme definition des successeurs."
    - "Le carnet C# declare expliciter l'encodage en `ulong` comme motif de performance BCL ; le carnet Python s'appuie sur les tuples et laisse numpy porter les mesures. Aucun des deux n'introduit de bibliotheque de recherche."
    - "Le carnet Python porte l'expose de mesure le plus detaille (diagramme noeuds x profondeur, echelle log) ; le C# reste compact et renvoie au carnet Python pour le protocole experimental, dont il reproduit les sections."
