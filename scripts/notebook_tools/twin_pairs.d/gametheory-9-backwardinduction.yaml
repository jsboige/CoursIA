  known_differences:
    - "Socle pedagogique commun : l'algorithme d'induction en arriere (backward induction) pour resoudre les jeux sequentiels et calculer les equilibres de sous-jeu parfait (SPE, Selten 1965), applique aux paradoxes canoniques : jeu du mille-pattes (Centipede Game), guerre d'usure (War of Attrition), paradoxe de la chaine de magasins (Chain-Store paradox, Selten 1978). Distinct du GT-7 ExtensiveForm (qui pose la formalisme extensive-form + reduction extensive-vers-normale) : le GT-9 centre l'algorithme d'induction arriere et les paradoxes qu'il fait surgir."
    - "2026-08-11 (ai-01) : correction d'honnetete -- l'entree precedente creditait `networkx` de l'arbre de jeu cote Python. C'etait un import MORT (zero reference `nx.`), retire par #10438. L'arbre de jeu est from-scratch DES DEUX COTES ; il n'y a jamais eu d'asymetrie de librairie de graphes ici. Le defaut d'origine : l'entree a ete redigee depuis la LISTE D'IMPORTS, pas depuis les appels. Cf #10382 §2."
    - "Idiomes framework : Python = `numpy` + `matplotlib` (rendu graphique des arbres et des trajectoires d'induction) + `@dataclass` + implementation manuelle de l'induction arriere. C# = **BCL .NET pur 0 NuGet** (modele d'arbre de jeu from-scratch + section dediee « Visualisation ASCII de l'arbre de jeu » en sortie console). Asymetrie de RENDU restante et actionnable : matplotlib cote Python vs ASCII cote C#, alors que ScottPlot est disponible et deja en service dans le depot (CSP-8-Csharp) -- candidat de grain, sous reserve du jugement 'l'arbre ASCII est-il une forme pedagogique deliberee ?'."
    - "Asymetrie de couverture pedagogique : le C# (26 cellules, 10 sections) couvre davantage de paradoxes explicitement (entree sur marche, Centipede, War of Attrition, Chain-Store + efficacite/rationalite limitee + viz ASCII) ; le Python (35 cellules, 7 sections + 4 exercices) detal l'algorithme, les limites de l'induction arriere et un resume. Meme theorie (Selten 1965 SPE, Selten 1978 Chain-Store), structuration pedagogique differente (Python focalise algorithme+limites, C# focalise catalogage des paradoxes + viz ASCII)."
    - "2026-08-17 (po-2023, spot-audit regle 4 lors de la tranche densite #11224 markdown-only C#) : asymetrie PRE-EXISTANTE observee sur la sortie War of Attrition -- Python commit `Gains a l'equilibre: (8, 0)` vs C# commit `[9.00, -0.00]`, memes parametres affiches (V=10, c=1, max_rounds=5). Cause structurelle, pas un bug d'execution : le builder Python `create_war_of_attrition` facture a J1 un cout de combat c SUPPLEMENTAIRE au tour du quit de J2 (`j2_quit` payoffs `(V - accumulated_cost_1 - c, -accumulated_cost_2)`), construction absente du builder C#. Les autres sorties convergent (entry (1,1) vs [1.00,1.00], centipede (1,0) vs [1.00,0.00]). La prose C# ajoutee par #11224 ancre sur la sortie C# et SIGNALE la divergence dans sa section Resume. Verdict par le checker : DRIFT_INTRODUCED=0 au rebaseline. Harmonisation de la structure des couts = candidat grain separe (hors scope markdown-only)."
