  known_differences:
    - "Socle pedagogique commun : jeux a somme nulle, theoreme minimax (valeur du jeu v), strategies mixtes optimales sigma/tau via programmation lineaire."
    - "parite lib-vs-lib native-both (#10382) : chaque cote atteint un moteur LP de production de son ecosysteme. Python = `scipy.optimize.linprog` + nashpy. C# = `Google.OrTools.LinearSolver` solveur GLOP (NuGet, deja en service dans CSP-4/6/8) en Tranche 2 + `gambit-lp.exe` (McKelvey-McLennan-Turocy 2016, GPL-2.0, externe) en Tranche 3 via Process.Start. TROIS moteurs LP convergeant sur la meme valeur de jeu et la meme strategie (Matching Pennies v=0 sigma=[0.5,0.5] ; RPS v=0 sigma=[1/3,1/3,1/3] ; asymetrique 2x2 v=0.714 sigma=[0.571,0.429], |delta v| <= 2e-16 cross-tranches), capture dans les cellules `8b4e1d23` (Tranche 1 vs Tranche 2) et `98a90823` (Tranche 1 vs Tranche 2 vs Tranche 3)."
    - "Tranche 1 preservee byte-identique : le simplexe de Dantzig from-scratch (`SimplexMax` + regle de Bland anti-cyclage + `SolveMatrixGame` formulation Col+duales) reste comme moteur pedagogique, en PLUS du Glop industriel (Tranche 2) et de Gambit (Tranche 3). Mandat user : from scratch EN PLUS, jamais A LA PLACE. Croisement strict : trois moteurs (Dantzig vs Glop vs Gambit) ET deux formulations (Col+duales vs Row directe) donnent le meme resultat = controle le plus exigeant qu'on puisse ecrire sur ce theoreme."
    - "Tranche 3 (Gambit CLI) : serialisation du jeu en format `.nfg` Gambit (NFG 1 R \"...\" { \"Row\" \"Col\" } { m n } + 2*m*n payoffs en convention j-i lex par `ToNfg`), invocation `gambit-lp.exe -q -d 6 <tmp.nfg>` par Process.Start, parsing CSV des lignes `NE,p1,...,pm,c1,...,cn` en tuples (sigma, tau) par `RunGambitLP`. Binaire cherche a `%LOCALAPPDATA%\\Gambit\\Gambit\\gambit-lp.exe` puis fallback Program Files x86 (portable cross-machine, precedent GT-10 cell 8). Cross-validation trois-moteurs (Tranche 1 vs Tranche 2 vs Tranche 3) sur mp/rps/asym : toutes les valeurs et strategies coincident au epsilon machine (max |delta v| = 2.22e-16 sur asym 2x2), sanity check zero-sum sigma' B tau == -v OK sur les trois jeux. Gate nashpy INTRINSIC LEVE par ai-01 msg-20260812T112529-87ciq6 : Gambit CLI = bucket-2 invocable (meme raisonnement que Planners-4 Fast Downward dans #10401/#10413), bucket-2 / bucket-3 frontiere d'invocabilite pas de langage."
