  known_differences:
    - '2026-08-31 : ATTESTATION UNILATERALE (PR #13659, lane myia-ai-01:CoursIA) -- reparation d''echappements JSON manges dans le markdown du cote C#. CAUSE : dans le .ipynb, la sequence dollar-\bot-dollar ecrite avec UN SEUL antislash est lue par le parseur JSON comme l''echappement \b (backspace, U+0008) ; la source chargee porte un caractere de controle et le notebook rend un dollar-ot-dollar prive de sa commande LaTeX. FIX : doubler l''antislash (\\bot). Le DRIFT est UNILATERAL parce que le DEFAUT l''est : la contrepartie GameTheory-05-ZeroSum-Minimax.ipynb (Python), 19 cellules markdown, a ete scannee sous controle positif (le litteral defectueux passe a json.loads doit rendre U+0008 -- assertion verifiee avant le scan) et ne porte AUCUN caractere de controle U+0008/U+000B/U+000C. Il n''y a donc rien a reparer de ce cote : l''attestation ne consacre aucune asymetrie de contenu. PORTEE DU DIFF cote repare (comparaison des JSON parses origin/main -> HEAD) : markdown uniquement, 0 cellule code touchee, 0 sortie modifiee, 0 execution_count deplace, 0 cellule ajoutee ou retiree.'
    - "Socle pedagogique commun : jeux a somme nulle, theoreme minimax (valeur du jeu v), strategies mixtes optimales sigma/tau via programmation lineaire."
    - "parite lib-vs-lib native-both (#10382) : chaque cote atteint un moteur LP de production de son ecosysteme. Python = `scipy.optimize.linprog` + nashpy. C# = `Google.OrTools.LinearSolver` solveur GLOP (NuGet, deja en service dans CSP-4/6/8) en Tranche 2 + `gambit-lp.exe` (McKelvey-McLennan-Turocy 2016, GPL-2.0, externe) en Tranche 3 via Process.Start. TROIS moteurs LP convergeant sur la meme valeur de jeu et la meme strategie (Matching Pennies v=0 sigma=[0.5,0.5] ; RPS v=0 sigma=[1/3,1/3,1/3] ; asymetrique 2x2 v=0.714 sigma=[0.571,0.429], |delta v| <= 2e-16 cross-tranches), capture dans les cellules `8b4e1d23` (Tranche 1 vs Tranche 2) et `98a90823` (Tranche 1 vs Tranche 2 vs Tranche 3)."
    - "Tranche 1 preservee byte-identique : le simplexe de Dantzig from-scratch (`SimplexMax` + regle de Bland anti-cyclage + `SolveMatrixGame` formulation Col+duales) reste comme moteur pedagogique, en PLUS du Glop industriel (Tranche 2) et de Gambit (Tranche 3). Mandat user : from scratch EN PLUS, jamais A LA PLACE. Croisement strict : trois moteurs (Dantzig vs Glop vs Gambit) ET deux formulations (Col+duales vs Row directe) donnent le meme resultat = controle le plus exigeant qu'on puisse ecrire sur ce theoreme."
    - "Tranche 3 (Gambit CLI) : serialisation du jeu en format `.nfg` Gambit (NFG 1 R \"...\" { \"Row\" \"Col\" } { m n } + 2*m*n payoffs en convention j-i lex par `ToNfg`), invocation `gambit-lp.exe -q -d 6 <tmp.nfg>` par Process.Start, parsing CSV des lignes `NE,p1,...,pm,c1,...,cn` en tuples (sigma, tau) par `RunGambitLP`. Binaire cherche a `%LOCALAPPDATA%\\Gambit\\Gambit\\gambit-lp.exe` puis fallback Program Files x86 (portable cross-machine, precedent GT-10 cell 8). Cross-validation trois-moteurs (Tranche 1 vs Tranche 2 vs Tranche 3) sur mp/rps/asym : toutes les valeurs et strategies coincident au epsilon machine (max |delta v| = 2.22e-16 sur asym 2x2), sanity check zero-sum sigma' B tau == -v OK sur les trois jeux. Gate nashpy INTRINSIC LEVE par ai-01 msg-20260812T112529-87ciq6 : Gambit CLI = bucket-2 invocable (meme raisonnement que Planners-4 Fast Downward dans #10401/#10413), bucket-2 / bucket-3 frontiere d'invocabilite pas de langage."
    - '2026-09-01 : ENRICHISSEMENT MARKDOWN-ONLY COTE C# (commit 2e899098c8c, lane myia-po-2027:CoursIA) -- densite d''interpretation 890 -> 1217 c/cell (seuil 1200). AJOUT de 6 cellules markdown « Lecture du resultat » qui lisent les valeurs commitees : maximin/minimax en pur (gap 2,0, pas de point-selle) ; point-selle valeur 5 en (R2,C2) ; cross-validation 3 moteurs (max |delta v| <= 1.3e-12) ; strategies mixtes uniformes [0,5]/[1/3] ; valeur 5/7 et croisement p=4/7 du balayage asymetrique ; dualite forte v=w. La contrepartie GameTheory-05-ZeroSum-Minimax.ipynb (Python) porte DEJA des cellules d''interpretation equivalentes aux points de calcul correspondants (cellules 6/10/14/20 : absence de point-selle, resolution par programmation lineaire, visualisation du theoreme, strategie optimale du Colonel Blotto). Le DRIFT est COTE C# UNIQUEMENT parce que le DEFICIT d''interpretation l''est : cette PR ALIGNE le cote C# sur la couverture deja presente chez son jumeau Python, elle ne cree donc aucune asymetrie de contenu nouvelle -- elle resorbe au contraire l''ecart de couverture entre les deux cotes. La parite lib-vs-lib native-both n''est PAS affectee (les cellules de calcul Tranche 1/2/3 sont inchangees). PORTEE DU DIFF (comparaison des JSON parses origin/main -> HEAD) : markdown uniquement, 0 cellule code touchee, 0 sortie modifiee, 0 execution_count deplace, 6 cellules ajoutees.'
