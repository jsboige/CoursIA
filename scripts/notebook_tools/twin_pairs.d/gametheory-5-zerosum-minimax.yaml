  known_differences:
    - "Socle pedagogique commun : jeux a somme nulle, theoreme minimax (valeur du jeu v), strategies mixtes optimales sigma/tau via programmation lineaire."
    - "parite lib-vs-lib native-both (#10382) : chaque cote atteint un moteur LP de production de son ecosysteme. Python = `scipy.optimize.linprog`. C# = `Google.OrTools.LinearSolver` solveur GLOP (NuGet, deja en service dans CSP-4/6/8), invoque en Tranche 2 (`SolveMinimaxOrTools`, formulation Row directe max v s.c. A^T sigma >= v, sum sigma = 1). Les DEUX moteurs convergent sur la meme valeur de jeu et la meme strategie (Matching Pennies v=0 sigma=[0.5,0.5] ; RPS v=0 sigma=[1/3,1/3,1/3] ; asymetrique 2x2 v=0.714 sigma=[0.571,0.429], |delta v| = 2e-16)."
    - "Tranche 1 preservee byte-identique : le simplexe de Dantzig from-scratch (`SimplexMax` + regle de Bland anti-cyclage + `SolveMatrixGame` formulation Col+duales) reste comme moteur pedagogique, en PLUS du Glop industriel (Tranche 2). Mandat user : from scratch EN PLUS, jamais A LA PLACE. Croisement strict : deux moteurs (Dantzig vs Glop) ET deux formulations (Col+duales vs Row directe) donnent le meme resultat = controle le plus exigeant qu'on puisse ecrire sur ce theoreme."
