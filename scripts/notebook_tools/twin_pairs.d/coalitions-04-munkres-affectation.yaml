  family: GameTheory/.NET-Parity
  python: MyIA.AI.Notebooks/GameTheory/Coalitions/Coalitions-04-Munkres-Affectation-Python.ipynb
  csharp: MyIA.AI.Notebooks/GameTheory/Coalitions/Coalitions-04-Munkres-Affectation-CSharp.ipynb
  parity_level: semantic
  bridge_verdict: SOTA-OK
  bridge_verdict_reason: "Le contenu pedagogique est l'algorithme de Kuhn-Munkres from scratch (labels, graphe d'egalite, arbres hongrois, resserrement delta), implante a la main des deux cotes. Le moteur externe de la source Python, scipy.optimize.linear_sum_assignment, n'est PAS le sujet du carnet mais son oracle de confrontation (cellule 7, 50 instances) et son solveur de sous-matrices rectangulaires (cellule 14, valeur_coalition) ; il n'existe pas d'equivalent canonique en BCL .NET. Le jumeau C# remplace ces deux usages par l'enumeration exacte des permutations (force brute lexicographique, reference exacte par construction aux tailles n<=6 employees) : confrontations 50 instances 6x6 (max |KM - brute| = 0), surplus optimal par enumeration directe, valeur de coalition par backtracking sur les matchings partiels du rectangle. Toutes les valeurs ancrees coincident avec les sorties commitees du Python : optimum 13 / permutation [1, 0, 2, 3], dualite (viol 0, primal = dual = 13, gap 0, aretes d'egalite), surplus 23 = 4*9 - 13, U dans [6, 9], 254 coalitions, 0 violations du coeur, efficacite 23, Gale-Shapley fil rouge 13 = KM, instance divergente citee GS = 12 vs KM = 9 (+3). Verdict SOTA-OK : l'oracle de substitution est exact par construction (enumeration), aucune valeur approximee, aucune figure."
  known_differences:
    - "Oracle de confrontation : Python appelle scipy.optimize.linear_sum_assignment (Jonker-Volgenant) ; C# enumere exhaustivement les permutations (reference exacte, n! enumere aux tailles du carnet). Verdict de coincidence identique : valeur et affectation [1, 0, 2, 3] egales sur le fil rouge, max |KM - reference| = 0 sur 50 instances 6x6."
    - "Valeur de coalition (cellule 14) : Python resout le rectangle agents(S) x vendeurs(S) par scipy sur la sous-matrice ; C# backtracking sur les matchings partiels du rectangle (chaque agent seul ou apparie a un vendeur distinct de la coalition), exact aux tailles du jeu (2n = 8 joueurs, rectangles <= 4x4)."
    - "Arithmetique : les deux cotes travaillent en entiers ; C# type tout en System.Numerics.BigInteger (BCL seulement, 0 NuGet) et pose une assertion executable Verifier qui leve si une valeur ancree differe (27 au total), la ou le Python imprime des valeurs et booleens sans levee d'exception."
    - "Le scan aleatoire multi-instances (cellule 7, graine 42) et le scan de divergence Gale-Shapley (cellule 18, graine 7) utilisent System.Random fixe (numpy PCG64 non reproducible en BCL) : les assertions portent les proprietes (max ecart = 0, divergences rapportees honnetement) et les valeurs exactes sont portees par le fil rouge deterministe et l'instance divergente citee (CITE : matrice rapportee par la sortie commitee du Python, essai 1 graine 7, GS = 12 vs KM = 9)."
    - "Les trois exercices sont des stubs compilables a TODO etudiant cote C# (retour null neutre, affichage '(a completer)') ; aucune solution revelee d'un cote ni de l'autre."
