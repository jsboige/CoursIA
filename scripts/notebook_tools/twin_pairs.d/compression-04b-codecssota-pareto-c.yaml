- name: "Compression-04b-CodecsSOTA-Pareto C#"
  family: InformationCalcul/Compression
  python: MyIA.AI.Notebooks/InformationCalcul/Compression/Compression-04b-CodecsSOTA-Pareto-Python.ipynb
  csharp: MyIA.AI.Notebooks/InformationCalcul/Compression/Compression-04b-CodecsSOTA-Pareto-CSharp.ipynb
  parity_level: native-both
  bridge_verdict: SOTA-OK
  bridge_verdict_reason: "Les deux cotes mesurent des moteurs de compression de production, sans reimplementation : Python = zlib/bz2/lzma de la bibliotheque standard plus zstandard, brotli et lz4 ; C# = ZLibStream et BrotliStream de la BCL, SharpZipLib 1.4.2, LZMA-SDK 22.1.1, ZstdSharp 0.7.2 et K4os.Compression.LZ4.Streams 1.3.8. Chaque appel de compression et de decompression passe par l'API publique du moteur, et l'aller-retour est verifie octet pour octet par assertion dans les deux carnets."
  known_differences:
    - "Moteurs differents par cote, tous de production : les flux compresses different donc par construction (les empreintes sha256 publiees ne coincident pas). Sur le texte, les taux mesures different au plus de 0,0029 bits/octet : zlib -9 a 3,1393 cote C# contre 3,1364 cote Python, lzma -6 a 2,8451 contre 2,8479 ; les cinq derniers codecs (bz2 -9, brotli -11, zstd -19, brotli -5, zstd -3) sont egaux a 4 decimales, et les deux lz4 -16 et lz4 (defaut) different de 0,0005, ce qui correspond aux 8 octets de trame en moins (cf. ci-dessous). Aucune identite des flux n'est annoncee, seule la restitution est exigee."
    - "Les debits ne se comparent pas entre les deux carnets : ils dependent de la machine, du binding et du moment. Le decodage mesure cote C# est plus lent que celui enregistre cote Python (zlib -9 : 62,06 contre 90,20 Mo/s ; lz4 (defaut) : 119,62 contre 1558,20). Consequence documentee dans la prose des deux carnets : le front de decodage n'a pas les memes membres — zstd -3 y entre cote Python (239,39 Mo/s, au-dessus des 90,20 de zlib -9) et en sort cote C# (58,03, sous les 62,06 de zlib -9) — alors que les taux, eux, sont identiques. Le carnet ne conclut rien d'un comptage de membres : il retient que deux fronts distincts existent et que leur intersection est strictement plus petite que chacun."
    - "Le corpus `structure` est genere par MathF.Sin/MathF.Cos cote C# et par numpy float32 cote Python : les deux suites different a l'ulp sur une partie des 32 768 valeurs, l'entropie vaut 7,2350 contre 7,2354 bits/octet, et les taux compresses sur ce corpus different au plus de 0,0489 bits/octet (brotli -11 : 6,2302 contre 6,1813). Le texte, extrait du meme fichier et identique octet pour octet (sha256 248fb4ec...), et les octets aleatoires equivalents (sha256 222c8aa4...) donnent des taux egaux a 4 decimales pour six codecs sur neuf."
    - "Deux conteneurs different. lzma cote C# utilise le conteneur ALONE (proprietes puis taille explicite sur 8 octets) la ou lzma.compress de Python produit par defaut un conteneur .xz. lz4 cote C# utilise la trame K4os, plus courte de 8 octets que celle de lz4.frame : les taux lz4 -16 et lz4 (defaut) different exactement de 0,0005 bit/octet sur 131 072 octets, soit 8 octets. Sur l'incompressible, lzma -6 depasse 8 bits/octet de +0,1133 cote C# contre +0,0078 cote Python : cet ecart est celui de l'en-tete du conteneur, pas du moteur."
    - "La figure du front d'encodage est rendue par ScottPlot 5.0.55 en SVG, non par matplotlib : la ligne de reference de bz2 -9 y est visible alors qu'elle sort du cadre cote Python (limite d'axe abaissee pour la contenir), les etiquettes sont replacees par un placement sans chevauchement, et l'axe des abscisses est lineaire en log10 du debit avec des graduations ecrites en clair (1, 10, 100). Les coordonnees, les appartenances au front et les valeurs affichees sont celles des tableaux."
    - "Portage C# de Compression-04b-CodecsSOTA-Pareto-Python.ipynb : 33 cellules, 12 cellules de code executees en sequence sur noyau .net-csharp (execution_count 1 a 12), zero erreur. Le carnet Python ne recoit que la ligne de navigation [Version C#], sans re-execution (changement markdown seul, C.2). Premiere attestation ecrite par check_twin_parity.py --update apres le commit du carnet, en DERNIERE operation (cf #8957)."