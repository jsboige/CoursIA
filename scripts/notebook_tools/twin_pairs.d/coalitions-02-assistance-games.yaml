bridge_verdict_reason: "Paire #28654 : jumeau C# de Coalitions-02 (assistance games) cree depuis le carnet Python. Census moteur : CS = BCL .NET pur, 0 NuGet, 0 reseau (instance jouet, oracle en hindsight et EXP3 reimplemente a la main) ; PY = bibliotheque standard + numpy (meme instance, meme algorithme). Modele solver-free par conception : le carnet ENSEIGNE un resultat d'assistance games sur une instance jouet, il ne resout pas un probleme externe ; aucun moteur SOTA (Z3, OR-Tools) n'est pertinent pour un bandit manchot a trois bras, et l'oracle en hindsight est un calcul direct sur une instance finie. Verification firsthand : les deux cotes rejouent les MEMES entrees (sequences theta citees, graine 42) et retrouvent les MEMES valeurs pour l'oracle (0.7 de recompense par tour, 14.000 sur T=20), chaque valeur portee par une assertion executable ; les valeurs de l'apprenant dependent du generateur pseudo-aleatoire et sont comparees a la reference Python sous une bande de trois sigma declaree. --update en DERNIERE operation (cf #8957)."
known_differences:
  - "2026-11-26 (myia-po-2026:CoursIA-2, #28654) : portage C# du carnet Coalitions-02 cree depuis le carnet Python (code ET sorties), meme plan de 19 cellules et memes entrees. L'oracle en hindsight est EXACT : la sequence theta(t) du jumeau Python (graine 42) est reprise comme DONNEE CITEE, jamais recalculee, et l'oracle recalcule en C# vaut 0.7 par tour (14.000 sur T=20) comme en Python -- assertion executable. L'apprenant EXP3 differe : le flux pseudo-aleatoire .NET n'est pas le PCG64 de numpy, donc la moyenne mesuree (10.486 +/- 0.685 sur dix graines) differe de la reference Python (10.218 +/- 0.661) sans que l'ecart ne depasse la bande de trois sigma declaree sur l'estimateur de moyenne ; la meme comparaison a tolerance est appliquee aux quatre horizons du banc (regrets mesures 1.776 / 3.514 / 7.537 / 15.158 contre 1.960 / 3.782 / 7.426 / 14.140 cites). Deux assertions structurelles independantes du generateur viennent etayer la parite : le regret par tour reste borne par la meilleure action independante de theta (50/90 par tour), et l'exposant log-log mesure (1.05) reste dans le regime quasi lineaire et encadre l'exposant cite (0.95). numpy/matplotlib deviennent des double et un rendu texte (le jumeau C# ne produit pas de figure PNG) : le profil du regret est affiche en tableau, avec les deux courbes de reference du papier donnees pour comparaison -- elles decrivent d'autres algorithmes et ne sont pas opposees au regret mesure. Les trois exercices deviennent des stubs compilables `// TODO etudiant` sans solution ni indice. Cote Python : edition markdown uniquement (cellule 0, arete entrante `[Version C#]`) -- 0 cellule de code, 0 sortie, 0 execution_count touchees (exception C.2, pas de re-execution due). Cout d'execution : kernel `.net-csharp`, BCL seule, aucun NuGet, aucun alea ; banniere probeAddresses supprimee par strip_probe_banner.py apres re-execution."
