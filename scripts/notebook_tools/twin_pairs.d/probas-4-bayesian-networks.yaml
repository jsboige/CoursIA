  known_differences:
  - 'Socle pedagogique commun : reseaux bayesiens (DAG de dependances conditionnelles) modelise dans les deux stacks.'
  - 'Moteurs d''inference distincts : C# Infer.NET = inference deterministe approchee (Expectation Propagation / Variational
    Message Passing, modele compile en code d''inference) ; Python PyMC = echantillonnage MCMC (NUTS/HMC par defaut) + ADVI
    (variationnel) sur backend PyTensor. Memes concepts, paradigmes d''inference differents.'
  - 'Diagnostic EP non conjugue (section 4.bis, regression logistique bayesienne) : cote C# uniquement. L''analogue PyMC
    serait l''echec de convergence ADVI (ou la sensibilite au point de depart de NUTS) sur un prior vague, non traite ici.'
