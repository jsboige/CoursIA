- name: "GenAI SK08 MCP"
  family: GenAI/SemanticKernel
  python: MyIA.AI.Notebooks/GenAI/SemanticKernel/08-SemanticKernel-MCP.ipynb
  csharp: MyIA.AI.Notebooks/GenAI/SemanticKernel/08-SemanticKernel-MCP-CSharp.ipynb
  parity_level: native-both
  bridge_verdict: SOTA-OK
  bridge_verdict_reason: "Python utilise FastMCP et ClientSession du SDK MCP avec Semantic Kernel MCPStdioPlugin ; C# utilise ModelContextProtocol et Microsoft.SemanticKernel natifs, McpClient et AsKernelFunction, avec vrai transport stdio."
