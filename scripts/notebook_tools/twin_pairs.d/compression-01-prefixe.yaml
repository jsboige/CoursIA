    - "2026-11-14 (myia-po-2023:CoursIA, #14122 / PR #26506) : directive `#nullable enable annotations` ajoutee aux cellules C# -- elle leve l'avertissement CS8632 (annotation de nullabilite hors contexte nullable) sans changer le comportement, et la disponibilite de `require` est assuree globalement. Les sorties numeriques sont en outre rendues deterministes d'une machine a l'autre par la culture invariante (separateur decimal point, comme les valeurs citees dans la prose). Reexecution complete du seul jumeau C# (C.2) ; Python inchange, aucune de ses cellules ni sorties n'est touchee, et le perimetre surface reste inchange."
