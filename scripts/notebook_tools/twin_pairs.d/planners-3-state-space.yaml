  known_differences:
    - "Concept : recherche dans l'espace d'etats (BFS/DFS/A* sur le graphe des etats reachables) + recherche de plan PDDL (8-puzzle)."
    - "Tranche 1 (from-scratch) : Python BFS/DFS/Greedy/A* via networkx + matplotlib heatmap terrain ; C# from-scratch BCL .NET 9 + PriorityQueue (meme algorithme, implementation idiomatic)."
    - "Tranche 2 (#10382, parite lib-vs-lib native-both) : le C# invoque QuikGraph 2.5.0 (BFS/A* sur la meme grille 11x11, parite chiffree BFS=55/A*=16 identique) + Fast Downward (PDDL 8-puzzle, plan optimal 2 actions cout 2) en direct depuis C# — le Python atteint le meme moteur Fast Downward via unified_planning. Les deux cotes atteignent des moteurs de production (networkx / QuikGraph / Fast Downward)."
    - "Prong-B terrain pondere (#3801) : parite stricte apres c.908 (BFS cout 55, A* cout 16 = Python twin). L'off-by-one CoutChemin(path.Sum) -> path.Skip(1).Sum a ete corrige en c.908 (avant : BFS=56, A*=17 = +1 par chemin, causait la fausse note 'parite semantique intacte' de #8436 qui alignait le twin C# sur l'erreur au lieu du ground truth)."
    - "#12492 (recherche en arriere — regression) : ajout Python-only au twin Python d'une section §3.4 — regress STRIPS (g\\add) ∪ pre, duale applicabilite/pertinence, BFS avant/arriere, exercice 5 'Pertinence d'une action pour un but' — plus determinisme de l'affichage des sous-buts (sorted). Le twin C# n'ajoute PAS ce contenu : la regression est une extension de recherche Python ciblee par #12492, pas une brisure de la parite des moteurs de production (networkx / QuikGraph / Fast Downward restent atteints des deux cotes)."
