  bridge_verdict: SOTA-OK
  bridge_verdict_reason: "Python = `pygad` PyPI (Ahmed Gad, MIT-license, GA library SOTA-tier : population, crossover, mutation, fitness, selection ; `import pygad`, `ga_instance = pygad.GA(...)`, `ga_instance.run()`, logging interface). C# = `GeneticSharp` NuGet (dbarbosettig, MIT-license, GA library SOTA-tier .NET : GeneticAlgorithm + Chromosome + Fitness + Operator ; `using GeneticSharp;` + `ga = new GeneticAlgorithm(population, fitness, selection, crossover, mutation)`). Verdict SOTA-OK : les DEUX cotes utilisent une vraie lib GA SOTA (pygad cote PY, GeneticSharp cote C#), couverture fonctionnelle equivalente (population / fitness / selection / crossover / mutation), bridge direct sans glue non-SOTA. Le notebook PY standardise les parametres via `pygad.GA(num_generations=N, ...)` ; le notebook C# fait la meme chose via les proprietes de `GeneticAlgorithm`. Asymetrie mineure : API surface differente (pygad callback-based, GeneticSharp fluent), meme algo."
  known_differences:
    - "2026-09-02 (PR #14266, myia-po-2027:CoursIA) : normalisation nbformat du champ source string->liste (tranche Sudoku de #14209) -- forme seule, les DEUX jumeaux (Python + C#). Contenu rejoint byte-identique (digest sha1 par cellule, 0 divergence), outputs/execution_count/nb de cellules inchanges, pas de re-exec (C.3). Les blob SHAs et content SHAs deplaces dans l audit ci-dessus sont des artefacts de forme (le content_sha hashe la structure JSON des cellules, forme du champ source incluse), pas une divergence pedagogique."
    - "Rebaseline 2026-08-14 : cote Python deplace par drain wallclock #9434 / PR #10874 (remplacement des timings machine-dependants en ms par des ordres de grandeur dans le markdown). Parite semantique inchangee (cellules code byte-identiques, aucune sortie, aucun exec_count touche) ; cote C# non modifie. Attestation = nouveau blob SHA du cote Python."
    - "Socle pedagogique commun : algorithme genetique (GA) applique au Sudoku -- population d'individus, selection, crossover, mutation, fonction de fitness (nombre de conflits). Meme concept evolutionnaire, meme cas d'application (resolution/amelioration d'une grille de Sudoku). Les deux exposent les memes primitives : Population, Crossover, Mutation, GeneticAlgorithm."
    - "Divergence d'implementation : le C# delegue a la lib GeneticSharp (NuGet, expose GeneticAlgorithm/Population/Crossover/Mutation au niveau framework) ; le Python implemente le GA from scratch sur numpy (Population/Crossover/Mutation codes a la main, fitness a base de conflits). Meme paradigme genetique, deux niveaux d'abstraction : framework SOTA cote C# vs reconstruction pedagogique a la main cote Python."
    - "Idiomes framework : C# = GeneticSharp (Nuget) + System.*, 13 cellules code ; Python = numpy (stdlib), 12 cellules code. Asymetrie attendue (lib dediee vs implmentation didactique), meme enseignement algorithmique sous-jacent."
