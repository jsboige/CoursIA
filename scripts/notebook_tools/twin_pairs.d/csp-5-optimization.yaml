  bridge_verdict_reason: "Python = `ortools.sat.python.cp_model` (Google, Apache-2.0, CP-SAT SOTA optimisation : `CpModel()` + variables + `AddMaxEquality` + `model.Minimize(obj)` + `solver.Solve()` pour recherche d'optimum global). C# = Choco-solver 4.10.17 (Apache-2.0) via IKVM 8.15.0 home shade DLL (recette #4711) avec `org.chocosolver.solver.Model` + `IntVar` + `arithm` + `getSolver().findOptimalSolution(obj, Optimization.MAXIMIZE/MINIMIZE)` pour recherche branch-and-bound. Verdict RECOVERABLE-LOCAL : ASYMETRIE DE MACHINERIE -- PY = Google OR-Tools CP-SAT (moteur C++ SOTA avec `Minimize` natif) vs C# = Choco (moteur Java SOTA via IKVM avec `findOptimalSolution` + borne sup/inf). Les DEUX cotes sont SOTA-TIER optimisation CSP mais DIFFERENTS moteurs. `pychoco` (binding natif Choco Python, MIT) alignerait les 2 cotes sur Choco ; `Google.OrTools` NuGet (Apache-2.0, precedent PR #10557 App tranche) alignerait les 2 cotes sur OR-Tools. Le notebook preserve le pattern actuel (OR-Tools PY, Choco CS) comme comparaison pedagogique double moteur. `parity_level: semantic` preserve : parite sur les concepts cibles (CSP optimisation, borne sup/inf, branch-and-bound) malgre l'asymetrie de solveur."
