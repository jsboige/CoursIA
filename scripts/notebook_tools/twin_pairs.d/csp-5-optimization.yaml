  known_differences:
    - "Socle pedagogique commun (parity semantic) : les deux cotes couvrent les 4 problemes classiques d'optimisation combinatoire -- Bin Packing (BPP), Knapsack 0/1, Cutting Stock, Optimisation de Portefeuille -- avec la meme progression pedagogique (formulation variables/constraints/objectif -> exemple resolu -> interpretation). Meme theorie sous-jacente (minimisation bins, maximisation valeur sous capacite, patterns de coupe optimaux, allocation lineaire sous contraintes de risque)."
    - "Idiomes framework : Python = **OR-Tools CP-SAT** (`ortools.sat.python.cp_model`) + `numpy` + `matplotlib` (visualisation du bin packing, benchmark de passage a l'echelle). C# = **Choco-solver via IKVM** (`org.chocosolver.solver.dll`, recette #4711) sur runtime .NET -- le solveur Java est invoque depuis C# via l'assembleur IKVM."
    - "Asymetrie de couverture : Python plus etendu (56 vs 19 cellules) -- ajoute la visualisation du bin packing (`plot_bin_packing`), un benchmark comparatif heuristique First-Fit-Decreasing vs CP-SAT (complexite pratique vs garantie d'optimalite), une section dediquee au Dominance Breaking, et 2 exemples guides (Multi-Knapsack, Bin Packing avec conflits). Le C# se concentre sur la resolution des 4 problemes cles via Choco + 3 exercices d'approfondissement, avec une cellule de comparaison OR-Tools CP-SAT vs Choco. Meme socle algorithmique (combinatorial optimization), leviers de demonstration differents (viz riche + benchmark empirique cote Python vs resolutions Choco compactes cote C#)."
    - "Parity GAP (instances distinctes, #9127) : les deux twins couvrent les 4 memes CLASSES de problemes mais sur des jeux de donnees differents -- les optima numeriques ne sont donc PAS directement comparables d'un twin a l'autre (ex. Bin Packing C# 3 bins sur [2,5,4,7,2] cap 10 vs Python 2 bins sur [2,2,2,3,5,6] ; Cutting Stock C# 10 barres sur pieces 4/7/9 longueur 10 vs Python 4 barres sur pieces 20-40cm stock 100cm). La comparaison porte sur les patrons de modelisation (meme theorie, idiomes Choco vs CP-SAT), pas sur l'egalite des optima. Le recap C# (cellules Verdict + Conclusion) a ete reframed de 'parite demontree' (claim faux) vers 'parallele d'implementation sur instances distinctes' (honnête), et les valeurs du tableau alignees sur les vrais outputs Choco (3 bins / 31 / 10 barres / 27-[0,1,4]). Option A (aligner les instances pour une vraie parite numerique) reste un grain marathon dedie."
