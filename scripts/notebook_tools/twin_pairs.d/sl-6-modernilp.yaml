  bridge_verdict_reason: "Python = `janus_swi` (SWI-Prolog) + documentation des 4 moteurs ILP modernes SOTA : `Aleph` (entailment-inverse, Srinivasan 2001), `Metagol` (MIL = Meta-Interpretive Learning, Muggleton 2014), `Popper` (LFF = Learning From Failures, Cropper 2020, formule l'ILP comme un probleme ASP resolu par clingo), `dILP/Lernd` (differentiable ILP, Evans 2018). C# = BCL .NET from-scratch pour FOIL (Quinlan 1990) sur la tache 'apprendre ancestor' (programme recursif, 2 clauses), benchmark sur graphe parent croissant, PLUS pont SOTA #10382 : la section 7 invoque clingo via `Process.Start` (axe CLI checklist #10459) sur le programme ASP (5 faits parent/2 + les 2 clauses apprises par le FOIL from-scratch) et verifie que clingo derive exactement les 11 positifs sans atteindre les 19 negatifs (mesure : TP 11/11, FP 0, TN 19/19, verdict `FOIL from-scratch == clingo (SOTA)`). Le verdict RECOVERABLE-MACHINE de la section 6 pour Popper est REVOQUE : clingo est un binaire invocable, le pendant C# honnete est `Process.Start` sur le meme executable (mandat #10382 bucket 2). Axes binding : pas de NuGet .NET (1), pas de P/Invoke (2), CLI = le canal (3), pas d'IKVM (4), pas de PythonNet (5). Le from-scratch FOIL est conserve (le pont est en plus, jamais a la place -- FOIL = algorithme fondateur AIMA §19.5, clingo = le moteur que Popper utilise en interne). `parity_level: native-both` (les deux jumeaux referencent un moteur externe : Popper/clingo cote Python, clingo cote C#)."
