    - "2026-10-11 (grain REPAIR/MED notebook-python #20356, myia-po-2027:CoursIA-2) : normalisation C.1 du stub d'exercice booleen cote Python -- `return False  # TODO` devient `return None  # TODO`. Le jumeau C# n'est PAS touche : sa convention de stub est `return null; // TODO` partout ou le type le permet (Dictionary, objets), et `return false;` / `return 0;` la ou le type l'interdit -- bool et int ne sont pas nullables en C#. C'est une contrainte de langage, pas une divergence pedagogique : la serie C# entiere porte ces litteraux (Sudoku-09 cell27, Sudoku-12 cell37/41, Sudoku-18 cell23, entre autres). Les DEUX cotes restent des exercices NON IMPLEMENTES ; seul le litteral de retour a change cote Python, d'un resultat fabrique vers une absence explicite. Le blob SHA Python deplace dans l'audit ci-dessus est l'artefact de cette normalisation, pas une derive de l'algorithme enseigne."
