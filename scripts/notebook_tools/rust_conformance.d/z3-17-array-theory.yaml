    - id: c7_axiome1
      description: "Cellule 7 — negation de l'axiome 1 de McCarthy, unsat (ligne ancrée ; le jumeau C# ecrit « Axiome 1 (negation doit etre UNSATISFIABLE) : UNSATISFIABLE », libelle ET verdict differents)"
      tolerance: 0
      reference: python
      sides:
        python:
