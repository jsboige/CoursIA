          transform: text
        csharp:
          absent: "le libelle lui-meme differe (« UNSATISFIABLE » la où Python et Rust ecrivent « UNSAT ») — le verdict est le meme, le rendu ne l'est pas"
        rust:
          cell: 7
          pattern: "(?m:^(Axiome 1 \\(negation doit etre UNSAT\\) : unsat)\\r?$)"
          transform: text
    - id: c7_axiome2
