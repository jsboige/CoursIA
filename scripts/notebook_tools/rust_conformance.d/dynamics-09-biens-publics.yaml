    - id: fenetre_basse
      description: "Fenetre d'hysteresis, borne basse (0.07)"
      tolerance: 1e-9
      reference: python
      sides:
        python:
          cell: 16
          pattern: "c/b in \\[([0-9.]+),"
          transform: float
        rust:
          cell: 16
          pattern: "c/b in \\[([0-9.]+),"
          transform: float
    - id: fenetre_haute
      description: "Fenetre d'hysteresis, borne haute (0.27)"
      tolerance: 1e-9
      reference: python
      sides:
        python:
          cell: 16
          pattern: "c/b in \\[[0-9.]+, ([0-9.]+)\\]"
          transform: float
        rust:
          cell: 16
          pattern: "c/b in \\[[0-9.]+, ([0-9.]+)\\]"
          transform: float
    - id: ecart_max
      description: "Ecart max entre branches a c/b=0.07 (+0.482)"
      tolerance: 1e-9
      reference: python
      sides:
        python:
          cell: 16
          pattern: "Ecart max : \\+([0-9.]+) a c/b"
