        rust:
          cell: 16
          pattern: "0.100  ([0-9.]+)"
          transform: float
    - id: pred_npl
      description: "E4 : prediction du modele Np non-lineaire eq. 9 (0.1294)"
      tolerance: 1e-9
      reference: python
      sides:
        python:
          cell: 21
          pattern: "eq\\.9\\) : ([0-9.]+)"
          transform: float
        rust:
          cell: 21
          pattern: "eq\\.9\\) : ([0-9.]+)"
          transform: float
    - id: verdict_npl
      description: "E4 : verdict du banc sur l'eq. 9 (RATEE, seuil 0.1 declare)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 21
          pattern: "eq\\.9\\) : [0-9.]+  -> erreur = [0-9.]+  \\[(\\w+)\\]"
          transform: text
        rust:
          cell: 21
          pattern: "eq\\.9\\) : [0-9.]+  -> erreur = [0-9.]+  \\[(\\w+)\\]"
          transform: text
