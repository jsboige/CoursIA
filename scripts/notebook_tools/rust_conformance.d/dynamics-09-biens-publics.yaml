# Triplet Dynamics-09 : jumeau Python + portage Rust (issue #27659, spec Rust portage).
# Les trois carnets ont exactement la meme structure 24 cellules (meme indices) :
# les cotes se correspondent par index. Cote Rust = evcxr + ndarray 0.17.2 + plotters 0.3.
# Le cote C# EXISTE (Dynamics-09-Biens-Publics-N-Personnes-CSharp.ipynb, 24 cellules,
# 9 de code aux memes rangs) : il est declare dans `twin_pairs.d/dynamics-09-biens-publics.yaml`.
# Ce registre differentiel-ci ne compare que Python et Rust ; les valeurs C# ne sont pas
# mesurees ici (defaut de la redaction d'origine, corrige le 2026-11-27, PR #28661).
# Les figures (E2b scatter, E3 bifurcation) sont QUALITATIVES : hors registre,
# comparees a l'oeil dans le body de la PR (legendes markdown, memes couleurs).
# La parite SHA par cote est portee par `twin_pairs.d/dynamics-09-biens-publics.yaml`
# (cote `rust:` declare, attestation a la tete) : declaree la, pas reimplementee ici.
- name: "Dynamics-09 Biens publics N-personnes"
  family: Dynamics
  python: MyIA.AI.Notebooks/GameTheory/Dynamics/Dynamics-09-Biens-Publics-N-Personnes-Python.ipynb
  rust: MyIA.AI.Notebooks/GameTheory/Dynamics/Dynamics-09-Biens-Publics-N-Personnes-Rust.ipynb
  measures:
    - id: formes_normales
      description: "Quotient d'orbites : 78 formes normales distinctes (Rapoport-Guyer 1966)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 4
          pattern: "Formes normales distinctes : (\\d+) jeux"
          transform: int
        rust:
          cell: 4
          pattern: "Formes normales distinctes : (\\d+) jeux"
          transform: int
    - id: archetype_pd
      description: "Orbites PD (1/78)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 4
          pattern: "PD : +(\\d+) \\("
          transform: int
        rust:
          cell: 4
          pattern: "PD : +(\\d+) \\("
          transform: int
    - id: archetype_sh
      description: "Orbites SH (6/78)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 4
          pattern: "SH : +(\\d+) \\("
          transform: int
        rust:
          cell: 4
          pattern: "SH : +(\\d+) \\("
          transform: int
    - id: archetype_sd
      description: "Orbites SD (1/78)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 4
          pattern: "SD : +(\\d+) \\("
          transform: int
        rust:
          cell: 4
          pattern: "SD : +(\\d+) \\("
          transform: int
    - id: archetype_h
      description: "Orbites H (6/78)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 4
          pattern: "H : +(\\d+) \\("
          transform: int
        rust:
          cell: 4
          pattern: "H : +(\\d+) \\("
          transform: int
    - id: archetype_other
      description: "Orbites Other (64/78, 82.1 %)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 4
          pattern: "Other : +(\\d+) \\("
          transform: int
        rust:
          cell: 4
          pattern: "Other : +(\\d+) \\("
          transform: int
    - id: eq9_err_rel_n3
      description: "Erreur relative eq. 9 vs approximation a N=3 (0.7071)"
      tolerance: 1e-6
      reference: python
      sides:
        python:
          cell: 9
          pattern: "N= *3 [^\\n]*err_rel=([0-9.]+)"
          transform: float
        rust:
          cell: 9
          pattern: "N= *3 [^\\n]*err_rel=([0-9.]+)"
          transform: float
    - id: eq9_err_rel_n10
      description: "Erreur relative eq. 9 vs approximation a N=10 (0.4990)"
      tolerance: 1e-6
      reference: python
      sides:
