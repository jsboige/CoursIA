- name: "App-17 VRP Logistics"
  family: Search / Part3-Cas-pratiques
  python: MyIA.AI.Notebooks/Search/Part3-Cas-pratiques/App-17-VRP-Logistics-Python.ipynb
  csharp: MyIA.AI.Notebooks/Search/Part3-Cas-pratiques/App-17-VRP-Logistics-CSharp.ipynb
  rust: MyIA.AI.Notebooks/Search/Part3-Cas-pratiques/App-17-VRP-Logistics-Rust.ipynb
  measures:
    - id: validite_greedy
      description: "La tournee gloutonne passe la verification capacite (clients servis une fois, charge par tour <= capacite)"
      tolerance: 0
      reference: python
      case_insensitive: true
      sides:
        python:
          cell: 17
          pattern: 'Solution valide: (True|False)'
          transform: text
        rust:
          cell: 19
          pattern: 'Solution valide: (true|false)'
          transform: text
        csharp:
          absent: >-
            Le jumeau C# ne publie aucune sortie texte commitee (14 cellules
            code, zero outputs texte) : ses mesures Nearest-Neighbor / 2-opt /
            recuit ne sont pas comparables ici. Cote declare ABSENT, pas
            mesure : la comparaison porte sur les deux cotes qui publient la
            grandeur.
    - id: distance_greedy
      description: "Distance totale de la tournee gloutonne sur l'instance de reference (deterministe : clients ASC, meilleur cout strict)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 17
          pattern: 'Distance totale: ([\d.]+)'
          transform: float
        rust:
          cell: 19
          pattern: 'Distance totale: ([\d.]+)'
          transform: float
        csharp:
          absent: >-
            Voir validite_greedy : aucune sortie texte commitee.
    - id: distance_2opt
      description: "Distance apres 2-opt deterministe (len>=3, i ascendant, j>=i+2, renversement [i+1..=j]) sur la tournee gloutonne"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 26
          pattern: 'Après 2-opt: ([\d.]+)'
          transform: float
        rust:
          cell: 28
          pattern: 'Apres 2-opt: ([\d.]+)'
          transform: float
        csharp:
          absent: >-
            Voir validite_greedy : aucune sortie texte commitee.
    - id: validite_milp
      description: "La solution exacte (MILP cote Rust/HiGHS, CP-SAT cote Python/OR-Tools) passe la verification capacite"
      tolerance: 0
      reference: python
      case_insensitive: true
      sides:
        python:
          cell: 29
          pattern: 'solution valide = (True|False)'
          transform: text
        rust:
          cell: 31
          pattern: 'solution valide = (true|false)'
          transform: text
        csharp:
          absent: >-
            Voir validite_greedy : aucune sortie texte commitee.
    - id: distance_milp
      description: "Distance totale de la solution exacte. Solveurs differents (OR-Tools CP-SAT vs HiGHS MILP), tolerance relative ~1 pourcent"
      tolerance: 4.1
      reference: python
      sides:
        python:
          cell: 29
          pattern: 'distance totale\s+: ([\d.]+)'
          transform: float
        rust:
          cell: 31
          pattern: 'distance totale\s+: ([\d.]+)'
          transform: float
        csharp:
          absent: >-
            Voir validite_greedy : aucune sortie texte commitee.
    - id: table_milp
      description: "Ligne solveur exact du tableau comparatif final (OR-Tools GLS cote Python, MILP HiGHS cote Rust) — tolerance relative ~1 pourcent"
      tolerance: 4.1
      reference: python
      sides:
        python:
          cell: 31
          pattern: 'OR-Tools \(GLS\)\s+([\d.]+)'
          transform: float
        rust:
          cell: 33
          pattern: 'MILP HiGHS\s+([\d.]+)'
          transform: float
        csharp:
          absent: >-
            Voir validite_greedy : aucune sortie texte commitee.
