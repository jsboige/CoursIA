- name: "ChoixSocial-06 Mobius-Aggregation-Pouvoir-Manipulation"
  family: SocialChoice
  python: MyIA.AI.Notebooks/GameTheory/SocialChoice/ChoixSocial-06-Mobius-Aggregation-Pouvoir-Manipulation-Python.ipynb
  csharp: MyIA.AI.Notebooks/GameTheory/SocialChoice/ChoixSocial-06-Mobius-Aggregation-Pouvoir-Manipulation-CSharp.ipynb
  rust: MyIA.AI.Notebooks/GameTheory/SocialChoice/ChoixSocial-06-Mobius-Aggregation-Pouvoir-Manipulation-Rust.ipynb
  measures:
    - id: roundtrip_ok
      description: "La loi de reconstruction v = somme des dividendes tient sur les 16 coalitions"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 3
          pattern: "coalitions : (True|False)"
          transform: text
        rust:
          cell: 3
          pattern: "coalitions : (True|False)"
          transform: text
        csharp:
          cell: 3
          pattern: "coalitions : (True|False)"
          transform: text
    - id: coalitions_verifiees
      description: "Nombre de coalitions soumises au round-trip (2^4)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 3
          pattern: "verifiee sur les (\\d+) coalitions"
          transform: int
        rust:
          cell: 3
          pattern: "verifiee sur les (\\d+) coalitions"
          transform: int
        csharp:
          cell: 3
          pattern: "verifiee sur les (\\d+) coalitions"
          transform: int
    - id: dividendes_table
      description: "Table des dividendes de Harsanyi non nuls (nom, poids, v(S), m(T)) — rendu identique au caractere pres"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 3
          pattern: "(\\{1,2\\}[^\\n]*\\n\\{1,3\\}[^\\n]*\\n\\{1,2,3\\}[^\\n]*\\n\\{2,3,4\\}[^\\n]*\\n\\{1,2,3,4\\}[^\\n]*)"
          transform: text
        rust:
          cell: 3
          pattern: "(\\{1,2\\}[^\\n]*\\n\\{1,3\\}[^\\n]*\\n\\{1,2,3\\}[^\\n]*\\n\\{2,3,4\\}[^\\n]*\\n\\{1,2,3,4\\}[^\\n]*)"
          transform: text
    - id: dividendes_valeurs
      description: "Memes dividendes compares sur les trois cotes, au niveau des valeurs (le cote C# rend les lignes avec des fins de ligne CRLF)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 3
          pattern: "(\\{1,2\\}[^\\n]*\\n\\{1,3\\}[^\\n]*\\n\\{1,2,3\\}[^\\n]*\\n\\{2,3,4\\}[^\\n]*\\n\\{1,2,3,4\\}[^\\n]*)"
          transform: digits
        rust:
          cell: 3
          pattern: "(\\{1,2\\}[^\\n]*\\n\\{1,3\\}[^\\n]*\\n\\{1,2,3\\}[^\\n]*\\n\\{2,3,4\\}[^\\n]*\\n\\{1,2,3,4\\}[^\\n]*)"
          transform: digits
        csharp:
          cell: 3
          pattern: "(\\{1,2\\}[^\\n]*\\n\\{1,3\\}[^\\n]*\\n\\{1,2,3\\}[^\\n]*\\n\\{2,3,4\\}[^\\n]*\\n\\{1,2,3,4\\}[^\\n]*)"
          transform: digits
    - id: shapley_joueur_1
      description: "Valeur de Shapley du joueur 1 (poids 4), calculee par les dividendes"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 6
          pattern: "1\\s+4\\s+40\\.00%\\s+(0\\.\\d+)"
          transform: float
        rust:
          cell: 6
          pattern: "1\\s+4\\s+40\\.00%\\s+(0\\.\\d+)"
          transform: float
        csharp:
          cell: 6
          pattern: "1\\s+4\\s+40,00\\s*%\\s+(0,\\d+)"
          transform: float
    - id: shapley_joueur_2
      description: "Valeur de Shapley du joueur 2 (poids 3)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 6
          pattern: "2\\s+3\\s+30\\.00%\\s+(0\\.\\d+)"
          transform: float
        rust:
          cell: 6
          pattern: "2\\s+3\\s+30\\.00%\\s+(0\\.\\d+)"
          transform: float
        csharp:
          cell: 6
          pattern: "2\\s+3\\s+30,00\\s*%\\s+(0,\\d+)"
          transform: float
    - id: shapley_joueur_3
      description: "Valeur de Shapley du joueur 3 (poids 2)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 6
          pattern: "3\\s+2\\s+20\\.00%\\s+(0\\.\\d+)"
          transform: float
        rust:
          cell: 6
          pattern: "3\\s+2\\s+20\\.00%\\s+(0\\.\\d+)"
          transform: float
        csharp:
          cell: 6
          pattern: "3\\s+2\\s+20,00\\s*%\\s+(0,\\d+)"
          transform: float
    - id: shapley_joueur_4
      description: "Valeur de Shapley du joueur 4 (poids 1)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 6
          pattern: "4\\s+1\\s+10\\.00%\\s+(0\\.\\d+)"
          transform: float
        rust:
          cell: 6
          pattern: "4\\s+1\\s+10\\.00%\\s+(0\\.\\d+)"
          transform: float
        csharp:
          cell: 6
          pattern: "4\\s+1\\s+10,00\\s*%\\s+(0,\\d+)"
          transform: float
    - id: banzhaf_joueur_1
      description: "Indice de Banzhaf normalise du joueur 1"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 6
          pattern: "1\\s+4\\s+40\\.00%\\s+0\\.\\d+\\s+0\\.\\d+\\s+(0\\.\\d+)"
          transform: float
        rust:
          cell: 6
          pattern: "1\\s+4\\s+40\\.00%\\s+0\\.\\d+\\s+0\\.\\d+\\s+(0\\.\\d+)"
          transform: float
        csharp:
          cell: 6
          pattern: "1\\s+4\\s+40,00\\s*%\\s+0,\\d+\\s+0,\\d+\\s+(0,\\d+)"
          transform: float
    - id: banzhaf_joueur_2
      description: "Indice de Banzhaf normalise du joueur 2"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 6
          pattern: "2\\s+3\\s+30\\.00%\\s+0\\.\\d+\\s+0\\.\\d+\\s+(0\\.\\d+)"
          transform: float
        rust:
          cell: 6
          pattern: "2\\s+3\\s+30\\.00%\\s+0\\.\\d+\\s+0\\.\\d+\\s+(0\\.\\d+)"
          transform: float
        csharp:
          cell: 6
          pattern: "2\\s+3\\s+30,00\\s*%\\s+0,\\d+\\s+0,\\d+\\s+(0,\\d+)"
          transform: float
    - id: banzhaf_joueur_3
      description: "Indice de Banzhaf normalise du joueur 3"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 6
          pattern: "3\\s+2\\s+20\\.00%\\s+0\\.\\d+\\s+0\\.\\d+\\s+(0\\.\\d+)"
          transform: float
        rust:
          cell: 6
          pattern: "3\\s+2\\s+20\\.00%\\s+0\\.\\d+\\s+0\\.\\d+\\s+(0\\.\\d+)"
          transform: float
        csharp:
          cell: 6
          pattern: "3\\s+2\\s+20,00\\s*%\\s+0,\\d+\\s+0,\\d+\\s+(0,\\d+)"
          transform: float
    - id: banzhaf_joueur_4
      description: "Indice de Banzhaf normalise du joueur 4"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 6
          pattern: "4\\s+1\\s+10\\.00%\\s+0\\.\\d+\\s+0\\.\\d+\\s+(0\\.\\d+)"
          transform: float
        rust:
          cell: 6
          pattern: "4\\s+1\\s+10\\.00%\\s+0\\.\\d+\\s+0\\.\\d+\\s+(0\\.\\d+)"
          transform: float
        csharp:
          cell: 6
          pattern: "4\\s+1\\s+10,00\\s*%\\s+0,\\d+\\s+0,\\d+\\s+(0,\\d+)"
          transform: float
    - id: shapley_somme
      description: "Somme des quatre valeurs de Shapley (efficience)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 6
          pattern: "Somme des valeurs de Shapley = ([0-9]+(?:\\.[0-9]+)?)"
          transform: float
        rust:
          cell: 6
          pattern: "Somme des valeurs de Shapley = ([0-9]+(?:\\.[0-9]+)?)"
          transform: float
        csharp:
          cell: 6
          pattern: "Somme des valeurs de Shapley = ([0-9]+(?:\\.[0-9]+)?)"
          transform: float
    - id: valeur_grand_n
      description: "Valeur de la grande coalition v(N)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 6
          pattern: "v\\(N\\) = (\\d+)"
          transform: int
        rust:
          cell: 6
          pattern: "v\\(N\\) = (\\d+)"
          transform: int
        csharp:
          cell: 6
          pattern: "v\\(N\\) = (\\d+)"
          transform: int
    - id: ecart_deux_voies
      description: "Ecart maximal entre la valeur de Shapley par dividendes et celle par enumeration des ordres d'entree"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 6
          pattern: "Shapley par ordres\\| = ([0-9.e+-]+)"
          transform: float
        rust:
          cell: 6
          pattern: "Shapley par ordres\\| = ([0-9.e+-]+)"
          transform: float
        csharp:
          absent: >-
            Le cote C# publie `0e` sur cette ligne : son arithmetique en `double`
            fait tomber les deux voies exactement sur la meme valeur, la ou la
            source Python et le portage Rust mesurent 5.55e-17 (2^-54). Les deux
            cotes sont exacts et l'ecart de l'un n'est pas une absence de
            mesure : la grandeur n'est pas comparable entre les deux chemins
            de calcul. Cote declare ABSENT, la divergence d'arithmetique etant
            signalee dans le body de la PR.
    - id: exercice1_entete
