# Conformite differentielle du couple GameTheory-03e (Meta-Actions
# Tarifees, issue #27942).
#
# Le portage Rust (kernel evcxr, `std` seul) reprend le carnet Python a
# l'identique : meme substrat GT-3b, meme meta-jeu, meme Dijkstra-heapq,
# meme echantillon MT19937 (seed 0, 300 paires). Les dicts Python dont
# l'ordre se lit dans une sortie deviennent des BTreeMap, les listes des
# Vec, et le rendu des grandeurs Python (True, {(0, 'cycle'): 72}) passe
# par des helpers (py_bool, rendu BTreeMap).
#
# Les deux cotes ont la MEME structure de cellules (73 cellules, 27 code
# aux memes index) : la correspondance des cellules est directe.
#
# Le cote C# est absent du triplet : pas de jumeau C# dans le depot (le
# carnet C# correspondant, s'il existe un jour, vivra dans la PR #27681,
# non fusionnee au moment de l'ecriture de ce registre). Si cette PR
# fusionne et livre un jumeau, rouvrir ce fichier pour ajouter le chemin
# et les cotes C# (le lecteur ne signale pas l'absence d'un cote non
# declare : c'est la relecture humaine qui la garantit, d'ou le present
# commentaire).
#
# Ecarts de forme DECLARES :
#
# - les cellules evcxr sont PLATES (pas de bloc englobant) et se
#   terminent par une instruction `;` : AUCUN execute_result « () » n'est
#   attendu cote Rust, les patterns des deux cotes sont identiques
#   (\A\s*(.*?)\s*\Z), sans saut d'echo -- contrairement au registre
#   03b dont les cellules a blocs englobants laissaient un « () » final ;
# - les cellules 18 et 42 (Python) produisent chacune deux blocs stdout
#   separes : l'organe concatene tous les outputs portant du texte, la
#   comparaison reste integral, aucun ecart ;
# - la cellule 62 lit le module game_theory_lean/Abstraction/Basic.lean
#   du depot et affiche un chemin avec separateur de l'hote : la sortie
#   commitee porte le separateur Windows (« game_theory_lean\Abstraction
#   \Basic.lean ») des deux cotes (re-exec locale regle F sur Windows) ;
#   sous un hote non-Windows la re-exec rendrait « / » a la place -- le
#   fichier lui-meme ( numeros de ligne, declarations, compteurs sorry )
#   est commite identique des deux cotes ;
# - les cellules d'exercices 50/52/54/56/58/60 (stubs sans erreur
#   volontaire, C.1) impriment leur banniere « Exercice N : a completer » :
#   comparees comme toute autre sortie.
- name: "GameTheory-03e Meta Actions Tarifees"
  family: GameTheory
  python: MyIA.AI.Notebooks/GameTheory/GameTheory-03e-Meta-Actions-Tarifees-Python.ipynb
  rust: MyIA.AI.Notebooks/GameTheory/GameTheory-03e-Meta-Actions-Tarifees-Rust.ipynb
