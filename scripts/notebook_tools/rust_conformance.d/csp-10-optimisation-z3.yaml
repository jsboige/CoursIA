# Conformité différentielle de CSP-10-Optimisation-Z3 (portage Rust nb_coder).
#
# Écrite à la livraison par nb_coder_integrate depuis les sorties COMMITÉES
# des carnets : correspondance par index de cellule (le portage garde la
# structure de cellules du jumeau Python, scellée par twin-parity), une
# mesure par cellule qui imprime côté Python, égalité stricte du texte ;
# les lignes de durée murale sont des ancres en présence seule. Le côté
# C# est comparé où sa cellule alignée imprime le même texte, sinon
# déclaré absent avec l'écart mesuré. À corriger À LA MAIN si une
# divergence est un écart d'API documenté : le fichier n'est jamais
# réécrit par l'outil une fois présent.
#
# Cellules non mesurées (motif relevé à la relecture de la livraison) :
#   - cellule 1 : bannière d'environnement du jumeau Python (« Dépendances
#     prêtes. », version de Z3) ; le carnet Rust n'imprime rien à cette
#     cellule, il n'y a pas de texte à comparer ;
#   - cellule 13 : le jumeau Python rend une figure matplotlib (image/png),
#     le carnet Rust imprime la grille en texte ; une sortie riche contre du
#     texte ne se compare pas à l'égalité stricte.
- name: "CSP-10-Optimisation-Z3"
  family: "Search/Part2-CSP"
  python: MyIA.AI.Notebooks/Search/Part2-CSP/CSP-10-Optimisation-Z3.ipynb
  csharp: MyIA.AI.Notebooks/Search/Part2-CSP/CSP-10-Optimisation-Z3-CSharp.ipynb
  rust: MyIA.AI.Notebooks/Search/Part2-CSP/CSP-10-Optimisation-Z3-Rust.ipynb
  measures:
    - id: c4_text
      description: "Sortie de la cellule 4, texte identique au jumeau Python"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 4
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        rust:
          cell: 4
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        csharp:
          absent: "Le carnet C# n'a pas de cellule de code à l'index 4 (structure de cellules différente du jumeau Python) : côté déclaré absent, mesuré à la génération ; la comparaison stricte porte sur Python et Rust."
    - id: c6_text
      description: "Sortie de la cellule 6, texte identique au jumeau Python (segment 1/1 ; durées murales en présence seule, valeurs jamais comparées)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 6
          pattern: "\\A(?:.*?)(?m:^Brute\\-force\\ :\\ couverture\\ minimale\\ de\\ 2\\ capteurs\\ en\\ \\d+(?:[.,]\\d+)?\\ s\\r?$)\\s*(.*?)\\s*\\Z"
          transform: text
        rust:
          cell: 6
          pattern: "\\A(?:.*?)(?m:^Brute\\-force\\ :\\ couverture\\ minimale\\ de\\ 2\\ capteurs\\ en\\ \\d+(?:[.,]\\d+)?\\ s\\r?$)\\s*(.*?)\\s*\\Z"
          transform: text
        csharp:
          absent: "Le carnet C# n'a pas de cellule de code à l'index 6 (structure de cellules différente du jumeau Python) : côté déclaré absent, mesuré à la génération ; la comparaison stricte porte sur Python et Rust."
    - id: c9_text
      description: "Sortie de la cellule 9, texte identique au jumeau Python"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 9
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        rust:
          cell: 9
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        csharp:
          absent: "Le carnet C# n'a pas de cellule de code à l'index 9 (structure de cellules différente du jumeau Python) : côté déclaré absent, mesuré à la génération ; la comparaison stricte porte sur Python et Rust."
    - id: c12_seg1
      description: "Sortie de la cellule 12, texte identique au jumeau Python (segment 1/2 ; durées murales en présence seule, valeurs jamais comparées)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 12
          pattern: "\\A\\s*(.*?)\\s*(?m:^Z3\\ :\\ couverture\\ minimale\\ de\\ 8\\ capteurs\\ en\\ \\d+(?:[.,]\\d+)?\\ ms\\r?$)"
          transform: text
        rust:
          cell: 12
          pattern: "\\A\\s*(.*?)\\s*(?m:^Z3\\ :\\ couverture\\ minimale\\ de\\ 8\\ capteurs\\ en\\ \\d+(?:[.,]\\d+)?\\ ms\\r?$)"
          transform: text
        csharp:
          absent: "La cellule C# 12 n'imprime pas les lignes-ancres de durée du segment Python : côté déclaré absent, mesuré à la génération ; la comparaison stricte porte sur Python et Rust."
    - id: c12_seg2
