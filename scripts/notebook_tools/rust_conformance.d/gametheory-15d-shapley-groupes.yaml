- name: "GameTheory-15d Shapley Groupes"
  family: GameTheory
  python: MyIA.AI.Notebooks/GameTheory/GameTheory-15d-Shapley-Groupes-Python.ipynb
  rust: MyIA.AI.Notebooks/GameTheory/GameTheory-15d-Shapley-Groupes-Rust.ipynb
  measures:
    - id: phi_g_exemple_1
      description: "phi_g exact du binome (4, 5) via la formule directe (jeu fusionne)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 11
          pattern: '\(4, 5\)\s+(\d+/\d+)'
          transform: text
        rust:
          cell: 10
          pattern: '\(4, 5\)\s+(\d+/\d+)'
          transform: text
    - id: theoreme2_psi
      description: "complementarite psi_4j du binome (4, 5) dans la decomposition du theoreme 2"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 14
          pattern: '\(4, 5\)\s+139/360\s+1/56\s+(\d+/\d+)'
          transform: text
        rust:
          cell: 13
          pattern: '\(4, 5\)\s+139/360\s+1/56\s+(\d+/\d+)'
          transform: text
    - id: binomes_profitables
      description: "nombre de binomes profitables (au-dessus de y = x) sur les 105"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 28
          pattern: '(\d+) sur 105'
          transform: int
        rust:
          cell: 25
          pattern: '(\d+) sur 105'
          transform: int
    - id: medici_phi
      description: "valeur individuelle exacte de la famille Medici (tabulation florentine)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 22
          pattern: 'Medici\s+(0\.\d{4})'
          transform: text
        rust:
          cell: 19
          pattern: 'Medici\s+(0\.\d{4})'
          transform: text
    - id: top_pair_phi_g
      description: "phi_g du meilleur binome au sens additif (Albizzi + Medici)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 24
          pattern: 'Albizzi \+ Medici\s+(0\.\d{4})'
          transform: text
        rust:
          cell: 21
          pattern: 'Albizzi \+ Medici\s+(0\.\d{4})'
          transform: text
    - id: k4_optimum
      description: "optimum exhaustif de taille k = 4 (Albizzi + Guadagni + Medici + Salviati)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 26
          pattern: 'Salviati\s+(0\.\d{4})'
          transform: text
        rust:
          cell: 23
          pattern: 'Salviati\s+(0\.\d{4})'
          transform: text
  # NB : les cellules de calibration Monte-Carlo (n = 250/1000/4000) et de
  # l'estimation sur le club de karate sont STOCHASTIQUES (graines
  # differentes par execution) : volontairement hors registre, seules les
  # valeurs exactes tabulees sont mesurees ci-dessus.
