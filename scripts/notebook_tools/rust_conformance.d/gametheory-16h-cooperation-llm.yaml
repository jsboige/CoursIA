          transform: float
        rust:
          cell: 15
          pattern: "scripted_only\\s+0\\s+([\\d.]+)"
          transform: float
        csharp:
          absent: "pas de jumeau C# dans le depot (paire Python/Rust)"
    - id: null_global_mean
      description: "Moyenne globale du modele nul uniform_random (cellule 18)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 18
          pattern: "Moyenne globale du nul : ([\\d.]+)"
          transform: float
        rust:
          cell: 18
          pattern: "Moyenne globale du nul : ([\\d.]+)"
          transform: float
        csharp:
          absent: "pas de jumeau C# dans le depot (paire Python/Rust)"
    - id: null_inter_seed_stdev
      description: "Ecart-type inter-seed du modele nul (cellule 18)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 18
          pattern: "Ecart-type inter-seed\\s+: ([\\d.]+)"
          transform: float
        rust:
          cell: 18
          pattern: "Ecart-type inter-seed\\s+: ([\\d.]+)"
          transform: float
        csharp:
          absent: "pas de jumeau C# dans le depot (paire Python/Rust)"
    - id: negative_control_coop
      description: "Cooperation du controle negatif always_defect, seed 0 (cellule 21)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 21
          pattern: "seed=0 : coop_0 = ([\\d.]+)"
          transform: float
        rust:
          cell: 21
          pattern: "seed=0 : coop_0 = ([\\d.]+)"
          transform: float
        csharp:
          absent: "pas de jumeau C# dans le depot (paire Python/Rust)"
    - id: negative_control_payoff
      description: "Payoff du controle negatif always_defect, seed 0 (cellule 21)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 21
          pattern: "seed=0 : coop_0 = [\\d.]+, payoff_0 = (\\d+)"
          transform: int
        rust:
          cell: 21
          pattern: "seed=0 : coop_0 = [\\d.]+, payoff_0 = (\\d+)"
          transform: int
        csharp:
          absent: "pas de jumeau C# dans le depot (paire Python/Rust)"
    - id: verdict_scripted_only
      description: "Taux de cooperation moyen de scripted_only au verdict §7 (cellule 24)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 24
          pattern: "scripted_only\\s+([\\d.]+)"
          transform: float
        rust:
          cell: 24
          pattern: "scripted_only\\s+([\\d.]+)"
          transform: float
        csharp:
          absent: "pas de jumeau C# dans le depot (paire Python/Rust)"
    - id: bilan_h0
      description: "Nombre de verdicts H0 du bilan §7 (cellule 24)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 24
          pattern: "Bilan : (\\d+) H0"
          transform: int
        rust:
          cell: 24
          pattern: "Bilan : (\\d+) H0"
          transform: int
        csharp:
          absent: "pas de jumeau C# dans le depot (paire Python/Rust)"
    - id: bilan_h1
      description: "Nombre de verdicts H1 du bilan §7 (cellule 24)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 24
          pattern: "Bilan : \\d+ H0, (\\d+) H1"
          transform: int
        rust:
          cell: 24
          pattern: "Bilan : \\d+ H0, (\\d+) H1"
          transform: int
        csharp:
          absent: "pas de jumeau C# dans le depot (paire Python/Rust)"
