# Conformite differentielle du carnet Argumentation-03c (semantiques de
# classement, issue #27886).
#
# Le portage Rust (kernel evcxr, `std` seul, aucune `:dep`) porte les deux
# semantiques graduees du carnet Python : h-Categoriser (point fixe) et le
# fardeau (comparaison lexicographique). Les deux cotes executent la MEME
# instance (7 arguments, 4 attaques) et le MEME cas cyclique (a <-> b).
#
# Deux difficultes mesurees, traitees par construction :
#
# 1. **Ordre des ex-aequo.** Les cellules 5 et 13 trient un `set` Python :
#    l'ordre d'iteration du `set` depend de la graine (`PYTHONHASHSEED`), et
#    `sorted` est stable -- l'ordre des ex-aequo (les cinq arguments non
#    attaques, force 1.0) est donc celui d'une execution CPython, que Python
#    ne garantit pas. Le cote Rust reproduit l'ordre du temoin
#    (`ARGS_ORDER` + tri stable) au lieu d'un departage alphabetique.
# 2. **Chaines de caracteres.** Python imprime une liste Python
#    (`['e', 'y', 'z1']`) et un booleen (`True`) ; le cote Rust reproduit
#    ces formes (`fmt_str_list`, `py_bool`) pour que la comparaison soit
#    stricte et non « property-based ».
#
# Le jumeau C# n'existe pas dans le depot (la serie ArgumentAnalysis n'a pas
# de cote .NET) : le cote C# est declare ABSENT, pas mesure.
- name: "Argumentation-03c Semantiques de classement (h-Categoriser & fardeau)"
  family: ArgumentAnalysis
  python: MyIA.AI.Notebooks/SymbolicAI/ArgumentAnalysis/Argumentation-03c-Ranking-Semantics-Python.ipynb
  rust: MyIA.AI.Notebooks/SymbolicAI/ArgumentAnalysis/Argumentation-03c-Ranking-Semantics-Rust.ipynb
  measures:
    - id: af_repr
      description: "Repr du cadre d'argumentation (arguments et attaques du fil rouge)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 2
          pattern: "AF\\(args=\\[(.*?)\\], attacks=\\[(.*?)\\]\\)"
          transform: text
        rust:
          cell: 2
          pattern: "AF\\(args=\\[(.*?)\\], attacks=\\[(.*?)\\]\\)"
          transform: text
        csharp:
