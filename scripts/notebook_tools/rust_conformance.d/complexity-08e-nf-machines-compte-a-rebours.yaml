# Conformité différentielle de Complexity-08e-NF-MachinesCompteARebours (portage Rust, kernel evcxr, std seule).
#
# Écrite à la livraison par myia-ai-01:CoursIA-2 à partir des sorties COMMITÉES
# des deux carnets : correspondance par index de cellule (le portage garde la
# structure de cellules du jumeau Python), une mesure par cellule qui imprime
# côté Python, égalité stricte du texte.
#
# Deux points meritent d'etre notes pour le lecteur :
#   - la campagne de 200 tirages rejoue le flux MT19937 de CPython a l'identique
#     (init_by_array de CPython : init_genrand(19650218) puis les deux passes non
#     lineaires, graine 20261120) ; les 200 bases sont donc les memes que celles
#     du jumeau Python, et le pas maximal pour une refutation (140) coincide ;
#   - le SHA-256 du jumeau Rust est une implementation ecrite pour ce carnet
#     (std seule, aucune crate) : elle reproduit l'empreinte de reference du
#     jumeau Python sur la formule-jouet.
#
# Le cote C# n'existe pas pour ce carnet (pas de jumeau C# dans la famille 08e) :
# aucune mesure C# n'est declaree, conformement aux entrees sans troisieme cote.
- name: "Complexity-08e-NF-MachinesCompteARebours"
  family: "InformationCalcul/Complexity"
  python: MyIA.AI.Notebooks/InformationCalcul/Complexity/Complexity-08e-NF-MachinesCompteARebours-Python.ipynb
  rust: MyIA.AI.Notebooks/InformationCalcul/Complexity/Complexity-08e-NF-MachinesCompteARebours-Rust.ipynb
  measures:
    - id: c4_text
      description: "Sortie de la cellule 4 (fermeture K1/K2/K3), texte identique au jumeau Python"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 4
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        rust:
          cell: 4
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
