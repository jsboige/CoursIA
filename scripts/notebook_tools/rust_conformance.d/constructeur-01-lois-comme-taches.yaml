          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        rust:
          cell: 5
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        csharp:
          absent: "La cellule C# 5 rend « un perpetuum mobile » (sans accent) et « possible ? -> False » (espacement différent), avec des fins de ligne CRLF, et ajoute « Un moteur alimente de 10 J rendant 8 J est-il un perpetuum mobile ? False » : côté déclaré absent, écart mesuré à la génération ; la comparaison stricte porte sur Python et Rust."
