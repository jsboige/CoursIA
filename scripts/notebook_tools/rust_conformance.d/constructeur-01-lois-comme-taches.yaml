          transform: text
        csharp:
          absent: "La cellule C# 7 rend « Bit classique (2 etats, …) » (sans accent), avec des fins de ligne CRLF et une ligne vide intercalée : côté déclaré absent, écart mesuré à la génération ; la comparaison stricte porte sur Python et Rust."
