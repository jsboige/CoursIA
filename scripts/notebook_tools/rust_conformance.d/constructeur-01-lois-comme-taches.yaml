# Conformité différentielle de Constructeur-01-Lois-Comme-Taches (portage Rust, #28018).
#
# Correspondance écrite à la main, comme le veut le registre : le portage Rust
# garde la structure de cellules du jumeau Python (20 cellules, 7 de code,
# mêmes index), donc la correspondance par index de cellule est vérifiée ici et
# déclarée explicitement — elle n'est pas déduite.
#
# Deux familles de mesures :
#
# 1. les SORTIES ENTIERES, comparées à égalité stricte du texte entre Python
#    et Rust. Le côté C# y est déclaré absent avec l'écart mesuré : il rend le
#    même contenu mais sans les accents (« Tache », « perpetuum », « etats »),
#    avec des fins de ligne CRLF et des lignes vides intercalées, et il ajoute
#    des lignes que le jumeau Python n'imprime pas (« Substrat : 6 etats
#    possibles », « Un moteur alimente de 10 J rendant 8 J … »). L'absence est
#    un fait mesuré, pas une mesure manquante.
#
# 2. les GRANDEURS FINES, comparées à trois côtés (Python, C#, Rust) sur des
#    motifs que les trois cotes impriment à l'identique.
#
# Le contrôle discriminant est `c10_verdict_mediateur_classique` : la négativité
# brute du médiateur classique vaut -2,22e-16, soit exactement le seuil, et son
# signe décide du verdict. Avec `1.0 / 2.0f64.sqrt()` le carnet imprime
# « classique » ; avec le double voisin (`FRAC_1_SQRT_2`, `0.5f64.sqrt()`,
# `2.0f64.sqrt() / 2.0`) il imprimerait « NON-CLASSIQUE ». La mesure compare le
# verdict imprimé, pas la négativité formatée — les deux se formate « 0.000 ».
- name: "Constructeur-01 Lois-Comme-Taches"
  family: "Physique/Constructeur"
  python: MyIA.AI.Notebooks/Physique/Constructeur/Constructeur-01-Lois-Comme-Taches-Python.ipynb
  csharp: MyIA.AI.Notebooks/Physique/Constructeur/Constructeur-01-Lois-Comme-Taches-CSharp.ipynb
  rust: MyIA.AI.Notebooks/Physique/Constructeur/Constructeur-01-Lois-Comme-Taches-Rust.ipynb
  measures:
    - id: c2_text
      description: "Sortie de la cellule 2, texte identique au jumeau Python"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 2
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        rust:
          cell: 2
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        csharp:
          absent: "La cellule C# 2 rend « Tache : 3 -> 4 » (sans accent), avec des fins de ligne CRLF, et ajoute « Substrat : 6 etats possibles » que le jumeau Python n'imprime pas : côté déclaré absent, écart mesuré à la génération ; la comparaison stricte porte sur Python et Rust."
