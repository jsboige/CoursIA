          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        csharp:
          absent: "Le jumeau C# imprime la meme comparaison mais avec des fins de ligne CRLF : l'egalite stricte de texte multiligne ne s'y applique pas, le makespan optimal est compare par la mesure c11_optimal_cmax (les trois cotes)."
    - id: c14_anchor
      description: "Ligne d'ancrage du diagramme de Gantt (cellule 14), identique sur les trois jumeaux ; le rendu lui-meme diverge par design (figure matplotlib en Python, SVG inline en Rust, texte en C#), seule la ligne d'ancrage est comparee"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 14
          pattern: "Diagramme de Gantt : glouton \\(haut\\) vs optimal \\(bas\\)\\."
          transform: text
        rust:
          cell: 14
          pattern: "Diagramme de Gantt : glouton \\(haut\\) vs optimal \\(bas\\)\\."
          transform: text
        csharp:
          cell: 14
          pattern: "Diagramme de Gantt : glouton \\(haut\\) vs optimal \\(bas\\)\\."
          transform: text
    - id: c18_text
      description: "Sortie de la cellule 18 (exercice 1), texte identique aux deux autres jumeaux"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 18
