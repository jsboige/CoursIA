# Conformité différentielle de Search-03d-WeightedAstar (portage Rust nb_coder).
#
# Écrite à la livraison par nb_coder_integrate depuis les sorties COMMITÉES
# des carnets : correspondance par index de cellule (le portage garde la
# structure de cellules du jumeau Python, scellée par twin-parity), une
# mesure par cellule qui imprime côté Python, égalité stricte du texte ;
# les lignes de durée murale sont des ancres en présence seule. Le côté
# C# est comparé où sa cellule alignée imprime le même texte, sinon
# déclaré absent avec l'écart mesuré. À corriger À LA MAIN si une
# divergence est un écart d'API documenté : le fichier n'est jamais
# réécrit par l'outil une fois présent.
- name: "Search-03d-WeightedAstar"
  family: "Search/Part1-Foundations"
  python: MyIA.AI.Notebooks/Search/Part1-Foundations/Search-03d-WeightedAstar.ipynb
  csharp: MyIA.AI.Notebooks/Search/Part1-Foundations/Search-03d-WeightedAstar-CSharp.ipynb
  rust: MyIA.AI.Notebooks/Search/Part1-Foundations/Search-03d-WeightedAstar-Rust.ipynb
  measures:
    - id: c2_text
      description: "Sortie de la cellule 2, texte identique au jumeau Python"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 2
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        rust:
          cell: 2
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        csharp:
          absent: "La cellule C# 2 diffère du texte Python (ligne 1 : « Grille 25x25 : 91 murs (15%), départ (0, 0), but (24, 24) (s » contre « Grille 25x25 : 90 murs (14%), départ (0, 0), but (24, 24). » côté Python) : côté déclaré absent, mesuré à la génération ; la comparaison stricte porte sur Python et Rust."
    - id: c4_text
      description: "Sortie de la cellule 4, texte identique au jumeau Python"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 4
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        rust:
          cell: 4
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        csharp:
          absent: "La cellule C# 4 diffère du texte Python (ligne 1 : « A*     (W=1, optimal)   : coût =  79 | nœuds développés = 49 » contre « A*     (W=1, optimal)   : coût =  78 | nœuds développés = 47 » côté Python) : côté déclaré absent, mesuré à la génération ; la comparaison stricte porte sur Python et Rust."
    - id: c6_text
      description: "Sortie de la cellule 6, texte identique au jumeau Python"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 6
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        rust:
          cell: 6
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        csharp:
          absent: "La cellule C# 6 diffère du texte Python (ligne 3 : «   1,0 |    79 |     1,000 |    1,00 |    497 | 100,0% | OUI » contre «   1.0 |    78 |     1.000 |    1.00 |    472 | 100.0% | OUI » côté Python) : côté déclaré absent, mesuré à la génération ; la comparaison stricte porte sur Python et Rust."
    - id: c7_text
