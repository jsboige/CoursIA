# Conformité différentielle de App-01-NQueens (portage Rust, issue #28086, lot 4 #27132).
#
# Écrite à la livraison depuis les sorties COMMITTÉES des deux carnets :
# correspondance par index de cellule (le portage garde les 69 cellules du jumeau
# Python), une mesure par grandeur comparable, tolérance 0 (dénombrements,
# itérations, solutions, statuts CP-SAT). Les motifs sont généraux : aucune
# valeur attendue n'est codée en dur, la comparaison porte le texte extrait de
# chaque côté.
#
# Les temps ne sont JAMAIS comparés : chaque motif de tableau saute la colonne de
# durée (écueil 8 de la spec et rust-porting-spec.md : l'hémisphère
# algorithmique s'effondre en Rust, l'écart est déclaré dans le corps de PR).
# Hors registre, et pour quoi :
#   - cellules 6, 17, 24, 26, 38 : le côté Python n'imprime qu'une figure ;
#     le jumeau Rust la remplace par un échiquier ou une table texte (leurs
#     valeurs sont celles des cellules 15 et 22, mesurées ici) ;
#   - cellule 36 : temps seuls, hors les deux marqueurs d'omission mesurés ;
#   - cellules 49, 51, 53 : seuil de croisement, TIMEOUT et gagnants sont
#     REMESURÉS (dépendants de la vitesse machine), documentés d'une ligne dans
#     le carnet ; les nœuds des tailles interrompues (N = 110 à 200 en c53) sont
#     des comptes partiels au timeout, non comparables -- seules les itérations
#     de min-conflicts et les nœuds des tailles achevées des deux côtés le sont ;
#   - cellule 60, colonnes « gain » : rapports de temps, machine-dépendants.
# Le carnet C# n'est pas membre de ce registre : sa parité avec le Python est
# tenue par twin_pairs.d/app-1-nqueens.yaml.
- name: App-01-NQueens
  family: Search/Part3-Cas-pratiques
  python: MyIA.AI.Notebooks/Search/Part3-Cas-pratiques/App-01-NQueens-Python.ipynb
  rust: MyIA.AI.Notebooks/Search/Part3-Cas-pratiques/App-01-NQueens-Rust.ipynb
