  - id: c9_text
    description: 'Cellule 9 : solution du backtracking simple et noeuds explores, texte identique'
    tolerance: 0
    reference: python
    sides:
      python:
        cell: 9
        pattern: \A\s*(.*?)\s*\Z
        transform: text
      rust:
        cell: 9
        pattern: \A\s*(.*?)\s*\Z
        transform: text
