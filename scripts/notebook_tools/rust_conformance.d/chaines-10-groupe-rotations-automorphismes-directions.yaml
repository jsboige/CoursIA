# Conformité différentielle de Chaines-10-Groupe-Rotations-Automorphismes-Directions (portage Rust).
#
# Écrite à la livraison depuis les sorties COMMITÉES des carnets :
# correspondance par index de cellule (le portage garde la structure de
# cellules du jumeau Python, scellée par twin-parity), une mesure par cellule
# qui imprime côté Python, égalité stricte du texte.
#
# Le côté C# est DÉCLARÉ ABSENT, mesuré : son texte diffère du texte Python
# dans les onze cellules -- fins de ligne CRLF là où le texte est identique,
# « vrai, vrai, vrai » au lieu de « [True, True, True] », « -> CONFORME » au
# lieu de « -> True », et lignes de TODO supplémentaires sur les cellules
# d'exercice. L'écart est un écart de formatage d'API, non un écart de
# mesure : les valeurs (32, 4, 8, 24, 3, profil D8, 5 classes, (-1,-1,-1),
# 3) coïncident. La comparaison stricte porte sur Python et Rust.

- name: "Chaines-10-Groupe-Rotations-Automorphismes-Directions"
  family: "Physique/Chaines"
  python: MyIA.AI.Notebooks/Physique/Chaines/Chaines-10-Groupe-Rotations-Automorphismes-Directions-Python.ipynb
  csharp: MyIA.AI.Notebooks/Physique/Chaines/Chaines-10-Groupe-Rotations-Automorphismes-Directions-CSharp.ipynb
  rust: MyIA.AI.Notebooks/Physique/Chaines/Chaines-10-Groupe-Rotations-Automorphismes-Directions-Rust.ipynb
  measures:
    - id: c3_text
      description: "Sortie de la cellule 3, texte identique au jumeau Python"
      tolerance: 0
      reference: python
      sides:
        python:
