          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        rust:
          cell: 3
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        csharp:
          absent: "La cellule C# 3 differe du texte Python (ligne 1 : « Matrices monomiales 2x2 a phases racines quatriemes : 32 -... » contre « Matrices monomiales 2x2 a phases racines quatriemes : 32 -... » cote Python) : cote declare absent, mesure a la generation ; la comparaison stricte porte sur Python et Rust."
