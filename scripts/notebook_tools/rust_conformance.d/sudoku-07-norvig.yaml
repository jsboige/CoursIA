# Conformité différentielle de Sudoku-07-Norvig (portage Rust nb_coder).
#
# Écrite à la livraison par nb_coder_integrate depuis les sorties COMMITÉES
# des carnets : correspondance par index de cellule (le portage garde la
# structure de cellules du jumeau Python, scellée par twin-parity), une
# mesure par cellule qui imprime côté Python, égalité stricte du texte ;
# les lignes de durée murale sont des ancres en présence seule. Le côté
# C# est comparé où sa cellule alignée imprime le même texte, sinon
# déclaré absent avec l'écart mesuré. À corriger À LA MAIN si une
# divergence est un écart d'API documenté : le fichier n'est jamais
# réécrit par l'outil une fois présent.
- name: "Sudoku-07-Norvig"
  family: "Sudoku"
  python: MyIA.AI.Notebooks/Sudoku/Sudoku-07-Norvig-Python.ipynb
  csharp: MyIA.AI.Notebooks/Sudoku/Sudoku-07-Norvig-CSharp.ipynb
  rust: MyIA.AI.Notebooks/Sudoku/Sudoku-07-Norvig-Rust.ipynb
  measures:
    - id: c3_text
      description: "Sortie de la cellule 3, texte identique au jumeau Python"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 3
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        rust:
          cell: 3
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        csharp:
          absent: "Le carnet C# n'a pas de cellule de code à l'index 3 (structure de cellules différente du jumeau Python) : côté déclaré absent, mesuré à la génération ; la comparaison stricte porte sur Python et Rust."
