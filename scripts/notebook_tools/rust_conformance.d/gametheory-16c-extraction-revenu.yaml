          transform: digits
        rust:
          cell: 6
          pattern: '\(0, 1\)\s+(\d+\s+\d+\s+\d+\s+\d+)'
          transform: digits
        csharp:
          cell: 6
          pattern: '\(0,1\)\s*\|\s*(\d+\s*\|\s*\d+\s*\|\s*\d+\s*\|\s*\d+)'
          transform: digits
    - id: frontiere_10
      description: "Instance (1,0) : admissibles / bien-etre optimal / revenu>0 / revenu maximal"
