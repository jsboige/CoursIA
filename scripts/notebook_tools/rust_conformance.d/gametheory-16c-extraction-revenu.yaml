- name: "GameTheory-16c Extraction-de-Revenu-DSIC-IR"
  family: GameTheory
  python: MyIA.AI.Notebooks/GameTheory/GameTheory-16c-Extraction-de-Revenu-DSIC-IR-Python.ipynb
  csharp: MyIA.AI.Notebooks/GameTheory/GameTheory-16c-Extraction-de-Revenu-DSIC-IR-CSharp.ipynb
  rust: MyIA.AI.Notebooks/GameTheory/GameTheory-16c-Extraction-de-Revenu-DSIC-IR-Rust.ipynb
  measures:
    - id: runtime_banniere
      description: "Banniere de runtime du port Rust (la source publie sa version de Python ; la substitution est une tolerance de presence prescrite par la spec #27793)"
      tolerance: 0
      reference: rust
      sides:
        rust:
          cell: 3
          pattern: 'Runtime Rust : ([^\n]*)'
          transform: text
        python:
          absent: >-
            La source Python publie `Runtime Python : 3.13.16` ; le port
            remplace cette ligne par sa propre banniere Rust (tolerance de
            presence de la spec : le port n'affiche jamais le mot « Python »).
            Cote declare ABSENT, la ligne de runtime n'etant pas une grandeur
            de calcul.
        csharp:
          absent: >-
            Le jumeau C# publie `Runtime : .NET 10.0.14` ; meme raison que le
            cote Python (tolerance de presence).
    - id: issue_profil_vrai
      description: "Issue choisie par le designer GT-16b au profil vrai (1,1)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 3
          pattern: 'issue\(\(1,1\)\) = (\d)'
          transform: int
        rust:
          cell: 3
          pattern: 'issue\(\(1,1\)\) = (\d)'
          transform: int
        csharp:
          cell: 3
          pattern: 'issue=(\d)'
          transform: int
    - id: bien_etre_designer
      description: "Bien-etre J atteint par le designer GT-16b"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 3
          pattern: 'Bien-etre J = (\d+)'
          transform: int
        rust:
          cell: 3
          pattern: 'Bien-etre J = (\d+)'
          transform: int
        csharp:
          cell: 3
          pattern: 'bien-être=(\d+)'
          transform: int
    - id: revenu_designer
      description: "Revenu du designer GT-16b (paiements nuls)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 3
          pattern: 'Revenu = (\d+)'
          transform: int
        rust:
          cell: 3
          pattern: 'Revenu = (\d+)'
          transform: int
        csharp:
          cell: 3
          pattern: 'revenu=(\d+)'
          transform: int
    - id: espace_tables_issues
      description: "Nombre de tables d'issues visitees par le generateur (2^4)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 3
          pattern: 'generateur : (\d+) tables'
          transform: int
        rust:
          cell: 3
          pattern: 'generateur : (\d+) tables'
          transform: int
        csharp:
          cell: 3
          pattern: 'Générateur : (\d+) tables'
          transform: int
    - id: espace_table_paiements
      description: "Nombre de tables de paiements par table d'issues (4^4)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 3
          pattern: 'des mecanismes   : \d+ x (\d+) ='
          transform: int
        rust:
          cell: 3
          pattern: 'des mecanismes   : \d+ x (\d+) ='
          transform: int
        csharp:
          cell: 3
          pattern: '× (\d+) ='
          transform: int
    - id: espace_total_candidats
      description: "Espace complet des mecanismes (16 x 256)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 3
          pattern: '= (\d+) candidats'
          transform: int
        rust:
          cell: 3
          pattern: '= (\d+) candidats'
          transform: int
        csharp:
          cell: 3
          pattern: '= (\d+) mécanismes'
          transform: int
    - id: entete_frontiere
      description: "En-tete de la table de frontiere (rendu identique au caractere pres par le port)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 6
          pattern: '(instance\s+admissibles\s+welfare-opt\s+dont revenu>0\s+max rev@fb)'
          transform: text
        rust:
          cell: 6
          pattern: '(instance\s+admissibles\s+welfare-opt\s+dont revenu>0\s+max rev@fb)'
          transform: text
        csharp:
          absent: >-
            Le jumeau C# rend un tableau pipe-separe (`Types | admissibles | ...`)
            et non le tableau aligne de la source : la grandeur n'est pas
            comparable au caractere pres. Les valeurs de la table sont
            comparees, elles, mesure par mesure (`frontiere_00` a
            `frontiere_11`).
    - id: frontiere_00
      description: "Instance (0,0) : admissibles / bien-etre optimal / revenu>0 / revenu maximal"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 6
          pattern: '\(0, 0\)\s+(\d+\s+\d+\s+\d+\s+\d+)'
          transform: digits
        rust:
          cell: 6
          pattern: '\(0, 0\)\s+(\d+\s+\d+\s+\d+\s+\d+)'
          transform: digits
        csharp:
          cell: 6
          pattern: '\(0,0\)\s*\|\s*(\d+\s*\|\s*\d+\s*\|\s*\d+\s*\|\s*\d+)'
          transform: digits
    - id: frontiere_01
