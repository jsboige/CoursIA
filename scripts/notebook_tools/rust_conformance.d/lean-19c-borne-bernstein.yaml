# Conformité différentielle de Lean-19c-Borne-Bernstein (portage Rust nb_coder).
#
# Écrite à la livraison par nb_coder_integrate depuis les sorties COMMITÉES
# des carnets : correspondance par index de cellule (le portage garde la
# structure de cellules du jumeau Python, scellée par twin-parity), une
# mesure par cellule qui imprime côté Python, égalité stricte du texte ;
# les lignes de durée murale sont des ancres en présence seule. Le côté
# C# est comparé où sa cellule alignée imprime le même texte, sinon
# déclaré absent avec l'écart mesuré. À corriger À LA MAIN si une
# divergence est un écart d'API documenté : le fichier n'est jamais
# réécrit par l'outil une fois présent.
- name: "Lean-19c-Borne-Bernstein"
  family: "SymbolicAI/Lean"
  python: MyIA.AI.Notebooks/SymbolicAI/Lean/Lean-19c-Borne-Bernstein-Python.ipynb
  rust: MyIA.AI.Notebooks/SymbolicAI/Lean/Lean-19c-Borne-Bernstein-Rust.ipynb
  measures:
    - id: c2_text
      description: "Sortie de la cellule 2, texte identique au jumeau Python"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 2
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        rust:
          cell: 2
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
    - id: c5_text
      description: "Sortie de la cellule 5, texte identique au jumeau Python"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 5
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        rust:
          cell: 5
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
    - id: c8_text
      description: "Sortie de la cellule 8, texte identique au jumeau Python"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 8
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        rust:
          cell: 8
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
