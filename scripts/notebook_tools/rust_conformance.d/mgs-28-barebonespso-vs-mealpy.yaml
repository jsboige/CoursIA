          transform: text
    - id: c20_text
      description: "Sortie de la cellule 20, texte identique au jumeau Python"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 20
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        rust:
