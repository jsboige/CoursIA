# Triplet GameTheory-16j : jumeau Python + jumeau C# + portage Rust (issue #27964,
# spec Rust portage lot GameTheory II). Les trois carnets ont exactement la meme
# structure 24 cellules (memes indices de cellules code : 2, 5, 8, 10, 13, 15, 18,
# 21) : les cotes se correspondent par index. Cote Rust = evcxr, std seul (aucune
# crate externe ; le `import numpy as np` du carnet Python disparait — la spec
# verifie par module sentinelle que numpy n'est JAMAIS appele a l'execution, ses
# seules mentions vivent dans les branches else des correcteurs : np.isfinite /
# np.bool_ -> f64::is_finite et bool en Rust).
# Le jumeau C# imprime des lignes condensees aux formats propres (F2/F3, une
# ligne par resultat la ou Python/Rust en impriment plusieurs) : les grandeurs
# sont comparees en float (transform) quand le texte differe, en text quand il
# est identique. Tolerance unique 0 : aucune divergence de valeur mesuree.
# Anomalie du correcteur de l'exercice 2 (cellule 13), mesuree par la spec et
# PRESERVEE telle quelle (non corrigée) : au cas 0 (auto-selection du type haut),
# u_propre < u_autre d'un arrondi flottant alors que l'indifference est exacte —
# la solution naive `u_p >= u_a` est REJETEE (AssertionError), acceptee avec la
# tolerance 1e-9 que l'enonce demande d'appliquer. Le carnet Rust porte le meme
# assert, jamais atteint avec le stub a None.
# Timeout d'execution (spec #27964) : min(15 x duree du bloc commite, 300 s) --
# duree mesuree 13.52999 s -> timeout 203 s.
- name: "GameTheory-16j Screening Loyer Information"
  family: "GameTheory (mécanismes, screening)"
  python: MyIA.AI.Notebooks/GameTheory/GameTheory-16j-Screening-Loyer-Information-Python.ipynb
  csharp: MyIA.AI.Notebooks/GameTheory/GameTheory-16j-Screening-Loyer-Information-CSharp.ipynb
  rust: MyIA.AI.Notebooks/GameTheory/GameTheory-16j-Screening-Loyer-Information-Rust.ipynb
  measures:
    - id: modele_theta_h
      description: "Type haut du modele (theta_H = 2, calcule)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 2
          pattern: "theta_H = ([\\d.]+)"
          transform: float
        csharp:
          cell: 2
          pattern: "thetaH=(\\d+)"
          transform: float
        rust:
          cell: 2
          pattern: "theta_H = ([\\d.]+)"
          transform: float
    - id: modele_p_h
      description: "Probabilite du type haut (p_H = 0.5)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 2
          pattern: "p_H = ([\\d.]+)"
          transform: float
        csharp:
          cell: 2
          pattern: "pH=([\\d.]+)"
          transform: float
        rust:
          cell: 2
          pattern: "p_H = ([\\d.]+)"
          transform: float
    - id: cout_haut_a2
      description: "Cout d'effort du type haut a a=2 (C(2,2) = 1, croisement simple)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 2
          pattern: "C\\(2, a=2\\) = ([\\d.]+)"
          transform: float
        csharp:
          cell: 2
          pattern: "coût haut à a=2 : ([\\d.]+)"
          transform: float
        rust:
          cell: 2
          pattern: "C\\(2, a=2\\) = ([\\d.]+)"
          transform: float
    - id: cout_bas_a2
      description: "Cout d'effort du type bas a a=2 (C(1,2) = 2)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 2
          pattern: "C\\(1, a=2\\) = ([\\d.]+)"
          transform: float
        csharp:
          cell: 2
          pattern: "coût bas : ([\\d.]+)"
          transform: float
        rust:
