          transform: float
    - id: premier_optimum_surplus_bas
      description: "Surplus du type bas au premier optimum (a* = 1, information complete)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 5
          pattern: "type bas : a\\* = [\\d.]+,  t = [\\d.]+,  surplus = ([\\d.]+)"
          transform: float
        csharp:
