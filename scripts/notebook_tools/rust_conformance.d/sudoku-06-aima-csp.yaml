# Conformité différentielle de Sudoku-06-AIMA-CSP (portage Rust nb_coder).
#
# Écrite à la livraison par nb_coder_integrate depuis les sorties COMMITÉES
# des carnets : correspondance par index de cellule (le portage garde la
# structure de cellules du jumeau Python, scellée par twin-parity), une
# mesure par cellule qui imprime côté Python, égalité stricte du texte ;
# les lignes de durée murale sont des ancres en présence seule. Le côté
# C# est comparé où sa cellule alignée imprime le même texte, sinon
# déclaré absent avec l'écart mesuré. À corriger À LA MAIN si une
# divergence est un écart d'API documenté : le fichier n'est jamais
# réécrit par l'outil une fois présent.
#
# Cellules non mesurées (motif relevé à la génération) :
#   - c3_text: valeur non comparée, déclarée par la spec (#28944, Tolerances, cellule 3) : **ecart declare** -- 4 morceaux mesurés
#   - c33_text: valeur non comparée, déclarée par la spec (#28944, Tolerances, cellule 33) : **non comparee** -- 23 morceaux mesurés
#   - c38_text: valeur non comparée, déclarée par la spec (#28944, Tolerances, cellule 38) : **non comparee** -- 12 morceaux mesurés
#
# Valeurs non comparées (lignes de tolérance de la spec, appliquées
# comme un MASQUE : la mesure reste écrite, un morceau par jeton, la valeur
# nommée seule est masquée) :
#   - c3_text : valeur non comparée, déclarée par la spec (#28944, Tolerances, cellule 3) : **ecart declare**
#   - c33_text : valeur non comparée, déclarée par la spec (#28944, Tolerances, cellule 33) : **non comparee**
#   - c38_text : valeur non comparée, déclarée par la spec (#28944, Tolerances, cellule 38) : **non comparee**
