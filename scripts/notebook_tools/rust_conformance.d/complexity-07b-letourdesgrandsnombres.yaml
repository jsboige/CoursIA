# Conformité différentielle de Complexity-07b-LeTourDesGrandsNombres (portage Rust nb_coder).
#
# Écrite à la livraison par nb_coder_integrate depuis les sorties COMMITÉES
# des carnets : correspondance par index de cellule (le portage garde la
# structure de cellules du jumeau Python, scellée par twin-parity), une
# mesure par cellule qui imprime côté Python, égalité stricte du texte ;
# les lignes de durée murale sont des ancres en présence seule. Le côté
# C# est comparé où sa cellule alignée imprime le même texte, sinon
# déclaré absent avec l'écart mesuré. À corriger À LA MAIN si une
# divergence est un écart d'API documenté : le fichier n'est jamais
# réécrit par l'outil une fois présent.
- name: "Complexity-07b-LeTourDesGrandsNombres"
  family: "InformationCalcul/Complexity"
  python: MyIA.AI.Notebooks/InformationCalcul/Complexity/Complexity-07b-LeTourDesGrandsNombres-Python.ipynb
  csharp: MyIA.AI.Notebooks/InformationCalcul/Complexity/Complexity-07b-LeTourDesGrandsNombres-CSharp.ipynb
  rust: MyIA.AI.Notebooks/InformationCalcul/Complexity/Complexity-07b-LeTourDesGrandsNombres-Rust.ipynb
  measures:
    - id: c2_text
      description: "Sortie de la cellule 2, texte identique au jumeau Python"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 2
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        rust:
          cell: 2
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        csharp:
          absent: "La cellule C# 2 diffère du texte Python (ligne 1 : « googol : 101 chiffres » contre « googol = 10**100 : 101 chiffres (Mesure) » côté Python) : côté déclaré absent, mesuré à la génération ; la comparaison stricte porte sur Python et Rust."
    - id: c5_text
      description: "Sortie de la cellule 5, texte identique au jumeau Python (segment 1/1 ; durées murales en présence seule, valeurs jamais comparées)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 5
          pattern: "\\A\\s*(.*?)\\s*(?m:^A\\(3,8\\)\\ =\\ 2045\\ calculé\\ en\\ \\d+(?:[.,]\\d+)?\\ ms\\ \\(Mesure,\\ ce\\ noyau\\)\\r?$)"
          transform: text
        rust:
          cell: 5
          pattern: "\\A\\s*(.*?)\\s*(?m:^A\\(3,8\\)\\ =\\ 2045\\ calculé\\ en\\ \\d+(?:[.,]\\d+)?\\ ms\\ \\(Mesure,\\ ce\\ noyau\\)\\r?$)"
          transform: text
        csharp:
          absent: "La cellule C# 5 n'imprime pas les lignes-ancres de durée du segment Python : côté déclaré absent, mesuré à la génération ; la comparaison stricte porte sur Python et Rust."
    - id: c8_text
      description: "Sortie de la cellule 8, texte identique au jumeau Python"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 8
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        rust:
          cell: 8
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        csharp:
          absent: "La cellule C# 8 diffère du texte Python (ligne 1 : « 3↑↑3=7625597484987 (13 chiffres) » contre « 3↑↑3 = 3^3^3 = 7625597484987 (Mesure, 13 chiffres) » côté Python) : côté déclaré absent, mesuré à la génération ; la comparaison stricte porte sur Python et Rust."
