# Paire ML 2.3b : jumeau Python + portage Rust (issue #27134, lot 6 de l'Epic
# Origami Rust). Les deux carnets ont la meme structure -- 26 cellules, cellules
# de code aux memes indices -- donc les cotes se correspondent par index.
# Cote Rust : evcxr + smartcore 0.7.0. Cote Python : scikit-learn + numpy.
#
# Ce qui se compare, et ce qui ne se compare pas
# ----------------------------------------------
# Deux differences separent les deux carnets, et la seconde decide du signe :
#  - le GENERATEUR differe (numpy default_rng cote Python, xorshift64 +
#    Box-Muller cote Rust) ;
#  - la REGLE D'ETIQUETTE differe. Cote Python, l'etiquette est tiree a pile ou
#    face, independante de x, puis la classe 1 est translatee uniformement
#    (0.9/sqrt(12) en A, 0.7/sqrt(12) en B), et le jeu de test est fixe (2 000
#    lignes, tirees une fois par scenario). Cote Rust, l'etiquette depend de x
#    avant tout decalage (moyenne des six premieres dimensions en A, difference
#    des deux facteurs en B), et le jeu de test est le reste du tirage de
#    2*n_max lignes : 3 825 points a n = 15, 1 920 a n = 1 920.
#
# Consequence mesuree (40 000 lignes d'entrainement, 200 000 de test, MEME
# generateur numpy, seule la regle d'etiquette change) : NB - LR vaut +0.0000 /
# +0.0002 / -0.0001 avec la regle Python et -0.0067 / -0.0076 / -0.0069 avec la
# regle Rust. L'ordre a grand n suit la regle d'etiquette, pas le generateur :
# c'est pour cela que le scenario A bascule cote Rust et pas cote Python, et
# aucun signe n'est mesure a grand n pour ce scenario.
#
# Les NIVEAUX absolus ne sont donc pas comparables non plus, et le registre ne
# les compare pas :
#  - l'accuracy de la cellule 4 se compare a 0,05 pres, et cette tolerance est
#    une MARGE DECLAREE, pas une conformite fine : ce sont deux tirages d'une
#    meme construction (200 lignes, d = 6, etiquette a pile ou face, decalage
#    1.2), dont la precision de resubstitution vaut 0.933 +- 0.018 sur 5 000
#    tirages mesures ; 0,05 vaut donc deux ecarts-types de la difference de
#    deux tirages (mesure : 0.965 cote Rust contre 0.925 cote Python, soit
#    0,040, ou 1,6 ecart-type de cette difference). La conformite fine, cote
#    Rust, est portee par predictions_identiques ;
#  - les regimes des cellules 11 et 13 se comparent par le SIGNE de l'ecart
#    NB - LR au meme budget, et seulement la ou le signe est STABLE de part et
#    d'autre. Stabilite mesuree (moyenne de 40 tirages ; graines de scenario 1
#    a 10 cote Rust, 3 a 12 cote Python ; le tirage de chaque carnet est du
#    signe attendu) : A a n = 30 positif 10/10 et 5/5 ; A a n = 240 positif
#    10/10 et 5/5 ; B a n = 120 negatif 10/10 et 10/10. B a n = 30 n'est PAS
#    mesure : il y compare un signe de bruit -- la moyenne y est positive sur
#    9/10 graines cote Rust (la graine 2 du carnet est la seule negative) et
#    sur 6/10 cote Python.
#
# Hors registre, avec leur motif :
#  - les cartes ASCII des cellules 11 et 13 sont des RENDUS, pas des grandeurs ;
#    elles se lisent qualitativement dans la prose du carnet ;
#  - les moyennes empiriques de la cellule 4 appartiennent au GENERATEUR, pas au
#    modele : elles different legitimement d'un cote a l'autre (1.080 / 1.181 /
#    1.237 cote Rust, 1.262 / 0.913 / 1.160 cote Python), et les comparer
#    mesurerait l'ecart des generateurs en le presentant comme celui des modeles ;
#  - les bannieres de la cellule 1 n'ont aucune grandeur commune (version de
#    NumPy et graine d'un cote, configuration smartcore de l'autre) : l'absence
#    est declaree cote Python plutot que passee sous silence.
- name: "ML 2.3b Naive Bayes generatif contre regression logistique"
  family: ML/DataScienceWithAgents/02-ML-Cours
  python: MyIA.AI.Notebooks/ML/DataScienceWithAgents/02-ML-Cours/2.3b-Naive-Bayes-Generatif.ipynb
  rust: MyIA.AI.Notebooks/ML/DataScienceWithAgents/02-ML-Cours/2.3b-Naive-Bayes-Generatif-Rust.ipynb
  measures:
    - id: pret_from_scratch
      description: "Ligne de disponibilite du Naive Bayes ecrit a la main (identique des deux cotes)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 3
          pattern: "(Naive Bayes gaussien from scratch pr[^\\n]*)"
          transform: text
        rust:
          cell: 3
          pattern: "(Naive Bayes gaussien from scratch pr[^\\n]*)"
          transform: text
    - id: accuracy_from_scratch
      description: "Precision du modele ecrit a la main sur son propre echantillon (Python 0.925) ; la tolerance est une marge declaree entre deux tirages d'une meme construction, voir l'en-tete"
      tolerance: 0.05
      reference: python
      sides:
        python:
          cell: 4
          pattern: "accuracy from scratch : ([0-9.]+)"
          transform: float
        rust:
          cell: 4
          pattern: "accuracy from scratch : ([0-9.]+)"
          transform: float
    - id: accuracy_bibliotheque
      description: "Precision du modele de la bibliotheque sur les memes donnees (sklearn / smartcore)"
      tolerance: 0.05
      reference: python
      sides:
        python:
          cell: 4
          pattern: "accuracy (?:sklearn|smartcore)\\s+: ([0-9.]+)"
          transform: float
        rust:
          cell: 4
          pattern: "accuracy (?:sklearn|smartcore)\\s+: ([0-9.]+)"
          transform: float
    - id: predictions_identiques
      description: "Le modele maison et celui de la bibliotheque rendent les memes predictions (True cote Python, true cote Rust)"
      tolerance: 0
      case_insensitive: true
      reference: python
      sides:
        python:
          cell: 4
          pattern: "identiques \\(0/1\\) : (\\w+)"
          transform: text
        rust:
          cell: 4
          pattern: "identiques \\(0/1\\) : (\\w+)"
          transform: text
    - id: regime_a_30
      description: "Scenario A (correlations homogenes) a n = 30 : Naive Bayes devant (signe de NB - LR, stable sur 10/10 graines cote Rust et 5/5 cote Python)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 11
          pattern: "\\n\\s*30\\s+0\\.\\d+\\s+0\\.\\d+\\s+([+-])"
          transform: text
        rust:
          cell: 11
          pattern: "\\n\\s*30\\s+0\\.\\d+\\s+0\\.\\d+\\s+([+-])"
          transform: text
    - id: regime_a_240
      description: "Scenario A a n = 240 : l'ecart fond mais Naive Bayes est encore devant (signe stable sur 10/10 graines cote Rust et 5/5 cote Python)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 11
          pattern: "\\n\\s*240\\s+0\\.\\d+\\s+0\\.\\d+\\s+([+-])"
          transform: text
        rust:
          cell: 11
          pattern: "\\n\\s*240\\s+0\\.\\d+\\s+0\\.\\d+\\s+([+-])"
          transform: text
    - id: regime_b_120
      description: "Scenario B (correlations en bloc) a n = 120 : la logistique passe devant (signe stable sur 10/10 graines de chaque cote)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 13
          pattern: "\\n\\s*120\\s+0\\.\\d+\\s+0\\.\\d+\\s+([+-])"
          transform: text
        rust:
          cell: 13
          pattern: "\\n\\s*120\\s+0\\.\\d+\\s+0\\.\\d+\\s+([+-])"
          transform: text
    - id: regime_b_1920
      description: "Scenario B a n = 1920 : l'ecart ne se referme pas (la logistique reste devant)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 13
          pattern: "\\n\\s*1920\\s+0\\.\\d+\\s+0\\.\\d+\\s+([+-])"
          transform: text
        rust:
          cell: 13
          pattern: "\\n\\s*1920\\s+0\\.\\d+\\s+0\\.\\d+\\s+([+-])"
          transform: text
    - id: exercice_1
      description: "Ligne d'exercice 1 (stub des deux cotes)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 7
          pattern: "(Exercice 1 [^\\n]*)"
          transform: text
        rust:
          cell: 7
          pattern: "(Exercice 1 [^\\n]*)"
          transform: text
    - id: exercice_2
      description: "Ligne d'exercice 2 (stub des deux cotes)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 16
          pattern: "(Exercice 2 [^\\n]*)"
          transform: text
        rust:
          cell: 16
          pattern: "(Exercice 2 [^\\n]*)"
          transform: text
    - id: exercice_3
      description: "Ligne d'exercice 3 (stub des deux cotes)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 20
          pattern: "(Exercice 3 [^\\n]*)"
          transform: text
        rust:
          cell: 20
          pattern: "(Exercice 3 [^\\n]*)"
          transform: text
    - id: banniere_configuration
      description: "Banniere du carnet Rust (cote Python : aucune grandeur commune)"
      tolerance: 0
      reference: rust
      sides:
        python:
          absent: >-
            Le jumeau Python affiche la version de NumPy et sa graine (« NumPy
            2.3.5 pret ; graine 7 ») ; le portage Rust affiche sa configuration
            smartcore. Les deux bannieres n'ont aucune grandeur commune : rien a
            comparer, et le fait est declare plutot que passe sous silence.
        rust:
          cell: 1
          pattern: "(Configuration OK : 2\\.3b [^\\n]*)"
          transform: text
