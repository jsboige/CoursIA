# Triplet Metajeux-05 : jumeau Python + jumeau C# + portage Rust (spec #27945, port livre par la PR #27981).
#
# Les trois carnets ont la meme structure de cellules (31 cellules, 13 cellules de code) :
# les cotes se correspondent par index de cellule.
#
# Ce que la mesure prepare a montre sur les sorties commitees (cellule par cellule) :
#   - les 10 cellules de MESURE (2, 4, 6, 8, 10, 13, 15, 17, 19, 21) sont IDENTIQUES caractere
#     par caractere entre Python et Rust ;
#   - les 3 cellules d'EXERCICE (24, 26, 28) different : le stub Python ne produit aucune sortie
#     (il ne se limite qu'a des commentaires), le stub Rust imprime une ligne de titre
#     ("Exercice A : a completer (...)"). L'ecart est declare cote Python ;
#   - le cote C# derive en FORMAT (fins de ligne CRLF, lignes "(attendu N) -> CONFORME" en plus)
#     sur les cellules de mesure -- les valeurs y coincident, les motifs ci-dessous sont donc
#     ecrits pour etre insensibles au CRLF -- et il derive en CONTENU sur les cellules 13, 15 et 17
#     : le C# y porte des EXEMPLES GUIDES a completer la ou Python et Rust livrent la RESOLUTION.
#     Ces trois cellules sont declarees absentes cote C#.
# Le portage Rust est en `std` seul (aucune crate) ; les deux cellules d'exemple guide resolues
# (13 et 15) sont les memes des deux cotes.
- name: "Metajeux-05 Temoins Impossibilite"
  family: "GameTheory (Metajeux)"
  python: MyIA.AI.Notebooks/GameTheory/Metajeux/Metajeux-05-Temoins-Impossibilite-Python.ipynb
