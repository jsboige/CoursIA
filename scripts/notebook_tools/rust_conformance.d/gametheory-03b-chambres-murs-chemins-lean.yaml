# Conformite differentielle du triplet GameTheory-03b (Chambres, murs et
# chemins, issue #27941).
#
# Le portage Rust (kernel evcxr, `std` seul) reprend le carnet Python a
# l'identique : memes 75 ordres faibles, memes 576 chambres, memes BFS,
# memes temoins Coxeter. Les `Counter`/`defaultdict` Python deviennent des
# `BTreeMap`, les tuples des tuples natifs, et le rendu des grandeurs
# Python (True, {3: 24}) passe par des helpers (py_bool, rendu BTreeMap).
#
# Les trois cotes ont la MEME structure de cellules (70 cellules, 26 code aux
# memes index) : la correspondance des cellules est directe.
#
# Cote C# : declare. Le carnet C# est sur main depuis #27681 (fusionnee le
# 2026-11-23), apres l'ecriture de ce registre : le commentaire qui disait le
# cote « absent du triplet » etait devenu faux, il est remplace ici. Ses
# sorties sont ecrites par .NET Interactive sous Windows et portent des fins de
# ligne CRLF ; les mesures de texte le comparent donc avec la transformation
# `text_lf` (fins de ligne ramenees a LF, rien d'autre n'est normalise). Sur
# les 24 mesures, 14 coincident alors avec le Python -- verifie a la tete.
# Les 10 autres portent un ecart de RENDU mesure sur ses sorties, et sont
# declarees `absent` avec leur motif : accents absents, tuple a un element
# rendu (4) au lieu de (4,), tuple de tuples sans parentheses exterieures,
# listes sans crochets ni quotes, largeur de champ des colonnes, espaces
# autour des parentheses et des fleches. Leur parite semantique est portee par
# `twin_pairs.d/gametheory-03b-chambres-murs-chemins-lean.yaml`, pas par cet
# organe.
#
# Ecarts de forme DECLARES :
#
# - chaque cellule du carnet Rust finit par une instruction `let _ = ();` :
#   elle supprime l'echo `()` que le kernel evcxr emettait pour la valeur
#   unit du bloc. L'organe cumule `stream` et `execute_result`, mais il n'y a
#   plus de second texte a sauter : les motifs des deux cotes sont identiques
#   et la capture reste le texte reellement imprime ;
# - la cellule 44 mesure une duree murale (576 BFS complets, ~3 s Python) :
#   la ligne « paires verifiees : N / N en X.Xs » porte une valeur de duree
#   non reproductible. Elle est sautee par la mesure c44_seg (presence
#   seule) et son compte 331776 / 331776 est verifie separement en
#   c44_digits (chiffres seuls) ;
# - la cellule 53 lit le module Swaps/Basic.lean du depot (numeros de ligne
#   et contenu : fichier commite identique des deux cotes, donc compare en
#   texte integral) ;
# - les cellules d'exercices 57/59/61 impriment leur banniere « Exercice N :
#   a completer » : comparees comme toute autre sortie ;
# - les cellules 63/65/67 (stubs d'exercices) n'impriment rien : aucune
#   mesure (rien a comparer).
- name: "GameTheory-03b Chambres Murs Chemins Lean"
  family: GameTheory
  python: MyIA.AI.Notebooks/GameTheory/GameTheory-03b-Chambres-Murs-Chemins-Lean-Python.ipynb
  csharp: MyIA.AI.Notebooks/GameTheory/GameTheory-03b-Chambres-Murs-Chemins-Lean-CSharp.ipynb
  rust: MyIA.AI.Notebooks/GameTheory/GameTheory-03b-Chambres-Murs-Chemins-Lean-Rust.ipynb
  measures:
