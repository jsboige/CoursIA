# Conformité différentielle de Sudoku-04-SimulatedAnnealing (portage Rust nb_coder).
#
# Écrite à la livraison par nb_coder_integrate depuis les sorties COMMITÉES
# des carnets : correspondance par index de cellule (le portage garde la
# structure de cellules du jumeau Python, scellée par twin-parity), une
# mesure par cellule qui imprime côté Python, égalité stricte du texte ;
# les lignes de durée murale sont des ancres en présence seule. Le côté
# C# est comparé où sa cellule alignée imprime le même texte, sinon
# déclaré absent avec l'écart mesuré. À corriger À LA MAIN si une
# divergence est un écart d'API documenté : le fichier n'est jamais
# réécrit par l'outil une fois présent.
#
# Cellules non mesurées (motif relevé à la génération) :
#   - c13_text: côté Rust déclaré absent -- contrat a invariants declare par la spec (#28072, Tolerances, cellule 13) : invariants, pas le committe
#   - c18_text: côté Rust déclaré absent -- contrat a invariants declare par la spec (#28072, Tolerances, cellule 18) : invariants, pas le committe
#   - c23_seg1: côté Rust déclaré absent -- contrat a invariants declare par la spec (#28072, Tolerances, cellule 23) : sortie Python cellule 23 + invariants
#   - c28_seg1: côté Rust déclaré absent -- contrat a invariants declare par la spec (#28072, Tolerances, cellule 28) : invariants, pas le committe
#   - c28_seg2: côté Rust déclaré absent -- contrat a invariants declare par la spec (#28072, Tolerances, cellule 28) : invariants, pas le committe
#   - c33_seg3: côté Rust déclaré absent -- contrat a invariants declare par la spec (#28072, Tolerances, cellule 33) : sortie Python cellule 33 + invariants
#   - c48_text: côté Rust déclaré absent -- durees en presence seule (spec #28072, Tolerances, cellule 48) : egalite stricte ; durees : presence seule
