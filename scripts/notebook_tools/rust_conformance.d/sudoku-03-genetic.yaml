        rust: {cell: 21, pattern: '(Puzzle 1: OK), [\d.]+ ?m?s, \d+ gen', transform: text}
        csharp:
          absent: "« Puzzle 1 » : 0 occurrence dans les sorties du carnet C#, mesuré à la rédaction ; la comparaison porte sur Python et Rust."
    - id: c21_permutations_puzzle1
      description: "Benchmark (cellule 21), puzzle 1 : les neuf comptes de permutations valides, 24 par ligne"
