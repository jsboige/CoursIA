      sides:
        python: {cell: 19, pattern: '\A\s*(.*?)\s*\Z', transform: text}
        rust: {cell: 19, pattern: '\A\s*(.*?)\s*\Z', transform: text}
        csharp:
          absent: "La cellule C# 19 imprime « Exercice a completer » sans le nom de la fonction (0 occurrence de « Exercice swap_mutation » dans ses sorties), mesuré à la rédaction ; la comparaison porte sur Python et Rust."
    - id: c21_puzzle1_resolu
      description: "Benchmark (cellule 21), puzzle 1 : résolu par le solveur par permutations — générations et temps non comparés (source non gréée)"
      tolerance: 0
      reference: python
