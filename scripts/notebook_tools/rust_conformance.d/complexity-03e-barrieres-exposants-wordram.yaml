# Conformité différentielle de Complexity-03e-Barrieres-Exposants-WordRAM (portage Rust nb_coder).
#
# Écrite à la livraison par nb_coder_integrate depuis les sorties COMMITÉES
# des carnets : correspondance par index de cellule (le portage garde la
# structure de cellules du jumeau Python, scellée par twin-parity), une
# mesure par cellule qui imprime côté Python, égalité stricte du texte ;
# les lignes de durée murale sont des ancres en présence seule. Le côté
# C# est comparé où sa cellule alignée imprime le même texte, sinon
# déclaré absent avec l'écart mesuré. À corriger À LA MAIN si une
# divergence est un écart d'API documenté : le fichier n'est jamais
# réécrit par l'outil une fois présent.
- name: "Complexity-03e-Barrieres-Exposants-WordRAM"
  family: "InformationCalcul/Complexity"
  python: MyIA.AI.Notebooks/InformationCalcul/Complexity/Complexity-03e-Barrieres-Exposants-WordRAM-Python.ipynb
  csharp: MyIA.AI.Notebooks/InformationCalcul/Complexity/Complexity-03e-Barrieres-Exposants-WordRAM-CSharp.ipynb
  rust: MyIA.AI.Notebooks/InformationCalcul/Complexity/Complexity-03e-Barrieres-Exposants-WordRAM-Rust.ipynb
  measures:
    - id: c3_seed
      description: "Graine de la cellule 3, identique au jumeau Python. Corrigé à la main : la ligne d'imports est un écart d'API documenté (Python liste math, random, time, fractions ; le portage Rust n'utilise que std et n'importe rien), seule la graine est comparée."
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 3
          pattern: "SEED = (\\d+)"
          transform: int
        rust:
          cell: 3
          pattern: "SEED = (\\d+)"
          transform: int
        csharp:
          absent: "La cellule C# 3 diffère du texte Python (ligne 1 : « r = 2499/1250 : T(n)^1250 <= K * n^2499, n >= 2 » contre « Imports OK : math, random, time, fractions. SEED = 20261028. » côté Python) : côté déclaré absent, mesuré à la génération ; la comparaison stricte porte sur Python et Rust."
    - id: c5_text
      description: "Sortie de la cellule 5, texte identique au jumeau Python"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 5
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        rust:
          cell: 5
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        csharp:
          absent: "La cellule C# 5 diffère du texte Python (ligne 1 : « Exercice 1 à compléter : quotient des puissances. » contre « r = 1.9992 = 2499/1250 :  BigO dit  T(n)^1250 <= K * n^2499 … » côté Python) : côté déclaré absent, mesuré à la génération ; la comparaison stricte porte sur Python et Rust."
