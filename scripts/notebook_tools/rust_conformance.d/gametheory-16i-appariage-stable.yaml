# Conformite differentielle du triplet GameTheory-16i (Appariage stable et
# strategie, issue #27794).
#
# Le portage Rust (kernel evcxr, `std` seul) reprend les deux instances du
# carnet Python : A (deux appariages stables distincts) et C (le cote
# repondant n'est pas protege). Les trois cotes executent la MEME
# recherche differee ; le Rust reproduit l'ordre d'insertion des dict
# Python (un `Vec` de paires au lieu d'une `BTreeMap`), ce qui rend les
# repr d'appariage comparables.
#
# Ecarts de forme DECLARES (le contenu mesure est identique, la typo
# differe) : le jumeau C# ecrit `Paire bloquante : aucune` la ou le
# Python et le Rust ecrivent `None`, et il annonce la lecture des rangs
# par `w1 3->2` la ou le Python ecrit `{'w1': (3, 2)}`. Cette derniere
# grandeur la est donc declaree ABSENTE pour le cote C# ; les memes
# grandeurs sont mesurees sur les deux autres cotes.
#
# Les jumeaux n'ont pas la meme structure de cellules (28 cellules chez
# le Python et le Rust, 26 chez le C#) : la correspondance des cellules
# est donc ECRITE cote par cote, index par index.
- name: "GameTheory-16i Appariage stable (Gale-Shapley)"
  family: GameTheory
  python: MyIA.AI.Notebooks/GameTheory/GameTheory-16i-Appariage-Stable-Gale-Shapley-Python.ipynb
  csharp: MyIA.AI.Notebooks/GameTheory/GameTheory-16i-Appariage-Stable-Gale-Shapley-CSharp.ipynb
  rust: MyIA.AI.Notebooks/GameTheory/GameTheory-16i-Appariage-Stable-Gale-Shapley-Rust.ipynb
  measures:
    - id: appariage_a_m1
      description: "Partenaire de m1 dans l'appariage produit par Gale-Shapley (hommes proposent, instance A)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 9
          pattern: "'m1': '(w\\d)'"
          transform: text
        rust:
          cell: 9
          pattern: "'m1': '(w\\d)'"
          transform: text
        csharp:
          cell: 9
          pattern: "\\{m1: (w\\d)"
          transform: text
    - id: appariage_a_m2
      description: "Partenaire de m2 dans l'appariage produit par Gale-Shapley (hommes proposent, instance A)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 9
          pattern: "'m2': '(w\\d)'"
          transform: text
        rust:
          cell: 9
          pattern: "'m2': '(w\\d)'"
          transform: text
        csharp:
          cell: 9
          pattern: "m2: (w\\d)"
          transform: text
    - id: appariage_a_m3
      description: "Partenaire de m3 dans l'appariage produit par Gale-Shapley (hommes proposent, instance A)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 9
          pattern: "'m3': '(w\\d)'"
          transform: text
        rust:
          cell: 9
          pattern: "'m3': '(w\\d)'"
          transform: text
        csharp:
          cell: 9
          pattern: "m3: (w\\d)"
          transform: text
    - id: appariage_c_m1
      description: "Partenaire de m1 dans l'appariage honnete de l'instance C"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 19
          pattern: "'m1': '(w\\d)'"
          transform: text
        rust:
          cell: 19
          pattern: "'m1': '(w\\d)'"
          transform: text
        csharp:
