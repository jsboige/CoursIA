# Triplet Lean-40 : jumeau Python + portage Rust (issue #27966, spec Rust portage
# lot Rust std · Lean ANALYSE). Les deux carnets ont exactement la meme structure
# 30 cellules (memes indices de cellules code : 3, 6, 9, 12, 15, 18, 24, 26, 28) :
# les cotes se correspondent par index. Cote Rust = evcxr, std seul (aucune crate
# externe ; os/re/itertools de la source : itertools n'etait jamais appele,
# os -> std::path, re -> helpers ligne a ligne et frontieres de mot).
# Arithmetique entiere exacte en i128 OBLIGATOIRE (preuve B de la spec) : les
# intermediaires de tau_table montent a 75 bits (N = 130) et 84 bits (N = 180),
# au-dela d'i64 — valeurs finales < 2^43.
# Le lac hecke_lean est LU A L'EXECUTION (cellules 12 et 15) par chemins relatifs
# avec boucle de racines (chemin direct puis . .. ../.. ../../.. ../../../..),
# jamais un chemin absolu ni ancre machine : docstring, definition, theoreme,
# inventaire (7 modules FR, 110 enonces) et audit (0 sorry, 0 native_decide)
# sont mesures au commit du lac, pas figes.
# Decoupes de texte en CARACTERES (chars().take(n)), jamais en octets : le
# fichier contient des non-ASCII (ℂ ℍ ℕ ℤ → ∣ « »).
# Anomalies de prose de la source PRESERVEES, non corrigees (spec) : md13 et
# md27 disent « six modules » alors que l'inventaire en imprime sept (avec
# SzpiroPasten) ; l'enonce de l'exercice 2 (md25) dit « redonne c_3 » alors que
# la cible est c_2 = 21493760 ; commentaire de la cellule 28 « six modules ».
# Tolerance unique : egalite stricte du texte (aucun flottant calcule —
# arithmetique entiere exacte), largeurs et espaces finaux compris.
# Le cote C# n'existe pas dans le depot au moment du portage (consigne spec
# #27966 : jumeau C# aucun).
# Timeout d'execution (spec #27966) : min(15 x duree du bloc commite, 300 s) --
# duree mesuree 14.30906 s -> timeout 214 s, kernel rust a cwd = dossier du
# carnet (les cellules 12 et 15 trouvent le lac par la boucle de racines).
- name: "Lean-40 Capstone Langlands"
  family: "Lean (capstones, analyse)"
  python: MyIA.AI.Notebooks/SymbolicAI/Lean/Lean-40-Capstone-Langlands-Python.ipynb
  rust: MyIA.AI.Notebooks/SymbolicAI/Lean/Lean-40-Capstone-Langlands-Rust.ipynb
