# Conformité différentielle de Search-11d-Descente-Sous-Budget (portage Rust nb_coder).
#
# Écrite à la livraison par nb_coder_integrate depuis les sorties COMMITÉES
# des carnets : correspondance par index de cellule (le portage garde la
# structure de cellules du jumeau Python, scellée par twin-parity), une
# mesure par cellule qui imprime côté Python, égalité stricte du texte ;
# les lignes de durée murale sont des ancres en présence seule. Le côté
# C# est comparé où sa cellule alignée imprime le même texte, sinon
# déclaré absent avec l'écart mesuré. À corriger À LA MAIN si une
# divergence est un écart d'API documenté : le fichier n'est jamais
# réécrit par l'outil une fois présent.
- name: "Search-11d-Descente-Sous-Budget"
  family: "Search/Part1-Foundations"
  python: MyIA.AI.Notebooks/Search/Part1-Foundations/Search-11d-Descente-Sous-Budget.ipynb
  csharp: MyIA.AI.Notebooks/Search/Part1-Foundations/Search-11d-Descente-Sous-Budget-CSharp.ipynb
  rust: MyIA.AI.Notebooks/Search/Part1-Foundations/Search-11d-Descente-Sous-Budget-Rust.ipynb
  measures:
    - id: c5_text
      description: "Sortie de la cellule 5, texte identique au jumeau Python"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 5
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        rust:
          cell: 5
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        csharp:
          absent: "Le carnet C# n'a pas de cellule de code à l'index 5 (structure de cellules différente du jumeau Python) : côté déclaré absent, mesuré à la génération ; la comparaison stricte porte sur Python et Rust."
