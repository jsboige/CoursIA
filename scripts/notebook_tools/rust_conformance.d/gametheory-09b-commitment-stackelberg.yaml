  measures:
    - id: br_entrant_acc
      description: "Meilleure reponse de l'entrant a Acc"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 1
          pattern: 'BR_entrant\(Acc  \) = (\w+)'
          transform: text
        rust:
          cell: 1
          pattern: 'BR_entrant\(Acc  \) = (\w+)'
          transform: text
        csharp:
          cell: 1
          pattern: 'BR_E\(Acc\)=(\w+)'
          transform: text
    - id: br_entrant_fight
      description: "Meilleure reponse de l'entrant a Fight"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 1
          pattern: 'BR_entrant\(Fight\) = (\w+)'
          transform: text
