        csharp:
          absent: "La cellule C# 4 imprime le meme plateau mais dans un tableau markdown (« | . . . . . . . | ») et un joueur courant différent (« Joueur courant : O (2) » contre « Joueur actuel: MAX (X) » côté Python) : côté déclaré absent, mesuré à la génération ; la comparaison stricte porte sur Python et Rust."
    - id: c10_scores_heuristique
