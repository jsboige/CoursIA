# Conformité différentielle de App-14-ConnectFour-Adversarial (portage Rust evcxr).
#
# Écrite à la livraison par la lane myia-po-2026:CoursIA-2 à partir des
# sorties COMMITÉES des deux carnets : le portage Rust garde la structure de
# cellules du jumeau Python (49 cellules, mêmes index), donc les mesures
# désignent le même index des deux côtés. Les lignes de durée murale sont des
# ancres en présence seule (elles diffèrent entre les deux carnets par
# construction : le Rust est orders de grandeur plus rapide).
#
# Le portage reproduit le carnet Python cellule par cellule, y compris les
# composantes stochastiques : MT19937 est réimplémenté avec le contrat
# CPython (`init_by_array(&[42])`, `getrandbits(k) = next_u32() >> (32-k)`,
# `_randbelow(n)` par rejet), de sorte que MCTS et l'agent aléatoire tirent la
# même suite que `random.seed(42)` en Python.
#
# Le côté C# est comparé où sa cellule alignée imprime la même grandeur ;
# ailleurs il est déclaré absent avec l'écart MESURÉ à la génération (le
# carnet C# a 28 cellules, une structure et une implémentation différentes :
# heuristique et ordre d'exploration distincts, profondeurs et nombre de
# parties du tournoi distincts).
- name: "App-14-ConnectFour-Adversarial"
  family: "Search/Part3-Cas-pratiques"
  python: MyIA.AI.Notebooks/Search/Part3-Cas-pratiques/App-14-ConnectFour-Adversarial-Python.ipynb
  csharp: MyIA.AI.Notebooks/Search/Part3-Cas-pratiques/App-14-ConnectFour-Adversarial-CSharp.ipynb
  rust: MyIA.AI.Notebooks/Search/Part3-Cas-pratiques/App-14-ConnectFour-Adversarial-Rust.ipynb
  measures:
    - id: c3_entete
      description: "Sortie de la cellule 3, texte identique au jumeau Python"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 3
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        rust:
          cell: 3
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        csharp:
          absent: "Le carnet C# n'a pas de cellule de code à l'index 3 (28 cellules, structure différente du jumeau Python) : côté déclaré absent, mesuré à la génération ; la comparaison stricte porte sur Python et Rust."
    - id: c5_plateau_initial
      description: "Sortie de la cellule 5 (plateau initial, joueur courant, coups valides), texte identique au jumeau Python"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 5
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        rust:
          cell: 5
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        csharp:
          absent: "La cellule C# 2 est sans sortie (elle prépare le plateau sans l'afficher) : côté déclaré absent, mesuré à la génération ; la comparaison stricte porte sur Python et Rust."
    - id: c7_plateau_9_coups
