          transform: text
        csharp:
          absent: "La cellule C# 6 diffère du texte Python (ligne 1 : « Exercice a completer » contre « Exercice à compléter (ExactlyOneOfN). » côté Python) : côté déclaré absent, mesuré à la génération ; la comparaison stricte porte sur Python et Rust."
