# Conformité différentielle de Sudoku-14-BDD (portage Rust nb_coder).
#
# Écrite à la livraison par nb_coder_integrate depuis les sorties COMMITÉES
# des carnets : correspondance par index de cellule (le portage garde la
# structure de cellules du jumeau Python, scellée par twin-parity), une
# mesure par cellule qui imprime côté Python, égalité stricte du texte ;
# les lignes de durée murale sont des ancres en présence seule. Le côté
# C# est comparé où sa cellule alignée imprime le même texte, sinon
# déclaré absent avec l'écart mesuré. À corriger À LA MAIN si une
# divergence est un écart d'API documenté : le fichier n'est jamais
# réécrit par l'outil une fois présent.
- name: "Sudoku-14-BDD"
  family: "Sudoku"
  python: MyIA.AI.Notebooks/Sudoku/Sudoku-14-BDD-Python.ipynb
  csharp: MyIA.AI.Notebooks/Sudoku/Sudoku-14-BDD-CSharp.ipynb
  rust: MyIA.AI.Notebooks/Sudoku/Sudoku-14-BDD-Rust.ipynb
  measures:
    - id: c3_text
      description: "Sortie de la cellule 3, texte identique au jumeau Python"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 3
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        rust:
          cell: 3
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        csharp:
          absent: "La cellule C# 3 diffère du texte Python (ligne 1 : « Classe BDDNode definie avec succes. » contre « Classe BDDNode définie avec succès. » côté Python) : côté déclaré absent, mesuré à la génération ; la comparaison stricte porte sur Python et Rust."
