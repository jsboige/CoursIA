# Conformite DIFFERENTIELLE du triplet AgentSystems-01 (Python + Rust).
#
# Ce carnet est le jumeau RUST d'AgentSystems-01-Perception-Vers-Action-Python.
# Les deux cotes ont la MEME structure de cellules (37 cellules, 14 de code,
# memes index), donc la correspondance des grandeurs ci-dessous est directe :
# chaque `cell` est l'index, dans le `.ipynb`, de la cellule de code qui porte
# la grandeur — identique sur les deux cotes.
#
# Deux approximations du port Rust sont DECLAREES (elles ne se voient pas sur
# les sorties, parce que les deux cotes testent les memes invariants) :
#
#   1. `zlib` : le port ecrit des blocs STORES (entete RFC 1950 `0x78 0x9C`,
#      BTYPE=00, adler32 maison). Le flux est un zlib VALIDE — il se
#      decompresse par le `zlib.decompress` de CPython — mais il ne COMPRESSE
#      pas. Le carnet teste l'inversibilite, pas le taux de compression.
#   2. `lzma` : le port est un STUB COPIE DECLARE (entete LZMA-alone de treize
#      octets + charge utile recopiée). Le vrai LZMA1 (range coding) n'est pas
#      reproductible avec la seule bibliotheque standard ; il faudrait une crate
#      que le cahier des charges du portage exclut. Le stub remplit donc le
#      contrat teste par le carnet, qui est l'inversibilite, et rien de plus.
#
# Ces deux points sont aussi ecrits dans le carnet Rust lui-meme (cellule de
# lecture du resultat de la section 4) : la declaration est pedagogique, pas
# seulement documentaire.
#
# Regle de comparaison : egalite STRICTE (`tolerance: 0`, `transform: text`)
# sur des regions de texte. Les deux cotes produisent des sorties
# BYTE-IDENTIQUES ; l'organe verifie ici des grandeurs REPRESENTATIVES de
# cette identite, pas l'integralite du flux.

- name: "AgentSystems-01 Perception vers Action"
  family: "cross-series/AgentSystems"
  python: MyIA.AI.Notebooks/cross-series/AgentSystems/AgentSystems-01-Perception-Vers-Action-Python.ipynb
  rust: MyIA.AI.Notebooks/cross-series/AgentSystems/AgentSystems-01-Perception-Vers-Action-Rust.ipynb
  measures:
    - id: bandeau_imports
      description: "Bandeau de la cellule d'import (reproduit verbatim : le port n'utilise que la bibliotheque standard)"
      tolerance: 0
      reference: python
      sides:
        csharp:
          absent: "pas de jumeau C# dans le dépôt"
        python:
          cell: 1
          pattern: "(Imports OK[^\\n]*)"
          transform: text
        rust:
          cell: 1
          pattern: "(Imports OK[^\\n]*)"
          transform: text

