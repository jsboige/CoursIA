# Conformite differentielle du triplet Dynamics-04c (Cooperation payorienne
# Kripke, issue #27796).
#
# Le portage Rust (kernel evcxr, `std` seul) reprend le carnet Python a
# l'identique : meme moteur de Kripke, meme derailleur de refutation, meme
# tournoi de jouets. L'AST modal Python (dataclasses gelees) devient un enum
# recursif ; les mondes sont un `BTreeMap<usize, HashSet<Formule>>` (cles
# triees, comme `sorted(dict)` sur des entiers) ; l'exception `Contradiction`
# devient une valeur propagee par `Result`.
#
# Les trois cotes ont la MEME structure de cellules (27 cellules, 9 code aux
# memes index) : la correspondance des cellules est donc directe.
#
# Ecarts de forme DECLARES :
#
# - la colonne « borne » du tableau de la cellule 10 : le jumeau C# laisse la
#   colonne VIDE quand la borne est absente, la ou Python et Rust ecrivent
#   `None` (`str(None) == "None"`, `Option<usize>` n'implemente pas `Display`) ;
# - la liste des formules du monde 1 (cellule 10) : le jumeau C# l'imprime
#   sans guillemets (la `ToString` d'une collection C#), la ou Python et Rust
#   impriment la repr Python `['…', '…']` ;
# - les libelles des exercices : le jumeau C# ecrit `RefuteBranche` et
#   `CompteMondes` (PascalCase) la ou Python et Rust ecrivent
#   `refute_branche` et `compte_mondes` ;
# - le jumeau C# ajoute des lignes que la source n'a pas (diagonale du
#   tournoi, ligne de revalidation des premisses) et ne reprend pas la
#   formule finale de la cellule 12 : ces cotes sont declares ABSENTS avec
#   leur motif.
- name: "Dynamics-04c Cooperation Payorienne Kripke"
  family: GameTheory/Dynamics
  python: MyIA.AI.Notebooks/GameTheory/Dynamics/Dynamics-04c-Cooperation-Payorienne-Kripke-Python.ipynb
  csharp: MyIA.AI.Notebooks/GameTheory/Dynamics/Dynamics-04c-Cooperation-Payorienne-Kripke-CSharp.ipynb
  rust: MyIA.AI.Notebooks/GameTheory/Dynamics/Dynamics-04c-Cooperation-Payorienne-Kripke-Rust.ipynb
