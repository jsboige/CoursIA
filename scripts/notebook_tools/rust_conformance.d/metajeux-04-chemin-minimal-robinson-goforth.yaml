    - id: ordres_faibles
      description: "Nombre d'ordres faibles sur 4 cases (nombre de Fubini F4)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 5
          pattern: "Ordres faibles sur 4 cases : (\\d+)"
          transform: int
        rust:
          cell: 5
          pattern: "Ordres faibles sur 4 cases : (\\d+)"
          transform: int
