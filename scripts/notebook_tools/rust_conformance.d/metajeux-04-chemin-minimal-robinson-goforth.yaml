      description: "Ordres stricts (futurs chambers) : 24 permutations"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 5
          pattern: "stricts \\(futurs chambers\\)\\s+: (\\d+)"
          transform: int
        rust:
          cell: 5
          pattern: "stricts \\(futurs chambers\\)\\s+: (\\d+)"
          transform: int
