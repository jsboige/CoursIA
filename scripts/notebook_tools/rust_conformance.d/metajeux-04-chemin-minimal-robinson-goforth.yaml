# Conformite differentielle du couple Metajeux-04 (Chemin minimal Robinson-
# Goforth, issue #27935, lot Rust std de l'EPIC #26510).
#
# Le portage Rust (kernel evcxr, `std` seul, aucun :dep) reprend le carnet
# Python a l'identique : meme enumeration des ordres faibles (75 = nombre de
# Fubini F4), meme graphe des 576 chambres, memes BFS exhaustifs. Chaque
# cellule code est autonome sous evcxr (preludes recomposes par cellule) ;
# les sorties des 17 cellules code sont identiques octet par octet au jumeau
# Python.
#
# Le carnet n'a pas de jumeau C# : ce cote n'est pas declare.
#
# Ecarts de forme DECLARES : aucun -- les helpers de rendu Rust (`t4`,
# `jeu_repr`, `py_bool`, `py_list`, `py_infos`) reproduisent les repr Python
# (tuples, True/False, listes de chaines).
- name: "Metajeux-04 Chemin Minimal Robinson Goforth"
  family: Metajeux
  python: MyIA.AI.Notebooks/GameTheory/Metajeux/Metajeux-04-Chemin-Minimal-Robinson-Goforth-Python.ipynb
  rust: MyIA.AI.Notebooks/GameTheory/Metajeux/Metajeux-04-Chemin-Minimal-Robinson-Goforth-Rust.ipynb
  measures:
    # --- cellule 2 : le temoin constructeur/verificateur -------------------
    - id: temoin_entete
      description: "Bandeau du temoin : constructeur produit, verificateur separate verifie"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 2
          pattern: "GameTheory 20 : chemin minimal \\(temoin construit et v[ée]rifi[ée] ind[ée]pendamment\\)"
          transform: text
        rust:
          cell: 2
          pattern: "GameTheory 20 : chemin minimal \\(temoin construit et v[ée]rifi[ée] ind[ée]pendamment\\)"
          transform: text
