# Conformite differentielle du couple Coalitions-01 (Pouvoir
# Coalitionnel SMT, issue #27719, famille GameTheory/Coalitions).
#
# Le portage Rust (kernel evcxr, crate z3 0.24.0 chargee par `:dep` en
# cellule 1) reprend le carnet Python a l'identique : memes jeux de vote,
# memes indices de pouvoir (Shapley-Shubik, Banzhaf, Deegan-Packel) par
# les deux voies -- enumeration directe et encodage SMT --, memes tables.
# Le rendu pandas est reproduit par un formateur local (justification a
# gauche de la colonne d'index, largeurs par colonne, separateurs).
#
# Deux familles de grandeurs, et c'est voulu :
#
# - les mesures `c<N>_*` comparent le TEXTE ENTIER d'une cellule (ou d'un
#   segment) a l'egalite stricte : c'est la comparaison la plus forte,
#   possible ici parce que le portage reproduit le rendu du jumeau Python ;
# - les mesures nommees (`mwc_jeu1`, `shapley_A`, ... `assembly_minimales`)
#   suivent le registre a 19 mesures ecrit par la lane myia-ai-01:CoursIA-2
#   pour SON portage du meme carnet (branche
#   `feature/coalitions-01-registre-19-mesures`, non fusionnee : la lane a
#   libere le chemin au profit de la PR #28269). Elles nomment les grandeurs
#   dans le rapport et survivent a un changement de rendu, la ou une mesure
#   de texte entier rougirait sur une largeur de colonne. 18 des 19 sont
#   reprises a l'identique, de quantite et de motif ; la 19e,
#   `smt_minimaux_jeu1`, compare la liste des modeles « a l'ordre pres »
#   (voir les ecarts declares). Les motifs Rust du registre de CoursIA-2
#   (lignes `cle valeur`, cellules decalees de son portage) ne s'appliquent
#   pas ici : les deux cotes de CE couple ont la meme structure et le meme
#   rendu, donc les motifs sont identiques des deux cotes.
#
# Les deux cotes ont la MEME structure de cellules (40 cellules, 12 code
# aux memes index) : la correspondance des cellules est directe. Les
# cellules evcxr sont PLATES et se terminent par une instruction `;` :
# aucun execute_result « () » n'est attendu cote Rust. Pour les listes de
# coalitions, le motif est paresseux et borne par les crochets de la liste
# (`\[\[.*?\]\]`) : l'organe compile en `re.DOTALL`, un `.*` glouton
# pourrait deborder sur la ligne suivante si la cellule gagnait un crochet
# sous la liste.
#
# Le cote C# est absent du couple : pas de jumeau C# de ce carnet dans
# le depot (cote non declare, c'est la relecture humaine qui la garantit,
# d'ou le present commentaire).
#
# Ecarts de forme DECLARES (mesures par segment, jamais de sortie
# maquillee) :
#
# - cellule 1 : banniere d'environnement (« Environnement charge :
#   pandas 3.1.1, Z3 4.16.0 » cote Python ; « Environnement charge :
#   Rust + evcxr, crate z3 0.24.0 » cote Rust) -- NON MESUREE, le texte
#   est par nature specifique de chaque pile (precedent csp-10) ;
# - cellule 13 : l'ordre des modeles minimaux rendus par le solveur
#   differe ([['A', 'C'], ['A', 'B']] cote crate, [['A', 'B'],
#   ['A', 'C']] cote z3-solver Python) -- meme ensemble de coalitions ;
#   le markdown du carnet Rust cite l'ordre de la crate ; la mesure
#   `c13_table` porte sur la table d'indices avant la ligne des modeles,
#   et `smt_minimaux_jeu1` n'accorde que la liste exacte des DEUX modeles,
#   dans l'un ou l'autre ordre (la region capturee y est le libelle, la
#   contrainte vit dans le motif) ;
# - cellule 19 : le libelle « Indices Python : » devient « Indices
#   enumeration : » (renommage de la voie : les deux carnets calculent
#   par enumeration directe) ; les deux tables et les lignes de statut
#   apres le libelle sont mesures ;
# - cellule 24 : le contre-exemple SAT est un modele satisfaisant
#   DIFFERENT mais valide (4 coalitions sans singleton cote crate, 5
#   avec [2] cote Python) -- les statuts unsat/sat des deux preuves
#   d'efficacite sont identiques ; la mesure porte sur ces deux lignes
#   de statut.
#
# Les preuves d'efficacite de la cellule 24 sont portees a echelles
# entieres (Shapley multiplie par n!, Banzhaf par 2^(n-1)) : les statuts
# unsat/sat, seules grandeurs imprimees, sont inchanges.
- name: "Coalitions-01 Pouvoir Coalitionnel SMT"
  family: "GameTheory/Coalitions"
  python: MyIA.AI.Notebooks/GameTheory/Coalitions/Coalitions-01-Pouvoir-Coalitionnel-SMT-Python.ipynb
  rust: MyIA.AI.Notebooks/GameTheory/Coalitions/Coalitions-01-Pouvoir-Coalitionnel-SMT-Rust.ipynb
  measures:
