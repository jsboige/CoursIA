      description: "Le modele temoin est un modele a partitions valide"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 3
          pattern: "modele valide        : (True)"
          transform: text
        rust:
          cell: 3
          pattern: "modele valide        : (True)"
          transform: text
        csharp:
