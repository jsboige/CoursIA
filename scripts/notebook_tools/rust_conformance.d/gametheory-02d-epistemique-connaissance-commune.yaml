# Conformite differentielle du triplet GameTheory-02d (Epistemique et
# connaissance commune, issue #27795).
#
# Le portage Rust (kernel evcxr, `std` seul) reprend le carnet Python a
# l'identique : memes instances, memes balayages, memes oracles. Les
# `frozenset` Python deviennent des masques binaires `u32`, les priors des
# `Vec<f64>`, et la comparaison des posteriors du monde a six etats passe par
# des rationnels exacts (reduction par pgcd ecrite a la main).
#
# Les trois cotes ont la MEME structure de cellules (36 cellules, 12 code aux
# memes index) : la correspondance des cellules est donc directe.
#
# Ecarts de forme DECLARES :
#
# - les ensembles : le Python et le Rust impriment `[0, 1]`, le C# imprime
#   `{0,1}`. Les grandeurs porteuses d'ensembles sont donc comparees avec la
#   transformation `digits` (les chiffres seuls), qui rend les trois formes
#   comparables ;
# - la ligne de version de la cellule 3 : le port Rust imprime son propre
#   runtime, jamais la version Python ; elle n'est pas declaree ici (la
#   comparaison de la sortie complete se fait hors registre) ;
# - le jumeau C# n'affiche pas les memes libelles (exercices en francais sans
#   nom de fonction, exemple de desaccord different, tours d'elimination
#   decrits en texte) : ces cotes sont declares ABSENTS avec leur motif.
- name: "GameTheory-02d Epistemique Connaissance Commune"
  family: GameTheory
  python: MyIA.AI.Notebooks/GameTheory/GameTheory-02d-Epistemique-Connaissance-Commune-Python.ipynb
  csharp: MyIA.AI.Notebooks/GameTheory/GameTheory-02d-Epistemique-Connaissance-Commune-CSharp.ipynb
  rust: MyIA.AI.Notebooks/GameTheory/GameTheory-02d-Epistemique-Connaissance-Commune-Rust.ipynb
  measures:
    # --- cellule 3 : le modele temoin -------------------------------------
