# Triplet GameTheory-21 : jumeau Python + portage Rust (issue #27965, spec Rust portage).
# Les deux carnets ont exactement la meme structure 27 cellules (memes indices de
# cellules code : 4, 5, 8, 11, 14, 15, 18, 19, 23, 24, 25) : les cotes se
# correspondent par index. Cote Rust = evcxr, std seul (aucune crate externe ;
# census Arrow 64^3 reproduit integralement, ordre de product conserve,
# dictateurs 3, 2, 1). Tolerance unique : egalite stricte du texte (spec : aucune
# grandeur flottante calculee ; « 0.5 nul » de la cellule 11 est du texte litteral).
# Le cote C# n'existe pas dans le depot au moment du portage (aucun fichier
# GameTheory-21-*-CSharp.ipynb ; consigne spec #27965 : jumeau C# aucun).
# Timeout d'execution (spec #27965) : min(15 x duree du bloc commite, 300 s) --
# duree mesuree 12.483406 s -> timeout 187 s, kernel rust a cwd = dossier du carnet
# (les cellules 18/19 lisent SocialChoice/social_choice_core_lean/SocialChoice/ en relatif).
- name: "GameTheory-21 Capstone Choix Social"
  family: "GameTheory (SocialChoice capstone)"
  python: MyIA.AI.Notebooks/GameTheory/GameTheory-21-Capstone-Choix-Social-Python.ipynb
  rust: MyIA.AI.Notebooks/GameTheory/GameTheory-21-Capstone-Choix-Social-Rust.ipynb
  measures:
    - id: regles_definies
      description: "Ligne de chargement des trois regles de la cellule 4 (litteral)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 4
          pattern: "(Regles definies : borda, pluralite, dictateur\\.)"
          transform: text
        rust:
          cell: 4
          pattern: "(Regles definies : borda, pluralite, dictateur\\.)"
          transform: text
    - id: axiomes_borda
      description: "Ligne Borda du tableau des axiomes : Pareto OK, IIA VIOLE, non-dictature OK"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 5
          pattern: "(Borda +OK +VIOLE +OK +2/3 -> impossible)"
          transform: text
        rust:
          cell: 5
          pattern: "(Borda +OK +VIOLE +OK +2/3 -> impossible)"
          transform: text
    - id: axiomes_pluralite
      description: "Ligne Pluralite du tableau des axiomes (Pareto OK, IIA VIOLE)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 5
          pattern: "(Pluralite +OK +VIOLE +OK +2/3 -> impossible)"
          transform: text
        rust:
          cell: 5
          pattern: "(Pluralite +OK +VIOLE +OK +2/3 -> impossible)"
          transform: text
    - id: axiomes_dictateur
      description: "Ligne Dictateur(v1) du tableau (Pareto OK, IIA OK, non-dictature VIOLE)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 5
          pattern: "(Dictateur\\(v1\\) +OK +OK +VIOLE +2/3 -> impossible)"
          transform: text
        rust:
          cell: 5
          pattern: "(Dictateur\\(v1\\) +OK +OK +VIOLE +2/3 -> impossible)"
          transform: text
    - id: iia_plu_p1
      description: "Temoin IIA pluralite P1 : scores et ordre social (calcules)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 5
          pattern: "Pluralite : P1 (scores \\{[^}]*\\} -> ordre \\[[^\\]]*\\])"
          transform: text
        rust:
          cell: 5
          pattern: "Pluralite : P1 (scores \\{[^}]*\\} -> ordre \\[[^\\]]*\\])"
          transform: text
    - id: iia_plu_p2
