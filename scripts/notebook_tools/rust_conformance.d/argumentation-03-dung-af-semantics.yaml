# Conformité différentielle de Argumentation-03-Dung-AF-Semantics (portage Rust).
#
# Portage cellule-par-cellule du jumeau Python : les 15 cellules de code
# du Rust correspondent index-par-index aux 15 cellules du Python, et le
# texte concaténé des sorties `stream` de chaque cellule est strictement
# identique (tolerance 0, transform text, pattern ancre tout le texte).
# Aucun jumeau C# n'existe dans le dépôt : le côté est déclaré absent sur
# chaque mesure, mesuré à la génération (ls Argumentation-03-Dung* ne
# retourne que Python et Rust).
- name: "Argumentation-03-Dung-AF-Semantics"
  family: "SymbolicAI/ArgumentAnalysis"
  python: MyIA.AI.Notebooks/SymbolicAI/ArgumentAnalysis/Argumentation-03-Dung-AF-Semantics-Python.ipynb
  rust: MyIA.AI.Notebooks/SymbolicAI/ArgumentAnalysis/Argumentation-03-Dung-AF-Semantics-Rust.ipynb
  measures:
    - id: c2_af_repr_attackers
      description: "Cellule 2 : représentation de l'AF et attaquants de a"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 2
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        rust:
          cell: 2
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        csharp:
          absent: "pas de jumeau C# dans le dépôt"
