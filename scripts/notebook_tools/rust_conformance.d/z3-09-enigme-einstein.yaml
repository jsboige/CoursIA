# Conformité différentielle de Z3-09-Enigme-Einstein (portage Rust, lot 1 de #27129).
#
# Écrite à la livraison par la lane myia-ai-01:CoursIA-2. La correspondance
# est par index de cellule (le portage garde la structure du jumeau Python :
# 29 cellules, 11 cellules code aux memes index), une mesure par cellule code
# qui imprime, égalité stricte du texte.
#
# Deux écarts sont documentes et mesures explicitement :
#  (a) la version de Z3 annoncee — le jumeau Python lie la Wheels `z3-solver`
#      5.4.1, le carnet Rust lie la bibliotheque native Z3 5.3.3 du siege
#      (crate `z3` 0.23.0) ; la mesure porte donc sur l'intitule, pas sur le
#      numero de version ;
#  (b) la duree de resolution et la casse du booleen — la mesure `c9_unique`
#      est declaree `case_insensitive` (le Rust ecrit `true`, le Python
#      `True`), et la duree murale n'est pas comparee (ligne exclue du motif).
#
# Le jumeau C# EXISTE (#27655) : sa structure de cellules est la meme que celle
# du jumeau Python, mais son texte diverge de la facon mesuree (fins de ligne CRLF,
# nombres a la francaise, accents absents, libelle de version different). Le cote
# C# est donc declare ABSENT de la comparaison stricte : c'est un fait DECLARE
# (divergence textuelle mesuree), non une mesure manquante — les 13 mesures sont
# donc BILATERALES Python-Rust, et non la mesure d'un triplet.
- name: "Z3-09 Enigme Einstein"
  family: "SymbolicAI/SMT/Z3-API"
  python: MyIA.AI.Notebooks/SymbolicAI/SMT/Z3-API/Z3-09-Enigme-Einstein-Python.ipynb
  csharp: MyIA.AI.Notebooks/SymbolicAI/SMT/Z3-API/Z3-09-Enigme-Einstein-CSharp.ipynb
  rust: MyIA.AI.Notebooks/SymbolicAI/SMT/Z3-API/Z3-09-Enigme-Einstein-Rust.ipynb
  measures:
    - id: c1_label
      description: "Sortie de la cellule 1, intitule de la version de Z3 (le numero de version differe par construction : Wheels 5.4.1 côté Python, bibliotheque native 5.3.3 côté Rust)"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 1
          pattern: "\\A(z3 version :)"
          transform: text
        rust:
          cell: 1
          pattern: "\\A(z3 version :)"
          transform: text
        csharp:
          absent: "Le jumeau C# existe (#27655) et sa structure de cellules est la meme, mais son texte diverge de la facon mesuree : fins de ligne CRLF, nombres a la francaise (24 883 200 000, 248,8 s), accents absents (\"Solution trouvee !\", \"elimination gloutonne\") et libelle de version different (Microsoft.Z3 4.12.2). Cote declare ABSENT, la divergence etant signalee dans le body de la PR ; la comparaison stricte porte sur Python et Rust."
    - id: c3_model
      description: "Sortie de la cellule 3, texte identique au jumeau Python"
      tolerance: 0
      reference: python
      sides:
        python:
          cell: 3
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        rust:
          cell: 3
          pattern: "\\A\\s*(.*?)\\s*\\Z"
          transform: text
        csharp:
          absent: "Le jumeau C# existe (#27655) et sa structure de cellules est la meme, mais son texte diverge de la facon mesuree : fins de ligne CRLF, nombres a la francaise (24 883 200 000, 248,8 s), accents absents (\"Solution trouvee !\", \"elimination gloutonne\") et libelle de version different (Microsoft.Z3 4.12.2). Cote declare ABSENT, la divergence etant signalee dans le body de la PR ; la comparaison stricte porte sur Python et Rust."
