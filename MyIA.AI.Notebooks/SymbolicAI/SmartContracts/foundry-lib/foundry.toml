[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Remappings for external dependencies
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@account-abstraction/=lib/account-abstraction/",
    "forge-std/=lib/forge-std/src/",
]

# Use solc 0.8.28 to match py-solc-x
solc_version = "0.8.28"

# Optimizer : EntryPoint (account-abstraction 0.9) depasse la limite EIP-170
# (24576 octets) sans optimisation — indéployable sur un anvil par defaut.
optimizer = true
optimizer_runs = 1000000
