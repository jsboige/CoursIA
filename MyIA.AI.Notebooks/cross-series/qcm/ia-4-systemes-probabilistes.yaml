- id: ia4-023
  theme: ia-4-systemes-probabilistes
  type: multichoice
  source: INGPA-FIN4000 2020
  enonce: "On considère le jeu suivant :\nIl y a 7 pirates rationnels, A, B, C, D, E, F et G. Ils trouvent\
    \ 100 pièces d'or. Ils doivent décider comment les répartir.\nLes pirates ont une hiérarchie stricte\
    \ selon l'ancienneté : A est le supérieur de B, qui est le supérieur de C, qui est le supérieur de\
    \ D, qui est le supérieur de E, qui est le supérieur de F, qui est le supérieur de G.\n\nLes règles\
    \ de répartitions dans le monde des pirates sont les suivantes: \n\nle plus ancien pirate propose\
    \ une répartition. \nLes pirates, y compris celui qui a fait la proposition, votent ensuite pour savoir\
    \ s'ils acceptent cette répartition. Dans le cas d'une égalité, celui qui a fait la proposition tranche.\
    \ \nSi la répartition est acceptée, les pièces sont distribuées, et le jeu se termine. \nSinon, celui\
    \ qui a fait la proposition est jeté par-dessus bord et meurt, et le plus ancien pirate après lui\
    \ fait une nouvelle proposition, et le système commence une nouvelle fois.\nLes pirates basent leur\
    \ décision sur 3 facteurs. \n\nEn premier, les pirates veulent survivre. \nEn second, et tant qu'ils\
    \ survivent, chaque pirate veut maximiser le nombre de pièces d'or qu'il reçoit. \nEn troisième, chaque\
    \ pirate préfère jeter un autre pirate par-dessus bord, s'il y a égalité entre les autres possibilités\
    \ de jeu. Les pirates ne se font pas confiance entre eux, et ne feront ni ne tiendront jamais de promesses\
    \ entre pirates autre que le plan de répartition des pièces qui donne à chaque pirate un nombre entier\
    \ de pièces d'or.Vous êtes le pirate A. En basant votre raisonnement sur l'induction arrière, combien\
    \ de pièce d'or pouvez-vous conserver dans la proposition initiale que vous faites à votre équipage?\n\
     \nIndice: Il s'agit de représenter ce jeu comme une séquence de décisions binaires (accepté/pas accepté),\
    \ partir de la situation finale où il ne resterait que le pirate G empochant les 100 pièces d'or,\
    \ puis considérer les décisions précédentes les plus rationnelles pour chacun des pirates qui précède\
    \ selon les 3 facteurs."
  choix_unique: true
