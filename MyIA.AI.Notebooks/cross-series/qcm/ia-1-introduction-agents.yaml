- id: ia1-001
  theme: ia-1-introduction-agents
  type: matching
  source: MSMEM4EN08 2018
  enonce: Classez les jeux suivants par ordre de difficulté.
  appariements:
  - gauche: Morpion
    droite: Trivial
  - gauche: Puissance Quatre
    droite: Facile - résolu de longue date
  - gauche: Dames
    droite: Moyen - résolu récemment
  - gauche: Echecs
    droite: Difficile - peut-être bientôt résolu
  - gauche: Jeu de Go
    droite: Très difficile - probablement loin dêtre résolu
- id: ia1-002
  theme: ia-1-introduction-agents
  type: multichoice
  source: MSMEM4EN08 2018
  enonce: Parmi ces définitions de l'intelligence artificielle, laquelle correspond le plus à notre approche?
  choix_unique: true
  options:
  - texte: La tentative nouvelle et passionnante d'amener des ordinateurs à penser.
    correcte: false
  - texte: L'automatisation d'activités que nous associons à la pensée humaine.
    correcte: false
  - texte: L'étude des facultés mentales grâce à des modèles informatiques.
    correcte: false
  - texte: L'étude des moyens informatiques qui rendent possibles la perception, le raisonnement, puis
      l'action.
    correcte: false
  - texte: L'art de créer des machines capables de prendre en charge des fonctions exigeant de l'intelligence
      quand elles sont réalisées par des gens.
    correcte: false
  - texte: L'étude des moyens à mettre en oeuvre pour faire en sorte que des ordinateurs accomplissent
      des choses pour lesquelles il est préférable de recourir à des personnes pour le moment.
    correcte: false
  - texte: L'étude et la conception d'agents rationnels.
    correcte: true
