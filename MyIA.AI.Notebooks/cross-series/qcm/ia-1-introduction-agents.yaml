- id: ia1-005
  theme: ia-1-introduction-agents
  type: multichoice
  source: MSMEM4EN08 2018
  enonce: Parmi les affirmations suivantes, laquelle est correcte?
  choix_unique: true
  options:
  - texte: Un agent qui ne capte qu'une information partielle sur l'état courant ne peut pas être parfaitement
      rationnel.
    correcte: false
  - texte: Quelque soit l'environnement de tâche, on peut toujours concevoir un agent réflexe rationnel.
    correcte: false
  - texte: Il n'existe pas d'environnement de tâche dans lequel tous les agents sont rationnels.
    correcte: false
  - texte: Tout agent est rationnel dans un environnement non observable.
    correcte: false
  - texte: Un agent ne peut être rationnel dans plusieurs environnements de tâches distincts.
    correcte: false
  - texte: Un agent parfaitement rationnel peut perdre dans un jeu stochastique
    correcte: true
