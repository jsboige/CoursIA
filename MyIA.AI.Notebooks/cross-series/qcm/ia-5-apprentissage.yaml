- id: ia5-001
  theme: ia-5-apprentissage
  type: multichoice
  source: INGPA-FIN4000 2020
  enonce: "Soit l'échantillon de données suivant, composé de 3 attributs d'entrées binaires A1, A2, A3,\
    \ et d'une sortie binaire:\n\n\n\n\n\n\n\nExemple\nA1\nA2\nA3\nSortie Y\n\n\n\n\n\nX1\n\n1\n0\n0\n\
    0\n\n\nX2\n1\n0\n1\n0\n\n\nX3\n0\n1\n0\n1\n\n\n\nX4\n1\n1\n1\n1\n\n\nX5\n1\n1\n0\n1\n\n\n\n\nCombien\
    \ de feuilles (= décisions) comprend l'arbre de décision issu de l'algorithme d'apprentissage d'arbre\
    \ étudié en cours, appliqué à ces données? \n\nRappel: on choisit pour racine l'attribut qui présente\
    \ le meilleur gain informationnel, c'est à dire qui discrimine au mieux les exemples selon la sortie,\
    \ et on répète l'opération, de manière à obtenir un arbre compact."
  choix_unique: true
  options:
  - texte: '2'
    correcte: true
  - texte: '3'
    correcte: false
  - texte: '4'
    correcte: false
  - texte: '5'
    correcte: false
  - texte: '6'
    correcte: false
  - texte: '7'
    correcte: false
