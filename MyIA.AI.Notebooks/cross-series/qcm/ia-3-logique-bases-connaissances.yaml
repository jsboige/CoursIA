- id: ia3-015
  theme: ia-3-logique-bases-connaissances
  type: multichoice
  source: MSMEM4EN08 2018
  enonce: En logique propositionnelle, quels équivalents admet p⇒ q parmi les suivants?
  choix_unique: false
  options:
  - texte: ¬q⇒¬p
    correcte: true
  - texte: ¬(¬p∧¬q)
    correcte: false
  - texte: ¬q∨p
    correcte: false
  - texte: p∧¬q
    correcte: false
  - texte: q⇒p
    correcte: false
  explication: 'Correction de la relecture d''octobre 2026 : ¬(¬p∧¬q) équivaut à p∨q, et non à p⇒q (c''est-à-dire
    ¬p∨q). Contre-exemple : p vrai et q faux rendent p∨q vrai et p⇒q faux.'
