<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Le document visuel genere comme code</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
      color: #ddd;
    }

    .poster {
      width: 1600px;
      height: 900px;
      background:
        radial-gradient(circle at 80px 100px, rgba(191, 128, 55, 0.14), transparent 300px),
        radial-gradient(circle at 1520px 130px, rgba(255, 160, 34, 0.10), transparent 280px),
        linear-gradient(180deg, #151515, #111111);
      position: relative;
      padding: 24px 38px 24px 38px;
    }

    .title {
      position: absolute;
      top: 30px;
      left: 0;
      width: 1600px;
      text-align: center;
      font-size: 31px;
      line-height: 1.1;
      font-weight: 800;
      color: #fff7e8;
      letter-spacing: -0.5px;
      text-shadow: 0 0 10px rgba(174, 113, 36, 0.28);
    }

    .content {
      position: absolute;
      top: 118px;
      left: 38px;
      width: 1524px;
      height: 740px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      column-gap: 38px;
    }

    .section {
      min-width: 0;
    }

    .table-section {
      align-self: start;
      padding-top: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      color: #f4f4f4;
      font-size: 22px;
    }

    th {
      text-align: left;
      background: rgba(255, 255, 255, 0.04);
      font-weight: 700;
      color: #f2f2f2;
    }

    td {
      text-align: center;
      background: rgba(255, 255, 255, 0.025);
      font-weight: 400;
    }

    .comparison-table th:first-child,
    .comparison-table td:first-child {
      width: 32%;
    }

    .pipeline {
      align-self: center;
      padding-top: 2px;
    }

    .pipeline-title {
      font-size: 25px;
      font-weight: 800;
      margin: 0 0 18px 0;
      color: #fff;
    }

    .steps {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: 0;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 23px;
      color: #f2f2f2;
    }

    .num {
      width: 42px;
      text-align: center;
      font-size: 22px;
      color: #f2f2f2;
      font-weight: 800;
    }

    .step-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff7c2b, #f0c94a);
      color: #111;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 0 12px rgba(240, 201, 74, 0.25);
    }

    .metrics {
      align-self: center;
      padding-top: 2px;
    }

    .metrics-title {
      font-size: 25px;
      font-weight: 800;
      margin: 0 0 18px 0;
      color: #fff;
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .tile {
      height: 136px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      box-shadow: inset 0 0 20px rgba(174, 105, 34, 0.08);
    }

    .limits {
      align-self: end;
      padding-top: 2px;
    }

    .limits-title {
      font-size: 25px;
      font-weight: 800;
      margin: 0 0 18px 0;
      color: #fff;
    }

    .limit-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 7px;
      font-size: 22px;
      color: #f2f2f2;
    }

    .limit-list li {
      margin: 0;
    }

    .footer {
      position: absolute;
      left: 38px;
      bottom: 22px;
      width: 1524px;
      text-align: center;
      color: #8f8f8f;
      font-size: 16px;
      letter-spacing: 0.1px;
    }
  </style>
</head>
<body>
  <div class="poster">
    <div class="title">Le document visuel genere comme code</div>

    <div class="content">
      <section class="section table-section">
        <table class="comparison-table" aria-label="Comparaison pixels vs code">
          
          <tr>
            <th>editable</th>
            <td>Non</td>
            <td>Non</td>
          </tr>
          <tr>
            <th>verifiable</th>
            <td>Non</td>
            <td>Non</td>
          </tr>
          <tr>
            <th>diffusable</th>
            <td>Non</td>
            <td>Non</td>
          </tr>
        </table>
      </section>

      <section class="section pipeline">
        <h2 class="pipeline-title">Pipeline AesCode</h2>
        <ul class="steps">
          <li class="step">
            <span class="num">1</span>
            <span>spec</span>
          </li>
          <li class="step">
            <span class="num">2</span>
            <span>modele</span>
          </li>
          <li class="step">
            <span class="num">3</span>
            <span>rendu navigateur</span>
          </li>
        </ul>
      </section>

      <section class="section metrics">
        <h2 class="metrics-title">Chiffres cles</h2>
        <div class="tiles">
          <div class="tile">8B parametres</div>
          <div class="tile">7 canaux de recompense</div>
          <div class="tile">99.99 score global du benchmark maison</div>
        </div>
      </section>

      <section class="section limits">
        </body>
</html>
